<style>

.achievement-section{
    width:100%;
    padding:80px 20px;
    background:#ffffff;
    overflow:hidden;
}


.achievement-container{
    max-width:1200px;
    margin:auto;
}


.achievement-title{

    text-align:center;
    font-size:42px;
    font-weight:800;
    color:#111827;
    margin-bottom:15px;

    animation:achFadeDown 1s ease;

}


.achievement-subtitle{

    text-align:center;
    color:#64748b;
    font-size:18px;
    margin-bottom:50px;

}



/* Cards */

.achievement-cards{

    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(240px,1fr));

    gap:30px;

}



.achievement-card{

    background:#ffffff;

    border-radius:25px;

    padding:35px 20px;

    text-align:center;

    border:1px solid #e5e7eb;

    box-shadow:
    0 10px 30px rgba(0,0,0,.08);

    transition:.4s;

    position:relative;

    animation:
    achCard 1s ease forwards;

}




.achievement-card:hover{

    transform:translateY(-12px);

    box-shadow:
    0 25px 50px rgba(37,99,235,.20);

}




.achievement-icon{

    width:80px;
    height:80px;

    margin:auto;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:45px;

    background:#f1f5ff;

    animation:
    achBounce 3s infinite;

}




.achievement-counter{

    margin-top:20px;

    font-size:45px;

    font-weight:900;

    color:#2563eb;

}




.achievement-card h3{

    margin:10px 0;

    font-size:24px;

    color:#111827;

}



.achievement-card p{

    color:#64748b;

}



/* Animations */


@keyframes achFadeDown{

from{

opacity:0;
transform:translateY(-40px);

}

to{

opacity:1;
transform:translateY(0);

}

}



@keyframes achCard{

from{

opacity:0;
transform:translateY(60px);

}

to{

opacity:1;
transform:translateY(0);

}

}




@keyframes achBounce{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-10px);

}

}



/* Mobile */

@media(max-width:600px){

.achievement-title{

font-size:32px;

}


.achievement-counter{

font-size:38px;

}

}


</style>



<section class="achievement-section">


<div class="achievement-container">


<h1 class="achievement-title">
🏆 Our Achievements
</h1>


<p class="achievement-subtitle">

Trusted by thousands of Diploma Engineering students across India.

</p>



<div class="achievement-cards">


<div class="achievement-card">

<div class="achievement-icon">
🎓
</div>

<div class="achievement-counter" data-target="2000">
0
</div>

<h3>Students</h3>

<p>Learning through Diploma Engineers</p>

</div>



<div class="achievement-card">

<div class="achievement-icon">
📚
</div>

<div class="achievement-counter" data-target="350">
0
</div>

<h3>Study Notes</h3>

<p>Semester Wise Notes Available</p>

</div>



<div class="achievement-card">

<div class="achievement-icon">
📖
</div>

<div class="achievement-counter" data-target="50">
0
</div>

<h3>Books PDF</h3>

<p>Free Engineering Books</p>

</div>



<div class="achievement-card">

<div class="achievement-icon">
📝
</div>

<div class="achievement-counter" data-target="100">
0
</div>

<h3>PYQ Papers</h3>

<p>Previous Year Question Papers</p>

</div>



</div>

</div>

</section>



<script>


const achCounters =
document.querySelectorAll(".achievement-counter");


achCounters.forEach(counter=>{


let target =
Number(counter.getAttribute("data-target"));


let count=0;


let speed=40;


let updateCounter=()=>{


if(count < target){


count += Math.ceil(target/50);


counter.innerHTML=count+"+";


setTimeout(updateCounter,speed);


}

else{


counter.innerHTML=target+"+";


}


};


updateCounter();


});


</script>
