<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join Team | Diploma Engineers</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#101828;font-family:Inter}.wrap{width:min(700px,calc(100% - 26px));margin:auto;padding:28px 0 50px}.panel{background:#fff;border:1px solid #e4e9f0;border-radius:18px;padding:21px;box-shadow:0 7px 22px #10182808}h1{margin:0;font-size:25px}p{color:#667085;font-size:11px;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}label{display:block;font-size:10px;font-weight:800;margin:12px 0 5px}input,textarea{width:100%;border:1px solid #dce2ea;border-radius:10px;padding:11px;font:inherit;font-size:11px}textarea{min-height:90px}.full{grid-column:1/-1}button{margin-top:15px;width:100%;padding:12px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:800;font-size:11px;cursor:pointer}.status{display:none;margin-top:10px;padding:10px;border-radius:9px;background:#eff6ff;color:#1d4ed8;font-size:10px}.note{background:#fff8e6;color:#8a5a00;border:1px solid #f5dfaa;padding:10px;border-radius:9px;font-size:10px;margin-top:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="wrap"><div class="panel"><h1>Join Diploma Engineers Team</h1><p>Create your own team account and submit your public profile. A master admin must approve it before it appears on the Team page.</p><form id="form"><div class="grid"><div><label>Full Name *</label><input id="name" required></div><div><label>Role *</label><input id="role" required placeholder="Admin / Contributor"></div><div class="full"><label>About Profile *</label><textarea id="about" required></textarea></div><div><label>Email *</label><input id="email" type="email" required></div><div><label>Password *</label><input id="pass" type="password" minlength="6" required></div><div><label>Profile Image URL</label><input id="photo" type="url"></div><div><label>Cover Image URL</label><input id="cover" type="url"></div><div><label>WhatsApp Link</label><input id="whatsapp" type="url"></div><div><label>Telegram Link</label><input id="telegram" type="url"></div></div><button id="submit">Create Account & Submit Profile</button><div id="status" class="status"></div><div class="note">Password is handled by Firebase Authentication. Never share it with another admin.</div></form></div></main><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";import{getAuth,createUserWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";import{getDatabase,ref,set,get}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
const cfg={apiKey:"AIzaSyAbg1Q1ZPgF7mwaxyin7iglla01eDk_tKo",authDomain:"diplomaengineers-869df.firebaseapp.com",databaseURL:"https://diplomaengineers-869df-default-rtdb.firebaseio.com",projectId:"diplomaengineers-869df",storageBucket:"diplomaengineers-869df.appspot.com",messagingSenderId:"356779436080",appId:"1:356779436080:web:4b28da380e547420d0e5f5"},app=initializeApp(cfg),auth=getAuth(app),db=getDatabase(app),$=x=>document.getElementById(x);
form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;status.style.display="block";status.textContent="Creating account...";try{const c=await createUserWithEmailAndPassword(auth,email.value.trim(),pass.value.trim());
const existing=await get(ref(db,"admins"));
let hasMaster=false, hasAny=false;
if(existing.exists()) existing.forEach(x=>{hasAny=true;if(x.val().masterAdmin===true) hasMaster=true});
const first=!hasAny;
await set(ref(db,"admins/"+c.user.uid),{name:name.value.trim(),role:role.value.trim(),about:about.value.trim(),email:c.user.email,photo:photo.value.trim(),coverImage:cover.value.trim(),whatsapp:whatsapp.value.trim(),telegram:telegram.value.trim(),approved:first,masterAdmin:first,createdAt:Date.now()});
status.textContent=first?"Master admin account created successfully. You can now login to Admin Panel.":"Account created. Profile submitted for approval.";
form.reset()}catch(e){status.style.background="#fee2e2";status.style.color="#b42318";status.textContent=e.message}finally{submit.disabled=false}};
</script></body></html>
