table{

width:100%;
border-collapse:collapse;

}


td{

padding:12px;

}



td a{

<script>


// RSS Loader Function


function loadRSS(feed,id){


let url=
"https://api.rss2json.com/v1/api.json?rss_url="
+
encodeURIComponent(feed);



fetch(url)


.then(res=>res.json())


.then(data=>{


let box=document.getElementById(id);

box.innerHTML="";


data.items.slice(0,10).forEach(item=>{


box.innerHTML +=`

<tr>

<td>

${item.title}

</td>


<td>

<a href="${item.link}" target="_blank">

View

</a>

</td>


</tr>


`;



});


})

.catch(()=>{


document.getElementById(id).innerHTML=

"<tr><td>No Update Found</td></tr>";

});


}




// RSS LINKS


loadRSS(

"https://sarkariresult.com.cm/category/result/feed/",

"result"

);



loadRSS(

"https://sarkariresult.com.cm/category/jobs/feed/",

"jobs"

);



loadRSS(

"https://sarkariresult.com.cm/category/admit-card/feed/",

"admit"

);



loadRSS(

"https://sarkariresult.com.cm/category/admission/feed/",

"admission"

);



</script>
