<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Course | Diploma Engineers</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#f6f7fb;
    color:#202124;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

.header{
    position:sticky;
    top:0;
    z-index:100;
    background:#fff;
    border-bottom:1px solid #eee;
    padding:15px 20px;
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand img{
    width:42px;
    height:42px;
    border-radius:12px;
    object-fit:cover;
}

.brand h2{
    font-size:18px;
    font-weight:800;
}

.brand span{
    display:block;
    font-size:11px;
    color:#777;
}

.back-btn{
    border:none;
    background:#f1f3f5;
    color:#333;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

.container{
    max-width:1200px;
    margin:25px auto;
    padding:0 16px 50px;
}

.page-title{
    margin-bottom:22px;
}

.page-title h1{
    font-size:28px;
    font-weight:800;
}

.page-title p{
    color:#777;
    font-size:14px;
    margin-top:4px;
}

/* Cards */

.card{
    background:#fff;
    border-radius:18px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 8px 30px rgba(0,0,0,.05);
    border:1px solid #eee;
}

.card-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:18px;
    font-weight:700;
    margin-bottom:20px;
}

.card-title i{
    color:#ff6b00;
}

/* Form */

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:17px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    font-size:13px;
    font-weight:600;
}

input,
textarea,
select{
    width:100%;
    border:1px solid #ddd;
    border-radius:11px;
    padding:12px 13px;
    outline:none;
    background:#fff;
    font-size:14px;
    transition:.2s;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#ff6b00;
    box-shadow:0 0 0 3px rgba(255,107,0,.1);
}

textarea{
    min-height:110px;
    resize:vertical;
}

.submit-btn{
    margin-top:20px;
    border:none;
    background:#ff6b00;
    color:#fff;
    padding:13px 22px;
    border-radius:11px;
    font-weight:700;
    cursor:pointer;
}

.submit-btn:hover{
    background:#e85d00;
}

.submit-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* Courses */

.course-list{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.course-card{
    border:1px solid #eee;
    border-radius:16px;
    overflow:hidden;
    background:#fff;
}

.course-image{
    width:100%;
    height:160px;
    background:#f1f3f5;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.course-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.course-image i{
    font-size:45px;
    color:#bbb;
}

.course-content{
    padding:16px;
}

.course-content h3{
    font-size:16px;
    margin-bottom:8px;
}

.course-content p{
    color:#777;
    font-size:12px;
    line-height:1.6;
}

.badge{
    display:inline-block;
    margin-top:10px;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:700;
}

.pending{
    background:#fff4d6;
    color:#a66b00;
}

.approved{
    background:#e6f8ed;
    color:#168447;
}

.rejected{
    background:#ffe7e7;
    color:#d33;
}

.course-actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.action-btn{
    flex:1;
    border:none;
    padding:9px;
    border-radius:9px;
    cursor:pointer;
    font-size:12px;
    font-weight:600;
}

.edit-btn{
    background:#eef5ff;
    color:#1769d1;
}

.delete-btn{
    background:#fff0f0;
    color:#d33;
}

/* Empty */

.empty{
    text-align:center;
    padding:40px 15px;
    color:#888;
}

.empty i{
    font-size:40px;
    margin-bottom:12px;
}

/* Loading */

.loading{
    text-align:center;
    padding:30px;
    color:#777;
}

/* Alert */

.alert{
    display:none;
    padding:12px 15px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:13px;
    font-weight:600;
}

.alert.success{
    background:#e8f8ee;
    color:#168447;
}

.alert.error{
    background:#ffe9e9;
    color:#c62828;
}

/* Owner controls */

.owner-controls{
    display:none;
    background:#fff8f1;
    border:1px solid #ffd9b5;
}

.owner-controls p{
    color:#777;
    font-size:13px;
}

/* Mobile */

@media(max-width:850px){

    .course-list{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){

    .header{
        padding:12px 14px;
    }

    .brand h2{
        font-size:15px;
    }

    .container{
        margin-top:18px;
    }

    .page-title h1{
        font-size:23px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .course-list{
        grid-template-columns:1fr;
    }

    .card{
        padding:17px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">

        <div class="brand">
            <img
            src="https://res.cloudinary.com/ub0qgzwa/image/upload/v1787129547/locffr1xcb7zjnjkmcyp.jpg"
            alt="Diploma Engineers">

            <div>
                <h2>Diploma Engineers</h2>
                <span>Admin Course Panel</span>
            </div>
        </div>

        <button class="back-btn" onclick="goBack()">
            <i class="fa-solid fa-arrow-left"></i>
            Back
        </button>

    </div>
</header>


<main class="container">

    <div class="page-title">
        <h1>
            <i class="fa-solid fa-graduation-cap"></i>
            Course Management
        </h1>

        <p>
            Create and manage your courses
        </p>
    </div>


    <div id="alertBox" class="alert"></div>


    <!-- Owner Controls -->

    <div class="card owner-controls" id="ownerControls">

        <div class="card-title">
            <i class="fa-solid fa-user-shield"></i>
            Owner Controls
        </div>

        <p>
            You are logged in as the main administrator.
            You can manage course approval.
        </p>

    </div>


    <!-- Create Course -->

    <div class="card">

        <div class="card-title">
            <i class="fa-solid fa-plus-circle"></i>
            <span id="formTitle">Create New Course</span>
        </div>


        <form id="courseForm">

            <div class="form-grid">

                <div class="form-group">
                    <label>Course Title *</label>

                    <input
                        type="text"
                        id="title"
                        placeholder="Example: Civil Engineering 2nd Year"
                        required>
                </div>


                <div class="form-group">

                    <label>Course Category *</label>

                    <select id="category" required>

                        <option value="">Select Category</option>

                        <option value="Civil Engineering">
                            Civil Engineering
                        </option>

                        <option value="Mechanical Engineering">
                            Mechanical Engineering
                        </option>

                        <option value="Electrical Engineering">
                            Electrical Engineering
                        </option>

                        <option value="Electronics Engineering">
                            Electronics Engineering
                        </option>

                        <option value="Computer Science">
                            Computer Science
                        </option>

                        <option value="Information Technology">
                            Information Technology
                        </option>

                        <option value="Agriculture">
                            Agriculture
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Year / Semester</label>

                    <input
                        type="text"
                        id="year"
                        placeholder="Example: 2nd Year / Semester 3 & 4">

                </div>


                <div class="form-group">

                    <label>Course Price</label>

                    <input
                        type="number"
                        id="price"
                        min="0"
                        placeholder="0 for Free">

                </div>


                <div class="form-group full">

                    <label>Short Description</label>

                    <textarea
                        id="shortDescription"
                        placeholder="Short description of the course"></textarea>

                </div>


                <div class="form-group full">

                    <label>Full Course Description</label>

                    <textarea
                        id="description"
                        placeholder="Complete course details, syllabus, features etc."></textarea>

                </div>


                <div class="form-group">

                    <label>Course Image URL</label>

                    <input
                        type="url"
                        id="image"
                        placeholder="https://...">

                </div>


                <div class="form-group">

                    <label>Course Page URL</label>

                    <input
                        type="url"
                        id="courseUrl"
                        placeholder="https://...">

                </div>


                <div class="form-group">

                    <label>PDF URL</label>

                    <input
                        type="url"
                        id="pdfUrl"
                        placeholder="https://...">

                </div>


                <div class="form-group">

                    <label>Video URL</label>

                    <input
                        type="url"
                        id="videoUrl"
                        placeholder="https://...">

                </div>


                <div class="form-group full">

                    <label>Course Status</label>

                    <select id="status">

                        <option value="pending">
                            Pending Approval
                        </option>

                        <option value="draft">
                            Draft
                        </option>

                        <option value="approved">
                            Approved / Published
                        </option>

                    </select>

                </div>

            </div>


            <button
                type="submit"
                class="submit-btn"
                id="submitBtn">

                <i class="fa-solid fa-cloud-arrow-up"></i>
                Save Course

            </button>

            <button
                type="button"
                class="back-btn"
                id="cancelEdit"
                style="display:none;margin-left:8px;">

                Cancel Edit

            </button>

        </form>

    </div>


    <!-- My Courses -->

    <div class="card">

        <div class="card-title">

            <i class="fa-solid fa-layer-group"></i>

            <span>My Courses</span>

        </div>


        <div id="courseList">

            <div class="loading">

                <i class="fa-solid fa-spinner fa-spin"></i>
                Loading courses...

            </div>

        </div>

    </div>

</main>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getDatabase,
    ref,
    get,
    push,
    set,
    update,
    remove
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey: "AIzaSyAbgQ1lZPgF7mwaxyin7iglla01eDk_tKo",

    authDomain:
        "diplomaengineers-869df.firebaseapp.com",

    databaseURL:
        "https://diplomaengineers-869df-default-rtdb.firebaseio.com",

    projectId:
        "diplomaengineers-869df",

    storageBucket:
        "diplomaengineers-869df.appspot.com",

    messagingSenderId:
        "356779436080",

    appId:
        "1:356779436080:web:4b28da380e547420d0e5f5"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);


/* =====================================================
   OWNER EMAIL
===================================================== */

const OWNER_EMAIL =
    "astar22072006@gmail.com";


let currentUser = null;
let currentProfile = null;
let editingCourseId = null;


/* =====================================================
   ELEMENTS
===================================================== */

const form =
    document.getElementById("courseForm");

const courseList =
    document.getElementById("courseList");

const alertBox =
    document.getElementById("alertBox");

const ownerControls =
    document.getElementById("ownerControls");

const formTitle =
    document.getElementById("formTitle");

const submitBtn =
    document.getElementById("submitBtn");

const cancelEdit =
    document.getElementById("cancelEdit");


/* =====================================================
   ALERT
===================================================== */

function showAlert(message, type="success"){

    alertBox.textContent = message;

    alertBox.className =
        "alert " + type;

    alertBox.style.display = "block";

    setTimeout(() => {

        alertBox.style.display = "none";

    }, 4000);

}


/* =====================================================
   AUTH CHECK
===================================================== */

onAuthStateChanged(auth, async user => {

    if(!user){

        window.location.href =
            "admin-login.html";

        return;

    }


    currentUser = user;


    try{

        const profileRef =
            ref(db, "adminProfiles/" + user.uid);

        const snapshot =
            await get(profileRef);


        if(!snapshot.exists()){

            await auth.signOut();

            alert(
                "Admin profile not found."
            );

            window.location.href =
                "admin-login.html";

            return;

        }


        currentProfile =
            snapshot.val();


        const isOwner =
            user.email === OWNER_EMAIL;


        const status =
            currentProfile.status;


        if(!isOwner && status !== "approved"){

            await auth.signOut();

            alert(
                "Your account is not approved."
            );

            window.location.href =
                "admin-login.html";

            return;

        }


        if(isOwner){

            ownerControls.style.display =
                "block";

        }


        loadCourses();


    }catch(error){

        console.error(error);

        alert(
            "Unable to verify admin account."
        );

    }

});


/* =====================================================
   CREATE / UPDATE COURSE
===================================================== */

form.addEventListener("submit", async event => {

    event.preventDefault();


    if(!currentUser){

        showAlert(
            "Please login first.",
            "error"
        );

        return;

    }


    const title =
        document.getElementById("title")
        .value.trim();


    const category =
        document.getElementById("category")
        .value;


    const year =
        document.getElementById("year")
        .value.trim();


    const price =
        Number(
            document.getElementById("price").value || 0
        );


    const shortDescription =
        document.getElementById("shortDescription")
        .value.trim();


    const description =
        document.getElementById("description")
        .value.trim();


    const image =
        document.getElementById("image")
        .value.trim();


    const courseUrl =
        document.getElementById("courseUrl")
        .value.trim();


    const pdfUrl =
        document.getElementById("pdfUrl")
        .value.trim();


    const videoUrl =
        document.getElementById("videoUrl")
        .value.trim();


    const status =
        document.getElementById("status")
        .value;


    if(!title || !category){

        showAlert(
            "Course title and category are required.",
            "error"
        );

        return;

    }


    submitBtn.disabled = true;


    try{

        const now =
            Date.now();


        const courseData = {

            title,

            category,

            year,

            price,

            shortDescription,

            description,

            image,

            courseUrl,

            pdfUrl,

            videoUrl,

            status,

            authorUid:
                currentUser.uid,

            adminUid:
                currentUser.uid,

            authorName:
                currentProfile.name || "",

            authorUsername:
                currentProfile.username || "",

            authorDesignation:
                currentProfile.designation || "ADMIN",

            authorPhoto:
                currentProfile.photo || "",

            updatedAt:
                now

        };


        /* ---------------------------------------------
           UPDATE
        --------------------------------------------- */

        if(editingCourseId){

            await update(
                ref(
                    db,
                    "courses/" +
                    editingCourseId
                ),
                courseData
            );


            showAlert(
                "Course updated successfully."
            );


        }

        /* ---------------------------------------------
           CREATE
        --------------------------------------------- */

        else{

            const newCourseRef =
                push(ref(db, "courses"));


            courseData.id =
                newCourseRef.key;

            courseData.createdAt =
                now;


            await set(
                newCourseRef,
                courseData
            );


            showAlert(
                "Course created successfully."
            );

        }


        resetForm();

        loadCourses();


    }catch(error){

        console.error(error);

        showAlert(
            "Error: " + error.message,
            "error"
        );

    }


    submitBtn.disabled = false;

});


/* =====================================================
   LOAD COURSES
===================================================== */

async function loadCourses(){

    courseList.innerHTML = `

        <div class="loading">

            <i class="fa-solid fa-spinner fa-spin"></i>
            Loading courses...

        </div>

    `;


    try{

        const snapshot =
            await get(
                ref(db, "courses")
            );


        if(!snapshot.exists()){

            courseList.innerHTML = `

                <div class="empty">

                    <i class="fa-solid fa-graduation-cap"></i>

                    <h3>No Courses Found</h3>

                    <p>Create your first course above.</p>

                </div>

            `;

            return;

        }


        const data =
            snapshot.val();


        let courses = [];


        Object.entries(data).forEach(
            ([id, course]) => {

                if(
                    course.authorUid ===
                    currentUser.uid
                ){

                    courses.push({
                        id,
                        ...course
                    });

                }

            }
        );


        courses.sort(
            (a,b) =>
                (b.createdAt || 0) -
                (a.createdAt || 0)
        );


        if(courses.length === 0){

            courseList.innerHTML = `

                <div class="empty">

                    <i class="fa-solid fa-graduation-cap"></i>

                    <h3>No Courses Found</h3>

                    <p>
                        You have not created any courses yet.
                    </p>

                </div>

            `;

            return;

        }


        courseList.innerHTML = `

            <div class="course-list">

                ${courses.map(
                    courseCard
                ).join("")}

            </div>

        `;


    }catch(error){

        console.error(error);

        courseList.innerHTML = `

            <div class="empty">

                <i class="fa-solid fa-triangle-exclamation"></i>

                <p>
                    Unable to load courses.
                </p>

            </div>

        `;

    }

}


/* =====================================================
   COURSE CARD
===================================================== */

function courseCard(course){

    const status =
        course.status || "pending";


    let statusClass =
        "pending";


    if(status === "approved")
        statusClass = "approved";


    if(status === "rejected")
        statusClass = "rejected";


    const image =
        course.image;


    return `

        <div class="course-card">

            <div class="course-image">

                ${
                    image

                    ?

                    `<img
                        src="${escapeHTML(image)}"
                        alt="${escapeHTML(course.title || "Course")}"
                        onerror="this.style.display='none';
                        this.nextElementSibling.style.display='block';"
                    >`

                    :

                    ""
                }

                <i
                    class="fa-solid fa-graduation-cap"
                    style="${image ? "display:none;" : ""}">
                </i>

            </div>


            <div class="course-content">

                <h3>
                    ${escapeHTML(
                        course.title || "Untitled Course"
                    )}
                </h3>


                <p>
                    <strong>Category:</strong>
                    ${escapeHTML(
                        course.category || "-"
                    )}
                </p>


                ${
                    course.year

                    ?

                    `<p>
                        <strong>Year:</strong>
                        ${escapeHTML(course.year)}
                    </p>`

                    :

                    ""
                }


                <p>

                    <strong>Price:</strong>

                    ${
                        Number(course.price || 0) === 0

                        ?

                        "Free"

                        :

                        "₹" +
                        Number(course.price).toLocaleString("en-IN")

                    }

                </p>


                <span class="badge ${statusClass}">

                    ${
                        status === "approved"
                        ? "Approved"
                        : status === "rejected"
                        ? "Rejected"
                        : status === "draft"
                        ? "Draft"
                        : "Pending Approval"
                    }

                </span>


                <div class="course-actions">

                    <button
                        class="action-btn edit-btn"
                        onclick="editCourse('${course.id}')">

                        <i class="fa-solid fa-pen"></i>
                        Edit

                    </button>


                    <button
                        class="action-btn delete-btn"
                        onclick="deleteCourse('${course.id}')">

                        <i class="fa-solid fa-trash"></i>
                        Delete

                    </button>

                </div>

            </div>

        </div>

    `;

}


/* =====================================================
   EDIT COURSE
===================================================== */

window.editCourse = async function(id){

    try{

        const snapshot =
            await get(
                ref(
                    db,
                    "courses/" + id
                )
            );


        if(!snapshot.exists()){

            showAlert(
                "Course not found.",
                "error"
            );

            return;

        }


        const course =
            snapshot.val();


        if(
            course.authorUid !==
            currentUser.uid
        ){

            showAlert(
                "You can only edit your own courses.",
                "error"
            );

            return;

        }


        editingCourseId =
            id;


        document.getElementById("title")
            .value = course.title || "";


        document.getElementById("category")
            .value = course.category || "";


        document.getElementById("year")
            .value = course.year || "";


        document.getElementById("price")
            .value = course.price || 0;


        document.getElementById("shortDescription")
            .value =
                course.shortDescription || "";


        document.getElementById("description")
            .value =
                course.description || "";


        document.getElementById("image")
            .value = course.image || "";


        document.getElementById("courseUrl")
            .value =
                course.courseUrl || "";


        document.getElementById("pdfUrl")
            .value =
                course.pdfUrl || "";


        document.getElementById("videoUrl")
            .value =
                course.videoUrl || "";


        document.getElementById("status")
            .value =
                course.status || "pending";


        formTitle.textContent =
            "Edit Course";


        submitBtn.innerHTML =
            `<i class="fa-solid fa-save"></i>
             Update Course`;


        cancelEdit.style.display =
            "inline-block";


        window.scrollTo({
            top:0,
            behavior:"smooth"
        });


    }catch(error){

        console.error(error);

        showAlert(
            "Unable to open course.",
            "error"
        );

    }

};


/* =====================================================
   DELETE COURSE
===================================================== */

window.deleteCourse = async function(id){

    if(!confirm(
        "Are you sure you want to delete this course?"
    )){

        return;

    }


    try{

        const snapshot =
            await get(
                ref(
                    db,
                    "courses/" + id
                )
            );


        if(!snapshot.exists()){

            showAlert(
                "Course not found.",
                "error"
            );

            return;

        }


        const course =
            snapshot.val();


        if(
            course.authorUid !==
            currentUser.uid
        ){

            showAlert(
                "You can only delete your own courses.",
                "error"
            );

            return;

        }


        await remove(
            ref(
                db,
                "courses/" + id
            )
        );


        showAlert(
            "Course deleted successfully."
        );


        loadCourses();


    }catch(error){

        console.error(error);

        showAlert(
            "Unable to delete course: " +
            error.message,
            "error"
        );

    }

};


/* =====================================================
   RESET FORM
===================================================== */

function resetForm(){

    form.reset();

    editingCourseId =
        null;

    formTitle.textContent =
        "Create New Course";

    submitBtn.innerHTML =
        `<i class="fa-solid fa-cloud-arrow-up"></i>
         Save Course`;

    cancelEdit.style.display =
        "none";

}


/* =====================================================
   CANCEL EDIT
===================================================== */

cancelEdit.addEventListener(
    "click",
    resetForm
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

   BACK
===================================================== */

window.goBack = function(){

    window.location.href =
        "admin-panel.html";

};
