<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog | Diploma Engineers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
html,body{margin:0!important;padding:0!important;font-family:'Poppins',sans-serif;background:#f7f9fc;color:#172033;}
#header,#footer,main,.detail-page{margin:0!important;padding-top:0!important;}
.detail-page{min-height:60vh;padding-bottom:60px!important;}
.detail-wrap{max-width:980px;margin:0 auto;padding:30px 16px 50px;}
.back-link{display:inline-flex;align-items:center;gap:7px;color:#ff6500;text-decoration:none;font-size:12px;font-weight:700;margin-bottom:18px;}
.back-link:hover{color:#ea580c;}
.article{background:#fff;border:1px solid #e8edf4;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(15,23,42,.07);}
.cover{width:100%;max-height:480px;object-fit:cover;display:block;background:#e9eef5;}
.article-body{padding:30px 34px 40px;}
.category{display:inline-block;color:#ff6500;background:#fff1e8;padding:5px 10px;border-radius:20px;font-size:10px;font-weight:700;margin-bottom:12px;}
h1{font-size:clamp(25px,4vw,42px);line-height:1.3;font-weight:800;margin:0 0 12px;color:#111827;}
.meta{font-size:12px;color:#7b8798;border-bottom:1px solid #edf1f5;padding-bottom:18px;margin-bottom:25px;}
.content{font-size:15px;line-height:1.9;color:#374151;overflow-wrap:anywhere;}
.content img{max-width:100%;height:auto;border-radius:12px;}
.content h2,.content h3,.content h4{margin-top:28px;color:#111827;font-weight:700;}
.content a{color:#ff6500;}
.external{margin-top:30px;}
.external a{display:inline-flex;align-items:center;gap:8px;background:#ff6500;color:#fff;text-decoration:none;padding:10px 15px;border-radius:9px;font-size:12px;font-weight:700;}
.loading{padding:70px 20px;text-align:center;color:#64748b;}
@media(max-width:767px){
.detail-wrap{padding:22px 12px 35px;}
.article-body{padding:22px 18px 28px;}
.cover{max-height:300px;}
.content{font-size:14px;line-height:1.8;}
}
</style>
</head>
<body>
<div id="header"></div>

<main class="detail-page">
  <div class="detail-wrap">
    <a href="blogs.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Blogs</a>
    <div id="articleHost" class="article">
      <div class="loading"><div class="spinner-border spinner-border-sm me-2"></div>Loading article...</div>
    </div>
  </div>
</main>

<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAbg1Q1ZPgF7mwaxyin7iglla01eDk_tKo",
  authDomain: "diplomaengineers-869df.firebaseapp.com",
  databaseURL: "https://diplomaengineers-869df-default-rtdb.firebaseio.com",
  projectId: "diplomaengineers-869df",
  storageBucket: "diplomaengineers-869df.appspot.com",
  messagingSenderId: "356779436080",
  appId: "1:356779436080:web:4b28da380e547420d0e5f5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

async function loadPart(id,file){
  try {
    const res=await fetch(file);
    if(!res.ok) throw new Error(file+" failed");
    document.getElementById(id).innerHTML=await res.text();
  } catch(e) { console.error(e); }
}
loadPart("header","header.html");
loadPart("footer","footer.html");

const host=document.getElementById("articleHost");
const id=new URLSearchParams(location.search).get("id");

function val(obj,keys){
  for(const k of keys) if(obj && obj[k]!==undefined && obj[k]!==null && String(obj[k]).trim()!=="") return obj[k];
  return "";
}
function dateText(v){
  if(!v) return "";
  const d=new Date(v);
  return Number.isNaN(d.getTime())?String(v):d.toLocaleDateString("en-IN",{day:"numeric",month:"long",year:"numeric"});
}

if(!id){
  host.innerHTML='<div class="loading"><i class="fa-regular fa-circle-xmark fa-2x mb-3"></i><br>Blog not found.</div>';
} else {
  get(ref(db,"blogs/"+id)).then(snap=>{
    if(!snap.exists()){
      host.innerHTML='<div class="loading"><i class="fa-regular fa-circle-xmark fa-2x mb-3"></i><br>Blog not found.</div>';
      return;
    }
    const b=snap.val()||{};
    const title=val(b,["title"])||"Untitled Blog";
    const image=val(b,["image","thumb"]);
    const category=val(b,["category","cat"]);
    const author=val(b,["authorName","ownerName"])||"Diploma Engineers";
    const designation=val(b,["designation","ownerDesignation"]);
    const date=dateText(val(b,["date","timestamp"]));
    const content=val(b,["html"])||val(b,["text","desc"])||"";
    const external=val(b,["link"]);

    document.title=title+" | Diploma Engineers";
    host.innerHTML=`
      ${image?`<img class="cover" src="${image}" alt="${title.replaceAll('"','&quot;')}">`:""}
      <article class="article-body">
        ${category?`<span class="category">${category}</span>`:""}
        <h1>${title}</h1>
        <div class="meta">
          <i class="fa-regular fa-user me-1"></i>${author}
          ${designation?` · ${designation}`:""}
          ${date?` · ${date}`:""}
        </div>
        <div class="content">${content}</div>
        ${external?`<div class="external"><a href="${external}" target="_blank" rel="noopener noreferrer">Open Related Link <i class="fa-solid fa-arrow-up-right-from-square"></i></a></div>`:""}
      </article>`;
  }).catch(err=>{
    console.error(err);
    host.innerHTML='<div class="loading"><div class="alert alert-danger">Unable to load this article.</div></div>';
  });
}
</script>
</body>
</html>
