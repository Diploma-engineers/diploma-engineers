<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login | Diploma Engineers</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: "Poppins", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255, 107, 0, 0.15), transparent 35%),
        radial-gradient(circle at bottom right, rgba(0, 102, 255, 0.14), transparent 35%),
        #f7f9fc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px 15px;
      color: #18212f;
    }

    .login-wrapper {
      width: 100%;
      max-width: 440px;
    }

    /* Logo */
    .brand {
      text-align: center;
      margin-bottom: 22px;
    }

    .brand-logo {
      width: 78px;
      height: 78px;
      border-radius: 20px;
      object-fit: cover;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      background: white;
      padding: 5px;
    }

    .brand h1 {
      margin-top: 12px;
      font-size: 25px;
      font-weight: 800;
      color: #172033;
    }

    .brand p {
      margin-top: 4px;
      font-size: 13px;
      color: #737b89;
    }

    /* Card */
    .login-card {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 25px;
      padding: 30px;
      box-shadow: 0 18px 55px rgba(20, 30, 50, 0.10);
    }

    .login-title {
      text-align: center;
      margin-bottom: 25px;
    }

    .login-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 12px;
      border-radius: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff6b00, #ff944d);
      color: white;
      font-size: 23px;
      box-shadow: 0 10px 25px rgba(255, 107, 0, 0.25);
    }

    .login-title h2 {
      font-size: 22px;
      font-weight: 700;
      color: #172033;
    }

    .login-title p {
      font-size: 12px;
      color: #858d9b;
      margin-top: 5px;
    }

    /* Form */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 600;
      color: #343d4d;
    }

    .input-box {
      position: relative;
    }

    .input-box > i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #9aa2af;
      font-size: 15px;
      pointer-events: none;
    }

    .input-box input {
      width: 100%;
      height: 51px;
      border: 1.5px solid #e1e5eb;
      border-radius: 13px;
      outline: none;
      padding: 0 45px 0 43px;
      font-family: "Poppins", sans-serif;
      font-size: 13px;
      color: #202938;
      background: #fbfcfe;
      transition: 0.25s;
    }

    .input-box input:focus {
      border-color: #ff6b00;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(255, 107, 0, 0.09);
    }

    .password-toggle {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #8b94a3;
      cursor: pointer;
      font-size: 15px;
      padding: 5px;
    }

    .password-toggle:hover {
      color: #ff6b00;
    }

    /* Options */
    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 2px 1px 20px;
      gap: 10px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      color: #6f7785;
      cursor: pointer;
    }

    .remember input {
      accent-color: #ff6b00;
      cursor: pointer;
    }

    .forgot-btn {
      border: none;
      background: none;
      color: #ff6b00;
      font-family: "Poppins", sans-serif;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .forgot-btn:hover {
      text-decoration: underline;
    }

    /* Login Button */
    .login-btn {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, #ff6b00, #ff8a32);
      color: white;
      font-family: "Poppins", sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 107, 0, 0.22);
      transition: 0.25s;
    }

    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 13px 30px rgba(255, 107, 0, 0.28);
    }

    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .login-btn i {
      margin-right: 7px;
    }

    /* Message */
    .message {
      display: none;
      margin-bottom: 18px;
      padding: 13px 14px;
      border-radius: 12px;
      font-size: 12px;
      line-height: 1.5;
      align-items: flex-start;
      gap: 10px;
    }

    .message.show {
      display: flex;
    }

    .message i {
      margin-top: 2px;
      font-size: 14px;
    }

    .message.error {
      background: #fff1f1;
      color: #c62828;
      border: 1px solid #ffd2d2;
    }

    .message.warning {
      background: #fff8e8;
      color: #9a6700;
      border: 1px solid #ffe5a8;
    }

    .message.success {
      background: #ecfff5;
      color: #087443;
      border: 1px solid #c7f3dc;
    }

    .message.info {
      background: #eef6ff;
      color: #1769aa;
      border: 1px solid #cce5ff;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 23px 0;
      color: #a2a9b4;
      font-size: 11px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #e6e9ee;
    }

    /* Register */
    .register-box {
      text-align: center;
      font-size: 12px;
      color: #747c89;
    }

    .register-box a {
      color: #ff6b00;
      font-weight: 700;
      text-decoration: none;
    }

    .register-box a:hover {
      text-decoration: underline;
    }

    /* Security */
    .security-note {
      margin-top: 20px;
      padding: 12px;
      border-radius: 12px;
      background: #f6f8fb;
      color: #818997;
      text-align: center;
      font-size: 10px;
      line-height: 1.5;
    }

    .security-note i {
      color: #35a66f;
      margin-right: 4px;
    }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 10px;
      color: #9aa1ad;
    }

    @media (max-width: 480px) {
      body {
        padding: 18px 12px;
      }

      .login-card {
        padding: 23px 18px;
        border-radius: 21px;
      }

      .brand-logo {
        width: 70px;
        height: 70px;
      }

      .brand h1 {
        font-size: 22px;
      }

      .login-title h2 {
        font-size: 20px;
      }

      .options {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <div class="login-wrapper">

    <!-- BRAND -->
    <div class="brand">
      <img
        class="brand-logo"
        src="https://anubhavfinance.wordpress.com/wp-content/uploads/2025/11/whatsapp-image-2025-11-26-at-01.09.43_629f0cdb.jpg"
        alt="Diploma Engineers">

      <h1>Diploma Engineers</h1>
      <p>Admin & Team Management</p>
    </div>

    <!-- LOGIN CARD -->
    <div class="login-card">

      <div class="login-title">
        <div class="login-icon">
          <i class="fa-solid fa-user-shield"></i>
        </div>

        <h2>Admin Login</h2>
        <p>Login to access your admin panel</p>
      </div>

      <!-- MESSAGE -->
      <div id="messageBox" class="message">
        <i id="messageIcon" class="fa-solid fa-circle-info"></i>
        <span id="messageText"></span>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm">

        <!-- EMAIL -->
        <div class="form-group">
          <label for="email">Email Address</label>

          <div class="input-box">
            <i class="fa-solid fa-envelope"></i>

            <input
              type="email"
              id="email"
              placeholder="Enter your registered email"
              autocomplete="email"
              required>
          </div>
        </div>

        <!-- PASSWORD -->
        <div class="form-group">
          <label for="password">Password</label>

          <div class="input-box">
            <i class="fa-solid fa-lock"></i>

            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required>

            <button
              type="button"
              class="password-toggle"
              id="togglePassword"
              aria-label="Show password">

              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- OPTIONS -->
        <div class="options">

          <label class="remember">
            <input type="checkbox" id="rememberMe">
            Remember me
          </label>

          <button
            type="button"
            class="forgot-btn"
            id="forgotPassword">
            Forgot Password?
          </button>

        </div>

        <!-- LOGIN -->
        <button
          type="submit"
          class="login-btn"
          id="loginBtn">

          <i class="fa-solid fa-right-to-bracket"></i>
          Login to Admin Panel

        </button>

      </form>

      <div class="divider">OR</div>

      <!-- REGISTER -->
      <div class="register-box">
        Don't have an admin account?
        <a href="admin-registration.html">Register Here</a>
      </div>

      <!-- SECURITY -->
      <div class="security-note">
        <i class="fa-solid fa-shield-halved"></i>
        Your password is securely handled by Firebase Authentication.
      </div>

    </div>

    <div class="footer">
      © 2026 Diploma Engineers • Admin Portal
    </div>

  </div>


  <!-- FIREBASE -->
  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      signOut,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence
    }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getDatabase,
      ref,
      get
    }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


    /* =========================================
       FIREBASE CONFIG
       Same existing Diploma Engineers project
    ========================================= */

    const firebaseConfig = {

      apiKey: "AIzaSyAbg1Q1ZPgF7mwaxyin7iglla01eDk_tKo",

      authDomain:
        "diplomaengineers-869df.firebaseapp.com",

      databaseURL:
        "https://diplomaengineers-869df-default-rtdb.firebaseio.com",

      projectId:
        "diplomaengineers-869df",

      storageBucket:
        "diplomaengineers-869df.appspot.com",

      messagingSenderId:
        "356779436080",

      appId:
        "1:356779436080:web:4b28da380e547420d0e5f5"
    };


    /* =========================================
       INITIALIZE FIREBASE
    ========================================= */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getDatabase(app);


    /* =========================================
       ELEMENTS
    ========================================= */

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginBtn =
      document.getElementById("loginBtn");

    const togglePassword =
      document.getElementById("togglePassword");

    const rememberMe =
      document.getElementById("rememberMe");

    const forgotPassword =
      document.getElementById("forgotPassword");

    const messageBox =
      document.getElementById("messageBox");

    const messageText =
      document.getElementById("messageText");

    const messageIcon =
      document.getElementById("messageIcon");


    /* =========================================
       MESSAGE FUNCTION
    ========================================= */

    function showMessage(
      message,
      type = "error"
    ) {

      messageBox.className =
        "message show " + type;

      messageText.textContent =
        message;

      if (type === "error") {

        messageIcon.className =
          "fa-solid fa-circle-exclamation";

      }

      else if (type === "warning") {

        messageIcon.className =
          "fa-solid fa-triangle-exclamation";

      }

      else if (type === "success") {

        messageIcon.className =
          "fa-solid fa-circle-check";

      }

      else {

        messageIcon.className =
          "fa-solid fa-circle-info";

      }
    }


    function hideMessage() {

      messageBox.className =
        "message";

      messageText.textContent = "";
    }


    /* =========================================
       SHOW / HIDE PASSWORD
    ========================================= */

    togglePassword.addEventListener(
      "click",
      () => {

        const isPassword =
          passwordInput.type === "password";

        passwordInput.type =
          isPassword ? "text" : "password";

        togglePassword.innerHTML =
          isPassword
            ? '<i class="fa-solid fa-eye-slash"></i>'
            : '<i class="fa-solid fa-eye"></i>';
      }
    );


    /* =========================================
       FIREBASE ERROR MESSAGE
    ========================================= */

    function getLoginError(error) {

      switch (error.code) {

        case "auth/invalid-email":
          return "Please enter a valid email address.";

        case "auth/user-not-found":
          return "No account found with this email.";

        case "auth/wrong-password":
          return "Incorrect password. Please try again.";

        case "auth/invalid-credential":
          return "Incorrect email or password.";

        case "auth/user-disabled":
          return "This account has been disabled.";

        case "auth/too-many-requests":
          return "Too many login attempts. Please try again later.";

        case "auth/network-request-failed":
          return "Network error. Please check your internet connection.";

        default:
          return "Login failed. Please try again.";
      }
    }


    /* =========================================
       LOGIN
    ========================================= */

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        hideMessage();

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;

        if (!email || !password) {

          showMessage(
            "Please enter email and password.",
            "warning"
          );

          return;
        }


        /* Button Loading */

        loginBtn.disabled = true;

        loginBtn.innerHTML =
          '<i class="fa-solid fa-spinner fa-spin"></i> Checking...';


        try {

          /* =====================================
             SET LOGIN PERSISTENCE
          ===================================== */

          await setPersistence(
            auth,
            rememberMe.checked
              ? browserLocalPersistence
              : browserSessionPersistence
          );


          /* =====================================
             FIREBASE AUTH LOGIN
          ===================================== */

          const userCredential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );

          const user =
            userCredential.user;


          /* =====================================
             GET ADMIN PROFILE
             adminProfiles/{uid}
          ===================================== */

          const profileRef =
            ref(
              db,
              "adminProfiles/" + user.uid
            );

          const profileSnapshot =
            await get(profileRef);


          /* =====================================
             PROFILE NOT FOUND
          ===================================== */

          if (!profileSnapshot.exists()) {

            await signOut(auth);

            showMessage(
              "Admin profile not found. Please complete registration again.",
              "error"
            );

            resetLoginButton();

            return;
          }


          const profile =
            profileSnapshot.val();


          /* =====================================
             CHECK APPROVAL STATUS
          ===================================== */

          const status =
            String(profile.status || "")
              .toLowerCase();


          /* =====================================
             PENDING
          ===================================== */

          if (status === "pending") {

            await signOut(auth);

            showMessage(
              "Your registration is still pending. Please wait for admin approval.",
              "warning"
            );

            resetLoginButton();

            return;
          }


          /* =====================================
             REJECTED
          ===================================== */

          if (status === "rejected") {

            await signOut(auth);

            showMessage(
              "Your registration has been rejected. Please contact the administrator.",
              "error"
            );

            resetLoginButton();

            return;
          }


          /* =====================================
             APPROVED
          ===================================== */

          if (status === "approved") {

            showMessage(
              "Login successful! Opening Admin Panel...",
              "success"
            );

            loginBtn.innerHTML =
              '<i class="fa-solid fa-circle-check"></i> Approved';

            setTimeout(() => {

              window.location.href =
                "admin-panel.html";

            }, 700);

            return;
          }


          /* =====================================
             UNKNOWN STATUS
          ===================================== */

          await signOut(auth);

          showMessage(
            "Your account has an invalid approval status. Please contact the administrator.",
            "error"
          );

          resetLoginButton();

        }

        catch (error) {

          console.error(
            "Login Error:",
            error
          );

          showMessage(
            getLoginError(error),
            "error"
          );

          resetLoginButton();
        }

      }
    );


    /* =========================================
       RESET LOGIN BUTTON
    ========================================= */

    function resetLoginButton() {

      loginBtn.disabled = false;

      loginBtn.innerHTML =
        '<i class="fa-solid fa-right-to-bracket"></i> Login to Admin Panel';
    }


    /* =========================================
       FORGOT PASSWORD
    ========================================= */

    forgotPassword.addEventListener(
      "click",
      async () => {

        hideMessage();

        const email =
          emailInput.value.trim();

        if (!email) {

          showMessage(
            "Please enter your registered email first.",
            "warning"
          );

          emailInput.focus();

          return;
        }


        try {

          forgotPassword.disabled = true;

          await sendPasswordResetEmail(
            auth,
            email
          );

          showMessage(
            "Password reset email has been sent. Please check your inbox.",
            "success"
          );

        }

        catch (error) {

          console.error(
            "Password Reset Error:",
            error
          );

          showMessage(
            getLoginError(error),
            "error"
          );

        }

        finally {

          forgotPassword.disabled = false;
        }

      }
    );

  </script>

</body>
</html>
