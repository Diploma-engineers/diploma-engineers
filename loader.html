<span></span>

</div>

</div>


<style>

#loader{

position:fixed;
top:0;
left:0;

width:100%;
height:100vh;

background:
linear-gradient(135deg,#0d1b2a,#1b263b);

display:flex;
align-items:center;
justify-content:center;

z-index:99999;

transition:.6s;

}



.loader-box{

width:330px;

padding:40px 30px;

text-align:center;

background:rgba(255,255,255,.12);

backdrop-filter:blur(15px);

border-radius:30px;

border:1px solid rgba(255,255,255,.2);

}



.loader-box img{

width:120px;
height:120px;

border-radius:50%;

object-fit:cover;

border:4px solid #ff9800;

animation:pulse 1.5s infinite;

}



.loader-box h2{

color:white;

font-size:30px;

font-weight:800;

margin-top:20px;

}


.loader-box p{

color:#ddd;

}



.dots{

display:flex;

justify-content:center;

gap:8px;

margin:20px;

}


.dots span{

width:12px;
height:12px;

background:#ff9800;

border-radius:50%;

animation:dot 1.2s infinite;

}


.dots span:nth-child(2){

animation-delay:.2s;

}

.dots span:nth-child(3){

animation-delay:.4s;

}


@keyframes dot{

50%{

transform:translateY(-10px);

}

}



.progress{

height:8px;

background:#ffffff33;

border-radius:20px;

overflow:hidden;

}


.progress-bar{

height:100%;

width:0;

background:#ff9800;

animation:load 2s forwards;

}


@keyframes load{

to{

width:100%;

}

}



@keyframes pulse{

50%{

transform:scale(1.08);

}

}

</style>


<div id="loaderBox"></div>

<script>

fetch("loader.html")

.then(res=>res.text())

.then(data=>{

document.getElementById("loaderBox").innerHTML=data;


setTimeout(()=>{

document.getElementById("loader").style.opacity="0";


setTimeout(()=>{

document.getElementById("loader").remove();

},600);


},2000);


});

</script>
