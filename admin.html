<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diploma Engineers Admin</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f9;
}

.container{
max-width:900px;
margin:20px auto;
padding:15px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
margin-bottom:20px;
}

input,textarea,select{

width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;

}

textarea{
height:100px;
}

button{

padding:10px 18px;
background:#0d6efd;
color:white;
border:none;
border-radius:8px;
cursor:pointer;

}

.logout{

background:#dc3545;

}

.news-item{

border-top:1px solid #ddd;
padding:15px 0;

}

.news-item img{

width:120px;
border-radius:8px;

}

.small{

font-size:13px;
color:#777;

}

#adminPanel{

display:none;

}

</style>

</head>


<body>


<div class="container">


<div class="card" id="loginBox">

<h2>Admin Login</h2>


<input id="email" type="email" placeholder="Email">


<input id="password" type="password" placeholder="Password">


<button id="loginBtn">
Login
</button>


</div>



<div id="adminPanel">


<div class="card">

<h2>Publish News</h2>


<input id="title" placeholder="News Title">


<textarea id="desc" placeholder="Description"></textarea>


<input id="thumb" placeholder="Image URL">


<input id="pdf" placeholder="PDF Link">


<select id="cat">

<option>Notice</option>

<option>Result</option>

<option>Admission</option>

<option>Scholarship</option>

<option>Job</option>

</select>


<button id="publishBtn">
Publish News
</button>


<button class="logout" id="logoutBtn">
Logout
</button>


</div>



<div class="card">

<h3>Published News</h3>


<div id="list">
Loading...
</div>


</div>


</div>


</div>



<script type="module">


import {

auth,
db,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut,
ref,
push,
set,
onValue,
remove

}

from "./firebase.js";





const loginBox=document.getElementById("loginBox");

const adminPanel=document.getElementById("adminPanel");

const list=document.getElementById("list");




// LOGIN


loginBtn.onclick=async()=>{


try{


await signInWithEmailAndPassword(

auth,

email.value,

password.value

);


}

catch(error){

alert(error.message);

}


};





// CHECK LOGIN


onAuthStateChanged(auth,(user)=>{


if(user){


loginBox.style.display="none";

adminPanel.style.display="block";

loadNews();


}

else{


loginBox.style.display="block";

adminPanel.style.display="none";


}



});






// ADD NEWS


publishBtn.onclick=()=>{


let newsRef=push(ref(db,"news"));


set(newsRef,{


title:title.value,

desc:desc.value,

thumb:thumb.value,

pdf:pdf.value,

cat:cat.value,

date:new Date().toLocaleString()


})


.then(()=>{


alert("News Published");


title.value="";

desc.value="";

thumb.value="";

pdf.value="";


})


.catch(error=>{


alert(error.message);


});


};





// LOAD NEWS


function loadNews(){


const newsRef=ref(db,"news");



onValue(newsRef,(snapshot)=>{


list.innerHTML="";


if(!snapshot.exists()){


list.innerHTML="No News Available";

return;


}



snapshot.forEach((child)=>{


let n=child.val();


list.innerHTML+=`

<div class="news-item">


<h3>${n.title}</h3>


<div class="small">

${n.cat} | ${n.date}

</div>



${n.thumb ?

`<img src="${n.thumb}">`

:""}



<p>${n.desc}</p>



${n.pdf ?

`<a href="${n.pdf}" target="_blank">
Open PDF
</a>`

:""}


<br><br>


<button onclick="deleteNews('${child.key}')">

Delete

</button>


</div>

`;



});



});


}





// DELETE


window.deleteNews=(id)=>{


if(confirm("Delete News?")){


remove(ref(db,"news/"+id));


}


};





// LOGOUT


logoutBtn.onclick=()=>{


signOut(auth);


};



</script>


</body>

</html>
