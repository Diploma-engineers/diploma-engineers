["Temporary hardness only","Permanent hardness only","Both completely","Neither"],opts_hi:["केवल अस्थायी कठोरता","केवल स्थायी कठोरता","दोनों पूर्णतः","कोई नहीं"],ans:0},{q_en:"Soap gives poor lather in hard water because:",q_hi:"कठोर जल में साबुन खराब झाग देता है क्योंकि:",opts_en:["Ca²⁺/Mg²⁺ precipitate soap as scum","Soap dissolves too fast","Water is acidic","Soap evaporates"],opts_hi:["Ca²⁺/Mg²⁺ साबुन को मैल के रूप में अवक्षेपित करते हैं","साबुन शीघ्र घुलता है","जल अम्लीय है","साबुन वाष्पित होता है"],ans:0}]},{id:"u2t2",unit:2,title_en:"Boiler Troubles, EDTA Method, TDS & Alkalinity",title_hi:"बॉयलर समस्याएँ, EDTA विधि, TDS व क्षारकता",body_en:`
      <p>Using hard water in <strong>boilers</strong> causes serious operational problems. Measuring hardness precisely (EDTA method), knowing total dissolved solids (TDS) and alkalinity helps engineers prevent them.</p>
      <h3>Problems caused by hard water in boilers</h3>
      <ul>
        <li><strong>Scale and sludge:</strong> CaCO₃/CaSO₄ deposit as hard <strong>scale</strong> on hot tubes (poor heat transfer, fuel waste, tube overheating and bursting); loose <strong>sludge</strong> settles in cooler parts and chokes pipes.</li>
        <li><strong>Priming and foaming:</strong> dissolved salts lower surface tension → <strong>foam</strong> forms; violent boiling carries water droplets with steam (<strong>priming</strong>) → wet steam damages turbines and superheaters.</li>
        <li><strong>Corrosion:</strong> dissolved O₂, CO₂ and MgCl₂ attack boiler metal: MgCl₂ + H₂O → Mg(OH)₂ + 2HCl (acid corrodes iron).</li>
        <li><strong>Caustic embrittlement:</strong> concentrated NaOH in stressed parts (rivets, joints) cracks the steel.</li>
      </ul>
      <h3>EDTA method (complexometric titration)</h3>
      <p><strong>EDTA</strong> (ethylenediamine tetraacetic acid) forms stable 1:1 complexes with Ca²⁺ and Mg²⁺. Indicator: <strong>Eriochrome Black-T (EBT)</strong>.</p>
      <ul>
        <li>At pH ~10 (NH₄Cl/NH₄OH buffer), EBT + Ca²⁺/Mg²⁺ gives a <strong>wine-red</strong> complex.</li>
        <li>EDTA is added from the burette; it first frees the indicator, then complexes all Ca²⁺/Mg²⁺. At the end point the solution turns <strong>blue</strong> (free EBT).</li>
        <li>1 mol EDTA ≡ 1 mol Ca²⁺/Mg²⁺ ≡ 100 g CaCO₃. Hardness (ppm) = (V_EDTA × M_EDTA × 10⁵) / V_sample.</li>
      </ul>
      <h3>TDS and alkalinity</h3>
      <ul>
        <li><strong>TDS (Total Dissolved Solids):</strong> total mg/L of dissolved minerals (Ca²⁺, Mg²⁺, Na⁺, HCO₃⁻, Cl⁻, SO₄²⁻…). Measured by <strong>evaporation</strong> or estimated from <strong>electrical conductivity</strong>. High TDS → foaming/priming in boilers; BIS limit for drinking water is <strong>500 mg/L</strong> (max 2000).</li>
        <li><strong>Alkalinity:</strong> capacity of water to neutralise acids, due to <strong>OH⁻, CO₃²⁻, HCO₃⁻</strong>. Estimated by titration with standard HCl using <strong>phenolphthalein</strong> (P, to pH 8.3) and <strong>methyl orange</strong> (M, to pH 4.5) indicators.</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ Key Points for Exams</div>
      <ul>
        <li>Scale = hard adherent deposit (CaSO₄, CaCO₃); sludge = loose precipitate (MgCO₃, MgCl₂ salts) — removed by <strong>blow-down</strong>.</li>
        <li>Priming = <strong>water carried with steam</strong>; foaming = <strong>persistent bubbles</strong> — both from dissolved solids.</li>
        <li>Dissolved <strong>O₂</strong> is removed by <strong>sodium sulphite</strong> or mechanical deaeration; CO₂ by aeration.</li>
        <li>Phenolphthalein alkalinity (P) measures OH⁻ + ½CO₃²⁻; methyl orange (M) measures total alkalinity.</li>
      </ul></div>
    `,body_hi:`
      <p><strong>बॉयलरों</strong> में कठोर जल के प्रयोग से गंभीर प्रचालन समस्याएँ उत्पन्न होती हैं। कठोरता का यथार्थ मापन (EDTA विधि), कुल घुलित ठोस (TDS) व क्षारकता का ज्ञान इंजीनियरों को इन्हें रोकने में सहायता करता है।</p>
      <h3>बॉयलर में कठोर जल से समस्याएँ</h3>
      <ul>
        <li><strong>स्केल व स्लज:</strong> गर्म नलियों पर CaCO₃/CaSO₄ कठोर <strong>स्केल</strong> के रूप में जमता है (खराब ऊष्मा स्थानांतरण, ईंधन अपव्यय, नली अतितापन व फटना); ढीला <strong>स्लज</strong> ठंडे भागों में बैठकर पाइप बंद करता है।</li>
        <li><strong>प्राइमिंग व फोमिंग:</strong> घुलित लवण पृष्ठ तनाव घटाते हैं → <strong>झाग</strong> बनता है; प्रचंड क्वथन भाप के साथ जल बूंदें ले जाता है (<strong>प्राइमिंग</strong>) → गीली भाप टरबाइन व अतितापकों को हानि पहुँचाती है।</li>
        <li><strong>संक्षारण:</strong> घुलित O₂, CO₂ व MgCl₂ बॉयलर धातु पर आक्रमण करते हैं: MgCl₂ + H₂O → Mg(OH)₂ + 2HCl (अम्ल लोहे को संक्षारित करता है)।</li>
        <li><strong>कास्टिक भंगुरता:</strong> प्रतिबलित भागों (रिवेट, जोड़) में सांद्र NaOH इस्पात में दरार डालता है।</li>
      </ul>
      <h3>EDTA विधि (संकुलमितीय अनुमापन)</h3>
      <p><strong>EDTA</strong> (एथिलीनडाइऐमीन टेट्राऐसीटिक अम्ल) Ca²⁺ व Mg²⁺ के साथ स्थायी 1:1 संकुल बनाता है। सूचक: <strong>एरियोक्रोम ब्लैक-T (EBT)</strong>।</p>
      <ul>
        <li>pH ~10 (NH₄Cl/NH₄OH बफर) पर EBT + Ca²⁺/Mg²⁺ <strong>शराबी-लाल</strong> संकुल देता है।</li>
        <li>ब्यूरेट से EDTA मिलाया जाता है; यह पहले सूचक को मुक्त करता है, फिर समस्त Ca²⁺/Mg²⁺ से संकुल बनाता है। अंत बिंदु पर विलयन <strong>नीला</strong> (मुक्त EBT) हो जाता है।</li>
        <li>1 mol EDTA ≡ 1 mol Ca²⁺/Mg²⁺ ≡ 100 g CaCO₃। कठोरता (ppm) = (V_EDTA × M_EDTA × 10⁵) / V_नमूना।</li>
      </ul>
      <h3>TDS व क्षारकता</h3>
      <ul>
        <li><strong>TDS (कुल घुलित ठोस):</strong> घुलित खनिजों (Ca²⁺, Mg²⁺, Na⁺, HCO₃⁻, Cl⁻, SO₄²⁻…) का कुल mg/L। <strong>वाष्पन</strong> द्वारा मापा या <strong>विद्युत चालकता</strong> से अनुमानित। उच्च TDS → बॉयलर में फोमिंग/प्राइमिंग; पेयजल हेतु BIS सीमा <strong>500 mg/L</strong> (अधिकतम 2000)।</li>
        <li><strong>क्षारकता:</strong> अम्लों को उदासीन करने की जल की क्षमता, <strong>OH⁻, CO₃²⁻, HCO₃⁻</strong> के कारण। <strong>फीनॉल्फ्थेलिन</strong> (P, pH 8.3 तक) व <strong>मेथिल ऑरेंज</strong> (M, pH 4.5 तक) सूचकों सहित मानक HCl से अनुमापन द्वारा आकलित।</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ परीक्षा हेतु मुख्य बिंदु</div>
      <ul>
        <li>स्केल = कठोर चिपका अवक्षेप (CaSO₄, CaCO₃); स्लज = ढीला अवक्षेप (MgCO₃, MgCl₂ लवण) — <strong>ब्लो-डाउन</strong> से हटाया जाता है।</li>
        <li>प्राइमिंग = <strong>भाप के साथ जल जाना</strong>; फोमिंग = <strong>स्थायी बुलबुले</strong> — दोनों घुलित ठोसों से।</li>
        <li>घुलित <strong>O₂</strong> <strong>सोडियम सल्फाइट</strong> या यांत्रिक वायु-निष्कासन से हटाई जाती है; CO₂ वातन से।</li>
        <li>फीनॉल्फ्थेलिन क्षारकता (P) OH⁻ + ½CO₃²⁻ मापती है; मेथिल ऑरेंज (M) कुल क्षारकता।</li>
      </ul></div>
    `,diagrams:["edta"],formulas_en:["Hardness (ppm) = (V_EDTA × M_EDTA × 10⁵) / V_sample(mL)","1 mol EDTA ≡ 1 mol Ca²⁺ ≡ 100 g CaCO₃","TDS (mg/L) ≈ conductivity × factor"],formulas_hi:["कठोरता (ppm) = (V_EDTA × M_EDTA × 10⁵) / V_नमूना(mL)","1 mol EDTA ≡ 1 mol Ca²⁺ ≡ 100 g CaCO₃","TDS (mg/L) ≈ चालकता × गुणक"],numericals:[{title_en:"EDTA hardness calculation",title_hi:"EDTA कठोरता गणना",given_en:"50 mL water sample consumed 20 mL of 0.01 M EDTA at the end point.",given_hi:"50 mL जल नमूने ने अंत बिंदु पर 20 mL, 0.01 M EDTA खर्च किया।",sol_en:"Moles EDTA = 0.01 × 20/1000 = 2×10⁻⁴ mol = moles Ca²⁺+Mg²⁺.<br>As CaCO₃: 2×10⁻⁴ × 100 g = 0.02 g = 20 mg in 50 mL.<br>Per litre: 20 × (1000/50) = <strong>400 mg/L = 400 ppm</strong>.",sol_hi:"EDTA के मोल = 0.01 × 20/1000 = 2×10⁻⁴ mol = Ca²⁺+Mg²⁺ के मोल।<br>CaCO₃ के रूप में: 2×10⁻⁴ × 100 g = 0.02 g = 50 mL में 20 mg।<br>प्रति लीटर: 20 × (1000/50) = <strong>400 mg/L = 400 ppm</strong>।",result_en:"Total hardness = 400 ppm",result_hi:"कुल कठोरता = 400 ppm"}],mcqs:[{q_en:"In EDTA titration, the colour change at the end point is:",q_hi:"EDTA अनुमापन में अंत बिंदु पर रंग परिवर्तन है:",opts_en:["Wine-red to blue","Blue to wine-red","Colourless to pink","Yellow to red"],opts_hi:["शराबी-लाल से नीला","नीले से शराबी-लाल","रंगहीन से गुलाबी","पीले से लाल"],ans:0},{q_en:"Priming in boilers refers to:",q_hi:"बॉयलरों में प्राइमिंग का अर्थ है:",opts_en:["Water droplets carried along with steam","Formation of scale","Corrosion of tubes","Fuel wastage"],opts_hi:["भाप के साथ जल बूंदों का जाना","स्केल का बनना","नलियों का संक्षारण","ईंधन अपव्यय"],ans:0},{q_en:"Sludge in boilers can be removed by:",q_hi:"बॉयलर में स्लज हटाया जा सकता है:",opts_en:["Blow-down operation","Painting","Cooling","Oiling"],opts_hi:["ब्लो-डाउन प्रचालन से","पेंट करके","ठंडा करके","तेल लगाकर"],ans:0},{q_en:"Buffer used in EDTA titration maintains pH:",q_hi:"EDTA अनुमापन में प्रयुक्त बफर pH बनाए रखता है:",opts_en:["~10","~4","~7","~1"],opts_hi:["~10","~4","~7","~1"],ans:0}]},{id:"u2t3",unit:2,title_en:"Water Softening: Soda-Lime, Zeolite & Ion Exchange",title_hi:"जल मृदुकरण: सोडा-लाइम, जियोलाइट व आयन विनिमय",body_en:`
      <p><strong>Softening</strong> means removing Ca²⁺ and Mg²⁺ hardness from water. Three classic methods are compared here.</p>
      <h3>1. Soda-lime process</h3>
      <p><strong>Lime</strong> [Ca(OH)₂] removes temporary hardness and Mg²⁺; <strong>soda</strong> [Na₂CO₃] removes permanent hardness.</p>
      <div class="formula-strip"><span class="flabel">Reactions</span>Ca(HCO₃)₂ + Ca(OH)₂ → 2CaCO₃↓ + 2H₂O · Mg(HCO₃)₂ + 2Ca(OH)₂ → Mg(OH)₂↓ + 2CaCO₃↓ + 2H₂O · CaCl₂ + Na₂CO₃ → CaCO₃↓ + 2NaCl</div>
      <ul>
        <li><strong>Lime requirement</strong> ∝ temporary Ca hardness + 2×(temporary Mg hardness) + permanent Mg hardness.</li>
        <li><strong>Soda requirement</strong> ∝ permanent Ca hardness + permanent Mg hardness.</li>
        <li>Types: <strong>cold</strong> (room temp, with coagulants) and <strong>hot</strong> (80–150 °C, faster, lower residual hardness ~15 ppm).</li>
        <li>Limitation: cannot reduce hardness below ~50–60 ppm (cold); produces large <strong>sludge</strong>.</li>
      </ul>
      <h3>2. Zeolite (permutit) process</h3>
      <p>Hard water passes through a bed of <strong>sodium zeolite (Na₂Z)</strong>, a hydrated sodium aluminosilicate. Ca²⁺/Mg²⁺ are exchanged for Na⁺.</p>
      <div class="formula-strip"><span class="flabel">Exchange</span>Ca²⁺ + Na₂Z → CaZ + 2Na⁺ (exhausted bed regenerated with 10% NaCl brine: CaZ + 2NaCl → Na₂Z + CaCl₂)</div>
      <ul>
        <li>Produces <strong>zero hardness</strong> (~0–10 ppm) — good for laundries and low-pressure boilers.</li>
        <li>Limitations: only <strong>exchanges cations</strong> — acidic water, high turbidity or Fe²⁺ damage the bed; treated water contains <strong>Na⁺ salts</strong> (not demineralised).</li>
      </ul>
      <h3>3. Ion-exchange (demineralisation) process</h3>
      <p>Two/three columns in series: <strong>cation exchanger</strong> (R–H, exchanges H⁺ for all cations) → <strong>anion exchanger</strong> (R–OH, exchanges OH⁻ for all anions) → <strong>mixed bed</strong> polisher.</p>
      <div class="formula-strip"><span class="flabel">Net result</span>H⁺ + OH⁻ → H₂O — all dissolved salts removed, giving <strong>demineralised (DM) water</strong></div>
      <ul>
        <li>Cation resin regenerated with <strong>HCl/H₂SO₄</strong>; anion resin with <strong>NaOH</strong>.</li>
        <li>Gives the <strong>purest water</strong> (~1–2 ppm TDS) — needed for high-pressure boilers, electronics, pharma.</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ Key Points for Exams</div>
      <ul>
        <li><strong>Comparison:</strong> Soda-lime → cheap, partial softening, much sludge · Zeolite → zero hardness but Na⁺ remains · Ion-exchange → complete demineralisation, costliest.</li>
        <li>Zeolite is <strong>not suitable for acidic or highly turbid</strong> water.</li>
        <li>Regeneration chemicals: zeolite → <strong>brine (NaCl)</strong>; cation resin → <strong>acid</strong>; anion resin → <strong>alkali</strong>.</li>
      </ul></div>
    `,body_hi:`
      <p><strong>मृदुकरण</strong> का अर्थ है जल से Ca²⁺ व Mg²⁺ कठोरता हटाना। यहाँ तीन क्लासिक विधियों की तुलना की गई है।</p>
      <h3>1. सोडा-लाइम प्रक्रम</h3>
      <p><strong>लाइम</strong> [Ca(OH)₂] अस्थायी कठोरता व Mg²⁺ हटाता है; <strong>सोडा</strong> [Na₂CO₃] स्थायी कठोरता हटाता है।</p>
      <div class="formula-strip"><span class="flabel">अभिक्रियाएँ</span>Ca(HCO₃)₂ + Ca(OH)₂ → 2CaCO₃↓ + 2H₂O · Mg(HCO₃)₂ + 2Ca(OH)₂ → Mg(OH)₂↓ + 2CaCO₃↓ + 2H₂O · CaCl₂ + Na₂CO₃ → CaCO₃↓ + 2NaCl</div>
      <ul>
        <li><strong>लाइम आवश्यकता</strong> ∝ अस्थायी Ca कठोरता + 2×(अस्थायी Mg कठोरता) + स्थायी Mg कठोरता।</li>
        <li><strong>सोडा आवश्यकता</strong> ∝ स्थायी Ca कठोरता + स्थायी Mg कठोरता।</li>
        <li>प्रकार: <strong>शीत</strong> (कमरे का ताप, स्कंदकों सहित) व <strong>तप्त</strong> (80–150 °C, तीव्र, अवशिष्ट कठोरता ~15 ppm)।</li>
        <li>सीमा: कठोरता ~50–60 ppm (शीत) से नीचे नहीं; भारी <strong>स्लज</strong> उत्पन्न होता है।</li>
      </ul>
      <h3>2. जियोलाइट (परम्यूटिट) प्रक्रम</h3>
      <p>कठोर जल <strong>सोडियम जियोलाइट (Na₂Z)</strong> — जलयोजित सोडियम ऐलुमिनोसिलिकेट — के संस्तर से गुजरता है। Ca²⁺/Mg²⁺ का Na⁺ से विनिमय होता है।</p>
      <div class="formula-strip"><span class="flabel">विनिमय</span>Ca²⁺ + Na₂Z → CaZ + 2Na⁺ (निःशेष संस्तर 10% NaCl लवणजल से पुनर्योजित: CaZ + 2NaCl → Na₂Z + CaCl₂)</div>
      <ul>
        <li><strong>शून्य कठोरता</strong> (~0–10 ppm) देता है — धुलाईघरों व निम्न-दाब बॉयलरों हेतु उपयुक्त।</li>
        <li>सीमाएँ: केवल <strong>धनायनों का विनिमय</strong> — अम्लीय जल, उच्च आविलता या Fe²⁺ संस्तर को हानि पहुँचाते हैं; उपचारित जल में <strong>Na⁺ लवण</strong> रहते हैं (विखनिजीकृत नहीं)।</li>
      </ul>
      <h3>3. आयन-विनिमय (विखनिजीकरण) प्रक्रम</h3>
      <p>श्रेणी में दो/तीन स्तंभ: <strong>धनायन विनिमयक</strong> (R–H, सभी धनायनों हेतु H⁺ देता है) → <strong>ऋणायन विनिमयक</strong> (R–OH, सभी ऋणायनों हेतु OH⁻ देता है) → <strong>मिश्रित संस्तर</strong> परिष्कारक।</p>
      <div class="formula-strip"><span class="flabel">कुल परिणाम</span>H⁺ + OH⁻ → H₂O — समस्त घुलित लवण हटते हैं, <strong>विखनिजीकृत (DM) जल</strong> मिलता है</div>
      <ul>
        <li>धनायन रेजिन <strong>HCl/H₂SO₄</strong> से; ऋणायन रेजिन <strong>NaOH</strong> से पुनर्योजित।</li>
        <li><strong>शुद्धतम जल</strong> (~1–2 ppm TDS) देता है — उच्च-दाब बॉयलर, इलेक्ट्रॉनिक्स, फार्मा हेतु आवश्यक।</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ परीक्षा हेतु मुख्य बिंदु</div>
      <ul>
        <li><strong>तुलना:</strong> सोडा-लाइम → सस्ता, आंशिक मृदुकरण, भारी स्लज · जियोलाइट → शून्य कठोरता परंतु Na⁺ रहता है · आयन-विनिमय → पूर्ण विखनिजीकरण, महँगा।</li>
        <li>जियोलाइट <strong>अम्लीय या अत्यंत आविल</strong> जल हेतु उपयुक्त नहीं।</li>
        <li>पुनर्योजन रसायन: जियोलाइट → <strong>लवणजल (NaCl)</strong>; धनायन रेजिन → <strong>अम्ल</strong>; ऋणायन रेजिन → <strong>क्षार</strong>।</li>
      </ul></div>
    `,diagrams:["zeolite","ionex"],formulas_en:["Lime ∝ temp-Ca + 2(temp-Mg) + perm-Mg (as CaCO₃)","Soda ∝ perm-Ca + perm-Mg (as CaCO₃)","Ca²⁺ + Na₂Z → CaZ + 2Na⁺"],formulas_hi:["लाइम ∝ अस्थायी-Ca + 2(अस्थायी-Mg) + स्थायी-Mg (CaCO₃ के रूप में)","सोडा ∝ स्थायी-Ca + स्थायी-Mg (CaCO₃ के रूप में)","Ca²⁺ + Na₂Z → CaZ + 2Na⁺"],numericals:[{title_en:"Lime-soda requirement",title_hi:"लाइम-सोडा आवश्यकता",given_en:"Water analysis (as CaCO₃): temporary Ca hardness 100 ppm, temporary Mg hardness 60 ppm, permanent Ca hardness 80 ppm, permanent Mg hardness 40 ppm. Calculate lime [as Ca(OH)₂] and soda [as Na₂CO₃] required per 10,000 L.",given_hi:"जल विश्लेषण (CaCO₃ के रूप में): अस्थायी Ca कठोरता 100 ppm, अस्थायी Mg कठोरता 60 ppm, स्थायी Ca कठोरता 80 ppm, स्थायी Mg कठोरता 40 ppm। 10,000 L हेतु लाइम [Ca(OH)₂ के रूप में] व सोडा [Na₂CO₃ के रूप में] आवश्यक मात्रा ज्ञात करें।",sol_en:"Lime (as CaO) = 74/100 × [temp-Ca + 2(temp-Mg) + perm-Mg] = 0.74 × [100 + 120 + 40] = 0.74 × 260 = <strong>192.4 mg/L as Ca(OH)₂</strong>.<br>Soda (as Na₂CO₃) = 106/100 × [perm-Ca + perm-Mg] = 1.06 × 120 = <strong>127.2 mg/L</strong>.<br>For 10,000 L: lime = 1.924 kg, soda = 1.272 kg.",sol_hi:"लाइम (CaO के रूप में) = 74/100 × [अस्थायी-Ca + 2(अस्थायी-Mg) + स्थायी-Mg] = 0.74 × [100 + 120 + 40] = 0.74 × 260 = <strong>192.4 mg/L, Ca(OH)₂ के रूप में</strong>।<br>सोडा (Na₂CO₃ के रूप में) = 106/100 × [स्थायी-Ca + स्थायी-Mg] = 1.06 × 120 = <strong>127.2 mg/L</strong>।<br>10,000 L हेतु: लाइम = 1.924 kg, सोडा = 1.272 kg।",result_en:"Lime 1.924 kg · Soda 1.272 kg per 10,000 L",result_hi:"10,000 L हेतु लाइम 1.924 kg · सोडा 1.272 kg"}],mcqs:[{q_en:"In the zeolite process, the exhausted bed is regenerated with:",q_hi:"जियोलाइट प्रक्रम में निःशेष संस्तर पुनर्योजित होता है:",opts_en:["10% NaCl brine","Dilute HCl","NaOH solution","Hot water"],opts_hi:["10% NaCl लवणजल से","तनु HCl से","NaOH विलयन से","गर्म जल से"],ans:0},{q_en:"Demineralised water is obtained by:",q_hi:"विखनिजीकृत जल प्राप्त होता है:",opts_en:["Ion-exchange process","Boiling","Filtration only","Chlorination"],opts_hi:["आयन-विनिमय प्रक्रम से","उबालने से","केवल छानने से","क्लोरीनीकरण से"],ans:0},{q_en:"Lime removes:",q_hi:"लाइम हटाता है:",opts_en:["Temporary hardness","Permanent hardness","Turbidity only","Bacteria"],opts_hi:["अस्थायी कठोरता","स्थायी कठोरता","केवल आविलता","जीवाणु"],ans:0},{q_en:"Which method gives zero hardness but leaves Na⁺ salts?",q_hi:"कौन-सी विधि शून्य कठोरता देती है परंतु Na⁺ लवण छोड़ती है?",opts_en:["Zeolite process","Ion exchange","Soda-lime","Boiling"],opts_hi:["जियोलाइट प्रक्रम","आयन विनिमय","सोडा-लाइम","उबालना"],ans:0}]},{id:"u2t4",unit:2,title_en:"Municipal Treatment & Drinking Water (BIS Standards)",title_hi:"नगरपालिका शोधन एवं पेयजल (BIS मानक)",body_en:`
      <p>River/lake water cannot be supplied directly — it carries suspended matter, colloids, microorganisms and dissolved salts. <strong>Municipal treatment</strong> converts it into safe potable water in five brief stages.</p>
      <h3>Stages of municipal water treatment</h3>
      <ul>
        <li><strong>1. Screening:</strong> coarse screens remove floating debris, leaves, wood.</li>
        <li><strong>2. Sedimentation:</strong> water rests in large tanks; ~95% of suspended silt/clay settles by gravity.</li>
        <li><strong>3. Coagulation:</strong> <strong>alum</strong> [K₂SO₄·Al₂(SO₄)₃·24H₂O] or ferrous sulphate is added; fine colloidal particles form heavy <strong>flocs</strong> and settle fast.</li>
        <li><strong>4. Filtration:</strong> water passes through <strong>sand filters</strong> (sand + gravel beds), removing remaining suspended matter and most bacteria.</li>
        <li><strong>5. Sterilisation (disinfection):</strong> kills pathogens — by <strong>chlorination</strong> (Cl₂ / bleaching powder), <strong>ozonisation</strong> (O₃), or <strong>UV rays</strong>.</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ Chlorination notes</div>
      <ul>
        <li>Cl₂ + H₂O → HOCl + HCl; <strong>HOCl</strong> (hypochlorous acid) is the actual disinfectant.</li>
        <li><strong>Breakpoint chlorination:</strong> adding Cl₂ past the "breakpoint" destroys all ammonia/organics and leaves free residual chlorine for safety.</li>
        <li>Dechlorination (removing excess Cl₂) uses <strong>activated carbon</strong> or SO₂.</li>
      </ul></div>
      <h3>Indian standard specification of drinking water (BIS 10500)</h3>
      <p>Collect and understand these key limits (as per BIS 10500):</p>
      <table class="btable">
        <tr><th>Parameter</th><th>Desirable limit</th><th>Max. permissible</th></tr>
        <tr><td>pH</td><td>6.5 – 8.5</td><td>—</td></tr>
        <tr><td>Total hardness (as CaCO₃)</td><td>200 mg/L</td><td>600 mg/L</td></tr>
        <tr><td>TDS</td><td>500 mg/L</td><td>2000 mg/L</td></tr>
        <tr><td>Chloride (as Cl⁻)</td><td>250 mg/L</td><td>1000 mg/L</td></tr>
        <tr><td>Fluoride (as F⁻)</td><td>1.0 mg/L</td><td>1.5 mg/L</td></tr>
        <tr><td>Nitrate (as NO₃⁻)</td><td>45 mg/L</td><td>—</td></tr>
        <tr><td>Iron (as Fe)</td><td>0.3 mg/L</td><td>1.0 mg/L</td></tr>
        <tr><td>Turbidity</td><td>1 NTU</td><td>5 NTU</td></tr>
        <tr><td>Coliform / E. coli</td><td colspan="2">Must be <strong>absent</strong> in 100 mL</td></tr>
      </table>
      <div class="keybox"><div class="keybox-title">⭐ Why these limits matter</div>
      <ul>
        <li><strong>Excess fluoride (&gt;1.5 ppm)</strong> → fluorosis (mottled teeth, weak bones); too little (&lt;0.5) → dental caries.</li>
        <li><strong>Excess nitrate (&gt;45 ppm)</strong> → blue-baby syndrome (methaemoglobinaemia) in infants.</li>
        <li><strong>Coliform absence</strong> proves the water is free from faecal/pathogenic contamination.</li>
      </ul></div>
    `,body_hi:`
      <p>नदी/झील का जल सीधे आपूर्ति नहीं किया जा सकता — इसमें निलंबित पदार्थ, कोलॉइड, सूक्ष्मजीव व घुलित लवण होते हैं। <strong>नगरपालिका शोधन</strong> इसे पाँच संक्षिप्त चरणों में सुरक्षित पेयजल में बदलता है।</p>
      <h3>नगरपालिका जल शोधन के चरण</h3>
      <ul>
        <li><strong>1. छनाई (Screening):</strong> मोटी जालियाँ तैरता कूड़ा, पत्ते, लकड़ी हटाती हैं।</li>
        <li><strong>2. अवसादन:</strong> जल बड़े टैंकों में ठहरता है; ~95% निलंबित गाद/चिकनी मिट्टी गुरुत्व से बैठ जाती है।</li>
        <li><strong>3. स्कंदन:</strong> <strong>फिटकरी</strong> [K₂SO₄·Al₂(SO₄)₃·24H₂O] या फेरस सल्फेट मिलाया जाता है; सूक्ष्म कोलॉइडी कण भारी <strong>फ्लॉक</strong> बनाकर शीघ्र बैठ जाते हैं।</li>
        <li><strong>4. निस्यंदन:</strong> जल <strong>बालू फिल्टरों</strong> (बालू + बजरी संस्तर) से गुजरता है, शेष निलंबित पदार्थ व अधिकांश जीवाणु हट जाते हैं।</li>
        <li><strong>5. रोगाणुनाशन:</strong> रोगजनक मारे जाते हैं — <strong>क्लोरीनीकरण</strong> (Cl₂ / ब्लीचिंग पाउडर), <strong>ओज़ोनीकरण</strong> (O₃), या <strong>UV किरणों</strong> द्वारा।</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ क्लोरीनीकरण टिप्पणी</div>
      <ul>
        <li>Cl₂ + H₂O → HOCl + HCl; वास्तविक रोगाणुनाशक <strong>HOCl</strong> (हाइपोक्लोरस अम्ल) है।</li>
        <li><strong>भंजक-बिंदु क्लोरीनीकरण:</strong> "भंजक बिंदु" से आगे Cl₂ मिलाने पर समस्त अमोनिया/कार्बनिक नष्ट होते हैं और सुरक्षा हेतु मुक्त अवशिष्ट क्लोरीन बचती है।</li>

      <h3>पेयजल की भारतीय मानक विशिष्टता (BIS 10500)</h3>
