<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News Reader | Diploma Engineers</title>
<meta name="description" content="Read the latest Diploma Engineers news and updates.">
<meta property="og:title" content="Diploma Engineers News">
<meta property="og:description" content="Read the latest news and updates from Diploma Engineers.">
<meta property="og:type" content="article">
<meta name="twitter:card" content="summary_large_image">
<script src="https://kit.fontawesome.com/a2e0e6adf2.js" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#f7f9fc;color:#111827;font-family:Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent}.reader{min-height:100vh;padding:14px}.reader-wrap{width:100%;max-width:850px;margin:0 auto}.mobile-back{display:flex;align-items:center;gap:7px;border:1px solid #e5e7eb;background:#fff;color:#0f172a;border-radius:11px;padding:9px 13px;font-weight:800;cursor:pointer;margin-bottom:12px}.article{background:#fff;border:1px solid #e6ebf1;border-radius:20px;overflow:hidden;box-shadow:0 5px 20px rgba(15,23,42,.05)}.hero{width:100%;aspect-ratio:16/8;object-fit:cover;background:#eef2f7;display:block}.content{padding:22px}.category{display:inline-flex;padding:6px 10px;border-radius:999px;background:#eff6ff;color:#2563eb;font-size:11px;font-weight:900;text-transform:uppercase}.title{font-size:30px;line-height:1.18;margin:13px 0 14px;color:#0f172a}.meta{display:flex;flex-wrap:wrap;gap:12px;color:#64748b;font-size:13px;font-weight:700;margin-bottom:18px}.meta span{display:inline-flex;align-items:center;gap:6px}.description{font-size:16px;line-height:1.75;color:#334155;white-space:pre-wrap}.description a{color:#2563eb}.external-box{margin-top:20px;padding:15px;border:1px solid #dbeafe;background:#f8fbff;border-radius:15px}.external-box h3{margin:0 0 10px;font-size:15px}.external-link{display:block;word-break:break-word;color:#2563eb;font-weight:700;text-decoration:none;margin:7px 0}.share-area{border-top:1px solid #edf0f3;margin-top:22px;padding-top:18px}.share-area h3{margin:0 0 12px;font-size:16px}.share-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.share-grid button{border:1px solid #e5e7eb;background:#f8fafc;border-radius:13px;padding:12px 8px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}.share-grid button:hover{background:#f1f5f9}.primary{background:#2563eb!important;color:#fff!important;border-color:#2563eb!important}.loading,.error{text-align:center;padding:70px 20px;color:#64748b}.error h2{color:#0f172a}@media(max-width:600px){.reader{padding:8px}.content{padding:15px}.title{font-size:23px}.description{font-size:14px;line-height:1.7}.share-grid{grid-template-columns:repeat(2,1fr)}.hero{aspect-ratio:16/10}}
</style>
</head>
<body>
<div class="reader"><div class="reader-wrap">
<button class="mobile-back" onclick="history.length>1?history.back():location.href='index.html'"><i class="fa-solid fa-arrow-left"></i> Back</button>
<main id="reader" class="article"><div class="loading"><i class="fa-solid fa-spinner fa-spin"></i><p>Loading news...</p></div></main>
</div></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
import {getDatabase,ref,get} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';
const config={apiKey:'AIzaSyAbg1Q1ZPgF7mwaxyin7iglla01eDk_tKo',authDomain:'diplomaengineers-869df.firebaseapp.com',databaseURL:'https://diplomaengineers-869df-default-rtdb.firebaseio.com',projectId:'diplomaengineers-869df',storageBucket:'diplomaengineers-869df.appspot.com',messagingSenderId:'356779436080',appId:'1:356779436080:web:4b28da380e547420d0e5f5'};
const app=initializeApp(config);const db=getDatabase(app);const id=new URLSearchParams(location.search).get('id')||'';const root=document.getElementById('reader');
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
const valid=v=>{try{const u=new URL(String(v||''));return /^https?:$/.test(u.protocol)?u.href:''}catch(_){return ''}};
const dateFmt=v=>{if(!v)return 'Recent';const d=new Date(typeof v==='number'?v:String(v));return Number.isNaN(d.getTime())?String(v):d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});};
const readerUrl=()=>location.href;
function linksFrom(n){let a=[];const x=n.links||n.externalLinks||n.external||[];if(Array.isArray(x))a=x;else if(x&&typeof x==='object')a=Object.values(x);else if(typeof x==='string')a=[x];const single=n.link||n.externalLink||n.url||n.pdf||n.fileUrl||n.file;if(single)a.push(single);return [...new Set(a.map(valid).filter(Boolean))];}
function render(n){const title=n.title||'Untitled News',desc=n.text||n.desc||n.description||n.details||'',cat=n.cat||n.category||'NOTIFICATION',image=valid(n.thumb||n.image||n.thumbnail||n.thumbnailUrl||''),date=n.date||n.createdDate||dateFmt(n.timestamp||n.createdAt||n.uploadedAt),by=n.by||n.authorName||n.author||n.uploaderName||n.uploadedBy||n.createdBy||'Diploma Engineers',links=linksFrom(n);document.title=title+' | Diploma Engineers';document.querySelector('meta[name="description"]').setAttribute('content',desc.slice(0,155));document.querySelector('meta[property="og:title"]').setAttribute('content',title);document.querySelector('meta[property="og:description"]').setAttribute('content',desc.slice(0,200));if(image){let og=document.querySelector('meta[property="og:image"]');if(!og){og=document.createElement('meta');og.setAttribute('property','og:image');document.head.appendChild(og)}og.setAttribute('content',image)}root.innerHTML=`${image?`<img class="hero" src="${esc(image)}" alt="${esc(title)}" onerror="this.style.display='none'">`:''}<div class="content"><span class="category">${esc(cat)}</span><h1 class="title">${esc(title)}</h1><div class="meta"><span><i class="fa-regular fa-calendar"></i>${esc(date)}</span><span><i class="fa-solid fa-user-pen"></i>By ${esc(by)}</span></div><div class="description">${esc(desc)}</div>${links.length?`<div class="external-box"><h3><i class="fa-solid fa-link"></i> External Links</h3>${links.map((u,i)=>`<a class="external-link" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a>`).join('')}</div>`:''}<div class="share-area"><h3><i class="fa-solid fa-share-nodes"></i> Share this news</h3><div class="share-grid"><button class="primary" onclick="shareNative()"><i class="fa-solid fa-share-nodes"></i> Share</button><button onclick="shareWA()"><i class="fa-brands fa-whatsapp"></i> WhatsApp</button><button onclick="shareTG()"><i class="fa-brands fa-telegram"></i> Telegram</button><button onclick="shareFB()"><i class="fa-brands fa-facebook"></i> Facebook</button><button onclick="shareIG()"><i class="fa-brands fa-instagram"></i> Instagram</button><button onclick="copyNews()"><i class="fa-regular fa-copy"></i> Copy Link</button></div></div></div>`;window.__news={title,url:readerUrl(),desc,image};}
window.shareNative=async()=>{const n=window.__news||{};if(navigator.share){try{await navigator.share({title:n.title,text:(n.desc||'Read this news on Diploma Engineers'),url:n.url});return}catch(_){}}copyNews()};window.shareWA=()=>{const n=window.__news;window.open('https://wa.me/?text='+encodeURIComponent(n.title+'\n'+n.url),'_blank')};window.shareTG=()=>{const n=window.__news;window.open('https://t.me/share/url?url='+encodeURIComponent(n.url)+'&text='+encodeURIComponent(n.title),'_blank')};window.shareFB=()=>{window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank')};window.shareIG=async()=>{const n=window.__news;try{await navigator.clipboard.writeText(n.title+'\n'+n.url);alert('News link copied. Open Instagram and share it.')}catch(_){prompt('Copy News Link:',n.url)}};window.copyNews=async()=>{try{await navigator.clipboard.writeText(location.href);alert('News link copied!')}catch(_){prompt('Copy News Link:',location.href)}};
(async()=>{if(!id){root.innerHTML='<div class="error"><h2>News not found</h2><p>Missing news ID.</p></div>';return}try{const snap=await get(ref(db,'news/'+id));if(!snap.exists()){root.innerHTML='<div class="error"><h2>News not found</h2><p>This news may have been removed.</p></div>';return}render(snap.val()||{})}catch(e){console.error(e);root.innerHTML='<div class="error"><h2>Unable to load news</h2><p>Please check your internet connection.</p></div>'}})();
</script>
</body></html>
