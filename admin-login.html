<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Admin Panel | Diploma Engineers</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --orange:#ff6b00;
    --orange2:#ff8a33;
    --dark:#172033;
    --muted:#707887;
    --bg:#f5f7fb;
    --white:#fff;
    --border:#e5e9f0;
    --green:#198754;
    --red:#dc3545;
    --blue:#2563eb;
}

body{
    font-family:Poppins,sans-serif;
    background:var(--bg);
    color:var(--dark);
}

button,input,textarea,select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* =========================
   LOADING
========================= */

#loadingScreen{
    position:fixed;
    inset:0;
    z-index:9999;
    background:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

#loadingScreen i{
    font-size:38px;
    color:var(--orange);
    margin-bottom:14px;
}

#loadingScreen p{
    color:#777;
    font-size:13px;
}

/* =========================
   ACCESS DENIED
========================= */

#accessDenied{
    display:none;
    min-height:100vh;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.access-box{
    max-width:450px;
    width:100%;
    background:#fff;
    border:1px solid var(--border);
    border-radius:20px;
    padding:35px 25px;
    text-align:center;
}

.access-box i{
    font-size:48px;
    color:var(--red);
    margin-bottom:15px;
}

.access-box h2{
    margin-bottom:8px;
}

.access-box p{
    color:var(--muted);
    font-size:13px;
    line-height:1.7;
}

.access-box button{
    margin-top:20px;
}

/* =========================
   HEADER
========================= */

.header{
    height:70px;
    background:#fff;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:1000;
}

.nav{
    max-width:1250px;
    height:100%;
    margin:auto;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    text-decoration:none;
    color:var(--dark);
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:800;
    font-size:18px;
}

.logo img{
    width:40px;
    height:40px;
    object-fit:contain;
    border-radius:10px;
}

.nav-right{
    display:flex;
    gap:8px;
}

.nav-btn{
    border:0;
    background:#f1f3f7;
    color:#333;
    padding:9px 13px;
    border-radius:10px;
    font-size:12px;
    font-weight:600;
}

.nav-btn:hover{
    background:#e8ebf0;
}

.logout-btn{
    background:#fff0ed;
    color:#d93025;
}

/* =========================
   MAIN
========================= */

.main{
    max-width:1250px;
    margin:auto;
    padding:28px 20px 60px;
}

.welcome{
    margin-bottom:22px;
}

.welcome h1{
    font-size:27px;
    font-weight:800;
}

.welcome p{
    color:var(--muted);
    font-size:13px;
    margin-top:4px;
}

/* =========================
   ADMIN PROFILE
========================= */

.profile-bar{
    background:#fff;
    border:1px solid var(--border);
    border-radius:17px;
    padding:14px 17px;
    display:flex;
    align-items:center;
    gap:13px;
    margin-bottom:22px;
}

.profile-bar img{
    width:52px;
    height:52px;
    object-fit:cover;
    border-radius:50%;
}

.profile-info{
    flex:1;
}

.profile-info strong{
    display:block;
    font-size:14px;
}

.profile-info span{
    color:var(--orange);
    font-size:11px;
    font-weight:700;
}

.profile-btn{
    border:0;
    background:#fff3ea;
    color:var(--orange);
    padding:9px 13px;
    border-radius:9px;
    font-size:12px;
    font-weight:600;
}

/* =========================
   TABS
========================= */

.tabs{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    background:#fff;
    border:1px solid var(--border);
    padding:8px;
    border-radius:16px;
    margin-bottom:22px;
}

.tab{
    border:0;
    background:transparent;
    padding:13px 10px;
    border-radius:11px;
    font-weight:700;
    font-size:13px;
    color:#707887;
}

.tab i{
    margin-right:6px;
}

.tab.active{
    background:var(--orange);
    color:#fff;
}

/* =========================
   TAB CONTENT
========================= */

.tab-content{
    display:none;
}

.tab-content.active{
    display:block;
}

/* =========================
   CARD
========================= */

.card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:18px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 5px 22px rgba(20,30,50,.035);
}

.card-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:20px;
}

.card-title{
    font-size:17px;
    font-weight:700;
}

.card-title i{
    color:var(--orange);
    margin-right:7px;
}

/* =========================
   FORM
========================= */

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.full{
    grid-column:1/-1;
}

.field label{
    display:block;
    font-size:12px;
    font-weight:600;
    margin-bottom:7px;
}

.field input,
.field textarea,
.field select{
    width:100%;
    padding:11px 12px;
    border:1px solid #dce1e8;
    border-radius:10px;
    outline:none;
    background:#fff;
    font-size:12px;
    color:var(--dark);
}

.field textarea{
    min-height:105px;
    resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
    border-color:var(--orange);
    box-shadow:0 0 0 3px rgba(255,107,0,.08);
}

.help{
    display:block;
    color:#8a92a1;
    font-size:10px;
    margin-top:5px;
}

.form-actions{
    display:flex;
    gap:9px;
    margin-top:20px;
}

.btn{
    border:0;
    border-radius:10px;
    padding:11px 17px;
    font-size:12px;
    font-weight:700;
}

.btn-primary{
    background:var(--orange);
    color:#fff;
}

.btn-primary:hover{
    background:#e85f00;
}

.btn-secondary{
    background:#edf0f4;
    color:#333;
}

.btn-danger{
    background:#fff0ed;
    color:#d93025;
}

/* =========================
   STATUS
========================= */

.message{
    display:none;
    padding:11px 13px;
    border-radius:10px;
    font-size:12px;
    margin-bottom:16px;
}

.message.show{
    display:block;
}

.message.success{
    background:#eaf8ef;
    color:#187744;
}

.message.error{
    background:#fff0ed;
    color:#c62828;
}

/* =========================
   IMAGE PREVIEW
========================= */

.image-preview{
    display:none;
    margin-top:10px;
    align-items:center;
    gap:10px;
}

.image-preview img{
    width:70px;
    height:70px;
    border-radius:10px;
    object-fit:cover;
    border:1px solid var(--border);
}

/* =========================
   LIST
========================= */

.list-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(285px,1fr));
    gap:17px;
}

.item-card{
    border:1px solid var(--border);
    border-radius:15px;
    overflow:hidden;
    background:#fff;
}

.item-image{
    width:100%;
    height:160px;
    object-fit:cover;
    background:#f1f3f7;
}

.item-body{
    padding:15px;
}

.item-body h3{
    font-size:15
