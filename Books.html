<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --primary:#ff6b00;
    --primary2:#ff944d;
    --text:#111827;
    --muted:#64748b;
    --bg:#f7f9fc;
    --card:#ffffff;
    --border:#e7ebf0;
}

body{
    font-family:Poppins,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}

/* ================= PAGE ================= */

.books-page{
    min-height:100vh;
    padding:20px;
}

.books-container{
    max-width:1400px;
    margin:auto;
}

/* ================= HEADER ================= */

.books-header{
    display:flex;
    align-items:end;
    justify-content:space-between;
    gap:15px;
    margin-bottom:18px;
}

.books-title h1{
    font-size:28px;
    font-weight:800;
    letter-spacing:-.5px;
}

.books-title p{
    margin-top:4px;
    color:var(--muted);
    font-size:13px;
}

.book-count{
    font-size:13px;
    font-weight:800;
    color:#ea580c;
    background:#fff1e8;
    padding:8px 13px;
    border-radius:10px;
    white-space:nowrap;
}

/* ================= SEARCH ================= */

.books-search{
    height:52px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:15px;
    padding:0 15px;
    display:flex;
    align-items:center;
    box-shadow:0 4px 15px rgba(0,0,0,.04);
    margin-bottom:13px;
}

.search-icon{
    font-size:21px;
    color:#94a3b8;
    margin-right:10px;
}

.books-search input{
    width:100%;
    height:100%;
    border:0;
    outline:0;
    background:transparent;
    font-family:inherit;
    font-size:14px;
}

/* ================= FILTERS ================= */

.filters{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:2px 0 15px;
    scrollbar-width:none;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filter-btn{
    flex-shrink:0;
    border:1px solid var(--border);
    background:#fff;
    color:#475569;
    border-radius:10px;
    padding:8px 13px;
    font-family:inherit;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.filter-btn:hover{
    border-color:#ffb37c;
}

.filter-btn.active{
    background:var(--primary);
    color:white;
    border-color:var(--primary);
}

/* ================= GRID ================= */

.books-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:18px;
}

/* ================= CARD ================= */

.book-card{
    background:#fff;
    border:1px solid #e8edf3;
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;
    box-shadow:0 5px 18px rgba(15,23,42,.05);
    transition:.2s;
    position:relative;
}

.book-card:hover{
    transform:translateY(-4px);
    box-shadow:0 12px 28px rgba(15,23,42,.10);
    border-color:#ffd0ad;
}

.book-card:active{
    transform:scale(.98);
}

/* ================= COVER ================= */

.book-cover{
    aspect-ratio:3/4;
    background:#eef2f7;
    position:relative;
    overflow:hidden;
}

.book-cover img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.cover-loading{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    color:#64748b;
    font-size:11px;
    background:linear-gradient(
        135deg,
        #eef2f7,
        #f8fafc
    );
}

.pdf-badge{
    position:absolute;
    right:9px;
    top:9px;
    background:rgba(255,255,255,.95);
    color:#dc2626;
    border-radius:7px;
    padding:5px 7px;
    font-size:9px;
    font-weight:900;
    z-index:2;
}

.new-badge{
    position:absolute;
    left:9px;
    top:9px;
    background:var(--primary);
    color:#fff;
    border-radius:7px;
    padding:5px 7px;
    font-size:8px;
    font-weight:800;
    z-index:2;
}

/* ================= INFO ================= */

.book-info{
    padding:12px;
}

.book-title{
    font-size:14px;
    font-weight:800;
    line-height:1.4;

    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;

    overflow:hidden;
}

.book-category{
    display:inline-block;

    padding:4px 7px;
    border-radius:6px;
    background:#fff1e8;
    color:#ea580c;
    font-size:9px;

}

.book-author{

.book-author img{

}

.book-author span{

/* ================= EMPTY ================= */

}

.no-books h3{

/* ================= LOADER ================= */

.main-loader{
    text-align:center;
    padding:60px 20px;
    color:#64748b;
    font-size:13px;
}

.spinner{
    width:28px;
    height:28px;
    border:3px solid #e5e7eb;
    border-top-color:var(--primary);
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 10px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* ================= RESPONSIVE ================= */

@media(max-width:600px){

    .books-page{
        padding:14px;
    }

    .books-header{

    .books-title p{

    .book-count{

    .books-grid{

    }

    .book-card{
        border-radius:13px;
    }

    .book-info{
        padding:9px;
    }

    .book-title{
        font-size:12px;
    }

    .book-category{
        font-size:8px;
        margin-top:6px;
    }

    .book-author{
        font-size:8px;
    }
}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   GOOGLE BOOK COVER
===================================================== */

function googleCoverUrl(title){

    return "https://www.googleapis.com/books/v1/volumes?q="
        + encodeURIComponent(title)
        + "&maxResults=1";

}


function fallbackCover(title){

    return "https://dummyimage.com/600x800/f3f4f6/f97316.png&text="
        + encodeURIComponent(title);

}


async function getCover(title){

    try{

        const response =
            await fetch(googleCoverUrl(title));

        const data =
            await response.json();

        const info =
            data.items?.[0]?.volumeInfo;

        return (
            info?.imageLinks?.thumbnail
                ?.replace("http:","https:")
            ||
            fallbackCover(title)
        );

    }catch(error){

        return fallbackCover(title);

    }

}


/* =====================================================
   LOAD FIREBASE BOOKS
===================================================== */

onValue(
    ref(db,"books"),

    snapshot => {

        firebaseBooks = [];

        if(snapshot.exists()){

            snapshot.forEach(child => {

                const b = child.val() || {};

                /*
                 Old books without status:
                 automatically remain visible.

                 New admin books:
                 only "published" appears publicly.
                */

                if(
                    b.status === undefined ||
                    b.status === null ||
                    b.status === "" ||
                    b.status === "published"
                ){

                    firebaseBooks.push({

                        id:child.key,

                        ...b,

                        title:
                            b.title ||
                            b.bookName ||
                            b.name ||
                            "Untitled Book",

                        pdf:
                            b.pdf ||
                            b.pdfUrl ||
                            b.url ||
                            "#",

                        image:
                            b.image ||
                            b.imageUrl ||
                            b.coverImage ||
                            "",

                        category:
                            b.category ||
                            b.branch ||
                            b.resourceType ||
                            "Book PDF",

                        authorName:
                            b.authorName ||
                            b.author ||
                            "",

                        authorPhoto:
                            b.authorPhoto ||
                            ""

                    });

                }

            });

        }


        allBooks = [
            ...oldBooks,
            ...firebaseBooks
        ];


        loader.style.display = "none";

        render();

    },

    error => {

        console.error(
            "Firebase books error:",
            error
        );

        /*
         If Firebase fails,
         old books still remain visible.
        */

        loader.style.display = "none";

        allBooks = [...oldBooks];

        render();

    }

);


/* =====================================================
   RENDER
===================================================== */

function render(){

    const q =
        search.value
            .trim()
            .toLowerCase();


    let filtered =
        allBooks.filter(book => {

            const title =
                String(book.title || "")
                    .toLowerCase();

            const category =
                String(book.category || "")
                    .toLowerCase();

            const branch =
                String(book.branch || "")
                    .toLowerCase();

            const type =
                String(book.resourceType || "")
                    .toLowerCase();


            const matchesSearch =
                !q ||
                title.includes(q) ||
                category.includes(q) ||
                branch.includes(q) ||
                type.includes(q);


            let matchesFilter = true;


            if(activeFilter !== "All"){

                const filter =
                    activeFilter.toLowerCase();


                matchesFilter =
                    category.includes(filter) ||
                    branch.includes(filter) ||
                    type.includes(filter);

            }


            return (
                matchesSearch &&
                matchesFilter
            );

        });


    count.textContent =
        filtered.length +
        (
            filtered.length === 1
                ? " Resource"
                : " Resources"
        );


    grid.innerHTML = "";

    noBooks.style.display =
        filtered.length
            ? "none"
            : "block";


    filtered.forEach(book => {

        createBookCard(book);

    });

}


/* =====================================================
   CREATE CARD
===================================================== */

    const card =
        document.createElement("article");

    card.className = "book-card";


    const title =
        book.title || "Untitled";


    const category =
        book.category || "Book PDF";


    const image =
        book.image || "";


    const author =
        book.authorName || "";


    card.innerHTML = `

        <div class="book-cover">

            <div class="cover-loading">
                Loading cover...
            </div>

            <span class="pdf-badge">
                PDF
            </span>

            ${
                book.id
                    ? `<span class="new-badge">NEW</span>`
                    : ""
            }

            <img
                alt=""
                loading="lazy"
            >

        </div>


        <div class="book-info">

            <div class="book-title">
                ${escapeHTML(title)}
            </div>

            <span class="book-category">
                ${escapeHTML(category)}
            </span>


            ${
                author
                    ? `
                    <div class="book-author">

                        <img
                            src="${escapeHTML(
                                book.authorPhoto ||
                                fallbackCover(author)
                            )}"
                            alt=""
                        >

                        <span>
                            ${escapeHTML(author)}
                        </span>

                    </div>
                    `
                    : ""
            }

        </div>

    `;


    /*
       Click → PDF
    */

    card.addEventListener(
        "click",
        () => {

            if(
                book.pdf &&
                book.pdf !== "#"
            ){

                window.open(
                    book.pdf,
                    "_blank",
                    "noopener"
                );

            }

        }
    );


    const img =
        card.querySelector("img");

    const loading =
        card.querySelector(
            ".cover-loading"
        );


    /*
       Use uploaded image first.
       Otherwise Google Books.
    */

    if(image){

        img.src = image;

        img.alt = title;

        img.onload = () => {

            loading.remove();

        };

        img.onerror = async () => {

            const src =
                await getCover(title);

            img.src = src;

            loading.remove();

        };

    }else{

        getCover(title)
            .then(src => {

                img.src = src;

                img.alt = title;

                img.onload = () => {

                    loading.remove();

                };

                img.onerror = () => {

                    img.src =
                        fallbackCover(title);

                    loading.remove();

                };

            });

    }


    grid.appendChild(card);

}


/* =====================================================
   SEARCH
===================================================== */

search.addEventListener(
    "input",
    render
);


/* =====================================================
   FILTER BUTTONS
===================================================== */

document
    .querySelectorAll(".filter-btn")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(
                        ".filter-btn"
                    )
                    .forEach(btn => {

                        btn.classList.remove(
                            "active"
                        );

                    });


                button.classList.add(
                    "active"
                );


                activeFilter =
                    button.dataset.filter;


                render();

            }
        );

    });

</script>

</body>
</html>
