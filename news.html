<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diploma Engineers News</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


<style>

/* आपका news CSS यहां रहेगा */

</style>


</head>


<body>



<!-- HEADER -->

<div id="header"></div>


<script>

fetch("header.html")
.then(res=>res.text())
.then(data=>{
document.getElementById("header").innerHTML=data;
});

</script>




<!-- NEWS -->

<section class="news-hero">

<h1>
Latest News
</h1>

<p>
Diploma Engineers latest updates, notices and important information.
</p>

</section>




<div class="container">


<div id="newsList">

Loading News...

</div>


</div>





<!-- FOOTER -->

<div id="footer"></div>


<script>

fetch("footer.html")
.then(res=>res.text())
.then(data=>{
document.getElementById("footer").innerHTML=data;
});

</script>




<script type="module">

import {

db,
ref,
onValue

}

from "./firebase.js";



const newsList=document.getElementById("newsList");


const newsRef=ref(db,"news");



onValue(newsRef,(snapshot)=>{


newsList.innerHTML="";


if(!snapshot.exists()){

newsList.innerHTML="No News Available";

return;

}



let newsArray=[];


snapshot.forEach((child)=>{

newsArray.push({

id:child.key,

...child.val()

});

});



newsArray.reverse();



newsArray.forEach((n)=>{


newsList.innerHTML+=`

<div class="card">


<span class="category">

${n.cat || "News"}

</span>


<h3>

${n.title}

</h3>



${n.thumb ? `<img src="${n.thumb}">` : ""}



<p>

${n.desc}

</p>



${n.pdf ? 

`<a href="${n.pdf}" target="_blank" class="btn btn-primary">

Open PDF

</a>`

:""}



<small>

${n.date || ""}

</small>



</div>

`;


});


});


</script>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
