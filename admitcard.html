<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Coming Soon | Civil Engineering Study Library</title>

<!-- Google Fonts & Font Awesome Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --secondary: #0f172a;
  --accent: #f97316;
  --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
  --card-bg: rgba(255, 255, 255, 0.05);
  --text-light: #f8fafc;
  --text-muted: #94a3b8;
  --border-color: rgba(255, 255, 255, 0.1);
  --shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Plus Jakarta Sans', sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: var(--bg-gradient);
  color: var(--text-light);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow-x: hidden;
}

/* BACKGROUND GLOW EFFECTS */
.glow-orb {
  position: absolute;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  filter: blur(80px);
  z-index: 0;
  opacity: 0.15;
  pointer-events: none;
}

.orb-1 {
  background: var(--primary);
  top: 10%;
  left: 10%;
}

.orb-2 {
  background: var(--accent);
  bottom: 10%;
  right: 10%;
}

/* CONTAINER */
.coming-soon-container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 600px;
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border-color);
  border-radius: 32px;
  padding: 40px 30px;
  text-align: center;
  box-shadow: var(--shadow);
  animation: fadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes fadeInScale {
  from { opacity: 0; transform: scale(0.95) translateY(15px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

/* ICON BADGE */
.icon-badge {
  width: 72px;
  height: 72px;
  background: rgba(37, 99, 235, 0.15);
  color: var(--primary);
  border-radius: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  margin: 0 auto 24px;
  border: 1px solid rgba(37, 99, 235, 0.3);
  box-shadow: 0 0 25px rgba(37, 99, 235, 0.2);
}

/* HEADINGS */
.badge-tag {
  display: inline-block;
  padding: 6px 16px;
  background: rgba(249, 115, 22, 0.15);
  color: var(--accent);
  border-radius: 30px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-bottom: 14px;
  border: 1px solid rgba(249, 115, 22, 0.3);
}

h1 {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin-bottom: 12px;
  color: #fff;
}

p {
  color: var(--text-muted);
  font-size: 15px;
  line-height: 1.6;
  margin-bottom: 30px;
}

/* COUNTDOWN TIMER */
.countdown-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 34px;
}

.countdown-box {
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid var(--border-color);
  padding: 14px 10px;
  border-radius: 18px;
}

.countdown-number {
  font-size: 24px;
  font-weight: 800;
  color: #fff;
  margin-bottom: 2px;
}

.countdown-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* NOTIFY FORM */
.notify-form {
  display: flex;
  gap: 10px;
  margin-bottom: 24px;
}

.notify-input {
  flex: 1;
  background: rgba(15, 23, 42, 0.8);
  border: 1px solid var(--border-color);
  padding: 14px 18px;
  border-radius: 16px;
  color: #fff;
  font-size: 14px;
  outline: none;
  transition: all 0.3s ease;
}

.notify-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
}

.notify-btn {
  background: var(--primary);
  color: #fff;
  border: none;
  padding: 0 22px;
  border-radius: 16px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  gap: 8px;
}

.notify-btn:hover {
  background: var(--primary-hover);
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
}

/* SOCIAL / QUICK LINKS */
.social-links {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 20px;
}

.social-btn {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-color);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  font-size: 18px;
  transition: all 0.3s ease;
}

.social-btn:hover {
  background: var(--primary);
  border-color: var(--primary);
  transform: translateY(-3px);
}

/* FOOTER TEXT */
.footer-note {
  margin-top: 30px;
  font-size: 13px;
  color: var(--text-muted);
}

@media (max-width: 500px) {
  .coming-soon-container {
    padding: 30px 20px;
  }
  
  h1 {
    font-size: 26px;
  }
  
  .notify-form {
    flex-direction: column;
  }
  
  .notify-btn {
    padding: 14px;
    justify-content: center;
  }
  
  .countdown-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<!-- BACKGROUND GLOWS -->
<div class="glow-orb orb-1"></div>
<div class="glow-orb orb-2"></div>

<div class="coming-soon-container">
  
  <div class="icon-badge">
    <i class="fas fa-hard-hat"></i>
  </div>

  <span class="badge-tag"><i class="fas fa-sparkles"></i> Launching Soon</span>
  <h1>Something Epic is Under Construction</h1>
  <p>We are upgrading our BTEUP Civil Engineering Library platform with high-speed study resources, smart tools, and premium notes. Stay tuned!</p>

  <!-- COUNTDOWN TIMER -->
  <div class="countdown-grid">
    <div class="countdown-box">
      <div class="countdown-number" id="days">00</div>
      <div class="countdown-label">Days</div>
    </div>
    <div class="countdown-box">
      <div class="countdown-number" id="hours">00</div>
      <div class="countdown-label">Hours</div>
    </div>
    <div class="countdown-box">
      <div class="countdown-number" id="minutes">00</div>
      <div class="countdown-label">Mins</div>
    </div>
    <div class="countdown-box">
      <div class="countdown-number" id="seconds">00</div>
      <div class="countdown-label">Secs</div>
    </div>
  </div>

  <!-- NOTIFICATION FORM -->
  <div class="notify-form">
    <input type="email" id="userEmail" class="notify-input" placeholder="Enter your email for updates...">
    <button class="notify-btn" onclick="subscribeEmail()">
      <span>Notify Me</span> <i class="fas fa-paper-plane"></i>
    </button>
  </div>

  <!-- SOCIAL LINKS -->
  <div class="social-links">
    <a href="https://whatsapp.com" target="_blank" class="social-btn" title="WhatsApp Group"><i class="fab fa-whatsapp"></i></a>
    <a href="https://telegram.org" target="_blank" class="social-btn" title="Telegram Channel"><i class="fab fa-telegram-plane"></i></a>
    <a href="mailto:support@civilnotes.com" class="social-btn" title="Email Us"><i class="fas fa-envelope"></i></a>
  </div>

  <div class="footer-note">
    &copy; 2026 Civil Engineering Study Library App. All rights reserved.
  </div>

</div>

<script>
// Countdown Timer JavaScript
const countDownDate = new Date().getTime() + (10 * 24 * 60 * 60 * 1000); // 10 Days Countdown

const timer = setInterval(function() {
  const now = new Date().getTime();
  const distance = countDownDate - now;

  const days = Math.floor(distance / (1000 * 60 * 60 * 24));
  const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((distance % (1000 * 60)) / 1000);

  document.getElementById("days").innerText = days < 10 ? '0' + days : days;
  document.getElementById("hours").innerText = hours < 10 ? '0' + hours : hours;
  document.getElementById("minutes").innerText = minutes < 10 ? '0' + minutes : minutes;
  document.getElementById("seconds").innerText = seconds < 10 ? '0' + seconds : seconds;

  if (distance < 0) {
    clearInterval(timer);
    document.querySelector(".countdown-grid").innerHTML = "<h3>We Are Live!</h3>";
  }
}, 1000);

// Subscription Notification Function
function subscribeEmail() {
  const email = document.getElementById("userEmail").value;
  if(email && email.includes("@")) {
    alert("Thank you! We will notify you when we launch.");
    document.getElementById("userEmail").value = "";
  } else {
    alert("Please enter a valid email address.");
  }
}
</script>

</body>
</html>
