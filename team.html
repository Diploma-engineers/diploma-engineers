<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diploma Engineers | Our Team</title>

<link rel="icon" href="favicon.ico">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,Arial,sans-serif;
}

body{
    background:#f1f5f9;
    color:#172033;
}

/* =========================
   CONTAINER & SECTION
========================= */

.container{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:40px 20px;
}

.section-title{
    text-align:center;
    margin-bottom:35px;
}

.section-title h1{
    color:#2563eb;
    font-size:32px;
    margin-bottom:8px;
}

.section-title p{
    color:#64748b;
    font-size:15px;
}

/* =========================
   TEAM GRID VIEW STYLING
========================= */

.team-grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
}

.team-card {
    background: #ffffff;
    border-radius: 20px;
    padding: 30px 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    position: relative;
    border: 1px solid #e2e8f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.team-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 35px rgba(15, 23, 42, 0.12);
}

.team-img-container {
    width: 115px;
    height: 115px;
    border-radius: 50%;
    padding: 4px;
    background: linear-gradient(135deg, #2563eb, #ff6500);
    margin: 0 auto 15px;
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.2);
}

.team-img-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    background: #fff;
}

.team-card h3 {
    font-size: 20px;
    color: #1e293b;
    font-weight: 700;
    margin-bottom: 4px;
}

.team-role {
    color: #2563eb;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
}

.team-department {
    font-size: 11px;
    font-weight: 700;
    color: #64748b;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 12px;
}

.team-bio {
    color: #64748b;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 18px;
    padding: 0 10px;
}

.team-socials {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 18px;
}

.social-icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #f0f6ff;
    color: #2563eb;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-size: 15px;
    transition: 0.2s;
    border: 1px solid #dbeafe;
}

.social-icon-btn:hover {
    background: #2563eb;
    color: #fff;
}

.team-stats-row {
    display: flex;
    width: 100%;
    gap: 10px;
    margin-bottom: 18px;
}

.team-stat-box {
    flex: 1;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    padding: 10px;
    border-radius: 12px;
    text-align: center;
}

.team-stat-box span {
    display: block;
    font-size: 10px;
    color: #64748b;
    font-weight: 600;
    text-transform: uppercase;
}

.team-stat-box strong {
    font-size: 12px;
    color: #0f172a;
    font-weight: 700;
}

.team-profile-btn {
    width: 100%;
    padding: 11px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: 0.2s;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
}

.team-profile-btn:hover {
    background: #1d4ed8;
}

.loading-text, .no-data {
    grid-column: 1 / -1;
    text-align: center;
    padding: 50px;
    color: #64748b;
    font-size: 16px;
    background: #fff;
    border-radius: 16px;
    border: 1px solid #e2e8f0;
}

</style>

</head>

<body>

    <!-- HEADER PLACEHOLDER -->
    <div id="header-container"></div>

    <!-- MAIN CONTAINER -->
    <div class="container">
        <div class="section-title">
            <h1>Meet Our Expert Team</h1>
            <p>The dedicated minds working behind the scenes to help students succeed.</p>
        </div>

        <!-- TEAM GRID LIST -->
        <div id="teamGridList" class="team-grid">
            <div class="loading-text">
                <i class="fa-solid fa-spinner fa-spin"></i> Loading Team Members...
            </div>
        </div>
    </div>

    <!-- FOOTER PLACEHOLDER -->
    <div id="footer-container"></div>


<script type="module">

/* =====================================================
   FETCH HEADER & FOOTER DYNAMICALLY
===================================================== */
async function loadIncludes() {
    try {
        // Load Header
        const headerRes = await fetch('header.html');
        if (headerRes.ok) {
            document.getElementById('header-container').innerHTML = await headerRes.text();
        }

        // Load Footer
        const footerRes = await fetch('fotter.html');
        if (footerRes.ok) {
            document.getElementById('footer-container').innerHTML = await footerRes.text();
        }
    } catch (error) {
        console.error("Error loading header/footer:", error);
    }
}

loadIncludes();


/* =====================================================
   FIREBASE IMPORT
===================================================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

/* =====================================================
   FIREBASE CONFIG
===================================================== */
const firebaseConfig = {
    apiKey: "AIzaSyAbg1Q1ZPgF7mwaxyin7iglla01eDk_tKo",
    authDomain: "diplomaengineers-869df.firebaseapp.com",
    databaseURL: "https://diplomaengineers-869df-default-rtdb.firebaseio.com",
    projectId: "diplomaengineers-869df",
    storageBucket: "diplomaengineers-869df.appspot.com",
    messagingSenderId: "356779436080",
    appId: "1:356779436080:web:4b28da380e547420d0e5f5"
};

/* =====================================================
   INITIALIZATION
===================================================== */
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const teamGridList = document.getElementById("teamGridList");

/* =====================================================
   LOAD TEAM MEMBERS PUBLICLY FROM FIREBASE
===================================================== */
function loadPublicTeamMembers() {
    const teamRef = ref(db, "team");

    onValue(teamRef, (snapshot) => {
        teamGridList.innerHTML = "";

        if (!snapshot.exists()) {
            teamGridList.innerHTML = `<div class="no-data"><i class="fa-solid fa-face-frown"></i> No team members found. Please add them from the admin panel.</div>`;
            return;
        }

        const items = [];
        snapshot.forEach((child) => {
            items.push({ id: child.key, ...child.val() });
        });

        // Latest added member will show first
        items.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

        items.forEach((item) => {
            const card = document.createElement("div");
            card.className = "team-card";

            let socialsHTML = '';
            if(item.whatsapp) socialsHTML += `<a href="${escapeHTML(item.whatsapp)}" target="_blank" class="social-icon-btn"><i class="fa-brands fa-whatsapp"></i></a>`;
            if(item.telegram) socialsHTML += `<a href="${escapeHTML(item.telegram)}" target="_blank" class="social-icon-btn"><i class="fa-brands fa-telegram"></i></a>`;
            if(item.youtube) socialsHTML += `<a href="${escapeHTML(item.youtube)}" target="_blank" class="social-icon-btn"><i class="fa-brands fa-youtube"></i></a>`;
            if(item.instagram) socialsHTML += `<a href="${escapeHTML(item.instagram)}" target="_blank" class="social-icon-btn"><i class="fa-brands fa-instagram"></i></a>`;

            card.innerHTML = `
                <div class="team-img-container">
                    <img src="${escapeHTML(item.photo)}" alt="${escapeHTML(item.name)}">
                </div>
                <h3>${escapeHTML(item.name)}</h3>
                <div class="team-role">${escapeHTML(item.role)}</div>
                <div class="team-department">${escapeHTML(item.dept)}</div>
                <div class="team-bio">${escapeHTML(item.bio)}</div>
                
                ${socialsHTML ? `<div class="team-socials">${socialsHTML}</div>` : ''}

                <div class="team-stats-row">
                    <div class="team-stat-box">
                        <span>Experience</span>
                        <strong>${escapeHTML(item.exp)}</strong>
                    </div>
                    <div class="team-stat-box">
                        <span>Role Type</span>
                        <strong>${escapeHTML(item.role.split('/')[0])}</strong>
                    </div>
                </div>

                <a href="${escapeHTML(item.profileLink)}" target="_blank" class="team-profile-btn">View Profile</a>
            `;

            teamGridList.appendChild(card);
        });
    }, (error) => {
        console.error("Team Load Error:", error);
        teamGridList.innerHTML = `<div class="no-data" style="color:#dc2626">Unable to load team members from database.</div>`;
    });
}

/* =====================================================
   HELPER: ESCAPE HTML
===================================================== */
function escapeHTML(value) {
    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

// Initialize on page load
loadPublicTeamMembers();

</script>

</body>
</html>
