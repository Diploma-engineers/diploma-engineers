<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News | Diploma Engineers</title>
<meta name="description" content="Diploma Engineers News Detail">
<link rel="icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Poppins,Arial,sans-serif}
body{background:#f6f9fd;color:#142033;overflow-x:hidden}
.page{width:100%;max-width:none;margin:0;padding:22px clamp(12px,3vw,48px) 100px}
.container{width:100%;max-width:1200px;margin:0 auto}
.back-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.back-btn,.share-btn{border:1px solid #dbe5f0;background:#fff;color:#2563eb;border-radius:11px;padding:10px 14px;font-weight:700;font-size:12px;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.share-btn{background:#2563eb;color:#fff;border-color:#2563eb}
.article{background:#fff;border:1px solid #e2eaf3;border-radius:22px;overflow:hidden;box-shadow:0 10px 35px rgba(15,23,42,.07)}
.article-header{padding:26px clamp(16px,3vw,36px) 18px}
.category{display:inline-flex;background:#eff6ff;color:#2563eb;padding:6px 10px;border-radius:999px;font-size:10px;font-weight:700;margin-bottom:10px}
h1{font-size:clamp(25px,4vw,42px);line-height:1.2;color:#0f172a;margin-bottom:13px;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:9px 18px;color:#64748b;font-size:12px}
.meta span{display:inline-flex;align-items:center;gap:6px}.meta i{color:#2563eb}
.hero{width:100%;max-height:560px;background:#eef3f8;display:flex;justify-content:center;align-items:center;overflow:hidden}
.hero img{display:block;width:100%;max-height:560px;object-fit:cover}
.article-body{padding:28px clamp(16px,5vw,70px) 36px}
.article-text{font-size:15px;line-height:1.9;color:#334155;overflow-wrap:anywhere}
.article-text h1,.article-text h2,.article-text h3{color:#0f172a;margin:20px 0 9px}.article-text p{margin:0 0 14px}.article-text ul,.article-text ol{padding-left:22px;margin:0 0 15px}.article-text a{color:#2563eb;text-decoration:underline}.article-text img{max-width:100%;height:auto;border-radius:12px}.article-text blockquote{border-left:4px solid #2563eb;background:#f8fafc;padding:12px 15px;margin:16px 0}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:25px;padding-top:20px;border-top:1px solid #e8eef5}.links a{display:inline-flex;align-items:center;gap:7px;text-decoration:none;background:#f1f5f9;color:#1e40af;border:1px solid #dbe5f0;padding:10px 13px;border-radius:10px;font-size:12px;font-weight:700}.links a.pdf{background:#fff1f2;color:#be123c;border-color:#fecdd3}.empty{padding:70px 20px;text-align:center;color:#64748b}.loading{padding:90px 20px;text-align:center;color:#2563eb}
.error-box{padding:30px;background:#fff1f2;color:#b91c1c;border:1px solid #fecaca;border-radius:14px}
@media(max-width:600px){.page{padding:10px 8px 80px}.back-row{margin-bottom:10px}.article{border-radius:16px}.article-header{padding:19px 14px 14px}.article-body{padding:20px 14px 28px}.hero,.hero img{max-height:300px}.article-text{font-size:14px;line-height:1.8}.back-btn,.share-btn{padding:9px 11px;font-size:11px}}
</style>
</head>
<body>
<div id="header-placeholder"></div>
<main class="page">
  <div class="container">
    <div class="back-row">
      <a class="back-btn" href="javascript:history.back()"><i class="fa-solid fa-arrow-left"></i> Back</a>
      <button class="share-btn" id="shareBtn" type="button"><i class="fa-solid fa-share-nodes"></i> Share</button>
    </div>
    <article class="article" id="article">
      <div class="loading" id="loading"><i class="fa-solid fa-spinner fa-spin"></i> Loading News...</div>
    </article>
  </div>
</main>
<div id="footer-placeholder"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyAbg1Q1ZPgF7mwaxyin7iglla01eDk_tKo",authDomain:"diplomaengineers-869df.firebaseapp.com",databaseURL:"https://diplomaengineers-869df-default-rtdb.firebaseio.com",projectId:"diplomaengineers-869df",storageBucket:"diplomaengineers-869df.appspot.com",messagingSenderId:"356779436080",appId:"1:356779436080:web:4b28da380e547420d0e5f5"};
const db=getDatabase(initializeApp(firebaseConfig));
const article=document.getElementById('article');
const id=new URLSearchParams(location.search).get('id');
let currentItem=null;
function esc(v){const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML}
function safeRichHtml(html,text){
  if(!html)return `<p>${esc(text||'No detailed news text available.')}</p>`;
  const box=document.createElement('div');box.innerHTML=html;
  box.querySelectorAll('script,iframe,object,embed,form,style,link').forEach(x=>x.remove());
  box.querySelectorAll('*').forEach(el=>{[...el.attributes].forEach(a=>{if(/^on/i.test(a.name))el.removeAttribute(a.name);if((a.name==='href'||a.name==='src')&&/^javascript:/i.test(a.value))el.removeAttribute(a.name)})});
  return box.innerHTML||`<p>${esc(text||'')}</p>`;
}
function formatDate(item){return item.date||((item.timestamp||0)?new Date(Number(item.timestamp)).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'')}
async function load(){
  if(!id){article.innerHTML='<div class="empty">News ID not found.</div>';return}
  try{
    const snap=await get(ref(db,'news/'+id));
    if(!snap.exists()){article.innerHTML='<div class="empty">This news could not be found.</div>';return}
    currentItem={id,...snap.val()};
    const item=currentItem, image=item.thumb||item.image||'';
    const author=item.authorName||item.ownerName||item.uploaderName||'Diploma Engineers';
    const role=item.designation||item.ownerDesignation||((item.authorUid==='KirLkZUGXoZf0cXHkuCZ4Mfnxam2')?'FOUNDER':'CONTENT ADMIN');
    const category=item.cat||item.category||'News';
    const date=formatDate(item);
    article.innerHTML=`
      <header class="article-header">
        <span class="category">${esc(category)}</span>
        <h1>${esc(item.title||'Untitled News')}</h1>
        <div class="meta">
          <span><i class="fa-regular fa-calendar"></i> ${esc(date)}</span>
          <span><i class="fa-regular fa-user"></i> By ${esc(author)}</span>
          <span><i class="fa-solid fa-user-tag"></i> ${esc(role)}</span>
        </div>
      </header>
      ${image?`<div class="hero"><img src="${esc(image)}" alt="${esc(item.title||'News')}"></div>`:''}
      <section class="article-body">
        <div class="article-text">${safeRichHtml(item.html,item.text||item.desc)}</div>
        ${(item.link||item.pdf)?`<div class="links">
          ${item.link?`<a href="${esc(item.link)}" target="_blank" rel="noopener"><i class="fa-solid fa-link"></i> External Link</a>`:''}
          ${item.pdf?`<a class="pdf" href="${esc(item.pdf)}" target="_blank" rel="noopener"><i class="fa-solid fa-file-pdf"></i> Open PDF / File</a>`:''}
        </div>`:''}
      </section>`;
    document.title=(item.title||'News')+' | Diploma Engineers';
  }catch(e){console.error(e);article.innerHTML=`<div class="article-body"><div class="error-box">Unable to load this news. ${esc(e.message||'Please try again.')}</div></div>`}
}
document.getElementById('shareBtn').addEventListener('click',async()=>{
  const url=location.href,title=currentItem?.title||'Diploma Engineers News';
  try{if(navigator.share)await navigator.share({title,text:title+' • Diploma Engineers',url});else if(navigator.clipboard){await navigator.clipboard.writeText(url);alert('News link copied successfully.')}else prompt('Copy news link:',url)}catch(e){if(e.name!=='AbortError')console.warn(e)}
});
async function fetchPart(id,file){
  const host=document.getElementById(id);
  if(!host)return;
  try{
    const r=await fetch(file,{cache:'no-store'});
    if(!r.ok) throw new Error(file+' returned '+r.status);
    const html=await r.text();
    const parser=new DOMParser();
    const doc=parser.parseFromString(html,'text/html');

    // header.html / footer.html may be complete HTML documents. Do not put
    // their <html>/<head> inside a <div>. Move their stylesheets/styles to
    // this page and inject only the body content.
    doc.querySelectorAll('link[rel="stylesheet"],style').forEach(node=>{
      const copy=node.cloneNode(true);
      if(node.tagName.toLowerCase()==='link'){
        const href=node.getAttribute('href');
        if(href){
          try{copy.href=new URL(href,new URL(file,location.href)).href}catch(_){ }
        }
      }
      document.head.appendChild(copy);
    });

    host.innerHTML=doc.body ? doc.body.innerHTML : html;

    // Re-run scripts from the fetched fragment because innerHTML does not
    // execute scripts. This keeps menu/dropdown/header behaviour working.
    const scripts=doc.body ? [...doc.body.querySelectorAll('script')] : [];
    for(const oldScript of scripts){
      const script=document.createElement('script');
      [...oldScript.attributes].forEach(a=>script.setAttribute(a.name,a.value));
      if(oldScript.src){
        script.src=new URL(oldScript.getAttribute('src'),new URL(file,location.href)).href;
      }else{
        script.textContent=oldScript.textContent;
      }
      host.appendChild(script);
    }
  }catch(e){
    console.warn('Could not fetch '+file,e);
    // Keep the page usable even if a shared header/footer file is missing.
    host.innerHTML='';
  }
}

(async()=>{
  // Load shared site chrome first, then render the Firebase news.
  await Promise.all([
    fetchPart('header-placeholder','header.html'),
    fetchPart('footer-placeholder','footer.html')
  ]);
  await load();
})();
</script>
</body>
</html>
