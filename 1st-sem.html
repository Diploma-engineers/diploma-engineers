/* =====================================================
GLOBAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f4f7fb;
    padding-top:80px;
    color:#0f172a;
}

/* =====================================================
MAIN SECTION
===================================================== */

.contact-section{

    min-height:100vh;

    padding:40px 15px 60px;

}

/* =====================================================
CONTACT CARD
===================================================== */

.contact-card{

    max-width:580px;

    margin:auto;

    background:#ffffff;

    border-radius:30px;

    padding:40px 30px;

    position:relative;

    overflow:hidden;

    box-shadow:0 15px 40px rgba(0,0,0,0.08);

}

.contact-card::before{

    content:"";

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:6px;

    background:linear-gradient(90deg,#ff9800,#ff5722,#2563eb);

}

/* =====================================================
ICON
===================================================== */

.icon-box{

    width:100px;
    height:100px;

    margin:auto;

    border-radius:28px;

    background:linear-gradient(135deg,#ff9800,#ff5722);

    display:flex;

    align-items:center;
    justify-content:center;

    color:white;

    font-size:40px;

    box-shadow:0 12px 30px rgba(255,152,0,0.25);

    margin-bottom:25px;

}

/* =====================================================
TITLE
===================================================== */

.contact-card h2{

    text-align:center;

    font-size:34px;

    font-weight:700;

    color:#0d1b2a;

    margin-bottom:10px;

}

.contact-card p{

    text-align:center;

    color:#64748b;

    font-size:15px;

    line-height:1.8;

}

/* =====================================================
INPUTS
===================================================== */

.input-box{

    margin-top:22px;

}

.input-box label{

    display:block;

    margin-bottom:10px;

    font-size:14px;

    font-weight:600;

    color:#334155;

}

.input-box input,
.input-box textarea{

    width:100%;

    padding:16px 18px;

    border-radius:16px;

    border:1px solid #cbd5e1;

    outline:none;

    font-size:15px;

    transition:0.3s;

    background:#f8fafc;

    resize:none;

}

.input-box input:focus,
.input-box textarea:focus{

    border-color:#2563eb;

    background:white;

    box-shadow:0 0 0 4px rgba(37,99,235,0.12);

}

/* =====================================================
BUTTON
===================================================== */

.btn-send{

    width:100%;

    margin-top:28px;

    padding:16px;

    border:none;

    border-radius:16px;

    background:linear-gradient(135deg,#ff9800,#ff5722);

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:0.3s;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:12px;

    box-shadow:0 12px 25px rgba(255,152,0,0.25);

}

.btn-send:hover{

    transform:translateY(-3px);

    box-shadow:0 18px 35px rgba(255,152,0,0.35);

}

/* =====================================================
INFO BOX
===================================================== */

.info-box{

    margin-top:25px;

    background:#eff6ff;

    border:1px solid #bfdbfe;

    padding:16px;

    border-radius:16px;

    font-size:14px;

    color:#1d4ed8;

    line-height:1.8;

    text-align:center;

}

/* =====================================================
CONTACT EXTRA
===================================================== */

.contact-extra{

    margin-top:22px;

    display:flex;

    flex-direction:column;

    gap:12px;

}

.contact-item{

    background:#f8fafc;

    border-radius:14px;

    padding:14px 16px;

    display:flex;

    align-items:center;

    gap:14px;

    color:#334155;

    font-size:14px;

}

.contact-item i{

    width:42px;
    height:42px;

    border-radius:12px;

    background:#eff6ff;

    color:#2563eb;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:18px;

}

/* =====================================================
MOBILE
===================================================== */

@media(max-width:768px){

    .contact-section{

        padding:25px 12px 50px;

    }

    .contact-card{

        padding:32px 20px;

        border-radius:24px;

    }

    .icon-box{

        width:85px;
        height:85px;

        font-size:34px;

    }

    .contact-card h2{

        font-size:28px;

    }

    .btn-send{

        font-size:15px;

    }

}

.section{

.section h2{

}

.section h2::after{
content:"";
width:80px;
height:4px;
background:linear-gradient(90deg,#2563eb,#06b6d4);
display:block;
margin:12px auto 0;
border-radius:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
}

.card{
background:#fff;
border-radius:22px;
padding:28px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.08);
border:1px solid #e5e7eb;
transition:.35s;
position:relative;
overflow:hidden;
}

.card::before{
content:"";
position:absolute;
left:0;
top:0;
width:100%;
height:5px;
background:linear-gradient(90deg,#2563eb,#06b6d4);
}

.card:hover{
transform:translateY(-10px);
box-shadow:0 20px 40px rgba(37,99,235,.18);
}

.card i{
width:80px;
height:80px;
line-height:80px;
background:#eff6ff;
color:#2563eb;
border-radius:50%;
font-size:32px;
margin-bottom:18px;
transition:.3s;
}

.card:hover i{
background:#2563eb;
color:#fff;
transform:rotate(10deg) scale(1.1);
}

.card h3{
font-size:22px;
font-weight:700;
margin-bottom:20px;
color:#0f172a;
}

.btn{
display:block;
margin:10px 0;
padding:13px;
text-decoration:none;
border-radius:12px;
background:#f8fafc;
border:1px solid #dbeafe;
color:#2563eb;
font-weight:600;
transition:.3s;
}

.btn:hover{
background:linear-gradient(135deg,#2563eb,#3b82f6);
color:#fff;
border-color:#2563eb;
transform:scale(1.03);
box-shadow:0 8px 20px rgba(37,99,235,.25);
}

@media(max-width:768px){

.section{
width:94%;
margin:40px auto;
}

.section h2{
font-size:28px;
}

.grid{
grid-template-columns:1fr;
gap:20px;
}

.card{
padding:22px;
border-radius:18px;
}

.card h3{
font-size:20px;
}

.card i{
width:70px;
height:70px;
line-height:70px;
font-size:28px;
}

.btn{
padding:12px;
font-size:14px;
}

}

</style>
