<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diploma Engineers News</title>


<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">


<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

font-family:'Poppins',sans-serif;

background:#f4f7fb;

color:#1e293b;

}



/* HERO */

.news-hero{

background:linear-gradient(135deg,#0d1b2a,#2563eb);

padding:100px 20px 70px;

text-align:center;

color:white;

border-radius:0 0 40px 40px;

}


.news-hero h1{

font-size:42px;

font-weight:800;

letter-spacing:.5px;

}


.news-hero p{

color:#dbeafe;

font-size:15px;

max-width:650px;

margin:15px auto;

}



/* NEWS CONTAINER */


.news-container{

max-width:900px;

margin:-40px auto 60px;

padding:20px;

}



/* CARD */


.card{


background:white;

border:none;

border-radius:25px;

padding:25px;

margin-bottom:25px;

box-shadow:0 15px 35px rgba(0,0,0,.08);

transition:.3s;

overflow:hidden;

}



.card:hover{

transform:translateY(-5px);

box-shadow:0 20px 45px rgba(0,0,0,.15);

}



.category{


background:#2563eb;

color:white;

padding:6px 16px;

border-radius:30px;

font-size:13px;

font-weight:500;

display:inline-block;

margin-bottom:15px;

}



.card h3{


font-size:24px;

font-weight:700;

color:#0f172a;

line-height:1.4;

}



.card img{


width:100%;

height:350px;

object-fit:cover;

border-radius:18px;

margin:15px 0;

}



.card p{


font-size:15px;

color:#475569;

line-height:1.8;

}



.pdf-btn{


display:inline-flex;

align-items:center;

gap:8px;

background:#2563eb;

color:white;

padding:12px 20px;

border-radius:12px;

text-decoration:none;

font-size:14px;

font-weight:600;

transition:.3s;

}



.pdf-btn:hover{

background:#1d4ed8;

color:white;

}



.date{


margin-top:20px;

display:inline-block;

background:#f1f5f9;

padding:6px 14px;

border-radius:20px;

font-size:13px;

color:#64748b;

}





.loading{


text-align:center;

padding:40px;

font-size:18px;

color:#64748b;

}



/* MOBILE */


@media(max-width:768px){


.news-hero{

padding:80px 20px 55px;

}


.news-hero h1{

font-size:32px;

}


.news-container{

padding:15px;

}


.card{

padding:20px;

}



.card h3{

font-size:20px;

}


.card img{

height:220px;

}


}


</style>


</head>


<body>



<!-- HEADER -->

<div id="header"></div>


<script>

fetch("header.html")

.then(res=>res.text())

.then(data=>{

document.getElementById("header").innerHTML=data;

});

</script>




<!-- HERO -->


<section class="news-hero">


<h1>

Latest News

</h1>


<p>

Diploma Engineers latest updates, notices, results, jobs and important announcements.

</p>


</section>





<div class="news-container">


<div id="newsList" class="loading">

Loading News...

</div>


</div>





<!-- FOOTER -->


<div id="footer"></div>


<script>

fetch("footer.html")

.then(res=>res.text())

.then(data=>{

document.getElementById("footer").innerHTML=data;

});

</script>





<!-- FIREBASE -->


<script type="module">


import {

db,
ref,
onValue

}

from "./firebase.js";



const newsList=document.getElementById("newsList");


const newsRef=ref(db,"news");




onValue(newsRef,(snapshot)=>{


newsList.innerHTML="";



if(!snapshot.exists()){


newsList.innerHTML="No News Available";

return;

}




let newsArray=[];



snapshot.forEach((child)=>{


newsArray.push({

id:child.key,

...child.val()

});


});



newsArray.reverse();



newsArray.forEach((n)=>{



newsList.innerHTML+=`


<div class="card">


<span class="category">

${n.cat || "News"}

</span>



<h3>

${n.title}

</h3>



${n.thumb ? 

`<img src="${n.thumb}" alt="News Image">`

:""

}




<p>

${n.desc}

</p>



${n.pdf ? 

`
<a class="link-btn" href="${n.pdf}" target="_blank">

<i class="fa-solid fa-arrow-up-right-from-square"></i>

Open Link


`

:""

}




<div class="date">

<i class="fa-regular fa-calendar"></i>

${n.date || ""}

</div>



</div>


`;



});


});



</script>




<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
