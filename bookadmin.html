<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Books Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#0f172a; -webkit-tap-highlight-color: transparent;}
.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}
h1,h2{margin:0}p{color:#64748b}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:0 5px 18px rgba(15,23,42,.05)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}
input{width:100%;padding:12px;border:1px solid #dbe1e8;border-radius:10px;font-size:14px;outline:0}input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}
button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#2563eb;color:#fff}.secondary{background:#e2e8f0;color:#0f172a}.danger{background:#fee2e2;color:#b91c1c}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.status{margin-top:12px;padding:10px;border-radius:9px;background:#eff6ff;color:#1d4ed8;font-size:13px;display:none}
.preview{margin-top:10px;display:none;align-items:center;gap:12px}.preview img{width:70px;height:90px;object-fit:cover;border-radius:8px}
table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:10px;border-bottom:1px solid #edf0f4;text-align:left;font-size:13px;vertical-align:middle}th{background:#f8fafc}
td img{width:45px;height:60px;object-fit:cover;border-radius:6px}.table{overflow:auto}.muted{font-size:12px;color:#64748b}
#app{display:none}#login{max-width:430px;margin:70px auto}
@media(max-width:700px){.wrap{padding:14px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="login" class="panel">
<h1>📚 Books Admin Login</h1><p>Use the same Firebase Admin account used by your existing admin system.</p>
<label>Email</label><input id="email" type="email" autocomplete="username">
<label style="margin-top:12px">Password</label><input id="password" type="password" autocomplete="current-password">
<div class="actions"><button class="primary" id="loginBtn">Login</button></div>
<div id="loginStatus" class="status"></div>
</div>

<div id="app" class="wrap">
<div class="top"><div><h1>📚 Books Admin</h1><p>Add multiple books, upload custom thumbnails, and manage entries seamlessly.</p></div>
<div class="actions"><button class="secondary" id="openBooks">Open Books Page</button><button class="danger" id="logout">Logout</button></div></div>

<div class="panel">
<h2 id="formTitle">Add Book</h2>
<form id="form">
<div class="grid" style="margin-top:15px">
<div><label>Book Title *</label><input id="title" required></div>
<div><label>Category</label><input id="category" value="Book PDF"></div>
<div class="full"><label>Book Link / PDF Link *</label><input id="pdf" type="url" placeholder="https://..." required></div>
<div class="full"><label>Thumbnail Upload (Supports Multiple Selection) *</label><input id="imageFile" type="file" accept="image/*" multiple required>
<div class="preview" id="preview"><img id="previewImg"><span id="previewText"></span></div></div>
</div>
<div class="actions"><button class="primary" id="saveBtn">Add Book(s)</button><button type="button" class="secondary" id="cancel" style="display:none">Cancel</button></div>
<div class="status" id="status"></div>
</form>
</div>

<div class="panel"><h2 style="margin-bottom:14px">Books</h2><div class="table"><table><thead><tr><th>Image</th><th>Title</th><th>Category</th><th>Link</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {getDatabase,ref,push,set,update,remove,onValue} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAbg1Q1ZPgF7mwaxyin7iglla01eDk_tKo",
  authDomain: "diplomaengineers-869df.firebaseapp.com",
  databaseURL: "https://diplomaengineers-869df-default-rtdb.firebaseio.com",
  projectId: "diplomaengineers-869df",
  storageBucket: "diplomaengineers-869df.appspot.com",
  messagingSenderId: "356779436080",
  appId: "1:356779436080:web:4b28da380e547420d0e5f5"
};
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getDatabase(app);
const CLOUD_NAME="ub0qgzwa", UPLOAD_PRESET="news_upload";

const $=id=>document.getElementById(id);
let books=[], editId=null;

function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function msg(text,error=false){$("status").textContent=text;$("status").style.display="block";$("status").style.background=error?"#fee2e2":"#eff6ff";$("status").style.color=error?"#b91c1c":"#1d4ed8"}
function loginMsg(t){$("loginStatus").textContent=t;$("loginStatus").style.display="block"}

$("loginBtn").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}catch(e){loginMsg(e.message)}};
$("logout").onclick=()=>signOut(auth);
$("openBooks").onclick=()=>window.open("books.html","_blank");

onAuthStateChanged(auth,user=>{
 $("login").style.display=user?"none":"block"; $("app").style.display=user?"block":"none";
 if(user) loadBooks();
});

function loadBooks(){
 onValue(ref(db,"books"),snap=>{
   books=[]; if(snap.exists()) snap.forEach(x=>books.push({id:x.key,...x.val()}));
   renderRows();
 },err=>msg("Firebase read failed: "+err.message,true));
}

function renderRows(){
 $("rows").innerHTML=books.length?books.map(b=>`<tr><td><img src="${esc(b.image)}" alt=""></td><td><b>${esc(b.title)}</b></td><td>${esc(b.category||"Book PDF")}</td><td><a href="${esc(b.pdf)}" target="_blank">Open</a></td><td><button class="secondary" data-edit="${b.id}">Edit</button> <button class="danger" data-del="${b.id}">Delete</button></td></tr>`).join(""):`<tr><td colspan="5" style="text-align:center;padding:30px">No books found</td></tr>`;
 document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editBook(b.dataset.edit));
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>deleteBook(b.dataset.del));
}

async function compress(file){
 return new Promise((resolve,reject)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{let w=im.width,h=im.height,m=1400;if(w>m){h=h*m/w;w=m}const c=document.createElement("canvas");c.width=Math.round(w);c.height=Math.round(h);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?resolve(new File([b],"book-thumb.jpg",{type:"image/jpeg"})):reject(new Error("Image compression failed")),"image/jpeg",.84)};im.onerror=reject;im.src=u});
}

function upload(file){
 return new Promise((resolve,reject)=>{const x=new XMLHttpRequest();x.open("POST",`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`);x.upload.onprogress=e=>{if(e.lengthComputable)msg("Uploading thumbnail "+Math.round(e.loaded/e.total*100)+"%...")};x.onload=()=>{try{const d=JSON.parse(x.responseText);if(x.status>=200&&x.status<300&&d.secure_url)resolve(d.secure_url);else reject(new Error(d.error?.message||"Cloudinary upload failed"))}catch(e){reject(new Error("Invalid Cloudinary response"))}};x.onerror=()=>reject(new Error("Cloudinary network error"));const f=new FormData();f.append("file",file);f.append("upload_preset",UPLOAD_PRESET);x.send(f)});
}

$("imageFile").onchange=()=>{
  const files=$("imageFile").files;
  if(files.length > 0){
    $("previewImg").src=URL.createObjectURL(files[0]);
    $("preview").style.display="flex";
    $("previewText").textContent=files.length > 1 ? `${files.length} images selected` : files[0].name;
  }
};

$("form").onsubmit=async e=>{
 e.preventDefault(); 
 const title=$("title").value.trim();
 const category=$("category").value.trim()||"Book PDF";
 const pdf=$("pdf").value.trim();
 const files=$("imageFile").files;

 if(!title||!pdf) return msg("Book title and link are required.",true);
 if(editId===null&&files.length===0) return msg("Please upload thumbnail image(s).",true);

 $("saveBtn").disabled=true;
 try{
   if(editId){
     let image=books.find(x=>x.id===editId)?.image;
     if(files.length > 0){
       msg("Preparing thumbnail...");
       image=await upload(await compress(files[0]));
     }
     const data={title,category,pdf,image,timestamp:Date.now()};
     await update(ref(db,"books/"+editId),data);
     msg("Book updated successfully.");
   } else {
     // Handle multiple uploads
     for(let i=0; i<files.length; i++){
       msg(`Uploading thumbnail ${i+1} of ${files.length}...`);
       let compressedFile = await compress(files[i]);
       let imageUrl = await upload(compressedFile);
       
       // If multiple files are uploaded with same title, append index or keep same
       let bookTitle = files.length > 1 ? `${title} (${i+1})` : title;
       const data={title: bookTitle, category, pdf, image: imageUrl, timestamp: Date.now() + i};
       await set(push(ref(db,"books")), data);
     }
     msg("Book(s) added successfully.");
   }
   reset();
 }catch(err){msg(err.message,true)}finally{$("saveBtn").disabled=false}
};

function editBook(id){
  const b=books.find(x=>x.id===id);if(!b)return;
  editId=id;
  $("title").value=b.title||"";
  $("category").value=b.category||"Book PDF";
  $("pdf").value=b.pdf||"";
  $("imageFile").required=false;
  $("formTitle").textContent="Edit Book";
  $("saveBtn").textContent="Update Book";
  $("cancel").style.display="inline-block";
  $("preview").style.display="flex";
  $("previewImg").src=b.image||"";
  $("previewText").textContent="Current thumbnail";
  window.scrollTo({top:0,behavior:"smooth"})
}

async function deleteBook(id){
  if(!confirm("Delete this book?"))return;
  try{
    await remove(ref(db,"books/"+id));
    msg("Book deleted.");
  }catch(e){
    msg(e.message,true);
  }
}

function reset(){
  editId=null;
  $("form").reset();
  $("category").value="Book PDF";
  $("formTitle").textContent="Add Book";
  $("saveBtn").textContent="Add Book(s)";
  $("cancel").style.display="none";
  $("preview").style.display="none";
  $("imageFile").required=true;
}

$("cancel").onclick=reset;
</script>
</body>
</html>
