<!-- BOOKS PAGE -->
<div id="booksPage" class="page">

  <div class="books-container">

    <!-- SEARCH + FILTER -->
    <div class="books-tools">

      <div class="books-search">
        <span>⌕</span>

        <input
          type="text"
          id="bookSearch"
          placeholder="Search books..."
          autocomplete="off"
        >
      </div>

      <div class="books-filter">

        <button class="filter-btn active" data-filter="all">
          All
        </button>

        <button class="filter-btn" data-filter="physics">
          Physics
        </button>

        <button class="filter-btn" data-filter="mathematics">
          Mathematics
        </button>

        <button class="filter-btn" data-filter="civil">
          Civil
        </button>

        <button class="filter-btn" data-filter="electrical">
          Electrical
        </button>

        <button class="filter-btn" data-filter="mechanical">
          Mechanical
        </button>

        <button class="filter-btn" data-filter="computer">
          Computer
        </button>

        <button class="filter-btn" data-filter="electronics">
          Electronics
        </button>

        <button class="filter-btn" data-filter="agriculture">
          Agriculture
        </button>

      </div>

    </div>


    <!-- BOOK COUNT -->
    <div class="books-result">
      <span id="bookCount">0 Books</span>
    </div>


    <!-- BOOKS WILL BE FETCHED HERE -->
    <div class="books-grid" id="booksGrid"></div>


    <!-- NO BOOKS -->
    <div class="no-books" id="noBooks" style="display:none;">

      <div class="no-books-icon">📚</div>

      <h3>No Books Found</h3>

      <p>Search करके दूसरी book try करें।</p>

    </div>

  </div>

</div>
