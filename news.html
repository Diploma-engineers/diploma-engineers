<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Diploma Engineers | Notifications
</title>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">


<link 
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}


body{

background:#f1f5f9;

padding:20px;

}



/* MAIN */


.notification-container{


max-width:900px;

margin:auto;

background:white;

padding:35px;

border-radius:25px;

box-shadow:0 10px 35px rgba(0,0,0,.08);


}



/* TITLE */


.title{


display:flex;

align-items:center;

gap:15px;

margin-bottom:30px;


}



.title i{


background:#eff6ff;

color:#2563eb;

padding:15px;

border-radius:15px;

font-size:22px;


}



.title h1{


font-size:28px;

color:#0f172a;


}





/* CARD */


.notice-card{


background:#fffbeb;

border-left:5px solid #f59e0b;

padding:22px;

border-radius:15px;

margin-bottom:18px;

transition:.3s;


}



.notice-card:hover{


transform:translateY(-3px);

box-shadow:0 8px 20px rgba(0,0,0,.08);


}




.notice-title{


display:flex;

gap:10px;

align-items:center;

font-size:18px;

font-weight:700;

color:#172554;

margin-bottom:10px;


}



.notice-title i{


color:#f59e0b;


}




.notice-text{


font-size:15px;

line-height:1.7;

color:#475569;

white-space:pre-line;

margin-bottom:12px;


}




.date{


color:#94a3b8;

font-size:13px;

font-weight:500;


}





/* LOADER */


.loading{


text-align:center;

padding:30px;

color:#64748b;


}




/* MOBILE */


@media(max-width:600px){


body{

padding:10px;

}


.notification-container{


padding:20px;


}


.title h1{

font-size:22px;

}



.notice-card{


padding:16px;

}


}



</style>


</head>



<body>



<div class="notification-container">



<div class="title">


<i class="fa-solid fa-bell"></i>


<h1>
Notifications
</h1>


</div>




<div id="notificationList">


<div class="loading">

Loading Notifications...

</div>


</div>



</div>







<script type="module">


import {initializeApp}

from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";



import {

getDatabase,

ref,

onValue

}

from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";






const firebaseConfig = {


apiKey:"AIzaSyAbg1Q1ZPgF7mwaxyin7iglla01eDk_tKo",

authDomain:"diplomaengineers-869df.firebaseapp.com",

databaseURL:"https://diplomaengineers-869df-default-rtdb.firebaseio.com",

projectId:"diplomaengineers-869df",

storageBucket:"diplomaengineers-869df.appspot.com",

messagingSenderId:"356779436080",

appId:"1:356779436080:web:4b28da380e547420d0e5f5"


};





const app=initializeApp(firebaseConfig);


const db=getDatabase(app);



const list=document.getElementById("notificationList");




function safe(text){

return text ? text : "";

}




onValue(ref(db,"notifications"),(snapshot)=>{



list.innerHTML="";



if(!snapshot.exists()){


list.innerHTML=`

<div class="loading">

No Notifications Available

</div>

`;

return;


}





let data=snapshot.val();



let keys=Object.keys(data).reverse();




keys.forEach(key=>{


let item=data[key];



list.innerHTML += `


<div class="notice-card">


<div class="notice-title">

<i class="fa-solid fa-bell"></i>

${safe(item.title)}

</div>



<div class="notice-text">

${safe(item.text)}

</div>



<div class="date">

${safe(item.date)}

</div>



</div>


`;



});



});



</script>



</body>

</html>
