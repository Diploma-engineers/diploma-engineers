<!-- =========================================================
     BOOKS PAGE
========================================================= -->

<div id="booksPage" class="page">

  <div class="books-container">

    <!-- =========================
         SEARCH + FILTER
    ========================== -->

    <div class="books-tools">

      <div class="books-search">
        <span class="search-icon">⌕</span>

        <input
          type="text"
          id="bookSearch"
          placeholder="Search books..."
          autocomplete="off"
          spellcheck="false"
        >
      </div>


    


    <!-- =========================
         BOOK COUNT
    ========================== -->

    <div class="books-result">
      <span id="bookCount">0 Books</span>
    </div>


    <!-- =========================
         BOOKS GRID
    ========================== -->

    <div
      class="books-grid"
      id="booksGrid"
      aria-live="polite"
    ></div>


    <!-- =========================
         NO BOOKS
    ========================== -->

    <div
      class="no-books"
      id="noBooks"
      style="display:none;"
    >

      <div class="no-books-icon">📚</div>

      <h3>No Books Found</h3>

      <p>Search करके दूसरी book try करें।</p>

    </div>

  </div>

</div>



<!-- =========================================================
     BOOKS CSS
========================================================= -->

<style>

* {
  box-sizing: border-box;
}


/* =========================================================
   BOOK PAGE
========================================================= */

#booksPage {
  width: 100%;
  min-height: 100vh;
  background: #f7f9fc;
}


.books-container {
  width: 100%;
  max-width: 1400px;
  margin: auto;
  padding: 20px;
}


/* =========================================================
   SEARCH + FILTER
========================================================= */

.books-tools {
  display: flex;
  flex-direction: column;
  gap: 16px;
}


/* SEARCH */

.books-search {
  width: 100%;
  height: 52px;

  display: flex;
  align-items: center;

  background: #ffffff;

  border: 1px solid #e5e7eb;
  border-radius: 14px;

  padding: 0 16px;

  box-shadow: 0 4px 15px rgba(0,0,0,0.04);

  transition:
    border-color 0.2s ease,
    box-shadow 0.2s ease;
}


.books-search:focus-within {
  border-color: #2563eb;

  box-shadow:
    0 0 0 3px rgba(37,99,235,0.08);
}


.search-icon {
  font-size: 25px;
  line-height: 1;

  color: #64748b;

  margin-right: 10px;

  pointer-events: none;
}


.books-search input {
  width: 100%;

  border: none;
  outline: none;

  background: transparent;

  font-size: 15px;

  color: #111827;
}


.books-search input::placeholder {
  color: #94a3b8;
}


/* =========================================================
   FILTER
========================================================= */

.books-filter {

  display: flex;

  gap: 9px;

  overflow-x: auto;

  padding: 2px 2px 8px;

  scrollbar-width: none;

  -webkit-overflow-scrolling: touch;
}


.books-filter::-webkit-scrollbar {
  display: none;
}


.filter-btn {

  flex-shrink: 0;

  border: 1px solid #e2e8f0;

  background: #ffffff;

  color: #475569;

  padding: 9px 15px;

  border-radius: 999px;

  font-size: 13px;

  font-weight: 600;

  cursor: pointer;

  transition:
    background 0.18s ease,
    color 0.18s ease,
    border-color 0.18s ease,
    transform 0.18s ease;

  -webkit-tap-highlight-color: transparent;

  user-select: none;
}


.filter-btn:hover {
  border-color: #2563eb;
  color: #2563eb;
}


.filter-btn:active {
  transform: scale(0.96);
}


.filter-btn.active {
  background: #2563eb;

  color: #ffffff;

  border-color: #2563eb;
}


/* Remove blue outline */

.filter-btn:focus,
.filter-btn:focus-visible {
  outline: none;
}


/* =========================================================
   BOOK COUNT
========================================================= */

.books-result {

  display: flex;

  align-items: center;

  margin: 20px 2px 14px;
}


#bookCount {

  font-size: 14px;

  font-weight: 700;

  color: #475569;
}


/* =========================================================
   BOOK GRID
========================================================= */

.books-grid {

  display: grid;

  grid-template-columns:
    repeat(auto-fill, minmax(190px, 1fr));

  gap: 18px;

  width: 100%;
}


/* =========================================================
   BOOK CARD
========================================================= */

.book-card {

  position: relative;

  background: #ffffff;

  border: 1px solid #e8edf3;

  border-radius: 16px;

  overflow: hidden;

  cursor: pointer;

  user-select: none;

  -webkit-user-select: none;

  -webkit-tap-highlight-color: transparent;

  -webkit-touch-callout: none;

  outline: none;

  transform: translateZ(0);

  transition:
    transform 0.18s ease,
    box-shadow 0.18s ease,
    border-color 0.18s ease;

  box-shadow:
    0 5px 18px rgba(15,23,42,0.05);
}


.book-card:hover {

  transform: translateY(-4px);

  border-color: #dbeafe;

  box-shadow:
    0 12px 28px rgba(15,23,42,0.10);
}


/* CLICK */

.book-card:active {

  transform: scale(0.975);

  transition-duration: 0.08s;
}


/* REMOVE BLUE FOCUS */

.book-card:focus,
.book-card:focus-visible,
.book-card:active {

  outline: none !important;
}


/* =========================================================
   BOOK IMAGE
========================================================= */

.book-cover {

  width: 100%;

  aspect-ratio: 3 / 4;

  background: #f1f5f9;

  overflow: hidden;

  position: relative;
}


.book-cover img {

  width: 100%;

  height: 100%;

  object-fit: cover;

  display: block;

  user-select: none;

  -webkit-user-select: none;

  -webkit-user-drag: none;

  pointer-events: none;

  transition:
    transform 0.25s ease;
}


.book-card:hover .book-cover img {

  transform: scale(1.025);
}


/* =========================================================
   BOOK CONTENT
========================================================= */

.book-info {

  padding: 13px;
}


.book-title {

  font-size: 15px;

  font-weight: 700;

  color: #111827;

  line-height: 1.35;

  display: -webkit-box;

  -webkit-line-clamp: 2;

  -webkit-box-orient: vertical;

  overflow: hidden;
}


.book-category {

  display: inline-block;

  margin-top: 8px;

  padding: 4px 8px;

  border-radius: 6px;

  background: #eff6ff;

  color: #2563eb;

  font-size: 11px;

  font-weight: 700;

  text-transform: capitalize;
}


/* =========================================================
   PDF ICON
========================================================= */

.book-pdf {

  position: absolute;

  top: 10px;

  right: 10px;

  padding: 5px 8px;

  border-radius: 6px;

  background: rgba(255,255,255,0.94);

  color: #dc2626;

  font-size: 10px;

  font-weight: 800;

  box-shadow:
    0 3px 10px rgba(0,0,0,0.10);

  pointer-events: none;
}


/* =========================================================
   NO BOOKS
========================================================= */

.no-books {

  text-align: center;

  padding: 70px 20px;

  color: #64748b;
}


.no-books-icon {

  font-size: 48px;

  margin-bottom: 12px;
}


.no-books h3 {

  margin: 0 0 8px;

  color: #1e293b;

  font-size: 20px;
}


.no-books p {

  margin: 0;

  font-size: 14px;
}


/* =========================================================
   LOADING
========================================================= */

.books-loading {

  grid-column: 1 / -1;

  text-align: center;

  padding: 50px 20px;

  color: #64748b;

  font-size: 14px;
}


.books-loading-spinner {

  width: 30px;

  height: 30px;

  margin: 0 auto 12px;

  border: 3px solid #e2e8f0;

  border-top-color: #2563eb;

  border-radius: 50%;

  animation: booksSpin 0.7s linear infinite;
}


@keyframes booksSpin {

  to {
    transform: rotate(360deg);
  }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

  .books-container {
    padding: 14px;
  }


  .books-grid {

    grid-template-columns:
      repeat(2, minmax(0, 1fr));

    gap: 12px;
  }


  .book-card {

    border-radius: 13px;
  }


  .book-info {

    padding: 10px;
  }


  .book-title {

    font-size: 13px;
  }


  .book-category {

    font-size: 10px;

    margin-top: 6px;
  }


  .books-search {

    height: 48px;
  }

}


/* =========================================================
   VERY SMALL MOBILE
========================================================= */

@media (max-width: 360px) {

  .books-grid {

    gap: 9px;
  }


  .books-container {

    padding: 10px;
  }

}


/* =========================================================
   IMPORTANT:
   REMOVE BLUE TAP FLASH EVERYWHERE
========================================================= */

.books-container,
.books-container *,
.books-grid,
.books-grid * {

  -webkit-tap-highlight-color: transparent !important;
}


.books-container img {

  -webkit-user-drag: none;

  user-select: none;

  -webkit-user-select: none;
}


/* Prevent text selection on cards */

.book-card,
.book-card * {

  user-select: none;

  -webkit-user-select: none;
}

</style>



<!-- =========================================================
     BOOKS JAVASCRIPT
========================================================= -->

<script>

(function () {

  "use strict";


  /* =========================================================
     ELEMENTS
  ========================================================== */

  const grid =
    document.getElementById("booksGrid");

  const search =
    document.getElementById("bookSearch");

  const count =
    document.getElementById("bookCount");

  const noBooks =
    document.getElementById("noBooks");

  const filterButtons =
    document.querySelectorAll(".filter-btn");


  if (!grid) return;


  /* =========================================================
     BOOK DATA
     
     Firebase से data आने पर इसी format में रखें:
     
     {
       title: "Applied Physics",
       category: "physics",
       image: "thumbnail.jpg",
       pdf: "https://....pdf"
     }
  ========================================================== */

  let books = [

    {
      title: "Applied Physics-II",
      category: "e-book",
      image: "",
      pdf: "https://anubhavfinance.wordpress.com/wp-content/uploads/2026/05/appliedphysics-iie-bookbydiplomaengineers28429.pdf"
    },

    {
      title: "Applied Mathematics 2nd",
      category: "e-book ",
      image: "https://anubhavfinance.wordpress.com/wp-content/uploads/2026/05/17785238848774900651388760755359.png",
      pdf: "https://anubhavfinance.wordpress.com/wp-content/uploads/2026/05/mathematics-ii_75660889_2026_05_09_15_4128129.pdf"
    },

    {
      title: "Construction Management",
      category: "e-book",
      image: "https://anubhavfinance.wordpress.com/wp-content/uploads/2026/05/file_00000000dbac7207a1d60542f858e24f8037818545726630343.png",
      pdf: "https://anubhavfinance.wordpress.com/wp-content/uploads/2024/11/construction-management-and-entrepreneur-development-1.pdf"
    },

    {
      title: "Mathmatics-1st",
      category: "book pdf",
      image: "https://via.placeholder.com/400x530?text=Electrical",
      pdf: "#"
    },

    {
      title: "Mechanical Engineering",
      category: "mechanical",
      image: "https://via.placeholder.com/400x530?text=Mechanical",
      pdf: "#"
    },

    {
      title: "Computer Engineering",
      category: "computer",
      image: "https://via.placeholder.com/400x530?text=Computer",
      pdf: "#"
    },

    {
      title: "Electronics Engineering",
      category: "electronics",
      image: "https://via.placeholder.com/400x530?text=Electronics",
      pdf: "#"
    },

    {
      title: "Agriculture Engineering",
      category: "agriculture",
      image: "https://via.placeholder.com/400x530?text=Agriculture",
      pdf: "#"
    }

  ];


  /* =========================================================
     CURRENT FILTER
  ========================================================== */

  let currentFilter = "all";


  /* =========================================================
     RENDER BOOKS
  ========================================================== */

  function renderBooks() {

    const query =
      search
        ? search.value.trim().toLowerCase()
        : "";


    const filteredBooks =
      books.filter(function (book) {

        const matchesFilter =
          currentFilter === "all" ||
          book.category === currentFilter;


        const matchesSearch =
          !query ||
          book.title
            .toLowerCase()
            .includes(query);


        return matchesFilter && matchesSearch;

      });


    /* COUNT */

    count.textContent =
      filteredBooks.length +
      (filteredBooks.length === 1
        ? " Book"
        : " Books");


    /* CLEAR */

    grid.innerHTML = "";


    /* NO BOOKS */

    if (!filteredBooks.length) {

      noBooks.style.display = "block";

      return;

    }


    noBooks.style.display = "none";


    /* CREATE CARDS */

    const fragment =
      document.createDocumentFragment();


    filteredBooks.forEach(function (book) {

      const card =
        document.createElement("div");


      card.className = "book-card";

      card.setAttribute(
        "role",
        "button"
      );


      card.setAttribute(
        "tabindex",
        "0"
      );


      card.innerHTML = `

        <div class="book-cover">

          <img
            src="${escapeHTML(book.image)}"
            alt="${escapeHTML(book.title)}"
            loading="lazy"
            draggable="false"
          >

          <span class="book-pdf">
            PDF
          </span>

        </div>

        <div class="book-info">

          <div class="book-title">
            ${escapeHTML(book.title)}
          </div>

          <span class="book-category">
            ${escapeHTML(book.category)}
          </span>

        </div>

      `;


      /* =====================================================
         DIRECT PDF CLICK
      ====================================================== */

      card.addEventListener(
        "click",
        function (event) {

          event.preventDefault();


          if (
            !book.pdf ||
            book.pdf === "#"
          ) {

            return;

          }


          /*
           * Smooth click
           */

          requestAnimationFrame(function () {

            window.location.href =
              book.pdf;

          });

        },
        {
          passive: false
        }
      );


      /* Keyboard support */

      card.addEventListener(
        "keydown",
        function (event) {

          if (
            event.key === "Enter" ||
            event.key === " "
          ) {

            event.preventDefault();

            card.click();

          }

        }
      );


      fragment.appendChild(card);

    });


    grid.appendChild(fragment);

  }


  /* =========================================================
     SEARCH
  ========================================================== */

  if (search) {

    search.addEventListener(
      "input",
      renderBooks
    );

  }


  /* =========================================================
     FILTER
  ========================================================== */

  filterButtons.forEach(
    function (button) {

      button.addEventListener(
        "click",
        function () {

          filterButtons.forEach(
            function (btn) {

              btn.classList.remove(
                "active"
              );

            }
          );


          button.classList.add(
            "active"
          );


          currentFilter =
            button.dataset.filter;


          renderBooks();

        }
      );

    }
  );


  /* =========================================================
     ESCAPE HTML
  ========================================================== */

  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================================================
     INITIAL RENDER
  ========================================================== */

  renderBooks();


})();

</script>
