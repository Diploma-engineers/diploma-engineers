<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f9fc;color:#111827; -webkit-tap-highlight-color: transparent;}
#booksPage{width:100%;min-height:100vh;background:#f7f9fc}.books-container{width:100%;max-width:1400px;margin:auto;padding:20px}
.books-search{height:52px;display:flex;align-items:center;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:0 16px;box-shadow:0 4px 15px #0000000a}
.search-icon{font-size:25px;color:#64748b;margin-right:10px}.books-search input{width:100%;border:0;outline:0;background:transparent;font-size:15px}
.books-result{margin:20px 2px 14px;display:flex;justify-content:space-between;align-items:center}#bookCount{font-size:14px;font-weight:700;color:#475569}
.books-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
.book-card{position:relative;background:#fff;border:1px solid #e8edf3;border-radius:16px;overflow:hidden;cursor:pointer;transition:.18s;box-shadow:0 5px 18px #0f172a0d; -webkit-tap-highlight-color: transparent; user-select: none;}
.book-card:hover{transform:translateY(-4px);box-shadow:0 12px 28px #0f172a1a}.book-cover{width:100%;aspect-ratio:3/4;background:#f1f5f9;overflow:hidden;position:relative}
.book-cover img{width:100%;height:100%;object-fit:cover;display:block}.book-info{padding:13px}
.book-title{font-size:15px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book-category{display:inline-block;margin-top:8px;padding:4px 8px;border-radius:6px;background:#eff6ff;color:#2563eb;font-size:11px;font-weight:700}
.book-pdf{position:absolute;top:10px;right:10px;padding:5px 8px;border-radius:6px;background:#fffffff2;color:#dc2626;font-size:10px;font-weight:800}
.no-books{text-align:center;padding:70px 20px;color:#64748b}.error{text-align:center;padding:40px;color:#b91c1c}

/* Pagination styles */
.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-top: 30px;
}
.pagination button {
  padding: 8px 14px;
  border: 1px solid #dbe1e8;
  background: #fff;
  border-radius: 8px;
  font-weight: 700;
  cursor: pointer;
  color: #0f172a;
  -webkit-tap-highlight-color: transparent;
}
.pagination button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.pagination button.active {
  background: #2563eb;
  color: #fff;
  border-color: #2563eb;
}

@media(max-width:600px){.books-container{padding:14px}.books-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.book-info{padding:10px}.book-title{font-size:13px}.books-search{height:48px}}
</style>
</head>
<body>
<div id="booksPage"><div class="books-container">
<div class="books-search"><span class="search-icon">⌕</span><input id="bookSearch" placeholder="Search books..." autocomplete="off"></div>
<div class="books-result"><span id="bookCount">0 Books</span></div>
<div class="books-grid" id="booksGrid"></div>
<div class="pagination" id="pagination"></div>
<div class="no-books" id="noBooks" style="display:none"><div style="font-size:48px">📚</div><h3>No Books Found</h3><p>Search करके दूसरी book try करें।</p></div>
<div class="error" id="error" style="display:none"></div>
</div></div>
<script type="module">

  },
  {

    category: "Book PDF",

    pdf: "https://anubhav.finance.blog/wp-content/uploads/2026/05/theoryofstructurese-bookbydiplomaengineers-2.pdf"

    category: "Book PDF",
    image: "https://anubhavfinance.wordpress.com/wp-content/uploads/2026/05/file_00000000b09c71faa3990755017401f45126630317016264298.png",
    pdf: "https://anubhav.finance.blog/wp-content/uploads/2026/05/waterresourceengineeringe-bookbydiplomaengineers-6.pdf"
  },
  {
    title: "Public Health Engineering",
    category: "Book PDF",
    image: "https://anubhavfinance.wordpress.com/wp-content/uploads/2026/05/file_00000000f45c72079311416363f02c394789402397388481580.png",
    pdf: "https://anubhav.finance.blog/wp-content/uploads/2026/05/publicheathengineeringe-bookbydiplomaengineers-4.pdf"
  }
];let books=[];
let currentPage = 1;
const itemsPerPage = 12;

const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

function render(){
 const q=$("bookSearch").value.trim().toLowerCase();
 const list=books.filter(b=>!q||String(b.title||"").toLowerCase().includes(q)||String(b.category||"").toLowerCase().includes(q));
 
 $("bookCount").textContent=list.length+(list.length===1?" Book":" Books");
 $("noBooks").style.display=list.length?"none":"block";
 
 const totalPages = Math.ceil(list.length / itemsPerPage) || 1;
 if(currentPage > totalPages) currentPage = 1;

 const start = (currentPage - 1) * itemsPerPage;
 const paginatedList = list.slice(start, start + itemsPerPage);

 $("booksGrid").innerHTML="";
 paginatedList.forEach(b=>{
  const c=document.createElement("article");c.className="book-card";c.onclick=()=>{if(b.pdf)window.open(b.pdf,"_blank","noopener")};
  c.innerHTML=`<div class="book-cover"><img src="${esc(b.image)}" alt="${esc(b.title)}" loading="lazy"><span class="book-pdf">PDF</span></div><div class="book-info"><div class="book-title">${esc(b.title)}</div><span class="book-category">${esc(b.category||"Book PDF")}</span></div>`;
  $("booksGrid").appendChild(c);
 });

 renderPagination(totalPages);
}

function renderPagination(totalPages){
 const pag=$("pagination");
 pag.innerHTML="";
 if(totalPages <= 1) return;

 const prevBtn = document.createElement("button");
 prevBtn.textContent = "Prev";
 prevBtn.disabled = currentPage === 1;
 prevBtn.onclick = () => { if(currentPage > 1) { currentPage--; render(); window.scrollTo({top:0, behavior:'smooth'}); } };
 pag.appendChild(prevBtn);

 for(let i=1; i<=totalPages; i++){
  const btn = document.createElement("button");
  btn.textContent = i;
  if(i === currentPage) btn.className = "active";
  btn.onclick = () => { currentPage = i; render(); window.scrollTo({top:0, behavior:'smooth'}); };
  pag.appendChild(btn);
 }

 const nextBtn = document.createElement("button");
 nextBtn.textContent = "Next";
 nextBtn.disabled = currentPage === totalPages;
 nextBtn.onclick = () => { if(currentPage < totalPages) { currentPage++; render(); window.scrollTo({top:0, behavior:'smooth'}); } };
 pag.appendChild(nextBtn);
}

$("bookSearch").oninput=()=>{ currentPage = 1; render(); };

onValue(ref(db,"books"),snap=>{
 books=[];if(snap.exists())snap.forEach(x=>books.push({id:x.key,...x.val()}));
 if(!books.length) books=seed.slice();
 render();
},err=>{ $("error").style.display="block";$("error").textContent="Books could not be loaded: "+err.message;books=seed.slice();render(); });
</script>
</body></html>
