<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Civil Engineering Study Library App</title>

<!-- Google Fonts & Font Awesome Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --secondary: #0f172a;
  --accent: #f97316;
  --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #e0e8ff 50%, #f5f3ff 100%);
  --card-bg: #ffffff;
  --text-dark: #0f172a;
  --text-muted: #64748b;
  --border-color: #e2e8f0;
  --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
  --shadow-hover: 0 20px 30px -5px rgba(37, 99, 235, 0.15);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Plus Jakarta Sans', sans-serif;
  scroll-behavior: smooth;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text-dark);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* APP HEADER */
header {
  background: rgba(15, 23, 42, 0.95);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: #fff;
  padding: 14px 20px;
  position: sticky;
  top: 0;
  z-index: 1000;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.header-container {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 1200px;
  margin: 0 auto;
}

.back-btn {
  color: #fff;
  text-decoration: none;
  background: rgba(255, 255, 255, 0.12);
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(255, 255, 255, 0.2);
  transition: all 0.3s ease;
}

.back-btn:hover {
  background: var(--primary);
  transform: translateX(-3px);
}

.brand-title {
  font-size: 18px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 10px;
  letter-spacing: -0.3px;
}

/* APP NAVIGATION BAR (TOP HORIZONTAL SCROLL) */
.nav-wrapper {
  max-width: 1200px;
  margin: 16px auto 8px;
  padding: 0 16px;
  width: 100%;
}

.top-btns {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(10px);
  padding: 8px;
  border-radius: 20px;
  box-shadow: var(--shadow);
  border: 1px solid rgba(255, 255, 255, 0.9);
  overflow-x: auto;
  scrollbar-width: none; /* Firefox */
}

.top-btns::-webkit-scrollbar {
  display: none; /* Chrome/Safari */
}

.branch-btn {
  padding: 10px 20px;
  border: none;
  border-radius: 14px;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-weight: 700;
  font-size: 13.5px;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  flex-shrink: 0;
}

.branch-btn.active {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
}

.branch-btn:hover:not(.active) {
  background: rgba(37, 99, 235, 0.1);
  color: var(--primary);
}

/* MAIN CONTENT CONTAINER */
main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 10px 16px 40px;
  width: 100%;
  flex: 1;
}

.branch-section {
  display: none;
  animation: fadeIn 0.35s ease-in-out forwards;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.section-header {
  text-align: center;
  margin: 20px 0 24px;
}

.section-header h2 {
  font-size: 24px;
  font-weight: 800;
  color: var(--secondary);
  letter-spacing: -0.5px;
}

.section-header p {
  color: var(--text-muted);
  font-size: 13.5px;
  margin-top: 4px;
}

/* APP GRID SYSTEM */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 18px;
}

/* APP CARDS */
.card {
  background: var(--card-bg);
  border-radius: 20px;
  padding: 20px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border-color);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-align: center;
  position: relative;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-hover);
  border-color: rgba(37, 99, 235, 0.3);
}

.card-icon-box {
  width: 52px;
  height: 52px;
  background: #eff6ff;
  color: var(--primary);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 14px;
  font-size: 22px;
}

.card h3 {
  font-size: 16px;
  font-weight: 700;
  color: var(--secondary);
  margin-bottom: 14px;
  line-height: 1.4;
}

/* BUTTON GRID INSIDE CARDS */
.btn-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: auto;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 12px;
  border-radius: 12px;
  background: #f1f5f9;
  color: var(--secondary);
  text-decoration: none;
  font-size: 12px;
  font-weight: 700;
  transition: all 0.2s ease;
  border: 1px solid var(--border-color);
}

.btn:hover {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
  transform: translateY(-2px);
}

.btn-primary {
  background: var(--primary);
  color: #fff;
  border: none;
  grid-column: span 2;
  padding: 11px;
}

.btn-primary:hover {
  background: var(--primary-hover);
}

/* E-NOTES CARD STYLES */
#enotes .card {
  padding: 0;
  overflow: hidden;
  text-align: left;
}

#enotes .card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-bottom: 1px solid var(--border-color);
}

#enotes .card-body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

#enotes .card h3 {
  font-size: 15px;
  margin-bottom: 14px;
}

/* ADMIN PROFILE STYLES */
.profile-wrapper {
  display: flex;
  justify-content: center;
  padding: 20px 0;
}

.profile-card {
  width: 100%;
  max-width: 400px;
  background: #fff;
  border-radius: 24px;
  padding: 28px 20px;
  text-align: center;
  box-shadow: var(--shadow);
  border: 1px solid var(--border-color);
}

.profile-img {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid var(--primary);
  box-shadow: 0 8px 20px rgba(37, 99, 235, 0.2);
  margin-bottom: 14px;
}

.branch-tag {
  display: inline-block;
  padding: 6px 16px;
  background: #dbeafe;
  color: var(--primary);
  border-radius: 30px;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 12px;
}

.name {
  font-size: 22px;
  font-weight: 800;
  color: var(--secondary);
  margin-bottom: 4px;
}

.role {
  color: var(--text-muted);
  font-size: 13.5px;
  margin-bottom: 20px;
}

.btn-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 16px;
}

.chat-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 12px;
  border-radius: 14px;
  text-decoration: none;
  font-weight: 700;
  font-size: 13.5px;
  transition: all 0.25s ease;
}

.call { background: #1e293b; color: #fff; }
.email { background: #ea580c; color: #fff; }
.whatsapp { background: #16a34a; color: #fff; }

.chat-btn:hover {
  transform: translateY(-2px);
  filter: brightness(1.08);
}

/* FLOATING FEEDBACK BUTTON */
.feedback-btn {
  position: fixed;
  right: 20px;
  bottom: 20px;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  cursor: pointer;
  z-index: 999;
  box-shadow: 0 10px 25px rgba(249, 115, 22, 0.4);
  transition: all 0.3s ease;
}

.feedback-btn:hover {
  transform: scale(1.08);
}

/* FEEDBACK POPUP */
.feedback-popup {
  position: fixed;
  right: 20px;
  bottom: 86px;
  width: 320px;
  background: #fff;
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 20px 40px rgba(15, 23, 42, 0.2);
  display: none;
  z-index: 9999;
  border: 1px solid var(--border-color);
  animation: slideUp 0.3s ease forwards;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

.feedback-popup h3 {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 12px;
  color: var(--secondary);
}

.feedback-popup input,
.feedback-popup select,
.feedback-popup textarea {
  width: 100%;
  padding: 10px 12px;
  margin-bottom: 10px;
  border: 1px solid var(--border-color);
  border-radius: 10px;
  font-size: 13px;
  outline: none;
}

.feedback-popup button {
  width: 100%;
  padding: 11px;
  border: none;
  border-radius: 10px;
  background: var(--primary);
  color: #fff;
  font-weight: 700;
  cursor: pointer;
}

/* FOOTER */
footer {
  background: var(--secondary);
  color: #94a3b8;
  text-align: center;
  padding: 20px;
  font-size: 13px;
  font-weight: 500;
  margin-top: auto;
}

@media(max-width: 600px) {
  .grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>


<h1>Latest News</h1>

<div id="newsList">Loading...</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

// Firebase Config
const firebaseConfig = {
apiKey: "AIzaSyAbg1Q1ZPgF7mwaxyin7iglla01eDk_tKo",
authDomain: "diplomaengineers-869df.firebaseapp.com",
databaseURL: "https://diplomaengineers-869df-default-rtdb.firebaseio.com",
projectId: "diplomaengineers-869df",
storageBucket: "diplomaengineers-869df.appspot.com",
messagingSenderId: "356779436080",
appId: "1:356779436080:web:4b28da380e547420d0e5f5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const newsList = document.getElementById("newsList");

onValue(ref(db,"news"),(snapshot)=>{

newsList.innerHTML="";

if(!snapshot.exists()){
newsList.innerHTML="<h3>No News Available</h3>";
return;
}

const data=snapshot.val();

Object.keys(data).reverse().forEach(id=>{

const item=data[id];

newsList.innerHTML += `
<div class="news">
<h3>${item.title}</h3>
<p>${item.text}</p>
<small>${item.date}</small>
</div>
`;

});

});

</script>

</body>
</html>
