<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expert Faculty - Team</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles matching your card layout components */
        .faculty-slider-wrapper {
            width: 100%;
            overflow-x: auto;
            padding: 2rem 1rem;
            scrollbar-width: thin;
        }
        .scroll-container {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .faculty-card {
            background: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            transition: all 0.3s ease;
            overflow: hidden;
            width: 280px;
            cursor: pointer;
            border: 1px solid #f1f5f9;
        }
        .faculty-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }
        .faculty-arch-bg {
            background: #e2e8f0;
            height: 260px;
            overflow: hidden;
            position: relative;
        }
        .faculty-arch-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .faculty-card:hover .faculty-arch-bg img {
            transform: scale(1.05);
        }
        .faculty-info {
            padding: 1.5rem;
            text-align: center;
        }
        .faculty-info h4 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.25rem;
        }
        .faculty-sub {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #64748b;
            margin-bottom: 0.75rem;
        }
        .exp-badge {
            display: inline-block;
            background-color: #eff6ff;
            color: #2563eb;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .section-title {
            text-align: center;
            font-size: 2.25rem;
            font-weight: 800;
            color: #0f172a;
            margin-top: 3rem;
            margin-bottom: 1rem;
        }
        .section-title span {
            color: #2563eb;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans antialiased">

    <!-- EXPERT FACULTY SECTION -->
    <div class="section-title">Expert <span>Faculty</span></div>
    
    <div class="faculty-slider-wrapper">
      <div class="scroll-container faculty-scroll" id="facultySlider">
        
        <!-- Faculty 1 -->
        <div class="faculty-card" onclick="openFacultyProfile('anubhav')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openFacultyProfile('anubhav')}">
          <div class="faculty-arch-bg">
            <img src="https://anubhavfinance.wordpress.com/wp-content/uploads/2025/09/1000210734.png" alt="Anubhav Gangwar">
          </div>
          <div class="faculty-info">
            <h4>Anubhav Gangwar</h4>
            <span class="faculty-sub">Founder / CEO</span>
            <div class="exp-badge">4+ Years Exp</div>
          </div>
        </div>

        <!-- Faculty 2 -->
        <div class="faculty-card" onclick="openFacultyProfile('mukesh')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openFacultyProfile('mukesh')}">
          <div class="faculty-arch-bg">
            <img src="https://anubhavfinance.wordpress.com/wp-content/uploads/2026/08/img_20260814_2345267399853346496252617.png" alt="Mukesh Singh">
          </div>
          <div class="faculty-info">
            <h4>Mukesh Singh</h4>
            <span class="faculty-sub">Co-founder / News Expert</span>
            <div class="exp-badge">4+ Years Exp</div>
          </div>
        </div>

        <!-- Faculty 3 -->
        <div class="faculty-card" onclick="openFacultyProfile('rambohd')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openFacultyProfile('rambohd')}">
          <div class="faculty-arch-bg">
            <img src="https://anubhavfinance.wordpress.com/wp-content/uploads/2026/08/img_20260814_2355137798351973400648930.png" alt="Rambohd Yadav">
          </div>
          <div class="faculty-info">
            <h4>Rambohd Yadav</h4>
            <span class="faculty-sub">Content Admin</span>
            <div class="exp-badge">3+ Years Exp</div>
          </div>
        </div>

      </div>
    </div>

    <!-- JavaScript Handler for Clicks/Interactions -->
    <script>
        function openFacultyProfile(profileId) {
            console.log("Opening profile for: " + profileId);
            // Add your custom redirection or modal display logic here
            alert("Viewing profile details for: " + profileId);
        }
    </script>

</body>
</html>
