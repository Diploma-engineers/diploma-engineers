<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Test Series | Diploma Engineers</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Inter,Arial}.top{height:66px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:11px}.logo{width:40px;height:40px;border-radius:11px;background:#0f2f63;color:#fff;display:grid;place-items:center}.brand b{font:700 16px Poppins}.brand small{display:block;color:#667085;font-size:10px}.wrap{max-width:1050px;margin:22px auto;padding:0 14px}.hero{background:linear-gradient(135deg,#0f2f63,#2563eb);color:#fff;padding:23px;border-radius:18px;margin-bottom:17px}.hero h1{font:800 24px Poppins;margin:0 0 5px}.hero p{margin:0;color:#dbeafe;font-size:12px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:19px;margin-bottom:17px}.card h2{font:700 17px Poppins;margin:0 0 15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:6px;color:#344054}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:9px;outline:0;background:#fff}.field textarea{min-height:90px;resize:vertical}.full{grid-column:1/-1}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:800;font-size:12px;cursor:pointer}.blue{background:#2563eb;color:#fff}.green{background:#16a34a;color:#fff}.gray{background:#eef2f6;color:#344054}.red{background:#fee2e2;color:#b42318}.import{border:1px dashed #98a2b3;padding:14px;border-radius:12px;background:#fafbfc}.import textarea{width:100%;min-height:300px;border:1px solid #d0d5dd;border-radius:9px;padding:12px;font:12px Consolas,monospace;resize:vertical}.count{float:right;background:#eff6ff;color:#1d4ed8;border-radius:20px;padding:6px 10px;font-size:10px}.q{border:1px solid #e5e7eb;border-radius:12px;padding:13px;margin:9px 0}.qhead{display:flex;justify-content:space-between}.qnum{font-weight:800;color:#2563eb;font-size:11px}.qtext{font-weight:700;font-size:13px;margin:7px 0}.opts{display:grid;grid-template-columns:1fr 1fr;gap:7px}.opt{font-size:12px;background:#f8fafc;padding:8px;border-radius:7px}.correct{background:#dcfce7;color:#166534;font-weight:800}.toast{position:fixed;right:18px;bottom:18px;background:#101828;color:#fff;padding:12px 15px;border-radius:10px;display:none;font-size:12px;z-index:20}.login{position:fixed;inset:0;background:#f4f7fb;display:grid;place-items:center;z-index:50}.loginbox{width:min(390px,92vw);background:#fff;border:1px solid #e5e7eb;border-radius:17px;padding:25px;box-shadow:0 20px 50px #0001}.loginbox input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:9px;margin:6px 0}.loginbox button{width:100%;padding:12px;border:0;border-radius:9px;background:#0f2f63;color:#fff;font-weight:800;margin-top:7px}.err{display:none;color:#b42318;background:#fef2f2;padding:9px;border-radius:8px;font-size:11px;margin:8px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.opts{grid-template-columns:1fr}.top{padding:0 12px}}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginbox">
<div class="brand"><div class="logo"><i class="fa-solid fa-clipboard-list"></i></div><div><b>Diploma Engineers</b><small>Test Series Creator</small></div></div>
<h2>Admin Login</h2><div id="err" class="err"></div>
<input id="email" type="email" placeholder="Admin Email"><input id="pass" type="password" placeholder="Password">
<button id="loginBtn">Login</button></div></div>

<header class="top"><div class="brand"><div class="logo"><i class="fa-solid fa-clipboard-list"></i></div><div><b>Test Series Creator</b><small>Diploma Engineers</small></div></div><button class="btn gray" id="logout">Logout</button></header>

<main class="wrap">
<section class="hero"><h1>Create Test Series</h1><p>बस Branch, Semester, Subject, Topic और MCQs डालें — test publish हो जाएगा।</p></section>

<section class="card"><h2>Test Information</h2><div class="grid">
<div class="field"><label>Branch *</label><select id="branch"><option value="">Select Branch</option><option>Civil Engineering</option><option>Electrical Engineering</option><option>Mechanical Engineering</option><option>Computer Science</option><option>Information Technology</option><option>Electronics Engineering</option><option>Agricultural Engineering</option><option>Other</option></select></div>
<div class="field"><label>Semester *</label><select id="semester"><option value="">Select Semester</option><option>1st Semester</option><option>2nd Semester</option><option>3rd Semester</option><option>4th Semester</option><option>5th Semester</option><option>6th Semester</option></select></div>
<div class="field"><label>Subject *</label><input id="subject" placeholder="Physics"></div>
<div class="field"><label>Topic *</label><input id="topic" placeholder="Basic Physics"></div>
<div class="field full"><label>Test Title *</label><input id="title" placeholder="Physics MCQ – 10 Questions"></div>
<div class="field"><label>Duration (minutes)</label><input id="duration" type="number" min="1" value="10"></div>
<div class="field"><label>Marks / Question</label><input id="marks" type="number" step=".25" value="1"></div>
<div class="field"><label>Negative Marking / Wrong</label><input id="negative" type="number" step=".25" value="0"></div>
<div class="field"><label>Pass Percentage</label><input id="pass" type="number" min="0" max="100" value="40"></div>
<div class="field full"><label>Description</label><textarea id="desc" placeholder="Short description"></textarea></div>
<div class="field full"><label>Instructions</label><textarea id="instructions" placeholder="Read all questions carefully..."></textarea></div>
</div></section>

<section class="card"><h2>MCQ Questions <span class="count" id="count">0 Questions</span></h2>
<div class="import"><textarea id="raw" placeholder="Example:
1. बल (Force) की SI इकाई क्या है?
A) Joule
B) Newton
C) Watt
D) Pascal
Answer: B) Newton

2. ..."></textarea>
<div class="tools"><button class="btn blue" id="parse"><i class="fa-solid fa-wand-magic-sparkles"></i> Parse MCQs</button><button class="btn gray" id="sample"><i class="fa-solid fa-flask"></i> Load Physics 10</button><button class="btn gray" id="clear">Clear</button></div></div>
<div id="questions"></div>
<div class="tools"><button class="btn green" id="publish"><i class="fa-solid fa-cloud-arrow-up"></i> CREATE & PUBLISH TEST</button></div>
</section>
</main><div id="toast" class="toast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import{getDatabase,ref,push,set}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const cfg={apiKey:"AIzaSyCxe9H7zSxJQzgM8bN_UAdOnDHr5myH6CQ",authDomain:"diploma-app-9a378.firebaseapp.com",databaseURL:"https://diploma-app-9a378-default-rtdb.firebaseio.com",projectId:"diploma-app-9a378",storageBucket:"diploma-app-9a378.firebasestorage.app",messagingSenderId:"160233059797",appId:"1:160233059797:web:be38130ed64f8bd0afb95c6",measurementId:"G-9646VK4C6L"};
const app=initializeApp(cfg),auth=getAuth(app),db=getDatabase(app);let questions=[];
const $=id=>document.getElementById(id);
const sample=`Physics MCQ – 10 Questions

1. बल (Force) की SI इकाई क्या है?
A) Joule
B) Newton
C) Watt
D) Pascal
Answer: B) Newton

2. प्रकाश की चाल निर्वात में कितनी होती है?
A) 3 × 10⁶ m/s
B) 3 × 10⁷ m/s
C) 3 × 10⁸ m/s
D) 3 × 10⁹ m/s
Answer: C) 3 × 10⁸ m/s

3. विद्युत धारा (Electric Current) की SI इकाई क्या है?
A) Volt
B) Ohm
C) Ampere
D) Coulomb
Answer: C) Ampere

4. कार्य (Work) की SI इकाई क्या है?
A) Watt
B) Joule
C) Newton
D) Pascal
Answer: B) Joule

5. पृथ्वी पर गुरुत्वीय त्वरण (g) का लगभग मान कितना है?
A) 8.9 m/s²
B) 9.8 m/s²
C) 10.8 m/s²
D) 12.8 m/s²
Answer: B) 9.8 m/s²

6. Ohm’s Law का सही सूत्र कौन-सा है?
A) V = IR
B) V = I/R
C) R = VI
D) I = VR
Answer: A) V = IR

7. शक्ति (Power) की SI इकाई क्या है?
A) Joule
B) Newton
C) Watt
D) Volt
Answer: C) Watt

8. ध्वनि (Sound) किस माध्यम में यात्रा नहीं कर सकती?
A) Solid
B) Liquid
C) Gas
D) Vacuum
Answer: D) Vacuum

9. किसी वस्तु का द्रव्यमान (Mass) किससे मापा जाता है?
A) Spring balance
B) Beam balance
C) Barometer
D) Ammeter
Answer: B) Beam balance

10. विद्युत प्रतिरोध (Resistance) की SI इकाई क्या है?
A) Ohm
B) Ampere
C) Volt
D) Watt
Answer: A) Ohm`;

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function toast(s){$("toast").textContent=s;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2600)}
function parse(raw){let lines=raw.replace(/\r/g,"").split("\n").map(x=>x.trim()).filter(Boolean),out=[],q=null;
for(const l of lines){let qm=l.match(/^(?:Q(?:uestion)?\s*)?(\d+)[.)\-:]\s*(.+)$/i),om=l.match(/^([ABCD])[.)\-:]\s*(.+)$/i),am=l.match(/^answer\s*:\s*([ABCD])/i);
if(qm){if(q)out.push(q);q={question:qm[2],options:["","","",""],answer:""}}
else if(q&&om)q.options["ABCD".indexOf(om[1].toUpperCase())]=om[2];
else if(q&&am)q.answer=am[1].toUpperCase();
}
if(q)out.push(q);return out.filter(q=>q.question&&q.options.every(Boolean)&&/^[ABCD]$/.test(q.answer))}
function render(){ $("count").textContent=questions.length+" Questions";$("questions").innerHTML=questions.length?questions.map((q,i)=>`<div class="q"><div class="qhead"><span class="qnum">QUESTION ${i+1}</span></div><div class="qtext">${esc(q.question)}</div><div class="opts">${q.options.map((o,j)=>`<div class="opt ${q.answer==="ABCD"[j]?"correct":""}"><b>${"ABCD"[j]})</b> ${esc(o)}</div>`).join("")}</div><div style="font-size:11px;margin-top:8px">Correct: <b>${q.answer}</b></div></div>`).join(""):'<div style="text-align:center;color:#667085;padding:25px">No questions imported.</div>'}
$("parse").onclick=()=>{let p=parse($("raw").value);if(!p.length)return toast("Valid MCQ format नहीं मिला");questions=p;render();toast(p.length+" questions imported")};
$("sample").onclick=()=>{$("branch").value="Civil Engineering";$("semester").value="1st Semester";$("subject").value="Physics";$("topic").value="Basic Physics";$("title").value="Physics MCQ – 10 Questions";$("duration").value=10;$("marks").value=1;$("negative").value=0;$("pass").value=40;$("desc").value="Basic Physics MCQ Test for Diploma Engineers.";$("instructions").value="Read each question carefully. Select one correct answer. Do not refresh the page during the test.";$("raw").value=sample;let p=parse(sample);questions=p;render();toast("Physics 10 MCQ ready")};
$("clear").onclick=()=>{questions=[];render();$("raw").value=""};
$("publish").onclick=async()=>{if(!$("branch").value||!$("semester").value||!$("subject").value.trim()||!$("topic").value.trim()||!$("title").value.trim())return toast("Branch, Semester, Subject, Topic and Title required");if(!questions.length)return toast("पहले MCQs Parse करें");
const r=push(ref(db,"testSeries"));await set(r,{title:$("title").value.trim(),branch:$("branch").value,semester:$("semester").value,subject:$("subject").value.trim(),topic:$("topic").value.trim(),durationMinutes:+$("duration").value||10,marksPerQuestion:+$("marks").value||1,negativeMark:+$("negative").value||0,passPercentage:+$("pass").value||0,description:$("desc").value.trim(),instructions:$("instructions").value.trim(),questions,questionCount:questions.length,status:"published",active:true,createdAt:Date.now(),createdBy:auth.currentUser.uid});toast("Test Series Published Successfully");setTimeout(()=>location.href="test-series.html",900)};
$("loginBtn").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("pass").value);$("err").style.display="none"}catch(e){$("err").textContent="Login failed: "+e.message;$("err").style.display="block"}};
$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{$("login").style.display=u?"none":"grid"});
render();
</script></body></html>
