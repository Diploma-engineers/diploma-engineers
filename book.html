<script>

/* =========================
   BOOK DATABASE
   नई BOOK यहां ADD करें
========================= */

const books = [

  {
    title: "Applied Physics 2nd",
    description: "Diploma Engineering Physics PDF",
    category: "physics",
    categoryName: "Physics",
    image:
      "https://anubhavfinance.wordpress.com/wp-content/uploads/2026/05/17785269967038020828650364357425.png",
    pdf:
      "https://anubhavfinance.wordpress.com/wp-content/uploads/2026/05/appliedphysics-iie-bookbydiplomaengineers28129-2.pdf"
  },

  {
    title: "Applied Mathematics 2nd",
    description: "Diploma Engineering Maths PDF",
    category: "mathematics",
    categoryName: "Mathematics",
    image:
      "https://anubhavfinance.wordpress.com/wp-content/uploads/2026/05/17785238848774900651388760755359.png",
    pdf:
      "https://anubhavfinance.wordpress.com/wp-content/uploads/2026/05/mathematics-ii_75660889_2026_05_09_15_4128129.pdf"
  }

  /*
  नई BOOK का example:

  ,{
    title: "Book Name",
    description: "Diploma Engineering Book",
    category: "civil",
    categoryName: "Civil",
    image: "IMAGE_URL",
    pdf: "PDF_URL"
  }

  */


];


/* =========================
   ELEMENTS
========================= */

const booksGrid = document.getElementById("booksGrid");
const bookSearch = document.getElementById("bookSearch");
const bookCount = document.getElementById("bookCount");
const noBooks = document.getElementById("noBooks");

let currentFilter = "all";


/* =========================
   RENDER BOOKS
========================= */

function renderBooks() {

  const searchText =
    bookSearch.value.trim().toLowerCase();

  const filteredBooks = books.filter(book => {

    const matchesFilter =
      currentFilter === "all" ||
      book.category === currentFilter;

    const matchesSearch =
      book.title.toLowerCase().includes(searchText) ||
      book.description.toLowerCase().includes(searchText) ||
      book.categoryName.toLowerCase().includes(searchText);

    return matchesFilter && matchesSearch;

  });


  booksGrid.innerHTML = "";


  if (filteredBooks.length === 0) {

    noBooks.style.display = "block";
    bookCount.textContent = "0 Books";

    return;

  }


  noBooks.style.display = "none";


  bookCount.textContent =
    `${filteredBooks.length} ${filteredBooks.length === 1 ? "Book" : "Books"}`;


  const fragment = document.createDocumentFragment();


  filteredBooks.forEach(book => {

    const card = document.createElement("a");

    card.className = "book-card";

    /*
      Direct PDF
      Browser PDF viewer में खुलेगा
    */
    card.href = book.pdf;
    card.target = "_blank";
    card.rel = "noopener noreferrer";


    card.innerHTML = `

      <div class="book-image">

        <img
          src="${book.image}"
          alt="${book.title}"
          loading="lazy"
          decoding="async"
        >

        <span class="pdf-badge">PDF</span>

        <span class="open-badge">
          Open PDF
        </span>

      </div>

      <div class="book-card-content">

        <h3>${book.title}</h3>

        <p>${book.description}</p>

        <div class="book-meta">

          <span class="book-category">
            ${book.categoryName}
          </span>

          <span class="book-read">
            Read →
          </span>

        </div>

      </div>

    `;


    fragment.appendChild(card);

  });


  booksGrid.appendChild(fragment);

}


/* =========================
   SEARCH
========================= */

bookSearch.addEventListener("input", renderBooks);


/* =========================
   CATEGORY FILTER
========================= */

document
  .querySelectorAll(".filter-btn")
  .forEach(button => {

    button.addEventListener("click", function() {

      document
        .querySelectorAll(".filter-btn")
        .forEach(btn => {
          btn.classList.remove("active");
        });


      this.classList.add("active");


      currentFilter =
        this.dataset.filter;


      renderBooks();

    });

  });


/* =========================
   INITIAL LOAD
========================= */

renderBooks();

</script>
