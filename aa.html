<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashoka Batch | Civil Engineering Light App</title>

<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* LIGHT THEME VARIABLES (DEFAULT) */
:root {
    --bg-main: #f8fafc;
    --card-bg: #ffffff;
    --text-primary: #1e293b;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --accent-purple: #6c5ce7;
    --accent-hover: #5b4bc4;
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
}

/* DARK THEME (LIGHT OFF) VARIABLES */
body.dark-mode {
    --bg-main: #0f172a;
    --card-bg: #1e293b;
    --text-primary: #f8fafc;
    --text-muted: #94a3b8;
    --border-color: #334155;
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.5);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
}

body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    min-height: 100vh;
}

/* TOP BAR */
.topbar {
    height: 60px;
    background: var(--card-bg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    border-bottom: 1px solid var(--border-color);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow-sm);
}

.logo {
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
}

.logo span {
    color: var(--accent-purple);
}

/* POWER / LIGHT OFF TOGGLE BUTTON */
.power-btn {
    background: var(--bg-main);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 16px;
    box-shadow: var(--shadow-sm);
}

.power-btn:hover {
    background: var(--accent-purple);
    color: white;
    border-color: var(--accent-purple);
}

/* HERO ZOOMING HEADER */
.hero-header {
    background: linear-gradient(135deg, #6c5ce7, #8b5cf6);
    padding: 24px 16px;
    text-align: center;
    color: white;
    box-shadow: 0 4px 15px rgba(108, 92, 231, 0.25);
    overflow: hidden;
}

.hero-content {
    animation: zoomAnimation 0.8s ease-out forwards;
}

.hero-title {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 4px;
}

.hero-subtitle {
    font-size: 13px;
    opacity: 0.9;
}

@keyframes zoomAnimation {
    0% {
        transform: scale(0.85);
        opacity: 0;
    }
    100% {
        transform: scale(1);
        opacity: 1;
    }
}

/* MAIN APP CONTAINER */
.container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 16px;
}

/* SECTION HEADERS */
.section-header {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
}

/* 1. SUBJECTS PAGE (FIRST VIEW) */
.subject-page {
    display: block; /* Visible by default */
}

.subjects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
}

.subject-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: all 0.3s ease;
}

.subject-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-md);
    border-color: var(--accent-purple);
}

.subject-icon {
    font-size: 32px;
    color: var(--accent-purple);
    margin-bottom: 12px;
}

.subject-name {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 4px;
}

.subject-count {
    font-size: 12px;
    color: var(--text-muted);
}

/* 2. LECTURES & PLAYER PAGE (HIDDEN INITIALLY) */
.lecture-page {
    display: none; /* Hidden until subject click */
}

.back-btn {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
}

.back-btn:hover {
    background: var(--accent-purple);
    color: white;
    border-color: var(--accent-purple);
}

/* LAYOUT GRID */
.video-layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
}

@media (min-width: 850px) {
    .video-layout {
        grid-template-columns: 1.8fr 1.2fr;
    }
}

/* VIDEO PLAYER */
.video-wrapper {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--shadow-md);
}

.video-wrapper iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

.video-details {
    background: var(--card-bg);
    padding: 16px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    margin-top: 12px;
    box-shadow: var(--shadow-sm);
}

.video-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 4px;
}

.video-sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 12px;
}

/* ACTIONS BAR */
.actions-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    border-top: 1px solid var(--border-color);
    padding-top: 10px;
}

.act-btn {
    flex: 1;
    min-width: 75px;
    background: var(--bg-main);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    padding: 8px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
}

.act-btn:hover {
    background: var(--accent-purple);
    color: white;
}

.act-btn.liked {
    color: #ef4444;
    background: rgba(239, 68, 68, 0.1);
}

/* PLAYLIST SIDEBAR */
.playlist-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 14px;
    max-height: 500px;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-sm);
}

.playlist-title {
    font-size: 14px;
    font-weight: 700;
    padding-bottom: 10px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--border-color);
}

.playlist-items {
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.lecture-item {
    display: flex;
    gap: 10px;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background: var(--bg-main);
    cursor: pointer;
    transition: all 0.2s;
}

.lecture-item:hover, .lecture-item.active {
    border-color: var(--accent-purple);
    background: rgba(108, 92, 231, 0.08);
}

.thumb-box {
    width: 85px;
    height: 50px;
    background: #000;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 12px;
    flex-shrink: 0;
}

.lecture-info {
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.lecture-info-title {
    font-size: 12px;
    font-weight: 600;
    line-clamp: 2;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.lecture-duration {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
}

/* COMMENTS */
.comments-box {
    margin-top: 14px;
    background: var(--card-bg);
    padding: 14px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
}

.comment-input {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.comment-input input {
    flex: 1;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    background: var(--bg-main);
    color: var(--text-primary);
    outline: none;
}
</style>
</head>
<body>

<!-- TOP BAR -->
<header class="topbar">
    <div class="logo">
        <i class="fa-solid fa-graduation-cap" style="color: var(--accent-purple);"></i>
        Diploma <span>Engineers</span>
    </div>
    
    <!-- LIGHT OFF / POWER BUTTON -->
    <button class="power-btn" onclick="toggleLightOff()" title="Toggle Light Off (Dark Mode)">
        <i class="fa-solid fa-power-off"></i>
    </button>
</header>

<!-- HERO ZOOMING HEADER -->
<section class="hero-header">
    <div class="hero-content">
        <h1 class="hero-title">🏗️ Ashoka Batch : Civil Engineering</h1>
        <p class="hero-subtitle">BTEUP Diploma Online Video Classes & Notes</p>
    </div>
</section>

<!-- APP BODY CONTAINER -->
<div class="container">

    <!-- 1. SUBJECTS PAGE (FIRST SCREEN) -->
    <div class="subject-page" id="subjectsPage">
        <div class="section-header">
            <i class="fa-solid fa-book-open" style="color: var(--accent-purple);"></i>
            Select Subject (सब्जेक्ट चुनें)
        </div>
        
        <div class="subjects-grid" id="subjectsGrid">
            <!-- Subjects will load dynamically -->
        </div>
    </div>

    <!-- 2. LECTURES & VIDEO PLAYER PAGE (PLAYLIST VIEW) -->
    <div class="lecture-page" id="lecturesPage">
        
        <!-- BACK BUTTON -->
        <button class="back-btn" onclick="goBackToSubjects()">
            <i class="fa-solid fa-arrow-left"></i> ← Back to Subjects
        </button>

        <div class="video-layout">
            
            <!-- LEFT: VIDEO PLAYER & DETAILS -->
            <div>
                <div class="video-wrapper">
                    <iframe id="cloudinaryPlayer" 
                        src="https://player.cloudinary.com/embed/?cloud_name=h7g2sxct&public_id=VID_20260812_101229_651" 
                        allow="autoplay; fullscreen; encrypted-media; picture-in-picture" 
                        allowfullscreen>
                    </iframe>
                </div>

                <div class="video-details">
                    <div class="video-title" id="activeTitle">Select Lecture</div>
                    <div class="video-sub" id="activeMeta">Ashoka Batch • Civil Engineering</div>

                    <!-- Actions -->
                    <div class="actions-bar">
                        <button class="act-btn" id="likeBtn" onclick="toggleLike()">
                            <i class="fa-regular fa-thumbs-up"></i> <span id="likeCount">120</span>
                        </button>
                        <button class="act-btn" onclick="focusComment()">
                            <i class="fa-regular fa-comment"></i> Comment
                        </button>
                        <button class="act-btn" onclick="rateVideo()">
                            <i class="fa-regular fa-star"></i> Rating
                        </button>
                        <button class="act-btn" onclick="downloadPdf()">
                            <i class="fa-solid fa-file-pdf"></i> Download PDF
                        </button>
                        <button class="act-btn" onclick="shareVideo()">
                            <i class="fa-solid fa-share-nodes"></i> Share
                        </button>
                    </div>
                </div>

                <!-- COMMENTS BOX -->
                <div class="comments-box">
                    <div style="font-size: 13px; font-weight: 700;">Lecture Discussion</div>
                    <div class="comment-input">
                        <input type="text" id="commentField" placeholder="Ask a doubt or comment...">
                        <button class="act-btn" style="background: var(--accent-purple); color: white;" onclick="postComment()">Post</button>
                    </div>
                    <div id="commentList" style="margin-top: 10px; font-size: 12px; display: flex; flex-direction: column; gap: 6px;">
                        <div><strong>Rahul Kumar:</strong> Excellent explanation sir!</div>
                    </div>
                </div>
            </div>

            <!-- RIGHT: LECTURE PLAYLIST -->
            <div class="playlist-card">
                <div class="playlist-title" id="selectedSubjectTitle">Subject Playlist</div>
                <div class="playlist-items" id="playlistItems">
                    <!-- Lectures list dynamically loads -->
                </div>
            </div>

        </div>
    </div>

</div>

<script>
// Data Architecture for Ashoka Batch
const civilBatchData = {
    "Building Materials (BMC)": {
        icon: "fa-building",
        videos: [
            { id: "VID_20260812_101229_651", title: "BMC 14 : Rock and Stone (Part 04)", time: "1h 15m" },
            { id: "VID_20260812_101229_651", title: "BMC 15 : Bricks Classification & Testing", time: "48m" },
            { id: "VID_20260812_101229_651", title: "BMC 16 : Cement Composition & Manufacture", time: "55m" }
        ]
    },
    "Soil Mechanics": {
        icon: "fa-mountain-city",
        videos: [
            { id: "VID_20260812_101229_651", title: "Soil Mechanics 01 : Physical Properties of Soil", time: "50m" },
            { id: "VID_20260812_101229_651", title: "Soil Mechanics 02 : Permeability & Seepage Analysis", time: "1h 02m" }
        ]
    },
    "Fluid Mechanics": {
        icon: "fa-droplet",
        videos: [
            { id: "VID_20260812_101229_651", title: "FM 01 : Fluid Properties & Hydrostatic Forces", time: "42m" },
            { id: "VID_20260812_101229_651", title: "FM 02 : Bernoulli's Theorem Applications", time: "58m" }
        ]
    },
    "Surveying": {
        icon: "fa-compass-drafting",
        videos: [
            { id: "VID_20260812_101229_651", title: "Surveying 01 : Linear Measurements & Ranging", time: "45m" }
        ]
    }
};

const cloudName = "h7g2sxct";
let isLiked = false;

// Initialize
window.onload = function() {
    renderSubjectsPage();
};

// Render Subjects Grid (First Page)
function renderSubjectsPage() {
    const grid = document.getElementById("subjectsGrid");
    grid.innerHTML = "";

    Object.keys(civilBatchData).forEach(subjectKey => {
        const item = civilBatchData[subjectKey];
        const card = document.createElement("div");
        card.className = "subject-card";
        card.onclick = () => openSubjectPlaylist(subjectKey);

        card.innerHTML = `
            <div class="subject-icon"><i class="fa-solid ${item.icon}"></i></div>
            <div class="subject-name">${subjectKey}</div>
            <div class="subject-count">${item.videos.length} Lectures</div>
        `;
        grid.appendChild(card);
    });
}

// Open Lecture Playlist & Player Page
function openSubjectPlaylist(subjectKey) {
    document.getElementById("subjectsPage").style.display = "none";
    document.getElementById("lecturesPage").style.display = "block";
    document.getElementById("selectedSubjectTitle").innerText = subjectKey;

    const playlistContainer = document.getElementById("playlistItems");
    playlistContainer.innerHTML = "";

    const videos = civilBatchData[subjectKey].videos;

    videos.forEach((vid, index) => {
        const item = document.createElement("div");
        item.className = `lecture-item ${index === 0 ? 'active' : ''}`;
        item.onclick = () => playLecture(vid, subjectKey, item);

        item.innerHTML = `
            <div class="thumb-box"><i class="fa-solid fa-play"></i></div>
            <div class="lecture-info">
                <div class="lecture-info-title">${vid.title}</div>
                <div class="lecture-duration"><i class="fa-regular fa-clock"></i> ${vid.time}</div>
            </div>
        `;
        playlistContainer.appendChild(item);
    });

    // Auto Play First Video
    if(videos.length > 0) {
        playLecture(videos[0], subjectKey, playlistContainer.children[0]);
    }
}

// Back to Subjects Page
function goBackToSubjects() {
    document.getElementById("lecturesPage").style.display = "none";
    document.getElementById("subjectsPage").style.display = "block";
}

// Play Video
function playLecture(video, subjectName, element) {
    const player = document.getElementById("cloudinaryPlayer");
    player.src = `https://player.cloudinary.com/embed/?cloud_name=${cloudName}&public_id=${video.id}`;

    document.getElementById("activeTitle").innerText = video.title;
    document.getElementById("activeMeta").innerText = `Ashoka Batch • ${subjectName}`;

    document.querySelectorAll('.lecture-item').forEach(el => el.classList.remove('active'));
    if(element) element.classList.add('active');
}

// LIGHT OFF / DARK MODE TOGGLE (POWER BUTTON)
function toggleLightOff() {
    document.body.classList.toggle("dark-mode");
}

// ACTIONS
function toggleLike() {
    const countSpan = document.getElementById("likeCount");
    const btn = document.getElementById("likeBtn");
    let count = parseInt(countSpan.innerText);

    if(!isLiked) {
        countSpan.innerText = count + 1;
        btn.classList.add("liked");
        isLiked = true;
    } else {
        countSpan.innerText = count - 1;
        btn.classList.remove("liked");
        isLiked = false;
    }
}

function focusComment() {
    document.getElementById("commentField").focus();
}

function postComment() {
    const field = document.getElementById("commentField");
    if(field.value.trim() !== "") {
        const list = document.getElementById("commentList");
        const comment = document.createElement("div");
        comment.innerHTML = `<strong>You:</strong> ${field.value}`;
        list.prepend(comment);
        field.value = "";
    }
}

function rateVideo() {
    alert("Thank you for rating this lecture 5 Stars!");
}

function downloadPdf() {
    alert("Downloading PDF Lecture Notes...");
}

function shareVideo() {
    alert("Lecture Link copied to clipboard!");
}
</script>
</body>
</html>
