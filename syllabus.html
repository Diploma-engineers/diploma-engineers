<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>Diploma Engineering Syllabus</title>


<!-- =====================================================
     BOOTSTRAP CSS
===================================================== -->

<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
>


<style>

/* =====================================================
   ROOT
===================================================== */

:root{

  --ink:#172033;
  --muted:#6f788b;
  --line:#e8ecf3;

  --blue:#2563eb;
  --blue2:#60a5fa;

  --green:#16a34a;

  --surface:rgba(255,255,255,.94);

  --shadow:
    0 14px 45px rgba(25,45,85,.09);
}


/* =====================================================
   GLOBAL
===================================================== */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

html,
body{
  margin:0 !important;
  padding:0 !important;
  width:100%;
  max-width:100%;
}

body{

  color:var(--ink);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background:

    radial-gradient(
      circle at 8% 4%,
      rgba(96,165,250,.13),
      transparent 26rem
    ),

    radial-gradient(
      circle at 92% 18%,
      rgba(167,139,250,.10),
      transparent 24rem
    ),

    linear-gradient(
      180deg,
      #fff 0%,
      #f8faff 48%,
      #fff 100%
    );

  overflow-x:hidden !important;
}


/* =====================================================
   HEADER / FOOTER
===================================================== */

#header,
#footer{

  position:relative;

  z-index:9999;

  width:100%;
  max-width:100%;

  margin:0 !important;
  padding:0 !important;

  overflow:visible;
}


/*
   Prevent unwanted gap from loaded header
*/

#header > *{

  margin-top:0 !important;
}

#header .navbar{

  margin-top:0 !important;
  margin-bottom:0 !important;
}


/* =====================================================
   MAIN SHELL
===================================================== */

.syllabus-shell{

  position:relative;

  width:100%;
  max-width:100%;

  min-height:100vh;

  margin:0;
  padding:0;

  overflow:hidden;
}

.syllabus-shell:before,
.syllabus-shell:after{

  content:"";

  position:absolute;

  border-radius:50%;

  pointer-events:none;

  filter:blur(2px);
}

.syllabus-shell:before{

  width:240px;
  height:240px;

  background:
    rgba(59,130,246,.07);

  left:-120px;
  top:280px;
}

.syllabus-shell:after{

  width:300px;
  height:300px;

  background:
    rgba(129,140,248,.07);

  right:-160px;
  top:620px;
}


/* =====================================================
   MAIN CONTAINER
===================================================== */

.container-main{

  position:relative;

  z-index:2;

  width:100%;
  max-width:1200px;

  margin:0 auto;

  padding:
    30px 20px 55px;
}


/* =====================================================
   HERO
===================================================== */

.hero{

  position:relative;

  text-align:center;

  padding:
    55px 20px 35px;

  animation:
    heroIn
    .8s
    cubic-bezier(.2,.8,.2,1)
    both;
}


.hero-badge{

  display:inline-flex;

  align-items:center;
  justify-content:center;

  gap:7px;

  padding:
    8px 14px;

  border:
    1px solid #e5eaf4;

  border-radius:999px;

  background:
    rgba(255,255,255,.88);

  box-shadow:
    0 8px 25px rgba(40,60,100,.07);

  color:#526079;

  font-size:.76rem;

  font-weight:800;

  letter-spacing:.06em;

  text-transform:uppercase;
}


.hero h1{

  margin:
    17px 0 10px;

  font-weight:900;

  letter-spacing:-.045em;

  font-size:
    clamp(2rem,5vw,4rem);

  line-height:1.05;

  background:

    linear-gradient(
      90deg,
      #111827,
      #2563eb,
      #4f46e5,
      #111827
    );

  background-size:220% auto;

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

  animation:
    titleShine
    5s
    linear
    infinite;
}


.hero p{

  margin:0;

  color:var(--muted);

  font-size:
    clamp(.9rem,2vw,1.06rem);
}


.hero-line{

  width:70px;

  height:4px;

  border-radius:10px;

  background:

    linear-gradient(
      90deg,
      var(--blue),
      #8b5cf6
    );

  margin:
    21px auto 0;
}


/* =====================================================
   FLOATING STICKERS
===================================================== */

.sticker{

  position:absolute;

  display:grid;

  place-items:center;

  width:48px;
  height:48px;

  border-radius:16px;

  background:#fff;

  border:
    1px solid #edf1f7;

  box-shadow:
    0 14px 32px rgba(30,50,90,.13);

  font-size:23px;

  animation:
    float
    4.5s
    ease-in-out
    infinite;

  user-select:none;

  pointer-events:none;
}

.sticker.s1{

  left:5%;
  top:28px;

  animation-delay:-.7s;
}

.sticker.s2{

  right:7%;
  top:45px;

  animation-delay:-2s;
}

.sticker.s3{

  left:13%;
  bottom:0;

  animation-delay:-3s;
}

.sticker.s4{

  right:14%;
  bottom:-2px;

  animation-delay:-1.2s;
}


/* =====================================================
   YEAR TABS
===================================================== */

.year-tabs{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:13px;

  margin:
    5px auto 20px;

  max-width:900px;

  animation:
    slideUp
    .8s
    .12s
    both;
}


.year-btn{

  position:relative;

  width:100%;

  border:
    1px solid #e8edf5 !important;

  border-radius:
    18px !important;

  padding:
    16px 12px !important;

  font-weight:850;

  background:
    rgba(255,255,255,.92) !important;

  color:#303a4e !important;

  box-shadow:
    0 10px 30px rgba(30,50,90,.07) !important;

  transition:
    transform .25s,
    box-shadow .25s,
    color .25s,
    background .25s !important;

  overflow:hidden;
}


.year-btn:hover{

  transform:
    translateY(-3px);

  box-shadow:
    0 15px 32px
    rgba(37,99,235,.14) !important;

  color:
    var(--blue) !important;
}


.year-btn.active{

  color:#fff !important;

  border-color:
    transparent !important;

  background:

    linear-gradient(
      135deg,
      #2563eb,
      #4f46e5
    ) !important;

  box-shadow:
    0 15px 34px
    rgba(37,99,235,.25) !important;
}


/* =====================================================
   SEARCH
===================================================== */

.search-card{

  width:100%;

  border:
    1px solid #e8edf5 !important;

  border-radius:
    20px !important;

  background:
    var(--surface) !important;

  backdrop-filter:
    blur(14px);

  box-shadow:
    var(--shadow) !important;

  padding:7px;

  margin-bottom:20px;

  animation:
    slideUp
    .8s
    .2s
    both;
}


.search-inner{

  position:relative;
}


.search-icon{

  position:absolute;

  left:17px;
  top:50%;

  transform:
    translateY(-50%);

  font-size:17px;

  z-index:2;
}


#searchInput{

  width:100%;

  height:54px;

  border:
    1px solid #e4e9f2 !important;

  border-radius:
    15px !important;

  padding:
    0 15px 0 47px !important;

  color:
    var(--ink) !important;

  background:
    #fff !important;

  box-shadow:

    inset 0 1px 0
    rgba(255,255,255,.8),

    0 8px 22px
    rgba(25,45,85,.05) !important;

  transition:

    border-color .25s,
    box-shadow .25s,
    transform .25s;
}


#searchInput:focus{

  border-color:
    #93b4ff !important;

  box-shadow:

    0 0 0 4px
    rgba(37,99,235,.09),

    0 10px 25px
    rgba(25,45,85,.07) !important;

  transform:
    translateY(-1px);
}


/* =====================================================
   SYLLABUS CARD
===================================================== */

.syllabus-card{

  width:100%;

  border:
    1px solid #e8edf5 !important;

  border-radius:
    22px !important;

  background:
    var(--surface) !important;

  backdrop-filter:
    blur(14px);

  box-shadow:
    var(--shadow) !important;

  overflow:hidden;

  animation:
    slideUp
    .8s
    .28s
    both;
}


.card-header{

  border:0 !important;

  padding:
    17px 20px !important;

  background:

    linear-gradient(
      135deg,
      #111827,
      #2563eb
    ) !important;

  font-weight:850;

  font-size:15px;

  letter-spacing:.01em;
}


.syllabus-card .card-body{

  padding:0 !important;
}


/* =====================================================
   TABLE
===================================================== */

.table-responsive{

  width:100%;

  padding:
    8px 10px 14px;

  overflow-x:auto;

  -webkit-overflow-scrolling:touch;
}


.table{

  width:100%;

  margin:0 !important;

  border-collapse:
    separate !important;

  border-spacing:
    0 8px !important;

  table-layout:auto;
}


.table thead th{

  border:0 !important;

  background:
    #f5f7fb !important;

  color:
    #657087 !important;

  font-size:.72rem;

  text-transform:uppercase;

  letter-spacing:.07em;

  padding:
    12px 13px !important;

  white-space:nowrap;
}


.table thead th:first-child{

  border-radius:
    11px 0 0 11px;
}


.table thead th:last-child{

  border-radius:
    0 11px 11px 0;
}


.table tbody tr{

  animation:
    rowIn
    .45s
    ease
    both;

  transition:
    transform .22s,
    filter .22s;
}


.table tbody tr:hover{

  transform:
    translateY(-2px);
}


.table tbody td{

  background:#fff;

  border-top:
    1px solid #edf0f5 !important;

  border-bottom:
    1px solid #edf0f5 !important;

  padding:
    13px 13px !important;

  vertical-align:middle;

  color:#313a4c;

  font-size:.88rem;

  line-height:1.35;
}


.table tbody td:first-child{

  border-left:
    1px solid #edf0f5 !important;

  border-radius:
    12px 0 0 12px;

  font-weight:800;

  color:#7a8496;

  text-align:center;
}


.table tbody td:nth-child(2){

  font-weight:850;

  color:#2563eb;

  white-space:nowrap;
}


.table tbody td:last-child{

  border-right:
    1px solid #edf0f5 !important;

  border-radius:
    0 12px 12px 0;

  text-align:center;
}


.table tbody tr:hover td{

  background:#f9fbff;
}


/* =====================================================
   PDF BUTTON
===================================================== */

.btn.btn-success.btn-sm,
.view-btn{

  display:inline-flex;

  align-items:center;
  justify-content:center;

  gap:5px;

  background:

    linear-gradient(
      135deg,
      #16a34a,
      #22c55e
    ) !important;

  color:#fff !important;

  border:0 !important;

  border-radius:
    9px !important;

  padding:
    7px 11px !important;

  text-decoration:none;

  font-weight:800;

  font-size:12px;

  white-space:nowrap;

  box-shadow:
    0 7px 17px
    rgba(22,163,74,.18);

  transition:
    transform .2s,
    box-shadow .2s,
    filter .2s;
}


.btn.btn-success.btn-sm:hover,
.view-btn:hover{

  transform:
    translateY(-2px);

  box-shadow:
    0 10px 22px
    rgba(22,163,74,.25);

  filter:
    saturate(1.08);
}


.btn.btn-success.btn-sm:active,
.view-btn:active{

  transform:
    scale(.96);
}


/* =====================================================
   YEAR CONTENT
===================================================== */

.year-content{

  animation:
    contentIn
    .45s
    ease
    both;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:767px){

  html,
  body{

    width:100%;
    max-width:100%;

    overflow-x:hidden !important;
  }


  #header,
  #footer{

    width:100%;
    max-width:100%;

    margin:0 !important;
    padding:0 !important;
  }


  .container-main{

    width:100%;
    max-width:100%;

    padding:
      8px 5px 30px;
  }


  /* HERO */

  .hero{

    padding:
      28px 5px 22px;
  }


  .hero-badge{

    font-size:9px;

    padding:
      6px 9px;

    letter-spacing:.03em;
  }


  .hero h1{

    font-size:
      clamp(1.55rem,7vw,2rem);

    line-height:1.08;

    margin:
      11px 0 7px;

    letter-spacing:-.035em;
  }


  .hero p{

    font-size:10.5px;

    line-height:1.45;

    padding:
      0 17px;
  }


  .hero-line{

    width:48px;

    height:3px;

    margin:
      13px auto 0;
  }


  /* STICKERS */

  .sticker{

    width:32px;
    height:32px;

    border-radius:9px;

    font-size:14px;

    box-shadow:
      0 7px 18px
      rgba(30,50,90,.10);
  }


  .sticker.s1{

    left:1%;
    top:8px;
  }


  .sticker.s2{

    right:1%;
    top:13px;
  }


  .sticker.s3{

    left:3%;
    bottom:-2px;
  }


  .sticker.s4{

    right:3%;
    bottom:-2px;
  }


  /* YEAR TABS */

  .year-tabs{

    width:100%;
    max-width:100%;

    grid-template-columns:
      repeat(3,1fr);

    gap:5px;

    margin:
      3px auto 11px;
  }


  .year-btn{

    min-height:40px;

    padding:
      7px 2px !important;

    border-radius:
      10px !important;

    font-size:9px;

    line-height:1.15;

    white-space:nowrap;
  }


  /* SEARCH */

  .search-card{

    width:100%;

    padding:5px;

    margin-bottom:11px;

    border-radius:
      13px !important;
  }


  #searchInput{

    height:40px;

    border-radius:
      10px !important;

    padding:
      0 9px 0 37px !important;

    font-size:11px;
  }


  .search-icon{

    left:12px;

    font-size:13px;
  }


  /* CARD */

  .syllabus-card{

    width:100%;

    border-radius:
      13px !important;
  }


  .card-header{

    padding:
      10px 12px !important;

    font-size:11px;
  }


  /* TABLE */

  .table-responsive{

    width:100%;
    max-width:100%;

    overflow-x:hidden !important;

    padding:3px;
  }


  .table{

    width:100% !important;

    min-width:0 !important;

    max-width:100%;

    table-layout:fixed !important;

    border-spacing:
      0 4px !important;
  }


  .table thead th{

    padding:
      7px 3px !important;

    font-size:7px;

    letter-spacing:.015em;

    white-space:nowrap;
  }


  .table tbody td{

    padding:
      7px 3px !important;

    font-size:8px;

    line-height:1.28;

    word-break:break-word;

    overflow-wrap:anywhere;
  }


  /* COLUMN WIDTH */

  .table th:nth-child(1),
  .table td:nth-child(1){

    width:9%;

    text-align:center;
  }


  .table th:nth-child(2),
  .table td:nth-child(2){

    width:13%;

    text-align:center;

    white-space:normal;
  }


  .table th:nth-child(3),
  .table td:nth-child(3){

    width:56%;

    white-space:normal;

    word-break:break-word;
  }


  .table th:nth-child(4),
  .table td:nth-child(4){

    width:22%;

    text-align:center;
  }


  /* PDF */

  .btn.btn-success.btn-sm,
  .view-btn{

    padding:
      5px 4px !important;

    font-size:
      7px !important;

    line-height:1 !important;

    border-radius:
      6px !important;

    min-width:0 !important;

    width:auto !important;

    white-space:nowrap !important;

    box-shadow:
      0 4px 9px
      rgba(22,163,74,.14);
  }


  .table tbody tr:hover{

    transform:none !important;
  }


  #footer{

    width:100%;
    max-width:100%;

    overflow:hidden;
  }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:390px){

  .container-main{

    padding-left:3px;
    padding-right:3px;
  }


  .hero{

    padding-top:23px;
  }


  .hero h1{

    font-size:1.42rem;
  }


  .hero p{

    font-size:9px;

    padding:
      0 12px;
  }


  .hero-badge{

    font-size:8px;
  }


  .year-btn{

    min-height:37px;

    font-size:8px;

    padding:
      6px 1px !important;
  }


  #searchInput{

    height:38px;

    font-size:10px;
  }


  .card-header{

    font-size:10px;

    padding:
      9px !important;
  }


  .table thead th{

    font-size:6.5px;

    padding:
      6px 2px !important;
  }


  .table tbody td{

    font-size:7.5px;

    padding:
      6px 2px !important;
  }


  .btn.btn-success.btn-sm{

    font-size:6.5px !important;

    padding:
      5px 3px !important;
  }

}


/* =====================================================
   320px DEVICES
===================================================== */

@media(max-width:340px){

  .hero h1{

    font-size:1.30rem;
  }


  .hero p{

    font-size:8.5px;
  }


  .hero-badge{

    font-size:7.5px;
  }


  .year-btn{

    font-size:7.5px;
  }


  .table thead th{

    font-size:6px;
  }


  .table tbody td{

    font-size:7px;
  }


  .btn.btn-success.btn-sm{

    font-size:6px !important;
  }

}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media(prefers-reduced-motion:reduce){

  *,

  *::before,

  *::after{

    scroll-behavior:auto !important;

    animation-duration:
      .01ms !important;

    animation-iteration-count:
      1 !important;

    transition-duration:
      .01ms !important;
  }

}


/* =====================================================
   ANIMATIONS
===================================================== */

@keyframes heroIn{

  from{

    opacity:0;

    transform:
      translateY(28px);
  }

  to{

    opacity:1;

    transform:none;
  }
}


@keyframes slideUp{

  from{

    opacity:0;

    transform:
      translateY(24px);
  }

  to{

    opacity:1;

    transform:none;
  }
}


@keyframes contentIn{

  from{

    opacity:0;

    transform:
      translateX(20px);
  }

  to{

    opacity:1;

    transform:none;
  }
}


@keyframes rowIn{

  from{

    opacity:0;

    transform:
      translateY(8px);
  }

  to{

    opacity:1;

    transform:none;
  }
}


@keyframes float{

  0%,100%{

    transform:
      translateY(0)
      rotate(-3deg);
  }

  50%{

    transform:
      translateY(-11px)
      rotate(4deg);
  }
}


@keyframes titleShine{

  to{

    background-position:
      220% center;
  }

}

</style>

</head>


<body>


<div class="syllabus-shell">


<!-- =====================================================
     HEADER
===================================================== -->

<div id="header"></div>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="container-main">


<!-- =====================================================
     HERO
===================================================== -->

<section class="hero">


  <span class="hero-badge">

    📚 BTEUP • Diploma Syllabus

  </span>


  <h1>

    Diploma Engineering Syllabus

  </h1>


  <p>

    Find your branch syllabus quickly and open
    the original PDF in one tap.

  </p>


  <div class="hero-line"></div>


  <span class="sticker s1">🎓</span>

  <span class="sticker s2">📖</span>

  <span class="sticker s3">✏️</span>

  <span class="sticker s4">💡</span>


</section>


<!-- =====================================================
     YEAR TABS
===================================================== -->

<div class="year-tabs">


  <button
    type="button"
    class="year-btn active"
    onclick="showYear('first',this)"
  >

    📘 First Year

  </button>


  <button
    type="button"
    class="year-btn"
    onclick="showYear('second',this)"
  >

    📗 Second Year

  </button>


  <button
    type="button"
    class="year-btn"
    onclick="showYear('third',this)"
  >

    📕 Third Year

  </button>


</div>


<!-- =====================================================
     SEARCH
===================================================== -->

<div class="search-card">


  <div class="search-inner">


    <span class="search-icon">

      🔎

    </span>


    <input
      id="searchInput"
      class="form-control"
      placeholder="Search branch or code..."
      oninput="searchTable()"
      autocomplete="off"
      type="search"
    >


  </div>


</div>


<!-- =====================================================
     SYLLABUS CARD
===================================================== -->

<div class="syllabus-card">


  <div class="card-header text-white">

    Available Syllabus

  </div>


  <div class="card-body">


    <!-- =================================================
         FIRST YEAR
    ================================================== -->

    <div
      id="first"
      class="year-content"
    >


      <div class="table-responsive">


        <table class="table">


          <thead>

            <tr>

              <th>S.No</th>

              <th>Code</th>

              <th>Branch</th>

              <th>PDF</th>

            </tr>

          </thead>


          <tbody id="firstBody"></tbody>


        </table>

<script>

/* =====================================================
   LOAD HEADER
===================================================== */

async function loadHeader(){

  const header =
    document.getElementById("header");

  if(!header){
    return;
  }


  try{

    const response =
      await fetch(
        "header.html",
        {
          method:"GET",
          cache:"no-cache"
        }
      );


    if(!response.ok){

      throw new Error(
        "header.html not found"
      );

    }


    const html =
      await response.text();


    /*
     * Insert header
     */

    header.innerHTML =
      html;


    /*
     * IMPORTANT
     * Bootstrap navbar is dynamically loaded.
     *
     * Bootstrap 5 data-bs-toggle automatically
     * works after the elements are inserted.
     *
     * We additionally initialize every collapse
     * element to make the mobile menu reliable.
     */

    if(
      window.bootstrap &&
      typeof bootstrap.Collapse !== "undefined"
    ){

      const collapses =
        header.querySelectorAll(
          ".collapse"
        );


      collapses.forEach(
        function(collapseElement){

          bootstrap.Collapse.getOrCreateInstance(
            collapseElement,
            {
              toggle:false
            }
          );

        }
      );

    }


    /*
     * Extra safety:
     * If the header uses navbar-toggler,
     * connect it to its actual Bootstrap target.
     */

    const togglers =
      header.querySelectorAll(
        ".navbar-toggler"
      );


    togglers.forEach(
      function(toggler){

        /*
         * Remove old manually attached handlers
         * by cloning the button.
         */

        const newToggler =
          toggler.cloneNode(true);


        toggler.parentNode.replaceChild(
          newToggler,
          toggler
        );


        newToggler.addEventListener(
          "click",
          function(event){

            /*
             * Let Bootstrap handle normal
             * data-bs-toggle behavior.
             */

            const targetSelector =
              newToggler.getAttribute(
                "data-bs-target"
              ) ||
              newToggler.getAttribute(
                "href"
              );


            if(!targetSelector){
              return;
            }


            const target =
              document.querySelector(
                targetSelector
              );


            if(!target){
              return;
            }


            /*
             * If Bootstrap data attribute exists,
             * Bootstrap will handle it.
             *
             * Otherwise use Bootstrap API manually.
             */

            if(
              !newToggler.hasAttribute(
                "data-bs-toggle"
              )
            ){

              const instance =
                bootstrap.Collapse.getOrCreateInstance(
                  target,
                  {
                    toggle:false
                  }
                );


              instance.toggle();

            }

          }
        );

      }
    );


  }
  catch(error){

    console.error(
      "Header loading error:",
      error
    );

  }

}


/* =====================================================
   LOAD FOOTER
===================================================== */

async function loadFooter(){

  const footer =
    document.getElementById("footer");


  if(!footer){
    return;
  }


  try{

    const response =
      await fetch(
        "footer.html",
        {
          method:"GET",
          cache:"no-cache"
        }
      );


    if(!response.ok){

      throw new Error(
        "footer.html not found"
      );

    }


    footer.innerHTML =
      await response.text();


  }
  catch(error){

    console.error(
      "Footer loading error:",
      error
    );

  }

}


/* =====================================================
   INITIALIZE HEADER / FOOTER
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  async function(){

    await loadHeader();

    await loadFooter();

  }
);

</script>

/* =====================================================
   RENDER TABLE
===================================================== */

function renderTable(
  data,
  bodyId,
  pdfFunction
){

  const body =
    document.getElementById(bodyId);


  if(!body){
    return;
  }


  body.innerHTML = "";


  data.forEach(
    function(item,index){

      const code =
        item[0];

      const branch =
        item[1];


      const pdf =
        pdfFunction
        ? pdfFunction(code)
        : item[2];


      const row =
        document.createElement("tr");


      row.innerHTML = `

        <td>
          ${index + 1}
        </td>

        <td>
          ${code}
        </td>

        <td>
          ${branch}
        </td>

        <td>

          <a
            class="btn btn-success btn-sm"
            target="_blank"
            rel="noopener noreferrer"
            href="${pdf}"
          >
            View PDF ↗
          </a>

        </td>

      `;


      body.appendChild(row);

    }
  );

}

/* =====================================================
   YEAR SWITCH
===================================================== */

function showYear(
  id,
  button
){

  document
    .querySelectorAll(
      ".year-content"
    )
    .forEach(
      function(section){

        section.style.display =
          "none";

      }
    );


  const selected =
    document.getElementById(id);


  if(selected){

    selected.style.display =
      "block";

  }


  document
    .querySelectorAll(
      ".year-btn"
    )
    .forEach(
      function(btn){

        btn.classList.remove(
          "active"
        );

      }
    );


  if(button){

    button.classList.add(
      "active"
    );

  }


  const search =
    document.getElementById(
      "searchInput"
    );


  if(search){

    search.value = "";

  }


  searchTable();

}


/* =====================================================
   SEARCH
===================================================== */

function searchTable(){

  const searchInput =
    document.getElementById(
      "searchInput"
    );


  if(!searchInput){
    return;
  }


  const input =
    searchInput.value
      .trim()
      .toUpperCase();


  const active =
    [
      ...document.querySelectorAll(
        ".year-content"
      )
    ]
    .find(
      function(section){

        return (
          section.style.display !==
          "none"
        );

      }
    );


  if(!active){
    return;
  }


  const rows =
    active.querySelectorAll(
      "tbody tr"
    );


  rows.forEach(
    function(row){

      const cells =
        row.cells;


      if(cells.length < 4){

        row.style.display =
          "";

        return;

      }


      const code =
        cells[1]
          .textContent
          .toUpperCase();


      const branch =
        cells[2]
          .textContent
          .toUpperCase();


      const matched =
        code.includes(input) ||
        branch.includes(input);


      row.style.display =
        matched
        ? ""
        : "none";

    }
  );

}


/* =====================================================
   ESCAPE SEARCH
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    const searchInput =
      document.getElementById(
        "searchInput"
      );


    if(!searchInput){
      return;
    }


    searchInput.addEventListener(
      "keydown",
      function(event){

        if(event.key === "Escape"){

          this.value = "";

          searchTable();

          this.blur();

        }

      }
    );

  }
);
