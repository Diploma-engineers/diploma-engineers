<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BTEUP Diploma - First Year (Sem 1 & Sem 2)</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
<style>
:root{--bg:#f4f5f9;--surface:#fff;--primary:#2563eb;--light:#eff6ff;--text:#1e293b;--border:#e2e8f0}*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}.app{min-height:100vh;padding:6px}
.sem-toggle{background:#e2e8f0;border-radius:25px;padding:3px;display:flex;gap:3px;margin-bottom:8px}.sem-btn{flex:1;border:0;background:transparent;padding:6px 0;font-size:.65rem;font-weight:700;color:#64748b;border-radius:22px}.sem-btn.active{background:var(--primary);color:#fff;box-shadow:0 2px 6px rgba(37,99,235,.3)}
.grid{display:grid;grid-template-columns:1fr;gap:5px}@media(min-width:768px){.grid{grid-template-columns:repeat(2,1fr)}}@media(min-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}}
.cardx,.folder-card,.resource-card,.playlist{background:#fff;border:1px solid var(--border);border-radius:7px;padding:7px;display:flex;align-items:center;gap:7px;cursor:pointer}.cardx:active,.folder-card:active{transform:scale(.98)}
.ico{width:29px;height:29px;border-radius:6px;background:var(--light);color:var(--primary);display:grid;place-items:center;flex:0 0 auto;font-size:.75rem}.hidden{display:none!important}
.resource-section{margin-top:10px}.resource-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}.resource-heading h6{font-size:.72rem;margin:0;font-weight:800}.folder-card{margin-bottom:5px}.folder-info{min-width:0;flex:1}.folder-name{font-size:.7rem;font-weight:800}.folder-meta{font-size:.55rem;color:#64748b}
.resource-view{display:none}.resource-view.active{display:block}.toolbar{display:flex;gap:6px;align-items:center;margin-bottom:7px}.back{border:0;background:transparent;color:var(--primary);font-size:.7rem;font-weight:800;padding:3px}.title{font-size:.8rem;font-weight:800;margin:0}.subtitle{font-size:.55rem;color:#64748b}.search{width:100%;margin-bottom:7px}.search input{width:100%;border:1px solid var(--border);border-radius:7px;padding:7px 9px;font-size:.65rem;outline:none}.resource-card{margin-bottom:5px}.resource-name{font-size:.67rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.resource-meta{font-size:.52rem;color:#64748b}.open-btn{margin-left:auto;background:var(--primary);color:#fff;text-decoration:none;border-radius:5px;padding:4px 7px;font-size:.55rem;white-space:nowrap}.empty{background:#fff;border:1px dashed var(--border);border-radius:7px;padding:16px;text-align:center;color:#64748b;font-size:.62rem}
.player-layout{display:grid;grid-template-columns:1fr;gap:6px}@media(min-width:992px){.player-layout{grid-template-columns:3fr 1fr}}.video-box{position:relative;padding-bottom:56.25%;height:0;background:#000;border-radius:6px;overflow:hidden}.video-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.notice{background:#fff;border:1px solid var(--border);border-radius:7px;padding:7px;margin-top:6px;font-size:.6rem}.playlist.active{border-color:var(--primary);background:var(--light)}.play{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#f1f5f9;font-size:.5rem}.playlist.active .play{background:var(--primary);color:#fff}.action{border:0;background:var(--bg);border-radius:10px;padding:3px 6px;font-size:.62rem}.action.liked{background:#ffe4e6;color:#e11d48}.hidden{display:none!important}
</style>
</head><body><div class="app">
<div id="subjectsView">
<div class="d-flex justify-content-between align-items-center mb-2 px-1"><div><h6 class="fw-bold mb-0" style="font-size:.78rem">BTEUP Diploma</h6><small class="text-muted" style="font-size:.56rem">First Year Portal (Sem 1 & Sem 2)</small></div><span class="badge bg-primary">2026</span></div>
<div class="sem-toggle"><button id="btnSem1" class="sem-btn active" onclick="switchSemester(1)">Semester 1</button><button id="btnSem2" class="sem-btn" onclick="switchSemester(2)">Semester 2</button></div>
<div class="grid" id="subjectList"></div>
<div class="resource-section"><div class="resource-heading"><h6><i class="fas fa-folder-open me-1"></i>Study Resources</h6></div><div id="resourceFolders"></div></div>
</div>
<div id="resourceView" class="resource-view"><div class="toolbar"><button class="back" onclick="history.back()"><i class="fas fa-arrow-left"></i> Back</button><div><h6 id="resourceTitle" class="title"></h6><div id="resourceSub" class="subtitle"></div></div></div><div class="search"><input id="resourceSearch" type="search" placeholder="PDF search karein..." oninput="filterResources(this.value)"></div><div id="resourceList"></div></div>
<div id="lectureView" class="hidden"><div class="player-layout"><div><div class="video-box"><iframe id="player" allowfullscreen></iframe></div><div class="notice"><b id="videoTitle"></b><div id="videoDesc" class="text-muted mt-1"></div><div class="d-flex justify-content-between align-items-center mt-2"><button id="likeBtn" class="action" onclick="toggleLike()"><i class="far fa-heart"></i> <span id="likeText">Like</span> (<span id="likeCount">156</span>)</button><a id="pdfBtn" target="_blank" class="open-btn"><i class="fas fa-file-pdf"></i> PDF Notes</a></div></div><div class="notice">Educational Purpose & Credit Notice: यह video students की educational help के उद्देश्य से share किया गया है।</div></div><div><h6 style="font-size:.68rem" class="fw-bold">Lectures List</h6><div id="playlist"></div></div></div></div>
</div>
<script>
const appData={sem1:{
math1:{title:"Mathematics-I",videos:[{title:"1. Math-I | Complete (Part I)",desc:"Matrices & determinants.",url:"https://www.youtube.com/embed/Rt1OY5gfDVc",pdf:"#"},{title:"2. Math-I | Complete (Part II)",desc:"Binomial theorem.",url:"https://www.youtube.com/embed/-ISId5bQc2U",pdf:"#"}]},
physics1:{title:"Applied Physics-I",videos:[{title:"1. Physics-I | Complete",desc:"SI units & dimensions.",url:"https://www.youtube.com/embed/7osNMH9Wv2c",pdf:"#"},{title:"2. Work, Power & Energy",desc:"Energy conservation.",url:"https://www.youtube.com/embed/rfscV00zUVU",pdf:"#"}]},
chemistry:{title:"Applied Chemistry",videos:[{title:"1. Chemistry | Complete",desc:"Atomic models & bonding.",url:"https://www.youtube.com/embed/eqChfO1jaI8",pdf:"#"}]},
comm:{title:"Communication Skills",videos:[{title:"1. Comm. Skills | Complete",desc:"Process & barriers.",url:"https://www.youtube.com/embed/OZziS2WuA0c",pdf:"#"}]},
graphics:{title:"Engineering Graphics",videos:[{title:"1. Engg Graphics | Basics",desc:"Instruments & dimensioning.",url:"https://www.youtube.com/embed/dDOWJCqXuNA",pdf:"#"}]},
workshop:{title:"Workshop Practice",videos:[{title:"1. Carpentry & Fitting",desc:"Tools & safety measures.",url:"https://www.youtube.com/embed/uS18y4JkE3Y",pdf:"#"},{title:"2. Welding & Sheet Metal",desc:"Arc welding basics.",url:"https://www.youtube.com/embed/uS18y4JkE3Y",pdf:"#"}]},
sports:{title:"Sports & Yoga",videos:[{title:"1. Yoga & Asanas",desc:"Physical fitness & health.",url:"https://www.youtube.com/embed/rfscV00zUVU",pdf:"#"}]}
},sem2:{
math2:{title:"Mathematics-II",videos:[{title:"1. Mathematics-II | COMPLETE",desc:"Indefinite and definite integrals.",url:"https://www.youtube.com/embed/S_5Bd2C1YqM",pdf:"#"}]},
physics2:{title:"Applied Physics-II",videos:[{title:"1. Applied Physics-II | COMPLETE",desc:"Wave optics and interference.",url:"https://www.youtube.com/embed/KU9Or1Fu_VQ",pdf:"#"}]},
it:{title:"Introduction to IT Systems",videos:[{title:"1. IT Systems | COMPLETE",desc:"Hardware, software & peripherals.",url:"https://www.youtube.com/embed/st_Vz8ZR2Ns",pdf:"#"}]},
ee:{title:"Fundamentals of Electrical & Electronics",videos:[{title:"1. Fundamentals of Electrical Engineering | COMPLETE",desc:"Ohm's law, KCL & KVL.",url:"https://www.youtube.com/embed/NtQ2Ifzrd-E",pdf:"#"}]},
mechanics:{title:"Engineering Mechanics",videos:[{title:"1. Engineering Mechanics | COMPLETE",desc:"Coplanar forces and moments.",url:"https://www.youtube.com/embed/_csfZ10d2Z0",pdf:"#"}]},
env:{title:"Environmental Sciences",videos:[{title:"1. Environmental Sciences | COMPLETE",desc:"Flow of energy and ecological balance.",url:"https://www.youtube.com/embed/D-_oOr-dQr8",pdf:"#"}]}
}};
const resourceData={sem1:{important:[
{name:"Applied Physics-I Important Questions",url:"https://drive.google.com/open?id=1qeS3ImBSTAoGfp05u_LCHlT8C5yy0vsB&usp=drive_copy"},
{name:"Applied Chemistry Important Questions",url:"https://drive.google.com/open?id=1kBAhS6yCvDgqE_ynsiNzTGeYu3LBmWMg&usp=drive_copy"},
{name:"Communication Skills Important Questions",url:"https://drive.google.com/open?id=1rQl3lAbqrIoEX8negi9CILpUzfs3SNsU&usp=drive_copy"}
],short:[]},sem2:{important:[
{name:"Introduction to IT Systems Important Questions",url:"https://drive.google.com/open?id=1rcq2mQHXrrXJb-JP_p5W7g0DClbfs8GR&usp=drive_copy"},
{name:"Environmental Studies (EVS) Important Questions",url:"https://drive.google.com/open?id=1ACj4tJZcaP-MKzY-4XurxYp40zsXyJPM&usp=drive_copy"},
{name:"Fundamentals of Electrical & Electronics Engineering Important Questions",url:"https://drive.google.com/open?id=1F-0cOnP6Nta7cQ7INoCc59_2RaLStI55&usp=drive_copy"},
{name:"Applied Physics-II Important Questions",url:"https://drive.google.com/open?id=1jrskLsd7SsMMIWNFuroQ_jHHgKfpbCep&usp=drive_copy"},
{name:"Engineering Mechanics Important Questions",url:"https://drive.google.com/open?id=1lnnFSgnubHyHCHYHB3cHtzQb3b6r4bO5&usp=drive_copy"}
],short:[]}};
let currentSem=1,currentFolder="important",currentItems=[],liked=false;
function switchSemester(s){currentSem=s;btnSem1.classList.toggle("active",s===1);btnSem2.classList.toggle("active",s===2);renderSubjects();renderFolders()}
function renderSubjects(){let h="";for(const [k,v] of Object.entries(appData["sem"+currentSem]))h+=`<div class="cardx" onclick="openSubject('sem${currentSem}','${k}')"><div class="ico"><i class="fas fa-book-open"></i></div><div class="flex-grow-1 overflow-hidden"><div class="fw-bold text-truncate" style="font-size:.7rem">${v.title}</div><div class="text-muted" style="font-size:.54rem">${v.videos.length} Lectures & Notes</div></div></div>`;subjectList.innerHTML=h}
function renderFolders(){const d=resourceData["sem"+currentSem];resourceFolders.innerHTML=`<div class="folder-card" onclick="openResources('important')"><div class="ico"><i class="fas fa-star"></i></div><div class="folder-info"><div class="folder-name">Important Questions</div><div class="folder-meta">${d.important.length} PDFs available</div></div><i class="fas fa-chevron-right text-muted" style="font-size:.6rem"></i></div><div class="folder-card" onclick="openResources('short')"><div class="ico"><i class="fas fa-note-sticky"></i></div><div class="folder-info"><div class="folder-name">Short Notes</div><div class="folder-meta">${d.short.length?d.short.length+" PDFs available":"No notes added yet"}</div></div><i class="fas fa-chevron-right text-muted" style="font-size:.6rem"></i></div>`}
function openResources(type){currentFolder=type;currentItems=resourceData["sem"+currentSem][type];history.pushState({view:"resource",sem:currentSem,type},"","#resources");showResource();renderResourceList(currentItems)}
function showResource(){subjectsView.classList.add("hidden");lectureView.classList.add("hidden");resourceView.classList.add("active");resourceTitle.textContent=currentFolder==="important"?"Important Questions":"Short Notes";resourceSub.textContent=`Semester ${currentSem} • ${currentItems.length} PDF`;resourceSearch.value=""}
function renderResourceList(items){resourceList.innerHTML=items.length?items.map(x=>`<div class="resource-card"><div class="ico"><i class="fas fa-file-pdf"></i></div><div class="flex-grow-1 overflow-hidden"><div class="resource-name">${x.name}</div><div class="resource-meta">Diploma Engineers • PDF</div></div><a class="open-btn" target="_blank" href="${x.url}">Open</a></div>`).join(""):`<div class="empty"><i class="fas fa-folder-open d-block mb-2" style="font-size:1rem"></i>इस folder में अभी कोई PDF add नहीं की गई है।</div>`}
function filterResources(q){q=q.toLowerCase();renderResourceList(currentItems.filter(x=>x.name.toLowerCase().includes(q)))}
function openSubject(sem,key){history.pushState({view:"lecture",sem,key},"","#lecture");subjectsView.classList.add("hidden");resourceView.classList.remove("active");lectureView.classList.remove("hidden");playVideo(sem,key,0)}
function playVideo(sem,key,i){const v=appData[sem][key].videos[i];player.src=v.url;videoTitle.textContent=v.title;videoDesc.textContent=v.desc;pdfBtn.href=v.pdf;liked=false;likeBtn.classList.remove("liked");likeText.textContent="Like";likeCount.textContent="156";playlist.innerHTML=appData[sem][key].videos.map((x,n)=>`<div class="playlist ${n===i?"active":""}" onclick="playVideo('${sem}','${key}',${n})"><div class="play"><i class="fas ${n===i?"fa-play":"fa-film"}"></i></div><div class="overflow-hidden"><div class="fw-bold text-truncate" style="font-size:.6rem">${x.title}</div><small class="text-muted" style="font-size:.5rem">Lecture</small></div></div>`).join("")}
function toggleLike(){let n=+likeCount.textContent;liked=!liked;likeBtn.classList.toggle("liked",liked);likeText.textContent=liked?"Liked":"Like";likeCount.textContent=liked?n+1:n-1}
function showSubjects(){resourceView.classList.remove("active");lectureView.classList.add("hidden");subjectsView.classList.remove("hidden");player.src=""}
addEventListener("popstate",e=>{if(e.state?.view==="resource"){currentSem=e.state.sem;switchSemester(currentSem);currentFolder=e.state.type;currentItems=resourceData["sem"+currentSem][currentFolder];showResource();renderResourceList(currentItems)}else if(e.state?.view==="lecture"){subjectsView.classList.add("hidden");resourceView.classList.remove("active");lectureView.classList.remove("hidden")}else showSubjects()})
renderSubjects();renderFolders();
</script></body></html>
