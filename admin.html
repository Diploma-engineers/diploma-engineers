<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diploma Engineers Admin Panel</title>

<link rel="icon" href="favicon.ico">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- Loader -->

<div id="loader">

<div class="spinner"></div>

<p>Loading Admin Panel...</p>

</div>

<!-- Login -->

<div id="loginPage" class="page">

<div class="login-box">

<h1>Diploma Engineers</h1>

<p>Admin Login</p>

<input
type="email"
id="email"
placeholder="Enter Email">

<input
type="password"
id="password"
placeholder="Enter Password">

<button id="loginBtn">

Login

</button>

<div id="loginError"></div>

</div>

</div>

<!-- Dashboard -->

<div id="dashboard" style="display:none;">

<header>

<h2>Diploma Engineers Admin</h2>

<button id="logoutBtn">

Logout

</button>

</header>

<div class="container">

<div class="card">

<h3>Publish News</h3>

<input
type="text"
id="title"
placeholder="News Title">

<textarea
id="desc"
placeholder="Description"></textarea>

<label>

Thumbnail

</label>

<input
type="file"
id="thumb"
accept="image/*">

<img
id="preview">

<label>

Attach File

</label>

<input
type="file"
id="file">

<label>

External Link

</label>

<input
type="url"
id="link"
placeholder="https://example.com">

<label>

Category

</label>

<select id="category">

<option>News</option>
<option>Notice</option>
<option>Admission</option>
<option>Result</option>
<option>Scholarship</option>
<option>Job</option>

</select>

<button id="publishBtn">

Publish News

</button>

</div>

<div class="card">

<h3>Published News</h3>

<input
type="text"
id="search"
placeholder="Search News">

<div id="newsList">

Loading...

</div>

</div>

</div>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>

  // =======================================

const CLOUD_NAME = "YOUR_CLOUD_NAME";

const UPLOAD_PRESET = "YOUR_UPLOAD_PRESET";


// =======================================
// Image Preview
// =======================================

thumb.addEventListener("change",()=>{

const img = thumb.files[0];

if(!img){

preview.style.display="none";

preview.src="";

return;

}

preview.src = URL.createObjectURL(img);

preview.style.display="block";

});


// =======================================
// Upload File To Cloudinary
// =======================================

async function uploadToCloudinary(file){

if(!file) return "";

const formData = new FormData();

formData.append("file",file);

formData.append("upload_preset",UPLOAD_PRESET);

const response = await fetch(

`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`,

{

method:"POST",

body:formData

}

);

const data = await response.json();

if(!response.ok){

throw new Error(

data.error?.message || "Upload Failed"

);

}

return data.secure_url;

}


// =======================================
// Upload Thumbnail
// =======================================

async function uploadThumbnail(){

if(thumb.files.length===0){

return "";

}

publishBtn.innerHTML="Uploading Thumbnail...";

return await uploadToCloudinary(

thumb.files[0]

);

}


// =======================================
// Upload Attachment
// =======================================

async function uploadAttachment(){

if(file.files.length===0){

return "";

}

publishBtn.innerHTML="Uploading File...";

return await uploadToCloudinary(

file.files[0]

);

}

// ======================================

alert("Enter News Title");

title.focus();

return;

}

publishBtn.disabled=true;

publishBtn.innerHTML="Please Wait...";

try{

// Upload Thumbnail

imageUrl = await uploadThumbnail();

// Upload Attachment

// News Data

const newsData={

title:title.value.trim(),

};

// ===============================

// ===============================

if(editId){

await update(

ref(db,"news/"+editId),

newsData

);

alert("News Updated Successfully");

}

// ===============================
// Publish New News
// ===============================

else{

const newsRef=push(ref(db,"news"));

await set(

newsRef,

newsData

);

alert("News Published Successfully");

}

resetForm();

loadNews();

}

catch(error){

console.error(error);

alert(error.message);

}

publishBtn.disabled=false;

publishBtn.innerHTML="Publish News";

});
