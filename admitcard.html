<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Civil Engineering Study Library App</title>

<!-- Google Fonts & Font Awesome Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* =====================================================
GLOBAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Plus Jakarta Sans',sans-serif;
}

body{
    background:#f4f7fb;
    padding-top:40px;
    color:#0f172a;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
}

/* =====================================================
MAIN SECTION
===================================================== */

.main-section{
    width:100%;
    padding:20px 15px;
}

/* =====================================================
CARD
===================================================== */

.admit-card-box{
    max-width:500px;
    margin:auto;
    background:#ffffff;
    border-radius:30px;
    padding:40px 30px;
    position:relative;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,0.08);
    text-align:center;
}

.admit-card-box::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:6px;
    background:linear-gradient(90deg,#ff9800,#ff5722,#2563eb);
}

/* =====================================================
ICON
===================================================== */

.icon-box{
    width:100px;
    height:100px;
    margin:auto;
    border-radius:28px;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:40px;
    box-shadow:0 12px 30px rgba(37,99,235,0.25);
    margin-bottom:25px;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

/* =====================================================
TITLE
===================================================== */

.admit-card-box h2{
    font-size:30px;
    font-weight:700;
    color:#0d1b2a;
    margin-bottom:10px;
}

.admit-card-box p{
    color:#64748b;
    font-size:15px;
    line-height:1.8;
    margin-bottom:25px;
}

/* =====================================================
COMING SOON BADGE
===================================================== */

.coming-soon-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #fff7ed;
    border: 1px solid #fed7aa;
    color: #ea580c;
    padding: 10px 20px;
    border-radius: 50px;
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 25px;
    box-shadow: 0 4px 12px rgba(234, 88, 12, 0.1);
}

/* =====================================================
INFO BOX
===================================================== */

.info-box{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    padding:16px;
    border-radius:16px;
    font-size:14px;
    color:#475569;
    line-height:1.8;
}

/* =====================================================
MOBILE
===================================================== */

@media(max-width:768px){
    .main-section{
        padding:15px;
    }

    .admit-card-box{
        padding:32px 20px;
        border-radius:24px;
    }

    .icon-box{
        width:85px;
        height:85px;
        font-size:34px;
    }

    .admit-card-box h2{
        font-size:26px;
    }
}

</style>

</head>

<body>

<!-- =====================================================
MAIN
===================================================== -->

<section class="main-section">

<div class="admit-card-box">

<div class="icon-box">
<i class="fa-solid fa-rocket"></i>
</div>

<h2>Civil Engineering Study Library</h2>

<p>
Your ultimate platform for diploma study materials, notes, and resources is under development.
</p>

<div class="coming-soon-badge">
<i class="fa-solid fa-clock"></i> Coming Soon
</div>

<div class="info-box">
📌 We are working hard to launch the app feature very soon. Stay tuned for updates!
</div>

</div>

</section>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
