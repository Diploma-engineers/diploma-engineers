<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1769e0">
<title>Blog | Diploma Engineers</title>
<meta id="metaDescription" name="description" content="Read Diploma Engineers blog.">
<meta id="ogTitle" property="og:title" content="Diploma Engineers Blog">
<meta id="ogDescription" property="og:description" content="Read this Diploma Engineers blog.">
<meta id="ogImage" property="og:image" content="">
<meta id="ogUrl" property="og:url" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#f5f8fc;color:#172033;font-family:Poppins,Arial,sans-serif}body{min-height:100vh}.page{max-width:900px;margin:0 auto;padding:18px 14px 50px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.back{border:0;background:#fff;color:#1769e0;border:1px solid #dbe7f5;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.brand{font-weight:800;color:#1769e0;font-size:15px}.state{background:#fff;border:1px solid #e0e8f2;border-radius:18px;padding:38px 20px;text-align:center;color:#64748b}.spinner{font-size:25px;margin-bottom:10px}.article{display:none;background:#fff;border:1px solid #e2eaf3;border-radius:24px;overflow:hidden;box-shadow:0 12px 35px rgba(22,54,92,.07)}.hero{width:100%;aspect-ratio:16/8;object-fit:cover;display:block;background:#eaf1f9}.article-body{padding:25px}.category{display:inline-flex;align-items:center;gap:6px;background:#eaf3ff;color:#1769e0;border-radius:999px;padding:6px 11px;font-size:11px;font-weight:800;text-transform:uppercase}.title{font-size:clamp(26px,5vw,42px);line-height:1.18;margin:13px 0 14px;color:#101828}.author{display:flex;align-items:center;gap:12px;padding:13px;background:#f7faff;border:1px solid #e3edf8;border-radius:16px;margin-bottom:20px}.avatar{width:50px;height:50px;border-radius:50%;object-fit:cover;background:#dbeafe;flex:none}.author-name{font-weight:800;font-size:14px}.author-role{font-size:11px;color:#64748b;margin-top:2px}.author-date{font-size:10px;color:#94a3b8;margin-top:2px}.share-row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}.share-btn{border:0;border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:7px}.share-main{background:#1769e0;color:#fff}.share-copy{background:#eef3f8;color:#334155}.share-wa{background:#eafaf0;color:#14843d}.share-tg{background:#eaf5ff;color:#1877b9}.content{font-size:15px;line-height:1.8;color:#273449;overflow-wrap:anywhere}.content img{max-width:100%;height:auto;border-radius:14px}.content h1,.content h2,.content h3{line-height:1.3;color:#111827}.content a{color:#1769e0}.content blockquote{margin:18px 0;padding:12px 16px;border-left:4px solid #1769e0;background:#f4f8ff;border-radius:8px}.share-preview{display:none;margin:0 0 18px;border:1px solid #e2eaf3;border-radius:16px;padding:10px;background:#fbfdff}.share-preview img{width:100%;max-height:240px;object-fit:cover;border-radius:11px}.share-preview small{display:block;color:#64748b;margin-top:7px}.footer{text-align:center;color:#94a3b8;font-size:11px;margin-top:22px}@media(max-width:600px){.page{padding:10px 9px 35px}.article-body{padding:18px}.title{font-size:27px}.content{font-size:14px}.hero{aspect-ratio:16/10}.brand{font-size:12px}}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <button class="back" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i> Back</button>
    <div class="brand">Diploma Engineers</div>
  </div>
  <div id="state" class="state"><div class="spinner"><i class="fa-solid fa-spinner fa-spin"></i></div><b>Loading blog...</b><div style="font-size:12px;margin-top:6px">Please wait</div></div>
  <article id="article" class="article">
    <img id="hero" class="hero" alt="Blog thumbnail" hidden>
    <div class="article-body">
      <div id="category" class="category"><i class="fa-solid fa-pen-nib"></i> Blog</div>
      <h1 id="title" class="title">Blog</h1>
      <div class="author">
        <img id="avatar" class="avatar" alt="Author profile" src="https://ui-avatars.com/api/?name=Admin&background=e8f1ff&color=1769e0">
        <div style="min-width:0"><div id="authorName" class="author-name">Admin</div><div id="authorRole" class="author-role">Admin</div><div id="date" class="author-date"></div></div>
      </div>
      <div class="share-row">
        <button class="share-btn share-main" id="nativeShare"><i class="fa-solid fa-share-nodes"></i> Share</button>
        <button class="share-btn share-copy" id="copyLink"><i class="fa-solid fa-link"></i> Copy Link</button>
        <button class="share-btn share-wa" id="shareWhatsApp"><i class="fa-brands fa-whatsapp"></i> WhatsApp</button>
        <button class="share-btn share-tg" id="shareTelegram"><i class="fa-brands fa-telegram"></i> Telegram</button>
      </div>
      <div id="sharePreview" class="share-preview"><img id="sharePreviewImg" alt="Blog thumbnail for sharing"><small><i class="fa-solid fa-image"></i> Blog thumbnail will be used where the browser supports image sharing.</small></div>
      <div id="content" class="content"></div>
    </div>
  </article>
  <div class="footer">© Diploma Engineers · The Students' Trusted Learning Platform</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig={apiKey:"AIzaSyAbg1Q1ZPgF7mwaxyin7iglla01eDk_tKo",authDomain:"diplomaengineers-869df.firebaseapp.com",databaseURL:"https://diplomaengineers-869df-default-rtdb.firebaseio.com",projectId:"diplomaengineers-869df",storageBucket:"diplomaengineers-869df.appspot.com",messagingSenderId:"356779436080",appId:"1:356779436080:web:4b28da380e547420d0e5f5"};
const app=initializeApp(firebaseConfig);const db=getDatabase(app);
const params=new URLSearchParams(location.search);const blogId=params.get("id");
const $=id=>document.getElementById(id);
let currentBlog=null,currentUrl=location.href;
function first(...v){return v.find(x=>x!==undefined&&x!==null&&String(x).trim()!=="")||""}
function imageOf(x){return first(x.image,x.thumb,x.thumbnail,x.thumbnailUrl,x.imageUrl,x.coverImage,x.cover)}
function titleOf(x){return first(x.title,x.name,"Untitled Blog")}
function authorUidOf(x){return first(x.authorUid,x.ownerUid,x.uploaderUid,x.createdBy,x.createdByUid,x.uid,x.userId,x.userUid,x.adminUid,x.uploadedByUid)}
function dateOf(x){let v=first(x.date,x.publishedAt,x.uploadedAt,x.timestamp,x.createdAt,x.updatedAt);if(!v)return "";if(typeof v==="number"||/^\d+$/.test(String(v))){const d=new Date(Number(v));if(!isNaN(d))return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}return String(v)}
function htmlOf(x){return first(x.html,x.htmlCode,x.blogHtml,x.blogContent,x.contentHtml,x.content,x.body,x.text,x.desc,x.description,"No readable content is available for this blog.")}
function cleanHtml(raw){const box=document.createElement("div");box.innerHTML=String(raw||"");box.querySelectorAll("script,iframe,object,embed,form").forEach(n=>n.remove());box.querySelectorAll("[onerror],[onclick],[onload],[onmouseover]").forEach(n=>{[...n.attributes].forEach(a=>{if(a.name.toLowerCase().startsWith("on"))n.removeAttribute(a.name)})});return box.innerHTML}
function profilePhoto(p){return first(p.photo,p.profilePhoto,p.photoURL,p.image,p.imageUrl,p.avatar,p.avatarUrl)}
function setMeta(b){const t=titleOf(b),im=imageOf(b);document.title=t+" | Diploma Engineers";$("metaDescription").content=String(b.text||b.desc||"Read "+t+" on Diploma Engineers.").slice(0,160);$("ogTitle").content=t;$("ogDescription").content=String(b.text||b.desc||"Read this blog on Diploma Engineers.").slice(0,200);$("ogImage").content=im;$("ogUrl").content=currentUrl}
function showError(msg){$("state").innerHTML='<i class="fa-solid fa-triangle-exclamation" style="font-size:25px"></i><div style="margin-top:10px;font-weight:800">'+msg+'</div><div style="font-size:12px;margin-top:7px">Check the blog link or try again.</div>'}
async function load(){
  if(!blogId){showError("Blog ID is missing.");return}
  try{
    const snap=await get(ref(db,"blogs/"+blogId));
    if(!snap.exists()){showError("Blog not found.");return}
    currentBlog=snap.val()||{};const uid=authorUidOf(currentBlog);
    let profile={};
    if(uid){try{const ps=await get(ref(db,"publicTeamProfiles/"+uid));if(ps.exists())profile=ps.val()||{}}catch(e){console.warn("Public author profile load failed",e)}}
    const name=first(currentBlog.authorName,currentBlog.ownerName,currentBlog.uploaderName,currentBlog.createdByName,currentBlog.displayName,profile.name,"Admin");
    const designation=first(currentBlog.designation,currentBlog.ownerDesignation,profile.designation,"Admin");
    const photo=first(currentBlog.authorPhoto,currentBlog.ownerPhoto,profilePhoto(profile));
    const im=imageOf(currentBlog),title=titleOf(currentBlog),cat=first(currentBlog.category,currentBlog.cat,"Education");
    $("title").textContent=title;$("category").innerHTML='<i class="fa-solid fa-pen-nib"></i> '+cat;$("title").textContent=title;$("authorName").textContent=name;$("authorRole").textContent=designation;$("date").textContent=dateOf(currentBlog)?"Published · "+dateOf(currentBlog):"";
    if(photo)$("avatar").src=photo;$("avatar").alt=name+" profile";
    if(im){$("hero").src=im;$("hero").hidden=false;$("sharePreview").style.display="block";$("sharePreviewImg").src=im;$("sharePreviewImg").onerror=()=>{$("sharePreview").style.display="none"}}
    const raw=String(htmlOf(currentBlog)).trim();$("content").innerHTML=/<\/?[a-z][\s\S]*>/i.test(raw)?cleanHtml(raw):raw.replace(/\n/g,"<br>");
    setMeta(currentBlog);$("state").style.display="none";$("article").style.display="block";
  }catch(e){console.error(e);showError("Unable to load blog.")}
}
function goBack(){if(history.length>1)history.back();else location.href="index.html"}window.goBack=goBack;
async function nativeShare(){if(!currentBlog)return;const data={title:titleOf(currentBlog),text:"Read this blog on Diploma Engineers: "+titleOf(currentBlog),url:currentUrl};try{const im=imageOf(currentBlog);if(navigator.share&&im&&navigator.canShare){try{const res=await fetch(im,{mode:"cors"});const blob=await res.blob();const ext=(blob.type||"image/jpeg").split("/")[1]||"jpeg";const file=new File([blob],"blog-thumbnail."+ext,{type:blob.type||"image/jpeg"});if(navigator.canShare({files:[file]})){await navigator.share({...data,files:[file]});return}}catch(e){console.warn("Thumbnail share fallback",e)}}if(navigator.share){await navigator.share(data)}else{await navigator.clipboard?.writeText(currentUrl);alert("Blog link copied!")}}catch(e){if(e?.name!=="AbortError")console.warn(e)}}
async function copyLink(){try{await navigator.clipboard.writeText(currentUrl);alert("Blog link copied!")}catch(e){prompt("Copy this blog link:",currentUrl)}}
function wa(){window.open("https://wa.me/?text="+encodeURIComponent("Read this blog: "+titleOf(currentBlog)+"\n"+currentUrl),"_blank","noopener,noreferrer")}
function tg(){window.open("https://t.me/share/url?url="+encodeURIComponent(currentUrl)+"&text="+encodeURIComponent(titleOf(currentBlog)),"_blank","noopener,noreferrer")}
$("nativeShare").onclick=nativeShare;$("copyLink").onclick=copyLink;$("shareWhatsApp").onclick=wa;$("shareTelegram").onclick=tg;load();
</script>
</body>
</html>
