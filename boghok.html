<!-- =========================================================

<style>

*{
  box-sizing:border-box;
}

#booksPage{
  width:100%;
  min-height:100vh;
  background:#f7f9fc;
}

.books-container{
  width:100%;
  max-width:1400px;
  margin:auto;
  padding:20px;
}


/* HEADER */

.books-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:18px;
}

.books-header h1{
  margin:0;
  font-size:28px;
  font-weight:800;
  color:#0f172a;
}

.books-header p{
  margin:5px 0 0;
  color:#64748b;
  font-size:13px;
}

.book-count{
  padding:8px 13px;
  border-radius:10px;
  background:#eff6ff;
  color:#2563eb;
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
}


/* SEARCH */

.books-search{
  width:100%;
  height:52px;

  display:flex;
  align-items:center;

  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;

  padding:0 16px;
  margin-bottom:20px;

  box-shadow:0 4px 15px rgba(0,0,0,.04);

  transition:.2s ease;
}

.books-search:focus-within{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.08);
}

.search-icon{
  font-size:25px;
  color:#64748b;
  margin-right:10px;
}

.books-search input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;

  font-size:15px;
  color:#111827;
}

.books-search input::placeholder{
  color:#94a3b8;
}


/* GRID */

.books-grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(190px,1fr));

  gap:18px;
  width:100%;
}


/* CARD */

.book-card{
  position:relative;

  background:#fff;

  border:1px solid #e8edf3;
  border-radius:16px;

  overflow:hidden;
  cursor:pointer;

  user-select:none;

  box-shadow:
    0 5px 18px rgba(15,23,42,.05);

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    border-color .18s ease;
}

.book-card:hover{
  transform:translateY(-4px);

  border-color:#bfdbfe;

  box-shadow:
    0 12px 28px rgba(15,23,42,.10);
}

.book-card:active{
  transform:scale(.975);
}


/* COVER */

.book-cover{
  width:100%;

  aspect-ratio:3 / 4;

  background:#eef2f7;

  overflow:hidden;

  position:relative;
}

.book-cover img{
  width:100%;
  height:100%;

  object-fit:cover;
  display:block;
}


/* LOADING */

.book-loading{
  position:absolute;

  inset:0;

  display:grid;
  place-items:center;

  color:#64748b;

  font-size:12px;

  background:
    linear-gradient(
      135deg,
      #eef2f7,
      #f8fafc
    );
}


/* PDF BADGE */

.book-pdf{
  position:absolute;

  top:9px;
  right:9px;

  padding:5px 7px;

  border-radius:6px;

  background:rgba(255,255,255,.95);

  color:#dc2626;

  font-size:9px;

  font-weight:900;

  box-shadow:
    0 3px 10px rgba(0,0,0,.10);
}


/* INFO */

.book-info{
  padding:12px;
}

.book-title{
  font-size:14px;

  font-weight:800;

  color:#111827;

  line-height:1.35;

  display:-webkit-box;

  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;

  overflow:hidden;
}

.book-category{
  display:inline-block;

  margin-top:8px;

  padding:4px 7px;

  border-radius:6px;

  background:#eff6ff;

  color:#2563eb;

  font-size:10px;

  font-weight:800;
}


/* NO BOOK */

.no-books{
  text-align:center;

  padding:70px 20px;

  color:#64748b;
}

.no-books-icon{
  font-size:48px;
  margin-bottom:12px;
}

.no-books h3{
  margin:0 0 8px;

  color:#1e293b;

  font-size:20px;
}

.no-books p{
  margin:0;

  font-size:14px;
}


/* MOBILE */

@media(max-width:600px){

  .books-container{
    padding:14px;
  }

  .books-header{
    align-items:flex-start;
    flex-direction:column;
  }

  .books-header h1{
    font-size:23px;
  }

  .books-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));

    gap:12px;
  }

  .book-card{
    border-radius:13px;
  }

  .book-info{
    padding:10px;
  }

  .book-title{
    font-size:12.5px;
  }

  .books-search{
    height:48px;
  }

}



/* =========================================================
   COMING SOON MODAL
========================================================= */
.coming-soon-overlay{
  position:fixed; inset:0; z-index:99999;
  display:none; align-items:center; justify-content:center;
  padding:20px; background:rgba(15,23,42,.55);
  backdrop-filter:blur(5px);
}
.coming-soon-overlay.show{display:flex;animation:comingFade .18s ease}
.coming-soon-card{
  width:min(420px,100%); position:relative; text-align:center;
  background:#fff; border:1px solid #e5e7eb; border-radius:24px;
  padding:30px 24px 24px; box-shadow:0 24px 70px rgba(15,23,42,.25);
  animation:comingPop .22s ease;
}
.coming-soon-close{
  position:absolute; top:10px; right:12px; width:36px; height:36px;
  border:0; border-radius:50%; background:#f1f5f9; color:#475569;
  font-size:25px; line-height:1; cursor:pointer;
}
.coming-soon-icon{
  width:72px; height:72px; margin:0 auto 14px; display:grid;
  place-items:center; border-radius:20px; background:#eff6ff; font-size:36px;
}
.coming-soon-badge{
  display:inline-block; padding:6px 11px; border-radius:999px;
  background:#fff7ed; color:#ea580c; font-size:11px;
  font-weight:900; letter-spacing:.7px;
}
.coming-soon-card h2{margin:13px 0 7px;color:#0f172a;font-size:23px;font-weight:900}
.coming-soon-card p{margin:0 auto 20px;max-width:330px;color:#64748b;font-size:14px;line-height:1.55}
.coming-soon-ok{
  width:100%; min-height:46px; border:0; border-radius:12px;
  background:#2563eb; color:#fff; font-size:14px; font-weight:800; cursor:pointer;
}
@keyframes comingFade{from{opacity:0}to{opacity:1}}
@keyframes comingPop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:600px){.coming-soon-card{border-radius:20px;padding:27px 18px 20px}}

</style>
