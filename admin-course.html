<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Course Admin | Diploma Engineers</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Poppins,sans-serif;
    background:#f5f7fb;
    color:#172033;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

.header{
    background:#fff;
    border-bottom:1px solid #e7eaf0;
    position:sticky;
    top:0;
    z-index:100;
}

.nav{
    max-width:1200px;
    min-height:68px;
    margin:auto;
    padding:10px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:800;
    text-decoration:none;
    color:#172033;
}

.logo img{
    width:40px;
    height:40px;
    object-fit:contain;
    border-radius:10px;
}

.nav-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.nav-btn{
    border:0;
    background:#f1f3f7;
    color:#333;
    padding:9px 14px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

.logout{
    background:#fff0ed;
    color:#e53935;
}

/* PAGE */

.container{
    max-width:1200px;
    margin:auto;
    padding:30px 20px 60px;
}

.page-title{
    margin-bottom:25px;
}

.page-title h1{
    font-size:28px;
    font-weight:800;
}

.page-title p{
    color:#737b8b;
    font-size:13px;
    margin-top:5px;
}

/* PROFILE */

.profile-bar{
    background:#fff;
    border:1px solid #e8ebf1;
    border-radius:16px;
    padding:15px 18px;
    margin-bottom:22px;
    display:flex;
    align-items:center;
    gap:13px;
}

.profile-bar img{
    width:48px;
    height:48px;
    border-radius:50%;
    object-fit:cover;
}

.profile-info{
    flex:1;
}

.profile-info strong{
    display:block;
    font-size:14px;
}

.profile-info span{
    font-size:11px;
    color:#ff6b00;
    font-weight:600;
}

/* FORM */

.card{
    background:#fff;
    border:1px solid #e8ebf1;
    border-radius:18px;
    padding:24px;
    margin-bottom:25px;
    box-shadow:0 6px 25px rgba(20,30,50,.04);
}

.card-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:17px;
    font-weight:700;
    margin-bottom:20px;
}

.card-title i{
    color:#ff6b00;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:17px;
}

.full{
    grid-column:1/-1;
}

label{
    display:block;
    font-size:12px;
    font-weight:600;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;
    border:1px solid #dfe3ea;
    border-radius:10px;
    padding:12px 13px;
    outline:none;
    background:#fff;
    color:#172033;
    font-size:13px;
}

textarea{
    min-height:110px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#ff6b00;
    box-shadow:0 0 0 3px rgba(255,107,0,.08);
}

.help{
    display:block;
    color:#8a92a1;
    font-size:10px;
    margin-top:5px;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:22px;
}

.btn{
    border:0;
    border-radius:10px;
    padding:12px 18px;
    cursor:pointer;
    font-weight:700;
    font-size:13px;
}

.btn-primary{
    background:#ff6b00;
    color:#fff;
}

.btn-primary:hover{
    background:#e85f00;
}

.btn-secondary{
    background:#eef1f5;
    color:#333;
}

.btn-danger{
    background:#fff0ed;
    color:#e53935;
}

/* STATUS */

.status{
    display:none;
    padding:12px 15px;
    border-radius:10px;
    font-size:12px;
    margin-bottom:18px;
}

.status.show{
    display:block;
}

.status.success{
    background:#eaf8ef;
    color:#198754;
}

.status.error{
    background:#fff0ed;
    color:#d93025;
}

/* COURSES */

.course-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:18px;
}

.course-card{
    background:#fff;
    border:1px solid #e7eaf0;
    border-radius:17px;
    overflow:hidden;
    box-shadow:0 6px 22px rgba(20,30,50,.04);
}

.course-image{
    width:100%;
    height:160px;
    object-fit:cover;
    background:#f1f3f7;
}

.course-body{
    padding:17px;
}

.course-body h3{
    font-size:16px;
    line-height:1.4;
    margin-bottom:7px;
}

.course-meta{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:10px;
}

.badge{
    background:#fff1e8;
    color:#e85f00;
    padding:4px 8px;
    border-radius:20px;
    font-size:10px;
    font-weight:600;
}

.badge.green{
    background:#eaf8ef;
    color:#198754;
}

.badge.red{
    background:#fff0ed;
    color:#d93025;
}

.course-description{
    color:#707887;
    font-size:11px;
    line-height:1.6;
    min-height:38px;
}

.course-footer{
    padding:13px 17px;
    border-top:1px solid #edf0f4;
    display:flex;
    gap:8px;
}

.small-btn{
    flex:1;
    border:0;
    padding:9px;
    border-radius:8px;
    cursor:pointer;
    font-size:11px;
    font-weight:600;
}

.edit-btn{
    background:#eef5ff;
    color:#1769aa;
}

.delete-btn{
    background:#fff0ed;
    color:#e53935;
}

.empty{
    text-align:center;
    padding:50px 20px;
    background:#fff;
    border:1px solid #e7eaf0;
    border-radius:17px;
    color:#777;
}

.empty i{
    font-size:35px;
    color:#ff6b00;
    margin-bottom:12px;
}

/* LOADING */

.loading-screen{
    position:fixed;
    inset:0;
    background:#fff;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

.loading-screen i{
    font-size:35px;
    color:#ff6b00;
    margin-bottom:12px;
}

.loading-screen p{
    font-size:13px;
    color:#777;
}

/* ACCESS DENIED */

.access{
    display:none;
    min-height:100vh;
    align-items:center;
    justify-content:center;
    padding:20px;
    text-align:center;
}

.access-box{
    max-width:450px;
    background:#fff;
    padding:35px 25px;
    border-radius:20px;
    border:1px solid #e7eaf0;
}

.access-box i{
    font-size:45px;
    color:#e53935;
    margin-bottom:15px;
}

.access-box h2{
    margin-bottom:8px;
}

.access-box p{
    color:#777;
    font-size:13px;
    line-height:1.7;
}

.access-box button{
    margin-top:18px;
}

/* MOBILE */

@media(max-width:700px){

    .nav{
        padding:9px 13px;
    }

    .logo{
        font-size:15px;
    }

    .logo img{
        width:35px;
        height:35px;
    }

    .container{
        padding:22px 13px 50px;
    }

    .page-title h1{
        font-size:23px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .card{
        padding:18px;
    }

    .profile-bar{
        padding:12px;
    }

    .nav-right .nav-btn span{
        display:none;
    }

    .actions{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }

    .course-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<!-- LOADING -->
<div id="loadingScreen" class="loading-screen">
    <i class="fa-solid fa-spinner fa-spin"></i>
    <p>Checking admin access...</p>
</div>


<!-- ACCESS DENIED -->
<div id="accessDenied" class="access">

    <div class="access-box">

        <i class="fa-solid fa-lock"></i>

        <h2>Access Denied</h2>

        <p id="accessMessage">
            You don't have permission to access this page.
        </p>

        <button
            class="btn btn-primary"
            onclick="goLogin()">
            Go to Login
        </button>

    </div>

</div>


<!-- MAIN APP -->
<div id="mainApp" style="display:none;">

<header class="header">

    <div class="nav">

        <a href="admin-panel.html" class="logo">

            <img
                src="https://diplomaengineers.vercel.app/logo.png"
                onerror="this.style.display='none'"
                alt="Diploma Engineers">

            Diploma Engineers

        </a>

        <div class="nav-right">

            <button
                class="nav-btn"
                onclick="goPanel()">

                <i class="fa-solid fa-gauge"></i>
                <span>Panel</span>

            </button>

            <button
                class="nav-btn logout"
                onclick="logout()">

                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>

            </button>

        </div>

    </div>

</header>


<main class="container">

    <div class="page-title">

        <h1>
            <i class="fa-solid fa-graduation-cap"
               style="color:#ff6b00"></i>
            Course Manager
        </h1>

        <p>
            Create and manage your Diploma Engineers courses.
        </p>

    </div>


    <!-- ADMIN PROFILE -->

    <div class="profile-bar">

        <img
            id="adminPhoto"
            src=""
            alt="Admin">

        <div class="profile-info">

            <strong id="adminName">
                Admin
            </strong>

            <span id="adminDesignation">
                ADMIN
            </span>

        </div>

        <button
            class="nav-btn"
            onclick="openProfile()">

            <i class="fa-solid fa-user"></i>

        </button>

    </div>


    <!-- STATUS -->

    <div id="statusBox" class="status"></div>


    <!-- COURSE FORM -->

    <div class="card">

        <div class="card-title">

            <i class="fa-solid fa-plus-circle"></i>

            <span id="formTitle">
                Add New Course
            </span>

        </div>


        <form id="courseForm">

            <input
                type="hidden"
                id="courseId">


            <div class="form-grid">


                <!-- TITLE -->

                <div class="full">

                    <label>
                        Course Title *
                    </label>

                    <input
                        type="text"
                        id="title"
                        required
                        placeholder="Example: Civil Engineering 2nd Year">

                </div>


                <!-- CATEGORY -->

                <div>

                    <label>
                        Category *
                    </label>

                    <select id="category" required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Civil Engineering">
                            Civil Engineering
                        </option>

                        <option value="Mechanical Engineering">
                            Mechanical Engineering
                        </option>

                        <option value="Electrical Engineering">
                            Electrical Engineering
                        </option>

                        <option value="Electronics Engineering">
                            Electronics Engineering
                        </option>

                        <option value="Computer Science">
                            Computer Science
                        </option>

                        <option value="Information Technology">
                            Information Technology
                        </option>

                        <option value="Agriculture Engineering">
                            Agriculture Engineering
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- YEAR -->

                <div>

                    <label>
                        Year / Semester
                    </label>

                    <input
                        type="text"
                        id="year"
                        placeholder="Example: 2nd Year / Sem 3 & 4">

                </div>


                <!-- PRICE -->

                <div>

                    <label>
                        Price
                    </label>

                    <input
                        type="number"
                        id="price"
                        min="0"
                        value="0"
                        placeholder="0">

                    <small class="help">
                        Enter 0 for a free course.
                    </small>

                </div>


                <!-- STATUS -->

                <div>

                    <label>
                        Course Status
                    </label>

                    <select id="status">

                        <option value="pending">
                            Pending
                        </option>

                        <option value="approved">
                            Approved
                        </option>

                        <option value="published">
                            Published
                        </option>

                        <option value="draft">
                            Draft
                        </option>

                        <option value="rejected">
                            Rejected
                        </option>

                    </select>

                </div>


                <!-- SHORT DESCRIPTION -->

                <div class="full">

                    <label>
                        Short Description
                    </label>

                    <input
                        type="text"
                        id="shortDescription"
                        placeholder="Short description shown on course card">

                </div>


                <!-- FULL DESCRIPTION -->

                <div class="full">

                    <label>
                        Full Description
                    </label>

                    <textarea
                        id="description"
                        placeholder="Write complete course description..."></textarea>

                </div>


                <!-- IMAGE -->

                <div class="full">

                    <label>
                        Course Image URL
                    </label>

                    <input
                        type="url"
                        id="image"
                        placeholder="https://...">

                    <small class="help">
                        Paste the direct image URL.
                    </small>

                </div>


                <!-- COURSE URL -->

                <div class="full">

                    <label>
                        Course Page URL
                    </label>

                    <input
                        type="url"
                        id="courseUrl"
                        placeholder="https://diplomaengineers.vercel.app/...">

                </div>


                <!-- PDF -->

                <div>

                    <label>
                        PDF URL
                    </label>

                    <input
                        type="url"
                        id="pdfUrl"
                        placeholder="https://...">

                </div>


                <!-- VIDEO -->

                <div>

                    <label>
                        Video URL
                    </label>

                    <input
                        type="url"
                        id="videoUrl"
                        placeholder="https://youtube.com/...">

                </div>


            </div>


            <div class="actions">

                <button
                    type="submit"
                    class="btn btn-primary"
                    id="saveBtn">

                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    Save Course

                </button>

                <button
                    type="button"
                    class="btn btn-secondary"
                    id="cancelBtn"
                    onclick="resetForm()"
                    style="display:none;">

                    Cancel Edit

                </button>

            </div>

        </form>

    </div>


    <!-- MY COURSES -->

    <div class="card">

        <div class="card-title">

            <i class="fa-solid fa-layer-group"></i>

            <span>My Courses</span>

        </div>

        <div id="courseList">

            <div class="empty">

                <i class="fa-solid fa-spinner fa-spin"></i>

                <p>Loading courses...</p>

            </div>

        </div>

    </div>

</main>

</div>


<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getDatabase,
    ref,
    get,
    set,
    update,
    remove
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey: "AIzaSyAbgQ1lZPgF7mwaxyin7iglla01eD_kTKo",

    authDomain:
        "diplomaengineers-869df.firebaseapp.com",

    databaseURL:
        "https://diplomaengineers-869df-default-rtdb.firebaseio.com",

    projectId:
        "diplomaengineers-869df",

    storageBucket:
        "diplomaengineers-869df.appspot.com",

    messagingSenderId:
        "356779436080",

    appId:
        "1:356779436080:web:4b28da380e547420d0e5f5"

};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getDatabase(app);


/* OWNER */

const OWNER_EMAIL =
    "astar22072006@gmail.com";


let currentUser = null;
let currentProfile = null;
let allCourses = [];


/* =====================================================
   ELEMENTS
===================================================== */

const loadingScreen =
    document.getElementById("loadingScreen");

const mainApp =
    document.getElementById("mainApp");

const accessDenied =
    document.getElementById("accessDenied");

const accessMessage =
    document.getElementById("accessMessage");


/* =====================================================
   AUTH CHECK
===================================================== */

onAuthStateChanged(auth, async (user)=>{

    if(!user){

        showAccess(
            "Please login to access the Course Admin Panel."
        );

        return;

    }


    currentUser = user;


    try{

        const profileSnap =
            await get(
                ref(db,"adminProfiles/"+user.uid)
            );


        if(!profileSnap.exists()){

            showAccess(
                "Admin profile was not found."
            );

            return;

        }


        currentProfile =
            profileSnap.val();


        const email =
            String(user.email || "")
            .toLowerCase();


        const isOwner =
            email === OWNER_EMAIL;


        const isApproved =
            currentProfile.status === "approved";


        /*
         * OWNER:
         * Always allowed.
         *
         * OTHER ADMINS:
         * Must be approved.
         */

        if(!isOwner && !isApproved){

            if(currentProfile.status === "pending"){

                showAccess(
                    "Your admin account is still pending approval."
                );

            }else if(currentProfile.status === "rejected"){

                showAccess(
                    "Your admin account has been rejected."
                );

            }else{

                showAccess(
                    "Your account does not have a valid approval status."
                );

            }

            return;

        }


        /* ACCESS GRANTED */

        loadingScreen.style.display =
            "none";

        mainApp.style.display =
            "block";


        loadAdminProfile();

        loadCourses();


    }catch(error){

        console.error(error);

        showAccess(
            "Unable to verify your admin profile. Please try again."
        );

    }

});


/* =====================================================
   ACCESS
===================================================== */

function showAccess(message){

    loadingScreen.style.display =
        "none";

    mainApp.style.display =
        "none";

    accessDenied.style.display =
        "flex";

    accessMessage.textContent =
        message;

}


/* =====================================================
   ADMIN PROFILE
===================================================== */

function loadAdminProfile(){

    const profile =
        currentProfile || {};


    document.getElementById("adminName")
        .textContent =
        profile.name ||
        currentUser.displayName ||
        "Admin";


    document.getElementById("adminDesignation")
        .textContent =
        profile.designation ||
        "ADMIN";


    document.getElementById("adminPhoto")
        .src =
        profile.photo ||
        `https://ui-avatars.com/api/?name=${
            encodeURIComponent(profile.name || "Admin")
        }&background=ff6b00&color=fff&size=200`;

}


/* =====================================================
   LOAD COURSES
===================================================== */

async function loadCourses(){

    const list =
        document.getElementById("courseList");


    try{

        const snap =
            await get(ref(db,"courses"));


        allCourses = [];


        if(snap.exists()){

            const data =
                snap.val();


            Object.entries(data).forEach(
                ([id,course])=>{

                    /*
                     * Show only courses created by
                     * the currently logged-in admin.
                     */

                    if(
                        course.authorUid === currentUser.uid ||
                        course.adminUid === currentUser.uid
                    ){

                        allCourses.push({

                            id,
                            ...course

                        });

                    }

                }
            );

        }


        /*
         * Newest first
         */

        allCourses.sort(
            (a,b)=>
                Number(b.updatedAt || b.createdAt || 0)
                -
                Number(a.updatedAt || a.createdAt || 0)
        );


        renderCourses();


    }catch(error){

        console.error(error);

        list.innerHTML = `
            <div class="empty">

                <i class="fa-solid fa-triangle-exclamation"></i>

                <h3>Unable to Load Courses</h3>

                <p>
                    ${escapeHTML(error.message)}
                </p>

            </div>
        `;

    }

}


/* =====================================================
   RENDER
===================================================== */

function renderCourses(){

    const list =
        document.getElementById("courseList");


    if(!allCourses.length){

        list.innerHTML = `
            <div class="empty">

                <i class="fa-solid fa-book-open"></i>

                <h3>No Courses Yet</h3>

                <p>
                    Create your first course using the form above.
                </p>

            </div>
        `;

        return;

    }


    list.innerHTML = `
        <div class="course-grid">

            ${allCourses.map(course=>{

                const image =
                    course.image ||
                    "https://placehold.co/800x450?text=Diploma+Engineers";


                const status =
                    course.status ||
                    "pending";


                let statusClass =
                    "";

                if(
                    status === "approved" ||
                    status === "published"
                ){

                    statusClass =
                        "green";

                }else if(status === "rejected"){

                    statusClass =
                        "red";

                }


                return `

                <div class="course-card">

                    <img
                        class="course-image"
                        src="${escapeAttribute(image)}"
                        alt="${escapeAttribute(course.title || "Course")}"
                        onerror="this.src='https://placehold.co/800x450?text=Diploma+Engineers'"
                    >

                    <div class="course-body">

                        <h3>
                            ${escapeHTML(
                                course.title || "Untitled Course"
                            )}
                        </h3>

                        <div class="course-meta">

                            ${
                                course.category
                                ?
                                `<span class="badge">
                                    ${escapeHTML(course.category)}
                                </span>`
                                :
                                ""
                            }

                            ${
                                course.year
                                ?
                                `<span class="badge">
                                    ${escapeHTML(course.year)}
                                </span>`
                                :
                                ""
                            }

                            <span class="badge ${statusClass}">
                                ${escapeHTML(status)}
                            </span>

                        </div>

                        <div class="course-description">

                            ${escapeHTML(
                                course.shortDescription ||
                                course.description ||
                                "No description available."
                            )}

                        </div>

                    </div>

                    <div class="course-footer">

                        <button
                            class="small-btn edit-btn"
                            onclick="editCourse('${course.id}')">

                            <i class="fa-solid fa-pen"></i>
                            Edit

                        </button>

                        <button
                            class="small-btn delete-btn"
                            onclick="deleteCourse('${course.id}')">

                            <i class="fa-solid fa-trash"></i>
                            Delete

                        </button>

                    </div>

                </div>
