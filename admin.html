<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firebase Admin Panel</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

.container{
max-width:900px;
margin:30px auto;
padding:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-bottom:20px;
}

input,textarea,select{
width:100%;
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:6px;
box-sizing:border-box;
}

button{
padding:10px 18px;
background:#0d6efd;
color:#fff;
border:none;
border-radius:6px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#084298;
}

.item{
border-top:1px solid #ddd;
padding:15px 0;
}

.small{
font-size:13px;
color:#666;
}

img{
max-width:150px;
border-radius:8px;
margin-top:8px;
}

#adminPanel{
display:none;
}
</style>

</head>
<body>

<div class="container">

<div id="loginBox" class="card">

<h2>Admin Login</h2>

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<button id="loginBtn">Login</button>

</div>

<div id="adminPanel">

<div class="card">

<h2>News Admin Panel</h2>

<input id="title" placeholder="News Title">

<textarea id="desc" placeholder="Description"></textarea>

<input id="thumb" placeholder="Thumbnail URL">

<input id="pdf" placeholder="PDF / Google Drive Link">

<select id="cat">
<option>Notice</option>
<option>Result</option>
<option>Admission</option>
</select>

<button id="publishBtn">Publish News</button>

<button id="logoutBtn">Logout</button>

</div>

<div class="card">

<h3>Published News</h3>

<div id="list"></div>

</div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {

apiKey:"AIzaSyCcFZaHR5392I-zPgghzyTSHD53FRt4YKI",

authDomain:"myadmin-1b75f.firebaseapp.com",

projectId:"myadmin-1b75f",

storageBucket:"myadmin-1b75f.firebasestorage.app",

messagingSenderId:"1018557109448",

appId:"1:1018557109448:web:a0990e81d47ac64e6801fd"

};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);

const loginBox=document.getElementById("loginBox");

const adminPanel=document.getElementById("adminPanel");

const list=document.getElementById("list");

document.getElementById("loginBtn").onclick=()=>{

signInWithEmailAndPassword(

auth,

email.value,

password.value

)

.then(()=>alert("Login Success"))

.catch(e=>alert(e.message));

};

onAuthStateChanged(auth,user=>{

if(user){

loginBox.style.display="none";

adminPanel.style.display="block";

loadNews();

}else{

loginBox.style.display="block";

adminPanel.style.display="none";

}

});

publishBtn.onclick=async()=>{

await addDoc(collection(db,"news"),{

title:title.value,

desc:desc.value,

thumb:thumb.value,

pdf:pdf.value,

cat:cat.value,

date:serverTimestamp()

});

title.value="";
desc.value="";
thumb.value="";
pdf.value="";

loadNews();

alert("News Published");

};

async function loadNews(){

list.innerHTML="Loading...";

const snap=await getDocs(collection(db,"news"));

list.innerHTML="";

snap.forEach(d=>{

const n=d.data();

list.innerHTML+=`

<div class="item">

<b>${n.title}</b><br>

<span class="small">${n.cat}</span><br>

${n.thumb?`<img src="${n.thumb}">`:""}

<p>${n.desc}</p>

<a href="${n.pdf}" target="_blank">Open PDF</a>

<br><br>

<button onclick="window.deleteNews('${d.id}')">

Delete

</button>

</div>

`;

});

}

window.deleteNews=async(id)=>{

if(confirm("Delete News?")){

await deleteDoc(doc(db,"news",id));

loadNews();

}

};

logoutBtn.onclick=()=>{

signOut(auth);

};

</script>

</body>
</html>
