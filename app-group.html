<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Branch Groups - Diploma Engineers</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #f8fafc;
      font-family: Arial, sans-serif;
      color: #0f172a;
    }

    .groups-page {
      width: 100%;
      padding: 12px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 800;
      margin: 5px 0 14px;
    }

    .section-title span {
      color: #2563eb;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .card-box {
      min-height: 92px;
      padding: 16px 10px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      text-decoration: none;
      color: #0f172a;
      box-shadow: 0 3px 12px rgba(15, 23, 42, .06);
      transition: .2s ease;
      cursor: pointer;
    }

    .card-box:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 18px rgba(15, 23, 42, .10);
    }

    .card-box:active {
      transform: scale(.97);
    }

    .card-box i {
      font-size: 27px;
      margin-bottom: 9px;
    }

    .card-box p {
      margin: 0;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.3;
    }

    .whatsapp {
      color: #16a34a;
    }

    .telegram {
      color: #229ed9;
    }

    .youtube {
      color: #dc2626;
    }

    .cse {
      color: #2563eb;
    }

    .electrical {
      color: #f59e0b;
    }

    .electronics {
      color: #7c3aed;
    }

    .civil {
      color: #16a34a;
    }

    .mechanical {
      color: #475569;
    }

    .agriculture {
      color: #65a30d;
    }

    @media (max-width: 420px) {
      .groups-page {
        padding: 10px;
      }

      .grid-2 {
        gap: 8px;
      }

      .card-box {
        min-height: 88px;
        border-radius: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="groups-page">

    <div class="section-title">
      Branch <span>Groups</span>
    </div>

    <div class="grid-2">

      <a
        href="https://whatsapp.com/channel/0029Vay8k8CAojYkBQWr1s1w"
        target="_blank"
        rel="noopener noreferrer"
        class="card-box"
      >
        <i class="fab fa-whatsapp whatsapp"></i>
        <p>WhatsApp Channel</p>
      </a>

      <a
        href="https://t.me/diploma_engineers7"
        target="_blank"
        rel="noopener noreferrer"
        class="card-box"
      >
        <i class="fab fa-telegram telegram"></i>
        <p>Telegram Channel</p>
      </a>

      <a
        href="https://youtube.com/@diploma_engineers7"
        target="_blank"
        rel="noopener noreferrer"
        class="card-box"
      >
        <i class="fab fa-youtube youtube"></i>
        <p>YouTube Channel</p>
      </a>

      <a
        href="https://chat.whatsapp.com/EwcNB2zsyjABNlYj0QHzLt"
        target="_blank"
        rel="noopener noreferrer"
        class="card-box"
      >
        <i class="fas fa-laptop-code cse"></i>
        <p>CSE / IT Group</p>
      </a>

      <a
        href="https://chat.whatsapp.com/Ce9aNCFeRQP6r2ttYJUo3Z"
        target="_blank"
        rel="noopener noreferrer"
        class="card-box"
      >
        <i class="fas fa-bolt electrical"></i>
        <p>Electrical Group</p>
      </a>

      <a
        href="https://chat.whatsapp.com/BfOSLGkEevr8lrY6vesjtl"
        target="_blank"
        rel="noopener noreferrer"
        class="card-box"
      >
        <i class="fas fa-microchip electronics"></i>
        <p>Electronics Group</p>
      </a>

      <a
        href="https://chat.whatsapp.com/L5SSM7kbHHA9Jhhl6NeRbs"
        target="_blank"
        rel="noopener noreferrer"
        class="card-box"
      >
        <i class="fas fa-building civil"></i>
        <p>Civil Group</p>
      </a>

      <a
        href="https://chat.whatsapp.com/BsQBRtycNmBIHAmLZhwCUl"
        target="_blank"
        rel="noopener noreferrer"
        class="card-box"
      >
        <i class="fas fa-cogs mechanical"></i>
        <p>Mechanical Group</p>
      </a>

      <a
        href="https://chat.whatsapp.com/JQaURTpcwAU10Q0B5fmAyU"
        target="_blank"
        rel="noopener noreferrer"
        class="card-box"
      >
        <i class="fas fa-seedling agriculture"></i>
        <p>Agriculture Group</p>
      </a>

    </div>

  </div>

</body>
</html>
