 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Semester 1 | Diploma Engineers</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{background:#f5f7fb;color:#222}
.hero{padding:110px 20px 60px;text-align:center;background:#fff}
.hero h1{font-size:38px;color:#2563eb}
.hero p{max-width:650px;margin:10px auto;color:#666}
.wrap{width:92%;max-width:1200px;margin:auto;padding:40px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:25px}
.card{background:#fff;padding:25px;border-radius:18px;text-align:center;box-shadow:0 8px 25px rgba(0,0,0,.08);transition:.3s}
.card:hover{transform:translateY(-8px)}
.card i{font-size:45px;color:#2563eb;margin-bottom:15px}
.card h3{margin-bottom:15px}
.btn{display:block;margin:8px 0;padding:12px;border-radius:30px;text-decoration:none;background:#2563eb;color:#fff;font-weight:600}
.btn:hover{background:#1d4ed8}
</style>
</head>

<body>

<div id="header"></div>

<section class="hero">
<h1>Semester 1</h1>
<p>Books, Notes, PYQ & Practical Files</p>
</section>

<div class="wrap">
<div class="grid">

<div class="card">
<i class="fas fa-square-root-alt"></i>
<h3>Applied Mathematics I</h3>
<a href="#" class="btn">Book</a>
<a href="#" class="btn">Notes</a>
<a href="#" class="btn">PYQ</a>
</div>

<div class="card">
<i class="fas fa-atom"></i>
<h3>Applied Physics I</h3>
<a href="#" class="btn">Book</a>
<a href="#" class="btn">Notes</a>
<a href="#" class="btn">PYQ</a>
<a href="#" class="btn">Practical</a>
</div>

<div class="card">
<i class="fas fa-flask"></i>
<h3>Applied Chemistry</h3>
<a href="#" class="btn">Book</a>
<a href="#" class="btn">Notes</a>
<a href="#" class="btn">PYQ</a>
<a href="#" class="btn">Practical</a>
</div>

<div class="card">
<i class="fas fa-comments"></i>
<h3>Communication Skills</h3>
<a href="#" class="btn">Book</a>
<a href="#" class="btn">Notes</a>
<a href="#" class="btn">PYQ</a>
<a href="#" class="btn">Practical</a>
</div>

<div class="card">
<i class="fas fa-pencil-ruler"></i>
<h3>Engineering Drawing</h3>
<a href="#" class="btn">Book</a>
<a href="#" class="btn">PYQ</a>
</div>

  

</div>
</div>

<div id="footer"></div>

<script>
["header","footer"].forEach(id=>
fetch(id+".html")
.then(r=>r.text())
.then(t=>document.getElementById(id).innerHTML=t)
);
</script>

</body>
</html>
