<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>

  <!-- Bootstrap 5 CSS & FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --bg-color: #f8f9fa;
      --text-color: #212529;
      --sidebar-bg: #1e293b;
      --sidebar-text: #cbd5e1;
      --card-bg: #ffffff;
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --text-color: #f8fafc;
      --sidebar-bg: #020617;
      --sidebar-text: #94a3b8;
      --card-bg: #1e293b;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: all 0.3s ease;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Sidebar Styling */
    #sidebar {
      min-width: 250px;
      max-width: 250px;
      background-color: var(--sidebar-bg);
      min-height: 100vh;
      transition: all 0.3s;
    }

    #sidebar .nav-link {
      color: var(--sidebar-text);
      padding: 12px 20px;
      border-radius: 8px;
      margin: 4px 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #sidebar .nav-link:hover, #sidebar .nav-link.active {
      background-color: #334155;
      color: #fff;
    }

    /* Custom Cards */
    .dashboard-card {
      background-color: var(--card-bg);
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .table-container {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>

  <div class="d-flex">
    <!-- SIDEBAR -->
    <nav id="sidebar" class="d-flex flex-column justify-content-between p-3">
      <div>
        <a href="#" class="d-flex align-items-center mb-4 text-white text-decoration-none px-2">
          <i class="fa-solid fa-shield-halved fa-2x me-2 text-primary"></i>
          <span class="fs-4 fw-bold">AdminPanel</span>
        </a>
        <hr class="text-secondary" />
        <ul class="nav nav-pills flex-column mb-auto">
          <li class="nav-item">
            <a href="#" class="nav-link active"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
          </li>
          <li>
            <a href="#" class="nav-link"><i class="fa-solid fa-users"></i> Users Management</a>
          </li>
          <li>
            <a href="#" class="nav-link"><i class="fa-solid fa-box-archive"></i> Resources</a>
          </li>
          <li>
            <a href="#" class="nav-link"><i class="fa-solid fa-gear"></i> Settings</a>
          </li>
        </ul>
      </div>
      <div>
        <hr class="text-secondary" />
        <button class="btn btn-outline-light w-100" id="themeToggle">
          <i class="fa-solid fa-moon me-2"></i> Dark Mode
        </button>
      </div>
    </nav>

    <!-- MAIN CONTENT AREA -->
    <div class="flex-grow-1 p-4">
      <!-- HEADER -->
      <header class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="fw-bold mb-0">Overview</h2>
          <small class="text-muted">Welcome back, Super Admin</small>
        </div>
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addUserModal">
            <i class="fa-solid fa-plus me-1"></i> Add User
          </button>
        </div>
      </header>

      <!-- METRIC CARDS -->
      <div class="row g-3 mb-4">
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="card dashboard-card p-3">
            <div class="d-flex align-items-center justify-content-between">
              <div>
                <span class="text-muted fs-6">Total Users</span>
                <h3 class="fw-bold my-1" id="totalUsersCount">0</h3>
              </div>
              <div class="bg-primary-subtle text-primary p-3 rounded-circle">
                <i class="fa-solid fa-users fa-lg"></i>
              </div>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="card dashboard-card p-3">
            <div class="d-flex align-items-center justify-content-between">
              <div>
                <span class="text-muted fs-6">Active Status</span>
                <h3 class="fw-bold my-1 text-success">98.2%</h3>
              </div>
              <div class="bg-success-subtle text-success p-3 rounded-circle">
                <i class="fa-solid fa-circle-check fa-lg"></i>
              </div>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="card dashboard-card p-3">
            <div class="d-flex align-items-center justify-content-between">
              <div>
                <span class="text-muted fs-6">System Alert</span>
                <h3 class="fw-bold my-1 text-warning">0 Issues</h3>
              </div>
              <div class="bg-warning-subtle text-warning p-3 rounded-circle">
                <i class="fa-solid fa-triangle-exclamation fa-lg"></i>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- DATA TABLE AREA -->
      <div class="table-container">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <h5 class="fw-bold mb-0">Registered Accounts</h5>
          <div class="w-auto">
            <input type="text" id="searchInput" class="form-control" placeholder="Search by name or email..." />
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="userTableBody">
              <!-- Dynamic JS rows inserted here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- ADD USER MODAL -->
  <div class="modal fade" id="addUserModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Create New User</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="addUserForm">
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" id="userName" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <input type="email" id="userEmail" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Role</label>
              <select id="userRole" class="form-select">
                <option value="Admin">Admin</option>
                <option value="Editor">Editor</option>
                <option value="Student">Student</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">Save Account</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- JS DEPENDENCIES -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Initial Mock Data
    let users = [
      { id: 101, name: "Aarav Sharma", email: "aarav@example.com", role: "Admin", status: "Active" },
      { id: 102, name: "Priya Verma", email: "priya@example.com", role: "Editor", status: "Active" },
      { id: 103, name: "Rohan Patel", email: "rohan@example.com", role: "Student", status: "Inactive" }
    ];

    // DOM Elements
    const userTableBody = document.getElementById('userTableBody');
    const totalUsersCount = document.getElementById('totalUsersCount');
    const addUserForm = document.getElementById('addUserForm');
    const searchInput = document.getElementById('searchInput');
    const themeToggle = document.getElementById('themeToggle');

    // Render Data to Table
    function renderTable(data = users) {
      userTableBody.innerHTML = '';
      data.forEach((user) => {
        const row = `
          <tr>
            <td>#${user.id}</td>
            <td class="fw-semibold">${user.name}</td>
            <td>${user.email}</td>
            <td><span class="badge bg-secondary">${user.role}</span></td>
            <td>
              <span class="badge ${user.status === 'Active' ? 'bg-success' : 'bg-danger'}">
                ${user.status}
              </span>
            </td>
            <td>
              <button class="btn btn-sm btn-outline-danger" onclick="deleteUser(${user.id})">
                <i class="fa-solid fa-trash"></i>
              </button>
            </td>
          </tr>
        `;
        userTableBody.innerHTML += row;
      });
      totalUsersCount.innerText = users.length;
    }

    // Add New User
    addUserForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const newUser = {
        id: Math.floor(100 + Math.random() * 900),
        name: document.getElementById('userName').value,
        email: document.getElementById('userEmail').value,
        role: document.getElementById('userRole').value,
        status: 'Active'
      };
      users.push(newUser);
      renderTable();
      addUserForm.reset();
      
      // Close Modal
      const modalElement = document.getElementById('addUserModal');
      const modalInstance = bootstrap.Modal.getInstance(modalElement);
      modalInstance.hide();
    });

    // Delete User
    function deleteUser(id) {
      users = users.filter(user => user.id !== id);
      renderTable();
    }

    // Live Search Filter
    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = users.filter(u => 
        u.name.toLowerCase().includes(term) || 
        u.email.toLowerCase().includes(term)
      );
      renderTable(filtered);
    });

    // Dark / Light Theme Toggle
    themeToggle.addEventListener('click', () => {
      const currentTheme = document.body.getAttribute('data-theme');
      if (currentTheme === 'dark') {
        document.body.removeAttribute('data-theme');
        themeToggle.innerHTML = `<i class="fa-solid fa-moon me-2"></i> Dark Mode`;
      } else {
        document.body.setAttribute('data-theme', 'dark');
        themeToggle.innerHTML = `<i class="fa-solid fa-sun me-2"></i> Light Mode`;
      }
    });

    // Initial Load
    renderTable();
  </script>
</body>
</html>
