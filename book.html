/* =========================================================
   NOTE:
   Exact source lists contain overlapping titles.
   Remove duplicates by PDF URL.
========================================================= */

function removeDuplicates(list){

  const seen = new Set();

  return list.filter(book => {

    const key =
      book.pdf ||
      book.title.toLowerCase();

    if(seen.has(key)){
      return false;
    }

    seen.add(key);

    return true;

  });

}


let books =
  removeDuplicates(defaultBooks);


/* =========================================================
   GOOGLE BOOKS COVER
========================================================= */

function googleCoverUrl(title){

  return (
    "https://www.googleapis.com/books/v1/volumes?q=" +
    encodeURIComponent(title) +
    "&maxResults=1"
  );

}


function fallbackCover(title){

  return (
    "https://dummyimage.com/600x800/eaf2ff/1d4ed8.png?text=" +
    encodeURIComponent(title)
  );

}


async function getCover(book){

  /* Use supplied image first */

  if(book.image){
    return book.image;
  }


  /* Google Books cover */

  try{

    const response =
      await fetch(googleCoverUrl(book.title));

    const data =
      await response.json();

    const info =
      data.items?.[0]?.volumeInfo;

    const image =
      info?.imageLinks?.thumbnail;

    if(image){

      return image.replace(
        "http:",
        "https:"
      );

    }

  }catch(error){

    console.log(
      "Cover loading error:",
      error
    );

  }


  return fallbackCover(book.title);

}


/* =========================================================
   RENDER
========================================================= */

function renderBooks(){

  const query =
    search.value
      .trim()
      .toLowerCase();


  const filtered =
    books.filter(book => {

      return (
        !query ||

        book.title
          .toLowerCase()
          .includes(query) ||

        (book.category || "")
          .toLowerCase()
          .includes(query)
      );

    });


  count.textContent =
    filtered.length +
    (filtered.length === 1
      ? " Book"
      : " Books");


  grid.innerHTML = "";


  if(!filtered.length){

    noBooks.style.display =
      "block";

    return;

  }


  noBooks.style.display =
    "none";


  filtered.forEach(book => {

    const card =
      document.createElement("article");


    card.className =
      "book-card";


    card.innerHTML = `

      <div class="book-cover">

        <div class="book-loading">
          Loading cover...
        </div>

        <span class="book-pdf">
          PDF
        </span>

        <img
          alt=""
          loading="lazy"
        >

      </div>

      <div class="book-info">

        <div class="book-title">
          ${escapeHTML(book.title)}
        </div>

        <span class="book-category">
          ${escapeHTML(book.category || "Book PDF")}
        </span>

      </div>

    `;


    /* OPEN PDF */

    card.addEventListener(
      "click",
      function(){

        if(
          book.pdf &&
          book.pdf !== "#"
        ){

          window.open(
            book.pdf,
            "_blank",
            "noopener,noreferrer"
          );

        }

      }
    );


    /* COVER */

    const img =
      card.querySelector("img");

    const loading =
      card.querySelector(".book-loading");


    getCover(book)
      .then(src => {

        img.src = src;

        img.alt =
          book.title;

        img.onload = () => {

          if(loading)
            loading.remove();

        };

        img.onerror = () => {

          img.src =
            fallbackCover(
              book.title
            );

          if(loading)
            loading.remove();

        };

      });


    grid.appendChild(card);

  });

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   SEARCH
========================================================= */

search.addEventListener(
  "input",
  renderBooks
);


/* =========================================================
   FIREBASE BOOKS
========================================================= */

try{

  const dbRef =
    ref(db,"books");


  onValue(
    dbRef,

    snapshot => {

      let firebaseBooks = [];


      if(snapshot.exists()){

        snapshot.forEach(
          childSnapshot => {

            const data =
              childSnapshot.val();


            if(data){

              firebaseBooks.push({

                id:
                  childSnapshot.key,

                ...data

              });

            }

          }
        );

      }


      /*
       * Firebase books + default books
       * दोनों को merge किया जा रहा है।
       */

      books =
        removeDuplicates([
          ...defaultBooks,
          ...firebaseBooks
        ]);


      renderBooks();

    },


    error => {

      console.error(
        "Firebase fetch error:",
        error
      );

      books =
        removeDuplicates(
          defaultBooks
        );

      renderBooks();

    }

  );

}catch(error){

  console.error(
    "Firebase initialization error:",
    error
  );

  books =
    removeDuplicates(
      defaultBooks
    );

  renderBooks();

}


/* Initial render */

renderBooks();


})();
</script>
