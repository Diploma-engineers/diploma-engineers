<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Diploma Engineers News & Notifications</title>

    <!-- =====================================================
         BOOTSTRAP CSS
    ====================================================== -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >

    <style>

        /* =====================================================
           RESET
        ====================================================== */

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html{
            scroll-behavior:smooth;
            -webkit-text-size-adjust:100%;
        }

        body{
            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            background:#f0f4f9;

            color:#1a202c;

            min-height:100vh;

            padding:0;

            overflow-x:hidden !important;
        }


        /* =====================================================
           HEADER / FOOTER FETCH CONTAINERS
        ====================================================== */

        #header,
        #footer{
            width:100%;
            max-width:100%;
            margin:0 !important;
            padding:0 !important;
            position:relative;
            z-index:9999;
            display:block;
            box-sizing:border-box;
            overflow:visible;
        }

        #header > *{
            margin-top:0 !important;
        }

        #header .navbar{
            margin-top:0 !important;
            margin-bottom:0 !important;
        }

        #footer{
            overflow:hidden;
        }

        /* FontAwesome compatibility for fetched components */

        #header i[class*="fa-"],
        #footer i[class*="fa-"],
        #header .fa,
        #footer .fa{
            font-family:
                "Font Awesome 6 Free",
                "Font Awesome 6 Brands" !important;

            font-style:normal;
            font-weight:900;
            display:inline-block;
            line-height:1;
        }

        #footer img,
        #footer svg{
            max-width:100%;
        }

        #footer .container,
        #footer .footer-container,
        #footer .footer-inner,
        #footer .footer-content{
            width:100%;
            max-width:1200px;
            margin-left:auto;
            margin-right:auto;
            box-sizing:border-box;
        }


        /* =====================================================
           MAIN NEWS PAGE
        ====================================================== */

        .news-page{
            width:100%;
            max-width:650px;

            margin:30px auto 40px;

            background:#ffffff;

            border-radius:20px;

            padding:20px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.05);
        }


        /* =====================================================
           PAGE HEADER
        ====================================================== */

        .page-header{
            display:flex;
            align-items:center;

            gap:12px;

            margin-bottom:24px;
        }

        .header-icon{
            width:42px;
            height:42px;

            flex:0 0 42px;

            background:#eef2ff;

            color:#3b82f6;

            border-radius:12px;

            display:flex;
            align-items:center;
            justify-content:center;

            font-size:20px;
        }

        .page-header h1{
            font-size:22px;
            font-weight:800;
            color:#0f172a;
            margin:0;
        }


        /* =====================================================
           NEWS LIST
        ====================================================== */

        #newsList{
            display:flex;
            flex-direction:column;
            gap:16px;
        }


        /* =====================================================
           NEWS CARD
        ====================================================== */

        .news-card{
            background:#f8fafc;

            border-radius:14px;

            border:1px solid #e2e8f0;

            border-left:5px solid #2563eb;

            padding:16px;

            transition:
                all .2s ease;

            position:relative;

            overflow:hidden;
        }

        .news-card:hover{
            box-shadow:
                0 6px 18px
                rgba(0,0,0,.05);
        }


        /* =====================================================
           CATEGORY
        ====================================================== */

        .category{
            display:inline-block;

            background:#dbeafe;

            color:#1d4ed8;

            padding:4px 10px;

            border-radius:12px;

            font-size:11px;

            font-weight:700;

            text-transform:uppercase;

            letter-spacing:.5px;

            margin-bottom:10px;
        }


        /* =====================================================
           TITLE
        ====================================================== */

        .news-title{
            font-size:16px;

            font-weight:700;

            color:#0f172a;

            line-height:1.4;

            margin-bottom:8px;

            display:flex;

            align-items:center;

            gap:8px;
        }

        .news-title i{
            color:#2563eb;
            font-size:15px;
            flex:0 0 auto;
        }


        /* =====================================================
           DESCRIPTION
        ====================================================== */

        .news-description{
            font-size:13px;

            line-height:1.5;

            color:#64748b;

            margin-bottom:12px;

            display:-webkit-box;

            -webkit-line-clamp:2;

            -webkit-box-orient:vertical;

            overflow:hidden;
        }


        /* =====================================================
           CARD FOOTER
        ====================================================== */

        .card-footer{
            display:flex;

            align-items:center;

            justify-content:space-between;

            gap:10px;

            padding-top:10px;

            border-top:1px dashed #e2e8f0;

            font-size:12px;

            background:transparent;
        }

        .news-date{
            color:#94a3b8;

            display:flex;

            align-items:center;

            gap:5px;

            font-weight:500;
        }

        .action-links{
            display:flex;

            align-items:center;

            gap:12px;
        }

        .action-btn{
            color:#2563eb;

            text-decoration:none;

            font-weight:700;

            display:flex;

            align-items:center;

            gap:4px;

            background:none;

            border:none;

            cursor:pointer;

            font-size:12px;

            padding:0;
        }

        .action-btn:hover{
            color:#1d4ed8;
            text-decoration:underline;
        }


        /* =====================================================
           EXPANDABLE PANEL
        ====================================================== */

        .expandable-panel{
            max-height:0;

            overflow:hidden;

            transition:
                max-height .3s
                cubic-bezier(.0,1,.0,1);

            background:#ffffff;

            border-radius:10px;

            margin-top:0;

            padding:0 12px;

            border:0 solid #e2e8f0;
        }

        .expandable-panel.active{
            max-height:500px;

            transition:
                max-height .3s ease-in-out;

            margin-top:12px;

            padding:12px;

            border-width:1px;
        }


        /* =====================================================
           THUMBNAIL
        ====================================================== */

        .card-thumbnail{
            width:100%;

            max-height:200px;

            object-fit:cover;

            border-radius:8px;

            margin-bottom:10px;
        }


        /* =====================================================
           FULL DESCRIPTION
        ====================================================== */

        .full-desc{
            font-size:13px;

            color:#334155;

            line-height:1.6;

            margin-bottom:10px;

            white-space:pre-wrap;
        }


        /* =====================================================
           SHARE GRID
        ====================================================== */

        .share-grid{
            display:flex;

            gap:8px;

            margin-top:10px;

            padding-top:10px;

            border-top:1px solid #f1f5f9;
        }

        .share-icon-btn{
            flex:1;

            min-width:0;

            height:34px;

            border-radius:6px;

            display:flex;

            align-items:center;

            justify-content:center;

            color:#fff;

            text-decoration:none;

            border:none;

            cursor:pointer;

            font-size:14px;

            gap:6px;

            font-weight:600;
        }

        .share-whatsapp{
            background:#25D366;
        }

        .share-telegram{
            background:#229ED9;
        }

        .share-copy{
            background:#64748b;
        }


        /* =====================================================
           STATES
        ====================================================== */

        .loading,
        .empty,
        .error-box{
            text-align:center;

            padding:30px;

            color:#64748b;
        }

        .loading i{
            font-size:24px;

            color:#2563eb;

            margin-bottom:8px;
        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media(max-width:767px){

            body{
                width:100%;
                max-width:100%;
                overflow-x:hidden !important;
            }

            #header,
            #footer{
                width:100%;
                max-width:100%;
                margin:0 !important;
                padding:0 !important;
            }

            #footer .container,
            #footer .footer-container,
            #footer .footer-inner,
            #footer .footer-content{
                width:100%;
                max-width:100%;
            }

            .news-page{
                width:calc(100% - 10px);

                max-width:none;

                margin:12px auto 25px;

                padding:13px;

                border-radius:15px;
            }

            .page-header{
                gap:9px;
                margin-bottom:17px;
            }

            .header-icon{
                width:35px;
                height:35px;
                flex-basis:35px;
                border-radius:10px;
                font-size:16px;
            }

            .page-header h1{
                font-size:17px;
            }

            #newsList{
                gap:11px;
            }

            .news-card{
                padding:12px;

                border-radius:11px;

                border-left-width:4px;
            }

            .category{
                font-size:9px;
                padding:3px 7px;
                margin-bottom:7px;
            }

            .news-title{
                font-size:13px;
                line-height:1.35;
                gap:6px;
                margin-bottom:6px;
            }

            .news-title i{
                font-size:12px;
            }

            .news-description{
                font-size:10.5px;
                line-height:1.5;
                margin-bottom:9px;
            }

            .card-footer{
                font-size:9px;
                padding-top:8px;
                gap:6px;
            }

            .news-date{
                gap:4px;
            }

            .action-links{
                gap:8px;
            }

            .action-btn{
                font-size:9px;
                gap:3px;
            }

            .expandable-panel.active{
                margin-top:9px;
                padding:9px;
            }

            .full-desc{
                font-size:10.5px;
                line-height:1.55;
            }

            .share-grid{
                gap:5px;
                margin-top:7px;
                padding-top:7px;
            }

            .share-icon-btn{
                height:30px;
                font-size:9px;
                gap:3px;
            }

        }


        /* =====================================================
           VERY SMALL MOBILE
        ====================================================== */

        @media(max-width:390px){

            .news-page{
                width:calc(100% - 6px);
                padding:10px;
                margin-top:8px;
            }

            .page-header h1{
                font-size:15px;
            }

            .header-icon{
                width:32px;
                height:32px;
                flex-basis:32px;
                font-size:14px;
            }

            .news-card{
                padding:10px;
            }

            .news-title{
                font-size:12px;
            }

            .news-description{
                font-size:9.5px;
            }

            .news-date,
            .action-btn{
                font-size:8px;
            }

        }


        /* =====================================================
           REDUCED MOTION
        ====================================================== */

        @media(prefers-reduced-motion:reduce){

            *,
            *::before,
            *::after{
                scroll-behavior:auto !important;
                transition-duration:.01ms !important;
                animation-duration:.01ms !important;
                animation-iteration-count:1 !important;
            }

        }

    </style>
</head>

<div id="header"></div>

<div class="news-page">

<!-- =====================================================

<div id="footer"></div>


<!-- =====================================================

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- =====================================================
     HEADER + FOOTER FETCH
====================================================== -->

<script>

/* =====================================================
   LOAD SHARED HEADER
===================================================== */

async function loadHeader(){

    const header =
        document.getElementById("header");

    if(!header){
        return;
    }

    try{

        const response =
            await fetch(
                "header.html",
                {
                    method:"GET",
                    cache:"no-cache"
                }
            );

        if(!response.ok){
            throw new Error(
                "header.html not found"
            );
        }

        const rawHTML =
            await response.text();


        /*
         * header.html kabhi complete HTML
         * document ho sakta hai.
         *
         * Isliye sirf body content inject
         * kiya ja raha hai.
         */

        const parser =
            new DOMParser();

        const parsed =
            parser.parseFromString(
                rawHTML,
                "text/html"
            );

        const html =
            parsed.body &&
            parsed.body.innerHTML.trim()
                ? parsed.body.innerHTML
                : rawHTML;


        header.innerHTML =
            html;


        /*
         * Bootstrap navbar collapse
         * dynamically loaded header ke liye
         * initialize karo.
         */

        if(
            window.bootstrap &&
            typeof bootstrap.Collapse !== "undefined"
        ){

            const collapses =
                header.querySelectorAll(
                    ".collapse"
                );

            collapses.forEach(
                function(element){

                    bootstrap.Collapse
                        .getOrCreateInstance(
                            element,
                            {
                                toggle:false
                            }
                        );

                }
            );

        }


        /*
         * Mobile navbar toggler
         * fallback support.
         */

        const togglers =
            header.querySelectorAll(
                ".navbar-toggler"
            );

        togglers.forEach(
            function(toggler){

                /*
                 * Existing manual listeners
                 * ko avoid karne ke liye clone.
                 */

                const newToggler =
                    toggler.cloneNode(true);

                toggler.parentNode.replaceChild(
                    newToggler,
                    toggler
                );


                newToggler.addEventListener(
                    "click",
                    function(){

                        const targetSelector =
                            newToggler.getAttribute(
                                "data-bs-target"
                            ) ||
                            newToggler.getAttribute(
                                "href"
                            );


                        if(!targetSelector){
                            return;
                        }


                        let target = null;

                        try{

                            target =
                                document.querySelector(
                                    targetSelector
                                );

                        }catch(error){

                            return;

                        }


                        if(!target){
                            return;
                        }


                        /*
                         * Agar Bootstrap data attribute
                         * already present hai to Bootstrap
                         * khud handle karega.
                         */

                        if(
                            newToggler.hasAttribute(
                                "data-bs-toggle"
                            )
                        ){

                            return;

                        }


                        if(
                            window.bootstrap &&
                            bootstrap.Collapse
                        ){

                            const instance =
                                bootstrap.Collapse
                                    .getOrCreateInstance(
                                        target,
                                        {
                                            toggle:false
                                        }
                                    );

                            instance.toggle();

                        }

                    }
                );

            }
        );


    }catch(error){

        console.error(
            "Header loading error:",
            error
        );

    }

}


/* =====================================================
   LOAD SHARED FOOTER
===================================================== */

async function loadFooter(){

    const footer =
        document.getElementById("footer");

    if(!footer){
        return;
    }

    try{

        const response =
            await fetch(
                "footer.html",
                {
                    method:"GET",
                    cache:"no-cache"
                }
            );


        if(!response.ok){

            throw new Error(
                "footer.html not found"
            );

        }


        const rawHTML =
            await response.text();


        /*
         * Complete HTML document hone par
         * sirf body content inject karo.
         */

        const parser =
            new DOMParser();

        const parsed =
            parser.parseFromString(
                rawHTML,
                "text/html"
            );


        const html =
            parsed.body &&
            parsed.body.innerHTML.trim()
                ? parsed.body.innerHTML
                : rawHTML;


        footer.innerHTML =
            html;


    }catch(error){

        console.error(
            "Footer loading error:",
            error
        );

    }

}


/* =====================================================
   START HEADER + FOOTER
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    async function(){

        /*
         * Header first
         */

        await loadHeader();


        /*
         * Footer after header
         */

        await loadFooter();

    }
);

</script>


<!-- =====================================================
     FIREBASE NEWS
====================================================== -->

<script type="module">

    import {
        initializeApp
    }
    from
    "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


    import {
        getDatabase,
        ref,
        onValue
    }
    from
    "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";


    /* =====================================================
       FIREBASE CONFIG
    ====================================================== */

    const firebaseConfig = {

        apiKey:
            "AIzaSyAbg1Q1ZPgF7mwaxyin7iglla01eDk_tKo",

        authDomain:
            "diplomaengineers-869df.firebaseapp.com",

        databaseURL:
            "https://diplomaengineers-869df-default-rtdb.firebaseio.com",

        projectId:
            "diplomaengineers-869df",

        storageBucket:
            "diplomaengineers-869df.appspot.com",

        messagingSenderId:
            "356779436080",

        appId:
            "1:356779436080:web:4b28da380e547420d0e5f5"

    };


    /* =====================================================
       FIREBASE INIT
    ====================================================== */

    const app =
        initializeApp(
            firebaseConfig
        );


    const db =
        getDatabase(app);


    const newsList =
        document.getElementById(
            "newsList"
        );


    /* =====================================================
       ESCAPE HTML
    ====================================================== */

    function escapeHTML(value){

        return String(
            value ?? ""
        )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

    }


    /* =====================================================
       VALID URL
    ====================================================== */

    function validURL(value){

        try{

            const url =
                new URL(value);

            return (
                url.protocol === "http:" ||
                url.protocol === "https:"
            );

        }catch{

            return false;

        }

    }


    /* =====================================================
       LOAD NEWS
    ====================================================== */

    function loadNews(){

        const newsRef =
            ref(
                db,
                "news"
            );


        onValue(
            newsRef,

            snapshot => {

                newsList.innerHTML = "";


                if(!snapshot.exists()){

                    newsList.innerHTML = `

                        <div class="empty">

                            <i
                                class="fa-regular fa-newspaper"
                                style="font-size:32px;"
                            ></i>

                            <p>
                                कोई News या Update उपलब्ध नहीं है।
                            </p>

                        </div>

                    `;

                    return;

                }


                const newsArray = [];


                snapshot.forEach(
                    child => {

                        newsArray.push({

                            id:
                                child.key,

                            data:
                                child.val() || {}

                        });

                    }
                );


                /*
                 * Latest news first
                 */

                newsArray.reverse();


                newsArray.forEach(
                    item => {

                        createNewsCard(
                            item.id,
                            item.data
                        );

                    }
                );

            },

            error => {

                console.error(
                    error
                );


                newsList.innerHTML = `

                    <div class="error-box">

                        <p>
                            Data Load करने में समस्या हुई।
                            कृपया पुनः प्रयास करें।
                        </p>

                    </div>

                `;

            }
        );

    }


    /* =====================================================
       CREATE NEWS CARD
    ====================================================== */

    function createNewsCard(
        id,
        n
    ){

        const title =
            n.title ||
            "Untitled News";


        const description =
            n.text ||
            n.desc ||
            n.description ||
            "";


        const category =
            n.cat ||
            n.category ||
            "NOTIFICATION";


        const date =
            n.date ||
            "Recent";


        const image =
            n.thumb ||
            n.image ||
            n.thumbnail ||
            "";


        const externalLink =
            n.link ||
            n.pdf ||
            n.fileUrl ||
            "";


        const card =
            document.createElement(
                "article"
            );


        card.className =
            "news-card";


        card.id =
            `card-${id}`;


        let actionTarget;


        if(
            externalLink &&
            validURL(externalLink)
        ){

            actionTarget = `

                <a
                    href="${escapeHTML(externalLink)}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="action-btn"
                >

                    View News

                    <i
                        class="fa-solid fa-arrow-right"
                    ></i>

                </a>

            `;

        }else{

            actionTarget = `

                <button
                    class="action-btn"
                    onclick="toggleDetails('${escapeHTML(id)}')"
                >

                    Read More

                    <i
                        class="fa-solid fa-chevron-down"
                    ></i>

                </button>

            `;

        }


        const safeTitle =
            escapeHTML(title);


        card.innerHTML = `

            <span class="category">

                ${escapeHTML(category)}

            </span>


            <h2 class="news-title">

                <i
                    class="fa-solid fa-square-check"
                ></i>

                ${safeTitle}

            </h2>


            <p class="news-description">

                ${escapeHTML(description)}

            </p>


            <div class="card-footer">


                <div class="news-date">

                    <i
                        class="fa-regular fa-calendar"
                    ></i>

                    ${escapeHTML(date)}

                </div>


                <div class="action-links">


                    <button
                        class="action-btn"
                        onclick="toggleDetails('${escapeHTML(id)}')"
                    >

                        <i
                            class="fa-solid fa-share-nodes"
                        ></i>

                        Share

                    </button>


                    ${actionTarget}


                </div>


            </div>


            <!-- EXPANDABLE PANEL -->

            <div
                class="expandable-panel"
                id="panel-${escapeHTML(id)}"
            >

                ${
                    image &&
                    validURL(image)
                    ?
                    `
                    <img
                        src="${escapeHTML(image)}"
                        class="card-thumbnail"
                        alt="thumbnail"
                        loading="lazy"
                    >
                    `
                    :
                    ""
                }


                <div class="full-desc">

                    ${escapeHTML(description)}

                </div>


                <div class="share-grid">


                    <button
                        class="share-icon-btn share-whatsapp"
                        onclick="shareWhatsApp('${safeTitle}','${escapeHTML(id)}')"
                    >

                        <i
                            class="fa-brands fa-whatsapp"
                        ></i>

                        WhatsApp

                    </button>


                    <button
                        class="share-icon-btn share-telegram"
                        onclick="shareTelegram('${safeTitle}','${escapeHTML(id)}')"
                    >

                        <i
                            class="fa-brands fa-telegram"
                        ></i>

                        Telegram

                    </button>


                    <button
                        class="share-icon-btn share-copy"
                        onclick="copyLink('${safeTitle}','${escapeHTML(id)}')"
                    >

                        <i
                            class="fa-regular fa-copy"
                        ></i>

                        Copy

                    </button>


                </div>


            </div>

        `;


        newsList.appendChild(
            card
        );

    }


    /* =====================================================
       TOGGLE DETAILS
    ====================================================== */

    window.toggleDetails =
        function(id){

            const panel =
                document.getElementById(
                    `panel-${id}`
                );


            if(panel){

                panel.classList.toggle(
                    "active"
                );

            }

        };


    /* =====================================================
       WHATSAPP SHARE
    ====================================================== */

    window.shareWhatsApp =
        function(
            title,
            id
        ){

            const url =
                window.location.href
                    .split("#")[0] +
                "#card-" +
                id;


            const text =
                encodeURIComponent(
                    `${title}\n\nRead details: ${url}`
                );


            window.open(
                `https://wa.me/?text=${text}`,
                "_blank"
            );

        };


    /* =====================================================
       TELEGRAM SHARE
    ====================================================== */

    window.shareTelegram =
        function(
            title,
            id
        ){

            const url =
                window.location.href
                    .split("#")[0] +
                "#card-" +
                id;


            window.open(

                `https://t.me/share/url?url=${
                    encodeURIComponent(url)
                }&text=${
                    encodeURIComponent(title)
                }`,

                "_blank"

            );

        };


    /* =====================================================
       COPY LINK
    ====================================================== */

    window.copyLink =
        async function(
            title,
            id
        ){

            const url =
                window.location.href
                    .split("#")[0] +
                "#card-" +
                id;


            try{

                await navigator.clipboard.writeText(
                    `${title} - ${url}`
                );


                alert(
                    "Link Copied!"
                );


            }catch(error){

                prompt(
                    "Copy Link:",
                    url
                );

            }

        };


    /* =====================================================
       START FIREBASE NEWS
    ====================================================== */

    loadNews();

</script>


</body>
</html>
