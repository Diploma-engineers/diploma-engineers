<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTE UP Even Semester 2026 Result | Diploma Engineers</title>

<!-- FONT AWESOME -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- GOOGLE FONT -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:#f1f5f9;
    overflow:hidden;
}

.bg-circle{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    z-index:0;
}

.circle1{
    width:260px;
    height:260px;
    background:#2563eb;
    top:-80px;
    left:-80px;
    opacity:.20;
}

.circle2{
    width:260px;
    height:260px;
    background:#22c55e;
    bottom:-80px;
    right:-80px;
    opacity:.20;
}

.card{
    width:100%;
    max-width:430px;
    background:#fff;
    border-radius:28px;
    padding:35px 28px;
    position:relative;
    z-index:10;
    box-shadow:0 15px 40px rgba(0,0,0,.08);
    border:1px solid #e2e8f0;
    text-align:center;
}

.icon{
    width:85px;
    height:85px;
    margin:auto;
    border-radius:22px;
    background:#eff6ff;
    color:#2563eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    margin-bottom:20px;
}

.card h2{
    font-size:30px;
    color:#0f172a;
    margin-bottom:10px;
    font-weight:700;
}

.card p{
    color:#64748b;
    font-size:14px;
    line-height:1.7;
    margin-bottom:25px;
}

.input-box{
    position:relative;
    margin-bottom:18px;
}

.input-box i{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    color:#64748b;
}

input{
    width:100%;
    padding:15px 15px 15px 45px;
    border-radius:16px;
    border:1px solid #cbd5e1;
    background:#f8fafc;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#2563eb;
    background:#fff;
}

button{
    width:100%;
    border:none;
    border-radius:16px;
    padding:15px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.generate-btn{
    background:#2563eb;
    color:#fff;
}

.generate-btn:hover{
    background:#1d4ed8;
}

.view{
    display:none;
    background:#22c55e;
    color:#fff;
    margin-top:14px;
}

.view.active{
    display:block;
}

.view:hover{
    background:#16a34a;
}

.success{
    display:none;
    margin-top:18px;
    background:#ecfdf5;
    color:#15803d;
    padding:13px;
    border-radius:14px;
    border:1px solid #bbf7d0;
    font-size:14px;
}

.success.active{
    display:block;
}

.footer-text{
    margin-top:20px;
    font-size:13px;
    color:#94a3b8;
}

@media(max-width:600px){

.card{
    padding:28px 20px;
}

.card h2{
    font-size:26px;
}

}

</style>

</head>

<body>

<div class="bg-circle circle1"></div>
<div class="bg-circle circle2"></div>

<div class="card">

<div class="icon">
<i class="fa-solid fa-graduation-cap"></i>
</div>

<h2>Even Semester 2026</h2>

<p>
Check your BTE UP Even Semester Examination Result 2026 quickly and securely.
</p>

<div class="input-box">
<i class="fa-solid fa-id-card"></i>
<input type="text" id="enroll" placeholder="Enrollment Number">
</div>

<div class="input-box">
<i class="fa-solid fa-calendar-days"></i>
<input type="text" id="dob" placeholder="DD/MM/YYYY">
</div>

<button class="generate-btn" onclick="generate()">
<i class="fa-solid fa-link"></i>
Generate Result Link
</button>

<div class="success" id="msg">
✅ Result Link Generated Successfully
</div>

<button class="view" id="openBtn" onclick="openResult()">
<i class="fa-solid fa-arrow-up-right-from-square"></i>
Open Result
</button>

<div class="footer-text">
Developed by Diploma Engineers
</div>

</div>

<script>

let finalURL="";

function validDOB(d){
    return /^(\d{2})\/(\d{2})\/(\d{4})$/.test(d);
}

function generate(){

let enroll=document.getElementById("enroll").value.trim();
let dob=document.getElementById("dob").value.trim();

if(enroll==""){
    alert("Please Enter Enrollment Number");
    return;
}

if(!validDOB(dob)){
    alert("Please Enter DOB in DD/MM/YYYY");
    return;
}

let encEnroll=btoa(enroll);
let encDob=btoa(dob);

/* Change this URL if BTE releases a different Even Semester 2026 result page */
finalURL=`https://test.bteupexam.co.in/Even_Semester/result.aspx?id=${encEnroll}&id2=${encDob}`;

document.getElementById("msg").classList.add("active");
document.getElementById("openBtn").classList.add("active");

}

function openResult(){

if(finalURL){
    window.open(finalURL,"_blank");
}else{
    alert("Generate Link First");
}

}

</script>

</body>
</html>
