<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f3f7ff">
<title>Notifications & News | Diploma Engineers</title>

<link rel="preconnect" href="https://www.gstatic.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
    width:100%;
    min-height:100%;
    font-family:Poppins,Arial,sans-serif;
    background:#f1f6ff;
    color:#0d1b3e;
    -webkit-tap-highlight-color:transparent;
}
body{overflow-x:hidden}
button,a{font-family:inherit}
button{border:0}
.page{
    width:min(100% - 8px,760px);
    margin:16px auto;
    background:#fff;
    border:1px solid #e7ebf3;
    border-radius:24px;
    padding:26px 26px 30px;
    min-height:calc(100vh - 32px);
    box-shadow:0 10px 35px rgba(35,67,120,.08);
}
.title-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:22px;
}
.title-icon{
    width:42px;height:42px;
    display:grid;place-items:center;
    border-radius:12px;
    background:#eff5ff;
    color:#2867ff;
    font-size:19px;
    flex:0 0 auto;
}
.title-row h1{
    font-size:22px;
    line-height:1.2;
    font-weight:800;
    color:#07163a;
}
.feed{
    height:calc(100vh - 135px);
    min-height:420px;
    overflow-y:auto;
    padding-right:7px;
    scrollbar-width:thin;
    scrollbar-color:#c8d1df transparent;
}
.feed::-webkit-scrollbar{width:5px}
.feed::-webkit-scrollbar-track{background:transparent}
.feed::-webkit-scrollbar-thumb{
    background:#c8d1df;
    border-radius:20px;
}
.loading{
    padding:45px 10px;
    text-align:center;
    color:#8090a9;
}
.spinner{
    width:28px;height:28px;
    border:3px solid #e6edfa;
    border-top-color:#2867ff;
    border-radius:50%;
    animation:spin .7s linear infinite;
    margin:0 auto 10px;
}
@keyframes spin{to{transform:rotate(360deg)}}

.news-card{
    position:relative;
    margin-bottom:16px;
    padding:16px 20px 15px;
    border:1px solid #e7ebf1;
    border-left:3px solid #2867ff;
    border-radius:15px;
    background:linear-gradient(180deg,#fbfcfe,#f8fafc);
    box-shadow:0 3px 12px rgba(24,45,82,.045);
}
.news-card.admission{border-left-color:#ff4650;background:#fff8f8}
.news-card.result{border-left-color:#14a86b}
.news-card.job{border-left-color:#8b5cf6}
.news-card.scholarship{border-left-color:#f59e0b}
.news-card.notice{border-left-color:#2867ff}
.news-card.exam{border-left-color:#2867ff}

.meta-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:9px;
}
.category{
    display:inline-flex;
    align-items:center;
    min-height:24px;
    padding:4px 11px;
    border-radius:999px;
    background:#eaf1ff;
    color:#1550c8;
    font-size:10px;
    line-height:1;
    font-weight:800;
    letter-spacing:.25px;
    text-transform:uppercase;
}
.admission .category{background:#ffe6e7;color:#bd2028}
.result .category{background:#e2f8ed;color:#087c4d}
.job .category{background:#eee8ff;color:#6841ca}
.scholarship .category{background:#fff2cc;color:#a36100}
.new-badge{
    background:#ff858b;
    color:#fff;
    border-radius:4px;
    padding:3px 7px;
    font-size:9px;
    font-weight:800;
    text-transform:uppercase;
}
.news-title{
    display:flex;
    align-items:flex-start;
    gap:7px;
    font-size:14px;
    line-height:1.5;
    font-weight:800;
    color:#091b43;
    margin-bottom:5px;
}
.news-title i{
    color:#2867ff;
    font-size:13px;
    margin-top:4px;
    flex:0 0 auto;
}
.admission .news-title i{color:#ff3f4a}
.news-desc{
    color:#586983;
    font-size:12px;
    line-height:1.7;
    margin-bottom:10px;
}
.news-desc b{color:#263b60}
.card-bottom{
    border-top:1px dashed #dce2ea;
    padding-top:9px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
}
.date{
    display:flex;
    align-items:center;
    gap:7px;
    color:#8a98ac;
    font-size:10px;
}
.date i{color:#9aa8ba}
.actions{
    display:flex;
    align-items:center;
    gap:7px;
}
.action{
    display:inline-flex;
    align-items:center;
    gap:5px;
    color:#1760ff;
    background:none;
    text-decoration:none;
    font-size:10px;
    font-weight:800;
    cursor:pointer;
}
.action i{font-size:10px}
.share-btn{
    width:29px;height:29px;
    display:grid;
    place-items:center;
    border-radius:8px;
    background:#edf3ff;
    color:#2867ff;
    cursor:pointer;
}
.thumb{
    width:100%;
    max-height:190px;
    object-fit:cover;
    border-radius:11px;
    margin:5px 0 11px;
    display:block;
    background:#eef2f7;
}
.file-row{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin:5px 0 10px;
}
.file-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:7px 10px;
    border-radius:8px;
    background:#eef4ff;
    color:#1559d4;
    text-decoration:none;
    font-size:10px;
    font-weight:700;
}
.empty{
    padding:55px 15px;
    text-align:center;
    color:#8390a5;
}
.empty i{font-size:32px;color:#b7c3d5;margin-bottom:10px}
.error{
    padding:25px 15px;
    text-align:center;
    color:#bd2028;
    font-size:12px;
}
.retry{
    margin-top:12px;
    padding:9px 14px;
    border-radius:8px;
    background:#2867ff;
    color:#fff;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
}
@media(max-width:600px){
    .page{
        width:calc(100% - 8px);
        margin:4px auto;
        padding:25px 26px 22px;
        border-radius:22px;
        min-height:calc(100vh - 8px);
    }
    .title-row{margin-bottom:20px}
    .title-row h1{font-size:21px}
    .title-icon{width:40px;height:40px}
    .feed{
        height:calc(100vh - 115px);
        min-height:420px;
        padding-right:5px;
    }
    .news-card{padding:15px 17px 13px}
    .news-title{font-size:13px}
    .news-desc{font-size:11.5px}
}
@media(prefers-reduced-motion:reduce){
    .spinner{animation:none}
}
</style>
</head>

<body>
<main class="page">
    <div class="title-row">
        <div class="title-icon"><i class="fa-regular fa-bell"></i></div>
        <h1>Notifications &amp; News</h1>
    </div>

    <div id="newsList" class="feed">
        <div class="loading">
            <div class="spinner"></div>
            <p>Loading News...</p>
        </div>
    </div>
</main>

<script type="module">
import { db, ref, get } from "./firebase.js";

const newsList = document.getElementById("newsList");
const MAX_NEWS = 30;

function escapeHTML(value=""){
    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function categoryClass(cat=""){
    const c = cat.toLowerCase();
    if(c.includes("admission")) return "admission";
    if(c.includes("result")) return "result";
    if(c.includes("job")) return "job";
    if(c.includes("scholar")) return "scholarship";
    if(c.includes("exam")) return "exam";
    return "notice";
}

function categoryIcon(cat=""){
    const c = cat.toLowerCase();
    if(c.includes("admission")) return "fa-bullhorn";
    if(c.includes("result")) return "fa-square-check";
    if(c.includes("job")) return "fa-briefcase";
    if(c.includes("scholar")) return "fa-graduation-cap";
    if(c.includes("exam")) return "fa-circle-exclamation";
    return "fa-circle-info";
}

function formatDate(value){
    if(!value) return "Latest Update";
    const d = new Date(value);
    if(!Number.isNaN(d.getTime())){
        return d.toLocaleDateString("en-IN",{
            day:"numeric",month:"short",year:"numeric"
        });
    }
    return String(value).split(",")[0];
}

function isNew(value){
    if(!value) return false;
    const d = new Date(value);
    if(Number.isNaN(d.getTime())) return false;
    return (Date.now()-d.getTime()) < 3*24*60*60*1000;
}

function safeUrl(url){
    if(!url) return "";
    try{
        const u = new URL(url, location.href);
        if(["http:","https:"].includes(u.protocol)) return u.href;
    }catch(e){}
    return "";
}

function renderNews(items){
    if(!items.length){
        newsList.innerHTML = `
            <div class="empty">
                <i class="fa-regular fa-bell-slash"></i>
                <p>No News Available</p>
            </div>`;
        return;
    }

    const fragment = document.createDocumentFragment();

    items.forEach(n=>{
        const cat = escapeHTML(n.cat || "News");
        const title = escapeHTML(n.title || "Untitled News");
        const desc = escapeHTML(n.desc || "");
        const thumb = safeUrl(n.thumb);
        const pdf = safeUrl(n.pdf);
        const link = safeUrl(n.link);
        const cls = categoryClass(n.cat || "");
        const icon = categoryIcon(n.cat || "");
        const date = formatDate(n.date);

        const card = document.createElement("article");
        card.className = `news-card ${cls}`;

        card.innerHTML = `
            <div class="meta-row">
                <span class="category">${cat}</span>
                ${isNew(n.date) ? '<span class="new-badge">NEW</span>' : ''}
            </div>

            <h2 class="news-title">
                <i class="fa-solid ${icon}"></i>
                <span>${title}</span>
            </h2>

            ${thumb ? `<img class="thumb" src="${thumb}" alt="" loading="lazy" decoding="async">` : ""}

            ${desc ? `<p class="news-desc">${desc}</p>` : ""}

            ${(pdf || link) ? `
                <div class="file-row">
                    ${pdf ? `<a class="file-btn" href="${pdf}" target="_blank" rel="noopener">
                        <i class="fa-solid fa-file-pdf"></i> Open PDF / File
                    </a>` : ""}
                    ${link ? `<a class="file-btn" href="${link}" target="_blank" rel="noopener">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i> Open Link
                    </a>` : ""}
                </div>` : ""}

            <div class="card-bottom">
                <span class="date">
                    <i class="fa-regular fa-calendar"></i>
                    ${escapeHTML(date)}
                </span>

                <div class="actions">
                    ${pdf || link ? `
                    <a class="action" href="${pdf || link}" target="_blank" rel="noopener">
                        ${pdf ? "Read / Download" : "Read More"} <i class="fa-solid fa-arrow-right"></i>
                    </a>` : ""}

                    <button class="share-btn" type="button" aria-label="Share news">
                        <i class="fa-solid fa-share-nodes"></i>
                    </button>
                </div>
            </div>
        `;

        card.querySelector(".share-btn").addEventListener("click", async()=>{
            const shareData = {
                title: n.title || "Diploma Engineers News",
                text: `${n.title || ""}\n\n${n.desc || ""}`,
                url: location.href
            };

            try{
                if(navigator.share){
                    await navigator.share(shareData);
                }else{
                    await navigator.clipboard.writeText(
                        `${n.title || ""}\n${n.desc || ""}\n${location.href}`
                    );
                    alert("News details copied.");
                }
            }catch(e){}
        });

        fragment.appendChild(card);
    });

    newsList.replaceChildren(fragment);
}

async function loadNews(){
    newsList.innerHTML = `
        <div class="loading">
            <div class="spinner"></div>
            <p>Loading News...</p>
        </div>`;

    try{
        const snapshot = await get(ref(db,"news"));

        if(!snapshot.exists()){
            renderNews([]);
            return;
        }

        const items = [];
        snapshot.forEach(child=>{
            const n = child.val() || {};
            items.push({
                key:child.key,
                title:n.title || "",
                desc:n.desc || "",
                thumb:n.thumb || "",
                pdf:n.pdf || "",
                link:n.link || "",
                cat:n.cat || "News",
                date:n.date || ""
            });
        });

        items.sort((a,b)=>{
            const da = Date.parse(a.date) || 0;
            const dbb = Date.parse(b.date) || 0;
            return dbb - da;
        });

        renderNews(items.slice(0,MAX_NEWS));

    }catch(error){
        console.error("News loading error:",error);
        newsList.innerHTML = `
            <div class="error">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <p>News load नहीं हो सकी।</p>
                <button class="retry" id="retryBtn">Retry</button>
            </div>`;
        document.getElementById("retryBtn").onclick = loadNews;
    }
}

loadNews();
</script>
</body>
</html>
