<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admit Card Coming Soon | Diploma Engineers</title>

<!-- Google Fonts & Font Awesome Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --secondary: #0f172a;
  --accent: #f97316;
  --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #e0e8ff 50%, #f5f3ff 100%);
  --card-bg: #ffffff;
  --text-dark: #0f172a;
  --text-muted: #64748b;
  --border-color: #e2e8f0;
  --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Plus Jakarta Sans', sans-serif;
  scroll-behavior: smooth;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text-dark);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 500px;
}

.card {
  background: var(--card-bg);
  border-radius: 24px;
  padding: 40px 30px;
  text-align: center;
  box-shadow: var(--shadow);
  border: 1px solid var(--border-color);
  position: relative;
  overflow: hidden;
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 6px;
  background: linear-gradient(90deg, #2563eb, #06b6d4, #f97316);
}

.icon-box {
  width: 80px;
  height: 80px;
  background: #eff6ff;
  color: var(--primary);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  margin: 0 auto 24px;
  box-shadow: 0 8px 20px rgba(37, 99, 235, 0.15);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.4); }
  70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(37, 99, 235, 0); }
  100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
}

h1 {
  font-size: 24px;
  font-weight: 800;
  color: var(--secondary);
  margin-bottom: 12px;
  letter-spacing: -0.5px;
}

p {
  color: var(--text-muted);
  font-size: 14.5px;
  line-height: 1.6;
  margin-bottom: 28px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #fff7ed;
  color: #c2410c;
  padding: 8px 16px;
  border-radius: 30px;
  font-weight: 700;
  font-size: 13px;
  margin-bottom: 24px;
  border: 1px solid #ffedd5;
}

.btn-home {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 14px;
  background: var(--primary);
  color: #fff;
  text-decoration: none;
  font-weight: 700;
  font-size: 14px;
  border-radius: 14px;
  transition: all 0.3s ease;
  box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
}

.btn-home:hover {
  background: var(--primary-hover);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
}
</style>
</head>

<body>

<div class="container">
  <div class="card">
    <div class="icon-box">
      <i class="fas fa-id-card"></i>
    </div>
    
    <div class="badge">
      <i class="fas fa-clock"></i> Updates Soon
    </div>

    <h1>Admit Card Coming Soon</h1>
    <p>Your semester examination admit cards will be available here shortly. Stay tuned to our official updates and WhatsApp groups for notifications.</p>

    <a href="#" class="btn-home">
      <i class="fas fa-arrow-left"></i> Back to Dashboard
    </a>
  </div>
</div>

</body>
</html>
