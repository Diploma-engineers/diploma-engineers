<!-- FontAwesome Icons for Logos & Social Links -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Google Font -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
  }

  /* ================= PRELOADER STYLES ================= */
  #preloader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    background-color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999999;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }

  .loader-content {
    text-align: center;
    width: 90%;
    max-width: 400px;
  }

  .logo-spinner {
    position: relative;
    width: 130px;
    height: 130px;
    margin: 0 auto 20px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .spinner-ring {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 4px solid #f1f5f9;
    border-top: 4px solid #ff6b00;
    border-right: 4px solid #2563eb;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .logo-box {
    width: 100px;
    height: 100px;
    background: #ffffff;
    border-radius: 50%;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .logo-box i {
    font-size: 32px;
    color: #c2410c;
    margin-bottom: 2px;
  }

  .logo-box span {
    font-size: 8px;
    font-weight: 700;
    color: #1e293b;
    text-transform: uppercase;
  }

  .loader-title {
    font-size: 24px;
    font-weight: 800;
    color: #ff6b00;
  }

  .loader-title span {
    color: #2563eb;
  }

  .loader-subtitle {
    font-size: 13px;
    color: #64748b;
    margin-top: 4px;
    margin-bottom: 25px;
  }

  .progress-container {
    width: 100%;
    height: 6px;
    background-color: #e2e8f0;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .progress-bar {
    width: 0%;
    height: 100%;
    background-color: #2563eb;
    transition: width 0.1s linear;
  }

  .loading-status {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #64748b;
  }

  #progress-percent {
    color: #2563eb;
    font-weight: 700;
  }

  .loader-hidden {
    opacity: 0;
    visibility: hidden;
  }

  /* ================= TOP BAR STYLES ================= */
  .top-bar {
    background-color: #0f172a;
    color: #94a3b8;
    font-size: 13px;
    padding: 8px 0;
  }

  .header-container-box {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
  }

  .top-bar-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .top-info span {
    margin-right: 20px;
  }

  .top-info i {
    color: #2563eb;
    margin-right: 5px;
  }

  .top-social a {
    color: #94a3b8;
    margin-left: 12px;
    text-decoration: none;
    transition: color 0.3s;
  }

  .top-social a:hover {
    color: #ff6b00;
  }

  /* ================= MAIN HEADER STYLES ================= */
  .main-header {
    background-color: #ffffff;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    position: sticky;
    top: 0;
    z-index: 1000;
  }

  .header-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 70px;
  }

  .logo {
    font-size: 22px;
    font-weight: 800;
    color: #ff6b00;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo span {
    color: #2563eb;
  }

  .logo-icon {
    font-size: 26px;
    color: #c2410c;
  }

  .nav-links {
    display: flex;
    list-style: none;
    gap: 25px;
  }

  .nav-link {
    text-decoration: none;
    color: #334155;
    font-weight: 600;
    font-size: 15px;
    transition: color 0.3s;
  }

  .nav-link:hover,
  .nav-link.active {
    color: #2563eb;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .btn-login {
    background-color: #2563eb;
    color: #ffffff;
    padding: 8px 18px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    transition: background 0.3s;
  }

  .btn-login:hover {
    background-color: #1d4ed8;
  }

  .mobile-menu-btn {
    display: none;
    background: none;
    border: none;
    font-size: 22px;
    color: #1e293b;
    cursor: pointer;
  }

  /* Responsive Mobile Styling */
  @media (max-width: 768px) {
    .top-bar { display: none; }
    .mobile-menu-btn { display: block; }

    .navbar {
      position: absolute;
      top: 70px;
      left: 0;
      width: 100%;
      background: #ffffff;
      box-shadow: 0 10px 15px rgba(0,0,0,0.1);
      display: none;
    }

    .navbar.active { display: block; }

    .nav-links {
      flex-direction: column;
      padding: 20px;
      gap: 15px;
    }
  }
</style>

<!-- PRELOADER AREA -->

      <div class="logo-box">

        <span>Diploma Engineers</span>
      </div>
    </div>

    <h1 class="loader-title">DIPLOMA <span>ENGINEERS</span></h1>
    <p class="loader-subtitle">The Students' Trusted Learning Platform</p>

    <div class="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="loading-status">
      <span>Loading...</span>
      <span id="progress-percent">0%</span>
    </div>
  </div>
</div>

    </div>
    <div class="top-social">

    </div>
  </div>
</div>

      </button>
    </div>

  </div>
</header>
