<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Books & Study Material | Diploma Engineers</title>
<meta name="description" content="Books, PDFs and study material uploaded by Diploma Engineers team members.">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#172033;font-family:Arial,Helvetica,sans-serif}#header,#footer{width:100%}.books-page{max-width:1200px;margin:auto;padding:34px 18px 55px}.hero{text-align:center;padding:22px 10px 28px}.badgex{display:inline-flex;padding:8px 13px;border-radius:999px;background:#eff6ff;color:#2563eb;font-weight:800;font-size:12px;letter-spacing:.04em}.hero h1{font-size:38px;font-weight:900;margin:12px 0 8px}.hero h1 span{color:#2563eb}.hero p{max-width:680px;margin:auto;color:#64748b;line-height:1.7}.toolbar{display:flex;gap:10px;align-items:center;margin:10px 0 22px}.search{flex:1;padding:13px 15px;border:1px solid #dbe3ee;border-radius:13px;background:#fff;outline:none;font-size:14px}.filter{padding:13px 15px;border:1px solid #dbe3ee;border-radius:13px;background:#fff;color:#334155;font-weight:700}.books-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}.book-card{background:#fff;border:1px solid #e5e7eb;border-radius:17px;overflow:hidden;box-shadow:0 8px 25px rgba(15,23,42,.06);transition:.22s;text-decoration:none;color:#172033;display:flex;flex-direction:column}.book-card:hover{transform:translateY(-4px);box-shadow:0 15px 32px rgba(15,23,42,.11)}.book-cover{width:100%;height:255px;object-fit:cover;background:#f1f5f9}.book-info{padding:13px}.book-title{font-size:15px;font-weight:800;line-height:1.4;margin:0 0 7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.book-category{font-size:11px;color:#64748b;font-weight:700;margin-bottom:10px}.uploader{display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px solid #edf0f4}.uploader img{width:30px;height:30px;border-radius:50%;object-fit:cover}.uploader div{min-width:0}.uploader b{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.uploader span{font-size:10px;color:#94a3b8}.open{margin-top:11px;display:inline-flex;align-items:center;gap:6px;color:#2563eb;font-size:12px;font-weight:800}.empty{grid-column:1/-1;text-align:center;padding:50px;background:#fff;border:1px dashed #dbe3ee;border-radius:18px;color:#94a3b8}@media(max-width:1050px){.books-grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:800px){.books-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.books-page{padding:22px 12px 40px}.hero h1{font-size:30px}.toolbar{flex-direction:column;align-items:stretch}.books-grid{grid-template-columns:repeat(2,1fr);gap:13px}.book-cover{height:220px}.book-info{padding:11px}.book-title{font-size:13px}}@media(max-width:390px){.books-grid{grid-template-columns:1fr 1fr}.book-cover{height:190px}}
</style>
</head>
<body>
<div id="header"></div>
<main class="books-page">
<section class="hero"><span class="badgex"><i class="fas fa-book-open"></i>&nbsp; STUDY MATERIAL</span><h1>Books &amp; <span>Study Material</span></h1><p>Explore books and PDFs uploaded by the Diploma Engineers team. New uploads from the Admin Panel appear here automatically.</p></section>
<div class="toolbar"><input id="bookSearch" class="search" placeholder="Search book, category or uploader..."><select id="bookFilter" class="filter"><option value="all">All Books</option></select></div>
<section id="booksGrid" class="books-grid"><div class="empty">Loading books...</div></section>
</main>
<div id="footer"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {getDatabase,ref,onValue} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
const config={apiKey:"AIzaSyAbg1Q1ZPgF7mwaxyin7iglla01eDk_tKo",authDomain:"diplomaengineers-869df.firebaseapp.com",databaseURL:"https://diplomaengineers-869df-default-rtdb.firebaseio.com",projectId:"diplomaengineers-869df",storageBucket:"diplomaengineers-869df.appspot.com",messagingSenderId:"356779436080",appId:"1:356779436080:web:4b28da380e547420d0e5f5"};
const app=initializeApp(config);const db=getDatabase(app);let books=[];const fallback="https://anubhavfinance.wordpress.com/wp-content/uploads/2025/11/whatsapp-image-2025-11-26-at-01.09.43_629f0cdb.jpg";
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
function render(){const grid=document.getElementById("booksGrid"),q=document.getElementById("bookSearch").value.trim().toLowerCase(),f=document.getElementById("bookFilter").value;const list=books.filter(b=>{const text=[b.title,b.name,b.category,b.ownerName,b.semester,b.branch].join(" ").toLowerCase();return (!q||text.includes(q))&&(f==="all"||String(b.category||"Book PDF")===f)});if(!list.length){grid.innerHTML='<div class="empty"><i class="fas fa-book-open" style="font-size:30px;margin-bottom:10px;"></i><br>No books found.</div>';return}grid.innerHTML=list.map(b=>{const title=b.title||b.name||"Untitled Book",cat=b.category||b.semester||"Book PDF",pdf=b.pdf||b.link||"#",img=b.image||fallback,owner=b.ownerName||"Legacy / Unknown",designation=b.ownerDesignation||"Team Member",photo=b.ownerPhoto||fallback;return `<a class="book-card" href="${esc(pdf)}" target="_blank" rel="noopener noreferrer"><img class="book-cover" src="${esc(img)}" alt="${esc(title)}" loading="lazy" onerror="this.src='${fallback}'"><div class="book-info"><p class="book-title">${esc(title)}</p><div class="book-category">${esc(cat)}</div><div class="uploader"><img src="${esc(photo)}" alt=""><div><b>${esc(owner)}</b><span>${esc(designation)}</span></div></div><span class="open"><i class="fas fa-book-open"></i> Open Book</span></div></a>`}).join("")}
onValue(ref(db,"books"),snap=>{books=[];if(snap.exists())snap.forEach(x=>books.push({id:x.key,...x.val()}));books.sort((a,b)=>(Number(b.timestamp)||0)-(Number(a.timestamp)||0));const cats=[...new Set(books.map(b=>b.category||"Book PDF"))];const select=document.getElementById("bookFilter");select.innerHTML='<option value="all">All Books</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");render()},err=>{document.getElementById("booksGrid").innerHTML='<div class="empty" style="color:#b91c1c">Unable to load books. Check Firebase Rules for public read access to /books.</div>'});
document.getElementById("bookSearch").addEventListener("input",render);document.getElementById("bookFilter").addEventListener("change",render);
async function loadPart(id,file){const el=document.getElementById(id);if(!el)return;try{const r=await fetch(file);if(r.ok)el.innerHTML=await r.text()}catch(e){console.warn(file,e)}}loadPart("header","header.html");loadPart("footer","footer.html");
</script>
</body></html>
