<!-- =====================================================
     HEADER + FOOTER FETCH
===================================================== -->

<script>

(function(){

    "use strict";


    /* =================================================
       EXTRACT BODY CONTENT
    ================================================= */

    function extractHTML(rawHTML){

        try{

            const parser =
                new DOMParser();

            const parsed =
                parser.parseFromString(
                    rawHTML,
                    "text/html"
                );


            if(
                parsed.body &&
                parsed.body.innerHTML.trim()
            ){

                return parsed.body.innerHTML;

            }

        }
        catch(error){

            console.warn(
                "HTML parser fallback:",
                error
            );

        }


        return rawHTML;

    }


    /* =================================================
       LOAD SHARED HEADER
    ================================================= */

    async function loadHeader(){

        const header =
            document.getElementById("header");


        if(!header){

            return;

        }


        try{

            const response =
                await fetch(
                    "header.html",
                    {
                        method:"GET",
                        cache:"no-store"
                    }
                );


            if(!response.ok){

                throw new Error(
                    "header.html not found"
                );

            }


            const rawHTML =
                await response.text();


            header.innerHTML =
                extractHTML(rawHTML);


            /*
             * Reinitialize Bootstrap collapse
             * after dynamic HTML insertion.
             */

            if(
                window.bootstrap &&
                bootstrap.Collapse
            ){

                header
                    .querySelectorAll(".collapse")
                    .forEach(function(element){

                        bootstrap.Collapse
                            .getOrCreateInstance(
                                element,
                                {
                                    toggle:false
                                }
                            );

                    });

            }


            /*
             * Make navbar toggler reliable.
             */

            header
                .querySelectorAll(".navbar-toggler")
                .forEach(function(toggler){

                    toggler.addEventListener(
                        "click",
                        function(){

                            const targetSelector =
                                toggler.getAttribute(
                                    "data-bs-target"
                                ) ||
                                toggler.getAttribute(
                                    "href"
                                );


                            if(!targetSelector){

                                return;

                            }


                            let target = null;


                            try{

                                target =
                                    document.querySelector(
                                        targetSelector
                                    );

                            }
                            catch(error){

                                return;

                            }


                            if(
                                !target ||
                                !window.bootstrap ||
                                !bootstrap.Collapse
                            ){

                                return;

                            }


                            bootstrap.Collapse
                                .getOrCreateInstance(
                                    target,
                                    {
                                        toggle:false
                                    }
                                )
                                .toggle();

                        }
                    );

                });

        }
        catch(error){

            console.error(
                "Header loading error:",
                error
            );

        }

    }


    /* =================================================
       LOAD SHARED FOOTER
    ================================================= */

    async function loadFooter(){

        const footer =
            document.getElementById("footer");


        if(!footer){

            return;

        }


        try{

            const response =
                await fetch(
                    "footer.html",
                    {
                        method:"GET",
                        cache:"no-store"
                    }
                );


            if(!response.ok){

                throw new Error(
                    "footer.html not found"
                );

            }


            const rawHTML =
                await response.text();


            footer.innerHTML =
                extractHTML(rawHTML);


            /*
             * Additional protection for dynamically
             * inserted footer images.
             */

            footer
                .querySelectorAll("img")
                .forEach(function(img){

                    img.style.maxWidth =
                        "100%";

                    img.style.height =
                        "auto";

                    img.style.objectFit =
                        "contain";

                });

        }
        catch(error){

            console.error(
                "Footer loading error:",
                error
            );

        }

    }


    /* =================================================
       LOAD BOTH
    ================================================= */

    document.addEventListener(
        "DOMContentLoaded",
        async function(){

            await loadHeader();

            await loadFooter();

        }
    );

})();

</script>

<script type="module">

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


import {
    getDatabase,
    ref,
    onValue
} from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAbg1Q1ZPgF7mwaxyin7iglla01eDk_tKo",

    authDomain:
        "diplomaengineers-869df.firebaseapp.com",

    databaseURL:
        "https://diplomaengineers-869df-default-rtdb.firebaseio.com",

    projectId:
        "diplomaengineers-869df",

    storageBucket:
        "diplomaengineers-869df.appspot.com",

    messagingSenderId:
        "356779436080",

    appId:
        "1:356779436080:web:4b28da380e547420d0e5f5"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getDatabase(app);


const newsList =
    document.getElementById(
        "newsList"
    );


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================================
   VALIDATE URL
===================================================== */

function validURL(value){

    try{

        const url =
            new URL(value);

        return (
            url.protocol === "http:" ||
            url.protocol === "https:"
        );

    }
    catch{

        return false;

    }

}


/* =====================================================
   LOAD NEWS
===================================================== */

function loadNews(){

    const newsRef =
        ref(
            db,
            "news"
        );


    onValue(

        newsRef,

        function(snapshot){

            newsList.innerHTML = "";


            if(!snapshot.exists()){

                newsList.innerHTML = `

                    <div class="empty">

                        <i
                            class="fa-regular fa-newspaper"
                            style="font-size:32px;"
                        ></i>

                        <p>
                            कोई News या Update उपलब्ध नहीं है।
                        </p>

                    </div>

                `;

                return;

            }


            const newsArray = [];


            snapshot.forEach(
                function(child){

                    newsArray.push({

                        id:
                            child.key,

                        data:
                            child.val() || {}

                    });

                }
            );


            /*
             * Latest news first.
             */

            newsArray.reverse();


            newsArray.forEach(
                function(item){

                    createNewsCard(
                        item.id,
                        item.data
                    );

                }
            );

        },


        function(error){

            console.error(
                "Firebase error:",
                error
            );


            newsList.innerHTML = `

                <div class="error-box">

                    <i
                        class="fa-solid fa-triangle-exclamation"
                        style="font-size:28px;margin-bottom:8px;">
                    </i>

                    <p>
                        Data Load करने में समस्या हुई।
                        कृपया पुनः प्रयास करें।
                    </p>

                </div>

            `;

        }

    );

}


/* =====================================================
   CREATE NEWS CARD
===================================================== */

function createNewsCard(id,n){

    const title =
        n.title ||
        "Untitled News";


    const description =
        n.text ||
        n.desc ||
        n.description ||
        "";


    const category =
        n.cat ||
        n.category ||
        "NOTIFICATION";


    const date =
        n.date ||
        "Recent";


    const image =
        n.thumb ||
        n.image ||
        n.thumbnail ||
        "";


    const externalLink =
        n.link ||
        n.pdf ||
        n.fileUrl ||
        "";


    const card =
        document.createElement(
            "article"
        );


    card.className =
        "news-card";


    card.id =
        `card-${id}`;


    let actionTarget = "";


    if(
        externalLink &&
        validURL(externalLink)
    ){

        actionTarget = `

            <a
                href="${escapeHTML(externalLink)}"
                target="_blank"
                rel="noopener noreferrer"
                class="action-btn"
            >
                View News
                <i class="fa-solid fa-arrow-right"></i>
            </a>

        `;

    }
    else{

        actionTarget = `

            <button
                type="button"
                class="action-btn"
                onclick="toggleDetails('${escapeHTML(id)}')"
            >
                Read More
                <i class="fa-solid fa-chevron-down"></i>
            </button>

        `;

    }


    let imageHTML = "";


    if(
        image &&
        validURL(image)
    ){

        imageHTML = `

            <img
                src="${escapeHTML(image)}"
                class="card-thumbnail"
                alt="News thumbnail"
                loading="lazy"
                onerror="this.style.display='none';"
            >

        `;

    }


    card.innerHTML = `

        <span class="category">
            ${escapeHTML(category)}
        </span>


        <h2 class="news-title">

            <i class="fa-solid fa-square-check"></i>

            <span>
                ${escapeHTML(title)}
            </span>

        </h2>


        <p class="news-description">

            ${escapeHTML(description)}

        </p>


        <div class="card-footer">

            <div class="news-date">

                <i class="fa-regular fa-calendar"></i>

                ${escapeHTML(date)}

            </div>


            <div class="action-links">

                <button
                    type="button"
                    class="action-btn"
                    onclick="toggleDetails('${escapeHTML(id)}')"
                >

                    <i class="fa-solid fa-share-nodes"></i>

                    Share

                </button>


                ${actionTarget}

            </div>

        </div>


        <!-- EXPANDABLE PANEL -->

        <div
            class="expandable-panel"
            id="panel-${escapeHTML(id)}"
        >

            ${imageHTML}


            <div class="full-desc">

                ${escapeHTML(description)}

            </div>


            <div class="share-grid">

                <button
                    type="button"
                    class="share-icon-btn share-whatsapp"
                    onclick="shareWhatsApp(
                        '${escapeHTML(title)}',
                        '${escapeHTML(id)}'
                    )"
                >

                    <i class="fa-brands fa-whatsapp"></i>

                    WhatsApp

                </button>


                <button
                    type="button"
                    class="share-icon-btn share-telegram"
                    onclick="shareTelegram(
                        '${escapeHTML(title)}',
                        '${escapeHTML(id)}'
                    )"
                >

                    <i class="fa-brands fa-telegram"></i>

                    Telegram

                </button>


                <button
                    type="button"
                    class="share-icon-btn share-copy"
                    onclick="copyLink(
                        '${escapeHTML(title)}',
                        '${escapeHTML(id)}'
                    )"
                >

                    <i class="fa-regular fa-copy"></i>

                    Copy

                </button>

            </div>

        </div>

    `;


    newsList.appendChild(card);

}


/* =====================================================
   TOGGLE DETAILS
===================================================== */

window.toggleDetails =
function(id){

    const panel =
        document.getElementById(
            `panel-${id}`
        );


    if(!panel){

        return;

    }


    panel.classList.toggle(
        "active"
    );

};


/* =====================================================
   WHATSAPP SHARE
===================================================== */

window.shareWhatsApp =
function(title,id){

    const url =
        window.location.href
            .split("#")[0]
        +
        "#card-"
        +
        id;


    const text =
        encodeURIComponent(
            `${title}\n\nRead details: ${url}`
        );


    window.open(
        `https://wa.me/?text=${text}`,
        "_blank",
        "noopener,noreferrer"
    );

};


/* =====================================================
   TELEGRAM SHARE
===================================================== */

window.shareTelegram =
function(title,id){

    const url =
        window.location.href
            .split("#")[0]
        +
        "#card-"
        +
        id;


    window.open(

        `https://t.me/share/url?url=${
            encodeURIComponent(url)
        }&text=${
            encodeURIComponent(title)
        }`,

        "_blank",

        "noopener,noreferrer"

    );

};


/* =====================================================
   COPY LINK
===================================================== */

window.copyLink =
async function(title,id){

    const url =
        window.location.href
            .split("#")[0]
        +
        "#card-"
        +
        id;


    try{

        await navigator.clipboard.writeText(
            `${title} - ${url}`
        );


        alert(
            "Link Copied!"
        );

    }
    catch(error){

        prompt(
            "Copy Link:",
            url
        );

    }

};


/* =====================================================
   START
===================================================== */

loadNews();

</script>
