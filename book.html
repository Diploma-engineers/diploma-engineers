<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Books | Diploma Engineers</title>
<meta name="description" content="Books collection of Diploma Engineers">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:Poppins,Arial,sans-serif;
  background:#f7f8fa;
  color:#18202a;
  min-height:100vh;
  overflow-x:hidden;
}
button,input{font:inherit}

.page{
  width:100%;
  min-height:100vh;
  padding:18px 16px 42px;
}

.shell{
  width:min(1180px,100%);
  margin:0 auto;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-bottom:18px;
}

.heading h1{
  font-size:27px;
  line-height:1.2;
  font-weight:700;
  color:#171c24;
}
.heading p{
  margin-top:5px;
  font-size:12px;
  color:#7b8491;
}

.count{
  white-space:nowrap;
  background:#fff;
  border:1px solid #e6e9ee;
  border-radius:12px;
  padding:9px 12px;
  font-size:11px;
  color:#66707c;
}

.tools{
  display:flex;
  gap:9px;
  margin-bottom:18px;
}
.search{
  flex:1;
  min-width:0;
  border:1px solid #e0e4e9;
  background:#fff;
  border-radius:13px;
  padding:12px 14px;
  outline:none;
  color:#202731;
  font-size:12px;
  transition:border-color .2s,box-shadow .2s;
}
.search:focus{
  border-color:#cbd1d8;
  box-shadow:0 0 0 3px rgba(20,30,40,.035);
}
.refresh{
  border:1px solid #e0e4e9;
  background:#fff;
  color:#4d5661;
  border-radius:13px;
  padding:0 14px;
  cursor:pointer;
  font-size:12px;
  font-weight:600;
}
.refresh:active{transform:scale(.98)}

.books-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:15px;
}

.book{
  display:block;
  background:#fff;
  border:1px solid #e5e8ed;
  border-radius:17px;
  overflow:hidden;
  text-decoration:none;
  color:inherit;
  box-shadow:0 5px 18px rgba(20,28,38,.045);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
  -webkit-tap-highlight-color:transparent;
}
.book:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 24px rgba(20,28,38,.08);
  border-color:#d8dde4;
}
.book:active{transform:translateY(-1px)}

.cover{
  width:100%;
  aspect-ratio:3/4;
  background:#eef1f4;
  overflow:hidden;
  position:relative;
}
.cover img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .3s ease;
}
.book:hover .cover img{transform:scale(1.025)}

.no-cover{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:8px;
  color:#8a939e;
}
.no-cover .icon{font-size:34px}
.no-cover span{font-size:10px}

.info{
  padding:12px 12px 14px;
}
.title{
  font-size:13px;
  line-height:1.45;
  font-weight:600;
  color:#202630;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  min-height:38px;
}
.category{display:none; 
  margin-top:6px;
  font-size:10px;
  color:#8a929d;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.open{display:none; 
  margin-top:10px;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  border:1px solid #e3e6eb;
  border-radius:9px;
  padding:7px 8px;
  color:#4d5661;
  background:#fafbfc;
  font-size:10px;
  font-weight:600;
}

.state{
  min-height:240px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:1px dashed #d7dce2;
  border-radius:17px;
  background:#fff;
  color:#7b8490;
  font-size:12px;
  padding:30px 16px;
}
.state strong{display:block;color:#444c56;font-size:13px;margin-bottom:5px}
.state small{font-size:10px}

@media(max-width:950px){
  .books-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:650px){
  .page{padding:11px 9px 30px}
  .top{margin-bottom:13px}
  .heading h1{font-size:21px}
  .heading p{font-size:10px}
  .count{padding:7px 9px;font-size:9px}
  .tools{margin-bottom:13px}
  .search{padding:10px 11px;font-size:11px;border-radius:11px}
  .refresh{padding:0 11px;border-radius:11px;font-size:10px}
  /* Mobile: exactly 2 books in one row */
  .books-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .book{border-radius:14px}
  .info{padding:9px 9px 10px}
  .title{font-size:11px;min-height:32px}
  .category{display:none; font-size:8px;margin-top:4px}
  .open{display:none; font-size:9px;padding:6px 5px;margin-top:7px;border-radius:8px}
  .state{min-height:200px;border-radius:14px;font-size:11px}
}
</style>
</head>

<body>
<main class="page">
  <div class="shell">
    <div class="top">

      
    </div>

    <div class="tools">
      <input id="search" class="search" type="search" placeholder="Search books..." autocomplete="off">
    </div>

    <section id="booksGrid" class="books-grid">
      <div class="state" style="grid-column:1/-1">
        <div>
          <strong>Loading books...</strong>
          <small>Please wait</small>
        </div>
      </div>
    </section>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase,
  ref,
  get
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAbg1Q1ZPgF7mwaxyin7iglla01eDk_tKo",
  authDomain: "diplomaengineers-869df.firebaseapp.com",
  databaseURL: "https://diplomaengineers-869df-default-rtdb.firebaseio.com",
  projectId: "diplomaengineers-869df",
  storageBucket: "diplomaengineers-869df.appspot.com",
  messagingSenderId: "356779436080",
  appId: "1:356779436080:web:4b28da380e547420d0e5f5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const grid = document.getElementById("booksGrid");
const count = document.getElementById("bookCount");
const search = document.getElementById("search");
const refresh = document.getElementById("refresh");

let books = [];

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[char]));
}

function normalizeUrl(value){
  const url = String(value || "").trim();
  if(!url) return "";
  try{
    const parsed = new URL(url, window.location.href);
    if(parsed.protocol === "http:" || parsed.protocol === "https:"){
      return parsed.href;
    }
  }catch(e){}
  return "";
}

function fallbackCover(title){
  return `
    <div class="no-cover">
      <div class="icon">📖</div>
      <span>${escapeHTML(title || "Book")}</span>
    </div>
  `;
}

function renderBooks(){
  const term = search.value.trim().toLowerCase();

  const filtered = books.filter(book => {
    const title = String(book.title || book.name || "").toLowerCase();
    const category = String(book.category || book.branch || "").toLowerCase();
    return !term || title.includes(term) || category.includes(term);
  });

  count.textContent = `${filtered.length} book${filtered.length === 1 ? "" : "s"}`;

  if(!filtered.length){
    grid.innerHTML = `
      <div class="state" style="grid-column:1/-1">
        <div>
          <strong>${term ? "No books found" : "No books available"}</strong>
          <small>${term ? "Try another search." : "Books uploaded by admins will appear here."}</small>
        </div>
      </div>`;
    return;
  }

  grid.innerHTML = filtered.map((book, index) => {
    const title = String(book.title || book.name || `Book ${index + 1}`).trim();

    // Support the fields used by the Admin Panel and common older records.
    const image = normalizeUrl(
      book.image || book.thumbnail || book.thumb || book.cover || book.imageUrl || ""
    );

    const file = normalizeUrl(
      book.pdf || book.link || book.file || book.url ||
      book.pdfUrl || book.fileUrl || book.downloadUrl || ""
    );

    // A book without an attached file cannot be opened.
    if(!file) return "";

    const safeTitle = escapeHTML(title);
    const safeImage = escapeHTML(image);
    const safeFile = escapeHTML(file);

    return `
      <a class="book" href="${safeFile}" target="_blank" rel="noopener noreferrer"
         aria-label="Open ${safeTitle}">
        <div class="cover">
          ${
            safeImage
              ? `<img src="${safeImage}" alt="${safeTitle}" loading="lazy"
                   onerror="this.onerror=null; this.src='data:image/svg+xml;charset=UTF-8,${encodeURIComponent(
                     `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 533">
                        <rect width="400" height="533" fill="#f5f6f8"/>
                        <text x="200" y="260" text-anchor="middle" font-size="72">📖</text>
                        <text x="200" y="330" text-anchor="middle" font-family="Arial" font-size="22" fill="#555">Book</text>
                      </svg>`
                   )}';">`
              : fallbackCover(title)
          }
        </div>

        <div class="info">
          <div class="title" title="${safeTitle}">${safeTitle}</div>
        </div>
      </a>`;
  }).join("");

  if(!grid.innerHTML.trim()){
    grid.innerHTML = `
      <div class="state" style="grid-column:1/-1">
        <div>
          <strong>Books found, but no file link is attached</strong>
          <small>Please add a PDF/file link from the Admin Panel.</small>
        </div>
      </div>`;
  }
}

async function loadBooks(){
  grid.innerHTML = `
    <div class="state" style="grid-column:1/-1">
      <div>
        <strong>Loading books...</strong>
        <small>Fetching the latest collection</small>
      </div>
    </div>`;
  count.textContent = "Loading...";

  try{
    const snapshot = await get(ref(db, "books"));
    books = [];

    if(snapshot.exists()){
      snapshot.forEach(child => {
        const value = child.val();
        if(value && typeof value === "object"){
          books.push({id: child.key, ...value});
        }
      });
    }

    books.sort((a,b) =>
      Number(b.timestamp || b.createdAt || 0) -
      Number(a.timestamp || a.createdAt || 0)
    );

    renderBooks();
  }catch(error){
    console.error("Books load error:", error);
    count.textContent = "Error";
    grid.innerHTML = `
      <div class="state" style="grid-column:1/-1">
        <div>
          <strong>Unable to load books</strong>
          <small>Firebase read permission or connection issue.</small>
        </div>
      </div>`;
  }
}

search.addEventListener("input", renderBooks);
refresh.addEventListener("click", loadBooks);

loadBooks();
</script>
</body>
</html>
