<!DOCTYPE html>

<style>
:root{
  --blue:#2563eb;
  --blue2:#3b82f6;
  --dark:#0f172a;
  --muted:#64748b;
  --border:#e2e8f0;
  --shadow:0 6px 20px rgba(15,23,42,.08);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  margin:0 !important;
  padding:0 !important;
  width:100% !important;
  height:auto !important;
  min-height:0 !important;
  background:transparent !important;
  color:var(--dark);
  font-family:"Plus Jakarta Sans",sans-serif;
  overflow:visible !important;
}
body::before,
body::after{
  display:none !important;
}

.trending-wrap{
  width:100% !important;
  max-width:none !important;
  min-height:0 !important;
  height:auto !important;
  padding:0 !important;
  margin:0 !important;
  background:transparent !important;
  border:0 !important;
  box-shadow:none !important;
  border-radius:0 !important;
}

.trending-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:0 0 10px;
}

.trending-title{
  font-size:16px;
  font-weight:800;
  line-height:1.2;
}

.trending-title span{
  color:var(--blue);
}

.trending-more{
  font-size:10px;
  font-weight:700;
  color:var(--muted);
  white-space:nowrap;
}

.trending-slider{
  width:100% !important;
  height:auto !important;
  min-height:0 !important;
  display:flex;
  gap:12px;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding:2px 2px 8px;
  margin:0 !important;
  border:0 !important;
  border-radius:0 !important;
  background:transparent !important;
  box-shadow:none !important;
}

.trending-slider::-webkit-scrollbar{
  display:none;
}

.trending-card{
  position:relative;
  flex:0 0 170px;
  width:170px;
  height:205px;
  border-radius:16px;
  overflow:hidden;
  background:#fff;
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  scroll-snap-align:start;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

.trending-card img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.trending-card::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to top,
    rgba(2,6,23,.88) 0%,
    rgba(2,6,23,.35) 42%,
    rgba(2,6,23,0) 75%
  );
  pointer-events:none;
}

.trending-content{
  position:absolute;
  z-index:2;
  left:10px;
  right:10px;
  bottom:10px;
}

.trending-content h3{
  color:#fff;
  font-size:12px;
  line-height:1.35;
  font-weight:800;
  margin:0 0 6px;
}

.trending-open{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:5px 8px;
  border-radius:999px;
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.35);
  color:#fff;
  font-size:9px;
  font-weight:800;
  backdrop-filter:blur(6px);
}

.trending-card:active{
  transform:scale(.985);
}

@media(min-width:768px){
  .trending-card{
    flex-basis:190px;
    width:190px;
    height:220px;
  }
}
</style>
</head>

<body>

<script>
(function(){

  const slider = document.getElementById("trendingSlider");
  if(!slider) return;

  let autoTimer = null;
  let paused = false;

  function startAutoSlide(){
    stopAutoSlide();

    autoTimer = setInterval(function(){

      if(paused) return;

      const cards = slider.querySelectorAll(".trending-card");
      if(!cards.length) return;

      const cardWidth = cards[0].offsetWidth + 12;
      const maxScroll = slider.scrollWidth - slider.clientWidth;

      if(slider.scrollLeft >= maxScroll - 4){
        slider.scrollTo({
          left:0,
          behavior:"smooth"
        });
      }else{
        slider.scrollBy({
          left:cardWidth,
          behavior:"smooth"
        });
      }

    },3200);
  }

  function stopAutoSlide(){
    if(autoTimer){
      clearInterval(autoTimer);
      autoTimer = null;
    }
  }

  slider.addEventListener("mouseenter",()=>{
    paused = true;
  });

  slider.addEventListener("mouseleave",()=>{
    paused = false;
  });

  slider.addEventListener("touchstart",()=>{
    paused = true;
  },{passive:true});

  slider.addEventListener("touchend",()=>{
    setTimeout(()=>{
      paused = false;
    },1200);
  },{passive:true});

  /*
   Prevent image dragging while keeping normal swipe.
  */
  slider.querySelectorAll("img").forEach(img=>{
    img.addEventListener("dragstart",e=>e.preventDefault());
  });

  startAutoSlide();

})();
</script>
