<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <title>BTEUP Diploma - All Subjects</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-app: #f4f5f9;
            --surface: #ffffff;
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --text-main: #1e293b;
            --border: #e2e8f0;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding-bottom: 25px;
        }

        /* Full Width & Mobile Friendly Padding */
        .app-container {
            width: 100%;
            max-width: 100% !important;
            padding: 10px 12px;
            margin: 0 auto;
        }

        /* Responsive Grid */
        .subjects-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        @media (min-width: 768px) {
            .subjects-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1200px) {
            .subjects-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .app-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 14px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: 0.15s ease;
        }

        .app-card:hover {
            border-color: var(--primary);
        }

        .icon-circle {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        /* Player Layout */
        .player-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 992px) {
            .player-layout {
                grid-template-columns: 3fr 1fr;
            }
        }

        .video-box {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .action-chip {
            background: var(--bg-app);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            border: none;
            color: var(--text-main);
            text-decoration: none;
        }

        .action-chip.liked {
            background: #ffe4e6;
            color: #e11d48;
        }

        .playlist-card {
            background: var(--surface);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--border);
            margin-bottom: 8px;
            cursor: pointer;
        }

        .playlist-card.active {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .play-badge {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            flex-shrink: 0;
        }

        .playlist-card.active .play-badge {
            background: var(--primary);
            color: white;
        }

        .star-rating .fa-star {
            color: #cbd5e0;
            cursor: pointer;
            font-size: 1rem;
        }
        
        .star-rating .fa-star.active {
            color: #f59e0b;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- SCREEN 1: SUBJECTS LIST VIEW -->
        <div id="subjectsView">
            <div class="d-flex align-items-center justify-content-between mb-3 px-1">
                <div>
                    <h5 class="fw-bold mb-0">BTEUP 1st Sem</h5>
                    <span class="text-muted" style="font-size: 0.75rem;">All Subjects & Notes</span>
                </div>
                <span class="badge bg-primary rounded-pill px-2 py-1" style="font-size: 0.7rem;">Batch 2026</span>
            </div>

            <div class="subjects-grid" id="subjectListContainer"></div>
        </div>

        <!-- SCREEN 2: LECTURE PLAYER VIEW -->
        <div id="lectureView" class="hidden">
            <button class="btn btn-sm btn-outline-primary mb-2 ms-1 fw-bold" style="font-size: 0.75rem;" onclick="window.renderSubjectsListScreen()">
                <i class="fas fa-arrow-left me-1"></i> Back
            </button>
            
            <div class="player-layout">
                <!-- Left Section: Video, Like, PDF, Rating & Comments -->
                <div>
                    <div class="video-box mb-2 shadow-sm">
                        <iframe id="videoPlayer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                    </div>

                    <div class="bg-white p-3 rounded-3 border mb-2 shadow-sm">
                        <h6 id="videoTitle" class="fw-bold mb-1 text-dark" style="font-size: 0.95rem;">Lecture Title</h6>
                        <p id="videoDesc" class="text-muted mb-2" style="font-size: 0.75rem;">Description...</p>

                        <!-- Like & PDF Download Buttons -->
                        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 pt-2 border-top">
                            <button id="likeBtn" class="action-chip" onclick="window.toggleLike()">
                                <i class="far fa-heart"></i> <span id="likeText">Like</span> (<span id="likeCount">156</span>)
                            </button>

                            <a id="pdfDownloadBtn" href="#" target="_blank" class="action-chip bg-primary text-white">
                                <i class="fas fa-file-pdf"></i> PDF Notes
                            </a>
                        </div>

                        <!-- Star Rating Feature -->
                        <div class="d-flex align-items-center justify-content-between mt-2 pt-2 border-top">
                            <span class="text-muted fw-bold" style="font-size: 0.75rem;">Rate:</span>
                            <div class="star-rating d-flex gap-1">
                                <i class="fas fa-star" onclick="window.rateVideo(1)"></i>
                                <i class="fas fa-star" onclick="window.rateVideo(2)"></i>
                                <i class="fas fa-star" onclick="window.rateVideo(3)"></i>
                                <i class="fas fa-star" onclick="window.rateVideo(4)"></i>
                                <i class="fas fa-star" onclick="window.rateVideo(5)"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Comments & Doubts Section -->
                    <div class="bg-white p-3 rounded-3 border shadow-sm">
                        <h6 class="fw-bold mb-2" style="font-size: 0.85rem;"><i class="far fa-comments me-1 text-primary"></i> Doubts & Comments</h6>
                        <div class="input-group input-group-sm mb-2">
                            <input type="text" id="commentInput" class="form-control" placeholder="Apna sawaal likhein..." style="font-size: 0.8rem;">
                            <button class="btn btn-primary px-3 fw-bold" style="font-size: 0.8rem;" onclick="window.addComment()">Send</button>
                        </div>
                        <div id="commentsList" class="d-flex flex-column gap-2">
                            <div class="bg-light p-2 rounded-2" style="font-size: 0.75rem;">
                                <span class="fw-bold d-block text-dark">Student</span>
                                <span class="text-muted">Sir, lecture bahut accha tha!</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Section: Playlist -->
                <div>
                    <h6 class="fw-bold mb-2 text-secondary px-1" style="font-size: 0.85rem;">Lectures List</h6>
                    <div id="playlistContainer"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- JavaScript Code -->
    <script>
        const appData = {
            math1: { 
                title: "Mathematics-I", 
                videos: [
                    { title: "1. Math-I | Complete (Part I)", desc: "Types of matrices, addition & determinants.", url: "https://www.youtube.com/embed/Rt1OY5gfDVc", pdf: "#" },
                    { title: "2. Math-I | Complete (Part II)", desc: "Binomial theorem problems.", url: "https://www.youtube.com/embed/-ISId5bQc2U", pdf: "#" }
                ]
            },
            physics1: { 
                title: "Applied Physics-I", 
                videos: [
                    { title: "1. Physics-I | Complete", desc: "SI units & dimensional analysis.", url: "https://www.youtube.com/embed/7osNMH9Wv2c", pdf: "#" },
                    { title: "2. Work, Power & Energy", desc: "Energy conservation laws.", url: "https://www.youtube.com/embed/rfscV00zUVU", pdf: "#" }
                ]
            },
            chemistry: { 
                title: "Applied Chemistry", 
                videos: [
                    { title: "1. Chemistry | Complete", desc: "Atomic models & bonding.", url: "https://www.youtube.com/embed/eqChfO1jaI8", pdf: "#" }
                ]
            },
            comm: { 
                title: "Communication Skills", 
                videos: [
                    { title: "1. Comm. Skills | Complete", desc: "Process & communication barriers.", url: "https://www.youtube.com/embed/OZziS2WuA0c", pdf: "#" }
                ]
            },
            graphics: { 
                title: "Engineering Graphics", 
                videos: [
                    { title: "1. Engg Graphics | Basics", desc: "Drawing instruments & dimensioning.", url: "https://www.youtube.com/embed/dDOWJCqXuNA", pdf: "#" }
                ]  
            },
            workshop: { 
                title: "Workshop Practice", 
                videos: [
                    { title: "1. Carpentry & Fitting", desc: "Tools & safety measures.", url: "https://www.youtube.com/embed/uS18y4JkE3Y", pdf: "#" },
                    { title: "2. Welding & Sheet Metal", desc: "Arc welding basics.", url: "https://www.youtube.com/embed/uS18y4JkE3Y", pdf: "#" }
                ]
            },
            sports: { 
                title: "Sports & Yoga", 
                videos: [
                    { title: "1. Yoga & Asanas", desc: "Physical fitness & mental health.", url: "https://www.youtube.com/embed/rfscV00zUVU", pdf: "#" }
                ]
            }
        };

        let currentSubjectKey = '';
        let currentVideoIndex = 0;
        let isLiked = false;

        function openSubject(key) {
            currentSubjectKey = key;
            document.getElementById('subjectsView').classList.add('hidden');
            document.getElementById('lectureView').classList.remove('hidden');
            playVideo(key, 0);
        }

        function renderSubjectsListScreen() {
            document.getElementById('lectureView').classList.add('hidden');
            document.getElementById('subjectsView').classList.remove('hidden');
            document.getElementById('videoPlayer').src = "";
        }

        function playVideo(key, index) {
            currentVideoIndex = index;
            const vid = appData[key].videos[index];
            
            document.getElementById('videoPlayer').src = vid.url;
            document.getElementById('videoTitle').innerText = vid.title;
            document.getElementById('videoDesc').innerText = vid.desc;
            document.getElementById('pdfDownloadBtn').href = vid.pdf;

            isLiked = false;
            document.getElementById('likeBtn').classList.remove('liked');
            document.getElementById('likeText').innerText = "Like";
            document.getElementById('likeCount').innerText = "156";
            window.rateVideo(0);

            let listHtml = '';
            appData[key].videos.forEach((v, i) => {
                const isActive = i === index ? 'active' : '';
                const iconClass = i === index ? 'fa-play' : 'fa-film';
                listHtml += `<div class="playlist-card ${isActive}" onclick="playVideo('${key}', ${i})">
                    <div class="play-badge"><i class="fas ${iconClass}"></i></div>
                    <div><h6 class="mb-0 fw-bold" style="font-size:0.75rem;">${v.title}</h6><span class="text-muted" style="font-size:0.65rem;">Lecture</span></div>
                </div>`;
            });
            document.getElementById('playlistContainer').innerHTML = listHtml;
        }

        function toggleLike() {
            const likeBtn = document.getElementById('likeBtn');
            let count = parseInt(document.getElementById('likeCount').innerText);
            if(!isLiked) {
                likeBtn.classList.add('liked');
                document.getElementById('likeText').innerText = "Liked";
                document.getElementById('likeCount').innerText = count + 1;
                isLiked = true;
            } else {
                likeBtn.classList.remove('liked');
                document.getElementById('likeText').innerText = "Like";
                document.getElementById('likeCount').innerText = count - 1;
                isLiked = false;
            }
        }

        function rateVideo(stars) {
            const iconList = document.querySelectorAll('.star-rating .fa-star');
            iconList.forEach((star, index) => {
                if(index < stars) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        function addComment() {
            const input = document.getElementById('commentInput');
            if(input.value.trim() !== "") {
                const list = document.getElementById('commentsList');
                list.innerHTML = `<div class="bg-light p-2 rounded-2" style="font-size: 0.75rem;"><span class="fw-bold d-block text-dark">You</span><span class="text-muted">${input.value.trim()}</span></div>` + list.innerHTML;
                input.value = "";
            }
        }

        let listHtml = '';
        for(let key in appData) {
            listHtml += `<div class="app-card d-flex align-items-center gap-3" onclick="openSubject('${key}')">
                <div class="icon-circle"><i class="fas fa-book-open"></i></div>
                <div>
                    <h6 class="mb-0 fw-bold" style="font-size:0.85rem;">${appData[key].title}</h6>
                    <span class="text-muted" style="font-size:0.7rem;">${appData[key].videos.length} Lectures & Notes</span>
                </div>
            </div>`;
        }
        document.getElementById('subjectListContainer').innerHTML = listHtml;
    </script>
</body>
</html>
