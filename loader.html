<!-- =====================================================
     LOADER CSS
===================================================== -->

<style>

*{
    box-sizing:border-box;
}


/* FULL SCREEN */

#DELoader{

    position:fixed;

    top:0;
    left:0;
    right:0;
    bottom:0;

    width:100%;
    height:100%;

    min-height:100dvh;

    background:#ffffff;

    display:flex;

    align-items:center;
    justify-content:center;

    z-index:2147483647;

    overflow:hidden;

    opacity:1;

    visibility:visible;

    transition:
        opacity .45s ease,
        visibility .45s ease;

}


/* HIDE */

#DELoader.DEHide{

    opacity:0;

    visibility:hidden;

    pointer-events:none;

}


/* MAIN BOX */

.DELoaderBox{

    width:92%;

    max-width:380px;

    text-align:center;

    padding:20px;

}


/* =====================================================
   LOGO
===================================================== */

.DELogoBox{

    width:115px;

    height:115px;

    margin:0 auto 22px;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

}


/* ROTATING RING */

.DERing{

    position:absolute;

    width:115px;

    height:115px;

    border-radius:50%;

    border:

        4px solid #e5e7eb;

    border-top-color:#2563eb;

    border-right-color:#f97316;

    animation:

        DERingRotate

        1s linear infinite;

}


@keyframes DERingRotate{

    from{

        transform:rotate(0deg);

    }

    to{

        transform:rotate(360deg);

    }

}


/* LOGO IMAGE */

.DELogo{

    width:84px;

    height:84px;

    object-fit:cover;

    border-radius:50%;

    background:#ffffff;

    position:relative;

    z-index:2;

    box-shadow:

        0 5px 20px

        rgba(0,0,0,.12);

}


/* =====================================================
   BRAND
===================================================== */

.DEBrand{

    font-family:

        Arial,

        sans-serif;

    font-size:28px;

    font-weight:800;

    letter-spacing:.5px;

    line-height:1.2;

}


.DEOrange{

    color:#f97316;

}


.DEBlue{

    color:#2563eb;

}


/* =====================================================
   TAGLINE
===================================================== */

.DETagline{

    margin-top:9px;

    color:#64748b;

    font-family:

        Arial,

        sans-serif;

    font-size:12px;

}


/* =====================================================
   PROGRESS
===================================================== */

.DEProgress{

    width:100%;

    max-width:250px;

    height:6px;

    margin:

        24px auto 10px;

    background:#e5e7eb;

    border-radius:20px;

    overflow:hidden;

}


/* PROGRESS BAR */

.DEProgressBar{

    width:0%;

    height:100%;

    border-radius:20px;

    background:

        linear-gradient(

            90deg,

            #f97316,

            #2563eb

        );

    transition:

        width .15s linear;

}


/* =====================================================
   STATUS
===================================================== */

.DEStatus{

    width:100%;

    max-width:250px;

    margin:auto;

    display:flex;

    justify-content:space-between;

    align-items:center;

    font-family:

        Arial,

        sans-serif;

    font-size:11px;

    color:#94a3b8;

}


#DEPercent{

    font-weight:700;

    color:#2563eb;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .DELoaderBox{

        width:94%;

        padding:15px;

    }


    .DELogoBox{

        width:100px;

        height:100px;

        margin-bottom:20px;

    }


    .DERing{

        width:100px;

        height:100px;

    }


    .DELogo{

        width:73px;

        height:73px;

    }


    .DEBrand{

        font-size:24px;

    }


    .DETagline{

        font-size:11px;

    }


    .DEProgress{

        max-width:210px;

    }


    .DEStatus{

        max-width:210px;

    }

}


/* SMALL PHONE */

@media(max-height:600px){

    .DELogoBox{

        width:80px;

        height:80px;

        margin-bottom:12px;

    }


    .DERing{

        width:80px;

        height:80px;

        border-width:3px;

    }


    .DELogo{

        width:60px;

        height:60px;

    }


    .DEBrand{

        font-size:21px;

    }


    .DEProgress{

        margin-top:15px;

    }

}

</style>


<!-- =====================================================
     LOADER JAVASCRIPT
===================================================== -->

<script>

(function(){

    "use strict";


    const loader =
        document.getElementById("DELoader");

    const bar =
        document.getElementById("DEProgressBar");

    const percent =
        document.getElementById("DEPercent");

    const text =
        document.getElementById("DELoadingText");


    if(!loader){

        return;

    }


    /* STOP PAGE SCROLL */

    document.documentElement.style.overflow =
        "hidden";

    document.body.style.overflow =
        "hidden";


    /* LOADING MESSAGES */

    const messages = [

        "Loading...",

        "Preparing Portal...",

        "Loading Resources...",

        "Preparing Study Material...",

        "Almost Ready..."

    ];


    let progress = 0;

    let messageIndex = 0;


    /* =================================================
       PROGRESS ANIMATION
    ================================================= */

    const progressTimer = setInterval(function(){

        if(progress < 90){

            progress += Math.floor(

                Math.random() * 4

            ) + 1;


            if(progress > 90){

                progress = 90;

            }

        }


        if(bar){

            bar.style.width =
                progress + "%";

        }


        if(percent){

            percent.textContent =
                progress + "%";

        }


        if(

            text &&

            progress % 15 < 5

        ){

            text.textContent =
                messages[messageIndex];

            messageIndex++;

            if(

                messageIndex >=
                messages.length

            ){

                messageIndex = 0;

            }

        }


    },120);


    /* =================================================
       HIDE LOADER
    ================================================= */

    function hideDELoader(){

        clearInterval(progressTimer);


        /* COMPLETE */

        progress = 100;


        if(bar){

            bar.style.width = "100%";

        }


        if(percent){

            percent.textContent = "100%";

        }


        if(text){

            text.textContent =
                "Ready!";

        }


        /* Small delay for 100% animation */

        setTimeout(function(){

            loader.classList.add(
                "DEHide"
            );


            document.documentElement
                .style.overflow = "";


            document.body
                .style.overflow = "";


            /* Remove after animation */

            setTimeout(function(){

                if(loader){

                    loader.remove();

                }

            },500);


        },250);

    }


    /* =================================================
       NORMAL PAGE LOAD
    ================================================= */

    if(

        document.readyState ===
        "complete"

    ){

        hideDELoader();

    }

    else{

        window.addEventListener(

            "load",

            hideDELoader,

            {once:true}

        );

    }


    /* =================================================
       SAFETY FALLBACK

       Firebase / network problem hone par bhi
       loader permanently nahi rukega.
    ================================================= */

    setTimeout(function(){

        if(

            document.body.contains(
                loader
            )

        ){

            hideDELoader();

        }

    },5000);


})();

</script>
