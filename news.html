<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#0f2f63">

    <title>Diploma Engineers News & Notifications</title>

    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- =====================================================
         BOOTSTRAP CSS
         IMPORTANT: header.html uses Bootstrap classes
    ====================================================== -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- =====================================================
         OPTIONAL FONT
    ====================================================== -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>

        /* =====================================================
           RESET
        ====================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f9;
            color: #1a202c;
            min-height: 100vh;
            padding: 0;
            overflow-x: hidden;
        }


        /* =====================================================
           HEADER FETCH CONTAINER
           
           Header.html contains:
           Topbar = 28px
           Navbar = fixed
        ====================================================== */

        #header {
            display: block;
            width: 100%;
            min-height: 82px;
            position: relative;
            z-index: 10000;
        }


        /*
         * Header is fixed.
         * This spacer prevents News content from going
         * underneath the header.
         */
        #header-spacer {
            height: 84px;
            width: 100%;
        }


        /* =====================================================
           FORCE FETCHED HEADER TO WORK
        ====================================================== */

        #header .custom-navbar {
            width: 100%;
        }

        #header .custom-navbar .container {
            width: 100%;
        }

        #header .navbar-brand {
            text-decoration: none !important;
        }

        #header .nav-link {
            text-decoration: none !important;
        }

        #header .login-btn-btn {
            text-decoration: none !important;
        }

        #header .dropdown-menu-custom {
            z-index: 100000 !important;
        }

        #header img {
            max-width: 100%;
        }


        /* =====================================================
           MAIN NEWS WRAPPER
        ====================================================== */

        .news-page {
            width: calc(100% - 30px);
            max-width: 650px;
            margin: 0 auto 40px auto;

            background: #ffffff;

            border-radius: 20px;

            padding: 20px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.05);

            position: relative;
            z-index: 1;
        }


        /* =====================================================
           PAGE HEADER
        ====================================================== */

        .page-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .header-icon {
            width: 42px;
            height: 42px;

            flex: 0 0 42px;

            background: #eef2ff;
            color: #2563eb;

            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
        }

        .page-header h1 {
            font-size: 22px;
            font-weight: 800;

            color: #0f172a;

            line-height: 1.25;

            margin: 0;
        }


        /* =====================================================
           NEWS LIST
        ====================================================== */

        #newsList {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }


        /* =====================================================
           NEWS CARD
        ====================================================== */

        .news-card {
            background: #f8fafc;

            border-radius: 14px;

            border: 1px solid #e2e8f0;

            border-left: 5px solid #2563eb;

            padding: 16px;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

            position: relative;

            overflow: hidden;
        }

        .news-card:hover {
            box-shadow:
                0 6px 18px rgba(0, 0, 0, 0.05);

            transform: translateY(-1px);
        }


        /* =====================================================
           CATEGORY
        ====================================================== */

        .category {
            display: inline-block;

            background: #dbeafe;
            color: #1d4ed8;

            padding: 4px 10px;

            border-radius: 12px;

            font-size: 11px;
            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 0.5px;

            margin-bottom: 10px;
        }


        /* =====================================================
           TITLE
        ====================================================== */

        .news-title {
            font-size: 16px;

            font-weight: 700;

            color: #0f172a;

            line-height: 1.4;

            margin-bottom: 8px;

            display: flex;

            align-items: flex-start;

            gap: 8px;
        }

        .news-title i {
            color: #2563eb;

            font-size: 15px;

            margin-top: 4px;

            flex: 0 0 auto;
        }


        /* =====================================================
           DESCRIPTION
        ====================================================== */

        .news-description {
            font-size: 13px;

            line-height: 1.5;

            color: #64748b;

            margin-bottom: 12px;

            display: -webkit-box;

            -webkit-line-clamp: 2;

            -webkit-box-orient: vertical;

            overflow: hidden;
        }


        /* =====================================================
           CARD FOOTER
        ====================================================== */

        .card-footer {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            padding-top: 10px;

            border-top: 1px dashed #e2e8f0;

            font-size: 12px;

            background: transparent;

            border-radius: 0;
        }

        .news-date {
            color: #94a3b8;

            display: flex;

            align-items: center;

            gap: 5px;

            font-weight: 500;

            min-width: 0;
        }

        .news-date i {
            flex: 0 0 auto;
        }


        /* =====================================================
           ACTION LINKS
        ====================================================== */

        .action-links {
            display: flex;

            align-items: center;

            justify-content: flex-end;

            gap: 12px;

            flex-shrink: 0;
        }

        .action-btn {
            color: #2563eb;

            text-decoration: none;

            font-weight: 700;

            display: flex;

            align-items: center;

            gap: 4px;

            background: none;

            border: none;

            cursor: pointer;

            font-size: 12px;

            padding: 0;

            white-space: nowrap;
        }

        .action-btn:hover {
            color: #1d4ed8;

            text-decoration: underline;
        }


        /* =====================================================
           EXPANDABLE PANEL
        ====================================================== */

        .expandable-panel {
            max-height: 0;

            overflow: hidden;

            opacity: 0;

            transition:
                max-height 0.35s ease,
                opacity 0.25s ease;

            background: #ffffff;

            border-radius: 10px;

            margin-top: 0;

            padding: 0 12px;

            border: 0 solid #e2e8f0;
        }

        .expandable-panel.active {
            max-height: 700px;

            opacity: 1;

            margin-top: 12px;

            padding: 12px;

            border-width: 1px;
        }


        /* =====================================================
           THUMBNAIL
        ====================================================== */

        .card-thumbnail {
            width: 100%;

            max-height: 250px;

            object-fit: cover;

            border-radius: 8px;

            margin-bottom: 10px;

            display: block;
        }


        /* =====================================================
           FULL DESCRIPTION
        ====================================================== */

        .full-desc {
            font-size: 13px;

            color: #334155;

            line-height: 1.6;

            margin-bottom: 10px;

            white-space: pre-wrap;

            overflow-wrap: anywhere;
        }


        /* =====================================================
           SHARE GRID
        ====================================================== */

        .share-grid {
            display: flex;

            gap: 8px;

            margin-top: 10px;

            padding-top: 10px;

            border-top: 1px solid #f1f5f9;
        }

        .share-icon-btn {
            flex: 1;

            min-width: 0;

            height: 34px;

            border-radius: 6px;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #fff;

            text-decoration: none;

            border: none;

            cursor: pointer;

            font-size: 12px;

            gap: 6px;

            font-weight: 600;

            transition: opacity 0.2s ease;
        }

        .share-icon-btn:hover {
            opacity: 0.9;
        }

        .share-whatsapp {
            background: #25D366;
        }

        .share-telegram {
            background: #229ED9;
        }

        .share-copy {
            background: #64748b;
        }


        /* =====================================================
           LOADING / EMPTY / ERROR
        ====================================================== */

        .loading,
        .empty,
        .error-box {
            text-align: center;

            padding: 40px 20px;

            color: #64748b;
        }

        .loading i {
            font-size: 24px;

            color: #2563eb;

            margin-bottom: 8px;
        }

        .empty i {
            color: #94a3b8;
        }


        /* =====================================================
           FOOTER FETCH CONTAINER
        ====================================================== */

        #footer {
            display: block;

            width: 100%;

            clear: both;

            position: relative;

            z-index: 1;
        }


        /* =====================================================
           FETCH ERROR
        ====================================================== */

        .component-error {
            width: 100%;

            background: #fff7ed;

            color: #9a3412;

            text-align: center;

            padding: 10px;

            font-size: 12px;
        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 768px) {

            #header-spacer {
                height: 82px;
            }

            .news-page {
                width: calc(100% - 20px);

                padding: 15px;

                border-radius: 16px;

                margin-bottom: 25px;
            }

            .page-header {
                margin-bottom: 18px;
            }

            .header-icon {
                width: 40px;
                height: 40px;
                flex-basis: 40px;
            }

            .page-header h1 {
                font-size: 19px;
            }

            .news-card {
                padding: 14px;
            }

            .news-title {
                font-size: 15px;
            }

            .news-description {
                font-size: 12px;
            }

            .card-footer {
                align-items: flex-start;

                flex-direction: column;

                gap: 9px;
            }

            .action-links {
                width: 100%;

                justify-content: flex-end;
            }

            .share-grid {
                flex-wrap: wrap;
            }

            .share-icon-btn {
                min-width: calc(33.333% - 6px);
            }
        }


        /* =====================================================
           VERY SMALL DEVICES
        ====================================================== */

        @media (max-width: 420px) {

            .news-page {
                width: calc(100% - 10px);

                padding: 12px;
            }

            .page-header h1 {
                font-size: 18px;
            }

            .news-card {
                padding: 12px;
            }

            .action-links {
                gap: 10px;
            }

            .action-btn {
                font-size: 11px;
            }

            .share-grid {
                gap: 6px;
            }

            .share-icon-btn {
                font-size: 11px;

                gap: 4px;
            }
        }

    </style>
</head>


<body>

    <!-- =====================================================
         HEADER FETCH
    ====================================================== -->

    <div id="header"></div>

    <!-- FIXED HEADER SPACER -->
    <div id="header-spacer"></div>


    <!-- =====================================================
         NEWS PAGE

    <main class="news-page">

        <!-- PAGE HEADER -->

    <!-- =====================================================
         BOOTSTRAP JS
         IMPORTANT FOR HEADER MOBILE MENU + LOGIN DROPDOWN
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- =====================================================
         HEADER / FOOTER FETCH ENGINE
    ====================================================== -->

    <script>

        /*
         * =====================================================
         * DIPLOMA ENGINEERS COMPONENT LOADER
         * =====================================================
         *
         * Normal innerHTML does NOT execute scripts.
         *
         * Therefore:
         * 1. Fetch HTML
         * 2. Extract styles
         * 3. Insert HTML
         * 4. Re-create scripts
         *
         * This makes header.html and footer.html actually work.
         */

        async function fetchComponent(elementId, filePath) {

            const container = document.getElementById(elementId);

            if (!container) {
                return;
            }

            try {

                const response = await fetch(
                    filePath + "?v=" + Date.now(),
                    {
                        cache: "no-store"
                    }
                );

                if (!response.ok) {

                    throw new Error(
                        "Could not fetch " + filePath
                    );

                }

                const html = await response.text();

                /*
                 * Parse fetched HTML
                 */

                const parser = new DOMParser();

                const doc = parser.parseFromString(
                    html,
                    "text/html"
                );


                /*
                 * =================================================
                 * LOAD STYLES
                 * =================================================
                 */

                doc.querySelectorAll("style").forEach(style => {

                    const newStyle =
                        document.createElement("style");

                    newStyle.textContent =
                        style.textContent;

                    newStyle.setAttribute(
                        "data-fetched-component",
                        filePath
                    );

                    document.head.appendChild(
                        newStyle
                    );

                });


                /*
                 * =================================================
                 * LOAD EXTERNAL STYLESHEETS
                 * =================================================
                 */

                doc.querySelectorAll(
                    'link[rel="stylesheet"]'
                ).forEach(link => {

                    const href =
                        link.getAttribute("href");

                    if (!href) {
                        return;
                    }

                    /*
                     * Prevent duplicate FontAwesome /
                     * Bootstrap etc.
                     */

                    const alreadyLoaded =
                        Array.from(
                            document.querySelectorAll(
                                'link[rel="stylesheet"]'
                            )
                        ).some(existing =>
                            existing.href ===
                            new URL(
                                href,
                                window.location.href
                            ).href
                        );

                    if (!alreadyLoaded) {

                        const newLink =
                            document.createElement("link");

                        newLink.rel =
                            "stylesheet";

                        newLink.href =
                            new URL(
                                href,
                                window.location.href
                            ).href;

                        document.head.appendChild(
                            newLink
                        );

                    }

                });


                /*
                 * =================================================
                 * REMOVE HEAD CONTENT
                 * =================================================
                 */

                doc.querySelectorAll(
                    "html, head, title, meta, link, style"
                ).forEach(el => {

                    /*
                     * Already handled.
                     */

                });


                /*
                 * =================================================
                 * INSERT BODY CONTENT
                 * =================================================
                 */

                container.innerHTML =
                    doc.body.innerHTML;


                /*
                 * =================================================
                 * EXECUTE FETCHED SCRIPTS
                 * =================================================
                 */

                const scripts =
                    Array.from(
                        doc.querySelectorAll(
                            "script"
                        )
                    );

                for (const oldScript of scripts) {

                    const newScript =
                        document.createElement(
                            "script"
                        );

                    /*
                     * External script
                     */

                    if (oldScript.src) {

                        newScript.src =
                            new URL(
                                oldScript.src,
                                window.location.href
                            ).href;

                        newScript.async = false;

                    }

                    /*
                     * Inline script
                     */

                    if (oldScript.textContent) {

                        newScript.textContent =
                            oldScript.textContent;

                    }

                    document.body.appendChild(
                        newScript
                    );

                }


                /*
                 * =================================================
                 * HEADER HEIGHT FIX
                 * =================================================
                 */

                if (elementId === "header") {

                    /*
                     * Header has:
                     * topbar 28px
                     * navbar approximately 50px
                     */

                    document.getElementById(
                        "header-spacer"
                    ).style.height = "84px";

                }


                /*
                 * =================================================
                 * ACTIVE NAVIGATION FIX
                 * =================================================
                 */

                activateCurrentNavigation();


            } catch (error) {

                console.error(
                    "Diploma Engineers component error:",
                    error
                );

                container.innerHTML = `
                    <div class="component-error">
                        Component could not be loaded.
                    </div>
                `;

            }

        }


        /*
         * =====================================================
         * ACTIVE MENU
         * =====================================================
         */

        function activateCurrentNavigation() {

            const currentPage =
                location.pathname
                    .split("/")
                    .pop()
                    .toLowerCase() ||
                "index.html";


            document
                .querySelectorAll(
                    "#header .nav-link"
                )
                .forEach(link => {

                    const href =
                        (
                            link.getAttribute(
                                "href"
                            ) || ""
                        )
                        .split("/")
                        .pop()
                        .toLowerCase();


                    link.classList.remove(
                        "active"
                    );


                    if (
                        href &&
                        href === currentPage
                    ) {

                        link.classList.add(
                            "active"
                        );

                    }

                });

        }


        /*
         * =====================================================
         * LOAD HEADER + FOOTER
         * =====================================================
         */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                fetchComponent(
                    "header",
                    "header.html"
                );

                fetchComponent(
                    "footer",
                    "footer.html"
                );

            }
        );

    </script>


    <!-- =====================================================
         FIREBASE NEWS MODULE
    ====================================================== -->

    <script type="module">

        import {
            initializeApp
        }
        from
        "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


        import {
            getDatabase,
            ref,
            onValue
        }
        from
        "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";


        /* =====================================================
           FIREBASE CONFIG
        ====================================================== */

        const firebaseConfig = {

            apiKey:
                "AIzaSyAbg1Q1ZPgF7mwaxyin7iglla01eDk_tKo",

            authDomain:
                "diplomaengineers-869df.firebaseapp.com",

            databaseURL:
                "https://diplomaengineers-869df-default-rtdb.firebaseio.com",

            projectId:
                "diplomaengineers-869df",

            storageBucket:
                "diplomaengineers-869df.appspot.com",

            messagingSenderId:
                "356779436080",

            appId:
                "1:356779436080:web:4b28da380e547420d0e5f5"

        };


        const app =
            initializeApp(
                firebaseConfig
            );


        const db =
            getDatabase(app);


        const newsList =
            document.getElementById(
                "newsList"
            );


        /* =====================================================
           HTML ESCAPE
        ====================================================== */

        function escapeHTML(value) {

            return String(
                value ?? ""
            )

            .replaceAll(
                "&",
                "&amp;"
            )

            .replaceAll(
                "<",
                "&lt;"
            )

            .replaceAll(
                ">",
                "&gt;"
            )

            .replaceAll(
                '"',
                "&quot;"
            )

            .replaceAll(
                "'",
                "&#039;"
            );

        }


        /* =====================================================
           URL VALIDATION
        ====================================================== */

        function validURL(value) {

            try {

                const url =
                    new URL(value);

                return (
                    url.protocol ===
                        "http:" ||
                    url.protocol ===
                        "https:"
                );

            } catch {

                return false;

            }

        }


        /* =====================================================
           LOAD NEWS
        ====================================================== */

        function loadNews() {

            const newsRef =
                ref(
                    db,
                    "news"
                );


            onValue(

                newsRef,

                snapshot => {

                    newsList.innerHTML = "";


                    if (!snapshot.exists()) {

                        newsList.innerHTML = `

                            <div class="empty">

                                <i
                                    class="fa-regular fa-newspaper"
                                    style="font-size:32px;">
                                </i>

                                <p>
                                    कोई News या Update उपलब्ध नहीं है।
                                </p>

                            </div>

                        `;

                        return;

                    }


                    const newsArray = [];


                    snapshot.forEach(
                        child => {

                            newsArray.push({

                                id:
                                    child.key,

                                data:
                                    child.val() ||
                                    {}

                            });

                        }
                    );


                    /*
                     * Latest first
                     */

                    newsArray.reverse();


                    newsArray.forEach(
                        item => {

                            createNewsCard(
                                item.id,
                                item.data
                            );

                        }
                    );


                    /*
                     * Handle shared card
                     */

                    setTimeout(
                        scrollToSharedCard,
                        500
                    );

                },

                error => {

                    console.error(
                        "Firebase error:",
                        error
                    );


                    newsList.innerHTML = `

                        <div class="error-box">

                            <i
                                class="fa-solid fa-triangle-exclamation"
                                style="font-size:28px;margin-bottom:10px;">
                            </i>

                            <p>
                                Data Load करने में समस्या हुई।
                            </p>

                            <small>
                                कृपया कुछ समय बाद पुनः प्रयास करें।
                            </small>

                        </div>

                    `;

                }

            );

        }


        /* =====================================================
           CREATE NEWS CARD
        ====================================================== */

        function createNewsCard(
            id,
            n
        ) {

            const title =
                n.title ||
                "Untitled News";


            const description =
                n.text ||
                n.desc ||
                n.description ||
                "";


            const category =
                n.cat ||
                n.category ||
                "NOTIFICATION";


            const date =
                n.date ||
                "Recent";


            const image =
                n.thumb ||
                n.image ||
                n.thumbnail ||
                "";


            const externalLink =
                n.link ||
                n.pdf ||
                n.fileUrl ||
                "";


            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "news-card";


            card.id =
                `card-${id}`;


            /*
             * View News / Read More
             */

            let actionTarget;


            if (
                externalLink &&
                validURL(
                    externalLink
                )
            ) {

                actionTarget = `

                    <a
                        href="${escapeHTML(externalLink)}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="action-btn">

                        View News

                        <i
                            class="fa-solid fa-arrow-right">
                        </i>

                    </a>

                `;

            } else {

                actionTarget = `

                    <button
                        type="button"
                        class="action-btn"
                        onclick="toggleDetails('${escapeHTML(id)}')">

                        Read More

                        <i
                            class="fa-solid fa-chevron-down">
                        </i>

                    </button>

                `;

            }


            /*
             * Image
             */

            const imageHTML =
                image &&
                validURL(image)

                ?

                `

                    <img
                        src="${escapeHTML(image)}"
                        class="card-thumbnail"
                        alt="News thumbnail"
                        loading="lazy"
                        onerror="this.style.display='none';">

                `

                :

                "";


            card.innerHTML = `

                <!-- CATEGORY -->

                <span class="category">
                    ${escapeHTML(category)}
                </span>


                <!-- TITLE -->

                <h2 class="news-title">

                    <i
                        class="fa-solid fa-square-check">
                    </i>

                    <span>
                        ${escapeHTML(title)}
                    </span>

                </h2>


                <!-- SHORT DESCRIPTION -->

                <p class="news-description">

                    ${escapeHTML(description)}

                </p>


                <!-- FOOTER -->

                <div class="card-footer">

                    <div class="news-date">

                        <i
                            class="fa-regular fa-calendar">
                        </i>

                        <span>
                            ${escapeHTML(date)}
                        </span>

                    </div>


                    <div class="action-links">

                        <!-- SHARE -->

                        <button
                            type="button"
                            class="action-btn"
                            onclick="toggleDetails('${escapeHTML(id)}')">

                            <i
                                class="fa-solid fa-share-nodes">
                            </i>

                            Share

                        </button>


                        ${actionTarget}

                    </div>

                </div>


                <!-- EXPANDABLE PANEL -->

                <div
                    class="expandable-panel"
                    id="panel-${escapeHTML(id)}">

                    ${imageHTML}


                    <div class="full-desc">

                        ${escapeHTML(description)}

                    </div>


                    <div class="share-grid">

                        <!-- WHATSAPP -->

                        <button
                            type="button"
                            class="share-icon-btn share-whatsapp"
                            onclick="shareWhatsApp(
                                '${escapeHTML(title)}',
                                '${escapeHTML(id)}'
                            )">

                            <i
                                class="fa-brands fa-whatsapp">
                            </i>

                            WhatsApp

                        </button>


                        <!-- TELEGRAM -->

                        <button
                            type="button"
                            class="share-icon-btn share-telegram"
                            onclick="shareTelegram(
                                '${escapeHTML(title)}',
                                '${escapeHTML(id)}'
                            )">

                            <i
                                class="fa-brands fa-telegram">
                            </i>

                            Telegram

                        </button>


                        <!-- COPY -->

                        <button
                            type="button"
                            class="share-icon-btn share-copy"
                            onclick="copyLink(
                                '${escapeHTML(title)}',
                                '${escapeHTML(id)}'
                            )">

                            <i
                                class="fa-regular fa-copy">
                            </i>

                            Copy

                        </button>

                    </div>

                </div>

            `;


            newsList.appendChild(
                card
            );

        }


        /* =====================================================
           TOGGLE DETAILS
        ====================================================== */

        window.toggleDetails =
            function (id) {

                const panel =
                    document.getElementById(
                        `panel-${id}`
                    );


                if (!panel) {
                    return;
                }


                panel.classList.toggle(
                    "active"
                );

            };


        /* =====================================================
           CREATE SHARE URL
        ====================================================== */

        function getShareURL(id) {

            return (
                window.location.origin +
                window.location.pathname +
                "#card-" +
                encodeURIComponent(id)
            );

        }


        /* =====================================================
           WHATSAPP SHARE
        ====================================================== */

        window.shareWhatsApp =
            function (
                title,
                id
            ) {

                const url =
                    getShareURL(id);


                const text =
                    `${title}\n\nRead details:\n${url}`;


                window.open(

                    "https://wa.me/?text=" +
                    encodeURIComponent(text),

                    "_blank",
                    "noopener,noreferrer"

                );

            };


        /* =====================================================
           TELEGRAM SHARE
        ====================================================== */

        window.shareTelegram =
            function (
                title,
                id
            ) {

                const url =
                    getShareURL(id);


                const telegramURL =
                    "https://t.me/share/url" +
                    "?url=" +
                    encodeURIComponent(url) +
                    "&text=" +
                    encodeURIComponent(title);


                window.open(

                    telegramURL,

                    "_blank",
                    "noopener,noreferrer"

                );

            };


        /* =====================================================
           COPY LINK
        ====================================================== */

        window.copyLink =
            async function (
                title,
                id
            ) {

                const url =
                    getShareURL(id);


                const text =
                    `${title} - ${url}`;


                try {

                    await navigator.clipboard.writeText(
                        text
                    );


                    showCopyMessage(
                        "Link Copied!"
                    );


                } catch (error) {

                    const temp =
                        document.createElement(
                            "textarea"
                        );


                    temp.value =
                        text;


                    document.body.appendChild(
                        temp
                    );


                    temp.select();


                    document.execCommand(
                        "copy"
                    );


                    temp.remove();


                    showCopyMessage(
                        "Link Copied!"
                    );

                }

            };


        /* =====================================================
           COPY SUCCESS MESSAGE
        ====================================================== */

        function showCopyMessage(
            message
        ) {

            const old =
                document.getElementById(
                    "copyMessage"
                );


            if (old) {
                old.remove();
            }


            const box =
                document.createElement(
                    "div"
                );


            box.id =
                "copyMessage";


            box.textContent =
                message;


            box.style.cssText = `

                position:fixed;

                left:50%;

                bottom:30px;

                transform:translateX(-50%);

                background:#0f2f63;

                color:white;

                padding:10px 18px;

                border-radius:30px;

                font-size:13px;

                font-weight:600;

                z-index:999999;

                box-shadow:
                    0 8px 25px
                    rgba(0,0,0,.2);

            `;


            document.body.appendChild(
                box
            );


            setTimeout(
                () => {

                    box.remove();

                },
                1800
            );

        }


        /* =====================================================
           SHARED CARD SCROLL
        ====================================================== */

        function scrollToSharedCard() {

            const hash =
                window.location.hash;


            if (
                !hash ||
                !hash.startsWith(
                    "#card-"
                )
            ) {

                return;

            }


            const id =
                decodeURIComponent(
                    hash.substring(
                        6
                    )
                );


            const card =
                document.getElementById(
                    `card-${id}`
                );


            if (!card) {
                return;
            }


            setTimeout(
                () => {

                    card.scrollIntoView({

                        behavior:
                            "smooth",

                        block:
                            "center"

                    });


                    card.style.boxShadow =
                        "0 0 0 3px rgba(37,99,235,.25)";


                    setTimeout(
                        () => {

                            card.style.boxShadow =
                                "";

                        },
                        2500
                    );

                },
                100
            );

        }


        /* =====================================================
           START NEWS
        ====================================================== */

        loadNews();

    </script>


    <!-- =====================================================
         FINAL HEADER FIX
    ====================================================== -->

    <script>

        /*
         * Header scripts may execute before Bootstrap
         * becomes available. Re-run active navigation
         * after everything has loaded.
         */

        window.addEventListener(
            "load",
            function () {

                setTimeout(
                    function () {

                        if (
                            typeof activateCurrentNavigation ===
                            "function"
                        ) {

                            activateCurrentNavigation();

                        }

                    },
                    300
                );

            }
        );

    </script>

</body>

</html>
