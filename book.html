<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Books | Diploma Engineers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{
  --blue:#2563eb;
  --dark:#0f172a;
  --text:#334155;
  --muted:#64748b;
  --border:#e2e8f0;
  --bg:#f8fafc;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;
  min-height:0;
  background:transparent!important;
  font-family:"Plus Jakarta Sans",sans-serif;
  color:var(--text);
  overflow-x:hidden;
}
body.reader-open{overflow:hidden}
button,textarea{font:inherit}
button{cursor:pointer}

.books-wrap{
  width:100%;
  padding:0;
  margin:0;
}

.books-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin:0 0 10px;
}

.books-title{
  font-size:16px;
  font-weight:800;
  color:var(--dark);
}

.books-title span{color:var(--blue)}
.books-subtitle{
  font-size:9px;
  font-weight:700;
  color:var(--muted);
}

.books-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.book-card{
  min-width:0;
  overflow:hidden;
  background:#fff;
  border:1px solid var(--border);
  border-radius:15px;
  box-shadow:0 7px 22px rgba(15,23,42,.07);
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.book-cover{
  position:relative;
  width:100%;
  aspect-ratio:3/4;
  background:#eef2ff;
  overflow:hidden;
}
.book-thumb{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:#fff;
  pointer-events:none;
  object-fit:contain;
  padding:28px;
}
.book-shade{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(to top,rgba(2,6,23,.84),rgba(2,6,23,.03) 70%,transparent);
}
.book-label{
  position:absolute;
  left:8px;
  right:8px;
  bottom:8px;
  z-index:2;
  color:#fff;
  font-size:10px;
  font-weight:800;
  line-height:1.35;
  text-shadow:0 2px 8px rgba(0,0,0,.35);
}
.open-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  margin-top:5px;
  padding:4px 7px;
  border-radius:999px;
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.35);
  font-size:8px;
  font-weight:800;
}
.book-meta{
  padding:8px;
}
.book-meta-line{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:6px;
}
.book-type{
  font-size:8px;
  font-weight:700;
  color:var(--muted);
}
.read-pill{
  font-size:8px;
  font-weight:800;
  color:#1d4ed8;
  background:#eff6ff;
  border:1px solid #bfdbfe;
  border-radius:999px;
  padding:4px 6px;
}

/* Second screen inside this fetched file.
   NO HEADER / NO BACK BUTTON here. */
.reader-view{
  display:none;
  width:100%;
  padding:0;
  margin:0;
}
.reader-view.active{display:block}

.reader-book-title{
  font-size:16px;
  font-weight:800;
  color:var(--dark);
  margin:0 0 8px;
}
.reader-book-sub{
  font-size:10px;
  color:var(--muted);
  margin-bottom:10px;
}

.pdf-box{
  width:100%;
  height:calc(100vh - 145px);
  min-height:500px;
  background:#525252;
  border-radius:14px;
  overflow:hidden;
  border:1px solid #dbe2ea;
}
.pdf-frame{
  width:100%;
  height:100%;
  border:0;
  display:block;
  background:#fff;
}

.reader-actions{
  display:flex;
  gap:8px;
  margin-top:10px;
}
.action-btn{
  flex:1;
  height:40px;
  border:1px solid var(--border);
  border-radius:11px;
  background:#fff;
  color:var(--muted);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-size:10px;
  font-weight:800;
}
.action-btn.active.like{
  color:#2563eb;
  border-color:#bfdbfe;
  background:#eff6ff;
}
.action-btn.active.save{
  color:#16a34a;
  border-color:#bbf7d0;
  background:#f0fdf4;
}

.comment-box{
  margin-top:12px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  padding:11px;
}
.comment-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:9px;
}
.comment-head h3{
  font-size:12px;
  color:var(--dark);
}
.comment-count{
  font-size:8px;
  color:var(--muted);
  font-weight:700;
}
.comment-form{
  display:flex;
  align-items:flex-end;
  gap:7px;
}
.comment-avatar{
  width:32px;
  height:32px;
  flex:0 0 32px;
  border-radius:50%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--blue);
  background:#eff6ff;
  border:1px solid #dbeafe;
}
.comment-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.comment-input{
  flex:1;
  min-height:38px;
  max-height:100px;
  resize:vertical;
  border:1px solid var(--border);
  border-radius:10px;
  padding:9px;
  outline:none;
  background:#f8fafc;
  font-size:10px;
}
.comment-input:focus{
  background:#fff;
  border-color:#93c5fd;
}
.comment-submit{
  width:38px;
  height:38px;
  border:0;
  border-radius:10px;
  background:var(--blue);
  color:#fff;
}
.comment-submit:disabled{opacity:.55}

.comments{
  display:flex;
  flex-direction:column;
  gap:9px;
  margin-top:12px;
}
.comment{
  display:flex;
  gap:7px;
}
.comment-body{
  flex:1;
  min-width:0;
  background:#f8fafc;
  border:1px solid #eef2f7;
  border-radius:11px;
  padding:8px;
}
.comment-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  margin-bottom:3px;
}
.comment-name{
  font-size:9px;
  color:var(--dark);
  font-weight:800;
}
.comment-date{
  font-size:7px;
  color:#94a3b8;
}
.comment-text{
  font-size:9px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}
.empty-comments{
  padding:14px;
  text-align:center;
  color:var(--muted);
  font-size:9px;
}

.login-note{
  display:none;
  margin:10px 0 0;
  padding:9px;
  border-radius:10px;
  background:#eff6ff;
  border:1px solid #bfdbfe;
  color:#1e40af;
  font-size:9px;
  font-weight:700;
  line-height:1.5;
}

@media(max-width:900px){
  .pdf-box{
    height:calc(100vh - 220px);
    min-height:420px;
  }
}
@media(max-width:420px){
  .books-grid{gap:8px}
  .books-subtitle{font-size:8px}
  .pdf-box{height:calc(100vh - 230px);min-height:380px}
}
</style>
</head>

<body>

<!-- FIRST SCREEN: only thumbnails/cards -->
<div class="books-wrap" id="booksHome">

  <div class="books-head">
    <div class="books-title">Books <span>Library</span></div>
    <div class="books-subtitle">2 books per row</div>
  </div>

  <div class="books-grid" id="booksGrid"></div>
</div>


<!-- SECOND SCREEN: no header and no back button -->
<div class="reader-view" id="readerView">

  <div class="reader-book-title" id="readerBookTitle">Book</div>
  <div class="reader-book-sub">
    Diploma Engineers • Online Reader
  </div>

  <div class="pdf-box">
    <iframe
      id="pdfFrame"
      class="pdf-frame"
      title="PDF Reader"
      allow="fullscreen">
    </iframe>
  </div>

  <div class="reader-actions">
    <button class="action-btn like" id="likeBtn">
      <i class="fa-solid fa-thumbs-up"></i>
      <span>Like</span>
      <b id="likeCount">0</b>
    </button>

    <button class="action-btn save" id="saveBtn">
      <i class="fa-solid fa-bookmark"></i>
      <span>Save</span>
      <b id="saveCount">0</b>
    </button>
  </div>

  <div class="login-note" id="loginNote"></div>

  <div class="comment-box">

    <div class="comment-head">
      <h3>Comments</h3>
      <span class="comment-count" id="commentCount">0 comments</span>
    </div>

    <form class="comment-form" id="commentForm">

      <div class="comment-avatar" id="commentUserAvatar">
        <i class="fa-solid fa-user"></i>
      </div>

      <textarea
        class="comment-input"
        id="commentInput"
        maxlength="500"
        placeholder="Write a comment..."
      ></textarea>

      <button
        class="comment-submit"
        id="commentSubmit"
        type="submit">
        <i class="fa-solid fa-paper-plane"></i>
      </button>

    </form>

    <div class="comments" id="commentsList"></div>

  </div>

</div>
