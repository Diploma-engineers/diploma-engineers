<style>
/* ===== SMALL / COMPACT HEADER ===== */

#topbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:26px;
  background:linear-gradient(90deg,#0f172a,#1e293b);
  z-index:100000;
  display:flex;
  align-items:center;
  overflow:hidden;
}

.marquee-track{
  white-space:nowrap;
  animation:marquee 30s linear infinite;
  color:white;
  font-size:9px;
  font-weight:500;
}

.marquee-track span{
  color:#ff6500;
  font-weight:800;
}

@keyframes marquee{
  0%{transform:translateX(100%);}
  100%{transform:translateX(-100%);}
}

.navbar-glass{
  position:fixed;
  top:26px;
  left:0;
  width:100%;
  background:rgba(255,255,255,.90);
  backdrop-filter:blur(16px) saturate(180%);
  border-bottom:1px solid rgba(226,232,240,.8);
  box-shadow:0 5px 18px rgba(15,23,42,.04);
  z-index:9999;
  transition:.3s;
  padding:7px 0;
}

.navbar-glass.scrolled{
  padding:5px 0;
  background:rgba(255,255,255,.97);
  box-shadow:0 8px 25px rgba(15,23,42,.08);
}

.navbar-brand{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:800;
  font-size:16px;
}

.brand-logo{
  width:34px;
  height:34px;
  border-radius:9px;
  overflow:hidden;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
  border:1.5px solid white;
}

.brand-logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.brand-text-1{
  color:#0f172a;
}

.brand-text-2{
  color:#ff6500;
}

.nav-link-custom{
  color:#334155!important;
  padding:6px 9px!important;
  border-radius:9px;
  font-size:11.5px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:5px;
  transition:.2s;
}

.nav-link-custom:hover{
  background:#fff7ed;
  color:#ff6500!important;
  transform:translateY(-1px);
}

.nav-link-custom.active{
  background:#0f172a;
  color:white!important;
  box-shadow:0 5px 14px rgba(15,23,42,.15);
}

.login-btn{
  background:#ff6500;
  color:white!important;
  padding:7px 12px!important;
  border-radius:9px;
  font-weight:700;
  font-size:11.5px;
  box-shadow:0 5px 14px rgba(255,101,0,.22);
  border:none;
}

.dropdown-modern{
  background:white;
  border:1px solid #eef2f7;
  border-radius:12px;
  box-shadow:0 15px 35px rgba(15,23,42,.1);
  padding:6px;
  margin-top:8px;
}

.dropdown-modern .dropdown-item{
  border-radius:8px;
  padding:8px 11px;
  font-size:11.5px;
  font-weight:500;
  color:#334155;
  display:flex;
  align-items:center;
  gap:8px;
}

.dropdown-modern .dropdown-item:hover{
  background:#fff7ed;
  color:#ff6500;
}

.badge-new{
  background:#ef4444;
  color:white;
  font-size:7px;
  padding:2px 5px;
  border-radius:15px;
  font-weight:800;
  margin-left:2px;
}

.navbar-toggler{
  border:1px solid #eef2f7!important;
  border-radius:8px;
  padding:4px 7px;
}

/* Mobile */
@media(max-width:991px){

  .navbar-collapse{
    background:white;
    border-radius:14px;
    border:1px solid #eef2f7;
    padding:12px;
    margin-top:10px;
    box-shadow:0 15px 35px rgba(0,0,0,.07);
  }

  .nav-link-custom{
    font-size:12px;
    padding:8px 10px!important;
  }

  .login-btn{
    margin-top:4px;
  }
}
</style>
