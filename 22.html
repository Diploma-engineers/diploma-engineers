<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#059669"><title>Uploaded Notes | Diploma Engineers</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f8f7;color:#15251f;font-family:Poppins,Arial,sans-serif}.top{background:#fff;border-bottom:1px solid #e2eee8;padding:13px 18px;position:sticky;top:0;z-index:10}.topin{max-width:1120px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.brand i{width:40px;height:40px;display:grid;place-items:center;background:#dcfce7;color:#047857;border-radius:13px;font-size:19px}.brand small{display:block;color:#718078;font-size:10px;font-weight:500}.top a{color:#047857;text-decoration:none;font-size:12px;font-weight:800}.wrap{max-width:1120px;margin:auto;padding:22px 16px 70px}.hero{padding:25px;border-radius:24px;background:linear-gradient(130deg,#064e3b,#059669);color:#fff;box-shadow:0 15px 35px #05966924}.hero h1{margin:0 0 7px;font-size:clamp(23px,4vw,34px)}.hero p{margin:0;font-size:12px;opacity:.9}.filters{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;margin:16px 0}.filters input,.filters select{width:100%;padding:12px;border:1px solid #dce8e1;border-radius:12px;background:#fff;font:inherit;font-size:12px;outline:none}.count{font-size:11px;color:#718078;margin:5px 0 12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #e3ece7;border-radius:18px;padding:16px;box-shadow:0 8px 25px #163c2910;min-width:0}.file-icon{width:44px;height:44px;border-radius:14px;background:#ecfdf5;color:#059669;display:grid;place-items:center;font-size:20px}.card h3{font-size:15px;margin:12px 0 5px;line-height:1.4}.meta{font-size:10px;color:#718078;line-height:1.7}.card-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.card button{border:0;border-radius:10px;padding:9px 11px;font:700 10px Poppins;cursor:pointer;background:#ecfdf5;color:#047857}.card button.pdf{background:#059669;color:#fff}.empty{padding:40px 15px;text-align:center;background:#fff;border:1px dashed #cbd5d1;border-radius:18px;color:#718078;font-size:12px;grid-column:1/-1}.modal{display:none;position:fixed;inset:0;background:#0f172a99;z-index:50;padding:12px}.modal.show{display:flex}.modalbox{width:min(1100px,100%);height:100%;margin:auto;background:#fff;border-radius:17px;overflow:hidden;display:flex;flex-direction:column}.modalhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 15px;border-bottom:1px solid #e5e7eb}.modalhead b{font-size:13px}.modalhead button{border:0;background:#fee2e2;color:#b91c1c;border-radius:9px;padding:8px 11px;cursor:pointer}.modal iframe{border:0;flex:1;width:100%}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#10251c;color:#fff;padding:11px 15px;border-radius:12px;font-size:11px;display:none;z-index:100;max-width:90%;text-align:center}.toast.show{display:block}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.wrap{padding:13px 10px 60px}.hero{padding:19px;border-radius:20px}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.grid{grid-template-columns:1fr 1fr;gap:9px}.card{padding:12px;border-radius:15px}.card h3{font-size:12px}.card-actions button{flex:1;padding:9px 6px;font-size:9px}}@media(max-width:380px){.grid{grid-template-columns:1fr}}
</style>
</head><body>
<header class="top"><div class="topin"><div class="brand"><i class="fa-solid fa-file-code"></i><div>Diploma Engineers<small>STUDY NOTES LIBRARY</small></div></div><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></div></header>
<main class="wrap"><section class="hero"><h1><i class="fa-solid fa-book-open"></i> Uploaded HTML Notes</h1><p>Branch-wise, subject-wise and semester-wise notes. Open notes online or download as PDF.</p></section>
<div class="filters"><input id="search" placeholder="Search subject or notes title…"><select id="branch"><option value="">All Branches</option></select><select id="semester"><option value="">All Semesters</option><option value="1">1st Semester</option><option value="2">2nd Semester</option><option value="3">3rd Semester</option><option value="4">4th Semester</option><option value="5">5th Semester</option><option value="6">6th Semester</option></select></div><div class="count" id="count">Loading notes…</div><div class="grid" id="notesGrid"><div class="empty"><i class="fa-solid fa-spinner fa-spin"></i> Loading saved notes…</div></div></main>
<div class="modal" id="previewModal"><div class="modalbox"><div class="modalhead"><b id="previewTitle">Notes Preview</b><button id="closePreview"><i class="fa-solid fa-xmark"></i> Close</button></div><iframe id="previewFrame" title="Notes preview" sandbox="allow-same-origin"></iframe></div></div><div class="toast" id="toast"></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
import {getDatabase,ref,get} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';
const firebaseConfig={apiKey:'AIzaSyAbg1Q1ZPgF7mwaxyin7iglla01eDk_tKo',authDomain:'diplomaengineers-869df.firebaseapp.com',databaseURL:'https://diplomaengineers-869df-default-rtdb.firebaseio.com',projectId:'diplomaengineers-869df',storageBucket:'diplomaengineers-869df.appspot.com',messagingSenderId:'356779436080',appId:'1:356779436080:web:4b28da380e547420d0e5f5'};
const app=initializeApp(firebaseConfig),db=getDatabase(app);let allNotes=[];
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),3200)}
async function load(){try{const snap=await get(ref(db,'uploadedNotes'));allNotes=Object.entries(snap.val()||{}).map(([id,v])=>({...v,id})).filter(v=>v.html&&v.status!=='deleted').sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0));const branches=[...new Set(allNotes.map(n=>n.branch).filter(Boolean))].sort();$('branch').innerHTML='<option value="">All Branches</option>'+branches.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join('');render();}catch(e){console.error(e);$('notesGrid').innerHTML='<div class="empty">Unable to load notes. Firebase read permission may be missing. Please check the uploadedNotes database rules.</div>';$('count').textContent='Could not load notes';}}
function render(){const q=$('search').value.trim().toLowerCase(),br=$('branch').value,sem=$('semester').value;const rows=allNotes.filter(n=>(!br||n.branch===br)&&(!sem||String(n.semester)===sem)&&(!q||[n.title,n.subject,n.branch,n.originalFileName].join(' ').toLowerCase().includes(q)));$('count').textContent=`Showing ${rows.length} of ${allNotes.length} uploaded notes`;if(!rows.length){$('notesGrid').innerHTML='<div class="empty"><i class="fa-regular fa-folder-open" style="font-size:28px;display:block;margin-bottom:9px"></i>No notes found for this selection.</div>';return;}$('notesGrid').innerHTML=rows.map(n=>`<article class="card"><div class="file-icon"><i class="fa-brands fa-html5"></i></div><h3>${esc(n.title||'Untitled Notes')}</h3><div class="meta"><b>${esc(n.branch||'')}</b><br>${esc(n.subject||'')}<br>Semester ${esc(n.semester||'')} · ${esc(n.originalFileName||'HTML file')}</div><div class="card-actions"><button data-open="${esc(n.id)}"><i class="fa-regular fa-eye"></i> Open</button><button class="pdf" data-pdf="${esc(n.id)}"><i class="fa-solid fa-file-pdf"></i> PDF</button></div></article>`).join('');$('notesGrid').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openNotes(b.dataset.open));$('notesGrid').querySelectorAll('[data-pdf]').forEach(b=>b.onclick=async()=>{const n=allNotes.find(x=>x.id===b.dataset.pdf);const old=b.innerHTML;b.disabled=true;b.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i>';try{await makePDF(n);}catch(e){console.error(e);toast('PDF generation failed: '+e.message);}finally{b.disabled=false;b.innerHTML=old;}})}
function openNotes(id){const n=allNotes.find(x=>x.id===id);if(!n)return;$('previewTitle').textContent=n.title||'Notes Preview';const blob=new Blob([n.html],{type:'text/html'});$('previewFrame').src=URL.createObjectURL(blob);$('previewModal').classList.add('show')}
$('closePreview').onclick=()=>{$('previewModal').classList.remove('show');$('previewFrame').src='about:blank'};$('previewModal').onclick=e=>{if(e.target===$('previewModal'))$('closePreview').click()};['search','branch','semester'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));
async function makePDF(n){if(!n?.html)throw new Error('HTML content missing');if(!window.html2canvas||!window.jspdf?.jsPDF)throw new Error('PDF libraries did not load. Check internet.');const frame=document.createElement('iframe');frame.style.cssText='position:fixed;left:-10000px;top:0;width:900px;height:1200px;border:0;visibility:hidden';document.body.appendChild(frame);try{const d=frame.contentDocument;d.open();d.write(n.html);d.close();await new Promise(r=>setTimeout(r,1800));const canvas=await html2canvas(d.body,{scale:1.7,useCORS:true,backgroundColor:'#fff',windowWidth:900,logging:false});const {jsPDF}=window.jspdf,pdf=new jsPDF('p','mm','a4'),W=210,H=297,m=10,usableW=W-2*m,usableH=H-2*m,sourcePage=canvas.width*usableH/usableW,count=Math.ceil(canvas.height/sourcePage);for(let i=0;i<count;i++){if(i)pdf.addPage();const part=document.createElement('canvas');part.width=canvas.width;part.height=Math.min(sourcePage,canvas.height-i*sourcePage);part.getContext('2d').drawImage(canvas,0,i*sourcePage,canvas.width,part.height,0,0,part.width,part.height);pdf.addImage(part.toDataURL('image/jpeg',.94),'JPEG',m,m,usableW,part.height*usableW/part.width,undefined,'FAST');pdf.setDrawColor(190,205,225);pdf.setLineWidth(.35);pdf.rect(5,5,200,287);pdf.setFontSize(8);pdf.setTextColor(120);pdf.text('Notes by diploma_engineers7',105,291,{align:'center'});}const safe=(n.title||'Notes').replace(/[^a-z0-9-_]+/gi,'_');pdf.save(`${safe}_Notes_by_diploma_engineers7.pdf`);}finally{frame.remove()}}
load();
</script></body></html>
