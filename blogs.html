<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blogs | Diploma Engineers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
html, body {
  margin:0 !important;
  padding:0 !important;
  font-family:'Poppins',sans-serif;
  background:#f7f9fc;
  color:#172033;
}
#header, #footer, main, .blogs-page, .blogs-container { margin:0 !important; padding-top:0 !important; }
.blogs-page { min-height:60vh; padding-bottom:60px !important; }
.blogs-hero {
  margin:0;
  padding:42px 16px 34px;
  background:linear-gradient(135deg,#0f172a,#1e3a5f);
  color:#fff;
}
.blogs-hero .container { max-width:1180px; }
.blogs-hero h1 { font-size:clamp(28px,4vw,44px); font-weight:800; margin:0 0 8px; }
.blogs-hero p { margin:0; color:#dbe5f2; font-size:14px; }
.blog-tools { max-width:1180px; margin:24px auto 0; padding:0 16px; }
.tool-box { background:#fff; border:1px solid #e8edf4; border-radius:16px; padding:14px; box-shadow:0 8px 25px rgba(15,23,42,.06); }
.blog-card {
  height:100%; background:#fff; border:1px solid #e8edf4; border-radius:18px; overflow:hidden;
  box-shadow:0 8px 24px rgba(15,23,42,.06); transition:.25s ease;
}
.blog-card:hover { transform:translateY(-4px); box-shadow:0 15px 32px rgba(15,23,42,.10); }
.blog-img { width:100%; height:210px; object-fit:cover; background:#e9eef5; display:block; }
.blog-body { padding:20px; }
.blog-category { display:inline-block; font-size:10px; font-weight:700; color:#ff6500; background:#fff1e8; border-radius:20px; padding:5px 9px; margin-bottom:10px; }
.blog-title { font-size:18px; line-height:1.45; font-weight:700; margin:0 0 10px; color:#172033; }
.blog-meta { font-size:11px; color:#7b8798; margin-bottom:12px; }
.blog-excerpt { font-size:12.5px; color:#5d6878; line-height:1.75; margin:0 0 17px; }
.read-btn { display:inline-flex; align-items:center; gap:7px; border:0; border-radius:9px; padding:9px 13px; background:#ff6500; color:#fff; text-decoration:none; font-size:12px; font-weight:700; }
.read-btn:hover { background:#ea580c; color:#fff; }
.empty-state { text-align:center; padding:55px 20px; color:#64748b; }
@media(max-width:767px){
  .blogs-hero { padding:30px 14px 25px; }
  .blogs-tools { padding:0 12px; }
  .blog-img { height:190px; }
  .blog-body { padding:17px; }
  .blog-title { font-size:16px; }
}
</style>
</head>
<body>

<div id="header"></div>

<main class="blogs-page">
  <section class="blogs-hero">
    <div class="container">
      <h1><i class="fa-solid fa-pen-nib me-2"></i>Blogs</h1>
      <p>Latest updates, guidance, study tips and useful information for Diploma Engineers.</p>
    </div>
  </section>

  <div class="blogs-tools">
    <div class="tool-box">
      <div class="row g-2">
        <div class="col-md-7">
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass"></i></span>
            <input id="searchInput" class="form-control" type="search" placeholder="Search blogs...">
          </div>
        </div>
        <div class="col-md-5">
          <select id="categoryFilter" class="form-select">
            <option value="all">All Categories</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <section class="blogs-container container py-4">
    <div id="status" class="text-center py-4 text-secondary">
      <div class="spinner-border spinner-border-sm me-2"></div>Loading blogs...
    </div>
    <div id="blogGrid" class="row g-4"></div>
  </section>
</main>

<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAbg1Q1ZPgF7mwaxyin7iglla01eDk_tKo",
  authDomain: "diplomaengineers-869df.firebaseapp.com",
  databaseURL: "https://diplomaengineers-869df-default-rtdb.firebaseio.com",
  projectId: "diplomaengineers-869df",
  storageBucket: "diplomaengineers-869df.appspot.com",
  messagingSenderId: "356779436080",
  appId: "1:356779436080:web:4b28da380e547420d0e5f5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

async function loadPart(id, file) {
  try {
    const res = await fetch(file);
    if (!res.ok) throw new Error(file + " failed");
    document.getElementById(id).innerHTML = await res.text();

    if (id === "header") {
      document.querySelectorAll(".navbar-toggler").forEach(btn => {
        btn.addEventListener("click", () => {});
      });
    }
  } catch (err) {
    console.error("Failed to load", file, err);
  }
}

loadPart("header", "header.html");
loadPart("footer", "footer.html");

const grid = document.getElementById("blogGrid");
const status = document.getElementById("status");
const searchInput = document.getElementById("searchInput");
const categoryFilter = document.getElementById("categoryFilter");

let blogs = [];

function getValue(obj, keys) {
  for (const key of keys) {
    if (obj && obj[key] !== undefined && obj[key] !== null && String(obj[key]).trim() !== "") return obj[key];
  }
  return "";
}

function formatDate(value) {
  if (!value) return "";
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return String(value);
  return d.toLocaleDateString("en-IN", {day:"numeric", month:"short", year:"numeric"});
}

function cleanText(value) {
  const div = document.createElement("div");
  div.innerHTML = value || "";
  return (div.textContent || div.innerText || "").replace(/\s+/g," ").trim();
}

function renderCategories() {
  const cats = [...new Set(blogs.map(b => getValue(b.data, ["category","cat"])).filter(Boolean))].sort();
  categoryFilter.innerHTML = '<option value="all">All Categories</option>' +
    cats.map(c => `<option value="${String(c).replaceAll('"','&quot;')}">${c}</option>`).join("");
}

function render() {
  const q = searchInput.value.trim().toLowerCase();
  const cat = categoryFilter.value;
  const filtered = blogs.filter(item => {
    const b = item.data;
    const title = String(getValue(b,["title"]));
    const desc = String(getValue(b,["desc","text","html"]));
    const category = String(getValue(b,["category","cat"]));
    return (!q || (title+" "+desc+" "+category).toLowerCase().includes(q)) &&
           (cat === "all" || category === cat);
  });

  grid.innerHTML = "";

  if (!filtered.length) {
    status.style.display = "block";
    status.innerHTML = '<div class="empty-state"><i class="fa-regular fa-folder-open fa-2x mb-3"></i><br>No blogs found.</div>';
    return;
  }

  status.style.display = "none";

  filtered.forEach(item => {
    const b = item.data;
    const title = getValue(b,["title"]) || "Untitled Blog";
    const image = getValue(b,["image","thumb"]);
    const category = getValue(b,["category","cat"]);
    const author = getValue(b,["authorName","ownerName"]) || "Diploma Engineers";
    const designation = getValue(b,["designation","ownerDesignation"]);
    const date = formatDate(getValue(b,["date","timestamp"]));
    const excerpt = getValue(b,["desc","text"]) || cleanText(getValue(b,["html"]));
    const safeExcerpt = String(excerpt).slice(0,180) + (String(excerpt).length > 180 ? "..." : "");

    const col = document.createElement("div");
    col.className = "col-12 col-md-6";
    col.innerHTML = `
      <article class="blog-card">
        ${image ? `<img class="blog-img" src="${image}" alt="${title.replaceAll('"','&quot;')}" loading="lazy">` : '<div class="blog-img d-flex align-items-center justify-content-center text-secondary"><i class="fa-regular fa-image fa-2x"></i></div>'}
        <div class="blog-body">
          ${category ? `<span class="blog-category">${category}</span>` : ""}
          <h2 class="blog-title">${title}</h2>
          <div class="blog-meta">
            <i class="fa-regular fa-user me-1"></i>${author}
            ${designation ? ` · ${designation}` : ""}
            ${date ? ` · ${date}` : ""}
          </div>
          <p class="blog-excerpt">${safeExcerpt}</p>
          <a class="read-btn" href="blog-detail.html?id=${encodeURIComponent(item.id)}">
            Read Article <i class="fa-solid fa-arrow-right"></i>
          </a>
        </div>
      </article>`;
    grid.appendChild(col);
  });
}

onValue(ref(db, "blogs"), snapshot => {
  blogs = [];
  const data = snapshot.val() || {};
  Object.entries(data).forEach(([id, value]) => {
    if (value && typeof value === "object") blogs.push({id, data:value});
  });
  blogs.sort((a,b) => Number(getValue(b.data,["timestamp"])) - Number(getValue(a.data,["timestamp"])));
  renderCategories();
  render();
}, error => {
  console.error(error);
  status.innerHTML = '<div class="alert alert-danger">Unable to load blogs right now.</div>';
});

searchInput.addEventListener("input", render);
categoryFilter.addEventListener("change", render);
</script>
</body>
</html>
