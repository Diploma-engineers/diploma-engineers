<style>
:root{
    --orange:#ff6b00;
    --orange2:#ff944d;
    --dark:#171717;
    --text:#202020;
    --muted:#777;
    --bg:#f5f6f8;
    --card:#fff;
    --border:#e7e7e7;
    --shadow:0 12px 35px rgba(0,0,0,.08);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,input,textarea,select{
    font:inherit;
}

.header{
    height:70px;
    background:#fff;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    position:sticky;
    top:0;
    z-index:20;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brandLogo{
    width:42px;
    height:42px;
    border-radius:12px;
    background:linear-gradient(135deg,var(--orange),var(--orange2));
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-weight:800;
    font-size:20px;
}

.brand h1{
    font-family:Poppins;
    font-size:18px;
}

.brand small{
    display:block;
    color:#888;
    font-size:10px;
    margin-top:1px;
}

.aiBadge{
    background:#fff1e8;
    color:#e95c00;
    border:1px solid #ffd5bb;
    border-radius:30px;
    padding:8px 13px;
    font-size:12px;
    font-weight:700;
}

.container{
    width:min(1400px,94%);
    margin:25px auto;
}

.layout{
    display:grid;
    grid-template-columns:420px 1fr;
    gap:24px;
    align-items:start;
}

.panel{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:var(--shadow);
}

.controls{
    padding:22px;
}

.panelTitle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.panelTitle h2{
    font-family:Poppins;
    font-size:20px;
}

.panelTitle span{
    font-size:11px;
    color:#999;
}

.formGroup{
    margin-bottom:16px;
}

label{
    display:block;
    font-size:12px;
    font-weight:700;
    margin-bottom:7px;
    color:#555;
}

input,textarea,select{
    width:100%;
    border:1px solid #ddd;
    background:#fafafa;
    border-radius:11px;
    padding:12px 13px;
    outline:none;
    transition:.2s;
}

input:focus,textarea:focus,select:focus{
    border-color:var(--orange);
    background:#fff;
    box-shadow:0 0 0 3px rgba(255,107,0,.08);
}

textarea{
    min-height:125px;
    resize:vertical;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.btn{
    border:0;
    border-radius:11px;
    padding:12px 15px;
    cursor:pointer;
    font-weight:700;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
}

.btnPrimary{
    background:linear-gradient(135deg,var(--orange),#ff7e25);
    color:#fff;
    box-shadow:0 8px 20px rgba(255,107,0,.2);
}

.btnDark{
    background:#1d1d1d;
    color:#fff;
}

.btnLight{
    background:#f3f3f3;
    color:#333;
}

.full{
    width:100%;
}

.templateGrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.template{
    height:55px;
    border:2px solid #eee;
    border-radius:10px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
}

.template.active{
    border-color:var(--orange);
}

.template:nth-child(1){
    background:linear-gradient(135deg,#ff6b00,#ffb16e);
}
.template:nth-child(2){
    background:linear-gradient(135deg,#101010,#454545);
}
.template:nth-child(3){
    background:linear-gradient(135deg,#fff,#e7e7e7);
}
.template:nth-child(4){
    background:linear-gradient(135deg,#182848,#4b6cb7);
}
.template:nth-child(5){
    background:linear-gradient(135deg,#141e30,#243b55);
}
.template:nth-child(6){
    background:linear-gradient(135deg,#fff,#ffeadc);
}

.template span{
    position:absolute;
    left:8px;
    bottom:7px;
    color:#fff;
    font-size:9px;
    font-weight:800;
}

.template:nth-child(3) span,
.template:nth-child(6) span{
    color:#222;
}

.logoPreview{
    display:flex;
    align-items:center;
    gap:10px;
}

.logoPreview img{
    width:48px;
    height:48px;
    object-fit:contain;
    border:1px solid #ddd;
    border-radius:10px;
    background:#fff;
}

.logoPreview input{
    flex:1;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:18px;
}

.previewPanel{
    padding:20px;
    min-height:700px;
}

.previewHead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.previewHead h2{
    font-family:Poppins;
    font-size:19px;
}

.sizeInfo{
    color:#888;
    font-size:11px;
}

.canvasWrap{
    background:#e9eaec;
    border-radius:18px;
    min-height:630px;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
    overflow:auto;
}

canvas{
    width:min(100%,650px);
    height:auto;
    display:block;
    box-shadow:0 15px 45px rgba(0,0,0,.18);
}

.status{
    margin-top:12px;
    font-size:11px;
    color:#888;
    text-align:center;
}

.hidden{
    display:none!important;
}

@media(max-width:950px){
    .layout{
        grid-template-columns:1fr;
    }

    .controls{
        order:1;
    }

    .previewPanel{
        order:2;
    }

    .canvasWrap{
        min-height:auto;
    }
}

@media(max-width:520px){
    .header{
        padding:0 13px;
    }

    .brand h1{
        font-size:15px;
    }

    .container{
        width:96%;
        margin:14px auto;
    }

    .controls,.previewPanel{
        padding:15px;
        border-radius:16px;
    }

    .row{
        grid-template-columns:1fr;
    }

    .templateGrid{
        grid-template-columns:repeat(3,1fr);
    }

    .canvasWrap{
        padding:10px;
        border-radius:13px;
    }
}
</style>
</head>

<script>

const canvas = document.getElementById("newsCanvas");
const ctx = canvas.getContext("2d");

let selectedTemplate = 1;

let loadedNewsImage = null;
let loadedLogo = null;


/* DEFAULT DATE */
document.getElementById("date").value =
    new Date().toISOString().split("T")[0];


/* TEMPLATE SELECT */

document.querySelectorAll(".template").forEach(t => {

    t.addEventListener("click", () => {

        document.querySelectorAll(".template")
        .forEach(x => x.classList.remove("active"));

        t.classList.add("active");

        selectedTemplate = Number(
            t.dataset.template
        );

        generateNews();

    });

});


/* LOGO PREVIEW */

document.getElementById("logoUrl")
.addEventListener("input", function(){

    const url = this.value.trim();

    if(url){

        document.getElementById("logoPreview").src = url;

        loadImage(url).then(img => {
            loadedLogo = img;
            generateNews();
        }).catch(()=>{});

    }

});


/* AUTO GENERATE WHEN TYPING */

let typingTimer;

document.getElementById("newsInput")
.addEventListener("input", () => {

    clearTimeout(typingTimer);

    typingTimer = setTimeout(() => {

        if(document.getElementById("newsInput").value.trim()){
            generateNews();
        }

    },500);

});


/* SMART HEADLINE */

function createHeadline(text){

    text = text
    .replace(/\n/g," ")
    .replace(/\s+/g," ")
    .trim();

    if(!text) return "LATEST NEWS UPDATE";

    let sentences = text
        .split(/[.!?।]/)
        .map(x => x.trim())
        .filter(Boolean);

    let first = sentences[0] || text;

    if(first.length > 85){
        first = first.substring(0,85);

        const lastSpace = first.lastIndexOf(" ");

        if(lastSpace > 30){
            first = first.substring(0,lastSpace);
        }

        first += "…";
    }

    return first;
}


/* SHORT DESCRIPTION */

function createSummary(text){

    text = text
    .replace(/\n/g," ")
    .replace(/\s+/g," ")
    .trim();

    if(text.length <= 210){
        return text;
    }

    let result = text.substring(0,210);

    const lastSpace = result.lastIndexOf(" ");

    if(lastSpace > 100){
        result = result.substring(0,lastSpace);
    }

    return result + "…";
}


/* LOAD IMAGE */

function loadImage(url){

    return new Promise((resolve,reject)=>{

        const img = new Image();

        img.crossOrigin = "anonymous";

        img.onload = () => resolve(img);

        img.onerror = reject;

        img.src = url;

    });

}


/* WRAP TEXT */

function wrapText(text,maxWidth,font){

    ctx.font = font;

    const words = text.split(" ");

    const lines = [];

    let line = "";

    words.forEach(word => {

        const test = line
            ? line + " " + word
            : word;

        if(ctx.measureText(test).width > maxWidth){

            if(line){
                lines.push(line);
            }

            line = word;

        }else{

            line = test;

        }

    });

    if(line){
        lines.push(line);
    }

    return lines;

}


/* ROUNDED RECT */

function roundRect(x,y,w,h,r){

    ctx.beginPath();

    ctx.moveTo(x+r,y);

    ctx.arcTo(x+w,y,x+w,y+h,r);

    ctx.arcTo(x+w,y+h,x,y+h,r);

    ctx.arcTo(x,y+h,x,y,r);

    ctx.arcTo(x,y,x+w,y,r);

    ctx.closePath();

}


/* DRAW IMAGE COVER */

function drawCover(img,x,y,w,h){

    const ratio = Math.max(
        w/img.width,
        h/img.height
    );

    const nw = img.width * ratio;
    const nh = img.height * ratio;

    const nx = x + (w-nw)/2;
    const ny = y + (h-nh)/2;

    ctx.drawImage(
        img,
        nx,ny,nw,nh
    );

}


/* BACKGROUND */

function drawBackground(){

    const g = ctx.createLinearGradient(
        0,0,1080,1080
    );

    if(selectedTemplate === 1){

        g.addColorStop(0,"#ff5a00");
        g.addColorStop(1,"#ffb067");

    }

    else if(selectedTemplate === 2){

        g.addColorStop(0,"#090909");
        g.addColorStop(1,"#303030");

    }

    else if(selectedTemplate === 3){

        g.addColorStop(0,"#ffffff");
        g.addColorStop(1,"#eeeeee");

    }

    else if(selectedTemplate === 4){

        g.addColorStop(0,"#14213d");
        g.addColorStop(1,"#4361ee");

    }

    else if(selectedTemplate === 5){

        g.addColorStop(0,"#111827");
        g.addColorStop(1,"#374151");

    }

    else{

        g.addColorStop(0,"#fff7f1");
        g.addColorStop(1,"#ffd9bf");

    }

    ctx.fillStyle = g;

    ctx.fillRect(0,0,1080,1080);

}


/* GENERATE */

async function generateNews(){

    const news =
        document.getElementById("newsInput")
        .value.trim();

    if(!news){

        drawEmpty();

        return;

    }


    const category =
        document.getElementById("category")
        .value;

    const customHeadline =
        document.getElementById("headline")
        .value.trim();

    const headline =
        customHeadline ||
        createHeadline(news);

    const summary =
        createSummary(news);


    /* IMAGE */

    const imageUrl =
        document.getElementById("imageUrl")
        .value.trim();

    if(imageUrl){

        try{

            loadedNewsImage =
                await loadImage(imageUrl);

        }catch(e){

            loadedNewsImage = null;

        }

    }else{

        loadedNewsImage = null;

    }


    drawNews(
        headline,
        summary,
        category
    );

}


/* DRAW NEWS */

function drawNews(
    headline,
    summary,
    category
){

    drawBackground();


    const dark =
        selectedTemplate === 3 ||
        selectedTemplate === 6;

    const mainColor =
        dark ? "#171717" : "#ffffff";

    const secondary =
        dark ? "#555555" : "rgba(255,255,255,.8)";


    /* decorative circles */

    ctx.globalAlpha=.12;

    ctx.fillStyle="#fff";

    ctx.beginPath();
    ctx.arc(980,90,180,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(70,1050,220,0,Math.PI*2);
    ctx.fill();

    ctx.globalAlpha=1;


    /* TOP BRAND */

    ctx.fillStyle =
        selectedTemplate === 1 ||
        selectedTemplate === 4
        ? "#fff"
        : mainColor;

    ctx.font =
        "800 30px Inter";

    ctx.fillText(
        "DIPLOMA ENGINEERS",
        70,
        75
    );


    /* CATEGORY */

    const catWidth =
        ctx.measureText(category).width + 42;

    roundRect(
        70,
        105,
        catWidth,
        44,
        22
    );

    ctx.fillStyle =
        dark
        ? "#ff6b00"
        : "rgba(255,255,255,.18)";

    ctx.fill();

    ctx.fillStyle="#fff";

    if(dark){
        ctx.fillStyle="#fff";
    }

    ctx.font =
        "700 18px Inter";

    ctx.fillText(
        category.toUpperCase(),
        91,
        134
    );


    /* IMAGE CARD */

    const imageX = 70;
    const imageY = 180;
    const imageW = 940;
    const imageH = 350;


    if(loadedNewsImage){

        ctx.save();

        roundRect(
            imageX,
            imageY,
            imageW,
            imageH,
            30
        );

        ctx.clip();

        drawCover(
            loadedNewsImage,
            imageX,
            imageY,
            imageW,
            imageH
        );

        ctx.restore();


        /* image overlay */

        const overlay =
            ctx.createLinearGradient(
                0,imageY+150,
                0,imageY+imageH
            );

        overlay.addColorStop(
            0,
            "rgba(0,0,0,0)"
        );

        overlay.addColorStop(
            1,
            "rgba(0,0,0,.35)"
        );

        ctx.fillStyle=overlay;

        ctx.fillRect(
            imageX,
            imageY,
            imageW,
            imageH
        );

    }

    else{

        ctx.save();

        roundRect(
            imageX,
            imageY,
            imageW,
            imageH,
            30
        );

        ctx.fillStyle =
            dark
            ? "#dedede"
            : "rgba(255,255,255,.15)";

        ctx.fill();

        ctx.restore();


        ctx.fillStyle =
            dark ? "#777" : "rgba(255,255,255,.7)";

        ctx.font="700 24px Inter";

        ctx.textAlign="center";

        ctx.fillText(
            "NEWS UPDATE",
            540,
            360
        );

        ctx.textAlign="left";

    }


    /* HEADLINE */

    ctx.fillStyle=mainColor;

    ctx.font =
        "800 52px Poppins";

    let headlineLines =
        wrapText(
            headline,
            930,
            "800 52px Poppins"
        );

    if(headlineLines.length > 3){
        headlineLines =
            headlineLines.slice(0,3);

        headlineLines[2] += "…";
    }


    let hy = 610;

    headlineLines.forEach(line => {

        ctx.fillText(
            line,
            70,
            hy
        );

        hy += 64;

    });


    /* SUMMARY */

    ctx.fillStyle=secondary;

    ctx.font =
        "500 25px Inter";

    let summaryLines =
        wrapText(
            summary,
            900,
            "500 25px Inter"
        );

    if(summaryLines.length > 3){
        summaryLines =
            summaryLines.slice(0,3);

        summaryLines[2] += "…";
    }


    let sy =
        hy + 20;

    summaryLines.forEach(line => {

        ctx.fillText(
            line,
            70,
            sy
        );

        sy += 37;

    });


    /* FOOTER */

    ctx.fillStyle =
        dark ? "#777" : "rgba(255,255,255,.75)";

    ctx.font =
        "600 19px Inter";

    const dateValue =
        document.getElementById("date").value;

    let dateText = dateValue;

    if(dateValue){

        const d =
            new Date(dateValue + "T00:00:00");

        dateText =

                "en-IN",

                    day:"2-digit",

                    year:"numeric"
                }
            );

.template:nth-child(3){

.template:nth-child(4){

<script>

const canvas = document.getElementById("newsCanvas");
const ctx = canvas.getContext("2d");

let selectedTemplate = 1;

let loadedNewsImage = null;
let loadedLogo = null;


/* DEFAULT DATE */
document.getElementById("date").value =
    new Date().toISOString().split("T")[0];


/* TEMPLATE SELECT */

document.querySelectorAll(".template").forEach(t => {

    t.addEventListener("click", () => {

        document.querySelectorAll(".template")
        .forEach(x => x.classList.remove("active"));

        t.classList.add("active");

        selectedTemplate = Number(
            t.dataset.template
        );

        generateNews();

    });

});


/* LOGO PREVIEW */

document.getElementById("logoUrl")
.addEventListener("input", function(){

    const url = this.value.trim();

    if(url){

        document.getElementById("logoPreview").src = url;

        loadImage(url).then(img => {
            loadedLogo = img;
            generateNews();
        }).catch(()=>{});

    }

});


/* AUTO GENERATE WHEN TYPING */

let typingTimer;

document.getElementById("newsInput")
.addEventListener("input", () => {

    clearTimeout(typingTimer);

    typingTimer = setTimeout(() => {

        if(document.getElementById("newsInput").value.trim()){
            generateNews();
        }

    },500);

});


/* SMART HEADLINE */

function createHeadline(text){

    text = text
    .replace(/\n/g," ")
    .replace(/\s+/g," ")
    .trim();

    if(!text) return "LATEST NEWS UPDATE";

    let sentences = text
        .split(/[.!?।]/)
        .map(x => x.trim())
        .filter(Boolean);

    let first = sentences[0] || text;

    if(first.length > 85){
        first = first.substring(0,85);

        const lastSpace = first.lastIndexOf(" ");

        if(lastSpace > 30){
            first = first.substring(0,lastSpace);
        }

        first += "…";
    }

    return first;
}


/* SHORT DESCRIPTION */

function createSummary(text){

    text = text
    .replace(/\n/g," ")
    .replace(/\s+/g," ")
    .trim();

    if(text.length <= 210){
        return text;
    }

    let result = text.substring(0,210);

    const lastSpace = result.lastIndexOf(" ");

    if(lastSpace > 100){
        result = result.substring(0,lastSpace);
    }

    return result + "…";
}


/* LOAD IMAGE */

function loadImage(url){

    return new Promise((resolve,reject)=>{

        const img = new Image();

        img.crossOrigin = "anonymous";

        img.onload = () => resolve(img);

        img.onerror = reject;

        img.src = url;

    });

}


/* WRAP TEXT */

function wrapText(text,maxWidth,font){

    ctx.font = font;

    const words = text.split(" ");

    const lines = [];

    let line = "";

    words.forEach(word => {

        const test = line
            ? line + " " + word
            : word;

        if(ctx.measureText(test).width > maxWidth){

            if(line){
                lines.push(line);
            }

            line = word;

        }else{

            line = test;

        }

    });

    if(line){
        lines.push(line);
    }

    return lines;

}


/* ROUNDED RECT */

function roundRect(x,y,w,h,r){

    ctx.beginPath();

    ctx.moveTo(x+r,y);

    ctx.arcTo(x+w,y,x+w,y+h,r);

    ctx.arcTo(x+w,y+h,x,y+h,r);

    ctx.arcTo(x,y+h,x,y,r);

    ctx.arcTo(x,y,x+w,y,r);

    ctx.closePath();

}


/* DRAW IMAGE COVER */

function drawCover(img,x,y,w,h){

    const ratio = Math.max(
        w/img.width,
        h/img.height
    );

    const nw = img.width * ratio;
    const nh = img.height * ratio;

    const nx = x + (w-nw)/2;
    const ny = y + (h-nh)/2;

    ctx.drawImage(
        img,
        nx,ny,nw,nh
    );

}


/* BACKGROUND */

function drawBackground(){

    const g = ctx.createLinearGradient(
        0,0,1080,1080
    );

    if(selectedTemplate === 1){

        g.addColorStop(0,"#ff5a00");
        g.addColorStop(1,"#ffb067");

    }

    else if(selectedTemplate === 2){

        g.addColorStop(0,"#090909");
        g.addColorStop(1,"#303030");

    }

    else if(selectedTemplate === 3){

        g.addColorStop(0,"#ffffff");
        g.addColorStop(1,"#eeeeee");

    }

    else if(selectedTemplate === 4){

        g.addColorStop(0,"#14213d");
        g.addColorStop(1,"#4361ee");

    }

    else if(selectedTemplate === 5){

        g.addColorStop(0,"#111827");
        g.addColorStop(1,"#374151");

    }

    else{

        g.addColorStop(0,"#fff7f1");
        g.addColorStop(1,"#ffd9bf");

    }

    ctx.fillStyle = g;

    ctx.fillRect(0,0,1080,1080);

}


/* GENERATE */

async function generateNews(){

    const news =
        document.getElementById("newsInput")
        .value.trim();

    if(!news){

        drawEmpty();

        return;

    }


    const category =
        document.getElementById("category")
        .value;

    const customHeadline =
        document.getElementById("headline")
        .value.trim();

    const headline =
        customHeadline ||
        createHeadline(news);

    const summary =
        createSummary(news);


    /* IMAGE */

    const imageUrl =
        document.getElementById("imageUrl")
        .value.trim();

    if(imageUrl){

        try{

            loadedNewsImage =
                await loadImage(imageUrl);

        }catch(e){

            loadedNewsImage = null;

        }

    }else{

        loadedNewsImage = null;

    }


    drawNews(
        headline,
        summary,
        category
    );

}


/* DRAW NEWS */

function drawNews(
    headline,

){

    drawBackground();


    const dark =
        selectedTemplate === 3 ||
        selectedTemplate === 6;

    const mainColor =
        dark ? "#171717" : "#ffffff";

    /* decorative circles */

    ctx.fillStyle="#fff";

            imageY,
            imageW,
            imageH
        );

    }

    else{

        ctx.save();

        roundRect(
            imageX,
            imageY,
            imageW,
            imageH,
            30

            dark

            : "rgba(255,255,255,.15)";

        ctx.fill();

        ctx.restore();


        ctx.fillStyle =
            dark ? "#777" : "rgba(255,255,255,.7)";

        ctx.font="700 24px Inter";

        ctx.textAlign="center";

        ctx.fillText(

    let dateText = dateValue;

        dateText =

                }

    ctx.fillText(
