<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diploma Engineers Admin</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f9;
}

.container{
max-width:900px;
margin:20px auto;
padding:15px;
}

.card{
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
margin-bottom:20px;
}

input,
textarea,
select{

width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;

}

textarea{

height:120px;
resize:vertical;

}

button{

padding:12px 18px;
background:#0d6efd;
color:#fff;
border:none;
border-radius:8px;
cursor:pointer;

}

button:hover{

background:#0b5ed7;

}

.logout{

background:#dc3545;

}

.logout:hover{

background:#bb2d3b;

}

label{

font-weight:bold;
display:block;
margin-top:10px;

}

#preview{

display:none;
width:220px;
height:140px;
object-fit:cover;
border-radius:10px;
border:1px solid #ddd;
margin:10px 0;

}

.news-item{

display:flex;
gap:15px;
padding:15px 0;
border-bottom:1px solid #ddd;

}

.news-item img{

width:150px;
height:100px;
object-fit:cover;
border-radius:10px;

}

.news-content{

flex:1;

}

.small{

font-size:13px;
color:#666;

}

#adminPanel{

display:none;

}

</style>

</head>

<body>

<div class="container">

<div class="card" id="loginBox">

<h2>Admin Login</h2>

<input
id="email"
type="email"
placeholder="Email">

<input
id="password"
type="password"
placeholder="Password">

<button id="loginBtn">

Login

</button>

</div>

<div id="adminPanel">

<div class="card">

<h2>Publish News</h2>

<input
id="title"
placeholder="News Title">

<textarea
id="desc"
placeholder="Description"></textarea>

<label>

Upload Thumbnail

</label>

<input
type="file"
id="thumb"
accept="image/*">

<img
id="preview">

<label>

Attach PDF / File

</label>

<input
type="file"
id="pdf"
accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip">

<select id="cat">

<option>Notice</option>

<option>Result</option>

<option>Admission</option>

<option>Scholarship</option>

<option>Job</option>

</select>

<button id="publishBtn">

Publish News

</button>

<button
class="logout"
id="logoutBtn">

Logout

</button>

</div>

<div class="card">

<h3>Published News</h3>

<div id="list">

Loading...

</div>

</div>

</div>

</div>

  <script type="module">

import{

auth,
db,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut,
ref,
push,
set,
onValue,
remove

}

from "./firebase.js";


//==============================
// ELEMENTS
//==============================

const loginBox=document.getElementById("loginBox");

const adminPanel=document.getElementById("adminPanel");

const list=document.getElementById("list");

const title=document.getElementById("title");

const desc=document.getElementById("desc");

const thumb=document.getElementById("thumb");

const pdf=document.getElementById("pdf");

const cat=document.getElementById("cat");

const preview=document.getElementById("preview");

const publishBtn=document.getElementById("publishBtn");

const logoutBtn=document.getElementById("logoutBtn");

const loginBtn=document.getElementById("loginBtn");

const email=document.getElementById("email");

const password=document.getElementById("password");

let imageUrl="";

let fileUrl="";


//==============================
// IMAGE PREVIEW
//==============================

thumb.onchange=()=>{

const file=thumb.files[0];

if(!file)return;

preview.src=URL.createObjectURL(file);

preview.style.display="block";

};


// IMAGE UPLOAD
async function uploadImage(file){

const formData=new FormData();

formData.append("file",file);

formData.append("upload_preset","news_upload");

const response=await fetch(

"https://api.cloudinary.com/v1_1/ub0qgzwa/image/upload",

{
method:"POST",
body:formData
}

);

const data=await response.json();

if(data.error) throw new Error(data.error.message);

return data.secure_url;

}


// PDF UPLOAD
async function uploadPDF(file){

const formData=new FormData();

formData.append("file",file);

formData.append("upload_preset","news_upload");

const response=await fetch(

"https://api.cloudinary.com/v1_1/ub0qgzwa/raw/upload",

{
method:"POST",
body:formData
}

);

const data=await response.json();

if(data.error) throw new Error(data.error.message);

return data.secure_url;

}
    //==============================
// LOGIN
//==============================

loginBtn.onclick=async()=>{

try{

await signInWithEmailAndPassword(

auth,

email.value,

password.value

);

}

catch(error){

alert(error.message);

}

};


//==============================
// CHECK LOGIN
//==============================

onAuthStateChanged(auth,(user)=>{

if(user){

loginBox.style.display="none";

adminPanel.style.display="block";

loadNews();

}

else{

loginBox.style.display="block";

adminPanel.style.display="none";

}

});


//==============================
// PUBLISH NEWS
//==============================

publishBtn.onclick=async()=>{

if(title.value==""){

alert("Enter News Title");

return;

}

publishBtn.disabled=true;

publishBtn.innerHTML="Uploading...";

try{

imageUrl="";

fileUrl="";

// Upload Image
imageUrl=await uploadImage(
thumb.files[0]
);

  
// Upload PDF/File

fileUrl=await uploadPDF(
pdf.files[0]
);

// Save to Firebase

const newsRef=push(ref(db,"news"));

await set(newsRef,{

title:title.value,

desc:desc.value,

thumb:imageUrl,

pdf:fileUrl,

cat:cat.value,

date:new Date().toLocaleString()

});

alert("News Published Successfully");

title.value="";

desc.value="";

thumb.value="";

pdf.value="";

preview.src="";

preview.style.display="none";

}

catch(error){

alert(error.message);

}

publishBtn.disabled=false;

publishBtn.innerHTML="Publish News";

};

    //==============================
// LOAD NEWS
//==============================

function loadNews(){

const newsRef=ref(db,"news");

onValue(newsRef,(snapshot)=>{

list.innerHTML="";

if(!snapshot.exists()){

list.innerHTML="<h3>No News Available</h3>";

return;

}

snapshot.forEach((child)=>{

const n=child.val();

list.innerHTML+=`

<div class="news-item">

${n.thumb?`

<img
src="${n.thumb}"
style="
width:160px;
height:100px;
object-fit:cover;
border-radius:10px;
border:1px solid #ddd;
">

`:""}

<div class="news-content">

<h3>${n.title}</h3>

<div class="small">

${n.cat} |
${n.date}

</div>

<p>

${n.desc}

</p>

${n.thumb?`

<a
href="${n.thumb}"
target="_blank">

🖼 Open Image

</a>

<br><br>

`:""}

${n.pdf?`

<a
href="${n.pdf}"
target="_blank">

📄 Open File

</a>

<br><br>

`:""}

<button
onclick="deleteNews('${child.key}')">

Delete

</button>

</div>

</div>

`;

});

});

}


    const data = await response.json();

console.log(data);

if(data.error){
    alert(JSON.stringify(data));
    throw new Error(data.error.message);
}

return data.secure_url;

//==============================
// DELETE NEWS
//==============================

window.deleteNews=(id)=>{

if(confirm("Delete this news?")){

remove(ref(db,"news/"+id));

}

};


//==============================
// LOGOUT
//==============================

logoutBtn.onclick=()=>{

signOut(auth);

};

</script>

</body>

</html>
