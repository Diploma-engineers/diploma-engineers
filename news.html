<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diploma Engineers News</title>

<style>

body{

margin:0;
font-family:Arial,sans-serif;
background:#f4f6f9;

}


.container{

max-width:900px;
margin:20px auto;
padding:15px;

}


h2{

text-align:center;
color:#0d6efd;

}


.card{

background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 2px 8px rgba(0,0,0,.15);

}


.card img{

width:100%;
max-height:400px;
object-fit:cover;
border-radius:10px;
margin:10px 0;

}


.category{

background:#0d6efd;
color:white;
padding:5px 12px;
border-radius:20px;
font-size:13px;
display:inline-block;

}


.date{

color:#777;
font-size:13px;

}


.pdf{

display:inline-block;
background:#0d6efd;
color:white;
padding:10px 15px;
border-radius:7px;
text-decoration:none;
margin-top:10px;

}


.loading{

text-align:center;
padding:30px;

}

</style>

</head>


<body>


<div class="container">


<h2>
Latest News
</h2>


<div id="newsList" class="loading">

Loading News...

</div>


</div>



<script type="module">


import {

db,
ref,
onValue

}

from "./firebase.js";





const newsList=document.getElementById("newsList");



const newsRef=ref(db,"news");



onValue(newsRef,(snapshot)=>{


newsList.innerHTML="";



if(!snapshot.exists()){


newsList.innerHTML="No News Available";

return;


}



let newsArray=[];



snapshot.forEach((child)=>{


newsArray.push({

id:child.key,

...child.val()

});


});



// Latest News First

newsArray.reverse();



newsArray.forEach((n)=>{



newsList.innerHTML+=`


<div class="card">


<span class="category">

${n.cat || "News"}

</span>


<h3>

${n.title}

</h3>



${n.thumb ?

`

<img src="${n.thumb}">

`

:""}



<p>

${n.desc}

</p>



${n.pdf ?

`

<a class="pdf" href="${n.pdf}" target="_blank">

Open PDF

</a>

`

:""}



<br><br>


<div class="date">

${n.date || ""}

</div>


</div>


`;



});



});



</script>


</body>

</html>
