<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Diploma Engineers Courses</title>

<!-- Bootstrap & Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --primary: #2563EB;
  --primary-dark: #1D4ED8;
  --primary-light: #3B82F6;
  --bg-white: #ffffff;
  --surface-gray: #f8fafc;
  --dark-text: #0F172A;
  --muted-text: #64748B;
  --border-light: #e2e8f0;
  --radius-lg: 20px;
  --radius-md: 14px;
  --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.08);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Plus Jakarta Sans', sans-serif;
}

body {
  background-color: var(--surface-gray);
  color: var(--dark-text);
  padding: 16px;
}

.container-custom {
  max-width: 800px;
  margin: 0 auto;
}

.section-title {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 16px;
  color: var(--dark-text);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.section-title span { color: var(--primary); }

.courses-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}

@media(min-width: 600px) {
  .courses-grid { grid-template-columns: repeat(2, 1fr); }
}

.course-card {
  background: var(--bg-white);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-light);
  box-shadow: var(--shadow-subtle);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: transform 0.15s ease;
}

.course-card:hover { transform: translateY(-2px); }

.course-header {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white;
  padding: 16px;
  position: relative;
}

.course-header h3 {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 4px;
}

.course-header p {
  font-size: 12px;
  opacity: 0.9;
  margin: 0;
}

.course-body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.course-features {
  list-style: none;
  padding: 0;
  margin: 0;
  font-size: 12px;
  color: var(--muted-text);
}

.course-features li {
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.course-features li i { color: #16a34a; }

.btn-action {
  width: 100%;
  padding: 10px;
  border-radius: var(--radius-md);
  font-weight: 700;
  font-size: 13px;
  border: none;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  transition: opacity 0.15s;
}

.btn-enroll {
  background: #f97316;
  color: white;
  box-shadow: 0 4px 12px rgba(249, 115, 22, 0.25);
}

.btn-view {
  background: #16a34a;
  color: white;
  box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
}

/* Modal Styling */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(4px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.modal-content-box {
  background: white;
  width: 100%;
  max-width: 420px;
  border-radius: var(--radius-lg);
  padding: 24px;
  position: relative;
  box-shadow: var(--shadow-md);
  text-align: center;
}

.close-modal {
  position: absolute;
  top: 12px;
  right: 16px;
  font-size: 18px;
  cursor: pointer;
  color: var(--muted-text);
}

#loadingState {
  text-align: center;
  padding: 40px;
  font-weight: 600;
  color: var(--muted-text);
}
</style>
</head>
<body>

<div class="container-custom">
  <div class="section-title">Exclusive <span>Batches</span></div>
  
  <div id="loadingState">
    <i class="fas fa-spinner fa-spin fa-2x" style="color: var(--primary);"></i>
    <p style="margin-top: 10px;">Checking your account status...</p>
  </div>

  <div id="coursesContainer" class="courses-grid" style="display: none;"></div>
</div>

<!-- Batch Detail / Payment Modal -->
<div class="modal-overlay" id="batchModal">
  <div class="modal-content-box">
    <span class="close-modal" onclick="closeModal()"><i class="fas fa-times"></i></span>
    <h3 id="modalTitle" style="font-size: 18px; font-weight: 700; margin-bottom: 8px;">Batch Enrollment</h3>
    <p style="font-size: 13px; color: var(--muted-text); margin-bottom: 16px;">Complete your payment securely via Cashfree to instantly unlock your course materials and live sessions.</p>
    
    <div style="background: #f0fdf4; color: #16a34a; padding: 10px; border-radius: 8px; font-weight: 800; font-size: 18px; margin-bottom: 16px; border: 1px solid #bbf7d0;">
      ₹99 Only
    </div>

    <a href="https://payments.cashfree.com/links?code=Sar2v6qk7m8g_AAAAAAAU08I" target="_blank" class="btn-action btn-enroll" onclick="savePendingBatch()">
      Proceed to Pay <i class="fas fa-arrow-right"></i>
    </a>
  </div>
</div>

<!-- Firebase Scripts -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // Main App Firebase Configuration (diploma-app-9a378)
  const firebaseConfig = {
    apiKey: "AIzaSyCxe9H7zSxJQzgM8bN_UAdOnDHr5myH6CQ",
    authDomain: "diploma-app-9a378.firebaseapp.com",
    databaseURL: "https://diploma-app-9a378-default-rtdb.firebaseio.com",
    projectId: "diploma-app-9a378",
    storageBucket: "diploma-app-9a378.firebasestorage.app",
    messagingSenderId: "160233059797",
    appId: "1:160233059797:web:be38130ed64f8bd0afb95c"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const coursesData = [
    {
      id: "civil_special",
      title: "Civil Engineering Special Batch",
      desc: "Complete Structural & Geotechnical Mastery",
      contentUrl: "civil-course.html"
    },
    {
      id: "cs_master",
      title: "CS & IT Master Batch",
      desc: "Programming, DBMS & Web Engineering",
      contentUrl: "cs-course.html"
    },
    {
      id: "mech_batch",
      title: "Mechanical Engineering Batch",
      desc: "Thermal, Production & Machine Design",
      contentUrl: "mech-course.html"
    },
    {
      id: "pyq_batch",
      title: "Diploma PYQ Master Batch",
      desc: "Last 5 Years Solved Papers & Answers",
      contentUrl: "pyq-course.html"
    }
  ];

  let activeModalCourseId = null;

  onAuthStateChanged(auth, async (user) => {
    const loadingEl = document.getElementById("loadingState");
    const containerEl = document.getElementById("coursesContainer");

    if (user) {
      try {
        const snapshot = await get(child(ref(db), `users/${user.uid}/courses`));
        const purchasedCourses = snapshot.exists() ? snapshot.val() : {};

        loadingEl.style.display = "none";
        containerEl.style.display = "grid";
        renderCourses(purchasedCourses);
      } catch (err) {
        console.error(err);
        loadingEl.innerHTML = "<p style='color: #ef4444;'>Failed to load course details. Please refresh.</p>";
      }
    } else {
      // Fallback if user session isn't detected immediately
      loadingEl.style.display = "none";
      containerEl.style.display = "grid";
      renderCourses({});
    }
  });

  function renderCourses(purchasedMap) {
    const containerEl = document.getElementById("coursesContainer");
    containerEl.innerHTML = "";

    coursesData.forEach(course => {
      // Check if purchased safely from Firebase structure users/{uid}/courses/{courseId}/purchased
      const isPurchased = purchasedMap[course.id] && purchasedMap[course.id].purchased === true;

      const card = document.createElement("div");
      card.className = "course-card";

      card.innerHTML = `
        <div class="course-header">
          <h3>${course.title}</h3>
          <p>${course.desc}</p>
        </div>
        <div class="course-body">
          <ul class="course-features">
            <li><i class="fas fa-check-circle"></i> Complete Video Lectures</li>
            <li><i class="fas fa-check-circle"></i> Handwritten PDF Notes</li>
            <li><i class="fas fa-check-circle"></i> Doubt Resolution Support</li>
          </ul>
          ${isPurchased 
            ? `<a href="${course.contentUrl}" class="btn-action btn-view">VIEW COURSE <i class="fas fa-arrow-right"></i></a>`
            : `<button class="btn-action btn-enroll" onclick="openBatchModal('${course.id}', '${course.title}')">ENROLL NOW <i class="fas fa-lock-open"></i></button>`
          }
        </div>
      `;
      containerEl.appendChild(card);
    });
  }

  window.openBatchModal = function(courseId, courseTitle) {
    activeModalCourseId = courseId;
    sessionStorage.setItem("pendingCourse", courseId);
    document.getElementById("modalTitle").innerText = courseTitle;
    document.getElementById("batchModal").style.display = "flex";
  };

  window.closeModal = function() {
    document.getElementById("batchModal").style.display = "none";
  };

  window.savePendingBatch = function() {
    if (activeModalCourseId) {
      sessionStorage.setItem("pendingCourse", activeModalCourseId);
    }
  };
</script>
</body>
</html>
