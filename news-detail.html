<!DOCTYPE html>  <html lang="hi">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">  
<meta name="theme-color" content="#0f2f63">  
<title>News Details | Diploma Engineers</title>  
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">  
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">  
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">  <style>  
*{margin:0;padding:0;box-sizing:border-box}  
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}  
body{font-family:Poppins,'Segoe UI',sans-serif;background:#f5f7fb;color:#172033;min-height:100vh;overflow-x:hidden}  
#header{display:block;width:100%;min-height:82px;position:relative;z-index:10000}  
#header-spacer{height:0!important;width:100%;display:none!important}  
#header .custom-navbar{width:100%}  
#header .custom-navbar .container{width:100%}  
#header .navbar-brand,#header .nav-link,#header .login-btn-btn{text-decoration:none!important}  
#header .dropdown-menu-custom{z-index:100000!important}  
#header img{max-width:100%}  
#footer{display:block;width:100%;clear:both}  
  
.detail-wrap{width:100%;padding:0 clamp(12px,3vw,40px) 45px}  
.detail-inner{width:100%;max-width:1100px;margin:0 auto}  
.back-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid #e2e8f0;background:#fff;color:#475569;text-decoration:none;border-radius:11px;padding:9px 13px;font-size:12px;font-weight:700;margin-bottom:15px}  
.back-btn:hover{color:#2563eb;border-color:#cbd5e1}  
.news-detail-card{background:#fff;border:1px solid #e5eaf1;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(15,23,42,.06)}  
.detail-content{padding:clamp(18px,3vw,34px)}  
.detail-category{display:inline-flex;align-items:center;background:#f1f5f9;color:#475569;padding:5px 10px;border-radius:999px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-bottom:12px}  
.detail-title{font-size:clamp(23px,3vw,36px);line-height:1.25;color:#0f172a;font-weight:800;margin:0 0 14px}  
.detail-meta{display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px;padding-bottom:17px;border-bottom:1px solid #edf1f5;color:#64748b;font-size:11px}  
.detail-meta span{display:inline-flex;align-items:center;gap:6px}  
.admin-info{display:flex;align-items:center;gap:10px;margin-top:15px;padding:11px 13px;background:#f8fafc;border:1px solid #edf1f5;border-radius:14px}  
.admin-photo{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#e2e8f0;border:2px solid #fff}  
.admin-info strong{display:block;color:#172033;font-size:12px}  
.admin-info small{display:block;color:#64748b;font-size:10px;margin-top:2px}  
.detail-image{width:100%;max-height:570px;object-fit:contain;background:#f1f5f9;border-radius:16px;margin-top:18px;display:block}  
.about-title{font-size:17px;font-weight:800;color:#0f172a;margin:24px 0 10px}  
.detail-body{font-size:14px;line-height:1.85;color:#334155;overflow-wrap:anywhere}  
.detail-body p{margin:0 0 12px}  
.detail-body h1,.detail-body h2,.detail-body h3{color:#0f172a;margin:20px 0 9px}  
.detail-body h2{font-size:21px}.detail-body h3{font-size:17px}  
.detail-body ul,.detail-body ol{padding-left:24px;margin:8px 0 14px}  
.detail-body a{color:#2563eb;font-weight:700;overflow-wrap:anywhere}  
.detail-body img{max-width:100%;height:auto;border-radius:10px}  
.attachments{margin-top:25px;padding-top:18px;border-top:1px solid #edf1f5}  
.attachments h3{font-size:16px;font-weight:800;margin-bottom:11px;color:#0f172a}  
.attachment-grid{display:flex;flex-wrap:wrap;gap:9px}  
.attachment-btn{display:inline-flex;align-items:center;gap:7px;padding:10px 13px;border-radius:11px;text-decoration:none;font-size:11px;font-weight:800;border:1px solid #e2e8f0}  
.attachment-btn.external{background:#ecfdf3;color:#15803d;border-color:#bbf7d0}  
.attachment-btn.pdf{background:#fef2f2;color:#dc2626;border-color:#fecaca}  
.share-row{display:flex;align-items:center;gap:8px;margin-top:22px;padding-top:17px;border-top:1px solid #edf1f5}  
.share-row strong{font-size:12px;color:#475569;margin-right:3px}  
.share-btn{width:38px;height:38px;border:0;border-radius:11px;color:#fff;display:grid;place-items:center;cursor:pointer}  
.whatsapp{background:#25D366}.telegram{background:#229ED9}.copy{background:#64748b}  
.loading,.error-box{background:#fff;border:1px solid #e5eaf1;border-radius:20px;padding:55px 20px;text-align:center;color:#64748b}  
.loading i{font-size:25px;color:#2563eb;margin-bottom:10px}  
.error-box i{font-size:30px;color:#dc2626;margin-bottom:10px}  
.not-found{padding:55px 20px;text-align:center}  
.not-found i{font-size:35px;color:#94a3b8;margin-bottom:10px}  
.not-found a{display:inline-flex;margin-top:12px;background:#2563eb;color:#fff;text-decoration:none;border-radius:10px;padding:10px 14px;font-size:12px;font-weight:700}  
  
@media(max-width:650px){  
 #header-spacer{height:0!important;display:none!important}  
 .detail-wrap{padding:0 9px 30px}  
 .news-detail-card{border-radius:17px}  
 .detail-content{padding:15px}  
 .detail-title{font-size:22px}  
 .detail-meta{gap:8px 13px;font-size:10px}  
 .detail-image{max-height:330px;border-radius:12px}  
 .detail-body{font-size:13px;line-height:1.75}  
 .attachment-grid{display:grid;grid-template-columns:1fr}  
 .attachment-btn{justify-content:center}  
 .share-row{justify-content:flex-start}  
}  
</style>  </head>  
<body>  <div id="header"></div>  
<div id="header-spacer"></div>  <main class="detail-wrap">  
<div class="detail-inner">  
    <a class="back-btn" href="news.html"><i class="fa-solid fa-arrow-left"></i> All News</a>  
    <div id="detailRoot">  
        <div class="loading">  
            <i class="fa-solid fa-spinner fa-spin"></i>  
            <p>Loading News...</p>  
        </div>  
    </div>  
</div>  
</main>  <div id="footer"></div>  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>  <script>  
async function fetchComponent(elementId,filePath){  
    const container=document.getElementById(elementId);  
    if(!container)return;  
    try{  
        const response=await fetch(filePath+"?v="+Date.now(),{cache:"no-store"});  
        if(!response.ok)throw new Error("Could not fetch "+filePath);  
        const html=await response.text();  
        const parser=new DOMParser();  
        const doc=parser.parseFromString(html,"text/html");  
        doc.querySelectorAll("style").forEach(style=>{  
            const s=document.createElement("style");  
            s.textContent=style.textContent;  
            s.setAttribute("data-fetched-component",filePath);  
            document.head.appendChild(s);  
        });  
        doc.querySelectorAll('link[rel="stylesheet"]').forEach(link=>{  
            const href=link.getAttribute("href");  
            if(!href)return;  
            const absolute=new URL(href,window.location.href).href;  
            if(![...document.querySelectorAll('link[rel="stylesheet"]')].some(x=>x.href===absolute)){  
                const l=document.createElement("link");l.rel="stylesheet";l.href=absolute;document.head.appendChild(l);  
            }  
        });  
        container.innerHTML=doc.body.innerHTML;  
        for(const oldScript of [...doc.querySelectorAll("script")]){  
            const s=document.createElement("script");  
            if(oldScript.src){s.src=new URL(oldScript.src,window.location.href).href;s.async=false}  
            if(oldScript.textContent)s.textContent=oldScript.textContent;  
            document.body.appendChild(s);  
        }  
        if(elementId==="header"){  
            const spacer=document.getElementById("header-spacer");  
            if(spacer)spacer.style.height="84px";  
        }  
        activateCurrentNavigation();  
    }catch(error){  
        console.error(error);  
        container.innerHTML='<div class="component-error">Component could not be loaded.</div>';  
    }  
}  
function activateCurrentNavigation(){  
    const currentPage=location.pathname.split("/").pop().toLowerCase()||"index.html";  
    document.querySelectorAll("#header .nav-link").forEach(link=>{  
        const href=(link.getAttribute("href")||"").split("/").pop().toLowerCase();  
        link.classList.remove("active");  
        if(href===currentPage)link.classList.add("active");  
    });  
}  
document.addEventListener("DOMContentLoaded",()=>{  
    fetchComponent("header","header.html");  
    fetchComponent("footer","footer.html");  
});  
window.addEventListener("load",()=>setTimeout(activateCurrentNavigation,300));  
</script>  <script type="module">  
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";  
import {getDatabase,ref,get} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";  
  
const firebaseConfig={  
    apiKey:"AIzaSyAbg1Q1ZPgF7mwaxyin7iglla01eDk_tKo",  
    authDomain:"diplomaengineers-869df.firebaseapp.com",  
    databaseURL:"https://diplomaengineers-869df-default-rtdb.firebaseio.com",  
    projectId:"diplomaengineers-869df",  
    storageBucket:"diplomaengineers-869df.appspot.com",  
    messagingSenderId:"356779436080",  
    appId:"1:356779436080:web:4b28da380e547420d0e5f5"  
};  
const app=initializeApp(firebaseConfig);  
const db=getDatabase(app);  
const root=document.getElementById("detailRoot");  
  
function esc(v){  
    return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");  
}  
function validURL(v){  
    try{const u=new URL(v);return u.protocol==="http:"||u.protocol==="https:"}catch{return false}  
}  
function sanitizeHTML(html){  
    const parser=new DOMParser();  
    const doc=parser.parseFromString(String(html||""),"text/html");  
    doc.querySelectorAll("script,iframe,object,embed,form,style,link,meta").forEach(x=>x.remove());  
    doc.querySelectorAll("*").forEach(el=>{  
        [...el.attributes].forEach(attr=>{  
            if(/^on/i.test(attr.name))el.removeAttribute(attr.name);  
        });  
        if(el.tagName==="A"){  
            const href=el.getAttribute("href")||"";  
            if(!validURL(href))el.removeAttribute("href");  
            else {el.setAttribute("target","_blank");el.setAttribute("rel","noopener noreferrer")}  
        }  
    });  
    return doc.body.innerHTML;  
}  
function formatTimestamp(ts){  
    if(!ts)return "";  
    const d=new Date(Number(ts));  
    if(Number.isNaN(d.getTime()))return "";  
    return d.toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"});  
}  
function getShareURL(){  
    return window.location.href;  
}  

function getShareText(){  
    const n=window.__currentNews||{};  
    return (n.title||"Diploma Engineers News")+"\n\n"+getShareURL();  
}  

function showToast(text){  
    const old=document.getElementById("shareToast");if(old)old.remove();  
    const box=document.createElement("div");  
    box.id="shareToast";box.textContent=text;  
    box.style.cssText="position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:999px;font:600 12px Poppins;z-index:999999;box-shadow:0 8px 25px rgba(0,0,0,.18)";  
    document.body.appendChild(box);  
    setTimeout(()=>box.remove(),1800);  
}  

function getShareImageURL(){  
    const n=window.__currentNews||{};  
    return n.thumb||n.image||n.thumbnail||"";  
}  

async function makeShareFile(){  
    const imageURL=getShareImageURL();  
    if(!imageURL || !validURL(imageURL)) return null;  
    try{  
        const response=await fetch(imageURL,{mode:"cors",cache:"no-store"});  
        if(!response.ok)throw new Error("Image fetch failed");  
        const blob=await response.blob();  
        const type=blob.type&&blob.type.startsWith("image/")?blob.type:"image/jpeg";  
        const ext=type.includes("png")?"png":type.includes("webp")?"webp":"jpg";  
        return new File([blob],"diploma-engineers-thumbnail."+ext,{type});  
    }catch(error){  
        console.warn("Thumbnail could not be attached:",error);  
        return null;  
    }  
}  

async function shareAnywhere(){  
    const n=window.__currentNews||{};  
    const text=getShareText();  
    const file=await makeShareFile();  

    if(navigator.share){  
        try{  
            if(file && navigator.canShare && navigator.canShare({files:[file]})){  
                await navigator.share({  
                    title:n.title||"Diploma Engineers News",  
                    text:n.title||"Diploma Engineers News",  
                    url:getShareURL(),  
                    files:[file]  
                });  
                return;  
            }  
            await navigator.share({  
                title:n.title||"Diploma Engineers News",  
                text:text,  
                url:getShareURL()  
            });  
            return;  
        }catch(error){  
            if(error && error.name==="AbortError")return;  
        }  
    }  

    await copyNewsLink();  
    showToast("Share sheet unavailable — link copied");  
}  

window.shareWhatsApp=async()=>{  
    const file=await makeShareFile();  
    const n=window.__currentNews||{};  

    if(navigator.share && file && navigator.canShare && navigator.canShare({files:[file]})){  
        try{  
            await navigator.share({  
                title:n.title||"News",  
                text:n.title||"News",  
                url:getShareURL(),  
                files:[file]  
            });  
            return;  
        }catch(error){  
            if(error && error.name==="AbortError")return;  
        }  
    }  

    window.open("https://wa.me/?text="+encodeURIComponent(getShareText()),"_blank","noopener,noreferrer");  
};  

window.shareTelegram=async()=>{  
    const file=await makeShareFile();  
    const n=window.__currentNews||{};  

    if(navigator.share && file && navigator.canShare && navigator.canShare({files:[file]})){  
        try{  
            await navigator.share({  
                title:n.title||"News",  
                text:n.title||"News",  
                url:getShareURL(),  
                files:[file]  
            });  
            return;  
        }catch(error){  
            if(error && error.name==="AbortError")return;  
        }  
    }  

    window.open("https://t.me/share/url?url="+encodeURIComponent(getShareURL())+"&text="+encodeURIComponent(n.title||"News"),"_blank","noopener,noreferrer");  
};  

window.copyNewsLink=async()=>{  
    try{await navigator.clipboard.writeText(getShareURL());showToast("Link Copied!")}  
    catch{const t=document.createElement("textarea");t.value=getShareURL();document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();showToast("Link Copied!")}  
};  
  
const params=new URLSearchParams(location.search);  
const id=params.get("id");  
  
if(!id){  
    root.innerHTML='<div class="not-found"><i class="fa-regular fa-newspaper"></i><h3>News not found</h3><a href="news.html">Go to News</a></div>';  
}else{  
    get(ref(db,"news/"+id)).then(snapshot=>{  
        if(!snapshot.exists()){  
            root.innerHTML='<div class="not-found"><i class="fa-regular fa-newspaper"></i><h3>News not found</h3><p>This notification may have been removed.</p><a href="news.html">Go to News</a></div>';  
            return;  
        }  
  
        const n=snapshot.val()||{};  
        window.__currentNews=n;  
  
        const title=n.title||"Untitled News";  
        const category=n.cat||n.category||"NOTIFICATION";  
        const date=n.date||formatTimestamp(n.timestamp)||"Recent";  
        const description=n.text||n.desc||n.description||"";  
        const rawAbout=n.html||"";  
        const about=rawAbout?sanitizeHTML(rawAbout):`<p>${esc(description).replace(/\n/g,"<br>")}</p>`;  
        const image=n.thumb||n.image||n.thumbnail||"";  
        const author=n.authorName||n.ownerName||"Admin";  
        const designation=n.designation||n.ownerDesignation||"ADMIN";  
        const authorPhoto=n.authorPhoto||n.ownerPhoto||"";  
        const pdf=n.pdf||n.fileUrl||n.pdfUrl||"";  
        const external=n.link||n.externalLink||"";  
  
        document.title=title+" | Diploma Engineers";  
  
        root.innerHTML=`  
        <article class="news-detail-card">  
            <div class="detail-content">  
                <span class="detail-category">${esc(category)}</span>  
                <h1 class="detail-title">${esc(title)}</h1>  
  
                <div class="detail-meta">  
                    <span><i class="fa-regular fa-calendar"></i>${esc(date)}</span>  
                    ${n.timestamp?`<span><i class="fa-regular fa-clock"></i>${esc(formatTimestamp(n.timestamp)||date)}</span>`:""}  
                </div>  
  
                <div class="admin-info">  
                    ${authorPhoto&&validURL(authorPhoto)?`<img class="admin-photo" src="${esc(authorPhoto)}" alt="Admin" onerror="this.style.display='none'">`:`<div class="admin-photo" style="display:grid;place-items:center"><i class="fa-solid fa-user" style="color:#94a3b8"></i></div>`}  
                    <div>  
                        <strong>By ${esc(author)}</strong>  
                        <small>${esc(designation)}</small>  
                    </div>  
                </div>  
  
                ${image&&validURL(image)?`<img class="detail-image" src="${esc(image)}" alt="${esc(title)}" onerror="this.style.display='none'">`:""}  
  
                <h2 class="about-title">Detailed About</h2>  
                <div class="detail-body">${about}</div>  
  
                ${(pdf&&validURL(pdf))||(external&&validURL(external))?`  
                <div class="attachments">  
                    <h3><i class="fa-solid fa-paperclip"></i> Attached / External Links</h3>  
                    <div class="attachment-grid">  
                        ${pdf&&validURL(pdf)?`<a class="attachment-btn pdf" href="${esc(pdf)}" target="_blank" rel="noopener noreferrer"><i class="fa-regular fa-file-pdf"></i> Open PDF / File</a>`:""}  
                        ${external&&validURL(external)?`<a class="attachment-btn external" href="${esc(external)}" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-arrow-up-right-from-square"></i> External Link</a>`:""}  
                    </div>  
                </div>`:""}  
  
                <div class="share-row">  
                    <strong><i class="fa-solid fa-share-nodes"></i> Share</strong>  
                    <button class="share-btn whatsapp" onclick="shareWhatsApp()" aria-label="Share on WhatsApp"><i class="fa-brands fa-whatsapp"></i></button>  
                    <button class="share-btn telegram" onclick="shareTelegram()" aria-label="Share on Telegram"><i class="fa-brands fa-telegram"></i></button>  
                    <button class="share-btn copy" onclick="shareAnywhere()" aria-label="Share anywhere" title="Share to WhatsApp, Telegram, YouTube and other apps"><i class="fa-solid fa-arrow-up-from-bracket"></i></button>  
                    <button class="share-btn copy" onclick="copyNewsLink()" aria-label="Copy link"><i class="fa-regular fa-copy"></i></button>  
                </div>  
            </div>  
        </article>`;  
    }).catch(error=>{  
        console.error("Firebase news detail error:",error);  
        root.innerHTML='<div class="error-box"><i class="fa-solid fa-triangle-exclamation"></i><h3>Unable to load news</h3><p>Please try again later.</p></div>';  
    });  
}  
</script>  </body>  
</html>
