<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMC 14 : Rock and Stone (Part 04)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f2f3f7;
      color: #333;
      padding: 10px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px; /* Mobile App View Layout */
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    /* Video Player Area */
    .player-wrapper {
      position: relative;
      width: 100%;
      background: #000;
    }

    .player-wrapper iframe {
      width: 100%;
      height: auto;
      aspect-ratio: 640 / 360;
      display: block;
      border: 0;
    }

    /* Video Player Overlay Icons Matching PW Theme */
    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 14px;
      z-index: 2;
    }

    .overlay-top {
      display: flex;
      justify-content: flex-end;
    }

    .gear-icon {
      color: rgba(255, 255, 255, 0.9);
      font-size: 18px;
    }

    .overlay-center {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
    }

    .btn-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.35);
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 10px;
      font-weight: bold;
      pointer-events: auto;
      cursor: pointer;
    }

    .btn-circle.pause {
      width: 48px;
      height: 48px;
      font-size: 18px;
      background: rgba(0, 0, 0, 0.45);
    }

    .overlay-bottom {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .time-stamp {
      color: #ffffff;
      font-size: 11px;
      font-weight: bold;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    /* Custom Purple Seekbar */
    .seekbar-bg {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.35);
      border-radius: 2px;
      position: relative;
    }

    .seekbar-fill {
      width: 75%; /* Set matching 1:33:12 / 2:03:50 */
      height: 100%;
      background: #8e7bf1;
      border-radius: 2px;
      position: relative;
    }

    .seekbar-thumb {
      width: 10px;
      height: 10px;
      background: #8e7bf1;
      border-radius: 50%;
      position: absolute;
      right: -5px;
      top: -3px;
    }

    /* Title Box */
    .title-box {
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      color: #555;
      line-height: 1.3;
      border-bottom: 1px solid #f0f0f0;
    }

    /* App Tab Bar */
    .tab-bar {
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      border-bottom: 1px solid #eef0f3;
    }

    .tab-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #888;
      font-size: 12px;
      gap: 4px;
      cursor: pointer;
    }

    .tab-btn.active {
      color: #6c5ce7;
      font-weight: 600;
    }

    .tab-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #f4f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
    }

    .tab-btn.active .tab-icon {
      background: #eef0fd;
      color: #6c5ce7;
    }

    /* Comments Section */
    .comments-section {
      padding: 14px;
    }

    .comments-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .comments-header h3 {
      font-size: 15px;
      color: #333;
    }

    .comments-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 220px;
      overflow-y: auto;
    }

    .comment-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .user-name {
      font-size: 12px;
      color: #777;
    }

    .comment-content {
      font-size: 14px;
      color: #222;
      margin: 2px 0;
    }

    .timestamp-link {
      color: #6c5ce7;
      text-decoration: none;
      font-weight: 500;
    }

    .action-row {
      display: flex;
      gap: 12px;
      font-size: 11px;
      color: #999;
      margin-top: 2px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }

    .action-btn.like {
      color: #e74c3c;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Cloudinary Player Container -->
    <div class="player-wrapper">
      <iframe
        src="https://player.cloudinary.com/embed/?cloud_name=h7g2sxct&public_id=VID_20260812_101229_651"
        width="640"
        height="360" 
        style="height: auto; width: 100%; aspect-ratio: 640 / 360;"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen
        frameborder="0"
      ></iframe>

      <!-- Screen Theme Overlay Controls -->
      <div class="video-overlay">
        <div class="overlay-top">
          <span class="gear-icon">⚙️</span>
        </div>

        <div class="overlay-center">
          <div class="btn-circle">
            <span>⟲</span>
            <span>10</span>
          </div>
          <div class="btn-circle pause">
            <span>❚❚</span>
          </div>
          <div class="btn-circle">
            <span>⟳</span>
            <span>10</span>
          </div>
        </div>

        <div class="overlay-bottom">
          <div class="time-stamp">1:33:12 / 2:03:50</div>
          <div class="seekbar-bg">
            <div class="seekbar-fill">
              <div class="seekbar-thumb"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Title Section -->
    <div class="title-box">
      BMC (Building Materials) 14 : Rock and Stone (Part 04)
    </div>

    <!-- App Navigation Tabs -->
    <div class="tab-bar">
      <div class="tab-btn active">
        <div class="tab-icon">💬</div>
        <span>Comments</span>
      </div>
      <div class="tab-btn">
        <div class="tab-icon">⏱️</div>
        <span>Timeline</span>
      </div>
      <div class="tab-btn">
        <div class="tab-icon">📥</div>
        <span>Download</span>
      </div>
      <div class="tab-btn">
        <div class="tab-icon">⭐</div>
        <span>Rating</span>
      </div>
    </div>

    <!-- Comments Section -->
    <div class="comments-section">
      <div class="comments-header">
        <h3>Comments</h3>
        <span style="color: #888; font-size: 14px;">⚙️ ✖</span>
      </div>

      <div class="comments-list">
        <!-- Comment 1 -->
        <div class="comment-item">
          <span class="user-name">Rahul Kumar • 2 days ago</span>
          <div class="comment-content">gjyutuul</div>
          <div class="action-row">
            <span class="action-btn like">♥ Like</span>
            <span class="action-btn">⚠️ Report</span>
          </div>
        </div>

        <!-- Comment 2 -->
        <div class="comment-item">
          <span class="user-name">Shashwat Sharma • 1 day ago</span>
          <div class="comment-content">
            <a href="#" class="timestamp-link">1:15:25</a>
          </div>
          <div class="action-row">
            <span class="action-btn like">♥ Like</span>
            <span class="action-btn">⚠️ Report</span>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
