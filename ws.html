<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Diploma Engineers</title>
<link rel="icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,Arial,sans-serif;}
body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at top left,#dbeafe 0,transparent 35%),radial-gradient(circle at bottom right,#ffedd5 0,transparent 35%),#f8fafc;
    color:#172033;
    padding:20px;
}
.login-card{
    width:400px;
    max-width:100%;
    background:#fff;
    padding:35px;
    border-radius:24px;
    box-shadow:0 20px 60px rgba(15,23,42,.10);
    text-align:center;
    border:1px solid #e5e7eb;
}
.brand-img{
    width:76px;
    height:76px;
    border-radius:50%;
    object-fit:cover;
    background:#fff;
    padding:5px;
    box-shadow:0 8px 25px rgba(15,23,42,.12);
    margin-bottom:15px;
}
.login-card h2{color:#2563eb;margin-bottom:6px;font-size:24px;font-weight:800;}
.orange{color:#ff6500;}
.blue{color:#2563eb;}
.login-card p{color:#64748b;font-size:13px;margin-bottom:25px;}
.field{text-align:left;margin-bottom:15px;}
.field label{display:block;font-size:12px;font-weight:700;color:#334155;margin-bottom:6px;}
.field input{
    width:100%;padding:12px 14px;border:1px solid #dbe2ea;border-radius:11px;outline:none;font-size:13px;background:#fff;color:#172033;transition:.2s;
}
.field input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.08);}
.password-wrap{position:relative;}
.password-wrap input{padding-right:45px;}
.password-toggle{position:absolute;right:13px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#64748b;cursor:pointer;}
.login-btn{
    width:100%;border:0;padding:14px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(37,99,235,.22);transition:.2s;margin-top:10px;
}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 12px 25px rgba(37,99,235,.28);}
.login-btn:disabled{opacity:.65;cursor:not-allowed;transform:none;}
.error-msg{margin-top:15px;font-size:12px;color:#dc2626;background:#fef2f2;padding:10px;border-radius:9px;border:1px solid #fecaca;display:none;}
.error-msg.show{display:block;}
.bottom-link{margin-top:20px;font-size:12px;color:#64748b;}
.bottom-link a{color:#2563eb;text-decoration:none;font-weight:700;}
.bottom-link a:hover{text-decoration:underline;}
</style>
</head>
<body>

<div class="login-card">
    <img class="brand-img" src="https://anubhavfinance.wordpress.com/wp-content/uploads/2025/11/whatsapp-image-2025-11-26-at-01.09.43_629f0cdb.jpg" alt="Diploma Engineers">
    <h2><span class="orange">DIPLOMA</span> <span class="blue">ENGINEERS</span></h2>
    <p>Account Login Portal</p>

    <form id="loginForm">
        <div class="field">
            <label>Email Address</label>
            <input id="email" type="email" autocomplete="email" required placeholder="Enter your email">
        </div>

        <div class="field">
            <label>Password</label>
            <div class="password-wrap">
                <input id="password" type="password" autocomplete="current-password" required placeholder="Enter your password">
                <button type="button" class="password-toggle" id="togglePassword"><i class="fa-solid fa-eye"></i></button>
            </div>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
            <i class="fa-solid fa-right-to-bracket"></i> Login
        </button>

        <div id="errorMsg" class="error-msg"></div>
    </form>

    <div class="bottom-link">
        Don't have an account? <a href="register.html">Register here</a>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyAbg1Q1ZPgF7mwaxyin7iglla01eDk_tKo",
    authDomain: "diplomaengineers-869df.firebaseapp.com",
    databaseURL: "https://diplomaengineers-869df-default-rtdb.firebaseio.com",
    projectId: "diplomaengineers-869df",
    storageBucket: "diplomaengineers-869df.appspot.com",
    messagingSenderId: "356779436080",
    appId: "1:356779436080:web:4b28da380e547420d0e5f5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const loginForm = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const errorMsg = document.getElementById("errorMsg");
const passwordInput = document.getElementById("password");
const togglePasswordBtn = document.getElementById("togglePassword");

togglePasswordBtn.addEventListener("click", () => {
    const icon = togglePasswordBtn.querySelector("i");
    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        icon.className = "fa-solid fa-eye-slash";
    } else {
        passwordInput.type = "password";
        icon.className = "fa-solid fa-eye";
    }
});

loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = passwordInput.value;

    loginBtn.disabled = true;
    loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Logging in...';
    errorMsg.classList.remove("show");

    try {
        await signInWithEmailAndPassword(auth, email, password);
        // Redirect to Admin Panel / Dashboard after successful login
        window.location.href = "admin (30).html";
    } catch (err) {
        let msg = "Invalid email or password.";
        if (err.code === "auth/user-not-found") msg = "No account found with this email.";
        else if (err.code === "auth/wrong-password") msg = "Incorrect password.";
        else if (err.code === "auth/too-many-requests") msg = "Too many failed attempts. Try again later.";
        
        errorMsg.textContent = msg;
        errorMsg.classList.add("show");
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login';
    }
});
</script>

</body>
</html>
