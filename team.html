<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Team | Diploma Engineers</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#f7f8fc;
    color:#202124;
}

.header{
    background:#fff;
    border-bottom:1px solid #eee;
    position:sticky;
    top:0;
    z-index:100;
}

.header-inner{
    max-width:1200px;
    margin:auto;
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo-box{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-box img{
    width:44px;
    height:44px;
    object-fit:cover;
    border-radius:12px;
}

.logo-box h2{
    font-size:18px;
    font-weight:800;
}

.logo-box p{
    font-size:11px;
    color:#777;
}

.home-btn{
    text-decoration:none;
    background:#f1f3f5;
    color:#333;
    padding:9px 14px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:35px 16px 60px;
}

.heading{
    text-align:center;
    margin-bottom:32px;
}

.heading h1{
    font-size:32px;
    font-weight:800;
}

.heading h1 span{
    color:#ff6b00;
}

.heading p{
    color:#777;
    font-size:14px;
    margin-top:7px;
}

.team-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:22px;
}

.team-card{
    background:#fff;
    border:1px solid #eee;
    border-radius:20px;
    overflow:hidden;
    text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,.05);
    transition:.25s;
}

.team-card:hover{
    transform:translateY(-6px);
    box-shadow:0 15px 40px rgba(0,0,0,.10);
}

.card-top{
    height:90px;
    background:
        radial-gradient(circle at 20% 20%,#ffd6b5,transparent 35%),
        linear-gradient(135deg,#fff2e7,#fff);
}

.profile-wrap{
    margin-top:-52px;
}

.profile-img{
    width:104px;
    height:104px;
    border-radius:50%;
    border:5px solid #fff;
    object-fit:cover;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.card-body{
    padding:10px 18px 20px;
}

.card-body h3{
    font-size:17px;
    font-weight:700;
    margin-top:8px;
}

.designation{
    color:#ff6b00;
    font-size:12px;
    font-weight:600;
    margin-top:3px;
}

.branch{
    color:#777;
    font-size:11px;
    margin-top:5px;
}

.about{
    color:#666;
    font-size:12px;
    line-height:1.6;
    margin:12px 0;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.view-btn{
    width:100%;
    border:none;
    background:#ff6b00;
    color:#fff;
    padding:11px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    font-size:13px;
}

.view-btn:hover{
    background:#e85d00;
}

.empty{
    text-align:center;
    padding:60px 15px;
    color:#888;
}

.empty i{
    font-size:45px;
    margin-bottom:15px;
}

.loading{
    text-align:center;
    padding:50px;
    color:#777;
}

.loading i{
    font-size:28px;
    margin-bottom:10px;
}

/* Modal */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:500;
    padding:20px;
    overflow-y:auto;
}

.modal.active{
    display:flex;
    align-items:center;
    justify-content:center;
}

.profile-modal{
    width:100%;
    max-width:600px;
    background:#fff;
    border-radius:22px;
    overflow:hidden;
    position:relative;
    animation:show .25s ease;
}

@keyframes show{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.modal-cover{
    height:130px;
    background:
        radial-gradient(circle at 80% 20%,#ffd2ae,transparent 35%),
        linear-gradient(135deg,#fff0e4,#fff);
}

.close{
    position:absolute;
    right:15px;
    top:15px;
    width:35px;
    height:35px;
    border:none;
    border-radius:50%;
    background:#fff;
    cursor:pointer;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.modal-profile{
    text-align:center;
    margin-top:-55px;
    padding:0 25px 25px;
}

.modal-profile img{
    width:110px;
    height:110px;
    border-radius:50%;
    border:5px solid #fff;
    object-fit:cover;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.modal-profile h2{
    font-size:22px;
    margin-top:10px;
}

.modal-designation{
    color:#ff6b00;
    font-weight:600;
    font-size:13px;
}

.modal-about{
    color:#666;
    font-size:13px;
    line-height:1.7;
    margin-top:15px;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:20px;
}

.info{
    background:#f7f8fa;
    padding:12px;
    border-radius:10px;
    text-align:left;
}

.info small{
    display:block;
    color:#888;
    font-size:10px;
}

.info strong{
    display:block;
    font-size:12px;
    margin-top:3px;
    word-break:break-word;
}

.socials{
    display:flex;
    justify-content:center;
    gap:9px;
    margin-top:18px;
}

.socials a{
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#f2f3f5;
    color:#333;
    text-decoration:none;
}

@media(max-width:950px){

    .team-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:700px){

    .team-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:480px){

    .container{
        padding-top:25px;
    }

    .heading h1{
        font-size:25px;
    }

    .team-grid{
        grid-template-columns:1fr;
    }

    .team-card{
        max-width:360px;
        width:100%;
        margin:auto;
    }

    .info-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="header-inner">

        <div class="logo-box">

            <img
            src="https://res.cloudinary.com/ub0qgzwa/image/upload/v1787129547/locffr1xcb7zjnjkmcyp.jpg"
            alt="Diploma Engineers">

            <div>
                <h2>Diploma Engineers</h2>
                <p>Students' Trusted Learning Platform</p>
            </div>

        </div>

        <a href="index.html" class="home-btn">
            <i class="fa-solid fa-house"></i>
            Home
        </a>

    </div>

</header>


<main class="container">

    <div class="heading">

        <h1>
            Meet Our <span>Team</span>
        </h1>

        <p>
            The people working behind Diploma Engineers
        </p>

    </div>


    <div id="teamContainer">

        <div class="loading">

            <i class="fa-solid fa-spinner fa-spin"></i>

            <p>Loading Team...</p>

        </div>

    </div>

</main>


<!-- PROFILE MODAL -->

<div class="modal" id="profileModal">

    <div class="profile-modal">

        <div class="modal-cover"></div>

        <button class="close" onclick="closeProfile()">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="modal-profile">

            <img id="modalPhoto" src="" alt="Profile">

            <h2 id="modalName"></h2>

            <div
                id="modalDesignation"
                class="modal-designation">
            </div>

            <p
                id="modalAbout"
                class="modal-about">
            </p>


            <div class="info-grid">

                <div class="info">

                    <small>Branch</small>

                    <strong id="modalBranch">
                        -
                    </strong>

                </div>


                <div class="info">

                    <small>College / Institute</small>

                    <strong id="modalCollege">
                        -
                    </strong>

                </div>


                <div class="info">

                    <small>Skills</small>

                    <strong id="modalSkills">
                        -
                    </strong>

                </div>


                <div class="info">

                    <small>Location</small>

                    <strong id="modalAddress">
                        -
                    </strong>

                </div>

            </div>


            <div class="socials" id="socials"></div>

        </div>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    get
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAbgQ1lZPgF7mwaxyin7iglla01eDk_tKo",

    authDomain:
        "diplomaengineers-869df.firebaseapp.com",

    databaseURL:
        "https://diplomaengineers-869df-default-rtdb.firebaseio.com",

    projectId:
        "diplomaengineers-869df",

    storageBucket:
        "diplomaengineers-869df.appspot.com",

    messagingSenderId:
        "356779436080",

    appId:
        "1:356779436080:web:4b28da380e547420d0e5f5"

};

const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);


/* =====================================================
   LOAD TEAM
===================================================== */

async function loadTeam(){

    const container =
        document.getElementById("teamContainer");

    try{

        const snapshot =
            await get(
                ref(db,"adminProfiles")
            );


        if(!snapshot.exists()){

            showEmpty();

            return;

        }


        const data =
            snapshot.val();


        const members = [];


        Object.entries(data).forEach(
            ([uid, profile]) => {

                /*
                 Only approved admins
                */

                if(
                    profile.status === "approved"
                ){

                    members.push({
                        uid,
                        ...profile
                    });

                }

            }
        );


        /*
         Owner first
        */

        members.sort((a,b) => {

            if(
                a.email === "astar22072006@gmail.com"
            ) return -1;

            if(
                b.email === "astar22072006@gmail.com"
            ) return 1;

            return (a.name || "")
                .localeCompare(
                    b.name || ""
                );

        });


        if(members.length === 0){

            showEmpty();

            return;

        }


        container.innerHTML = `

            <div class="team-grid">

                ${
                    members
                    .map(createCard)
                    .join("")
                }

            </div>

        `;


    }catch(error){

        console.error(error);

        container.innerHTML = `

            <div class="empty">

                <i class="fa-solid fa-triangle-exclamation"></i>

                <h3>Unable to load team</h3>

                <p>
                    Please try again later.
                </p>

            </div>

        `;

    }

}


/* =====================================================
   CREATE CARD
===================================================== */

function createCard(member){

    const photo =
        member.photo ||
        "https://via.placeholder.com/300x300?text=Profile";


    return `

        <div class="team-card">

            <div class="card-top"></div>


            <div class="profile-wrap">

                <img
                    class="profile-img"
                    src="${safe(photo)}"
                    alt="${safe(member.name)}"
                    onerror="this.src='https://via.placeholder.com/300x300?text=Profile';"
                >

            </div>


            <div class="card-body">

                <h3>
                    ${safe(
                        member.name || "Team Member"
                    )}
                </h3>


                <div class="designation">

                    ${safe(
                        member.designation ||
                        "ADMIN"
                    )}

                </div>


                <div class="branch">

                    ${
                        member.branch
                        ? safe(member.branch)
                        : "Diploma Engineers"
                    }

                </div>


                <p class="about">

                    ${safe(
                        member.about ||
                        "Working with Diploma Engineers."
                    )}

                </p>


                <button
                    class="view-btn"
                    onclick='openProfile(${JSON.stringify(member)})'>

                    <i class="fa-solid fa-user"></i>

                    View Profile

                </button>

            </div>

        </div>

    `;

}


/* =====================================================
   PROFILE
===================================================== */

window.openProfile =
function(member){

    document.getElementById("modalPhoto")
        .src =
        member.photo ||
        "https://via.placeholder.com/300x300?text=Profile";


    document.getElementById("modalName")
        .textContent =
        member.name || "Team Member";


    document.getElementById("modalDesignation")
        .textContent =
        member.designation || "ADMIN";


    document.getElementById("modalAbout")
        .textContent =
        member.about ||
        "Working with Diploma Engineers.";


    document.getElementById("modalBranch")
        .textContent =
        member.branch || "-";


    document.getElementById("modalCollege")
        .textContent =
        member.college || "-";


    document.getElementById("modalSkills")
        .textContent =
        member.skills || "-";


    document.getElementById("modalAddress")
        .textContent =
        member.address || "-";


    createSocialLinks(member);


    document.getElementById("profileModal")
        .classList.add("active");

};


window.closeProfile =
function(){

    document.getElementById("profileModal")
        .classList.remove("active");

};


/* =====================================================
   SOCIAL LINKS
===================================================== */

function createSocialLinks(member){

    const box =
        document.getElementById("socials");

    box.innerHTML = "";


    if(member.whatsapp){

        box.innerHTML += `

            <a
                href="${safe(member.whatsapp)}"
                target="_blank"
                title="WhatsApp">

                <i class="fa-brands fa-whatsapp"></i>

            </a>

        `;

    }


    if(member.telegram){

        box.innerHTML += `

            <a
                href="${safe(member.telegram)}"
                target="_blank"
                title="Telegram">

                <i class="fa-brands fa-telegram"></i>

            </a>

        `;

    }


    if(member.youtube){

        box.innerHTML += `

            <a
                href="${safe(member.youtube)}"
                target="_blank"
                title="YouTube">

                <i class="fa-brands fa-youtube"></i>

            </a>

        `;

    }


    if(member.facebook){

        box.innerHTML += `

            <a
                href="${safe(member.facebook)}"
                target="_blank"
                title="Facebook">

                <i class="fa-brands fa-facebook"></i>

            </a>

        `;

    }


    if(member.website){

        box.innerHTML += `

            <a
                href="${safe(member.website)}"
                target="_blank"
                title="Website">

                <i class="fa-solid fa-globe"></i>

            </a>

        `;

    }

}


/* =====================================================
   EMPTY
===================================================== */

function showEmpty(){

    document.getElementById("teamContainer")
        .innerHTML = `

        <div class="empty">

            <i class="fa-solid fa-users"></i>

            <h3>No Team Members Yet</h3>

            <p>
                Approved team members will appear here.
            </p>

        </div>

    `;

}


/* =====================================================
   SAFE HTML
===================================================== */

function safe(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   CLOSE MODAL ON BACKGROUND CLICK
===================================================== */

document.getElementById("profileModal")
.addEventListener("click",function(e){

    if(e.target === this){

        closeProfile();

    }

});


/* =====================================================
   START
===================================================== */

loadTeam();

</script>

</body>
</html>
