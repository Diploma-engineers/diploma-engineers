<style>

*{
    box-sizing:border-box;
}

.achievement-section{

    padding:80px 20px;
    background:
    linear-gradient(135deg,#ffffff,#f4f8ff);

    overflow:hidden;
    position:relative;

}


/* Background Floating Light */

.achievement-section::before{

    content:"";
    position:absolute;
    width:400px;
    height:400px;
    background:#2563eb;
    opacity:.08;
    filter:blur(80px);
    border-radius:50%;
    top:-150px;
    left:-150px;

    animation:floatLight 8s infinite alternate;

}


.achievement-section::after{

    content:"";
    position:absolute;
    width:350px;
    height:350px;
    background:#38bdf8;
    opacity:.10;
    filter:blur(90px);
    border-radius:50%;
    bottom:-150px;
    right:-100px;

    animation:floatLight 10s infinite alternate;

}


@keyframes floatLight{

from{
transform:translate(0,0);
}

to{
transform:translate(60px,40px);
}

}



.container{

max-width:1200px;
margin:auto;
position:relative;
z-index:2;

}



.title{

text-align:center;
font-size:42px;
font-weight:800;
color:#0f172a;

margin-bottom:10px;

animation:fadeDown 1s ease;

}



.subtitle{

text-align:center;
font-size:18px;
color:#64748b;
margin-bottom:50px;

animation:fadeUp 1.2s ease;

}



/* Cards Layout */

.cards{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:30px;

}



/* Card Design */

.card{

background:rgba(255,255,255,.75);

border:1px solid rgba(255,255,255,.8);

border-radius:25px;

padding:35px 20px;

text-align:center;

box-shadow:

0 15px 35px rgba(0,0,0,.08);

backdrop-filter:blur(15px);

transition:.5s;

position:relative;

overflow:hidden;


animation:cardShow .8s ease forwards;


}



.card::before{

content:"";

position:absolute;

width:100%;
height:100%;

background:
linear-gradient(
120deg,
transparent,
rgba(255,255,255,.8),
transparent
);

top:-100%;
left:-100%;

transition:.7s;

}



.card:hover::before{

top:100%;
left:100%;

}




.card:hover{

transform:
translateY(-15px)
scale(1.03);

box-shadow:

0 25px 60px rgba(37,99,235,.25);

}



/* Icon */


.icon{

font-size:55px;

margin-bottom:20px;

display:inline-block;

animation:bounce 3s infinite;

}




@keyframes bounce{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-10px);

}

}



/* Counter */

.counter{

font-size:48px;

font-weight:900;

color:#2563eb;

margin:10px 0;


text-shadow:

0 5px 20px rgba(37,99,235,.25);


}



.card h3{

font-size:24px;

color:#111827;

margin-bottom:10px;

}



.card p{

color:#64748b;

font-size:15px;

}



/* Animations */


@keyframes fadeDown{

from{

opacity:0;
transform:translateY(-40px);

}

to{

opacity:1;
transform:translateY(0);

}

}



@keyframes fadeUp{

from{

opacity:0;
transform:translateY(40px);

}

to{

opacity:1;
transform:translateY(0);

}

}




@keyframes cardShow{

from{

opacity:0;
transform:translateY(60px);

}

to{

opacity:1;
transform:translateY(0);

}

}



/* Mobile */

@media(max-width:600px){

.title{

font-size:32px;

}

.subtitle{

font-size:15px;

}

.card{

padding:30px 15px;

}

.counter{

font-size:40px;

}

}


</style>
