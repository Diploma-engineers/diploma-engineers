<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Civil Engineering Study Library App - Premium Batches</title>

<!-- Google Fonts & Font Awesome Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --secondary: #0f172a;
  --accent: #f97316;
  --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #e0e8ff 50%, #f5f3ff 100%);
  --card-bg: #ffffff;
  --text-dark: #0f172a;
  --text-muted: #64748b;
  --border-color: #e2e8f0;
  --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Plus Jakarta Sans', sans-serif;
  scroll-behavior: smooth;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text-dark);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* APP HEADER */
header {
  background: rgba(15, 23, 42, 0.95);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: #fff;
  padding: 14px 20px;
  position: sticky;
  top: 0;
  z-index: 1000;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.header-container {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 1200px;
  margin: 0 auto;
}

.brand-title {
  font-size: 18px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 10px;
  letter-spacing: -0.3px;
}

.user-status-badge {
  background: rgba(255, 255, 255, 0.15);
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
}

/* MAIN CONTENT CONTAINER */
main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px 16px 40px;
  width: 100%;
  flex: 1;
}

.branch-section {
  display: none;
  animation: fadeIn 0.35s ease-in-out forwards;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.section-header {
  text-align: center;
  margin: 20px 0 24px;
}

.section-header h2 {
  font-size: 24px;
  font-weight: 800;
  color: var(--secondary);
  letter-spacing: -0.5px;
}

.section-header p {
  color: var(--text-muted);
  font-size: 13.5px;
  margin-top: 4px;
}

/* APP GRID SYSTEM */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}

/* --- COURSE CARD STYLING --- */
.course-card {
  background: #ffffff;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border: 1px solid var(--border-color);
  transition: all 0.3s ease;
  position: relative;
}

.course-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 20px 30px -5px rgba(15, 23, 42, 0.12);
}

.course-header-banner {
  padding: 20px 18px;
  color: #fff;
  position: relative;
}

.badge-tag {
  position: absolute;
  top: 14px;
  right: 14px;
  background: rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(6px);
  padding: 4px 10px;
  font-size: 10.5px;
  font-weight: 800;
  border-radius: 20px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.course-icon-title {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}

.course-icon-title i {
  font-size: 24px;
}

.course-header-banner h3 {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.3px;
  line-height: 1.3;
}

.course-subtitle {
  font-size: 12.5px;
  opacity: 0.9;
  font-weight: 500;
}

.course-body {
  padding: 16px 18px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.rating-box {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 700;
  color: #1e293b;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px dashed #e2e8f0;
}

.rating-box i {
  color: #eab308;
}

.rating-box span {
  color: var(--text-muted);
  font-weight: 500;
  font-size: 12px;
}

.feature-list {
  list-style: none;
  margin-bottom: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.feature-list li {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  color: #334155;
  font-weight: 600;
}

.feature-list li i {
  color: #16a34a;
  font-size: 13px;
  flex-shrink: 0;
}

/* Card Footer Pricing & Buy Button */
.course-footer {
  padding: 14px 18px;
  background: #f8fafc;
  border-top: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.price-details {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.current-price {
  font-size: 20px;
  font-weight: 800;
  color: #0f172a;
}

.old-price {
  font-size: 12px;
  text-decoration: line-through;
  color: var(--text-muted);
  font-weight: 600;
}

.discount-badge {
  background: #dcfce7;
  color: #15803d;
  font-size: 10px;
  font-weight: 800;
  padding: 2px 6px;
  border-radius: 6px;
}

.btn-enroll {
  background: #16a34a;
  color: #fff;
  border: none;
  padding: 10px 16px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  transition: all 0.2s ease;
  box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
}

.btn-enroll:hover {
  background: #15803d;
  transform: translateY(-2px);
}

.btn-access {
  background: var(--primary);
  color: #fff;
  border: none;
  padding: 10px 16px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  transition: all 0.2s ease;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
  width: 100%;
  justify-content: center;
}

/* Theme Gradients */
.theme-purple { background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%); }
.theme-green { background: linear-gradient(135deg, #059669 0%, #10b981 100%); }
.theme-blue { background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%); }
.theme-orange { background: linear-gradient(135deg, #c2410c 0%, #ea580c 100%); }
.theme-darkred { background: linear-gradient(135deg, #991b1b 0%, #dc2626 100%); }

/* DEBUG & SIMULATOR PANEL FOR TESTING PAYMENTS */
.dev-controls {
  background: #1e293b;
  color: #fff;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
}

.dev-controls button {
  background: var(--accent);
  border: none;
  padding: 6px 12px;
  color: #fff;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}
</style>
</head>

<body>

  <header>
    <div class="header-container">
      <div class="brand-title"><i class="fas fa-graduation-cap"></i> Civil Engineering Library</div>
      <div class="user-status-badge" id="userStatusIndicator">Checking User Data...</div>
    </div>
  </header>

  <main>
    <!-- DEV/USER STATE SIMULATOR PANEL -->
    <div class="dev-controls">
      <span id="paymentStatusText">Status: Unpaid User</span>
      <div>
        <button onclick="simulatePayment(true)">Simulate Payment Done</button>
        <button onclick="simulatePayment(false)" style="background:#64748b;">Reset / Unpaid</button>
      </div>
    </div>

    <!-- PREMIUM COURSE BUYING / ACCESS PAGE SECTION -->
    <div id="courses" class="branch-section" style="display:block;">
      <div class="section-header">
        <h2>Explore Online Batches</h2>
        <p>High-quality structured programs designed for academic excellence[cite: 2]</p>
      </div>

      <div class="grid" id="courseGridContainer">
        <!-- Dynamic Cards Injected via Script depending on payment cache -->
      </div>
    </div>
  </main>

<script>
// Mock Database of Courses with Cash/Full Payment details
const coursesData = [
  {
    id: "sem1_full",
    title: "Semester 1 Full Batch",
    subtitle: "For All Branches (Common)",
    badge: "Bestseller",
    icon: "fas fa-shapes",
    theme: "theme-purple",
    rating: "4.9 (1,240 Reviews)",
    price: "₹499",
    oldPrice: "₹1,499",
    discount: "66% OFF",
    features: [
      "Maths-I, Physics-I, Chemistry & CS",
      "Chapter-wise HD Recorded Lectures",
      "Handwritten Printable PDF Notes",
      "Last 5 Years PYQ Video Solutions",
      "Dedicated WhatsApp Doubt Group"
    ],
    checkoutUrl: "https://diplomaengineers.vercel.app/aa.html",
    contentUrl: "https://anubhavfinance.wordpress.com/wp-content/uploads/2026/05/appliedphysics-iie-bookbydiplomaengineers28129-2.pdf"
  },
  {
    id: "civil_special",
    title: "Civil Engg. Special Batch",
    subtitle: "Core Subjects + Practical Concept",
    badge: "Popular",
    icon: "fas fa-hard-hat",
    theme: "theme-green",
    rating: "4.8 (890 Reviews)",
    price: "₹599",
    oldPrice: "₹1,999",
    discount: "70% OFF",
    features: [
      "SOM, Surveying, Building Materials",
      "100+ Video lectures & Diagrams",
      "Quick Revision Formula Sheets",
      "Board Exam Important Questions",
      "Practical & Practical File PDFs"
    ],
    checkoutUrl: "https://rzp.io/l/civil-special-batch",
    contentUrl: "https://anubhavfinance.wordpress.com/wp-content/uploads/2026/05/appliedphysics-iie-bookbydiplomaengineers28129-2.pdf"
  },
  {
    id: "cs_master",
    title: "CS & IT Master Batch",
    subtitle: "Coding + Syllabus Subjects",
    badge: "Featured",
    icon: "fas fa-laptop-code",
    theme: "theme-blue",
    rating: "4.9 (1,450 Reviews)",
    price: "₹699",
    oldPrice: "₹2,499",
    discount: "72% OFF",
    features: [
      "C/C++, Python, DBMS & Web Dev",
      "Practical Live Code Walkthroughs",
      "Complete Board Exam Notes",
      "Final Year Project Guidance",
      "Certificate of Completion"
    ],
    checkoutUrl: "https://rzp.io/l/cs-master-batch",
    contentUrl: "https://anubhavfinance.wordpress.com/wp-content/uploads/2026/05/appliedphysics-iie-bookbydiplomaengineers28129-2.pdf"
  }
];

// USER ID & CACHE MANAGER
function getUserId() {
  let uid = localStorage.getItem('de_user_id');
  if (!uid) {
    uid = 'USER_' + Math.floor(100000 + Math.random() * 900000);
    localStorage.setItem('de_user_id', uid);
  }
  return uid;
}

function checkUserPaymentStatus() {
  const userId = getUserId();
  // Fetch cached status from local storage
  const isPaid = localStorage.getItem('de_payment_' + userId) === 'true';
  return { userId, isPaid };
}

function simulatePayment(status) {
  const { userId } = checkUserPaymentStatus();
  localStorage.setItem('de_payment_' + userId, status ? 'true' : 'false');
  renderAppViews();
}

// RENDER APP DYNAMICALLY BASED ON PAYMENT CACHE
function renderAppViews() {
  const { userId, isPaid } = checkUserPaymentStatus();
  
  // Update header indicator
  document.getElementById('userStatusIndicator').innerText = `ID: ${userId} (${isPaid ? 'Active Full Pass' : 'Unpaid'})`;
  document.getElementById('paymentStatusText').innerText = `Status: ${isPaid ? 'Full Payment Completed ✅' : 'Payment Pending ❌'}`;

  const container = document.getElementById('courseGridContainer');
  container.innerHTML = '';

  coursesData.forEach(course => {
    const card = document.createElement('div');
    card.className = 'course-card';

    let actionHTML = '';
    if (isPaid) {
      // UNLOCKED VIEW: User has already paid from this User ID
      actionHTML = `
        <div class="course-footer" style="background:#f0fdf4;">
          <a href="${course.contentUrl}" target="_blank" class="btn-access">
            <i class="fas fa-play-circle"></i> Access Full Course & Videos
          </a>
        </div>
      `;
    } else {
      // PAYMENT GATEWAY VIEW: One-time single payment flow
      actionHTML = `
        <div class="course-footer">
          <div class="price-details">
            <span class="current-price">${course.price}</span>
            <span class="old-price">${course.oldPrice}</span>
            <span class="discount-badge">${course.discount}</span>
          </div>
          <a href="${course.checkoutUrl}" target="_blank" onclick="handleDirectPayment('${course.id}')" class="btn-enroll">
            Pay Full & Enroll <i class="fas fa-arrow-right"></i>
          </a>
        </div>
      `;
    }

    card.innerHTML = `
      <div>
        <div class="course-header-banner ${course.theme}">
          <span class="badge-tag">${course.badge}</span>
          <div class="course-icon-title">
            <i class="${course.icon}"></i>
            <h3>${course.title}</h3>
          </div>
          <div class="course-subtitle">${course.subtitle}</div>
        </div>
        <div class="course-body">
          <div class="rating-box">
            <i class="fas fa-star"></i> ${course.rating}
          </div>
          <ul class="feature-list">
            ${course.features.map(f => `<li><i class="fas fa-check-circle"></i> ${f}</li>`).join('')}
          </ul>
        </div>
      </div>
      ${actionHTML}
    `;
    container.appendChild(card);
  });
}

function handleDirectPayment(courseId) {
  // Simulates automatic entry flag caching upon checkout link click
  const { userId } = checkUserPaymentStatus();
  localStorage.setItem('de_pending_course', courseId);
  // In a live integration, this triggers Razorpay / Gateway. Upon return, isPaid is set true.
}

// Initial Load execution
window.onload = function() {
  renderAppViews();
};
</script>

</body>
</html>
