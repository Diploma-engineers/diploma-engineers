<style>


*{
box-sizing:border-box;
}



/* MAIN LOADER */

#loader{

position:fixed;

height:100vh;
width:100%;

top:0;
left:0;

display:flex;

align-items:center;
justify-content:center;

background:
radial-gradient(circle at center,
#e0f7ff,
#ffffff 45%,
#dbeafe);


z-index:99999;

overflow:hidden;

font-family:'Poppins',sans-serif;

}



/* ENGINEERING GRID */


.tech-bg{

position:absolute;

width:100%;
height:100%;


background-image:

linear-gradient(
rgba(0,150,255,.12) 1px,
transparent 1px
),

linear-gradient(
90deg,
rgba(0,150,255,.12) 1px,
transparent 1px
);


background-size:
40px 40px;


animation:gridMove 8s linear infinite;

}



@keyframes gridMove{

from{
transform:translateY(0);
}

to{
transform:translateY(40px);
}

}



/* GLASS CARD */


.loader-card{


position:relative;

width:420px;

padding:45px 35px;


text-align:center;


background:

rgba(255,255,255,.65);


backdrop-filter:blur(15px);


border-radius:30px;


box-shadow:

0 25px 60px rgba(0,100,200,.25);


border:
1px solid rgba(255,255,255,.8);


}



/* LOGO AREA */


.logo-box{


width:210px;
height:210px;


margin:auto;


position:relative;


display:flex;

align-items:center;

justify-content:center;


}



.logo-box img{


width:100px;
height:100px;


border-radius:50%;


object-fit:cover;


z-index:5;


box-shadow:

0 0 35px #00c6ff;


}




/* OUTER TECH RINGS */


.outer-ring{


position:absolute;


width:210px;
height:210px;


border-radius:50%;


border:

4px dashed #00c6ff;


animation:spin 8s linear infinite;


}



.inner-ring{


position:absolute;


width:160px;
height:160px;


border-radius:50%;


border:

3px solid transparent;


border-top-color:#ff3cac;

border-bottom-color:#784ba0;


animation:spinReverse 4s linear infinite;


}



@keyframes spin{

100%{

transform:rotate(360deg);

}

}



@keyframes spinReverse{

100%{

transform:rotate(-360deg);

}

}





.pulse{


position:absolute;


width:120px;
height:120px;


border-radius:50%;


background:#00c6ff;


opacity:.25;


animation:pulse 2s infinite;


}



@keyframes pulse{


50%{

transform:scale(1.5);

opacity:0;

}

}





/* TITLE */


h1{


margin-top:35px;


font-size:38px;


font-weight:900;


color:#0f172a;


letter-spacing:1px;


}


h1 span{

color:#009cff;

}




.tagline{


font-size:13px;


letter-spacing:5px;


margin-top:12px;


color:#64748b;


font-weight:600;


}





/* STATUS */


.status{


display:flex;


justify-content:center;


align-items:center;


gap:10px;


margin-top:35px;


color:#475569;


font-size:14px;


}



.icon{


font-size:25px;


animation:gear 2s linear infinite;


}



@keyframes gear{


100%{

transform:rotate(360deg);

}

}




/* PROGRESS */


.progress{


height:8px;


width:280px;


background:#e2e8f0;


border-radius:20px;


margin:25px auto 10px;


overflow:hidden;


}



.progress-bar{


height:100%;


width:0;


background:


linear-gradient(
90deg,
#00c6ff,
#2563eb,
#ff3cac
);



animation:progress 4s forwards;


}



@keyframes progress{


100%{

width:100%;

}

}




.percent{


font-size:13px;


color:#64748b;


}



</style>





<script>


let count=0;


let counter=setInterval(()=>{


count++;


document.getElementById("count").innerHTML=count;


if(count>=100)

clearInterval(counter);


},40);





// REMOVE LOADER AFTER PAGE LOAD

window.addEventListener("load",()=>{


setTimeout(()=>{


document.getElementById("loader").style.opacity="0";


document.getElementById("loader").style.transition="1s";


setTimeout(()=>{

document.getElementById("loader").remove();

},1000);



},1500);



});


</script>
