<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Diploma Engineers • Purchase Approval</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Poppins,Arial,sans-serif}.wrap{max-width:1150px;margin:auto;padding:18px}.top{background:#fff;border-radius:18px;padding:18px 20px;box-shadow:0 8px 28px rgba(0,0,0,.07);display:flex;justify-content:space-between;align-items:center;gap:15px}.brand h1{margin:0;font-size:22px}.brand p{margin:5px 0 0;color:#667085;font-size:12px}.btn{border:0;border-radius:10px;padding:11px 15px;font:700 13px Poppins;cursor:pointer}.refresh{background:#eef2ff;color:#3730a3}.danger{background:#fee2e2;color:#b91c1c}.notice{margin:14px 0;padding:12px 14px;border-radius:12px;background:#fff7ed;color:#9a3412;font-size:12px}.notice.ok{background:#ecfdf3;color:#166534}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0}.stat{background:#fff;border-radius:14px;padding:15px;box-shadow:0 5px 20px rgba(0,0,0,.05)}.stat b{display:block;font-size:12px;color:#667085}.stat span{font-size:25px;font-weight:800}.pending span{color:#d97706}.verified span{color:#16a34a}.rejected span{color:#dc2626}.tabs{display:flex;gap:8px;margin:14px 0}.tab{background:#fff;border:1px solid #e2e8f0;color:#334155}.tab.active{background:#111827;color:#fff}.request{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 6px 24px rgba(0,0,0,.06)}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.user{display:flex;align-items:center;gap:13px}.avatar{width:60px;height:60px;border-radius:50%;overflow:hidden;background:#e8eef8;display:grid;place-items:center;font-weight:800;font-size:21px;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.course{font-size:17px;font-weight:800}.muted{font-size:12px;color:#667085}.amount{background:#ecfdf3;color:#15803d;border-radius:9px;padding:7px 11px;font-weight:800;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.item{background:#f8fafc;border-radius:10px;padding:11px}.item b{display:block;font-size:10px;color:#667085;margin-bottom:4px}.item span{font-size:13px;font-weight:600;word-break:break-word}.utr{font-size:18px!important;letter-spacing:1px;color:#7c3aed!important}.actions{display:flex;gap:10px}.approve{background:#16a34a;color:#fff;flex:1}.reject{background:#fee2e2;color:#b91c1c}.course-link{background:#eff6ff;color:#1d4ed8;flex:1}.empty{text-align:center;padding:42px;background:#fff;border-radius:18px;color:#667085}.error{background:#fef2f2;color:#991b1b;padding:16px;border-radius:14px}.small{font-size:11px;opacity:.85}@media(max-width:700px){.wrap{padding:10px}.top,.head{align-items:flex-start;flex-direction:column}.stats,.grid{grid-template-columns:1fr}.actions{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div id="loginBox" class="top" style="display:block;max-width:460px;margin:40px auto">
    <div class="brand"><h1><i class="fa-solid fa-shield-halved"></i> Admin Purchase Approval</h1><p>Login with the authorized admin Firebase account.</p></div>
    <div style="margin-top:16px"><input id="adminEmail" type="email" placeholder="Admin Email" autocomplete="username" style="width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:10px;margin-bottom:10px;font:500 14px Poppins"><input id="adminPassword" type="password" placeholder="Password" autocomplete="current-password" style="width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:10px;font:500 14px Poppins"><button class="btn approve" id="adminLogin" style="width:100%;margin-top:12px">Login</button><div id="loginError" class="error" style="display:none;margin-top:12px"></div></div>
  </div>
  <div id="adminApp" style="display:none">
    <div class="top"><div class="brand"><h1><i class="fa-solid fa-shield-halved"></i> Purchase Approval</h1><p>Diploma Engineers • ₹99 UPI / UTR verification</p></div><button class="btn danger" id="logoutBtn">Logout</button><button class="btn refresh" id="refreshBtn"><i class="fa-solid fa-rotate"></i> Refresh</button></div>
    <div id="notice" class="notice">Connecting to Firebase...</div>
    <div class="stats"><div class="stat pending"><b>Pending</b><span id="pendingCount">0</span></div><div class="stat verified"><b>Verified</b><span id="verifiedCount">0</span></div><div class="stat rejected"><b>Rejected</b><span id="rejectedCount">0</span></div></div>
    <div class="tabs"><button class="btn tab active" data-filter="pending">Pending</button><button class="btn tab" data-filter="verified">Verified</button><button class="btn tab" data-filter="rejected">Rejected</button></div>
    <div id="list"><div class="empty">Login to load purchase requests.</div></div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getDatabase, ref, onValue, get, update, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
const ADMIN_EMAIL="astar22072206@gmail.com";
const firebaseConfig={apiKey:"AIzaSyCxe9H7zSxJQzgM8bN_UAdOnDHr5myH6CQ",authDomain:"diploma-app-9a378.firebaseapp.com",databaseURL:"https://diploma-app-9a378-default-rtdb.firebaseio.com",projectId:"diploma-app-9a378",storageBucket:"diploma-app-9a378.firebasestorage.app",messagingSenderId:"160233059797",appId:"1:160233059797:web:be38130ed64f8bd0afb95c6"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
const COURSE_FILES={"civil-year-2-course":"civil-year-2-course.html","mechanical-year-2-course":"mechanical-year-2-course.html","cs-year-2-course":"cs-year-2-course.html","it-year-2-course":"it-year-2-course.html","electrical-year-2-course":"electrical-year-2-course.html","electronics-year-2-course":"electronics-year-2-course.html","agriculture-year-2-course":"agriculture-year-2-course.html","chemical-year-2-course":"chemical-year-2-course.html"};
let rows=[],filter="pending",stopListening=null;const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>'"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':'&quot;'}[m]));const fmt=v=>v?new Date(Number(v)).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"}):"-";
function notice(t,ok=false){$("notice").className="notice"+(ok?" ok":"");$("notice").innerHTML=t}
function render(){const c={pending:0,verified:0,rejected:0};rows.forEach(x=>{const s=String(x.status||"pending").toLowerCase();if(c[s]!=null)c[s]++});$("pendingCount").textContent=c.pending;$("verifiedCount").textContent=c.verified;$("rejectedCount").textContent=c.rejected;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.filter===filter));const data=rows.filter(x=>String(x.status||"pending").toLowerCase()===filter);if(!data.length){$("list").innerHTML=`<div class="empty">No ${filter} requests.</div>`;return}$("list").innerHTML=data.map(d=>{const name=d.name||"Engineer",branch=d.branch||"-",pic=d.profilePic||"",avatar=pic?`<img src="${esc(pic)}" alt="Profile">`:esc((name.trim()[0]||"E").toUpperCase());return `<article class="request"><div class="head"><div class="user"><div class="avatar">${avatar}</div><div><div class="course">${esc(d.courseName||d.courseId)}</div><div class="muted">${esc(name)} • ${esc(branch)} • ${esc(d.email||"-")}</div></div></div><div class="amount">₹${esc(d.amount||99)}</div></div><div class="grid"><div class="item"><b>NAME</b><span>${esc(name)}</span></div><div class="item"><b>BRANCH</b><span>${esc(branch)}</span></div><div class="item"><b>MOBILE</b><span>${esc(d.mobile||"-")}</span></div><div class="item"><b>COURSE</b><span>${esc(d.courseName||d.courseId)}</span></div><div class="item"><b>UTR</b><span class="utr">${esc(d.utr||"-")}</span></div><div class="item"><b>SUBMITTED</b><span>${esc(fmt(d.submittedAt))}</span></div></div><div class="actions">${filter==="pending"?`<button class="btn approve" data-action="approve" data-uid="${esc(d.uid)}" data-course="${esc(d.courseId)}" data-key="${esc(d.purchaseKey)}">✓ Approve & Give Access</button><button class="btn reject" data-action="reject" data-uid="${esc(d.uid)}" data-course="${esc(d.courseId)}" data-key="${esc(d.purchaseKey)}">✕ Reject</button>`:`<button class="btn course-link" onclick="window.open('${esc(COURSE_FILES[d.courseId]||"")}','_blank')">Open Course File</button>`}</div></article>`}).join("")}
async function load(){if(stopListening)stopListening();notice("Loading live requests…");stopListening=onValue(ref(db,"utrPurchases"),snap=>{const out=[];if(snap.exists())snap.forEach(u=>u.forEach(c=>c.forEach(p=>out.push({uid:u.key,courseId:c.key,purchaseKey:p.key,...(p.val()||{})}))));rows=out.sort((a,b)=>(Number(b.submittedAt)||0)-(Number(a.submittedAt)||0));notice("Firebase connected • Verify the UTR in your payment records before approving.",true);render()},err=>{notice("Firebase read failed: "+esc(err.message));$("list").innerHTML='<div class="error">Database permission denied. Publish the secure rules supplied with this app.</div>'})}
async function approve(uid,courseId,key){if(!confirm("Confirm the ₹99 payment/UTR before approving?"))return;try{const p=ref(db,`utrPurchases/${uid}/${courseId}/${key}`),s=await get(p);if(!s.exists())throw Error("Purchase not found");const d=s.val()||{},now=Date.now();await update(p,{status:"verified",verified:true,verifiedAt:now,verifiedBy:ADMIN_EMAIL});await set(ref(db,`courseAccess/${uid}/${courseId}`),{uid,courseId,courseName:d.courseName||courseId,amount:99,currency:"INR",utr:d.utr||"",verified:true,status:"verified",purchaseId:d.purchaseId||key,grantedAt:now,verifiedBy:ADMIN_EMAIL});alert("Approved. Course access granted.");}catch(e){alert("Approve failed: "+e.message)}}
async function reject(uid,courseId,key){if(!confirm("Reject this payment request?"))return;try{await update(ref(db,`utrPurchases/${uid}/${courseId}/${key}`),{status:"rejected",rejectedAt:Date.now(),rejectedBy:ADMIN_EMAIL});}catch(e){alert("Reject failed: "+e.message)}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const a=[b.dataset.uid,b.dataset.course,b.dataset.key];b.dataset.action==="approve"?approve(...a):reject(...a)});document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});$("refreshBtn").onclick=load;$("logoutBtn").onclick=()=>signOut(auth);$("adminLogin").onclick=async()=>{const email=$("adminEmail").value.trim().toLowerCase(),pass=$("adminPassword").value;if(email!==ADMIN_EMAIL){$("loginError").style.display="block";$("loginError").textContent="Only the authorized admin email can access this panel.";return}if(!pass){$("loginError").style.display="block";$("loginError").textContent="Enter admin password.";return}try{await signInWithEmailAndPassword(auth,email,pass);$("loginError").style.display="none"}catch(e){$("loginError").style.display="block";$("loginError").textContent="Login failed: "+e.message}};
onAuthStateChanged(auth,user=>{if(user&&user.email?.toLowerCase()===ADMIN_EMAIL){$("loginBox").style.display="none";$("adminApp").style.display="block";load()}else{$("loginBox").style.display="block";$("adminApp").style.display="none";if(user)signOut(auth)}});
</script>
</body>
</html>
