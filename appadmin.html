<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Diploma Engineers • Course Approval Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#172033;font-family:Poppins,Arial,sans-serif}
.wrap{max-width:1180px;margin:auto;padding:18px}
.top{background:#fff;border-radius:18px;padding:18px 20px;box-shadow:0 8px 28px rgba(0,0,0,.07);display:flex;justify-content:space-between;align-items:center;gap:15px}
.brand h1{margin:0;font-size:22px}.brand p{margin:5px 0 0;color:#667085;font-size:12px}
.btn{border:0;border-radius:10px;padding:11px 15px;font:700 13px Poppins;cursor:pointer}
.btn:disabled{opacity:.55;cursor:not-allowed}
.refresh{background:#eef2ff;color:#3730a3}
.notice{margin:14px 0;padding:12px 14px;border-radius:12px;background:#fff7ed;color:#9a3412;font-size:12px}
.notice.ok{background:#ecfdf3;color:#166534}
.notice.err{background:#fef2f2;color:#991b1b}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}
.stat{background:#fff;border-radius:14px;padding:15px;box-shadow:0 5px 20px rgba(0,0,0,.05)}
.stat b{display:block;font-size:12px;color:#667085}.stat span{font-size:25px;font-weight:800}
.pending span{color:#d97706}.verified span{color:#16a34a}.rejected span{color:#dc2626}.total span{color:#2563eb}
.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.tab{background:#fff;border:1px solid #e2e8f0;color:#334155}.tab.active{background:#111827;color:#fff}
.request{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.user{display:flex;align-items:center;gap:13px}.avatar{width:62px;height:62px;border-radius:50%;overflow:hidden;background:#e8eef8;display:grid;place-items:center;font-weight:800;font-size:21px;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}.course{font-size:17px;font-weight:800}.muted{font-size:12px;color:#667085}
.amount{background:#ecfdf3;color:#15803d;border-radius:9px;padding:7px 11px;font-weight:800;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.item{background:#f8fafc;border-radius:10px;padding:11px}.item b{display:block;font-size:10px;color:#667085;margin-bottom:4px}
.item span{font-size:13px;font-weight:600;word-break:break-word}.utr{font-size:18px!important;letter-spacing:1px;color:#7c3aed!important}
.actions{display:flex;gap:10px}.approve{background:#16a34a;color:#fff;flex:1}.reject{background:#fee2e2;color:#b91c1c;flex:1}
.course-link{background:#eff6ff;color:#1d4ed8;flex:1}.empty{text-align:center;padding:42px;background:#fff;border-radius:18px;color:#667085}
.error{background:#fef2f2;color:#991b1b;padding:16px;border-radius:14px}.small{font-size:11px;opacity:.85}
.photo-note{font-size:10px;color:#667085;margin-top:5px}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.wrap{padding:10px}.top,.head{align-items:flex-start;flex-direction:column}.stats,.grid{grid-template-columns:1fr}.actions{flex-direction:column}.amount{align-self:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <h1><i class="fa-solid fa-shield-halved"></i> Course Approval Admin</h1>
      <p>Diploma Engineers • ₹99 UPI / UTR verification</p>
    </div>
    <button class="btn refresh" id="refreshBtn"><i class="fa-solid fa-rotate"></i> Refresh</button>
  </div>

  <div id="notice" class="notice">Connecting to Firebase...</div>

  <div class="stats">
    <div class="stat total"><b>Total Requests</b><span id="totalCount">0</span></div>
    <div class="stat pending"><b>Pending</b><span id="pendingCount">0</span></div>
    <div class="stat verified"><b>Verified</b><span id="verifiedCount">0</span></div>
    <div class="stat rejected"><b>Rejected</b><span id="rejectedCount">0</span></div>
  </div>

  <div class="tabs">
    <button class="btn tab active" data-filter="pending">Pending</button>
    <button class="btn tab" data-filter="verified">Verified</button>
    <button class="btn tab" data-filter="rejected">Rejected</button>
    <button class="btn tab" data-filter="all">All</button>
  </div>

  <div id="list">
    <div class="empty"><i class="fa-solid fa-spinner fa-spin"></i> Loading purchase requests...</div>
  </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {getAuth,signInAnonymously,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {getDatabase,ref,onValue,get,update,set} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyCxe9H7zSxJQzgM8bN_UAdOnDHr5myH6CQ",
  authDomain:"diploma-app-9a378.firebaseapp.com",
  databaseURL:"https://diploma-app-9a378-default-rtdb.firebaseio.com",
  projectId:"diploma-app-9a378",
  storageBucket:"diploma-app-9a378.firebasestorage.app",
  messagingSenderId:"160233059797",
  appId:"1:160233059797:web:be38130ed64f8bd0afb95c",
  measurementId:"G-9646VK4C6L"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

const COURSE_FILES={
 "civil-year-2-course":"civil-year-2-course.html",
 "mechanical-year-2-course":"mechanical-year-2-course.html",
 "cs-year-2-course":"cs-year-2-course.html",
 "it-year-2-course":"it-year-2-course.html",
 "electrical-year-2-course":"electrical-year-2-course.html",
 "electronics-year-2-course":"electronics-year-2-course.html",
 "agriculture-year-2-course":"agriculture-year-2-course.html",
 "chemical-year-2-course":"chemical-year-2-course.html"
};

let rows=[];
let filter="pending";
let stopListening=null;
let starting=false;

const $=id=>document.getElementById(id);

function esc(v){
  return String(v??"").replace(/[&<>'"]/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"
  }[m]));
}

function fmt(v){
  if(!v)return "-";
  const n=Number(v);
  if(!Number.isFinite(n))return "-";
  return new Date(n).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"});
}

function statusOf(d){
  return String(d.status||"pending").toLowerCase();
}

function courseFile(id){
  return COURSE_FILES[id]||"";
}

function setNotice(text,type="warn"){
  $("notice").className="notice"+(type==="ok"?" ok":type==="err"?" err":"");
  $("notice").innerHTML=text;
}

function render(){
  const counts={pending:0,verified:0,rejected:0};
  rows.forEach(x=>{
    const s=statusOf(x);
    if(counts[s]!==undefined)counts[s]++;
  });

  $("totalCount").textContent=rows.length;
  $("pendingCount").textContent=counts.pending;
  $("verifiedCount").textContent=counts.verified;
  $("rejectedCount").textContent=counts.rejected;

  document.querySelectorAll(".tab").forEach(b=>{
    b.classList.toggle("active",b.dataset.filter===filter);
  });

  const data=filter==="all"
    ? rows
    : rows.filter(x=>statusOf(x)===filter);

  if(!data.length){
    $("list").innerHTML=
      `<div class="empty">
        <i class="fa-solid fa-circle-check" style="font-size:28px"></i>
        <p>No ${esc(filter)} requests.</p>
      </div>`;
    return;
  }

  $("list").innerHTML=data.map(d=>{
    const name=d.name||"Engineer";
    const branch=d.branch||"Diploma Member";
    const pic=d.profilePic||d.photoURL||"";
    const initial=(name.trim()[0]||"E").toUpperCase();
    const avatar=pic
      ? `<img src="${esc(pic)}" alt="Profile" onerror="this.parentElement.innerHTML='${initial}'">`
      : initial;

    const file=courseFile(d.courseId);
    const s=statusOf(d);

    let actions="";
    if(s==="pending"){
      actions=`
        <button class="btn approve"
          data-action="approve"
          data-uid="${esc(d.uid)}"
          data-course="${esc(d.courseId)}"
          data-key="${esc(d.purchaseKey)}">
          <i class="fa-solid fa-circle-check"></i> Approve Payment & Give Access
        </button>
        <button class="btn reject"
          data-action="reject"
          data-uid="${esc(d.uid)}"
          data-course="${esc(d.courseId)}"
          data-key="${esc(d.purchaseKey)}">
          <i class="fa-solid fa-xmark"></i> Reject
        </button>`;
    }else if(s==="verified"){
      actions=`
        <button class="btn course-link"
          data-file="${esc(file)}"
          ${file?"":"disabled"}>
          <i class="fa-solid fa-file-code"></i>
          ${file?"Open Course File":"Course File Not Mapped"}
        </button>`;
    }else{
      actions=`<div class="muted">This request was rejected.</div>`;
    }

    return `
      <article class="request">
        <div class="head">
          <div class="user">
            <div class="avatar">${avatar}</div>
            <div>
              <div class="course">${esc(d.courseName||d.courseId||"Course")}</div>
              <div class="muted">
                ${esc(name)} • ${esc(branch)} • ${esc(d.email||"-")}
              </div>
              ${pic?'<div class="photo-note">Profile photo loaded from purchase record</div>':""}
            </div>
          </div>
          <div class="amount">₹${esc(d.amount||99)}</div>
        </div>

        <div class="grid">
          <div class="item"><b>NAME</b><span>${esc(name)}</span></div>
          <div class="item"><b>BRANCH</b><span>${esc(branch)}</span></div>
          <div class="item"><b>MOBILE</b><span>${esc(d.mobile||"-")}</span></div>
          <div class="item"><b>EMAIL</b><span>${esc(d.email||"-")}</span></div>
          <div class="item"><b>COURSE</b><span>${esc(d.courseName||d.courseId||"-")}</span></div>
          <div class="item"><b>AMOUNT</b><span>₹${esc(d.amount||99)} INR</span></div>
          <div class="item"><b>UTR</b><span class="utr">${esc(d.utr||"-")}</span></div>
          <div class="item"><b>SUBMITTED</b><span>${esc(fmt(d.submittedAt))}</span></div>
          <div class="item"><b>STATUS</b><span>${esc(s.toUpperCase())}</span></div>
        </div>

        <div class="actions">${actions}</div>
      </article>`;
  }).join("");
}

function flatten(snapshot){
  const out=[];
  if(!snapshot.exists())return out;

  snapshot.forEach(uidSnap=>{
    const uid=uidSnap.key;
    const value=uidSnap.val()||{};

    Object.entries(value).forEach(([courseId,courseValue])=>{
      if(!courseValue||typeof courseValue!=="object")return;

      /*
       Expected:
       utrPurchases/{uid}/{courseId}/{purchaseId}
      */
      Object.entries(courseValue).forEach(([purchaseKey,purchaseValue])=>{
        if(!purchaseValue||typeof purchaseValue!=="object")return;

        out.push({
          uid,
          courseId,
          purchaseKey,
          ...purchaseValue
        });
      });
    });
  });

  return out.sort((a,b)=>
    (Number(b.submittedAt)||0)-(Number(a.submittedAt)||0)
  );
}

async function connect(){
  if(starting)return;
  starting=true;

  if(stopListening){
    stopListening();
    stopListening=null;
  }

  setNotice('<i class="fa-solid fa-spinner fa-spin"></i> Connecting to Firebase...');

  try{
    if(!auth.currentUser){
      await signInAnonymously(auth);
    }

    if(!auth.currentUser){
      throw new Error("Anonymous Firebase authentication did not create a user.");
    }

    setNotice(
      'Firebase connected • Loading live purchase requests...',
      "ok"
    );

    stopListening=onValue(
      ref(db,"utrPurchases"),
      snap=>{
        rows=flatten(snap);
        setNotice(
          `Firebase connected • ${rows.length} purchase request(s) loaded. Verify the UTR in your UPI/bank app before approving.`,
          "ok"
        );
        render();
      },
      err=>{
        console.error("Realtime Database error:",err);
        setNotice("Firebase database error: "+esc(err.message),"err");
        $("list").innerHTML=`
          <div class="error">
            <b>Purchase requests could not be loaded.</b><br>
            <span class="small">${esc(err.message)}</span><br><br>
            <span class="small">
              For this no-login admin page, Firebase Authentication →
              Sign-in method → Anonymous must be enabled and your Realtime
              Database Rules must permit the authenticated anonymous session
              to read utrPurchases.
            </span>
          </div>`;
      }
    );

  }catch(e){
    console.error("Admin Firebase connection error:",e);
    setNotice("Firebase Authentication error: "+esc(e.message),"err");
    $("list").innerHTML=`
      <div class="error">
        <b>Admin connection failed.</b><br>
        <span class="small">${esc(e.message)}</span><br><br>
        <span class="small">
          Enable Anonymous Authentication in Firebase Console:
          Authentication → Sign-in method → Anonymous → Enable.
        </span>
      </div>`;
  }finally{
    starting=false;
  }
}

async function approve(uid,courseId,key,button){
  if(!uid||!courseId||!key){
    alert("Invalid purchase record.");
    return;
  }

  if(!confirm(
    "Confirm that the ₹99 payment and UTR are genuine.\n\n"+
    "After approval, this student will get access to the selected course."
  ))return;

  const oldText=button.innerHTML;
  button.disabled=true;
  button.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Approving...';

  try{
    const purchaseRef=ref(
      db,
      `utrPurchases/${uid}/${courseId}/${key}`
    );

    const snap=await get(purchaseRef);

    if(!snap.exists()){
      throw new Error("Purchase request not found.");
    }

    const d=snap.val()||{};
    const now=Date.now();

    /*
      Update the original purchase record.
    */
    await update(purchaseRef,{
      status:"verified",
      verified:true,
      verifiedAt:now,
      verifiedBy:"anonymous-admin-page"
    });

    /*
      Create the student's course access.
    */
    await set(
      ref(db,`courseAccess/${uid}/${courseId}`),
      {
        uid,
        courseId,
        courseName:d.courseName||courseId,
        amount:Number(d.amount)||99,
        currency:"INR",
        utr:d.utr||"",
        verified:true,
        status:"verified",
        purchaseId:d.purchaseId||key,
        grantedAt:now,
        verifiedBy:"anonymous-admin-page"
      }
    );

    alert(
      "Payment approved successfully.\n\n"+
      "Course access has been granted to the student."
    );

  }catch(e){
    console.error("Approve error:",e);
    alert(
      "Approve failed:\n\n"+
      e.message+
      "\n\nCheck Firebase Rules: anonymous authenticated admin must be allowed to write utrPurchases and courseAccess."
    );
    button.disabled=false;
    button.innerHTML=oldText;
  }
}

async function reject(uid,courseId,key,button){
  if(!uid||!courseId||!key){
    alert("Invalid purchase record.");
    return;
  }

  if(!confirm("Reject this UTR/payment request?"))return;

  const oldText=button.innerHTML;
  button.disabled=true;
  button.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Rejecting...';

  try{
    await update(
      ref(db,`utrPurchases/${uid}/${courseId}/${key}`),
      {
        status:"rejected",
        verified:false,
        rejectedAt:Date.now(),
        rejectedBy:"anonymous-admin-page"
      }
    );

    alert("Request rejected.");
  }catch(e){
    console.error("Reject error:",e);
    alert("Reject failed:\n\n"+e.message);
    button.disabled=false;
    button.innerHTML=oldText;
  }
}

document.addEventListener("click",e=>{
  const actionButton=e.target.closest("[data-action]");

  if(actionButton){
    const args=[
      actionButton.dataset.uid,
      actionButton.dataset.course,
      actionButton.dataset.key,
      actionButton
    ];

    if(actionButton.dataset.action==="approve"){
      approve(...args);
    }else{
      reject(...args);
    }
    return;
  }

  const courseButton=e.target.closest("[data-file]");

  if(courseButton && courseButton.dataset.file){
    window.open(
      courseButton.dataset.file,
      "_blank",
      "noopener,noreferrer"
    );
  }
});

document.querySelectorAll(".tab").forEach(button=>{
  button.addEventListener("click",()=>{
    filter=button.dataset.filter;
    render();
  });
});

$("refreshBtn").addEventListener("click",connect);

onAuthStateChanged(auth,user=>{
  if(user){
    console.log("Anonymous admin session:",user.uid);
  }
});

connect();
</script>
</body>
</html>
