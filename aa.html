<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Playlist Web App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f0f0f;
      color: #fff;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: row;
      max-width: 1200px;
      width: 100%;
      gap: 20px;
    }

    /* Left Side: Video Player + Controls */
    .main-content {
      flex: 2;
      display: flex;
      flex-direction: column;
    }

    .video-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid #272727;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
    }

    .btn {
      background-color: #272727;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background-color: #3f3f3f;
    }

    /* Comment Section */
    .comment-section {
      margin-top: 20px;
    }

    .comment-input-box {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .comment-input-box input {
      flex: 1;
      background: #121212;
      border: 1px solid #333;
      color: white;
      padding: 10px 14px;
      border-radius: 20px;
      outline: none;
    }

    .comments-list {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .comment-item {
      background: #181818;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
    }

    /* Right Side: Playlist */
    .playlist-sidebar {
      flex: 1;
      background: #181818;
      border-radius: 12px;
      padding: 15px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .playlist-title {
      font-size: 18px;
      margin-bottom: 15px;
      color: #aaa;
    }

    .playlist-item {
      display: flex;
      gap: 10px;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.2s ease;
    }

    .playlist-item:hover, .playlist-item.active {
      background: #272727;
    }

    .thumbnail-placeholder {
      width: 100px;
      height: 56px;
      background: #333;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #888;
      flex-shrink: 0;
    }

    .video-info h4 {
      font-size: 14px;
      line-height: 1.2;
    }

    /* Responsive Design for Mobile */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .playlist-sidebar {
        max-height: none;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Main Player Section -->
    <div class="main-content">
      <div class="video-container">
        <!-- Main Vimeo Embed -->
        <iframe id="mainPlayer" src="https://player.vimeo.com/video/1217532256?badge=0&autopause=0&player_id=0&app_id=58479" allow="autoplay; fullscreen; picture-in-picture; clipboard-write" title="Video Player"></iframe>
      </div>

      <!-- Like, Share, Actions Bar -->
      <div class="action-bar">
        <h3 id="currentVideoTitle">Featured Vimeo Video</h3>
        <div class="action-buttons">
          <button class="btn" id="likeBtn">👍 <span id="likeCount">120</span></button>
          <button class="btn" onclick="shareVideo()">🔗 Share</button>
        </div>
      </div>

      <!-- Comment Section -->
      <div class="comment-section">
        <h4>Comments</h4>
        <div class="comment-input-box">
          <input type="text" id="commentInput" placeholder="Add a comment...">
          <button class="btn" onclick="addComment()">Post</button>
        </div>
        <div class="comments-list" id="commentsList">
          <div class="comment-item"><strong>User123:</strong> Bahut acchi video hai!</div>
        </div>
      </div>
    </div>

    <!-- Playlist Sidebar -->
    <div class="playlist-sidebar">
      <div class="playlist-title">Next Videos</div>
      <div id="playlistItems">
        <!-- Playlist Items injected dynamically by JS -->
      </div>
    </div>
  </div>

  <script>
    // Playlist Items Array (Aap apne baaki Vimeo video IDs yahan add kar sakte hain)
    const playlist = [
      { id: "1217532256", title: "Main Vimeo Video" },
      { id: "76979871", title: "Playlist Video 2" },
      { id: "35727471", title: "Playlist Video 3" },
      { id: "1084537", title: "Playlist Video 4" }
    ];

    let isLiked = false;

    // Load Playlist on Page Load
    function loadPlaylist() {
      const playlistContainer = document.getElementById("playlistItems");
      playlistContainer.innerHTML = "";

      playlist.forEach((video, index) => {
        const item = document.createElement("div");
        item.className = `playlist-item ${index === 0 ? 'active' : ''}`;
        item.onclick = () => playVideo(video.id, video.title, item);

        item.innerHTML = `
          <div class="thumbnail-placeholder">PLAY</div>
          <div class="video-info">
            <h4>${video.title}</h4>
          </div>
        `;
        playlistContainer.appendChild(item);
      });
    }

    // Switch Video Smoothly
    function playVideo(vimeoId, title, element) {
      const player = document.getElementById("mainPlayer");
      player.src = `https://player.vimeo.com/video/${vimeoId}?autoplay=1&badge=0&autopause=0&player_id=0&app_id=58479`;
      document.getElementById("currentVideoTitle").innerText = title;

      // Update active highlight
      document.querySelectorAll(".playlist-item").forEach(el => el.classList.remove("active"));
      element.classList.add("active");
    }

    // Like Toggle Functionality
    document.getElementById("likeBtn").addEventListener("click", function() {
      const countSpan = document.getElementById("likeCount");
      let count = parseInt(countSpan.innerText);
      if (!isLiked) {
        countSpan.innerText = count + 1;
        this.style.background = "#0073ff";
        isLiked = true;
      } else {
        countSpan.innerText = count - 1;
        this.style.background = "#272727";
        isLiked = false;
      }
    });

    // Share Button Functionality
    function shareVideo() {
      if (navigator.share) {
        navigator.share({
          title: 'Check out this video',
          url: window.location.href
        });
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert("Link copied to clipboard!");
      }
    }

    // Add Comment Functionality
    function addComment() {
      const input = document.getElementById("commentInput");
      const list = document.getElementById("commentsList");

      if (input.value.trim() !== "") {
        const comment = document.createElement("div");
        comment.className = "comment-item";
        comment.innerHTML = `<strong>You:</strong> ${input.value}`;
        list.prepend(comment);
        input.value = "";
      }
    }

    // Initialize Page
    loadPlaylist();
  </script>
</body>
</html>
