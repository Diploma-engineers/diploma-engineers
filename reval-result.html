<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coming Soon | Diploma Engineers</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f7fb;
    padding:20px;
    overflow:hidden;
}

/* Background */

.circle{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    opacity:.25;
}

.c1{
    width:280px;
    height:280px;
    background:#2563eb;
    top:-100px;
    left:-100px;
}

.c2{
    width:280px;
    height:280px;
    background:#22c55e;
    bottom:-100px;
    right:-100px;
}

/* Card */

.card{
    position:relative;
    z-index:10;
    max-width:450px;
    width:100%;
    background:#fff;
    border-radius:28px;
    padding:40px 30px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.08);
}

.icon{
    width:95px;
    height:95px;
    margin:auto;
    border-radius:24px;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    margin-bottom:22px;
}

h1{
    font-size:32px;
    color:#0f172a;
    margin-bottom:12px;
}

p{
    color:#64748b;
    line-height:1.8;
    font-size:15px;
}

.badge{
    display:inline-block;
    margin-top:22px;
    padding:12px 22px;
    background:#fef3c7;
    color:#b45309;
    border-radius:30px;
    font-weight:600;
}

.btn{
    display:block;
    width:100%;
    margin-top:25px;
    text-decoration:none;
    background:#2563eb;
    color:#fff;
    padding:15px;
    border-radius:16px;
    font-weight:600;
    transition:.3s;
}

.btn:hover{
    background:#1d4ed8;
}

.footer{
    margin-top:22px;
    font-size:13px;
    color:#94a3b8;
}

@media(max-width:600px){

.card{
    padding:30px 22px;
}

h1{
    font-size:28px;
}

}

</style>

</head>
<body>

<div class="circle c1"></div>
<div class="circle c2"></div>

<div class="card">

<div class="icon">
<i class="fa-solid fa-clock"></i>
</div>

<h1>Coming Soon</h1>

<p>
The <strong>Revaluation Result Portal</strong> is currently under development.
It will be available soon. Please check back later for updates.
</p>

<div class="badge">
<i class="fa-solid fa-hourglass-half"></i>
 Launching Soon
</div>

<a href="result.html" class="btn">
<i class="fa-solid fa-arrow-left"></i>
 Back to Result Page
</a>

<div class="footer">
Developed by Diploma Engineers
</div>

</div>

</body>
</html>
