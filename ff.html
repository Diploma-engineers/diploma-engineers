<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{

background:linear-gradient(-45deg,#eef5ff,#dbeafe,#f8fbff,#e0ecff);

background-size:400% 400%;

animation:bg 15s ease infinite;

overflow-x:hidden;

}

@keyframes bg{

0%{background-position:0% 50%;}

50%{background-position:100% 50%;}

100%{background-position:0% 50%;}

}

/* HERO */

.hero{

padding:120px 0 80px;

position:relative;

overflow:hidden;

}

.hero::before{

content:"";

position:absolute;

width:450px;

height:450px;

background:#2563eb33;

border-radius:50%;

top:-150px;

right:-100px;

filter:blur(80px);

animation:blob1 10s infinite ease-in-out;

}

.hero::after{

content:"";

position:absolute;

width:350px;

height:350px;

background:#7c3aed22;

border-radius:50%;

bottom:-120px;

left:-120px;

filter:blur(70px);

animation:blob2 9s infinite ease-in-out;

}

@keyframes blob1{

50%{

transform:translateY(60px);

}

}

@keyframes blob2{

50%{

transform:translateY(-60px);

}

}

.container-custom{

width:92%;

max-width:1350px;

margin:auto;

display:flex;

align-items:center;

justify-content:space-between;

gap:70px;

position:relative;

z-index:2;

}

.hero-left{

flex:1;

animation:left 1s;

}

.hero-right{

flex:1;

text-align:center;

animation:right 1s;

}

@keyframes left{

from{

opacity:0;

transform:translateX(-70px);

}

to{

opacity:1;

transform:translateX(0);

}

}

@keyframes right{

from{

opacity:0;

transform:translateX(70px);

}

to{

opacity:1;

transform:translateX(0);

}

}

.badge-custom{

display:inline-block;

padding:12px 25px;

border-radius:40px;

background:white;

box-shadow:0 10px 30px rgba(0,0,0,.08);

font-weight:700;

margin-bottom:25px;

color:#2563eb;

}

.hero h1{

font-size:68px;

font-weight:800;

line-height:1.15;

margin-bottom:20px;

}

.hero h1 span{

background:linear-gradient(90deg,#2563eb,#7c3aed,#06b6d4);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

.hero p{

font-size:21px;

line-height:1.8;

color:#555;

margin-bottom:35px;

max-width:650px;

}

.tags{

display:flex;

flex-wrap:wrap;

gap:15px;

margin-bottom:40px;

}

.tags span{

padding:12px 20px;

background:white;

border-radius:30px;

box-shadow:0 8px 20px rgba(0,0,0,.08);

font-weight:600;

transition:.3s;

cursor:pointer;

}

.tags span:hover{

background:#2563eb;

color:white;

transform:translateY(-5px);

}

.buttons{

display:flex;

gap:20px;

flex-wrap:wrap;

}

.btn-main{

padding:16px 35px;

background:#2563eb;

color:white;

text-decoration:none;

border-radius:12px;

font-weight:700;

transition:.3s;

}

.btn-main:hover{

background:#0f4fd8;

color:white;

transform:translateY(-5px);

}

.btn-light{

padding:16px 35px;

background:white;

text-decoration:none;

color:#222;

border-radius:12px;

font-weight:700;

box-shadow:0 10px 25px rgba(0,0,0,.08);

transition:.3s;

}

.btn-light:hover{

transform:translateY(-5px);

}

.hero-right img{

width:100%;

max-width:650px;

animation:float 5s infinite ease-in-out;

}

@keyframes float{

50%{

transform:translateY(-20px);

}

}
<div class="hero-right">

<img
src="https://anubhavfinance.wordpress.com/wp-content/uploads/2026/08/file_00000000f6188211b3febb357488a2d73274528759044196790.png"
alt="Diploma Engineers Student">

</div>

</div>

</section>

<!-- Achievement -->
<div id="achievement"></div>

<!-- Join Community -->
<div id="join"></div>

<!-- Footer -->
<div id="footer"></div>

<script>

function load(id,file){

fetch(file)

.then(response=>response.text())

.then(data=>{

document.getElementById(id).innerHTML=data;

})

.catch(error=>{

console.log(file+" not loaded");

});

}

load("header","header.html");

load("achievement","achievement.html");

load("join","join.html");

load("footer","footer.html");

</script>

</body>
