<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f2f63">
<title>Published Test Series | Diploma Engineers</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<style>
:root{--primary:#0f2f63;--blue:#1d4ed8;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#697386;--border:#e5e9f2;--green:#16834b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.nav{max-width:1180px;margin:auto;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:Poppins;font-size:20px;font-weight:800;color:var(--primary)}.brand span{display:block;font-family:Inter;font-size:11px;color:var(--muted);font-weight:500}
.container{max-width:1180px;margin:auto;padding:28px 18px 60px}.hero{margin-bottom:20px}.hero h1{font-family:Poppins;font-size:30px;margin:0 0 7px}.hero p{color:var(--muted);margin:0}
.filters{background:#fff;border:1px solid var(--border);border-radius:18px;padding:17px;box-shadow:0 10px 30px rgba(15,47,99,.06);margin-bottom:20px}
.filtergrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;outline:none;background:#fff}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
.stats{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 17px}.stat{padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;font-size:13px}.stat b{color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--border);border-radius:17px;padding:19px;box-shadow:0 10px 30px rgba(15,47,99,.06);display:flex;flex-direction:column;min-height:250px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}.badge{font-size:10px;font-weight:800;padding:5px 8px;border-radius:20px;background:#eef3fa;color:var(--primary)}.badge.green{background:#eaf8f0;color:var(--green)}
.card h2{font-family:Poppins;font-size:18px;line-height:1.35;margin:0 0 7px}.meta{color:var(--muted);font-size:12px;line-height:1.7}.desc{font-size:13px;line-height:1.6;margin:11px 0;color:#3e485b;flex:1}
.info{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 14px}.info span{background:#f6f8fc;border:1px solid var(--border);padding:7px 8px;border-radius:8px;font-size:11px}
.btn{border:0;border-radius:10px;padding:11px 13px;background:var(--primary);color:#fff;font-weight:800;cursor:pointer;text-align:center;text-decoration:none}.btn:hover{opacity:.92}
.empty{text-align:center;padding:45px 15px;color:var(--muted);background:#fff;border:1px dashed var(--border);border-radius:16px;grid-column:1/-1}
.error{color:#a91f2d;background:#fff0f1;border:1px solid #ffd1d5;padding:13px;border-radius:11px;margin-bottom:15px;display:none}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.filtergrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid,.filtergrid{grid-template-columns:1fr}.container{padding:20px 12px 45px}.hero h1{font-size:24px}.brand{font-size:17px}}
</style>
</head>
<body>
<header class="top"><div class="nav"><div class="brand">Diploma Engineers<span>Published Test Series</span></div></div></header>
<main class="container">
<section class="hero">
<h1>Test Series</h1>
<p>Published CBT tests — Branch, Semester, Subject और Topic के अनुसार practice करें.</p>
</section>

<div id="errorBox" class="error"></div>

<section class="filters">
<div class="filtergrid">
<div class="field"><label>Search</label><input id="search" placeholder="Test title, subject, topic..."></div>
<div class="field"><label>Branch</label><select id="branch"><option value="">All Branches</option></select></div>
<div class="field"><label>Semester</label><select id="semester"><option value="">All Semesters</option></select></div>
<div class="field"><label>Subject</label><select id="subject"><option value="">All Subjects</option></select></div>
</div>
</section>

<div id="stats" class="stats"></div>
<section id="list" class="grid"><div class="empty"><i class="fa-solid fa-spinner fa-spin"></i><p>Loading published tests...</p></div></section>
</main>

<script>
const firebaseConfig={
 apiKey:"AIzaSyCxe9H7zSxJQzgM8bN_UAdOnDHr5myH6CQ",
 authDomain:"diploma-app-9a378.firebaseapp.com",
 databaseURL:"https://diploma-app-9a378-default-rtdb.firebaseio.com",
 projectId:"diploma-app-9a378",
 storageBucket:"diploma-app-9a378.firebasestorage.app",
 messagingSenderId:"160233059797",
 appId:"1:160233059797:web:be38130ed64f8bd0afb95c6"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
let tests=[];

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");

function fillSelect(id, values){
 const el=$(id), old=el.value;
 const unique=[...new Set(values.filter(Boolean).map(String))].sort((a,b)=>a.localeCompare(b));
 el.innerHTML='<option value="">All '+(id==="branch"?"Branches":id==="semester"?"Semesters":"Subjects")+'</option>'+unique.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");
 if(unique.includes(old)) el.value=old;
}

function formatDate(v){
 if(!v) return "";
 const d=new Date(Number(v));
 return isNaN(d.getTime())?"":d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});
}

function render(){
 const q=$("search").value.trim().toLowerCase();
 const b=$("branch").value, s=$("semester").value, sub=$("subject").value;
 const filtered=tests.filter(t=>{
   const text=[t.title,t.folderName,t.subject,t.topic,t.description].join(" ").toLowerCase();
   return (!q||text.includes(q))&&(!b||t.branch===b)&&(!s||t.semester===s)&&(!sub||t.subject===sub);
 });
 $("stats").innerHTML=`<div class="stat"><b>${tests.length}</b> Published Tests</div><div class="stat"><b>${filtered.length}</b> Showing</div>`;
 if(!filtered.length){
   $("list").innerHTML='<div class="empty"><i class="fa-regular fa-folder-open" style="font-size:30px"></i><p>No published test found.</p></div>';
   return;
 }
 $("list").innerHTML=filtered.map(t=>{
   const id=t.id||"";
   const count=Number(t.questionCount||t.questions?.length||0);
   const total=(Number(t.marksPerQuestion)||0)*count;
   return `<article class="card">
     <div class="badges"><span class="badge green">PUBLISHED</span><span class="badge">${esc(t.branch||"")}</span></div>
     <h2>${esc(t.title||"Untitled Test")}</h2>
     <div class="meta">${esc(t.subject||"")} · ${esc(t.topic||"")} · ${esc(t.semester||"")}</div>
     <div class="desc">${esc(t.description||"Practice this test and check your score instantly.")}</div>
     <div class="info">
       <span><i class="fa-regular fa-circle-question"></i> ${count} Q</span>
       <span><i class="fa-regular fa-clock"></i> ${Number(t.durationMinutes)||0} min</span>
       <span><i class="fa-solid fa-star"></i> ${total} marks</span>
       <span>Pass ${Number(t.passPercentage)||0}%</span>
     </div>
     <div class="meta" style="margin-bottom:12px">Published ${esc(formatDate(t.publishedAt||t.createdAt))}</div>
     <a class="btn" href="test-series-test.html?id=${encodeURIComponent(id)}"><i class="fa-solid fa-play"></i> Start Test</a>
   </article>`;
 }).join("");
}

async function load(){
 try{
   const snap=await db.ref("testSeries").once("value");
   const data=snap.val()||{};
   tests=Object.entries(data)
     .map(([id,t])=>({...t,id}))
     .filter(t=>t.status==="published" && t.active!==false)
     .sort((a,b)=>(b.publishedAt||b.createdAt||0)-(a.publishedAt||a.createdAt||0));
   fillSelect("branch",tests.map(t=>t.branch));
   fillSelect("semester",tests.map(t=>t.semester));
   fillSelect("subject",tests.map(t=>t.subject));
   render();
 }catch(e){
   console.error(e);
   $("errorBox").style.display="block";
   $("errorBox").textContent="Test Series load नहीं हो सकी: "+(e.message||"Firebase error");
   $("list").innerHTML='<div class="empty">Firebase data load failed.</div>';
 }
}
["search","branch","semester","subject"].forEach(id=>$(id).addEventListener(id==="search"?"input":"change",render));
load();
</script>
</body>
</html>
