<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Latest News | Diploma Engineers</title>

<link rel="icon" href="favicon.ico">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    background:#f1f5f9;
    color:#1e293b;
}

/* HEADER */

.header{
    background:#2563eb;
    color:white;
    padding:18px 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.header h1{
    font-size:22px;
}

.header h1 i{
    margin-right:8px;
}

.home-btn{
    text-decoration:none;
    background:white;
    color:#2563eb;
    padding:9px 16px;
    border-radius:8px;
    font-weight:600;
}

/* PAGE */

.container{
    width:92%;
    max-width:1000px;
    margin:30px auto;
}

.page-title{
    text-align:center;
    margin-bottom:25px;
}

.page-title h2{
    color:#2563eb;
    font-size:30px;
}

.page-title p{
    color:#64748b;
    margin-top:5px;
}

/* NEWS CARD */

.news-card{
    background:white;
    padding:22px;
    border-radius:15px;
    margin-bottom:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    border-left:5px solid #2563eb;
    animation:show .4s ease;
}

.news-title{
    font-size:20px;
    font-weight:700;
    color:#1e40af;
    margin-bottom:8px;
}

.news-date{
    font-size:12px;
    color:#64748b;
    margin-bottom:12px;
}

.news-text{
    color:#475569;
    line-height:1.7;
    white-space:pre-wrap;
}

.news-badge{
    display:inline-block;
    background:#dbeafe;
    color:#1d4ed8;
    padding:4px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:600;
    margin-bottom:10px;
}

/* LOADING */

.loading{
    text-align:center;
    padding:40px;
    color:#2563eb;
}

.loading i{
    font-size:30px;
}

/* EMPTY */

.empty{
    background:white;
    padding:50px 20px;
    text-align:center;
    border-radius:15px;
    color:#64748b;
}

.empty i{
    font-size:45px;
    color:#94a3b8;
    margin-bottom:15px;
}

/* FOOTER */

.footer{
    margin-top:50px;
    background:#2563eb;
    color:white;
    text-align:center;
    padding:25px;
}

.footer p{
    font-size:13px;
    margin-top:5px;
}

/* ANIMATION */

@keyframes show{
    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* MOBILE */

@media(max-width:600px){

    .header{
        padding:15px;
    }

    .header h1{
        font-size:16px;
    }

    .home-btn{
        padding:7px 10px;
        font-size:12px;
    }

    .container{
        width:94%;
        margin:20px auto;
    }

    .page-title h2{
        font-size:24px;
    }

    .news-card{
        padding:17px;
    }

    .news-title{
        font-size:17px;
    }

}

</style>

</head>

<body>

<!-- HEADER -->

<header class="header">

    <h1>
        <i class="fa-solid fa-newspaper"></i>
        Diploma Engineers News
    </h1>

    <a href="aa.html" class="home-btn">
        <i class="fa-solid fa-house"></i>
        Home
    </a>

</header>


<!-- NEWS -->

<main class="container">

    <div class="page-title">

        <h2>
            Latest News
        </h2>

        <p>
            Diploma Engineers की सभी Latest Updates
        </p>

    </div>


    <div id="newsList">

        <div class="loading">

            <i class="fa-solid fa-spinner fa-spin"></i>

            <p>Loading News...</p>

        </div>

    </div>

</main>


<!-- FOOTER -->

<footer class="footer">

    <h3>Diploma Engineers</h3>

    <p>
        Latest Polytechnic News & Updates
    </p>

    <p>
        © 2026 Diploma Engineers
    </p>

</footer>


<!-- FIREBASE -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

    apiKey: "AIzaSyAbg1Q1ZPgF7mwaxyin7iglla01eDk_tKo",

    authDomain:
    "diplomaengineers-869df.firebaseapp.com",

    databaseURL:
    "https://diplomaengineers-869df-default-rtdb.firebaseio.com",

    projectId:
    "diplomaengineers-869df",

    storageBucket:
    "diplomaengineers-869df.appspot.com",

    messagingSenderId:
    "356779436080",

    appId:
    "1:356779436080:web:4b28da380e547420d0e5f5"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


/* LOAD NEWS */

const newsList =
document.getElementById("newsList");


onValue(
    ref(db,"news"),
    (snapshot)=>{

        newsList.innerHTML = "";

        const data = snapshot.val();


        /* NO NEWS */

        if(!data){

            newsList.innerHTML = `

                <div class="empty">

                    <i class="fa-regular fa-newspaper"></i>

                    <h3>No News Available</h3>

                    <p>
                    अभी कोई news publish नहीं हुई है।
                    </p>

                </div>

            `;

            return;

        }


        /* CONVERT TO ARRAY */

        const newsArray =
        Object.entries(data);


        /* LATEST FIRST */

        newsArray.reverse();


        /* DISPLAY */

        newsArray.forEach(
        ([id,item])=>{

            const card =
            document.createElement("div");

            card.className =
            "news-card";


            card.innerHTML = `

                <span class="news-badge">

                    <i class="fa-solid fa-bolt"></i>
                    NEW

                </span>

                <div class="news-title">

                    ${escapeHTML(item.title || "Untitled News")}

                </div>

                <div class="news-date">

                    <i class="fa-regular fa-clock"></i>

                    ${escapeHTML(item.date || "")}

                </div>

                <div class="news-text">

                    ${escapeHTML(item.text || "")}

                </div>

            `;


            newsList.appendChild(card);

        });

    },

    (error)=>{

        console.error(error);

        newsList.innerHTML = `

            <div class="empty">

                <i class="fa-solid fa-triangle-exclamation"></i>

                <h3>Unable to Load News</h3>

                <p>
                Firebase Database से news load नहीं हो सकी।
                </p>

            </div>

        `;

    }
);


/* SECURITY */

function escapeHTML(value){

    return String(value)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
