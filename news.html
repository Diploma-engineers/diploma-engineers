<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latest News</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#f5f7fb;
padding:20px;
}

h1{
text-align:center;
color:#2563eb;
margin-bottom:20px;
}

#newsList{
max-width:700px;
margin:auto;
}

.news{
background:#fff;
padding:18px;
margin-bottom:15px;
border-radius:12px;
box-shadow:0 4px 10px rgba(0,0,0,.1);
border-left:5px solid #2563eb;
}

.news h3{
color:#2563eb;
margin-bottom:10px;
}

.news p{
color:#444;
line-height:1.6;
}

.news small{
display:block;
margin-top:10px;
color:#888;
}
</style>

</head>
<body>

<h1>Latest News</h1>

<div id="newsList">Loading...</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

// Firebase Config
const firebaseConfig = {
apiKey: "AIzaSyAbg1Q1ZPgF7mwaxyin7iglla01eDk_tKo",
authDomain: "diplomaengineers-869df.firebaseapp.com",
databaseURL: "https://diplomaengineers-869df-default-rtdb.firebaseio.com",
projectId: "diplomaengineers-869df",
storageBucket: "diplomaengineers-869df.appspot.com",
messagingSenderId: "356779436080",
appId: "1:356779436080:web:4b28da380e547420d0e5f5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const newsList = document.getElementById("newsList");

onValue(ref(db,"news"),(snapshot)=>{

newsList.innerHTML="";

if(!snapshot.exists()){
newsList.innerHTML="<h3>No News Available</h3>";
return;
}

const data=snapshot.val();

Object.keys(data).reverse().forEach(id=>{

const item=data[id];

newsList.innerHTML += `
<div class="news">
<h3>${item.title}</h3>
<p>${item.text}</p>
<small>${item.date}</small>
</div>
`;

});

});

</script>

</body>
</html>
