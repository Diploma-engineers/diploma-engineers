<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Diploma Engineers Portal</title>

<!-- External Frameworks & Fonts -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Cashfree Web SDK -->
<script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>

<style>
:root {
  --primary: #2563EB;
  --primary-dark: #1D4ED8;
  --primary-light: #3B82F6;
  
  --blue-bg: #EFF6FF;
  --blue-border: #BFDBFE;
  --blue-text: #1E40AF;

  --bg-white: #ffffff;
  --surface-gray: #f8fafc;
  --dark-text: #0F172A;
  --muted-text: #64748B;
  --border-light: #e2e8f0;
  
  --radius-lg: 20px;
  --radius-md: 14px;
  --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.08);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Plus Jakarta Sans', sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: var(--bg-white);
  color: var(--dark-text);
  overflow-x: hidden;
  width: 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

::-webkit-scrollbar { display: none; }

/* GLOBAL LOADER */
#globalLoader {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(6px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  transition: opacity 0.3s ease;
}

.spinner-ring {
  width: 50px;
  height: 50px;
  border: 4px solid var(--border-light);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

#globalLoader p {
  margin-top: 14px;
  font-weight: 700;
  font-size: 14px;
  color: var(--dark-text);
  letter-spacing: -0.2px;
}

/* LOADER */
#page-loader{
    position:fixed;inset:0;background:#fff;
    display:flex;align-items:center;justify-content:center;
    z-index:999999;opacity:1;visibility:visible;
    transition:opacity .6s ease,visibility .6s ease;
}
#page-loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.loader-content{width:min(90%,500px);text-align:center}
.loader-logo{
    width:150px;height:150px;margin:0 auto 25px;
    position:relative;display:flex;align-items:center;justify-content:center
}
.loader-ring{
    position:absolute;inset:2px;border-radius:50%;
    border:4px solid #edf1f6;border-top-color:#2864e8;
    border-right-color:#ff6500;border-bottom-color:#2864e8;
    animation:loaderRotate 1.8s linear infinite
}
.loader-ring:after{
    content:"";position:absolute;width:4px;height:28px;
    background:#ff6500;border-radius:10px;top:-4px;right:5px
}
@keyframes loaderRotate{to{transform:rotate(360deg)}}
.loader-logo img{
    width:105px;height:105px;object-fit:contain;border-radius:50%;
    background:#fff;padding:7px;position:relative;z-index:2;
    box-shadow:0 5px 25px rgba(0,0,0,.06)
}
.loader-title{font-size:28px;font-weight:800;line-height:1.2}
.orange-text{color:#ff6500}.blue-text{color:#2864e8}
.loader-subtitle{margin:10px 0 30px;color:#64748b;font-size:15px}
.progress-container{width:100%;height:7px;background:#e4e9ef;border-radius:20px;overflow:hidden}
.progress-bar{
    width:0;height:100%;
    background:linear-gradient(90deg,#2864e8,#2864e8,#ff6500);
    border-radius:20px;transition:width .12s linear
}
.loading-status{
    margin-top:9px;display:flex;justify-content:space-between;
    color:#64748b;font-size:14px
}
#progress-percent{color:#2864e8;font-weight:700}

/* AUTH PAGE */
#authPage {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
  background: var(--bg-white);
}

.auth-box {
  background: var(--bg-white);
  width: 100%;
  max-width: 440px;
  margin: 0 auto;
  padding: 24px 20px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-light);
  box-shadow: var(--shadow-md);
  animation: fadeIn 0.15s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.logo {
  text-align: center;
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 16px;
  letter-spacing: -0.5px;
  color: var(--dark-text);
}

.logo span { color: var(--primary); }

.auth-box h2 {
  text-align: center;
  margin-bottom: 16px;
  font-weight: 700;
  font-size: 20px;
  color: var(--dark-text);
}

.form-group { margin-bottom: 12px; }

.auth-box input, .auth-box select {
  width: 100%;
  padding: 12px 14px;
  border-radius: var(--radius-md);
  border: 1.5px solid var(--border-light);
  outline: none;
  font-size: 14px;
  transition: all 0.15s ease;
  background-color: var(--surface-gray);
  color: var(--dark-text);
}

.auth-box input:focus, .auth-box select:focus {
  border-color: var(--primary);
  background-color: var(--bg-white);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
}

.btn-main {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white;
  font-size: 15px;
  font-weight: 700;
  transition: transform 0.1s, box-shadow 0.1s;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(37, 99, 235, 0.25);
}

.btn-main:active { transform: scale(0.98); }

.btn-google {
  width: 100%;
  padding: 12px;
  background: #ffffff;
  color: #374151;
  border: 1.5px solid var(--border-light);
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: 10px;
  transition: background 0.15s;
}

.btn-google:active { background: var(--surface-gray); }

.switch {
  text-align: center;
  margin-top: 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--primary);
  cursor: pointer;
}

/* MAIN APP WRAPPER */
#app {
  display: none;
  min-height: 100vh;
  width: 100%;
  padding-bottom: 90px;
}

/* TOP NAVBAR */
.navbar {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  padding: 8px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 99;
  border-bottom: 1px solid var(--border-light);
  width: 100%;
}

.nav-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-back-btn {
  background: var(--surface-gray);
  border: 1px solid var(--border-light);
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: none;
  align-items: center;
  justify-content: center;
  color: var(--dark-text);
  font-size: 14px;
  cursor: pointer;
}

.nav-logo {
  font-size: 18px;
  font-weight: 800;
  color: var(--dark-text);
}

.nav-logo span { color: var(--primary); }

.profile-icon i {
  font-size: 26px;
  color: var(--dark-text);
  cursor: pointer;
}

/* PAGES */
.page {
  display: none;
  padding: 8px 10px 20px 10px;
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  animation: pageSlide 0.1s cubic-bezier(0.25, 1, 0.5, 1);
}

.active-page { display: block; }

@keyframes pageSlide {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}

/* HERO BANNER */
.banner {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  padding: 20px;
  border-radius: var(--radius-lg);
  color: white;
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
}

.banner::before {
  content: '';
  position: absolute;
  width: 180px;
  height: 180px;
  background: rgba(255, 255, 255, 0.12);
  border-radius: 50%;
  top: -40px;
  right: -40px;
}

.banner h2 { font-size: 22px; font-weight: 800; position: relative; z-index: 1; }
.banner p { font-size: 13px; opacity: 0.95; margin-top: 4px; margin-bottom: 0; position: relative; z-index: 1; }

.section-title {
  font-size: 16px;
  font-weight: 700;
  margin: 16px 0 10px 0;
  color: var(--dark-text);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.section-title span { color: var(--primary); }

.scroll-container {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  padding-bottom: 6px;
}

.subject-card {
  min-width: 160px;
  height: 200px;
  border-radius: var(--radius-md);
  overflow: hidden;
  position: relative;
  border: 1px solid var(--border-light);
  box-shadow: var(--shadow-subtle);
  flex-shrink: 0;
}

.subject-card img { width: 100%; height: 100%; object-fit: cover; }

.subject-card .overlay {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 10px;
  background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
}

.subject-card h4 {
  font-size: 13px;
  font-weight: 700;
  color: white;
  margin: 0;
}

.grid-2, .grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

@media (min-width: 640px) {
  .grid-2, .grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
}

@media (min-width: 992px) {
  .grid-2, .grid { grid-template-columns: repeat(4, 1fr); gap: 16px; }
}

@media (min-width: 1200px) {
  .grid-2 { grid-template-columns: repeat(6, 1fr); }
}

.card-box, .card {
  background: var(--bg-white);
  padding: 16px 12px;
  border-radius: var(--radius-md);
  text-align: center;
  border: 1px solid var(--border-light);
  box-shadow: var(--shadow-subtle);
  transition: transform 0.1s ease;
  cursor: pointer;
  text-decoration: none;
  color: var(--dark-text);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.card-box:active, .card:hover { transform: scale(0.97); }

.card-box i {
  font-size: 24px;
  margin-bottom: 6px;
  color: var(--primary);
  display: inline-block;
}

.card-box p {
  margin: 0;
  font-weight: 600;
  font-size: 12px;
  line-height: 1.3;
}

/* SEMESTER BANNER CARDS */
.sem-banner-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin-top: 12px;
}

@media (min-width: 768px) {
  .sem-banner-grid { grid-template-columns: repeat(2, 1fr); }
}

.sem-card-orange {
  background: linear-gradient(135deg, #FF7A00, #FF9933);
  border-radius: var(--radius-lg);
  padding: 20px;
  color: white;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(255, 122, 0, 0.25);
  transition: transform 0.15s ease;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 140px;
}

.sem-card-dark {
  background: linear-gradient(135deg, #1E293B, #0F172A);
  border-radius: var(--radius-lg);
  padding: 20px;
  color: white;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(15, 23, 42, 0.25);
  transition: transform 0.15s ease;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 140px;
}

.sem-card-orange:active, .sem-card-dark:active { transform: scale(0.98); }

.sem-card-icon {
  width: 38px;
  height: 38px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  margin-bottom: 10px;
}

.sem-card-content h3 {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 2px;
  letter-spacing: -0.3px;
}

.sem-card-content p {
  font-size: 12px;
  opacity: 0.9;
  margin: 0;
}

.sem-card-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 14px;
  background: rgba(255, 255, 255, 0.2);
  padding: 6px 14px;
  border-radius: 30px;
  font-size: 11px;
  font-weight: 700;
  width: max-content;
  border: 1px solid rgba(255, 255, 255, 0.3);
}

/* BLUE THEME SECTION 1 */
.blue-theme-card-1 {
  background: var(--blue-bg);
  border: 1px solid var(--blue-border);
  border-radius: var(--radius-md);
  padding: 16px;
  margin-top: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow-subtle);
  cursor: pointer;
  transition: transform 0.1s ease;
}
.blue-theme-card-1:active { transform: scale(0.98); }

.blue-theme-card-1 .content h4 {
  font-size: 15px;
  font-weight: 700;
  color: var(--blue-text);
  margin-bottom: 2px;
}

.blue-theme-card-1 .content p {
  font-size: 12px;
  color: var(--muted-text);
  margin: 0;
}

.blue-theme-card-1 .icon-box {
  width: 42px;
  height: 42px;
  background: var(--primary);
  color: #fff;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}

.notice {
  background: var(--blue-bg);
  border: 1px solid var(--blue-border);
  border-left: 4px solid var(--primary);
  padding: 14px;
  border-radius: var(--radius-md);
  margin-top: 14px;
}

.notice h5 {
  font-size: 13px;
  font-weight: 700;
  color: var(--blue-text);
  margin-bottom: 4px;
}

.notice p {
  font-size: 12px;
  color: var(--blue-text);
  opacity: 0.9;
  margin: 0;
  line-height: 1.4;
}

.notes-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

@media (min-width: 640px) {
  .notes-grid { grid-template-columns: repeat(3, 1fr); }
}

@media (min-width: 992px) {
  .notes-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; }
}

.book-card {
  background: var(--bg-white);
  border-radius: var(--radius-md);
  overflow: hidden;
  border: 1px solid var(--border-light);
  box-shadow: var(--shadow-subtle);
  text-decoration: none;
  color: var(--dark-text);
  display: flex;
  flex-direction: column;
}

.book-card img {
  width: 100%;
  height: 130px;
  object-fit: cover;
  background: var(--surface-gray);
}

.book-card-content { padding: 10px; }

.book-card h3 {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 2px;
  line-height: 1.2;
}

.book-card p {
  font-size: 11px;
  color: var(--muted-text);
  margin: 0;
  line-height: 1.3;
}

.profile-box {
  background: var(--bg-white);
  padding: 20px;
  border-radius: var(--radius-lg);
  text-align: center;
  border: 1px solid var(--border-light);
  box-shadow: var(--shadow-subtle);
  max-width: 600px;
  margin: 0 auto;
}

.profile-avatar {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: var(--surface-gray);
  border: 1px solid var(--border-light);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 10px;
  color: var(--primary);
  font-size: 30px;
}

.profile-details {
  margin-top: 14px;
  text-align: left;
  background: var(--surface-gray);
  border: 1px solid var(--border-light);
  padding: 14px;
  border-radius: var(--radius-md);
}

.profile-details p {
  margin-bottom: 8px;
  font-size: 12px;
  font-weight: 500;
  display: flex;
  justify-content: space-between;
}

.profile-details p:last-child { margin-bottom: 0; }
.profile-details span { font-weight: 700; color: var(--dark-text); }

.premium-buy-card {
  background: var(--bg-white);
  padding: 24px 20px;
  border-radius: var(--radius-lg);
  text-align: center;
  border: 1px solid var(--border-light);
  box-shadow: var(--shadow-md);
  max-width: 600px;
  margin: 0 auto;
}

.price-box {
  display: inline-block;
  background: #f0fdf4;
  color: #16a34a;
  padding: 6px 20px;
  border-radius: var(--radius-md);
  font-size: 20px;
  font-weight: 800;
  margin: 12px 0;
  border: 1px solid #bbf7d0;
}

.nav-wrapper {
  margin: 10px 0;
  width: 100%;
}

.top-btns {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface-gray);
  padding: 6px;
  border-radius: 14px;
  border: 1px solid var(--border-light);
  overflow-x: auto;
}

.branch-btn {
  padding: 6px 14px;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--muted-text);
  cursor: pointer;
  font-weight: 700;
  font-size: 12px;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  flex-shrink: 0;
}

.branch-btn.active {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
}

/* NEWS & NOTIFICATION STYLES */
.news-page {
  width: 100%;
  max-width: 650px;
  margin: auto;
  background: #ffffff;
  border-radius: 20px;
  padding: 10px 0px;
}

.page-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.header-icon {
  width: 42px;
  height: 42px;
  background: #eef2ff;
  color: #3b82f6;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.page-header h1 {
  font-size: 20px;
  font-weight: 800;
  color: #0f172a;
  margin: 0;
}

#newsList {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.news-card {
  background: #f8fafc;
  border-radius: 14px;
  border: 1px solid #e2e8f0;
  border-left: 5px solid #2563eb;
  padding: 16px;
  transition: all 0.2s ease;
  position: relative;
  overflow: hidden;
  text-align: left;
}

.news-card:hover {
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
}

.category {
  display: inline-block;
  background: #dbeafe;
  color: #1d4ed8;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
}

.news-title {
  font-size: 16px;
  font-weight: 700;
  color: #0f172a;
  line-height: 1.4;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.news-title i {
  color: #2563eb;
  font-size: 15px;
}

.news-description {
  font-size: 13px;
  line-height: 1.5;
  color: #64748b;
  margin-bottom: 12px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 10px;
  border-top: 1px dashed #e2e8f0;
  font-size: 12px;
}

.news-date {
  color: #94a3b8;
  display: flex;
  align-items: center;
  gap: 5px;
  font-weight: 500;
}

.action-links {
  display: flex;
  align-items: center;
  gap: 12px;
}

.action-btn {
  color: #2563eb;
  text-decoration: none;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 4px;
  background: none;
  border: none;
  cursor: pointer;
  font-size: 12px;
  padding: 0;
}

.action-btn:hover {
  color: #1d4ed8;
  text-decoration: underline;
}

.expandable-panel {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s cubic-bezier(0, 1, 0, 1);
  background: #ffffff;
  border-radius: 10px;
  margin-top: 0;
  padding: 0 12px;
  border: 0px solid #e2e8f0;
}

.expandable-panel.active {
  max-height: 500px;
  transition: max-height 0.3s ease-in-out;
  margin-top: 12px;
  padding: 12px;
  border-width: 1px;
}

.card-thumbnail {
  width: 100%;
  max-height: 200px;
  object-fit: cover;
  border-radius: 8px;
  margin-bottom: 10px;
}

.full-desc {
  font-size: 13px;
  color: #334155;
  line-height: 1.6;
  margin-bottom: 10px;
  white-space: pre-wrap;
}

.share-grid {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid #f1f5f9;
}

.share-icon-btn {
  flex: 1;
  height: 34px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  text-decoration: none;
  border: none;
  cursor: pointer;
  font-size: 12px;
  gap: 6px;
  font-weight: 600;
}

.share-whatsapp { background: #25D366; }
.share-telegram { background: #229ED9; }
.share-copy { background: #64748b; }

.loading, .empty, .error-box {
  text-align: center;
  padding: 30px;
  color: #64748b;
}
.loading i { font-size: 24px; color: #2563eb; margin-bottom: 8px; }

/* BOTTOM NAVIGATION BAR */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0;
  width: 100%;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  display: flex;
  justify-content: space-around;
  padding: 8px 0 6px;
  border-top: 1px solid var(--border-light);
  z-index: 99;
}
