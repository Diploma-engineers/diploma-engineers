<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Latest Result | Diploma Engineers</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">


<link rel="stylesheet" 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<style>


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;

}


body{

background:#f4f7fb;

}


/* HEADER */

#header{

width:100%;

}


/* MAIN */

.main{

padding:120px 15px 50px;

}


/* TITLE */


.page-title{

text-align:center;
font-size:32px;
font-weight:700;
margin-bottom:30px;
color:#0f172a;

}



/* CARD */


.result-card{


background:white;

border-radius:20px;

padding:22px;

margin-bottom:20px;

box-shadow:0 8px 25px rgba(0,0,0,.08);


transition:.3s;


}



.result-card:hover{

transform:translateY(-5px);

}



.result-card h3{

font-size:18px;
font-weight:600;
color:#1e293b;

}



.result-card p{

font-size:14px;
color:#64748b;

}



.btn-result{

background:#2563eb;

color:white;

padding:10px 20px;

border-radius:12px;

text-decoration:none;

display:inline-block;

font-weight:600;

}



.btn-result:hover{

background:#1d4ed8;

color:white;

}




.loader{

text-align:center;

font-size:18px;

}



#footer{

margin-top:40px;

}


</style>


</head>



<body>



<!-- HEADER -->

<div id="header"></div>




<!-- CONTENT -->


<div class="container main">


<h1 class="page-title">

<i class="fa-solid fa-square-poll-vertical"></i>

Latest Examination Result

</h1>



<div id="resultPosts">


<div class="loader">

Loading Latest Results...

</div>


</div>



</div>





<!-- FOOTER -->


<div id="footer"></div>





<script>


// LOAD HEADER


fetch("header.html")

.then(res=>res.text())

.then(data=>{


document.getElementById("header").innerHTML=data;


});





// LOAD FOOTER


fetch("footer.html")

.then(res=>res.text())

.then(data=>{


document.getElementById("footer").innerHTML=data;


});







// RESULT POSTS


fetch("https://sarkariresult.com.cm/wp-json/wp/v2/posts?search=Result&per_page=20")


.then(res=>res.json())


.then(posts=>{


let html="";



posts.forEach(post=>{


html +=`


<div class="result-card">


<h3>

${post.title.rendered}

</h3>



<p>

${post.excerpt.rendered}

</p>



<a class="btn-result"

href="${post.link}"

target="_blank">


<i class="fa-solid fa-eye"></i>

View Result


</a>



</div>


`;


});




document.getElementById("resultPosts").innerHTML=html;



})



.catch(error=>{


document.getElementById("resultPosts").innerHTML=

`
<div class="alert alert-danger text-center">

Result Update Load Nahi Ho Payi

</div>

`;

});



</script>



</body>

</html>
