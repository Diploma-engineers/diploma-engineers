<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diploma Engineers - Admin Panel</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
}

.container{
max-width:900px;
margin:25px auto;
padding:15px;
}

.card{
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
margin-bottom:20px;
}

h2,h3{
margin-bottom:15px;
}

input,
textarea,
select{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
}

textarea{
height:120px;
resize:vertical;
}

button{
padding:12px 18px;
border:none;
border-radius:8px;
background:#0d6efd;
color:#fff;
cursor:pointer;
font-size:15px;
}

button:hover{
background:#084298;
}

.logout{
background:#dc3545;
margin-left:10px;
}

.logout:hover{
background:#bb2d3b;
}

.item{
border-top:1px solid #ddd;
padding:15px 0;
}

.item img{
width:130px;
border-radius:8px;
margin:10px 0;
}

.small{
color:#666;
font-size:13px;
}

#adminPanel{
display:none;
}

.loading{
text-align:center;
padding:25px;
font-size:18px;
}

</style>

</head>

<body>

<div class="container">

<div class="card" id="loginBox">

<h2>Admin Login</h2>

<input
type="email"
id="email"
placeholder="Admin Email">

<input
type="password"
id="password"
placeholder="Password">

<button id="loginBtn">
Login
</button>

</div>

<div id="adminPanel">

<div class="card">

<h2>Publish News</h2>

<input
id="title"
placeholder="News Title">

<textarea
id="desc"
placeholder="Description"></textarea>

<input
id="thumb"
placeholder="Thumbnail Image URL">

<input
id="pdf"
placeholder="PDF / Google Drive Link">

<select id="cat">

<option>Notice</option>

<option>Result</option>

<option>Admission</option>

<option>Scholarship</option>

<option>Job</option>

</select>

<button id="publishBtn">
Publish News
</button>

<button
class="logout"
id="logoutBtn">
Logout
</button>

</div>

<div class="card">

<h3>Published News</h3>

<div id="list" class="loading">

Loading...

</div>

</div>

</div>

</div>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {

getAuth,

signInWithEmailAndPassword,

onAuthStateChanged,

signOut

}

from

"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {

getFirestore,

collection,

addDoc,

getDocs,

deleteDoc,

doc,

query,

orderBy,

serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig={

apiKey:"AIzaSyCcFZaHR5392I-zPgghzyTSHD53FRt4YKI",

authDomain:"myadmin-1b75f.firebaseapp.com",

projectId:"myadmin-1b75f",

storageBucket:"myadmin-1b75f.firebasestorage.app",

messagingSenderId:"1018557109448",

appId:"1:1018557109448:web:a0990e81d47ac64e6801fd"

};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);

const loginBox=document.getElementById("loginBox");

const adminPanel=document.getElementById("adminPanel");

const list=document.getElementById("list");
  // Login
document.getElementById("loginBtn").onclick = async () => {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!email || !password) {
    alert("Enter Email & Password");
    return;
  }

  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (e) {
    alert(e.message);
  }

};

// Check Login
onAuthStateChanged(auth, (user) => {

  if (user) {

    loginBox.style.display = "none";
    adminPanel.style.display = "block";

    loadNews();

  } else {

    loginBox.style.display = "block";
    adminPanel.style.display = "none";

  }

});

// Publish News
document.getElementById("publishBtn").onclick = async () => {

  const title = document.getElementById("title").value.trim();
  const desc = document.getElementById("desc").value.trim();
  const thumb = document.getElementById("thumb").value.trim();
  const pdf = document.getElementById("pdf").value.trim();
  const cat = document.getElementById("cat").value;

  if (title == "" || desc == "") {

    alert("Title & Description Required");
    return;

  }

  try {

    await addDoc(collection(db, "news"), {

      title,
      desc,
      thumb,
      pdf,
      cat,
      date: serverTimestamp()

    });

    document.getElementById("title").value = "";
    document.getElementById("desc").value = "";
    document.getElementById("thumb").value = "";
    document.getElementById("pdf").value = "";

    alert("News Published");

    loadNews();

  } catch (e) {

    alert(e.message);

  }

};

// Load News
async function loadNews() {

  list.innerHTML = "Loading...";

  const q = query(
    collection(db, "news"),
    orderBy("date", "desc")
  );

  const snap = await getDocs(q);

  list.innerHTML = "";

  if (snap.empty) {

    list.innerHTML = "<center>No News Found</center>";
    return;

  }

  snap.forEach((d) => {

    const n = d.data();

    let date = "";

    if (n.date) {

      date = n.date.toDate().toLocaleString();

    }

    list.innerHTML += `

<div class="item">

<h3>${n.title}</h3>

<div class="small">
${n.cat} | ${date}
</div>

${n.thumb ?
`<img src="${n.thumb}">`
: ""}

<p>${n.desc}</p>

${n.pdf ?
`<a href="${n.pdf}" target="_blank">Open PDF</a><br><br>`
: ""}

<button onclick="deleteNews('${d.id}')">
Delete
</button>

</div>

`;

  });

}

// Delete News
window.deleteNews = async (id) => {

  if (!confirm("Delete this News?"))
    return;

  await deleteDoc(doc(db, "news", id));

  loadNews();

};

// Logout
document.getElementById("logoutBtn").onclick = () => {

  signOut(auth);

};

</script>

</body>
</html>
