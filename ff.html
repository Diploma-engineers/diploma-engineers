<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diploma Engineers</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Hero CSS -->
<link rel="stylesheet" href="hero.css">

</head>

<body>

<!-- Header -->
<div id="header"></div>

<!-- Hero -->
<section class="hero">

<div class="container text-center py-5">

<h1>Welcome to Diploma Engineers</h1>

<p class="lead">
Free Polytechnic Study Notes, Books, PYQ, Syllabus, Results and Career Guidance.
</p>

<a href="notes.html" class="btn btn-primary btn-lg mt-3">
Explore Notes
</a>

</div>

</section>

<!-- Achievement -->
<div id="achievement"></div>

<!-- Join -->
<div id="join"></div>

<!-- Footer -->
<div id="footer"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>

function load(id,file){

fetch(file)

.then(response=>{

if(!response.ok){

throw new Error(file+" not found");

}

return response.text();

})

.then(data=>{

document.getElementById(id).innerHTML=data;

})

.catch(error=>{

console.error(error);

document.getElementById(id).innerHTML=
"<div style='padding:20px;text-align:center;color:red;'>Unable to load "+file+"</div>";

});

}

load("header","header.html");
load("achievement","achievement.html");
load("join","join.html");
load("footer","footer.html");

</script>

</body>

</html>
