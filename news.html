<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diploma Engineers News</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#f4f7fb;
color:#1e293b;
}

/* HERO */

.news-hero{
background:linear-gradient(135deg,#0d1b2a,#2563eb);
padding:100px 20px 70px;
text-align:center;
color:white;
border-radius:0 0 40px 40px;
}

.news-hero h1{
font-size:42px;
font-weight:800;
letter-spacing:.5px;
}

.news-hero p{
color:#dbeafe;
font-size:15px;
max-width:650px;
margin:15px auto;
}

/* NEWS CONTAINER */

.news-container{
max-width:900px;
margin:-40px auto 60px;
padding:20px;
}

/* CARD */

.card{
background:white;
border:none;
border-radius:25px;
padding:25px;
margin-bottom:25px;
box-shadow:0 15px 35px rgba(0,0,0,.08);
transition:.3s;
overflow:hidden;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 20px 45px rgba(0,0,0,.15);
}

/* TOP BAR */

.news-top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
gap:10px;
flex-wrap:wrap;
}

/* CATEGORY */

.category{
background:#2563eb;
color:white;
padding:6px 16px;
border-radius:30px;
font-size:13px;
font-weight:500;
display:inline-block;
}

/* SHARE BUTTON */

.share-btn{
border:none;
background:#0ea5e9;
color:#fff;
padding:10px 18px;
border-radius:30px;
cursor:pointer;
font-size:14px;
font-weight:600;
transition:.3s;
}

.share-btn:hover{
background:#0284c7;
}

/* TITLE */

.card h3{
font-size:24px;
font-weight:700;
color:#0f172a;
line-height:1.4;
}

/* IMAGE */

.card img{
width:100%;
height:350px;
object-fit:cover;
border-radius:18px;
margin:15px 0;
}

/* DESCRIPTION */

.card p{
font-size:15px;
color:#475569;
line-height:1.8;
}

/* BUTTONS */

.link-btn{
display:inline-flex;
align-items:center;
gap:8px;
background:#2563eb;
color:white;
padding:12px 20px;
border-radius:12px;
text-decoration:none;
font-size:14px;
font-weight:600;
margin-top:15px;
margin-right:10px;
transition:.3s;
}

.link-btn:hover{
background:#1d4ed8;
color:white;
}

/* DATE */

.date{
margin-top:20px;
display:inline-block;
background:#f1f5f9;
padding:6px 14px;
border-radius:20px;
font-size:13px;
color:#64748b;
}

/* LOADING */

.loading{
text-align:center;
padding:40px;
font-size:18px;
color:#64748b;
}

/* MOBILE */

@media(max-width:768px){

.news-hero{
padding:80px 20px 55px;
}

.news-hero h1{
font-size:32px;
}

.news-container{
padding:15px;
}

.card{
padding:20px;
}

.card h3{
font-size:20px;
}

.card img{
height:220px;
}

.news-top{
flex-direction:column;
align-items:flex-start;
}

.share-btn{
width:100%;
justify-content:center;
}

.link-btn{
display:flex;
justify-content:center;
width:100%;
margin-right:0;
}

}

</style>

</head>


  <body>

<!-- HEADER -->

<div id="header"></div>

<script>

fetch("header.html")
.then(res=>res.text())
.then(data=>{
document.getElementById("header").innerHTML=data;
});

</script>

<!-- HERO -->

<section class="news-hero">

<h1>
Latest News
</h1>

<p>
Diploma Engineers latest updates, notices, results, jobs and important announcements.
</p>

</section>

<!-- NEWS CONTAINER -->

<div class="news-container">

<div id="newsList" class="loading">

Loading News...

</div>

</div>

<!-- FOOTER -->

<div id="footer"></div>

<script>

fetch("footer.html")
.then(res=>res.text())
.then(data=>{
document.getElementById("footer").innerHTML=data;
});

</script>

<!-- FIREBASE -->

<script type="module">

import{

db,
ref,
onValue

}

from "./firebase.js";

const newsList=document.getElementById("newsList");

const newsRef=ref(db,"news");

  onValue(newsRef,(snapshot)=>{

newsList.innerHTML="";

if(!snapshot.exists()){

newsList.innerHTML=`
<div class="text-center p-5">

<h4>No News Available</h4>

</div>
`;

return;

}

let newsArray=[];

snapshot.forEach((child)=>{

newsArray.push({

id:child.key,

...child.val()

});

});

// Latest News First

newsArray.reverse();

// Clear Container

newsList.innerHTML="";

// Show All News

newsArray.forEach((n)=>{

newsList.innerHTML+=`

<div class="card">

<div class="news-top">

<span class="category">

${n.cat || "News"}

</span>

<button
class="share-btn"
onclick="shareNews('${n.title}','${n.id}')">

<i class="fa-solid fa-share-nodes"></i>

Share

</button>

</div>

<h3>

${n.title}

</h3>

${n.thumb ?

`<img src="${n.thumb}" alt="News Image">`

:""}

<p>

${n.desc || ""}

</p>


${n.pdf ?

`
<a
class="link-btn"
href="${n.pdf}"
target="_blank">

<i class="fa-solid fa-file-pdf"></i>

Open PDF / File

</a>

`

:""}

${n.link ?

`
<a
class="link-btn"
href="${n.link}"
target="_blank">

<i class="fa-solid fa-arrow-up-right-from-square"></i>

Open External Link

</a>

`

:""}

<div class="date">

<i class="fa-regular fa-calendar"></i>

${n.date || ""}

</div>

</div>

`;

});

});
//==============================
// SHARE NEWS
//==============================

window.shareNews=async(title,id)=>{

const url=window.location.origin+
window.location.pathname+
"#"+id;

if(navigator.share){

try{

await navigator.share({

title:title,

text:title,

url:url

});

}

catch(e){

console.log(e);

}

}

else{

navigator.clipboard.writeText(url);

alert("News link copied successfully.");

}

};

//==============================
// END SCRIPT
//==============================

</script>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
