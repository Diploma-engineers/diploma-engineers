<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diploma Engineers - Civil Special Course</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase App & Firestore SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  
  <!-- Razorpay Checkout Script -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    :root {
      --primary: #2563EB;
      --success: #10B981;
      --bg-color: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #1E293B;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
    }
    header {
      background: var(--primary);
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .main-container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      padding: 2rem;
      text-align: center;
    }
    .price-tag {
      font-size: 2rem;
      font-weight: bold;
      color: var(--primary);
      margin: 1rem 0;
    }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }
    .btn:hover { background: #1D4ED8; }
    .btn-success { background: var(--success); }
    .btn-success:hover { background: #059669; }
    
    /* Dashboard / Unlocked Grid */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
      text-align: left;
    }
    .subject-box {
      background: #F1F5F9;
      padding: 1rem;
      border-radius: 8px;
      border-left: 4px solid var(--primary);
    }
    .subject-box h4 { margin: 0 0 0.5rem 0; color: var(--primary); }
    .resource-list { list-style: none; padding: 0; text-align: left; margin-top: 1.5rem; }
    .resource-list li { padding: 0.5rem 0; border-bottom: 1px solid #E2E8F0; }
    .resource-list i { margin-right: 8px; color: var(--primary); }
    .auth-banner { background: #FEF3C7; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; color: #92400E; }
  </style>
</head>
<body>

  <header>
    <h2>Diploma Engineers</h2>
    <div id="userAuthStatus">Checking login...</div>
  </header>

  <div class="main-container">
    <div id="appContainer" class="card">
      <p>Loading course details...</p>
    </div>
  </div>

  <script>
    // --- 1. FIREBASE CONFIGURATION (यहाँ अपनी खुद की Firebase Details डालें) ---
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const db = firebase.firestore();

    // Track Auth State
    auth.onAuthStateChanged(async (user) => {
      const statusDiv = document.getElementById('userAuthStatus');
      if (user) {
        statusDiv.innerHTML = `<i class="fa-solid fa-user-check"></i> ${user.email || 'Logged In'}`;
        await checkCourseAccessAndRender(user.uid);
      } else {
        statusDiv.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Not Logged In`;
        // For testing/development, you can sign in anonymously or prompt login
        document.getElementById('appContainer').innerHTML = `
          <div class="auth-banner">Please log in to your Firebase account to view course status.</div>
          <button class="btn" onclick="loginAnonymouslyForTesting()">Quick Guest Login</button>
        `;
      }
    });

    // Helper for quick testing if user is not logged in
    function loginAnonymouslyForTesting() {
      auth.signInAnonymously().catch(error => {
        alert("Auth Error: " + error.message);
      });
    }

    // --- 2. CHECK COURSE ACCESS VIA EXACT PATH: users/{UID}/purchases/civil_special ---
    async function checkCourseAccessAndRender(uid) {
      const container = document.getElementById('appContainer');
      container.innerHTML = `<p><i class="fa-solid fa-spinner fa-spin"></i> Verifying course access...</p>`;

      try {
        const purchaseRef = db.collection('users').doc(uid).collection('purchases').doc('civil_special');
        const docSnap = await purchaseRef.get();

        if (docSnap.exists) {
          const data = docSnap.data();
          // Verify exact condition: purchased + paid + 499 + INR
          if (data.status === 'paid' && data.amount === 499 && data.currency === 'INR') {
            renderFullCivilCourse(container); // YES Path
            return;
          }
        }
        
        // NO Path: Show Payment Gate
        renderPaymentGate(container);

      } catch (error) {
        console.error("Error checking Firestore:", error);
        container.innerHTML = `<p style="color:red;">Error loading course status. Please check console.</p>`;
      }
    }

    // --- 3. RENDER PAYMENT GATE (NO PATH) ---
    function renderPaymentGate(container) {
      container.innerHTML = `
        <i class="fa-solid fa-graduation-cap" style="font-size: 3rem; color: var(--primary);"></i>
        <h2>BTEUP Civil Special Course (Sem 3 & 4)</h2>
        <p>Get lifetime access to complete video lectures, handwritten notes, PYQs, and interactive doubts.</p>
        <div class="price-tag">₹499 <span style="font-size: 1rem; color: #64748B;">(One-Time Payment / INR)</span></div>
        <button class="btn" onclick="initiateRazorpayPayment()">
          <i class="fa-solid fa-lock-open"></i> Pay ₹4.99 & Unlock Now
        </button>
      `;
    }

    // --- 4. RAZORPAY PAYMENT GATEWAY INTEGRATION ---
    function initiateRazorpayPayment() {
      const user = auth.currentUser;
      if (!user) {
        alert("Please log in first!");
        return;
      }

      const options = {
        key: "YOUR_RAZORPAY_KEY_ID", // अपना Razorpay Key ID यहाँ डालें
        amount: 49900, // 499 INR in paisa
        currency: "INR",
        name: "Diploma Engineers",
        description: "Civil Special Course Lifetime Access",
        handler: async function (response) {
          alert("Payment Successful! Payment ID: " + response.razorpay_payment_id);
          await savePurchaseToFirestore(user.uid, response.razorpay_payment_id);
        },
        prefill: {
          email: user.email || "student@diplomaengineers.com"
        },
        theme: {
          color: "#2563EB"
        }
      };

      const rzp = new Razorpay(options);
      rzp.open();
    }

    // --- 5. SAVE TO EXACT FIRESTORE PATH UPON SUCCESS ---
    async function savePurchaseToFirestore(uid, paymentId) {
      const container = document.getElementById('appContainer');
      container.innerHTML = `<p><i class="fa-solid fa-spinner fa-spin"></i> Unlocking course and updating database...</p>`;

      try {
        const purchaseRef = db.collection('users').doc(uid).collection('purchases').doc('civil_special');
        
        await purchaseRef.set({
          courseId: 'civil_special',
          status: 'paid',
          amount: 499,
          currency: 'INR',
          paymentId: paymentId,
          purchasedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        // Re-render full course UI
        renderFullCivilCourse(container);
      } catch (error) {
        console.error("Firestore write error:", error);
        alert("Payment was successful, but database update failed. Contact support.");
      }
    }

    // --- 6. RENDER FULL ORIGINAL CIVIL COURSE (YES PATH) ---
    function renderFullCivilCourse(container) {
      container.innerHTML = `
        <div style="background: #ECFDF5; color: #065F46; padding: 0.75rem; border-radius: 8px; margin-bottom: 1.5rem; font-weight: bold;">
          <i class="fa-solid fa-circle-check"></i> Course Unlocked Successfully (Lifetime Access)
        </div>
        
        <h2 style="margin-top:0;">📚 BTEUP Civil Engineering - Special Package</h2>
        <p style="color: #64748B;">Semester 3 & 4 Complete Academic Material</p>

        <div class="dashboard-grid">
          <div class="subject-box">
            <h4>Semester 3 Subjects</h4>
            <p>• Hydraulics & Hydraulic Machines<br>• Surveying-I<br>• Building Construction</p>
          </div>
          <div class="subject-box">
            <h4>Semester 4 Subjects</h4>
            <p>• Concrete Technology<br>• Irrigation Engineering<br>• Structural Mechanics</p>
          </div>
        </div>

        <ul class="resource-list">
          <li><i class="fa-solid fa-video"></i> <strong>HD Video Playlists:</strong> Chapter-wise detailed explanations</li>
          <li><i class="fa-solid fa-file-pdf"></i> <strong>PDF Notes:</strong> Handwritten lecture notes & blueprints</li>
          <li><i class="fa-solid fa-comments"></i> <strong>Comments & Doubts:</strong> Direct discussion thread for questions</li>
          <li><i class="fa-solid fa-star"></i> <strong>Course Rating:</strong> 4.9/5 verified student reviews</li>
        </ul>

        <button class="btn btn-success" style="margin-top: 1.5rem;" onclick="alert('Redirecting to Video Player & Study Materials...')">
          <i class="fa-solid fa-play"></i> Start Learning Now
        </button>
      `;
    }
  </script>
</body>
</html>
