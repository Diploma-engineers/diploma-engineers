<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Books</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f9fc;color:#111827}
#booksPage{width:100%;min-height:100vh;background:#f7f9fc}
.books-container{width:100%;max-width:1400px;margin:auto;padding:20px}
.books-tools{display:flex;flex-direction:column;gap:16px}
.books-search{width:100%;height:52px;display:flex;align-items:center;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:0 16px;box-shadow:0 4px 15px rgba(0,0,0,.04);transition:.2s}
.books-search:focus-within{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.search-icon{font-size:25px;line-height:1;color:#64748b;margin-right:10px;pointer-events:none}
.books-search input{width:100%;border:0;outline:0;background:transparent;font-size:15px;color:#111827}
.books-search input::placeholder{color:#94a3b8}
.books-result{display:flex;align-items:center;margin:20px 2px 14px}
#bookCount{font-size:14px;font-weight:700;color:#475569}
.books-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;width:100%}
.book-card{position:relative;background:#fff;border:1px solid #e8edf3;border-radius:16px;overflow:hidden;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .18s,box-shadow .18s,border-color .18s;box-shadow:0 5px 18px rgba(15,23,42,.05)}
.book-card:hover{transform:translateY(-4px);border-color:#dbeafe;box-shadow:0 12px 28px rgba(15,23,42,.10)}
.book-card:active{transform:scale(.975)}
.book-cover{width:100%;aspect-ratio:3/4;background:#f1f5f9;overflow:hidden;position:relative}
.book-cover img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.book-info{padding:13px}
.book-title{font-size:15px;font-weight:700;color:#111827;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book-category{display:inline-block;margin-top:8px;padding:4px 8px;border-radius:6px;background:#eff6ff;color:#2563eb;font-size:11px;font-weight:700;text-transform:capitalize}
.book-pdf{position:absolute;top:10px;right:10px;padding:5px 8px;border-radius:6px;background:rgba(255,255,255,.94);color:#dc2626;font-size:10px;font-weight:800;box-shadow:0 3px 10px rgba(0,0,0,.10);pointer-events:none}
.no-books{text-align:center;padding:70px 20px;color:#64748b}
.no-books-icon{font-size:48px;margin-bottom:12px}
.no-books h3{margin:0 0 8px;color:#1e293b;font-size:20px}
.no-books p{margin:0;font-size:14px}
@media(max-width:600px){
.books-container{padding:14px} .books-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.book-card{border-radius:13px} .book-info{padding:10px} .book-title{font-size:13px} .books-search{height:48px}
}
</style>
</head>
<body>
<div id="booksPage" class="page">
  <div class="books-container">
    <div class="books-tools">
      <div class="books-search">
        <span class="search-icon">⌕</span>
        <input type="text" id="bookSearch" placeholder="Search books..." autocomplete="off" spellcheck="false">
      </div>
    </div>
    <div class="books-result"><span id="bookCount">0 Books</span></div>
    <div class="books-grid" id="booksGrid" aria-live="polite"></div>
    <div class="no-books" id="noBooks" style="display:none;">
      <div class="no-books-icon">📚</div>
      <h3>No Books Found</h3>
      <p>Search करके दूसरी book try करें।</p>
    </div>
  </div>
</div>

let books=[];
function escapeHTML(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
function renderBooks(){
 const q=search.value.trim().toLowerCase();
 const filtered=books.filter(b=>!q||String(b.title).toLowerCase().includes(q)||String(b.category||"").toLowerCase().includes(q));
 count.textContent=filtered.length+(filtered.length===1?" Book":" Books"); grid.innerHTML=""; noBooks.style.display=filtered.length?"none":"block";
 filtered.forEach(book=>{const card=document.createElement("div");card.className="book-card";card.setAttribute("role","button");card.setAttribute("tabindex","0");
 card.innerHTML=`<div class="book-cover"><img src="${escapeHTML(book.image||"")}" alt="${escapeHTML(book.title)}" loading="lazy"><span class="book-pdf">PDF</span></div><div class="book-info"><div class="book-title">${escapeHTML(book.title)}</div><span class="book-category">${escapeHTML(book.category||"Book PDF")}</span></div>`;
 card.onclick=()=>{if(book.pdf)window.open(book.pdf,"_blank","noopener");}; card.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();card.click();}}; grid.appendChild(card);});
}
search.addEventListener("input",renderBooks);
onValue(ref(db,"books"),snapshot=>{const data=snapshot.val()||{};books=Object.entries(data).map(([id,b])=>({id,...b})).filter(b=>b.title&&b.pdf).sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0)); if(!books.length) books=fallbackBooks.map((b,i)=>({id:`legacy_${i+1}`,...b})); renderBooks();});
</script>
