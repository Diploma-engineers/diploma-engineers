<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
}

#loader{

position:fixed;
inset:0;

display:flex;
align-items:center;
justify-content:center;

background:
radial-gradient(circle at center,
#f5fcff 0%,
#dff4ff 40%,
#bde5ff 100%);

z-index:999999;
overflow:hidden;

}


/* Animated Grid */

.tech-bg{

position:absolute;
inset:0;

background-image:

linear-gradient(rgba(0,180,255,.10) 1px,transparent 1px),
linear-gradient(90deg,rgba(0,180,255,.10) 1px,transparent 1px);

background-size:40px 40px;

animation:gridMove 6s linear infinite;

}

@keyframes gridMove{

from{
transform:translateY(0);
}

to{
transform:translateY(40px);
}

}



/* Glass Card */

.loader-card{

position:relative;

width:min(92vw,450px);

padding:40px 20px;

background:rgba(255,255,255,.65);

backdrop-filter:blur(20px);

border-radius:30px;

border:1px solid rgba(255,255,255,.8);

box-shadow:

0 20px 60px rgba(0,120,255,.25);

text-align:center;

z-index:2;

}



/* Logo */

.logo-box{

width:clamp(170px,38vw,220px);

height:clamp(170px,38vw,220px);

margin:auto;

display:flex;
align-items:center;
justify-content:center;

position:relative;

}



.logo-box img{

width:clamp(90px,22vw,120px);

height:clamp(90px,22vw,120px);

border-radius:50%;

object-fit:cover;

z-index:5;

box-shadow:

0 0 25px #00c6ff,
0 0 45px rgba(0,198,255,.6);

}



/* Rings */

.outer-ring{

position:absolute;

width:100%;
height:100%;

border-radius:50%;

border:4px dashed #00bfff;

animation:spin 8s linear infinite;

}

.inner-ring{

position:absolute;

width:75%;
height:75%;

border-radius:50%;

border:3px solid transparent;

border-top-color:#ff3cac;
border-bottom-color:#2563eb;

animation:spin2 4s linear infinite;

}

@keyframes spin{

100%{
transform:rotate(360deg);
}

}

@keyframes spin2{

100%{
transform:rotate(-360deg);
}

}



/* Glow */

.pulse{

position:absolute;

width:65%;
height:65%;

border-radius:50%;

background:#00c6ff;

opacity:.25;

animation:pulse 2s infinite;

}

@keyframes pulse{

50%{

transform:scale(1.5);

opacity:0;

}

}



/* Title */

h1{

margin-top:30px;

font-size:clamp(28px,5vw,40px);

font-weight:800;

color:#0f172a;

}

h1 span{

color:#009dff;

}

.tagline{

margin-top:12px;

font-size:clamp(11px,2.5vw,14px);

letter-spacing:3px;

font-weight:600;

color:#64748b;

}



/* Status */

.status{

display:flex;
align-items:center;
justify-content:center;
gap:10px;

margin-top:30px;

font-size:clamp(13px,3vw,15px);

color:#475569;

}

.icon{

font-size:26px;

animation:gear 2s linear infinite;

}

@keyframes gear{

100%{

transform:rotate(360deg);

}

}



/* Progress */

.progress{

width:100%;

max-width:320px;

height:10px;

margin:25px auto;

background:#dce7f5;

border-radius:30px;

overflow:hidden;

}

.progress-bar{

height:100%;

width:0;

border-radius:30px;

background:linear-gradient(
90deg,
#00c6ff,
#2563eb,
#ff3cac
);

animation:progress 4s forwards;

}

@keyframes progress{

100%{

width:100%;

}

}

.percent{

font-size:14px;

color:#64748b;

}



/* Mobile */

@media(max-width:600px){

.loader-card{

padding:30px 18px;

border-radius:22px;

}

.status{

flex-direction:column;

gap:6px;

}

.tagline{

letter-spacing:2px;

}

.progress{

max-width:100%;

}

}
