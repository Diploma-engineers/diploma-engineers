
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2563eb">
<title>Books | Diploma Engineers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{
  --blue:#2563eb;--dark:#0f172a;--text:#334155;--muted:#64748b;
  --border:#e2e8f0;--bg:#f8fafc;--white:#fff;
  --shadow:0 8px 25px rgba(15,23,42,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;min-height:0;background:transparent!important;
  font-family:"Plus Jakarta Sans",sans-serif;color:var(--text);overflow-x:hidden;
}
body.reader-open{overflow:hidden}
button,textarea{font:inherit} button{cursor:pointer}
.books-wrap{width:100%;margin:0;padding:0}
.books-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.books-title{font-size:16px;font-weight:800;color:var(--dark)}
.books-title span{color:var(--blue)}
.books-sub{font-size:9px;color:var(--muted);font-weight:700}

.books-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%
}
.book-card{
  overflow:hidden;background:#fff;border:1px solid var(--border);border-radius:15px;
  box-shadow:var(--shadow);cursor:pointer;-webkit-tap-highlight-color:transparent
}
.book-cover{position:relative;width:100%;aspect-ratio:3/4;background:#eef2ff;overflow:hidden}
.book-cover-frame{
  position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff
}
.cover-label{
  position:absolute;left:8px;right:8px;bottom:8px;z-index:2;color:#fff;
  font-size:10px;line-height:1.35;font-weight:800;text-shadow:0 2px 7px rgba(0,0,0,.4)
}
.cover-shade{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(2,6,23,.82),transparent 65%)
}
.open-pill{
  display:inline-flex;align-items:center;gap:5px;margin-top:5px;
  padding:4px 7px;border-radius:999px;background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.35);font-size:8px
}
.book-meta{padding:8px}
.book-meta-line{display:flex;justify-content:space-between;align-items:center;gap:6px}
.book-type{font-size:8px;color:var(--muted);font-weight:700}
.read-pill{font-size:8px;font-weight:800;color:#1d4ed8;background:#eff6ff;border:1px solid #bfdbfe;border-radius:999px;padding:4px 6px}

/* reader */
.reader{
  position:fixed;inset:0;z-index:99999;display:none;flex-direction:column;background:#111827
}
.reader.active{display:flex}
.reader-top{
  height:58px;flex:0 0 58px;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;padding:8px 10px
}
.icon-btn{
  width:38px;height:38px;flex:0 0 38px;border:1px solid var(--border);border-radius:50%;
  background:#f8fafc;color:var(--dark);display:flex;align-items:center;justify-content:center
}
.reader-title{flex:1;min-width:0}
.reader-title strong{display:block;font-size:12px;color:var(--dark);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader-title small{display:block;font-size:8px;color:var(--muted);margin-top:2px}

.reader-main{flex:1;min-height:0;display:flex;overflow:hidden;background:#525252}
.pdf-area{flex:1;min-width:0;min-height:0;background:#525252}
.pdf-frame{width:100%;height:100%;border:0;display:block;background:#fff}

.side-panel{
  width:350px;flex:0 0 350px;background:#fff;border-left:1px solid var(--border);
  overflow:auto;padding:14px
}
.book-info{padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--border)}
.book-info h2{font-size:15px;color:var(--dark);margin-bottom:4px}
.book-info p{font-size:10px;line-height:1.5;color:var(--muted)}
.engagement{display:flex;gap:7px;margin-bottom:12px}
.engage-btn{
  flex:1;height:40px;border:1px solid var(--border);border-radius:11px;background:#fff;color:var(--muted);
  display:flex;align-items:center;justify-content:center;gap:5px;font-size:10px;font-weight:800
}
.engage-btn.active.like{color:#2563eb;background:#eff6ff;border-color:#bfdbfe}
.engage-btn.active.save{color:#16a34a;background:#f0fdf4;border-color:#bbf7d0}
.login-note{display:none;margin-bottom:10px;padding:10px;border-radius:11px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;font-size:9px;font-weight:700;line-height:1.5}
.comment-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.comment-head h3{font-size:12px;color:var(--dark)} .comment-count{font-size:8px;color:var(--muted);font-weight:700}
.comment-form{display:flex;gap:7px;align-items:flex-end;margin-bottom:12px}
.comment-avatar{
  width:32px;height:32px;flex:0 0 32px;border-radius:50%;overflow:hidden;display:flex;
  align-items:center;justify-content:center;background:#eff6ff;color:var(--blue);border:1px solid #dbeafe
}
.comment-avatar img{width:100%;height:100%;object-fit:cover}
.comment-input-wrap{flex:1;min-width:0}
.comment-input{width:100%;min-height:38px;max-height:100px;resize:vertical;border:1px solid var(--border);border-radius:10px;outline:none;padding:9px;font-size:10px;background:#f8fafc}
.comment-submit{width:38px;height:38px;border:0;border-radius:10px;background:var(--blue);color:#fff}
.comment-submit:disabled{opacity:.5}
.comments{display:flex;flex-direction:column;gap:10px}
.comment{display:flex;gap:7px}
.comment-body{flex:1;min-width:0;background:#f8fafc;border:1px solid #eef2f7;border-radius:11px;padding:8px}
.comment-top{display:flex;justify-content:space-between;gap:6px;margin-bottom:3px}
.comment-name{font-size:9px;font-weight:800;color:var(--dark)}
.comment-date{font-size:7px;color:#94a3b8;white-space:nowrap}
.comment-text{font-size:9px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.empty-comments{text-align:center;padding:18px 8px;color:var(--muted);font-size:9px}
.reader-status{
  min-height:40px;flex:0 0 40px;background:#fff;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:9px;font-weight:700
}
@media(max-width:900px){
  .reader-main{flex-direction:column;overflow:auto}
  .pdf-area{flex:0 0 58vh;min-height:290px}
  .side-panel{width:100%;flex:0 0 auto;border-left:0;border-top:1px solid var(--border)}
}
</style>
</head>

<body>

<div class="books-wrap">
  <div class="books-head">
    <div class="books-title">Books <span>Library</span></div>
    <div class="books-sub">2 books per row</div>
  </div>

  <div class="books-grid" id="booksGrid"></div>
</div>

<section class="reader" id="reader" aria-hidden="true">
  <div class="reader-top">
    <button class="icon-btn" id="readerBack"><i class="fa-solid fa-arrow-left"></i></button>
    <div class="reader-title">
      <strong id="readerTitle">Book</strong>
      <small>Diploma Engineers • Online Reader</small>
    </div>
    <button class="icon-btn" id="readerClose"><i class="fa-solid fa-xmark"></i></button>
  </div>

  <div class="reader-main">
    <div class="pdf-area">
      <iframe id="pdfFrame" class="pdf-frame" title="PDF Viewer" allow="fullscreen"></iframe>
    </div>

    <aside class="side-panel">
      <div class="book-info">
        <h2 id="sideBookTitle">Book</h2>
        <p>Read the book online and interact with other students.</p>
      </div>

      <div class="engagement">
        <button class="engage-btn like" id="likeBtn">
          <i class="fa-solid fa-thumbs-up"></i><span>Like</span><b id="likeCount">0</b>
        </button>
        <button class="engage-btn save" id="saveBtn">
          <i class="fa-solid fa-bookmark"></i><span>Save</span><b id="saveCount">0</b>
        </button>
      </div>

      <div class="login-note" id="loginNote"></div>

      <div class="comment-head">
        <h3>Comments</h3><span class="comment-count" id="commentCount">0 comments</span>
      </div>

      <form class="comment-form" id="commentForm">
        <div class="comment-avatar" id="commentUserAvatar"><i class="fa-solid fa-user"></i></div>
        <div class="comment-input-wrap">
          <textarea class="comment-input" id="commentInput" maxlength="500" placeholder="Write a comment..."></textarea>
        </div>
        <button class="comment-submit" id="commentSubmit" type="submit"><i class="fa-solid fa-paper-plane"></i></button>
      </form>

      <div class="comments" id="commentsList"></div>
    </aside>
  </div>

  <div class="reader-status" id="readerStatus">Ready</div>
</section>

<script>
/*
  IMPORTANT:
  This version does NOT use PDF.js.
  The actual PDF is loaded directly into a browser PDF iframe.
  This avoids CORS problems caused by PDF.js fetch().
*/

(function(){

  const BOOKS = [
    {
      name:"Applied Physics 2nd",
      pdf:"https://anubhavfinance.wordpress.com/wp-content/uploads/2026/05/mathematics-ii_75660889_2026_05_09_15_4128129.pdf"
    },
    {
      name:"Applied Mathematics 2nd",
      pdf:"https://anubhavfinance.wordpress.com/wp-content/uploads/2026/05/appliedphysics-iie-bookbydiplomaengineers28129-2.pdf"
    },
    {
      name:"Engineering Mechanics",
      pdf:"https://anubhavfinance.wordpress.com/wp-content/uploads/2026/05/engineeringmechanicse-bookbydiplomaengineers.pdf"
    },
    {
      name:"Design Of Steel Structures",
      pdf:"https://anubhavfinance.wordpress.com/wp-content/uploads/2024/11/desigen-of-steei-structure33.pdf"
    }
  ];

  const grid=document.getElementById("booksGrid");
  const reader=document.getElementById("reader");
  const pdfFrame=document.getElementById("pdfFrame");
  const readerTitle=document.getElementById("readerTitle");
  const sideBookTitle=document.getElementById("sideBookTitle");
  const status=document.getElementById("readerStatus");

  const likeBtn=document.getElementById("likeBtn");
  const saveBtn=document.getElementById("saveBtn");
  const likeCount=document.getElementById("likeCount");
  const saveCount=document.getElementById("saveCount");
  const loginNote=document.getElementById("loginNote");
  const commentsList=document.getElementById("commentsList");
  const commentCount=document.getElementById("commentCount");
  const commentForm=document.getElementById("commentForm");
  const commentInput=document.getElementById("commentInput");
  const commentSubmit=document.getElementById("commentSubmit");
  const commentUserAvatar=document.getElementById("commentUserAvatar");

  let currentBook=null;
  let currentBookId="";
  let currentUser=null;
  let db=null;
  let auth=null;
  let likeRef=null,saveRef=null,commentsRef=null;

  function esc(v){
    return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;")
      .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }

  function slug(v){
    return String(v).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,70);
  }

  function profile(){
    try{
      if(window.parent && window.parent.currentUserData) return window.parent.currentUserData;
    }catch(e){}
    return {};
  }

  function updateUser(){
    if(!currentUser){
      loginNote.style.display="block";
      loginNote.textContent="Login to Diploma Engineers to Like, Save and comment.";
      commentUserAvatar.innerHTML='<i class="fa-solid fa-user"></i>';
      return;
    }

    loginNote.style.display="none";
    const p=profile();
    const name=p.name||currentUser.displayName||"User";
    const pic=p.profilePic||currentUser.photoURL||"";

    commentUserAvatar.innerHTML=pic
      ? `<img src="${esc(pic)}" alt="User">`
      : `<span style="font-size:12px;font-weight:800">${esc(name.charAt(0).toUpperCase())}</span>`;
  }

  function renderCards(){
    grid.innerHTML="";
    BOOKS.forEach((book,index)=>{
      const card=document.createElement("article");
      card.className="book-card";

      /*
        We show the first PDF page through the browser's built-in PDF
        renderer itself. This is reliable for many public PDF hosts.
        There is no CORS fetch.
      */
      const previewUrl =
        book.pdf + (book.pdf.includes("#") ? "&" : "#") + "page=1";

      card.innerHTML=`
        <div class="book-cover">
          <iframe class="book-cover-frame"
            src="${esc(previewUrl)}"
            title="${esc(book.name)} preview"
            loading="lazy"></iframe>
          <div class="cover-shade"></div>
          <div class="cover-label">
            ${esc(book.name)}
            <div class="open-pill"><i class="fa-solid fa-book-open"></i> Open</div>
          </div>
        </div>
        <div class="book-meta">
          <div class="book-meta-line">
            <span class="book-type">PDF • Online Reader</span>
            <span class="read-pill">Read</span>
          </div>
        </div>
      `;

      card.addEventListener("click",()=>openBook(book,index));
      grid.appendChild(card);
    });
  }

  function detach(){
    try{ if(likeRef) likeRef.off(); }catch(e){}
    try{ if(saveRef) saveRef.off(); }catch(e){}
    try{ if(commentsRef) commentsRef.off(); }catch(e){}
    likeRef=saveRef=commentsRef=null;
  }

  function attach(){
    detach();
    if(!db || !currentBookId) return;

    likeRef=db.ref("books/"+currentBookId+"/likes");
    likeRef.on("value",snap=>{
      const data=snap.val()||{};
      likeCount.textContent=Object.keys(data).length;
      likeBtn.classList.toggle("active",!!currentUser && !!data[currentUser.uid]);
    });

    saveRef=db.ref("books/"+currentBookId+"/saves");
    saveRef.on("value",snap=>{
      const data=snap.val()||{};
      saveCount.textContent=Object.keys(data).length;
      saveBtn.classList.toggle("active",!!currentUser && !!data[currentUser.uid]);
    });

    commentsRef=db.ref("books/"+currentBookId+"/comments");
    commentsRef.on("value",snap=>{
      commentsList.innerHTML="";
      if(!snap.exists()){
        commentCount.textContent="0 comments";
        commentsList.innerHTML='<div class="empty-comments">No comments yet. Be the first to comment.</div>';
        return;
      }

      const arr=[];
      snap.forEach(c=>arr.push({id:c.key,...(c.val()||{})}));
      arr.sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0));

      commentCount.textContent=arr.length+" comment"+(arr.length===1?"":"s");

      arr.forEach(c=>{
        const d=document.createElement("div");
        d.className="comment";
        const pic=c.profilePic
          ? `<img src="${esc(c.profilePic)}" alt="Profile">`
          : `<span style="font-size:10px;font-weight:800">${esc(String(c.name||"U").charAt(0).toUpperCase())}</span>`;

        d.innerHTML=`
          <div class="comment-avatar">${pic}</div>
          <div class="comment-body">
            <div class="comment-top">
              <span class="comment-name">${esc(c.name||"Diploma Engineer")}</span>
              <span class="comment-date">${formatDate(c.createdAt)}</span>
            </div>
            <div class="comment-text">${esc(c.text||"")}</div>
          </div>
        `;
        commentsList.appendChild(d);
      });
    });
  }

  function formatDate(ts){
    if(!ts) return "Just now";
    const d=new Date(Number(ts));
    if(Number.isNaN(d.getTime())) return "Just now";
    return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});
  }

  function openBook(book,index){
    currentBook=book;
    currentBookId=slug(book.name)||("book-"+index);

    readerTitle.textContent=book.name;
    sideBookTitle.textContent=book.name;

    /*
      DIRECT PDF URL — no PDF.js, no fetch(), so the CORS error is avoided.
    */
    pdfFrame.src=book.pdf;

    status.textContent="Online PDF reader";
    reader.classList.add("active");
    reader.setAttribute("aria-hidden","false");
    document.body.classList.add("reader-open");

    updateUser();
    attach();

    history.pushState({bookReader:true},"","#book-"+encodeURIComponent(currentBookId));
  }

  function closeBook(fromHistory){
    detach();
    currentBook=null;
    currentBookId="";
    pdfFrame.src="";
    reader.classList.remove("active");
    reader.setAttribute("aria-hidden","true");
    document.body.classList.remove("reader-open");

    if(!fromHistory && location.hash.startsWith("#book-")) history.back();
  }

  likeBtn.addEventListener("click",async()=>{
    if(!currentUser){updateUser();return}
    if(!db||!currentBookId)return;
    const ref=db.ref("books/"+currentBookId+"/likes/"+currentUser.uid);
    try{
      if(likeBtn.classList.contains("active")) await ref.remove();
      else await ref.set(true);
    }catch(e){console.error(e);alert("Like could not be updated.");}
  });

  saveBtn.addEventListener("click",async()=>{
    if(!currentUser){updateUser();return}
    if(!db||!currentBookId)return;
    const ref=db.ref("books/"+currentBookId+"/saves/"+currentUser.uid);
    try{
      if(saveBtn.classList.contains("active")) await ref.remove();
      else await ref.set(true);
    }catch(e){console.error(e);alert("Save could not be updated.");}
  });

  commentForm.addEventListener("submit",async e=>{
    e.preventDefault();
    if(!currentUser){updateUser();return}
    if(!db||!currentBookId)return;

    const text=commentInput.value.trim();
    if(!text)return;

    commentSubmit.disabled=true;
    try{
      const p=profile();
      const ref=db.ref("books/"+currentBookId+"/comments").push();

      await ref.set({
        uid:currentUser.uid,
        name:p.name||currentUser.displayName||"Diploma Engineer",
        profilePic:p.profilePic||currentUser.photoURL||"",
        branch:p.branch||"",
        text:text.slice(0,500),
        createdAt:firebase.database.ServerValue.TIMESTAMP
      });

      commentInput.value="";
    }catch(e){
      console.error(e);
      alert("Comment could not be saved.");
    }finally{
      commentSubmit.disabled=false;
    }
  });

  document.getElementById("readerBack").addEventListener("click",()=>closeBook(false));
  document.getElementById("readerClose").addEventListener("click",()=>closeBook(false));

  window.addEventListener("popstate",()=>{
    if(reader.classList.contains("active")) closeBook(true);
  });

  document.addEventListener("keydown",e=>{
    if(!reader.classList.contains("active")) return;
    if(e.key==="Escape") closeBook(false);
    if(e.ctrlKey && ["s","p"].includes(e.key.toLowerCase())){
      e.preventDefault();
    }
  });

  /*
    Initialise Firebase. If app already loaded Firebase, get the existing
    app instead of creating a second instance.
  */
  try{
    if(!firebase.apps.length){
      firebase.initializeApp({
        apiKey:"AIzaSyCxe9H7zSxJQzgM8bN_UAdOnDHr5myH6CQ",
        authDomain:"diploma-app-9a378.firebaseapp.com",
        databaseURL:"https://diploma-app-9a378-default-rtdb.firebaseio.com",
        projectId:"diploma-app-9a378",
        storageBucket:"diploma-app-9a378.firebasestorage.app",
        messagingSenderId:"160233059797",
        appId:"1:160233059797:web:be38130ed64f8bd0afb95c"
      });
    }
    auth=firebase.auth();
    db=firebase.database();
    auth.onAuthStateChanged(u=>{
      currentUser=u;
      updateUser();
      if(currentBookId) attach();
    });
  }catch(e){
    console.warn("Firebase unavailable:",e);
    updateUser();
  }

  renderCards();
})();
</script>
</body>
</html>
