<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diploma Engineers News & Notifications</title>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* RESET & BASE STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f9;
            color: #1a202c;
            min-height: 100vh;
            padding: 15px;
        }

        /* MAIN CONTAINER */
        .news-page {
            width: 100%;
            max-width: 650px;
            margin: auto;
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        /* HEADER SECTION (Matching Image Header) */
        .page-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .header-icon {
            width: 42px;
            height: 42px;
            background: #eef2ff;
            color: #3b82f6;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .page-header h1 {
            font-size: 22px;
            font-weight: 800;
            color: #0f172a;
        }

        /* NEWS LIST CONTAINER */
        #newsList {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* NEWS CARD DESIGN */
        .news-card {
            background: #f8fafc;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            border-left: 5px solid #2563eb; /* Blue highlight line on left */
            padding: 16px;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .news-card:hover {
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
        }

        /* CATEGORY BADGE */
        .category {
            display: inline-block;
            background: #dbeafe;
            color: #1d4ed8;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        /* CARD TITLE */
        .news-title {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.4;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .news-title i {
            color: #2563eb;
            font-size: 15px;
        }

        /* SHORT DESCRIPTION */
        .news-description {
            font-size: 13px;
            line-height: 1.5;
            color: #64748b;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* CARD FOOTER */
        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 10px;
            border-top: 1px dashed #e2e8f0;
            font-size: 12px;
        }

        .news-date {
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
        }

        .action-links {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .action-btn {
            color: #2563eb;
            text-decoration: none;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            padding: 0;
        }

        .action-btn:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }

        /* SLIDING EXPANDABLE DETAILS & SHARE PANEL */
        .expandable-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0, 1, 0, 1);
            background: #ffffff;
            border-radius: 10px;
            margin-top: 0;
            padding: 0 12px;
            border: 0px solid #e2e8f0;
        }

        .expandable-panel.active {
            max-height: 500px;
            transition: max-height 0.3s ease-in-out;
            margin-top: 12px;
            padding: 12px;
            border-width: 1px;
        }

        /* THUMBNAIL IN EXPANDED VIEW */
        .card-thumbnail {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .full-desc {
            font-size: 13px;
            color: #334155;
            line-height: 1.6;
            margin-bottom: 10px;
            white-space: pre-wrap;
        }

        /* SHARE BUTTONS GRID */
        .share-grid {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #f1f5f9;
        }

        .share-icon-btn {
            flex: 1;
            height: 34px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            gap: 6px;
            font-weight: 600;
        }

        .share-whatsapp { background: #25D366; }
        .share-telegram { background: #229ED9; }
        .share-copy { background: #64748b; }

        /* LOADING & STATES */
        .loading, .empty, .error-box {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }
        .loading i { font-size: 24px; color: #2563eb; margin-bottom: 8px; }
    </style>
</head>

<body>

    <div class="news-page">

        <!-- HEADER -->
        <div class="page-header">
            <div class="header-icon">
                <i class="fa-regular fa-bell"></i>
            </div>
            <h1>Notifications & News</h1>
        </div>

        <!-- LIST CONTAINER -->
        <div id="newsList">
            <div class="loading">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>Loading Notifications...</p>
            </div>
        </div>

    </div>

    <!-- FIREBASE MODULE SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAbg1Q1ZPgF7mwaxyin7iglla01eDk_tKo",
            authDomain: "diplomaengineers-869df.firebaseapp.com",
            databaseURL: "https://diplomaengineers-869df-default-rtdb.firebaseio.com",
            projectId: "diplomaengineers-869df",
            storageBucket: "diplomaengineers-869df.appspot.com",
            messagingSenderId: "356779436080",
            appId: "1:356779436080:web:4b28da380e547420d0e5f5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const newsList = document.getElementById("newsList");

        function escapeHTML(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function validURL(value) {
            try {
                const url = new URL(value);
                return (url.protocol === "http:" || url.protocol === "https:");
            } catch {
                return false;
            }
        }

        function loadNews() {
            const newsRef = ref(db, "news");

            onValue(newsRef, snapshot => {
                newsList.innerHTML = "";

                if (!snapshot.exists()) {
                    newsList.innerHTML = `
                        <div class="empty">
                            <i class="fa-regular fa-newspaper" style="font-size:32px;"></i>
                            <p>कोई News या Update उपलब्ध नहीं है।</p>
                        </div>
                    `;
                    return;
                }

                const newsArray = [];
                snapshot.forEach(child => {
                    newsArray.push({
                        id: child.key,
                        data: child.val() || {}
                    });
                });

                newsArray.reverse(); // Latest news first
                newsArray.forEach(item => createNewsCard(item.id, item.data));
            }, error => {
                console.error(error);
                newsList.innerHTML = `
                    <div class="error-box">
                        <p>Data Load करने में समस्या हुई। कृपया पुनः प्रयास करें।</p>
                    </div>
                `;
            });
        }

        function createNewsCard(id, n) {
            const title = n.title || "Untitled News";
            const description = n.text || n.desc || n.description || "";
            const category = n.cat || n.category || "NOTIFICATION";
            const date = n.date || "Recent";
            const image = n.thumb || n.image || n.thumbnail || "";
            const externalLink = n.link || n.pdf || n.fileUrl || "";

            const card = document.createElement("article");
            card.className = "news-card";
            card.id = `card-${id}`;

            let actionTarget = externalLink && validURL(externalLink) ? 
                `<a href="${escapeHTML(externalLink)}" target="_blank" class="action-btn">View News <i class="fa-solid fa-arrow-right"></i></a>` : 
                `<button class="action-btn" onclick="toggleDetails('${id}')">Read More <i class="fa-solid fa-chevron-down"></i></button>`;

            card.innerHTML = `
                <span class="category">${escapeHTML(category)}</span>
                
                <h2 class="news-title">
                    <i class="fa-solid fa-square-check"></i>
                    ${escapeHTML(title)}
                </h2>

                <p class="news-description">${escapeHTML(description)}</p>

                <div class="card-footer">
                    <div class="news-date">
                        <i class="fa-regular fa-calendar"></i> ${escapeHTML(date)}
                    </div>
                    <div class="action-links">
                        <button class="action-btn" onclick="toggleDetails('${id}')">
                            <i class="fa-solid fa-share-nodes"></i> Share
                        </button>
                        ${actionTarget}
                    </div>
                </div>

                <!-- SLIDING EXPANDABLE PANEL -->
                <div class="expandable-panel" id="panel-${id}">
                    ${image && validURL(image) ? `<img src="${escapeHTML(image)}" class="card-thumbnail" alt="thumbnail">` : ''}
                    <div class="full-desc">${escapeHTML(description)}</div>
                    
                    <div class="share-grid">
                        <button class="share-icon-btn share-whatsapp" onclick="shareWhatsApp('${escapeHTML(title)}', '${id}')">
                            <i class="fa-brands fa-whatsapp"></i> WhatsApp
                        </button>
                        <button class="share-icon-btn share-telegram" onclick="shareTelegram('${escapeHTML(title)}', '${id}')">
                            <i class="fa-brands fa-telegram"></i> Telegram
                        </button>
                        <button class="share-icon-btn share-copy" onclick="copyLink('${escapeHTML(title)}', '${id}')">
                            <i class="fa-regular fa-copy"></i> Copy
                        </button>
                    </div>
                </div>
            `;

            newsList.appendChild(card);
        }

        // TOGGLE SLIDE DOWN FUNCTION
        window.toggleDetails = function(id) {
            const panel = document.getElementById(`panel-${id}`);
            if (panel) {
                panel.classList.toggle("active");
            }
        };

        // SHARE FUNCTIONS
        window.shareWhatsApp = function(title, id) {
            const url = window.location.href.split('#')[0] + '#card-' + id;
            const text = encodeURIComponent(`${title}\n\nRead details: ${url}`);
            window.open(`https://wa.me/?text=${text}`, '_blank');
        };

        window.shareTelegram = function(title, id) {
            const url = window.location.href.split('#')[0] + '#card-' + id;
            window.open(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(title)}`, '_blank');
        };

        window.copyLink = async function(title, id) {
            const url = window.location.href.split('#')[0] + '#card-' + id;
            try {
                await navigator.clipboard.writeText(`${title} - ${url}`);
                alert("Link Copied!");
            } catch (err) {
                prompt("Copy Link:", url);
            }
        };

        loadNews();
    </script>
</body>

</html>
