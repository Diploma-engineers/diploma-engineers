html,body{margin:0;padding:0}

#booksPage{width:100%;min-height:100vh;background:#f7f9fc}
.books-container{width:100%;max-width:1400px;margin:auto;padding:20px}
.books-header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}
.books-header h1{margin:0;font-size:28px;font-weight:800;color:#0f172a}
.books-header p{margin:5px 0 0;color:#64748b;font-size:13px}
.book-count{padding:8px 13px;border-radius:10px;background:#f1f5f9;color:#334155;font-size:13px;font-weight:800;white-space:nowrap}
.books-search{width:100%;height:50px;display:flex;align-items:center;background:#fff;border:1px solid #e5e7eb;border-radius:13px;padding:0 15px;margin-bottom:18px;box-shadow:0 3px 12px rgba(0,0,0,.035)}

.books-search input{width:100%;border:0;outline:0;background:transparent;font-size:15px;color:#111827}
.books-search input::placeholder{color:#94a3b8}
.books-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;width:100%}
.book-card{position:relative;background:#fff;border:1px solid #e8edf3;border-radius:15px;overflow:hidden;cursor:pointer;user-select:none;box-shadow:0 5px 18px rgba(15,23,42,.05);transition:transform .16s ease,box-shadow .16s ease}
.book-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(15,23,42,.09)}
.book-card:active{transform:scale(.98)}
.book-cover{width:100%;aspect-ratio:3/4;background:#eef2f7;overflow:hidden;position:relative}
.book-cover img{width:100%;height:100%;object-fit:cover;display:block}
.book-info{padding:11px}
.book-title{font-size:14px;font-weight:800;color:#111827;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.no-books{text-align:center;padding:70px 20px;color:#64748b}
.no-books-icon{font-size:48px;margin-bottom:12px}
.no-books h3{margin:0 0 8px;color:#1e293b;font-size:20px}
.no-books p{margin:0;font-size:14px}
@media(max-width:600px){
  .books-container{padding:12px}
  .books-header{align-items:flex-start;flex-direction:column}
  .books-header h1{font-size:23px}
  .books-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .book-card{border-radius:12px}
  .book-info{padding:9px}
  .book-title{font-size:12.5px}
  .books-search{height:47px}
}

function escapeHTML(value){
 return String(value||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function fallbackCover(title){
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800">
 <rect width="600" height="800" fill="#f1f5f9"/>
 <rect x="55" y="55" width="490" height="690" rx="22" fill="#fff" stroke="#dbe2ea"/>
 <text x="300" y="330" text-anchor="middle" font-size="110">📖</text>
 <text x="300" y="455" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#334155">${escapeHTML(title).replace(/&quot;/g,'"')}</text>
 </svg>`;
 return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(svg);
}

function cleanURL(value){
 try{
   const u=new URL(String(value||""));
   return (u.protocol==="https:"||u.protocol==="http:")?u.href:"";
 }catch(e){return "";}
}

function removeDuplicates(list){
 const seen=new Set();
 return list.filter(book=>{
   const key=cleanURL(book.pdf||book.link||book.url)||String(book.title||"").trim().toLowerCase();
   if(!key||seen.has(key)) return false;
   seen.add(key);
   return true;
 });
}

let books=[...defaultBooks];
let firebaseBooks=[];

/* Firebase/Admin books always stay ABOVE the permanent books. */
function getBookTime(book){
  const value =
    book.timestamp ??
    book.createdAt ??
    book.uploadedAt ??
    book.updatedAt ??
    book.created_at ??
    0;

  if(typeof value === "number") return value;
  const parsed = Date.parse(value);
  return Number.isNaN(parsed) ? 0 : parsed;
}

function mergeBooks(){
  /* Newest admin/founder uploads first, then the permanent books. */
  const latestUploads=[...firebaseBooks].sort((a,b)=>getBookTime(b)-getBookTime(a));
  books=[...latestUploads,...defaultBooks];
}

function renderBooks(){
 const query=search.value.trim().toLowerCase();
 const filtered=books.filter(book=>{
   const title=String(book.title||book.name||"").toLowerCase();
   const category=String(book.category||"").toLowerCase();
   return !query||title.includes(query)||category.includes(query);
 });

 count.textContent=filtered.length+(filtered.length===1?" Book":" Books");
 grid.innerHTML="";
 noBooks.style.display=filtered.length?"none":"block";

 filtered.forEach(book=>{
   const title=String(book.title||book.name||"Book").trim();
   const pdf=cleanURL(book.pdf||book.link||book.file||book.url||book.pdfUrl||book.fileUrl||"");
   if(!pdf) return;

   const card=document.createElement("article");
   card.className="book-card";

   const cover=document.createElement("div");
   cover.className="book-cover";

   const img=document.createElement("img");
   img.alt=title;
   img.loading="lazy";

   const info=document.createElement("div");
   info.className="book-info";

   const titleEl=document.createElement("div");
   titleEl.className="book-title";
   titleEl.textContent=title;

   info.appendChild(titleEl);
   cover.appendChild(img);
   card.appendChild(cover);
   card.appendChild(info);
   grid.appendChild(card);

   const image=cleanURL(book.image||book.thumbnail||book.thumb||book.cover||book.imageUrl||book.ownerPhoto||"");
   img.src=image||fallbackCover(title);
   img.onerror=()=>{img.onerror=null;img.src=fallbackCover(title)};

   card.addEventListener("click",()=>window.open(pdf,"_blank","noopener,noreferrer"));
 });
}

search.addEventListener("input",renderBooks);
renderBooks();

/*
 Firebase is only an ADDITIONAL source.
 The default books above are permanently embedded in this HTML,
 so they remain available even if Firebase is unavailable.
*/
try{
 onValue(ref(db,"books"),snapshot=>{
   firebaseBooks=[];
   if(snapshot.exists()){
     snapshot.forEach(child=>{
       const data=child.val();
       if(data) firebaseBooks.push({id:child.key,...data});
     });
   }
   mergeBooks();
   renderBooks();
 },error=>{
   console.error("Firebase read error:",error);
   if(!firebaseBooks.length){ books=[...defaultBooks]; renderBooks(); }
 });
}catch(error){
 console.error("Firebase initialization error:",error);
 if(!firebaseBooks.length){ books=[...defaultBooks]; renderBooks(); }
}

})();
</script>
