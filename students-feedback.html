<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Feedback | Diploma Engineers</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--blue:#2563eb;--ink:#0f172a;--muted:#64748b;--line:#e5eaf2;--bg:#f5f8ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef5ff 0,#f8fafc 280px,#f8fafc 100%);font-family:'Plus Jakarta Sans',sans-serif;color:var(--ink);min-height:100vh}.wrap{width:min(100% - 28px,1000px);margin:0 auto;padding:28px 0 50px}.head{text-align:center;padding:24px 14px 28px}.brand{display:inline-flex;align-items:center;gap:9px;background:#fff;border:1px solid #dce8ff;padding:9px 14px;border-radius:999px;color:#1d4ed8;font-size:12px;font-weight:800;box-shadow:0 5px 18px #1d4ed80c}.brand i{color:#f97316}.head h1{font-size:clamp(27px,5vw,42px);letter-spacing:-1.2px;margin:18px 0 8px;font-weight:800}.head h1 span{color:var(--blue)}.head p{margin:0;color:var(--muted);font-size:14px}.summary{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}.pill{background:white;border:1px solid var(--line);border-radius:13px;padding:10px 15px;font-size:12px;color:#475569;font-weight:700}.pill strong{color:var(--blue);font-size:16px;margin-right:5px}.toolbar{display:flex;gap:12px;align-items:center;margin:0 0 16px}.search{flex:1;display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:0 14px;min-width:0}.search i{color:#94a3b8}.search input{border:0;outline:0;width:100%;height:46px;font:inherit;font-size:13px;background:transparent}.refresh{border:1px solid #dbe5f4;background:#fff;color:#1d4ed8;border-radius:13px;height:46px;padding:0 15px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.refresh:active{transform:scale(.97)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.feedback{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 7px 24px #0f172a08;min-width:0}.top{display:flex;align-items:center;gap:11px}.avatar{width:44px;height:44px;flex:0 0 44px;border-radius:50%;background:linear-gradient(135deg,#dbeafe,#eff6ff);color:#2563eb;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.person{min-width:0;flex:1}.name{font-size:14px;font-weight:800;overflow-wrap:anywhere}.branch{font-size:11px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}.stars{color:#f59e0b;letter-spacing:1px;font-size:13px;margin:14px 0 9px}.message{font-size:13px;line-height:1.7;color:#334155;white-space:pre-wrap;overflow-wrap:anywhere}.date{font-size:10px;color:#94a3b8;margin-top:15px;padding-top:12px;border-top:1px solid #f1f5f9;display:flex;gap:6px;align-items:center}.state{grid-column:1/-1;background:#fff;border:1px dashed #cbd5e1;border-radius:18px;text-align:center;padding:45px 18px;color:var(--muted);font-size:13px}.spinner{width:30px;height:30px;border:3px solid #dbeafe;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}.footer{text-align:center;color:#94a3b8;font-size:11px;padding:28px 0 0}.footer strong{color:#64748b}@media(max-width:650px){.wrap{width:min(100% - 20px,1000px);padding-top:12px}.head{padding:20px 5px 24px}.grid{grid-template-columns:1fr;gap:11px}.feedback{padding:16px}.toolbar{gap:8px}.refresh{padding:0 12px}.head p{font-size:12px}}
</style>
</head>
<body><main class="wrap">
<header class="head"><div class="brand"><i class="fa-solid fa-graduation-cap"></i> DIPLOMA ENGINEERS</div><h1>Student <span>Feedback</span></h1><p>Real feedback shared by students of our learning platform.</p><div class="summary"><div class="pill"><strong id="totalCount">—</strong> Student Reviews</div><div class="pill"><strong id="averageRating">—</strong> Average Rating</div></div></header>
<div class="toolbar"><label class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="searchInput" type="search" placeholder="Search feedback or branch…" aria-label="Search feedback"></label><button class="refresh" id="refreshBtn"><i class="fa-solid fa-rotate"></i> Refresh</button></div>
<section class="grid" id="feedbackGrid" aria-live="polite"><div class="state"><div class="spinner"></div>Loading student feedback…</div></section>
<div class="footer">Powered by <strong>Diploma Engineers</strong> · Student voices, shared openly</div>
</main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
import { getDatabase, ref, onValue, get } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';
const firebaseConfig={apiKey:'AIzaSyCxe9H7zSxJQzgM8bN_UAdOnDHr5myH6CQ',authDomain:'diploma-app-9a378.firebaseapp.com',databaseURL:'https://diploma-app-9a378-default-rtdb.firebaseio.com',projectId:'diploma-app-9a378',storageBucket:'diploma-app-9a378.firebasestorage.app',messagingSenderId:'160233059797',appId:'1:160233059797:web:be38130ed64f8bd0afb95c'};
const db=getDatabase(initializeApp(firebaseConfig,'publicFeedbackPage'));
const grid=document.getElementById('feedbackGrid'),search=document.getElementById('searchInput');let all=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dateText(v){let n=Number(v||0);if(n>0&&n<1e12)n*=1000;if(!n)return 'Date not available';const d=new Date(n);return Number.isNaN(d.getTime())?'Date not available':d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
function render(){const q=search.value.trim().toLowerCase();const items=all.filter(x=>`${x.name||''} ${x.branch||''} ${x.message||''}`.toLowerCase().includes(q));if(!items.length){grid.innerHTML=`<div class="state"><i class="fa-regular fa-comment-dots" style="font-size:28px;display:block;margin-bottom:10px"></i>${all.length?'No feedback matches your search.':'No student feedback available yet.'}</div>`;return;}grid.innerHTML=items.map(x=>{const name=String(x.name||'Diploma Engineers Student');const stars=Math.max(0,Math.min(5,Math.round(Number(x.rating)||0)));const avatar=x.profilePic?`<img src="${esc(x.profilePic)}" alt="" loading="lazy" onerror="this.remove()">`:'';return `<article class="feedback"><div class="top"><div class="avatar">${avatar||esc(name.trim().charAt(0).toUpperCase()||'S')}</div><div class="person"><div class="name">${esc(name)}</div><div class="branch">${esc(x.branch||'Diploma Student')}</div></div></div><div class="stars" aria-label="${stars} out of 5 stars">${'★'.repeat(stars)}<span style="color:#e2e8f0">${'★'.repeat(5-stars)}</span></div><div class="message">${esc(x.message||'')}</div><div class="date"><i class="fa-regular fa-calendar"></i>${esc(dateText(x.createdAt||x.timestamp))}</div></article>`}).join('');}
function load(){grid.innerHTML='<div class="state"><div class="spinner"></div>Loading student feedback…</div>';get(ref(db,'feedback')).then(s=>{const v=s.val()||{};all=Object.entries(v).map(([id,x])=>({...x,id})).filter(x=>x&&typeof x==='object'&&String(x.message||'').trim()).sort((a,b)=>Number(b.createdAt||b.timestamp||0)-Number(a.createdAt||a.timestamp||0));document.getElementById('totalCount').textContent=all.length;const rated=all.map(x=>Number(x.rating)).filter(n=>n>0);document.getElementById('averageRating').textContent=rated.length?(rated.reduce((a,b)=>a+b,0)/rated.length).toFixed(1)+' ★':'—';render();}).catch(err=>{console.error(err);grid.innerHTML='<div class="state"><i class="fa-solid fa-triangle-exclamation" style="font-size:26px;display:block;margin-bottom:10px"></i>Feedback could not load. Check that public read access is enabled for the Firebase <b>/feedback</b> path.</div>';});}
search.addEventListener('input',render);document.getElementById('refreshBtn').addEventListener('click',load);load();
</script></body></html>
