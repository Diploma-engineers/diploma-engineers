<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTE UP Even Semester 2026 | Diploma Engineers</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f1f5f9;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
overflow:hidden;
}

.bg-circle{
position:absolute;
border-radius:50%;
filter:blur(90px);
z-index:0;
}

.circle1{
width:260px;
height:260px;
background:#2563eb;
top:-80px;
left:-80px;
opacity:.20;
}

.circle2{
width:260px;
height:260px;
background:#22c55e;
bottom:-80px;
right:-80px;
opacity:.20;
}

.card{
position:relative;
z-index:1;
width:100%;
max-width:430px;
background:#fff;
padding:35px 28px;
border-radius:28px;
box-shadow:0 15px 40px rgba(0,0,0,.08);
border:1px solid #e2e8f0;
text-align:center;
}

.icon{
width:85px;
height:85px;
margin:auto;
border-radius:20px;
background:#eff6ff;
display:flex;
justify-content:center;
align-items:center;
font-size:34px;
color:#2563eb;
margin-bottom:20px;
}

h2{
font-size:30px;
color:#0f172a;
margin-bottom:10px;
}

p{
font-size:14px;
color:#64748b;
line-height:1.7;
margin-bottom:25px;
}

.input-box{
position:relative;
margin-bottom:18px;
}

.input-box i{
position:absolute;
left:16px;
top:50%;
transform:translateY(-50%);
color:#64748b;
}

input{
width:100%;
padding:15px 15px 15px 45px;
border-radius:15px;
border:1px solid #cbd5e1;
background:#f8fafc;
font-size:15px;
outline:none;
transition:.3s;
}

input:focus{
border-color:#2563eb;
background:#fff;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:15px;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

.generate-btn{
background:#2563eb;
color:#fff;
}

.generate-btn:hover{
background:#1d4ed8;
}

.view{
display:none;
background:#16a34a;
color:#fff;
margin-top:15px;
}

.view.active{
display:block;
}

.view:hover{
background:#15803d;
}

.success{
display:none;
margin-top:18px;
padding:14px;
background:#ecfdf5;
border:1px solid #bbf7d0;
border-radius:15px;
color:#15803d;
font-size:14px;
}

.success.active{
display:block;
}

.footer{
margin-top:20px;
font-size:13px;
color:#94a3b8;
}

@media(max-width:600px){

.card{
padding:28px 20px;
}

h2{
font-size:25px;
}

}

</style>

</head>

<body>

<div class="bg-circle circle1"></div>
<div class="bg-circle circle2"></div>

<div class="card">

<div class="icon">
<i class="fa-solid fa-graduation-cap"></i>
</div>

<h2>Even Semester 2026</h2>

<p>
Enter your Enrollment Number and Date of Birth to generate your official BTEUP Result Link.
</p>

<div class="input-box">
<i class="fa-solid fa-id-card"></i>
<input
type="text"
id="enroll"
placeholder="Enrollment Number"
autocomplete="off">
</div>

<div class="input-box">
<i class="fa-solid fa-calendar-days"></i>
<input
type="text"
id="dob"
placeholder="DD/MM/YYYY"
maxlength="10"
autocomplete="off">
</div>

<button class="generate-btn" onclick="generate()">
<i class="fa-solid fa-link"></i>
Generate Result Link
</button>

<div class="success" id="msg">
✅ Result Link Generated Successfully
</div>

<button class="view" id="openBtn" onclick="openResult()">
<i class="fa-solid fa-arrow-up-right-from-square"></i>
Open Result
</button>

<div class="footer">
Developed by <b>DIPLOMA ENGINEERS</b>
</div>

</div>

<script>

let finalURL="";

/* Auto DOB Format */

document.getElementById("dob").addEventListener("input",function(e){

let v=e.target.value.replace(/\D/g,"");

if(v.length>2)
v=v.slice(0,2)+"/"+v.slice(2);

if(v.length>5)
v=v.slice(0,5)+"/"+v.slice(5,9);

e.target.value=v;

});

/* Validate DOB */

function validDOB(d){

return /^([0-2][0-9]|3[0-1])\/(0[1-9]|1[0-2])\/\d{4}$/.test(d);

}

/* Generate Link */

function generate(){

const enroll=document.getElementById("enroll").value.trim().toUpperCase();
const dob=document.getElementById("dob").value.trim();

if(enroll==""){
alert("Please Enter Enrollment Number");
return;
}

if(!validDOB(dob)){
alert("Please Enter Valid DOB (DD/MM/YYYY)");
return;
}

/* Base64 Encode */

const id=btoa(enroll);
const id2=btoa(dob);

/* Official Result URL */

finalURL=`https://result.bteexam.com/even/main/CS_RESULT.aspx?id=${encodeURIComponent(id)}&id2=${encodeURIComponent(id2)}`;

/* Show Success */

document.getElementById("msg").classList.add("active");
document.getElementById("openBtn").classList.add("active");

}

/* Open Result */

function openResult(){

if(finalURL!=""){
window.open(finalURL,"_blank");
}
else{
alert("Generate Result Link First");
}

}

</script>

</body>
</html>
