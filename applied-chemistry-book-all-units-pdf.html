  --accent: #f0a04b;
  --accent-ink: #f6c98a;
  --keybox-bg: #2b2417;
  --keybox-line: #c98f2e;
  --formula-bg: #1b2430;
  --formula-line: #7fb0e8;
  --page-edge: #33302a;
  --shadow: rgba(0, 0, 0, 0.5);
  --header-bg: #0d0c0a;
  --header-ink: #f0e8d8;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141210;
    --bg-warm: #1a1714;
    --surface: #201c17;
    --surface-2: #262019;
    --ink: #f0e8d8;
    --ink-soft: #c9bda6;
    --muted: #9a8c74;
    --line: #3d352a;
    --saffron: #f0a04b;
    --saffron-deep: #f0a04b;
    --blue: #7fb0e8;
    --blue-deep: #a8c8ef;
    --accent: #f0a04b;
    --accent-ink: #f6c98a;
    --keybox-bg: #2b2417;
    --keybox-line: #c98f2e;
    --formula-bg: #1b2430;
    --formula-line: #7fb0e8;
    --page-edge: #33302a;
    --shadow: rgba(0, 0, 0, 0.5);
    --header-bg: #0d0c0a;
    --header-ink: #f0e8d8;
  }
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Mukta', 'Noto Sans Devanagari', 'Nirmala UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: calc(16px * var(--font-scale));
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}

.font-display {
  font-family: 'Fraunces', 'Mukta', serif;
}

/* ---------- book page ---------- */

.book-stage {
  perspective: 2200px;
}

.book-page {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow: 0 18px 50px var(--shadow), inset 0 0 60px rgba(150,110,40,0.04);
  transform-origin: left center;
  backface-visibility: hidden;
  position: relative;
  overflow-x: clip;
}

.book-page::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(120,80,20,0.10), transparent 6%, transparent 96%, rgba(120,80,20,0.06));
  pointer-events: none;
  border-radius: 6px;
}

@keyframes flipOutNext {
  0% {
    transform: rotateY(0deg);
    opacity: 1;
  }

  60% {
    opacity: 1;
  }

  100% {
    transform: rotateY(-160deg);
    opacity: 0;
  }
}

@keyframes flipInNext {
  0% {
    transform: rotateY(140deg);
    opacity: 0;
  }

  100% {
    transform: rotateY(0deg);
    opacity: 1;
  }
}

@keyframes flipOutPrev {
  0% {
    transform: rotateY(0deg);
    opacity: 1;
  }

  60% {
    opacity: 1;
  }

  100% {
    transform: rotateY(160deg);
    opacity: 0;
  }
}

@keyframes flipInPrev {
  0% {
    transform: rotateY(-140deg);
    opacity: 0;
  }

  100% {
    transform: rotateY(0deg);
    opacity: 1;
  }
}

.anim-out-next {
  animation: flipOutNext 0.5s cubic-bezier(0.5,0,0.7,0.4) forwards;
}

.anim-in-next {
  animation: flipInNext 0.5s cubic-bezier(0.3,0.6,0.4,1) forwards;
}

.anim-out-prev {
  animation: flipOutPrev 0.5s cubic-bezier(0.5,0,0.7,0.4) forwards;
}

.anim-in-prev {
  animation: flipInPrev 0.5s cubic-bezier(0.3,0.6,0.4,1) forwards;
}

/* ---------- prose ---------- */

.prose-book h3 {
  font-family: 'Fraunces', 'Mukta', serif;
  color: var(--blue-deep);
  font-size: 1.18em;
  margin: 1.4em 0 0.55em;
  padding-bottom: 0.3em;
  border-bottom: 2px solid var(--line);
}

.prose-book h3 .hi-tag {
  font-family: 'Mukta', sans-serif;
}

.prose-book p {
  margin: 0.75em 0;
  color: var(--ink-soft);
}

.prose-book p strong, .prose-book li strong {
  color: var(--ink);
}

.prose-book ul, .prose-book ol {
  margin: 0.6em 0;
  padding-left: 1.4em;
  color: var(--ink-soft);
}

.prose-book li {
  margin: 0.35em 0;
}

.prose-book li::marker {
  color: var(--saffron-deep);
}

.keybox {
  background: var(--keybox-bg);
  border: 1.5px solid var(--keybox-line);
  border-left-width: 6px;
  border-radius: 10px;
  padding: 0.9em 1.1em;
  margin: 1.1em 0;
}

.keybox .keybox-title {
  font-weight: 700;
  color: var(--accent-ink);
  margin-bottom: 0.4em;
  display: flex;
  align-items: center;
  gap: 0.5em;
}

.keybox ul {
  margin: 0.3em 0;
}

.formula-strip {
  background: var(--formula-bg);
  border: 1px dashed var(--formula-line);
  border-radius: 10px;
  padding: 0.8em 1em;
  margin: 0.9em 0;
  font-family: 'Cambria Math', 'Mukta', serif;
  overflow-x: auto;
  white-space: nowrap;
}

.formula-strip .flabel {
  font-size: 0.78em;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--formula-line);
  font-weight: 700;
  display:block;
  margin-bottom: 0.35em;
  font-family: 'Mukta', sans-serif;
}

table.btable {
  width: 100%;
  border-collapse: collapse;
  margin: 1em 0;
  font-size: 0.94em;
}

table.btable th {
  background: var(--header-bg);
  color: var(--header-ink);
  padding: 0.6em 0.8em;
  text-align: left;
  font-weight: 600;
}

table.btable td {
  border: 1px solid var(--line);
  padding: 0.55em 0.8em;
  color: var(--ink-soft);
}

table.btable tr:nth-child(even) td {
  background: var(--surface-2);
}

/* ---------- components ---------- */

.diagram-frame {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0.6em;
  margin: 1.1em 0;
  box-shadow: 0 4px 14px var(--shadow);
}

.diagram-frame svg {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 8px;
}

.diagram-cap {
  text-align: center;
  font-size: 0.85em;
  color: var(--muted);
  margin-top: 0.4em;
  font-style: italic;
}

.chip {
  display:inline-block;
  padding: 0.15em 0.7em;
  border-radius: 999px;
  font-size: 0.8em;
  font-weight: 600;
}

.btn-nav {
  display: inline-flex;
  align-items: center;
  gap: 0.5em;
  padding: 0.7em 1.5em;
  border-radius: 999px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.btn-nav:active {
  transform: scale(0.96);
}

.btn-prev {
  background: var(--surface-2);
  color: var(--ink);
  border: 1.5px solid var(--line);
}

.btn-next {
  background: linear-gradient(135deg, var(--saffron), var(--saffron-deep));
  color: #fff;
  box-shadow: 0 6px 18px rgba(200,120,30,0.35);
}

.mcq-opt {
  border: 1.5px solid var(--line);
  border-radius: 10px;
  padding: 0.6em 0.9em;
  margin: 0.4em 0;
  cursor: pointer;
  transition: all 0.15s ease;
  background: var(--surface);
  color: var(--ink-soft);
}

.mcq-opt:hover {
  border-color: var(--saffron);
  background: var(--surface-2);
}

.mcq-opt.picked {
  border-color: var(--blue);
  background: var(--formula-bg);
}

.mcq-opt.correct {
  border-color: #2e7d32;
  background: rgba(46,125,50,0.10);
  color: var(--ink);
}

.mcq-opt.wrong {
  border-color: #c62828;
  background: rgba(198,40,40,0.08);
}

.unit-card {
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  cursor: pointer;
}

.unit-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 28px var(--shadow);
}

.sidebar-scroll::-webkit-scrollbar, .reader-scroll::-webkit-scrollbar {
  width: 8px;
}

.sidebar-scroll::-webkit-scrollbar-thumb, .reader-scroll::-webkit-scrollbar-thumb {
  background: var(--line);
  border-radius: 8px;
}

.lang-switch {
  display: inline-flex;
  background: rgba(255,255,255,0.14);
  border: 1.5px solid rgba(255,255,255,0.35);
  border-radius: 999px;
  padding: 3px;
  position: relative;
}

.lang-switch button {
  border: none;
  background: transparent;
  color: var(--header-ink);
  font-weight: 700;
  padding: 0.35em 1.1em;
  border-radius: 999px;
  cursor: pointer;
  font-size: 0.9em;
  z-index: 1;
  font-family: 'Mukta', sans-serif;
}

.lang-switch button.active {
  background: var(--saffron);
  color: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2.4em;
  height: 2.4em;
  border-radius: 999px;
  cursor: pointer;
  background: rgba(255,255,255,0.12);
  border: 1.5px solid rgba(255,255,255,0.25);
  color: var(--header-ink);
  transition: all 0.15s ease;
}

.icon-btn:hover {
  background: rgba(255,255,255,0.25);
}

.icon-btn.active {
  background: var(--saffron);
  border-color: var(--saffron);
  color: #fff;
}

.drawer {
  transition: transform 0.3s cubic-bezier(0.3,0.7,0.3,1);
}

.kbd-hint {
  font-size: 0.75em;
  color: var(--muted);
}

@media print {
  .no-print {
    display: none !important;
  }

  .book-page {
    box-shadow: none;
  }

  body {
    background: #fff;
  }
}

.hover\:opacity-80:hover{
  opacity: 0.8;
}

@media (min-width: 768px){
  .md\:block{
    display: block;
  }

  .md\:gap-2{
    gap: 0.5rem;
  }

  .md\:px-10{
    padding-left: 2.5rem;
    padding-right: 2.5rem;
  }

  .md\:px-4{
    padding-left: 1rem;
    padding-right: 1rem;
  }

  .md\:py-8{
    padding-top: 2rem;
    padding-bottom: 2rem;
  }

  .md\:py-9{
    padding-top: 2.25rem;
    padding-bottom: 2.25rem;
  }

  .md\:text-3xl{
    font-size: 1.875rem;
    line-height: 2.25rem;
  }

  .md\:text-4xl{
    font-size: 2.25rem;
    line-height: 2.5rem;
  }

  .md\:text-lg{
    font-size: 1.125rem;
    line-height: 1.75rem;
  }
}

      <p>In 1911, <strong>Ernest Rutherford</strong> and his students Geiger and Marsden performed the famous <strong>α-particle scattering experiment</strong>. A beam of fast-moving α-particles (helium nuclei, He²⁺) from a radioactive source was directed at a very thin gold foil, and the scattered particles were detected as tiny flashes on a zinc sulphide fluorescent screen.</p>
      <h3>Observations</h3>
      <ul>
        <li><strong>Most</strong> α-particles passed straight through the foil without any deflection.</li>
        <li><strong>Some</strong> were deflected through small angles.</li>
        <li><strong>Very few</strong> (about 1 in 20,000) were deflected through large angles, and a tiny fraction even bounced straight back.</li>
      </ul>
      <h3>Conclusions drawn by Rutherford</h3>
      <ul>
        <li>Since most particles passed through undeflected, the <strong>atom is mostly empty space</strong>.</li>
        <li>The large-angle deflection of a few particles showed that the <strong>entire positive charge and almost all the mass of the atom is concentrated in a tiny central region</strong> — the <strong>nucleus</strong>.</li>
        <li>The nucleus is extremely small: its radius (~10⁻¹⁵ m) is about 10,000–100,000 times smaller than the atomic radius (~10⁻¹⁰ m).</li>
        <li>Electrons revolve around the nucleus in circular orbits, like planets around the sun — hence the name <strong>planetary / nuclear model</strong>.</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ Key Points for Exams</div>
      <ul>
        <li>α-particles are doubly ionised helium atoms (He²⁺), mass ≈ 4 amu.</li>
        <li>Gold foil was chosen because gold is highly malleable — a foil only ~1000 atoms thick could be made.</li>
        <li>The experiment proved: <strong>atom = tiny dense nucleus + large empty space + revolving electrons</strong>.</li>
        <li>Charge on nucleus = +Ze, where Z = atomic number.</li>
      </ul></div>
      <h3>Drawbacks of Rutherford's model</h3>
      <ul>
        <li>According to Maxwell's electromagnetic theory, an accelerating charged particle (the revolving electron) should <strong>continuously radiate energy</strong>, spiral inward, and collapse into the nucleus — but atoms are stable.</li>
        <li>It could not explain the <strong>line spectrum</strong> of hydrogen (discrete coloured lines instead of a continuous rainbow).</li>
        <li>It said nothing about the <strong>arrangement of electrons</strong> in orbits.</li>
      </ul>
      <p>These failures set the stage for <strong>Bohr's model</strong>, which introduced the quantum idea of fixed energy orbits.</p>
    `,body_hi:`
      <p>सन् 1911 में <strong>अर्नेस्ट रदरफोर्ड</strong> और उनके शिष्यों गाइगर व मार्सडेन ने प्रसिद्ध <strong>α-कण प्रकीर्णन प्रयोग</strong> किया। एक रेडियोधर्मी स्रोत से प्राप्त तीव्रगामी α-कणों (हीलियम नाभिक, He²⁺) की किरणपुंज को बहुत पतली स्वर्ण पन्नी पर डाला गया, तथा प्रकीर्णित कणों को जिंक सल्फाइड प्रतिदीप्त पर्दे पर चमक के रूप में देखा गया।</p>
      <h3>प्रेक्षण</h3>
      <ul>
        <li><strong>अधिकांश</strong> α-कण बिना किसी विचलन के पन्नी के आर-पार चले गए।</li>
        <li><strong>कुछ</strong> कण छोटे कोणों पर विचलित हुए।</li>
        <li><strong>बहुत कम</strong> (लगभग 20,000 में 1) कण बड़े कोण पर विचलित हुए, और कुछ तो सीधे वापस लौट आए।</li>
      </ul>
      <h3>रदरफोर्ड के निष्कर्ष</h3>
      <ul>
        <li>चूँकि अधिकांश कण बिना विचलन के निकल गए, अतः <strong>परमाणु अधिकांशतः रिक्त स्थान</strong> है।</li>
        <li>कुछ कणों का बड़े कोण पर विचलन दर्शाता है कि परमाणु का <strong>सम्पूर्ण धनावेश और लगभग सम्पूर्ण द्रव्यमान एक अत्यंत सूक्ष्म केंद्रीय भाग</strong> में केंद्रित है — यही <strong>नाभिक (nucleus)</strong> है।</li>
        <li>नाभिक अत्यंत छोटा है: इसकी त्रिज्या (~10⁻¹⁵ m) परमाण्विक त्रिज्या (~10⁻¹⁰ m) से लगभग 10,000–100,000 गुना छोटी है।</li>
        <li>इलेक्ट्रॉन नाभिक के चारों ओर वृत्तीय कक्षाओं में परिक्रमण करते हैं, जैसे ग्रह सूर्य के चारों ओर — इसलिए इसे <strong>ग्रहीय / नाभिकीय मॉडल</strong> कहते हैं।</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ परीक्षा हेतु मुख्य बिंदु</div>
      <ul>
        <li>α-कण द्वि-आयनित हीलियम परमाणु (He²⁺) होते हैं, द्रव्यमान ≈ 4 amu।</li>
        <li>स्वर्ण पन्नी इसलिए चुनी गई क्योंकि सोना अत्यंत आघातवर्ध्य है — केवल ~1000 परमाणु मोटी पन्नी बनाई जा सकी।</li>
        <li>प्रयोग ने सिद्ध किया: <strong>परमाणु = सूक्ष्म सघन नाभिक + विशाल रिक्त स्थान + परिक्रमी इलेक्ट्रॉन</strong>।</li>
        <li>नाभिक पर आवेश = +Ze, जहाँ Z = परमाणु क्रमांक।</li>
      </ul></div>
      <h3>रदरफोर्ड मॉडल की कमियाँ</h3>
      <ul>
        <li>मैक्सवेल के विद्युतचुंबकीय सिद्धांत के अनुसार परिक्रमण करता आवेशित कण (इलेक्ट्रॉन) <strong>लगातार ऊर्जा विकरित</strong> करेगा, अंदर की ओर सर्पिल बनेगा और नाभिक में गिर जाएगा — परंतु परमाणु स्थायी होते हैं।</li>
        <li>यह हाइड्रोजन के <strong>रेखा स्पेक्ट्रम</strong> (सतत इंद्रधनुष के बजाय विविक्त रंगीन रेखाएँ) की व्याख्या नहीं कर सका।</li>
        <li>इसमें कक्षाओं में इलेक्ट्रॉनों की <strong>व्यवस्था</strong> के बारे में कुछ नहीं कहा गया।</li>
      </ul>
      <p>इन्हीं असफलताओं ने <strong>बोर के मॉडल</strong> का मार्ग प्रशस्त किया, जिसमें निश्चित ऊर्जा कक्षाओं की क्वांटम संकल्पना जोड़ी गई।</p>
    `,diagrams:["rutherford"],formulas_en:["Scattering angle θ relates to impact parameter b: cot(θ/2) = 2b / d","Nuclear radius ≈ 10⁻¹⁵ m · Atomic radius ≈ 10⁻¹⁰ m"],formulas_hi:["प्रकीर्णन कोण θ, संघात प्राचल b से: cot(θ/2) = 2b / d","नाभिकीय त्रिज्या ≈ 10⁻¹⁵ m · परमाण्विक त्रिज्या ≈ 10⁻¹⁰ m"],mcqs:[{q_en:"In Rutherford's experiment, most α-particles passed through the gold foil undeflected. This shows that:",q_hi:"रदरफोर्ड के प्रयोग में अधिकांश α-कण बिना विचलन के स्वर्ण पन्नी से निकल गए। इससे सिद्ध होता है कि:",opts_en:["Atom is mostly empty space","Nucleus is positively charged","Electrons are negatively charged","Gold is a soft metal"],opts_hi:["परमाणु अधिकांशतः रिक्त स्थान है","नाभिक धनावेशित है","इलेक्ट्रॉन ऋणावेशित हैं","सोना मृदु धातु है"],ans:0,exp_en:"Undeflected passage means the atom is largely empty.",exp_hi:"बिना विचलन के निकलना दर्शाता है कि परमाणु अधिकांशतः रिक्त है।"},{q_en:"About 1 in 20,000 α-particles bounced back in Rutherford's experiment. The reason is:",q_hi:"रदरफोर्ड के प्रयोग में लगभग 20,000 में से 1 α-कण वापस लौट आया। इसका कारण है:",opts_en:["Collision with a dense, positively charged nucleus","Attraction by electrons","Thick gold foil","Low speed of α-particles"],opts_hi:["सघन धनावेशित नाभिक से टक्कर","इलेक्ट्रॉनों द्वारा आकर्षण","मोटी स्वर्ण पन्नी","α-कणों की कम गति"],ans:0},{q_en:"The main drawback of Rutherford's model was that it could NOT explain:",q_hi:"रदरफोर्ड मॉडल की मुख्य कमी थी कि यह व्याख्या नहीं कर सका:",opts_en:["Stability of atom and hydrogen line spectrum","Presence of nucleus","Charge of electron","Mass of proton"],opts_hi:["परमाणु का स्थायित्व और हाइड्रोजन रेखा स्पेक्ट्रम","नाभिक की उपस्थिति","इलेक्ट्रॉन का आवेश","प्रोटॉन का द्रव्यमान"],ans:0}]},{id:"u1t2",unit:1,title_en:"Bohr's Theory & the Hydrogen Spectrum",title_hi:"बोर का सिद्धांत एवं हाइड्रोजन स्पेक्ट्रम",body_en:`
      <p>In 1913, <strong>Neils Bohr</strong> combined Rutherford's nuclear model with <strong>Planck's quantum theory</strong> to explain the stability of the atom and the hydrogen line spectrum.</p>
      <h3>Postulates of Bohr's theory</h3>
      <ul>
        <li>Electrons revolve around the nucleus in <strong>certain stable circular orbits</strong> of fixed energy, called <strong>stationary states</strong> or energy levels (n = 1, 2, 3, …). An electron in such an orbit does <strong>not</strong> radiate energy.</li>
        <li>The <strong>angular momentum</strong> of the electron is quantised: <strong>mvr = nh/2π</strong>, where n = 1, 2, 3…</li>
        <li>Energy is <strong>absorbed or emitted only when the electron jumps</strong> between orbits: <strong>ΔE = E₂ − E₁ = hν</strong>.</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ Key Points for Exams</div>
      <ul>
        <li>Bohr's model applies strictly to <strong>single-electron species</strong>: H, He⁺, Li²⁺.</li>
        <li>Energy of nth orbit: <strong>Eₙ = −13.6 × Z²/n² eV</strong> (expression as per syllabus — formula given, derivation omitted).</li>
        <li>Radius of nth orbit: <strong>rₙ = 0.529 × n²/Z Å</strong>.</li>
        <li>Energy is <strong>negative</strong> because the electron is bound; E = 0 means the electron is at infinite distance (ionised).</li>
        <li>Larger n → higher (less negative) energy; orbits get farther apart in radius but closer in energy.</li>
      </ul></div>
      <h3>Hydrogen spectrum explained by Bohr</h3>
      <p>When hydrogen gas is heated or an electric discharge is passed through it, electrons absorb energy and jump to higher orbits (excited states). They quickly fall back, emitting photons of fixed energy ΔE = hν. Since only certain jumps are possible, only certain wavelengths appear — a <strong>line spectrum</strong>, not a continuous one.</p>
      <table class="btable">
        <tr><th>Series</th><th>Transition (to n =)</th><th>Region</th></tr>
        <tr><td>Lyman</td><td>n = 1</td><td>Ultraviolet</td></tr>
        <tr><td>Balmer</td><td>n = 2</td><td>Visible</td></tr>
        <tr><td>Paschen</td><td>n = 3</td><td>Infrared</td></tr>
        <tr><td>Brackett</td><td>n = 4</td><td>Infrared</td></tr>
        <tr><td>Pfund</td><td>n = 5</td><td>Infrared</td></tr>
      </table>
      <p>The <strong>Balmer series</strong> (n = 3→2 red Hα 656 nm, 4→2 blue-green, 5→2 blue, 6→2 violet) is the only series visible to the naked eye. Within each series, lines <strong>converge</strong> toward the series limit as n → ∞.</p>
      <h3>Limitations of Bohr's model</h3>
      <ul>
        <li>Fails for <strong>multi-electron atoms</strong>.</li>
        <li>Cannot explain the <strong>fine splitting</strong> of lines seen under high-resolution spectroscopes.</li>
        <li>Violates the <strong>Heisenberg uncertainty principle</strong> (it assumes exact circular paths with known position and momentum).</li>
        <li>Does not explain <strong>molecule formation</strong> (chemical bonding).</li>
      </ul>

      <p>सन् 1913 में <strong>नील्स बोर</strong> ने रदरफोर्ड के नाभिकीय मॉडल को <strong>प्लांक के क्वांटम सिद्धांत</strong> से जोड़कर परमाणु के स्थायित्व और हाइड्रोजन रेखा स्पेक्ट्रम की व्याख्या की।</p>
      <h3>बोर सिद्धांत के अभिगृहीत</h3>
      <ul>
        <li>इलेक्ट्रॉन नाभिक के चारों ओर <strong>निश्चित ऊर्जा की स्थायी वृत्तीय कक्षाओं</strong> में परिक्रमण करते हैं, जिन्हें <strong>स्थिर अवस्थाएँ</strong> या ऊर्जा स्तर कहते हैं (n = 1, 2, 3, …)। ऐसी कक्षा में इलेक्ट्रॉन <strong>ऊर्जा विकरित नहीं</strong> करता।</li>
        <li>इलेक्ट्रॉन का <strong>कोणीय संवेग</strong> क्वांटीकृत होता है: <strong>mvr = nh/2π</strong>, जहाँ n = 1, 2, 3…</li>
        <li>ऊर्जा का <strong>अवशोषण या उत्सर्जन तभी</strong> होता है जब इलेक्ट्रॉन कक्षाओं के बीच <strong>छलांग</strong> लगाता है: <strong>ΔE = E₂ − E₁ = hν</strong>।</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ परीक्षा हेतु मुख्य बिंदु</div>
      <ul>
        <li>बोर मॉडल केवल <strong>एक-इलेक्ट्रॉन स्पीशीज़</strong> पर लागू होता है: H, He⁺, Li²⁺।</li>
        <li>nवीं कक्षा की ऊर्जा: <strong>Eₙ = −13.6 × Z²/n² eV</strong> (पाठ्यक्रमानुसार व्यंजक दिया गया है, निगमन छोड़ दिया गया है)।</li>
        <li>nवीं कक्षा की त्रिज्या: <strong>rₙ = 0.529 × n²/Z Å</strong>।</li>
        <li>ऊर्जा <strong>ऋणात्मक</strong> होती है क्योंकि इलेक्ट्रॉन बँधा होता है; E = 0 का अर्थ है इलेक्ट्रॉन अनंत दूरी पर (आयनित)।</li>
        <li>n बड़ा → ऊर्जा अधिक (कम ऋणात्मक); त्रिज्या में कक्षाएँ दूर होती जाती हैं परंतु ऊर्जा में पास आती जाती हैं।</li>
      </ul></div>
      <h3>बोर द्वारा हाइड्रोजन स्पेक्ट्रम की व्याख्या</h3>
      <p>जब हाइड्रोजन गैस को गर्म किया जाता है या उसमें विद्युत विसर्जन प्रवाहित किया जाता है, तो इलेक्ट्रॉन ऊर्जा अवशोषित कर उच्च कक्षाओं (उत्तेजित अवस्थाओं) में चले जाते हैं। वे शीघ्र वापस गिरते हैं और निश्चित ऊर्जा ΔE = hν के फोटॉन उत्सर्जित करते हैं। चूँकि केवल निश्चित छलांगें संभव हैं, केवल निश्चित तरंगदैर्घ्य दिखाई देते हैं — यह <strong>रेखा स्पेक्ट्रम</strong> होता है, सतत नहीं।</p>
      <table class="btable">
        <tr><th>श्रेणी</th><th>संक्रमण (n = तक)</th><th>क्षेत्र</th></tr>
        <tr><td>लाइमन</td><td>n = 1</td><td>पराबैंगनी</td></tr>

        <tr><td>फुंड</td><td>n = 5</td><td>अवरक्त</td></tr>
      </table>
      <p><strong>बामर श्रेणी</strong> (n = 3→2 लाल Hα 656 nm, 4→2 नीली-हरी, 5→2 नीली, 6→2 बैंगनी) ही नग्न आँखों से दिखने वाली एकमात्र श्रेणी है। प्रत्येक श्रेणी में n → ∞ पर रेखाएँ श्रेणी सीमा की ओर <strong>अभिसरित</strong> होती हैं।</p>
      <h3>बोर मॉडल की सीमाएँ</h3>
      <ul>
        <li><strong>बहु-इलेक्ट्रॉन परमाणुओं</strong> के लिए असफल।</li>
        <li>उच्च विभेदन स्पेक्ट्रोस्कोप में दिखने वाले रेखाओं के <strong>सूक्ष्म विभाजन</strong> की व्याख्या नहीं कर सकता।</li>
        <li><strong>हाइज़ेनबर्ग अनिश्चितता सिद्धांत</strong> का उल्लंघन करता है (यह ज्ञात स्थिति व संवेग सहित निश्चित वृत्तीय पथ मानता है)।</li>
        <li><strong>अणु निर्माण</strong> (रासायनिक बंधन) की व्याख्या नहीं करता।</li>
      </ul>

aviolet","Infrared","X-ray"],opts_hi:["दृश्य","पराबैंगनी","अवरक्त","X-किरण"],ans:0},{q_en:"Energy of an electron in the nth Bohr orbit is proportional to:",q_hi:"बोर की nवीं कक्षा में इलेक्ट्रॉन की ऊर्जा समानुपाती है:",opts_en:["Z²/n²","n²/Z","n/Z²","Z/n"],opts_hi:["Z²/n²","n²/Z","n/Z²","Z/n"],ans:0},{q_en:"A line spectrum (instead of continuous) is obtained because:",q_hi:"सतत के बजाय रेखा स्पेक्ट्रम इसलिए मिलता है क्योंकि:",opts_en:["Electrons jump between fixed energy levels","Electrons move randomly","Nucleus is unstable","Atoms are large"],opts_hi:["इलेक्ट्रॉन निश्चित ऊर्जा स्तरों के बीच छलांग लगाते हैं","इलेक्ट्रॉन यादृच्छिक गति करते हैं","नाभिक अस्थायी है","परमाणु बड़े होते हैं"],ans:0}]},{id:"u1t3",unit:1,title_en:"Quantum Numbers & Heisenberg Uncertainty Principle",title_hi:"क्वांटम संख्याएँ एवं हाइज़ेनबर्ग अनिश्चितता सिद्धांत",body_en:`
      <p>Bohr's fixed orbits were replaced by the <strong>orbital concept</strong>: the electron does not move on a fixed path; instead we can only talk about the <strong>probability</strong> of finding it in a region of space. Four <strong>quantum numbers</strong> completely describe each electron in an atom.</p>
      <h3>The four quantum numbers</h3>
      <table class="btable">
        <tr><th>Quantum number</th><th>Symbol</th><th>Values</th><th>Tells us</th></tr>
        <tr><td>Principal</td><td>n</td><td>1, 2, 3, …</td><td>Shell, size & energy of orbital</td></tr>
        <tr><td>Azimuthal</td><td>l</td><td>0 to (n−1)</td><td>Subshell & shape (s, p, d, f)</td></tr>
        <tr><td>Magnetic</td><td>m</td><td>−l … 0 … +l</td><td>Orientation of orbital in space</td></tr>
        <tr><td>Spin</td><td>s</td><td>+½ or −½</td><td>Spin direction of electron</td></tr>
      </table>
      <p>l = 0 → <strong>s</strong> subshell (1 orbital), l = 1 → <strong>p</strong> (3 orbitals), l = 2 → <strong>d</strong> (5 orbitals), l = 3 → <strong>f</strong> (7 orbitals). The number of orbitals in shell n is <strong>n²</strong>, holding a maximum of <strong>2n²</strong> electrons.</p>
      <div class="keybox"><div class="keybox-title">⭐ Key Points for Exams</div>
      <ul>
        <li>Valid set example: n = 3, l = 2, m = −1, s = +½ (a 3d electron).</li>
        <li><strong>Invalid</strong> sets: n = 2, l = 2 (l must be &lt; n); n = 1, l = 1; m = +2 when l = 1.</li>
        <li>Shell capacity: K (n=1) = 2, L (n=2) = 8, M (n=3) = 18, N (n=4) = 32 electrons.</li>
      </ul></div>
      <h3>Heisenberg uncertainty principle (1927)</h3>
      <p>It is <strong>impossible to determine simultaneously the exact position and exact momentum</strong> (velocity) of a microscopic particle like an electron.</p>
      <div class="formula-strip"><span class="flabel">Formula</span>Δx × Δp ≥ h / 4π &nbsp;&nbsp;or&nbsp;&nbsp; Δx × Δv ≥ h / 4πm</div>
      <ul>
        <li><strong>Effect on Bohr's model:</strong> Bohr assumed electrons move in well-defined circular orbits with known position and momentum at every instant — this directly contradicts Heisenberg. Hence orbits were replaced by <strong>orbitals</strong> (probability clouds).</li>
        <li>The principle is significant only for <strong>microscopic</strong> particles; for macroscopic objects the uncertainty is negligibly small.</li>
      </ul>
      <h3>Orbital concept</h3>
      <p>An <strong>orbital</strong> is a three-dimensional region around the nucleus where the probability of finding the electron is maximum (about 90–95%). Unlike an orbit (a fixed 2-D path), an orbital is a <strong>probability distribution</strong> — we can say where the electron is <em>likely</em> to be, never exactly where it <em>is</em>.</p>
    `,body_hi:`
      <p>बोर की निश्चित कक्षाओं का स्थान <strong>कक्षक (orbital) संकल्पना</strong> ने ले लिया: इलेक्ट्रॉन किसी निश्चित पथ पर नहीं चलता; हम केवल अंतरिक्ष के किसी क्षेत्र में उसके मिलने की <strong>प्रायिकता</strong> की बात कर सकते हैं। चार <strong>क्वांटम संख्याएँ</strong> परमाणु में प्रत्येक इलेक्ट्रॉन का पूर्ण वर्णन करती हैं।</p>
      <h3>चार क्वांटम संख्याएँ</h3>
      <table class="btable">
        <tr><th>क्वांटम संख्या</th><th>चिह्न</th><th>मान</th><th>बताती है</th></tr>
        <tr><td>मुख्य</td><td>n</td><td>1, 2, 3, …</td><td>कोश, कक्षक का आकार व ऊर्जा</td></tr>
        <tr><td>दिगंशीय</td><td>l</td><td>0 से (n−1)</td><td>उपकोश व आकृति (s, p, d, f)</td></tr>
        <tr><td>चुंबकीय</td><td>m</td><td>−l … 0 … +l</td><td>अंतरिक्ष में कक्षक का अभिविन्यास</td></tr>
        <tr><td>चक्रण</td><td>s</td><td>+½ या −½</td><td>इलेक्ट्रॉन के चक्रण की दिशा</td></tr>
      </table>
      <p>l = 0 → <strong>s</strong> उपकोश (1 कक्षक), l = 1 → <strong>p</strong> (3 कक्षक), l = 2 → <strong>d</strong> (5 कक्षक), l = 3 → <strong>f</strong> (7 कक्षक)। nवें कोश में कक्षकों की संख्या <strong>n²</strong> होती है, जिनमें अधिकतम <strong>2n²</strong> इलेक्ट्रॉन रह सकते हैं।</p>
      <div class="keybox"><div class="keybox-title">⭐ परीक्षा हेतु मुख्य बिंदु</div>
      <ul>
        <li>वैध समुच्चय का उदाहरण: n = 3, l = 2, m = −1, s = +½ (एक 3d इलेक्ट्रॉन)।</li>
        <li><strong>अवैध</strong> समुच्चय: n = 2, l = 2 (l, n से छोटा होना चाहिए); n = 1, l = 1; l = 1 पर m = +2।</li>
        <li>कोश क्षमता: K (n=1) = 2, L (n=2) = 8, M (n=3) = 18, N (n=4) = 32 इलेक्ट्रॉन।</li>
      </ul></div>
      <h3>हाइज़ेनबर्ग अनिश्चितता सिद्धांत (1927)</h3>
      <p>इलेक्ट्रॉन जैसे सूक्ष्म कण की <strong>यथार्थ स्थिति और यथार्थ संवेग</strong> (वेग) को <strong>एक साथ ज्ञात करना असंभव</strong> है।</p>
      <div class="formula-strip"><span class="flabel">सूत्र</span>Δx × Δp ≥ h / 4π &nbsp;&nbsp;अथवा&nbsp;&nbsp; Δx × Δv ≥ h / 4πm</div>
      <ul>
        <li><strong>बोर मॉडल पर प्रभाव:</strong> बोर ने माना था कि इलेक्ट्रॉन प्रत्येक क्षण ज्ञात स्थिति व संवेग सहित निश्चित वृत्तीय कक्षाओं में चलते हैं — यह हाइज़ेनबर्ग का सीधा विरोध है। इसलिए कक्षाओं का स्थान <strong>कक्षकों</strong> (प्रायिकता मेघों) ने ले लिया।</li>
        <li>यह सिद्धांत केवल <strong>सूक्ष्म</strong> कणों हेतु महत्वपूर्ण है; स्थूल वस्तुओं हेतु अनिश्चितता नगण्य होती है।</li>
      </ul>
      <h3>कक्षक संकल्पना</h3>
      <p><strong>कक्षक</strong> नाभिक के चारों ओर का त्रिविमीय क्षेत्र है जहाँ इलेक्ट्रॉन के मिलने की प्रायिकता अधिकतम (लगभग 90–95%) होती है। कक्षा (एक निश्चित 2-D पथ) के विपरीत, कक्षक एक <strong>प्रायिकता वितरण</strong> है — हम कह सकते हैं कि इलेक्ट्रॉन के <em>मिलने की संभावना</em> कहाँ अधिक है, यह कभी नहीं कि वह <em>यथार्थतः</em> कहाँ है।</p>
    `,diagrams:[],formulas_en:["Δx · Δp ≥ h/4π","Orbitals per shell = n² · Max electrons = 2n²","l: 0(s) 1(p) 2(d) 3(f) · m = −l…+l"],formulas_hi:["Δx · Δp ≥ h/4π","प्रति कोश कक्षक = n² · अधिकतम इलेक्ट्रॉन = 2n²","l: 0(s) 1(p) 2(d) 3(f) · m = −l…+l"],mcqs:[{q_en:"Which set of quantum numbers is NOT possible?",q_hi:"क्वांटम संख्याओं का कौन-सा समुच्चय संभव नहीं है?",opts_en:["n=2, l=2, m=0, s=+½","n=3, l=2, m=−1, s=+½","n=1, l=0, m=0, s=−½","n=2, l=1, m=0, s=+½"],opts_hi:["n=2, l=2, m=0, s=+½","n=3, l=2, m=−1, s=+½","n=1, l=0, m=0, s=−½","n=2, l=1, m=0, s=+½"],ans:0,exp_en:"l must be less than n; l=2 is invalid for n=2.",exp_hi:"l, n से छोटा होना चाहिए; n=2 हेतु l=2 अवैध है।"},{q_en:"Heisenberg's principle states that it is impossible to determine simultaneously:",q_hi:"हाइज़ेनबर्ग सिद्धांत कहता है कि एक साथ ज्ञात करना असंभव है:",opts_en:["Exact position and exact momentum","Mass and charge","Energy and time always","Colour and size"],opts_hi:["यथार्थ स्थिति और यथार्थ संवेग","द्रव्यमान और आवेश","ऊर्जा और समय हमेशा","रंग और आकार"],ans:0},{q_en:"Maximum electrons in the M shell (n=3):",q_hi:"M कोश (n=3) में अधिकतम इलेक्ट्रॉन:",opts_en:["18","8","32","2"],opts_hi:["18","8","32","2"],ans:0},{q_en:"An orbital is best described as:",q_hi:"कक्षक का सर्वोत्तम वर्णन है:",opts_en:["Region of maximum probability of finding the electron","Fixed circular path of electron","The nucleus itself","A spectral line"],opts_hi:["इलेक्ट्रॉन के मिलने की अधिकतम प्रायिकता का क्षेत्र","इलेक्ट्रॉन का निश्चित वृत्तीय पथ","स्वयं नाभिक","एक स्पेक्ट्रमी रेखा"],ans:0}]},{id:"u1t4",unit:1,title_en:"Shapes of s, p and d Orbitals",title_hi:"s, p व d कक्षकों की आकृतियाँ",body_en:`
      <p>The <strong>azimuthal quantum number (l)</strong> decides the shape of an orbital. While s orbitals are spherical, p and d orbitals are directional — and this directionality is what gives molecules their shapes.</p>
      <h3>s-orbitals (l = 0)</h3>
      <ul>
        <li><strong>Spherically symmetrical</strong> around the nucleus — probability is the same in every direction.</li>
        <li>Size increases with n: 1s &lt; 2s &lt; 3s. Higher s orbitals contain <strong>spherical nodal surfaces</strong> (2s has one, 3s has two).</li>
        <li>Non-directional, so s orbitals form the simplest overlaps in bonding.</li>
      </ul>
      <h3>p-orbitals (l = 1)</h3>
      <ul>
        <li><strong>Dumb-bell shaped</strong>: two lobes on opposite sides of the nucleus with opposite signs (+/−).</li>
        <li>Three orientations along the axes: <strong>p<sub>x</sub>, p<sub>y</sub>, p<sub>z</sub></strong> — mutually perpendicular.</li>
        <li>There is a <strong>nodal plane</strong> through the nucleus where probability is zero.</li>
        <li>Directionality of p orbitals explains 90°-based geometries (modified by hybridisation).</li>
      </ul>
      <h3>d-orbitals (l = 2)</h3>
      <ul>
        <li>Mostly <strong>double dumb-bell</strong> (four lobes); the d<sub>z²</sub> orbital is different — two lobes along z plus a ring (doughnut) in the xy plane.</li>
        <li><strong>Five orientations</strong>: d<sub>xy</sub>, d<sub>yz</sub>, d<sub>xz</sub>, d<sub>x²−y²</sub>, d<sub>z²</sub>.</li>
        <li>Important in <strong>transition metals</strong>: their shapes control complex formation, colour and magnetism.</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ Key Points for Exams</div>
      <ul>
        <li>Node = region of <strong>zero electron probability</strong>. Number of radial nodes = n − l − 1; angular nodes = l.</li>
        <li>s: 0 angular nodes · p: 1 (a plane) · d: 2 (two planes/cones).</li>
        <li>Orbital shapes are <strong>boundary surfaces</strong> enclosing ~90–95% probability — not hard shells.</li>
        <li>Signs (+/−) on lobes are <strong>mathematical phases</strong> of the wave function, not charges — they decide whether overlap is bonding or antibonding.</li>
      </ul></div>
    `,body_hi:`
      <p><strong>दिगंशीय क्वांटम संख्या (l)</strong> कक्षक की आकृति निर्धारित करती है। जहाँ s कक्षक गोलाकार होते हैं, वहीं p व d कक्षक दिशात्मक होते हैं — और यही दिशात्मकता अणुओं को उनकी आकृतियाँ देती है।</p>
      <h3>s-कक्षक (l = 0)</h3>
      <ul>
        <li>नाभिक के चारों ओर <strong>गोलाकार सममित</strong> — प्रत्येक दिशा में प्रायिकता समान।</li>
        <li>n के साथ आकार बढ़ता है: 1s &lt; 2s &lt; 3s। उच्च s कक्षकों में <strong>गोलाकार नोडल सतहें</strong> होती हैं (2s में एक, 3s में दो)।</li>
        <li>अदिशात्मक होने से बंधन में ये सरलतम अतिव्यापन बनाते हैं।</li>
      </ul>
      <h3>p-कक्षक (l = 1)</h3>
      <ul>
        <li><strong>डमरू (dumb-bell) आकृति</strong>: नाभिक के विपरीत ओर दो पालियाँ जिनके चिह्न विपरीत (+/−)।</li>
        <li>अक्षों के अनुदिश तीन अभिविन्यास: <strong>p<sub>x</sub>, p<sub>y</sub>, p<sub>z</sub></strong> — परस्पर लंबवत।</li>
        <li>नाभिक से गुजरता एक <strong>नोडल तल</strong> होता है जहाँ प्रायिकता शून्य होती है।</li>
        <li>p कक्षकों की दिशात्मकता 90°-आधारित ज्यामितियों की व्याख्या करती है (संकरण द्वारा संशोधित)।</li>
      </ul>
      <h3>d-कक्षक (l = 2)</h3>
      <ul>
        <li>अधिकांश <strong>द्वि-डमरू</strong> (चार पालियाँ); d<sub>z²</sub> कक्षक भिन्न है — z के अनुदिश दो पालियाँ तथा xy तल में एक वलय (डोनट)।</li>
        <li><strong>पाँच अभिविन्यास</strong>: d<sub>xy</sub>, d<sub>yz</sub>, d<sub>xz</sub>, d<sub>x²−y²</sub>, d<sub>z²</sub>।</li>
        <li><strong>संक्रमण धातुओं</strong> में महत्वपूर्ण: इनकी आकृतियाँ संकुल निर्माण, रंग व चुंबकत्व को नियंत्रित करती हैं।</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ परीक्षा हेतु मुख्य बिंदु</div>
      <ul>
        <li>नोड = <strong>शून्य इलेक्ट्रॉन प्रायिकता</strong> का क्षेत्र। त्रिज्य नोड = n − l − 1; कोणीय नोड = l।</li>
        <li>s: 0 कोणीय नोड · p: 1 (एक तल) · d: 2 (दो तल/शंकु)।</li>
        <li>कक्षक आकृतियाँ ~90–95% प्रायिकता को घेरने वाली <strong>सीमा सतहें</strong> हैं — कठोर खोल नहीं।</li>
        <li>पालियों के (+/−) चिह्न तरंग फलन की <strong>गणितीय कलाएँ</strong> हैं, आवेश नहीं — ये तय करते हैं कि अतिव्यापन बंधी होगा या प्रतिबंधी।</li>
      </ul></div>
    `,diagrams:["orbitals"],mcqs:[{q_en:"The shape of a p-orbital is:",q_hi:"p-कक्षक की आकृति होती है:",opts_en:["Dumb-bell","Spherical","Tetrahedral","Double dumb-bell"],opts_hi:["डमरू","गोलाकार","चतुष्फलकीय","द्वि-डमरू"],ans:0},{q_en:"Number of angular nodes in a 3d orbital:",q_hi:"3d कक्षक में कोणीय नोडों की संख्या:",opts_en:["2","1","0","3"],opts_hi:["2","1","0","3"],ans:0},{q_en:"Which d-orbital has a different shape (lobes + ring)?",q_hi:"किस d-कक्षक की आकृति भिन्न (पालियाँ + वलय) होती है?",opts_en:["dz²","dxy","dx²−y²","dxz"],opts_hi:["dz²","dxy","dx²−y²","dxz"],ans:0}]},{id:"u1t5",unit:1,title_en:"Aufbau, Pauli & Hund — Electronic Configuration",title_hi:"ऑफबाऊ, पाउली व हुंड — इलेक्ट्रॉनिक विन्यास",body_en:`
      <p>The arrangement of electrons in orbitals follows three fundamental rules. Together they let us write the <strong>electronic configuration</strong> of every element.</p>
      <h3>1. Aufbau principle ("building up", German)</h3>
      <p>Electrons fill orbitals in order of <strong>increasing energy</strong>. The order is given by the <strong>(n + l) rule</strong>: lower (n + l) fills first; if (n + l) is equal, the orbital with lower n fills first.</p>
      <div class="formula-strip"><span class="flabel">Filling order</span>1s → 2s → 2p → 3s → 3p → 4s → 3d → 4p → 5s → 4d → 5p → 6s → 4f → 5d → 6p → 7s …</div>
      <p>Note the famous exception: <strong>4s fills before 3d</strong> because (4+0)=4 &lt; (3+2)=5.</p>
      <h3>2. Pauli's exclusion principle</h3>
      <p><strong>No two electrons in an atom can have all four quantum numbers identical.</strong> Consequences:</p>
      <ul>
        <li>One orbital holds <strong>at most 2 electrons</strong>, and they must have <strong>opposite spins</strong> (↑↓).</li>
        <li>This is why each orbital's capacity is 2, each subshell's is 2(2l+1): s=2, p=6, d=10, f=14.</li>
      </ul>
      <h3>3. Hund's rule of maximum multiplicity</h3>
      <p>In degenerate orbitals (same energy, e.g. the three p orbitals), electrons <strong>occupy separate orbitals singly first, with parallel spins</strong>, before pairing begins. Pairing starts only after each orbital has one electron.</p>
      <p>Example — nitrogen (1s² 2s² 2p³): the three 2p electrons sit in <strong>separate</strong> p orbitals as ↑ ↑ ↑, giving maximum spin multiplicity. Oxygen (1s² 2s² 2p⁴) has ↑↓ ↑ ↑.</p>
      <div class="keybox"><div class="keybox-title">⭐ Key Points for Exams</div>
      <ul>
        <li>Half-filled and fully-filled subshells are extra stable → <strong>Cr = [Ar] 3d⁵ 4s¹</strong> (not 3d⁴ 4s²), <strong>Cu = [Ar] 3d¹⁰ 4s¹</strong> (not 3d⁹ 4s²).</li>
        <li>Valence-shell configuration decides the group: ns¹ → alkali metals, ns²np⁵ → halogens, ns²np⁶ → noble gases.</li>
        <li>For cations, remove electrons from the <strong>outermost n first</strong>: Fe²⁺ = [Ar] 3d⁶ (4s electrons removed first!).</li>
      </ul></div>
      <h3>Worked configurations</h3>
      <table class="btable">
        <tr><th>Element</th><th>Z</th><th>Configuration</th></tr>
        <tr><td>Sodium, Na</td><td>11</td><td>1s² 2s² 2p⁶ 3s¹ = [Ne] 3s¹</td></tr>
        <tr><td>Chlorine, Cl</td><td>17</td><td>[Ne] 3s² 3p⁵</td></tr>
        <tr><td>Iron, Fe</td><td>26</td><td>[Ar] 3d⁶ 4s²</td></tr>
        <tr><td>Copper, Cu</td><td>29</td><td>[Ar] 3d¹⁰ 4s¹ (exception)</td></tr>
      </table>
    `,body_hi:`
      <p>कक्षकों में इलेक्ट्रॉनों की व्यवस्था तीन मौलिक नियमों का पालन करती है। इनसे मिलकर हम प्रत्येक तत्व का <strong>इलेक्ट्रॉनिक विन्यास</strong> लिख सकते हैं।</p>
      <h3>1. ऑफबाऊ सिद्धांत ("निर्माण", जर्मन)</h3>
      <p>इलेक्ट्रॉन <strong>बढ़ती ऊर्जा</strong> के क्रम में कक्षकों को भरते हैं। क्रम <strong>(n + l) नियम</strong> से मिलता है: कम (n + l) पहले भरता है; (n + l) समान हो तो कम n वाला पहले भरता है।</p>
      <div class="formula-strip"><span class="flabel">भरण क्रम</span>1s → 2s → 2p → 3s → 3p → 4s → 3d → 4p → 5s → 4d → 5p → 6s → 4f → 5d → 6p → 7s …</div>
      <p>प्रसिद्ध अपवाद पर ध्यान दें: <strong>4s, 3d से पहले</strong> भरता है क्योंकि (4+0)=4 &lt; (3+2)=5।</p>
      <h3>2. पाउली का अपवर्जन सिद्धांत</h3>
      <p><strong>किसी परमाणु में किन्हीं दो इलेक्ट्रॉनों की चारों क्वांटम संख्याएँ एकसमान नहीं हो सकतीं।</strong> परिणाम:</p>
      <ul>
        <li>एक कक्षक में <strong>अधिकतम 2 इलेक्ट्रॉन</strong> रह सकते हैं, और उनके चक्रण <strong>विपरीत</strong> (↑↓) होने चाहिए।</li>
        <li>इसीलिए प्रत्येक कक्षक की क्षमता 2, प्रत्येक उपकोश की 2(2l+1) है: s=2, p=6, d=10, f=14।</li>
      </ul>
      <h3>3. हुंड का अधिकतम बहुकता नियम</h3>
      <p>समभ्रंश कक्षकों (समान ऊर्जा, जैसे तीनों p कक्षक) में इलेक्ट्रॉन पहले <strong>अलग-अलग कक्षकों में अकेले, समानांतर चक्रण</strong> सहित रहते हैं; युग्मन तभी शुरू होता है जब प्रत्येक कक्षक में एक इलेक्ट्रॉन आ जाए।</p>
      <p>उदाहरण — नाइट्रोजन (1s² 2s² 2p³): तीनों 2p इलेक्ट्रॉन <strong>अलग-अलग</strong> p कक्षकों में ↑ ↑ ↑ के रूप में रहते हैं, जिससे चक्रण बहुकता अधिकतम होती है। ऑक्सीजन (1s² 2s² 2p⁴) में ↑↓ ↑ ↑ होता है।</p>
      <div class="keybox"><div class="keybox-title">⭐ परीक्षा हेतु मुख्य बिंदु</div>
      <ul>
        <li>अर्ध-पूरित व पूर्ण-पूरित उपकोश अतिरिक्त स्थायी होते हैं → <strong>Cr = [Ar] 3d⁵ 4s¹</strong> (3d⁴ 4s² नहीं), <strong>Cu = [Ar] 3d¹⁰ 4s¹</strong> (3d⁹ 4s² नहीं)।</li>
        <li>संयोजकता कोश विन्यास वर्ग तय करता है: ns¹ → क्षार धातुएँ, ns²np⁵ → हैलोजन, ns²np⁶ → उत्कृष्ट गैसें।</li>
        <li>धनायनों हेतु पहले <strong>बाह्यतम n</strong> से इलेक्ट्रॉन हटाएँ: Fe²⁺ = [Ar] 3d⁶ (पहले 4s के इलेक्ट्रॉन हटते हैं!)।</li>
      </ul></div>
      <h3>हल किए गए विन्यास</h3>
      <table class="btable">
        <tr><th>तत्व</th><th>Z</th><th>विन्यास</th></tr>
        <tr><td>सोडियम, Na</td><td>11</td><td>1s² 2s² 2p⁶ 3s¹ = [Ne] 3s¹</td></tr>
        <tr><td>क्लोरीन, Cl</td><td>17</td><td>[Ne] 3s² 3p⁵</td></tr>
        <tr><td>आयरन, Fe</td><td>26</td><td>[Ar] 3d⁶ 4s²</td></tr>
        <tr><td>कॉपर, Cu</td><td>29</td><td>[Ar] 3d¹⁰ 4s¹ (अपवाद)</td></tr>
      </table>
    `,diagrams:[],formulas_en:["Filling: (n+l) rule — lower (n+l) first","Orbital capacity = 2 · Subshell = 2(2l+1)","s² p⁶ d¹⁰ f¹⁴"],formulas_hi:["भरण: (n+l) नियम — कम (n+l) पहले","कक्षक क्षमता = 2 · उपकोश = 2(2l+1)","s² p⁶ d¹⁰ f¹⁴"],mcqs:[{q_en:"According to the (n+l) rule, which fills first?",q_hi:"(n+l) नियम के अनुसार पहले कौन भरता है?",opts_en:["4s","3d","4p","3p"],opts_hi:["4s","3d","4p","3p"],ans:0,exp_en:"(4+0)=4 < (3+2)=5, so 4s fills before 3d.",exp_hi:"(4+0)=4 < (3+2)=5, अतः 4s, 3d से पहले भरता है।"},{q_en:"Electronic configuration of chromium (Z=24) is:",q_hi:"क्रोमियम (Z=24) का इलेक्ट्रॉनिक विन्यास है:",opts_en:["[Ar] 3d⁵ 4s¹","[Ar] 3d⁴ 4s²","[Ar] 3d⁶","[Ar] 4s² 4p⁴"],opts_hi:["[Ar] 3d⁵ 4s¹","[Ar] 3d⁴ 4s²","[Ar] 3d⁶","[Ar] 4s² 4p⁴"],ans:0},{q_en:"Hund's rule deals with:",q_hi:"हुंड का नियम संबंधित है:",opts_en:["Filling of degenerate orbitals singly with parallel spins","Maximum 2 electrons per orbital","Order of orbital energies","Nuclear charge"],opts_hi:["समभ्रंश कक्षकों में समानांतर चक्रण सहित एकल भरण","प्रति कक्षक अधिकतम 2 इलेक्ट्रॉन","कक्षक ऊर्जाओं का क्रम","नाभिकीय आवेश"],ans:0},{q_en:"Fe²⁺ (Z of Fe = 26) has configuration:",q_hi:"Fe²⁺ (Fe का Z = 26) का विन्यास है:",opts_en:["[Ar] 3d⁶","[Ar] 3d⁴ 4s²","[Ar] 3d⁵ 4s¹","[Ar] 4s² 3d⁴"],opts_hi:["[Ar] 3d⁶","[Ar] 3d⁴ 4s²","[Ar] 3d⁵ 4s¹","[Ar] 4s² 3d⁴"],ans:0}]},{id:"u1t6",unit:1,title_en:"Chemical Bonding: Ionic & Covalent Bonds",title_hi:"रासायनिक बंधन: आयनिक व सहसंयोजक बंधन",body_en:`
      <p><strong>Cause of chemical bonding:</strong> Atoms bond to achieve a <strong>stable noble-gas (octet) configuration</strong> and to <strong>lower their potential energy</strong>. A bonded system has less energy than the separated atoms, and nature favours minimum energy.</p>
      <h3>Ionic (electrovalent) bonding — e.g. NaCl</h3>
      <ul>
        <li>Formed by <strong>complete transfer</strong> of electrons from a metal (low ionisation energy) to a non-metal (high electron affinity): Na → Na⁺ + e⁻ ; Cl + e⁻ → Cl⁻.</li>
        <li>The oppositely charged ions attract electrostatically and arrange in a <strong>3-D crystal lattice</strong> with 6:6 coordination.</li>
        <li><strong>Favourable conditions:</strong> low ionisation energy of metal, high electron affinity of non-metal, high lattice energy, large electronegativity difference (&gt; 1.7).</li>
        <li><strong>Properties:</strong> hard, brittle crystals; high melting/boiling points; conduct electricity in <strong>molten/aqueous</strong> state (never solid); soluble in polar solvents.</li>
      </ul>
      <h3>Covalent bonding — e.g. H₂, F₂, HF</h3>
      <ul>
        <li>Formed by <strong>mutual sharing</strong> of electron pairs between atoms with similar electronegativities.</li>
        <li><strong>H₂:</strong> each H contributes 1 electron → one shared pair, H—H single bond.</li>
        <li><strong>F₂:</strong> each F (2s² 2p⁵) shares one electron → F—F single bond; each F completes its octet.</li>
        <li><strong>HF:</strong> H(1s) overlaps with F(2p) → polar covalent bond, H<sup>δ+</sup>—F<sup>δ−</sup>, because F is more electronegative.</li>
        <li><strong>Properties:</strong> usually gases/liquids/low-m.p. solids; poor conductors; directional bonds giving fixed molecular shapes.</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ Key Points for Exams</div>
      <ul>
        <li><strong>Octet rule:</strong> atoms tend to have 8 electrons in the valence shell (exceptions: H → 2, Be → 4, B → 6, expanded octet in PCl₅, SF₆).</li>
        <li>Bond strength order: <strong>triple &gt; double &gt; single</strong>; bond length order is the reverse.</li>
        <li><strong>Fajan's rules:</strong> small, highly charged cations polarise anions → partial covalent character in ionic compounds (e.g. AlCl₃ is covalent, NaCl is ionic).</li>
        <li>Lattice energy ∝ (charge⁺ × charge⁻) / (r⁺ + r⁻) — MgO has higher lattice energy than NaCl.</li>
      </ul></div>
    `,body_hi:`
      <p><strong>रासायनिक बंधन का कारण:</strong> परमाणु <strong>स्थायी उत्कृष्ट-गैस (अष्टक) विन्यास</strong> प्राप्त करने और अपनी <strong>स्थितिज ऊर्जा घटाने</strong> हेतु बंधन बनाते हैं। बंधित तंत्र की ऊर्जा पृथक परमाणुओं से कम होती है, और प्रकृति न्यूनतम ऊर्जा को वरीयता देती है।</p>
      <h3>आयनिक (विद्युतसंयोजक) बंधन — उदा. NaCl</h3>
      <ul>
        <li>धातु (कम आयनन ऊर्जा) से अधातु (उच्च इलेक्ट्रॉन बंधुता) को इलेक्ट्रॉनों के <strong>पूर्ण स्थानांतरण</strong> से बनता है: Na → Na⁺ + e⁻ ; Cl + e⁻ → Cl⁻।</li>
        <li>विपरीत आवेशित आयन स्थिरवैद्युत आकर्षण से <strong>त्रिविमीय क्रिस्टल जालक</strong> में 6:6 समन्वय सहित व्यवस्थित होते हैं।</li>
        <li><strong>अनुकूल परिस्थितियाँ:</strong> धातु की कम आयनन ऊर्जा, अधातु की उच्च इलेक्ट्रॉन बंधुता, उच्च जालक ऊर्जा, विद्युतऋणात्मकता में बड़ा अंतर (&gt; 1.7)।</li>
        <li><strong>गुण:</strong> कठोर, भंगुर क्रिस्टल; उच्च गलनांक/क्वथनांक; <strong>गलित/जलीय</strong> अवस्था में विद्युत चालक (ठोस में कभी नहीं); ध्रुवीय विलायकों में विलेय।</li>
      </ul>
      <h3>सहसंयोजक बंधन — उदा. H₂, F₂, HF</h3>
      <ul>
        <li>समान विद्युतऋणात्मकता वाले परमाणुओं के बीच इलेक्ट्रॉन युग्मों के <strong>पारस्परिक साझेदारी</strong> से बनता है।</li>
        <li><strong>H₂:</strong> प्रत्येक H 1 इलेक्ट्रॉन देता है → एक साझा युग्म, H—H एकल बंधन।</li>
        <li><strong>F₂:</strong> प्रत्येक F (2s² 2p⁵) एक इलेक्ट्रॉन साझा करता है → F—F एकल बंधन; प्रत्येक F अपना अष्टक पूर्ण करता है।</li>
        <li><strong>HF:</strong> H(1s) का F(2p) से अतिव्यापन → ध्रुवीय सहसंयोजक बंधन, H<sup>δ+</sup>—F<sup>δ−</sup>, क्योंकि F अधिक विद्युतऋणात्मक है।</li>
        <li><strong>गुण:</strong> प्रायः गैस/द्रव/कम गलनांक वाले ठोस; कुचालक; निश्चित आणविक आकृति देने वाले दिशात्मक बंधन।</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ परीक्षा हेतु मुख्य बिंदु</div>
      <ul>
        <li><strong>अष्टक नियम:</strong> परमाणु संयोजकता कोश में 8 इलेक्ट्रॉन रखना चाहते हैं (अपवाद: H → 2, Be → 4, B → 6, PCl₅, SF₆ में विस्तारित अष्टक)।</li>
        <li>बंधन सामर्थ्य क्रम: <strong>त्रिक &gt; द्विक &gt; एकल</strong>; बंधन लंबाई का क्रम विपरीत।</li>
        <li><strong>फायान के नियम:</strong> छोटे, उच्च आवेशित धनायन ऋणायनों को ध्रुवित करते हैं → आयनिक यौगिकों में आंशिक सहसंयोजक लक्षण (जैसे AlCl₃ सहसंयोजक, NaCl आयनिक)।</li>
        <li>जालक ऊर्जा ∝ (आवेश⁺ × आवेश⁻) / (r⁺ + r⁻) — MgO की जालक ऊर्जा NaCl से अधिक।</li>
      </ul></div>

      <p><strong>Hybridization</strong> is the intermixing of atomic orbitals of nearly the same energy to form an equal number of new, identical <strong>hybrid orbitals</strong> that point in specific directions. It explains molecular shapes that pure s/p orbitals cannot.</p>
      <h3>sp hybridization — BeCl₂ (linear)</h3>
      <ul>
        <li>Be (1s² 2s²) promotes one 2s electron to 2p; one s + one p mix → <strong>two sp hybrids</strong> at <strong>180°</strong>.</li>
        <li>2 bond pairs, 0 lone pairs → <strong>linear</strong> molecule, Cl—Be—Cl.</li>
      </ul>
      <h3>sp² hybridization — BF₃ (trigonal planar)</h3>
      <ul>
        <li>B mixes one s + two p → <strong>three sp² hybrids</strong> at <strong>120°</strong> in one plane.</li>
        <li>3 bond pairs, 0 lone pairs → <strong>trigonal planar</strong>.</li>
      </ul>
      <h3>sp³ hybridization — CH₄ (tetrahedral)</h3>
      <ul>
        <li>C mixes one s + three p → <strong>four sp³ hybrids</strong> pointing to tetrahedron corners, <strong>109.5°</strong>.</li>
        <li>4 bond pairs, 0 lone pairs → perfect <strong>tetrahedron</strong>.</li>
      </ul>
      <h3>NH₃ — pyramidal (sp³ with one lone pair)</h3>
      <ul>
        <li>N is sp³ hybridised, but one hybrid holds a <strong>lone pair</strong>. Lone-pair–bond-pair repulsion squeezes the H—N—H angle to <strong>107°</strong>.</li>
        <li>3 bond pairs + 1 lone pair → <strong>trigonal pyramidal</strong>.</li>
      </ul>
      <h3>H₂O — bent (sp³ with two lone pairs)</h3>
      <ul>
        <li>O is sp³ hybridised with <strong>two lone pairs</strong>; lp–lp repulsion is strongest, compressing H—O—H to <strong>104.5°</strong>.</li>
        <li>2 bond pairs + 2 lone pairs → <strong>bent / V-shaped</strong>.</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ Key Points for Exams</div>
      <ul>
        <li><strong>VSEPR repulsion order:</strong> lone-pair–lone-pair &gt; lone-pair–bond-pair &gt; bond-pair–bond-pair. This is why angles shrink: 109.5° (CH₄) &gt; 107° (NH₃) &gt; 104.5° (H₂O).</li>
        <li><strong>Steric number</strong> = σ-bonds + lone pairs: 2 → sp, 3 → sp², 4 → sp³.</li>
        <li>More s-character → shorter, stronger bonds: sp (50%) &gt; sp² (33%) &gt; sp³ (25%).</li>
        <li>Hybrid orbitals form <strong>σ (sigma)</strong> bonds; unhybridised p orbitals form <strong>π (pi)</strong> bonds.</li>
      </ul></div>
      <table class="btable">
        <tr><th>Molecule</th><th>Hybridization</th><th>lp / bp</th><th>Shape</th><th>Angle</th></tr>
        <tr><td>BeCl₂</td><td>sp</td><td>0 / 2</td><td>Linear</td><td>180°</td></tr>
        <tr><td>BF₃</td><td>sp²</td><td>0 / 3</td><td>Trigonal planar</td><td>120°</td></tr>
        <tr><td>CH₄</td><td>sp³</td><td>0 / 4</td><td>Tetrahedral</td><td>109.5°</td></tr>
        <tr><td>NH₃</td><td>sp³</td><td>1 / 3</td><td>Pyramidal</td><td>107°</td></tr>
        <tr><td>H₂O</td><td>sp³</td><td>2 / 2</td><td>Bent</td><td>104.5°</td></tr>
      </table>
    `,body_hi:`
      <p><strong>संकरण (Hybridization)</strong> लगभग समान ऊर्जा वाले परमाण्विक कक्षकों का परस्पर मिश्रण है जिससे समान संख्या में नए, सर्वसम <strong>संकर कक्षक</strong> बनते हैं जो निश्चित दिशाओं में इंगित होते हैं। यह उन आणविक आकृतियों की व्याख्या करता है जिन्हें शुद्ध s/p कक्षक नहीं समझा सकते।</p>
      <h3>sp संकरण — BeCl₂ (रेखीय)</h3>
      <ul>
        <li>Be (1s² 2s²) एक 2s इलेक्ट्रॉन को 2p में प्रोन्नत करता है; एक s + एक p मिलकर <strong>दो sp संकर</strong> <strong>180°</strong> पर बनाते हैं।</li>
        <li>2 बंध युग्म, 0 एकाकी युग्म → <strong>रेखीय</strong> अणु, Cl—Be—Cl।</li>
      </ul>
      <h3>sp² संकरण — BF₃ (त्रिकोणीय समतलीय)</h3>
      <ul>
        <li>B एक s + दो p मिलाता है → एक तल में <strong>120°</strong> पर <strong>तीन sp² संकर</strong>।</li>
        <li>3 बंध युग्म, 0 एकाकी युग्म → <strong>त्रिकोणीय समतलीय</strong>।</li>
      </ul>
      <h3>sp³ संकरण — CH₄ (चतुष्फलकीय)</h3>
      <ul>
        <li>C एक s + तीन p मिलाता है → चतुष्फलक के कोनों की ओर <strong>चार sp³ संकर</strong>, <strong>109.5°</strong>।</li>
        <li>4 बंध युग्म, 0 एकाकी युग्म → पूर्ण <strong>चतुष्फलक</strong>।</li>
      </ul>
      <h3>NH₃ — पिरामिडी (एक एकाकी युग्म सहित sp³)</h3>
      <ul>
        <li>N sp³ संकरित है, परंतु एक संकर में <strong>एकाकी युग्म</strong> है। एकाकी-युग्म–बंध-युग्म प्रतिकर्षण H—N—H कोण को <strong>107°</strong> तक सिकोड़ देता है।</li>
        <li>3 बंध युग्म + 1 एकाकी युग्म → <strong>त्रिकोणीय पिरामिडी</strong>।</li>
      </ul>
      <h3>H₂O — मुड़ी (दो एकाकी युग्म सहित sp³)</h3>
      <ul>
        <li>O <strong>दो एकाकी युग्मों</strong> सहित sp³ संकरित है; lp–lp प्रतिकर्षण प्रबलतम है, H—O—H को <strong>104.5°</strong> तक दबा देता है।</li>
        <li>2 बंध युग्म + 2 एकाकी युग्म → <strong>मुड़ी / V-आकृति</strong>।</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ परीक्षा हेतु मुख्य बिंदु</div>
      <ul>
        <li><strong>VSEPR प्रतिकर्षण क्रम:</strong> एकाकी–एकाकी &gt; एकाकी–बंध &gt; बंध–बंध। इसीलिए कोण घटते हैं: 109.5° (CH₄) &gt; 107° (NH₃) &gt; 104.5° (H₂O)।</li>
        <li><strong>स्टेरिक संख्या</strong> = σ-बंधन + एकाकी युग्म: 2 → sp, 3 → sp², 4 → sp³।</li>
        <li>अधिक s-लक्षण → छोटे, प्रबल बंधन: sp (50%) &gt; sp² (33%) &gt; sp³ (25%)।</li>
        <li>संकर कक्षक <strong>σ (सिग्मा)</strong> बंधन बनाते हैं; असंकरित p कक्षक <strong>π (पाई)</strong> बंधन बनाते हैं।</li>
      </ul></div>
      <table class="btable">
        <tr><th>अणु</th><th>संकरण</th><th>एकाकी/बंध युग्म</th><th>आकृति</th><th>कोण</th></tr>
        <tr><td>BeCl₂</td><td>sp</td><td>0 / 2</td><td>रेखीय</td><td>180°</td></tr>
        <tr><td>BF₃</td><td>sp²</td><td>0 / 3</td><td>त्रिकोणीय समतलीय</td><td>120°</td></tr>
        <tr><td>CH₄</td><td>sp³</td><td>0 / 4</td><td>चतुष्फलकीय</td><td>109.5°</td></tr>
        <tr><td>NH₃</td><td>sp³</td><td>1 / 3</td><td>पिरामिडी</td><td>107°</td></tr>
        <tr><td>H₂O</td><td>sp³</td><td>2 / 2</td><td>मुड़ी</td><td>104.5°</td></tr>
      </table>
    `,diagrams:["sp","sp2","sp3","nh3","h2o"],mcqs:[{q_en:"Hybridization in BeCl₂ is:",q_hi:"BeCl₂ में संकरण है:",opts_en:["sp","sp²","sp³","dsp²"],opts_hi:["sp","sp²","sp³","dsp²"],ans:0},{q_en:"The H—O—H bond angle is 104.5° (less than 109.5°) because of:",q_hi:"H—O—H बंधन कोण 104.5° (109.5° से कम) है क्योंकि:",opts_en:["Repulsion by two lone pairs","Ionic character","Hydrogen bonding","Large size of oxygen"],opts_hi:["दो एकाकी युग्मों का प्रतिकर्षण","आयनिक लक्षण","हाइड्रोजन बंधन","ऑक्सीजन का बड़ा आकार"],ans:0},{q_en:"Shape of NH₃ is:",q_hi:"NH₃ की आकृति है:",opts_en:["Trigonal pyramidal","Tetrahedral","Bent","Linear"],opts_hi:["त्रिकोणीय पिरामिडी","चतुष्फलकीय","मुड़ी","रेखीय"],ans:0},{q_en:"Steric number 3 corresponds to hybridization:",q_hi:"स्टेरिक संख्या 3 के संगत संकरण है:",opts_en:["sp²","sp","sp³","sp³d"],opts_hi:["sp²","sp","sp³","sp³d"],ans:0},{q_en:"Correct order of bond angles:",q_hi:"बंधन कोणों का सही क्रम:",opts_en:["CH₄ > NH₃ > H₂O","H₂O > NH₃ > CH₄","NH₃ > CH₄ > H₂O","CH₄ > H₂O > NH₃"],opts_hi:["CH₄ > NH₃ > H₂O","H₂O > NH₃ > CH₄","NH₃ > CH₄ > H₂O","CH₄ > H₂O > NH₃"],ans:0}]},{id:"u1t8",unit:1,title_en:"Coordinate, Hydrogen & Metallic Bonding",title_hi:"उपसहसंयोजक, हाइड्रोजन व धात्विक बंधन",body_en:`
      <h3>Coordinate (dative) bond — e.g. NH₄⁺</h3>
      <p>A <strong>coordinate bond</strong> is a covalent bond in which <strong>both shared electrons are donated by one atom</strong> (the donor) to an empty orbital of another (the acceptor), shown as an arrow <strong>A → B</strong>.</p>
      <ul>
        <li><strong>NH₄⁺ formation:</strong> NH₃ has a lone pair on nitrogen. H⁺ has an empty 1s orbital. The lone pair is donated: <strong>NH₃ + H⁺ → NH₄⁺</strong> (N → H coordinate bond).</li>
        <li>Once formed, all four N—H bonds in NH₄⁺ are <strong>identical</strong> (tetrahedral) — the coordinate bond becomes indistinguishable from ordinary covalent bonds.</li>
        <li>Other examples: H₃O⁺, [Cu(NH₃)₄]²⁺, CO (C → O), O₃.</li>
      </ul>
      <h3>Hydrogen bonding — anomalous properties of NH₃ & H₂O</h3>
      <p>A <strong>hydrogen bond</strong> is the weak electrostatic attraction between a hydrogen atom bonded to a highly electronegative atom (N, O, F) and a lone pair on N/O/F of a neighbouring molecule: <strong>X—H···Y</strong>. It is stronger than van der Waals forces but weaker than covalent bonds (~5–30 kJ/mol).</p>
      <ul>
        <li><strong>Water:</strong> extensive H-bonding gives anomalously <strong>high boiling point</strong> (100 °C vs −60 °C expected), high surface tension, high specific heat, and makes <strong>ice less dense than water</strong> (open cage structure — ice floats).</li>
        <li><strong>Ammonia:</strong> H-bonding gives NH₃ a higher b.p. (−33 °C) than PH₃ (−88 °C), high solubility in water, and association in the liquid state.</li>
        <li>H-bonding also explains why HF is a liquid while HCl is a gas, and the solubility of alcohols in water.</li>
      </ul>
      <h3>Metallic bonding</h3>
      <p>In metals, valence electrons are <strong>delocalised</strong> over the whole crystal — a lattice of positive <strong>kernels</strong> (nuclei + core electrons) immersed in a mobile <strong>"sea of electrons"</strong>.</p>
      <div class="keybox"><div class="keybox-title">⭐ Key Points for Exams</div>
      <ul>
        <li><strong>Explains metallic properties:</strong> electrical/thermal conductivity (mobile electrons), malleability & ductility (layers slide without breaking the electron sea), lustre (electrons absorb/re-emit light), high m.p./b.p. (strong non-directional bonding).</li>
        <li>Conductivity <strong>decreases with temperature</strong> — heating vibrates kernels and scatters electrons (opposite of semiconductors).</li>
        <li>Strength increases with number of valence electrons: Na (soft) &lt; Mg &lt; Al; transition metals are very hard with high m.p.</li>
        <li><strong>Alloys</strong> (Unit 3) are harder because different-sized atoms distort the lattice and block layer sliding.</li>
      </ul></div>
    `,body_hi:`
      <h3>उपसहसंयोजक (dative) बंधन — उदा. NH₄⁺</h3>
      <p><strong>उपसहसंयोजक बंधन</strong> एक सहसंयोजक बंधन है जिसमें <strong>साझा किए गए दोनों इलेक्ट्रॉन एक ही परमाणु</strong> (दाता) द्वारा दूसरे के रिक्त कक्षक (ग्राही) को दिए जाते हैं; इसे तीर <strong>A → B</strong> से दर्शाते हैं।</p>
      <ul>
        <li><strong>NH₄⁺ निर्माण:</strong> NH₃ में नाइट्रोजन पर एकाकी युग्म होता है। H⁺ में रिक्त 1s कक्षक होता है। एकाकी युग्म दान किया जाता है: <strong>NH₃ + H⁺ → NH₄⁺</strong> (N → H उपसहसंयोजक बंधन)।</li>
        <li>बनने के बाद NH₄⁺ के चारों N—H बंधन <strong>सर्वसम</strong> (चतुष्फलकीय) होते हैं — उपसहसंयोजक बंधन साधारण सहसंयोजक बंधनों से अभिन्न हो जाता है।</li>
        <li>अन्य उदाहरण: H₃O⁺, [Cu(NH₃)₄]²⁺, CO (C → O), O₃।</li>
      </ul>
      <h3>हाइड्रोजन बंधन — NH₃ व H₂O के असंगत गुण</h3>
      <p><strong>हाइड्रोजन बंधन</strong> अत्यंत विद्युतऋणात्मक परमाणु (N, O, F) से बँधे हाइड्रोजन परमाणु और पड़ोसी अणु के N/O/F पर स्थित एकाकी युग्म के बीच दुर्बल स्थिरवैद्युत आकर्षण है: <strong>X—H···Y</strong>। यह वान डर वाल्स बलों से प्रबल परंतु सहसंयोजक बंधनों से दुर्बल (~5–30 kJ/mol) होता है।</p>
      <ul>
        <li><strong>जल:</strong> व्यापक H-बंधन से असंगत रूप से <strong>उच्च क्वथनांक</strong> (अपेक्षित −60 °C के बजाय 100 °C), उच्च पृष्ठ तनाव, उच्च विशिष्ट ऊष्मा मिलती है, और <strong>बर्फ जल से हल्की</strong> होती है (खुली पिंजर संरचना — बर्फ तैरती है)।</li>
        <li><strong>अमोनिया:</strong> H-बंधन से NH₃ का क्वथनांक (−33 °C) PH₃ (−88 °C) से उच्च, जल में उच्च विलेयता, तथा द्रव अवस्था में संगुणन होता है।</li>
        <li>H-बंधन यह भी समझाता है कि HF द्रव क्यों है जबकि HCl गैस है, और जल में ऐल्कोहॉलों की विलेयता।</li>
      </ul>
      <h3>धात्विक बंधन</h3>
      <p>धातुओं में संयोजकता इलेक्ट्रॉन सम्पूर्ण क्रिस्टल में <strong>विस्थानित</strong> होते हैं — गतिशील <strong>"इलेक्ट्रॉनों के सागर"</strong> में डूबा धनात्मक <strong>कर्नेलों</strong> (नाभिक + आंतरिक इलेक्ट्रॉन) का जालक।</p>
      <div class="keybox"><div class="keybox-title">⭐ परीक्षा हेतु मुख्य बिंदु</div>
      <ul>
        <li><strong>धात्विक गुणों की व्याख्या:</strong> विद्युत/ऊष्मा चालकता (गतिशील इलेक्ट्रॉन), आघातवर्ध्यता व तन्यता (इलेक्ट्रॉन सागर को बिना तोड़े परतें फिसलती हैं), धात्विक चमक (इलेक्ट्रॉन प्रकाश अवशोषित/पुनः उत्सर्जित करते हैं), उच्च गलनांक/क्वथनांक (प्रबल अदिशात्मक बंधन)।</li>
        <li>चालकता तापमान के साथ <strong>घटती</strong> है — गर्म करने पर कर्नेल कंपन करते हैं और इलेक्ट्रॉन प्रकीर्णित होते हैं (अर्धचालकों के विपरीत)।</li>
        <li>संयोजकता इलेक्ट्रॉनों की संख्या के साथ सामर्थ्य बढ़ता है: Na (मृदु) &lt; Mg &lt; Al; संक्रमण धातुएँ बहुत कठोर व उच्च गलनांक वाली होती हैं।</li>
        <li><strong>मिश्रधातुएँ</strong> (इकाई 3) कठोर होती हैं क्योंकि भिन्न आकार के परमाणु जालक को विकृत कर परत फिसलन रोकते हैं।</li>
      </ul></div>
    `,diagrams:["nh4","hbond","metallic"],mcqs:[{q_en:"In NH₄⁺, the fourth N—H bond is:",q_hi:"NH₄⁺ में चौथा N—H बंधन है:",opts_en:["A coordinate bond (N → H⁺)","An ionic bond","A hydrogen bond","A metallic bond"],opts_hi:["एक उपसहसंयोजक बंधन (N → H⁺)","एक आयनिक बंधन","एक हाइड्रोजन बंधन","एक धात्विक बंधन"],ans:0},{q_en:"Ice floats on water because:",q_hi:"बर्फ जल पर तैरती है क्योंकि:",opts_en:["H-bonding gives ice an open cage structure with lower density","Ice is heavier","Water has no H-bonding","Ice repels water"],opts_hi:["H-बंधन से बर्फ की खुली पिंजर संरचना व कम घनत्व होता है","बर्फ भारी होती है","जल में H-बंधन नहीं होता","बर्फ जल को प्रतिकर्षित करती है"],ans:0},{q_en:"Electrical conductivity of metals is due to:",q_hi:"धातुओं की विद्युत चालकता का कारण है:",opts_en:["Mobile delocalised electrons","Fixed ions","Protons","Neutrons"],opts_hi:["गतिशील विस्थानित इलेक्ट्रॉन","स्थिर आयन","प्रोटॉन","न्यूट्रॉन"],ans:0},{q_en:"Which shows the strongest hydrogen bonding effect on boiling point?",q_hi:"क्वथनांक पर हाइड्रोजन बंधन का प्रबलतम प्रभाव किसमें दिखता है?",opts_en:["H₂O","H₂S","CH₄","PH₃"],opts_hi:["H₂O","H₂S","CH₄","PH₃"],ans:0}]},{id:"u1t9",unit:1,title_en:"Solutions & Methods of Expressing Concentration",title_hi:"विलयन एवं सांद्रता व्यक्त करने की विधियाँ",body_en:`
      <p>A <strong>solution</strong> is a homogeneous mixture of two or more substances. The substance dissolved is the <strong>solute</strong> (smaller amount); the medium in which it dissolves is the <strong>solvent</strong> (larger amount).</p>
      <h3>Methods of expressing concentration</h3>
      <table class="btable">
        <tr><th>Term</th><th>Symbol</th><th>Definition</th><th>Unit</th></tr>
        <tr><td><strong>Molarity</strong></td><td>M</td><td>Moles of solute per <strong>litre of solution</strong></td><td>mol L⁻¹</td></tr>
        <tr><td><strong>Molality</strong></td><td>m</td><td>Moles of solute per <strong>kg of solvent</strong></td><td>mol kg⁻¹</td></tr>
        <tr><td><strong>Normality</strong></td><td>N</td><td>Gram-equivalents of solute per <strong>litre of solution</strong></td><td>eq L⁻¹</td></tr>
        <tr><td><strong>Mass %</strong></td><td>w/w</td><td>(mass solute / mass solution) × 100</td><td>%</td></tr>
        <tr><td><strong>Volume %</strong></td><td>v/v</td><td>(volume solute / volume solution) × 100</td><td>%</td></tr>
        <tr><td><strong>ppm</strong></td><td>—</td><td>(mass solute / mass solution) × 10⁶</td><td>mg/L (≈)</td></tr>
        <tr><td><strong>Mole fraction</strong></td><td>x</td><td>moles of component / total moles</td><td>unitless</td></tr>
      </table>
      <div class="keybox"><div class="keybox-title">⭐ Key Points for Exams</div>
      <ul>
        <li><strong>Molarity depends on temperature</strong> (volume expands on heating); <strong>molality, mass %, ppm and mole fraction do not</strong> (mass-based).</li>
        <li><strong>Normality = Molarity × n-factor</strong> (acidity/basicity or electrons exchanged). For H₂SO₄, n = 2 → 1 M = 2 N.</li>
        <li>Equivalent weight = Molar mass / n-factor.</li>
        <li>For dilute aqueous solutions, <strong>1 ppm ≈ 1 mg/L</strong> (since density of water ≈ 1 g/mL).</li>
        <li>Dilution law: <strong>M₁V₁ = M₂V₂</strong> (moles of solute unchanged).</li>
      </ul></div>
      <div class="formula-strip"><span class="flabel">Core formulas</span>M = n / V(L) · m = n / kg solvent · N = eq / V(L) · x_A = n_A / (n_A + n_B)</div>
      <h3>Remember the distinctions</h3>
      <ul>
        <li><strong>Molarity vs molality:</strong> molarity uses litres of <em>solution</em>; molality uses kg of <em>solvent</em>.</li>
        <li><strong>ppm</strong> is used for <strong>very dilute</strong> solutions — e.g. hardness of water, pollutants in air.</li>
        <li><strong>Mole fraction:</strong> x_solute + x_solvent = 1 always.</li>
      </ul>
    `,body_hi:`
      <p><strong>विलयन</strong> दो या अधिक पदार्थों का समांगी मिश्रण है। घोला गया पदार्थ <strong>विलेय</strong> (कम मात्रा) कहलाता है; वह माध्यम जिसमें वह घुलता है <strong>विलायक</strong> (अधिक मात्रा) कहलाता है।</p>
      <h3>सांद्रता व्यक्त करने की विधियाँ</h3>
      <table class="btable">
        <tr><th>पद</th><th>चिह्न</th><th>परिभाषा</th><th>मात्रक</th></tr>
        <tr><td><strong>मोलरता</strong></td><td>M</td><td>प्रति <strong>लीटर विलयन</strong> में विलेय के मोल</td><td>mol L⁻¹</td></tr>
        <tr><td><strong>मोललता</strong></td><td>m</td><td>प्रति <strong>kg विलायक</strong> में विलेय के मोल</td><td>mol kg⁻¹</td></tr>
        <tr><td><strong>नॉर्मलता</strong></td><td>N</td><td>प्रति <strong>लीटर विलयन</strong> में विलेय के ग्राम-तुल्यांक</td><td>eq L⁻¹</td></tr>
        <tr><td><strong>द्रव्यमान %</strong></td><td>w/w</td><td>(विलेय द्रव्यमान / विलयन द्रव्यमान) × 100</td><td>%</td></tr>
        <tr><td><strong>आयतन %</strong></td><td>v/v</td><td>(विलेय आयतन / विलयन आयतन) × 100</td><td>%</td></tr>
        <tr><td><strong>ppm</strong></td><td>—</td><td>(विलेय द्रव्यमान / विलयन द्रव्यमान) × 10⁶</td><td>mg/L (≈)</td></tr>
        <tr><td><strong>मोल प्रभाज</strong></td><td>x</td><td>घटक के मोल / कुल मोल</td><td>मात्रकहीन</td></tr>
      </table>
      <div class="keybox"><div class="keybox-title">⭐ परीक्षा हेतु मुख्य बिंदु</div>
      <ul>
        <li><strong>मोलरता तापमान पर निर्भर</strong> करती है (गर्म करने पर आयतन बढ़ता है); <strong>मोललता, द्रव्यमान %, ppm व मोल प्रभाज निर्भर नहीं</strong> करते (द्रव्यमान-आधारित)।</li>
        <li><strong>नॉर्मलता = मोलरता × n-गुणक</strong> (अम्लता/क्षारकता या आदान-प्रदान इलेक्ट्रॉन)। H₂SO₄ हेतु n = 2 → 1 M = 2 N।</li>
        <li>तुल्यांकी भार = मोलर द्रव्यमान / n-गुणक।</li>
        <li>तनु जलीय विलयनों हेतु <strong>1 ppm ≈ 1 mg/L</strong> (क्योंकि जल का घनत्व ≈ 1 g/mL)।</li>
        <li>तनुकरण नियम: <strong>M₁V₁ = M₂V₂</strong> (विलेय के मोल अपरिवर्तित)।</li>
      </ul></div>
      <div class="formula-strip"><span class="flabel">मुख्य सूत्र</span>M = n / V(L) · m = n / kg विलायक · N = तुल्यांक / V(L) · x_A = n_A / (n_A + n_B)</div>
      <h3>अंतर याद रखें</h3>
      <ul>
        <li><strong>मोलरता बनाम मोललता:</strong> मोलरता में <em>विलयन</em> के लीटर; मोललता में <em>विलायक</em> के kg।</li>
        <li><strong>ppm</strong> <strong>अत्यंत तनु</strong> विलयनों हेतु प्रयुक्त — जैसे जल की कठोरता, वायु में प्रदूषक।</li>
        <li><strong>मोल प्रभाज:</strong> x_विलेय + x_विलायक = 1 सदैव।</li>
      </ul>

ता द्रव्यमान-आधारित है, अतः तापमान का प्रभाव नहीं पड़ता।"},{q_en:"1 M H₂SO₄ is equal to:",q_hi:"1 M H₂SO₄ बराबर है:",opts_en:["2 N","1 N","0.5 N","4 N"],opts_hi:["2 N","1 N","0.5 N","4 N"],ans:0},{q_en:"Mole fraction of solute + mole fraction of solvent equals:",q_hi:"विलेय का मोल प्रभाज + विलायक का मोल प्रभाज बराबर है:",opts_en:["1","0","100","Molarity"],opts_hi:["1","0","100","मोलरता"],ans:0},{q_en:"For very dilute aqueous solutions, 1 ppm equals:",q_hi:"अत्यंत तनु जलीय विलयनों हेतु 1 ppm बराबर है:",opts_en:["1 mg/L","1 g/L","1 kg/L","1 mol/L"],opts_hi:["1 mg/L","1 g/L","1 kg/L","1 mol/L"],ans:0}]}];var Pg=[{id:"u2t1",unit:2,title_en:"Water Distribution & Hardness: Soap Test, Salts & Units",title_hi:"जल वितरण एवं कठोरता: साबुन परीक्षण, लवण व मात्रक",body_en:`
      <p>Water covers about <strong>71% of Earth's surface</strong>, yet only a tiny fraction is usable fresh water. Understanding this distribution — and why some water is "hard" — is the foundation of water chemistry.</p>
      <h3>Distribution of water on Earth</h3>
      <ul>
        <li><strong>Oceans:</strong> ~97% — saline, unfit for drinking or most industrial use.</li>
        <li><strong>Fresh water:</strong> ~2.5% — of which ~1.74% is locked in <strong>glaciers and ice caps</strong>, ~0.75% is <strong>groundwater</strong>, and less than <strong>0.01%</strong> is easily accessible surface water (rivers, lakes).</li>
        <li>Hence water <strong>conservation and treatment</strong> are essential for human consumption and industry.</li>
      </ul>
      <h3>Soft vs hard water — the soap test</h3>
      <p><strong>Soft water</strong> gives a rich lather easily with soap. <strong>Hard water</strong> does not — it forms a sticky white precipitate (<strong>scum</strong>) of calcium/magnesium soaps, and lather appears only after all hardness is precipitated.</p>
      <div class="formula-strip"><span class="flabel">Soap-test reaction</span>2 C₁₇H₃₅COONa + Ca²⁺ → (C₁₇H₃₅COO)₂Ca ↓ (scum) + 2 Na⁺</div>
      <h3>Salts causing hardness</h3>
      <table class="btable">
        <tr><th>Type</th><th>Caused by</th><th>Removed by</th></tr>
        <tr><td><strong>Temporary hardness</strong></td><td>Bicarbonates: Ca(HCO₃)₂, Mg(HCO₃)₂</td><td>Boiling (precipitates CaCO₃)</td></tr>
        <tr><td><strong>Permanent hardness</strong></td><td>Chlorides & sulphates: CaCl₂, MgCl₂, CaSO₄, MgSO₄</td><td>Boiling fails — needs chemical treatment</td></tr>
      </table>
      <p><strong>Temporary hardness</strong> is also called <strong>alkaline hardness</strong> (bicarbonates); permanent hardness is <strong>non-alkaline hardness</strong>.</p>
      <div class="keybox"><div class="keybox-title">⭐ Key Points for Exams</div>
      <ul>
        <li><strong>Unit of hardness:</strong> <strong>ppm</strong> (parts per million) or <strong>mg/L as CaCO₃ equivalents</strong>. 1 ppm = 1 mg CaCO₃ per litre of water.</li>
        <li>Hardness as CaCO₃ = (mass of salt × 100 / molar mass of salt) — because the equivalent weight of CaCO₃ is 50, all hardness is expressed on a common scale.</li>
        <li>Degree scales: 1 °French = 10 ppm; 1 °Clark = 14.3 ppm.</li>
        <li><strong>Boiling removes temporary hardness:</strong> Ca(HCO₃)₂ → CaCO₃↓ + H₂O + CO₂↑.</li>
        <li>Hardness is caused mainly by <strong>Ca²⁺ and Mg²⁺</strong> salts; other divalent ions (Fe²⁺, Sr²⁺) contribute rarely.</li>
      </ul></div>
      <h3>Why poor lathering wastes soap</h3>
      <p>Soap is <strong>wasted as scum</strong> before any cleaning happens — hard water needs much more soap for the same washing. The scum also deposits on fabrics (dull, harsh clothes) and on skin/hair.</p>
    `,body_hi:`
      <p>जल पृथ्वी की सतह का लगभग <strong>71%</strong> घेरता है, फिर भी उपयोग योग्य अलवण जल का अंश अत्यंत कम है। इस वितरण — और कुछ जल के "कठोर" होने — को समझना जल रसायन की नींव है।</p>
      <h3>पृथ्वी पर जल का वितरण</h3>
      <ul>
        <li><strong>महासागर:</strong> ~97% — लवणीय, पेय या अधिकांश औद्योगिक उपयोग हेतु अनुपयुक्त।</li>
        <li><strong>अलवण जल:</strong> ~2.5% — जिसमें ~1.74% <strong>हिमनदों व हिमटोपियों</strong> में बंद है, ~0.75% <strong>भूजल</strong> है, और <strong>0.01% से कम</strong> सुलभ सतही जल (नदियाँ, झीलें) है।</li>
        <li>अतः मानव उपभोग व उद्योग हेतु जल <strong>संरक्षण व शोधन</strong> आवश्यक हैं।</li>
      </ul>
      <h3>मृदु बनाम कठोर जल — साबुन परीक्षण</h3>
      <p><strong>मृदु जल</strong> साबुन के साथ आसानी से झाग देता है। <strong>कठोर जल</strong> नहीं देता — यह कैल्शियम/मैग्नीशियम साबुनों का चिपचिपा श्वेत अवक्षेप (<strong>मैल</strong>) बनाता है, और झाग तभी आता है जब सारी कठोरता अवक्षेपित हो जाए।</p>
      <div class="formula-strip"><span class="flabel">साबुन-परीक्षण अभिक्रिया</span>2 C₁₇H₃₅COONa + Ca²⁺ → (C₁₇H₃₅COO)₂Ca ↓ (मैल) + 2 Na⁺</div>
      <h3>कठोरता उत्पन्न करने वाले लवण</h3>
      <table class="btable">
        <tr><th>प्रकार</th><th>कारण</th><th>निवारण</th></tr>
        <tr><td><strong>अस्थायी कठोरता</strong></td><td>बाइकार्बोनेट: Ca(HCO₃)₂, Mg(HCO₃)₂</td><td>उबालना (CaCO₃ अवक्षेपित)</td></tr>
        <tr><td><strong>स्थायी कठोरता</strong></td><td>क्लोराइड व सल्फेट: CaCl₂, MgCl₂, CaSO₄, MgSO₄</td><td>उबालना विफल — रासायनिक उपचार चाहिए</td></tr>
      </table>
      <p><strong>अस्थायी कठोरता</strong> को <strong>क्षारीय कठोरता</strong> (बाइकार्बोनेट) भी कहते हैं; स्थायी कठोरता <strong>अक्षारीय कठोरता</strong> है।</p>
      <div class="keybox"><div class="keybox-title">⭐ परीक्षा हेतु मुख्य बिंदु</div>
      <ul>
        <li><strong>कठोरता का मात्रक:</strong> <strong>ppm</strong> (पार्ट्स प्रति मिलियन) या <strong>mg/L, CaCO₃ तुल्यांक के रूप में</strong>। 1 ppm = प्रति लीटर जल में 1 mg CaCO₃।</li>
        <li>CaCO₃ के रूप में कठोरता = (लवण का द्रव्यमान × 100 / लवण का मोलर द्रव्यमान) — क्योंकि CaCO₃ का तुल्यांकी भार 50 है, सारी कठोरता एक समान पैमाने पर व्यक्त की जाती है।</li>
        <li>डिग्री पैमाने: 1 °फ्रेंच = 10 ppm; 1 °क्लार्क = 14.3 ppm।</li>
        <li><strong>उबालने से अस्थायी कठोरता दूर होती है:</strong> Ca(HCO₃)₂ → CaCO₃↓ + H₂O + CO₂↑।</li>
        <li>कठोरता मुख्यतः <strong>Ca²⁺ व Mg²⁺</strong> लवणों से होती है; अन्य द्विसंयोजक आयन (Fe²⁺, Sr²⁺) कभी-कभी योगदान देते हैं।</li>
      </ul></div>
      <h3>खराब झाग से साबुन की बर्बादी क्यों</h3>
      <p>सफाई शुरू होने से पहले ही साबुन <strong>मैल के रूप में बर्बाद</strong> होता है — कठोर जल में समान धुलाई हेतु अधिक साबुन चाहिए। मैल कपड़ों (मंद, खुरदरे वस्त्र) तथा त्वचा/बालों पर भी जमता है।</p>
