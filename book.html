<style>
:root{
  --blue:#2563eb;
  --blue-dark:#1d4ed8;
  --blue-soft:#eff6ff;
  --green:#16a34a;
  --red:#ef4444;
  --dark:#0f172a;
  --text:#334155;
  --muted:#64748b;
  --border:#e2e8f0;
  --bg:#f8fafc;
  --white:#fff;
  --shadow:0 10px 30px rgba(15,23,42,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;
  min-height:0;
  background:transparent!important;
  font-family:"Plus Jakarta Sans",sans-serif;
  color:var(--text);
  overflow-x:hidden;
}
body.reader-open{overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}

.books-wrap{width:100%;margin:0;padding:0}
.books-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:0 0 10px;
}
.books-title{font-size:16px;font-weight:800;color:var(--dark)}
.books-title span{color:var(--blue)}
.books-subtitle{font-size:10px;color:var(--muted);font-weight:700}

.books-grid{
  width:100%;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.book-card{
  position:relative;
  min-width:0;
  overflow:hidden;
  background:var(--white);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow);
  cursor:pointer;
  transition:transform .15s ease;
  -webkit-tap-highlight-color:transparent;
}
.book-card:active{transform:scale(.985)}

.book-cover{
  position:relative;
  width:100%;
  aspect-ratio:3/4;
  overflow:hidden;
  background:#eef2ff;
}
.book-cover canvas{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  background:#fff;
}
.cover-loader{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#eff6ff,#f8fafc);
  color:var(--blue);
  font-size:10px;
  font-weight:800;
}
.spinner{
  width:18px;height:18px;
  border:3px solid #dbeafe;
  border-top-color:var(--blue);
  border-radius:50%;
  animation:spin .75s linear infinite;
  margin-right:7px;
}
@keyframes spin{to{transform:rotate(360deg)}}

.book-shade{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(to top,rgba(2,6,23,.84),rgba(2,6,23,.08) 70%,transparent);
}
.book-content{
  position:absolute;
  left:9px;right:9px;bottom:9px;z-index:3;
}
.book-name{
  color:#fff;
  font-size:11px;
  font-weight:800;
  line-height:1.35;
  margin-bottom:6px;
  text-shadow:0 2px 8px rgba(0,0,0,.3);
}
.open-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  color:#fff;
  font-size:8px;
  font-weight:800;
  padding:5px 8px;
  border-radius:999px;
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.35);
  backdrop-filter:blur(7px);
}
.book-meta{
  padding:9px 10px 10px;
}
.book-meta-line{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:6px;
}
.book-type{font-size:9px;color:var(--muted);font-weight:700}
.book-pages{
  font-size:8px;
  padding:4px 7px;
  border-radius:999px;
  color:#1d4ed8;
  background:#eff6ff;
  border:1px solid #bfdbfe;
  font-weight:800;
}

/* Reader */
.reader{
  position:fixed;
  inset:0;
  z-index:99999;
  display:none;
  flex-direction:column;
  background:#111827;
}
.reader.active{display:flex}

.reader-top{

  flex:0 0 58px;
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px 10px;
}
.icon-btn{
  width:38px;height:38px;flex:0 0 38px;
  border:1px solid var(--border);
  border-radius:50%;
  background:#f8fafc;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--dark);
  font-size:15px;
}
.reader-title{

  flex:1;
}
.reader-title strong{

}
.reader-title small{

  color:var(--muted);

  margin-top:2px;
}

.reader-main{

}

.pdf-pane{

  overflow:auto;

}
.pdf-page{

.side-panel{

.book-info h2{

}
.book-info p{

.engagement{

.engage-btn.active.save{

  background:#f0fdf4;

}
.engage-btn:active{transform:scale(.98)}

.comment-head{

  align-items:center;

}
.comment-head h3{

}
.comment-count{

.comment-form{
  display:flex;
  gap:8px;

  margin-bottom:13px;

.comment-avatar{

  align-items:center;

.comment-date{

/* ============================================================
   HELPERS
   ============================================================ */

function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function slugify(value){
  return String(value)
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"")
    .slice(0,80);
}

function getBookId(book,index){
  return slugify(book.name) || ("book-"+index);
}

function formatDate(value){
  if(!value) return "Just now";

  const d =
    typeof value === "number"
      ? new Date(value)
      : new Date(value);

  if(Number.isNaN(d.getTime())) return "Just now";

  return d.toLocaleDateString("en-IN",{
    day:"2-digit",
    month:"short",
    year:"numeric"
  });
}

/* ============================================================
   BOOK THUMBNAIL
   ============================================================ */

async function renderCover(book, canvas, loader){

  try{

    const task =
      pdfjsLib.getDocument({
        url:book.pdf,
        disableAutoFetch:false,
        disableStream:false,
        withCredentials:false
      });

    const pdf =
      await task.promise;

    const page =
      await pdf.getPage(1);

    const width =
      Math.max(180,canvas.parentElement.clientWidth);

    const base =
      page.getViewport({scale:1});

    const scale =
      width / base.width;

    const viewport =
      page.getViewport({
        scale:Math.max(.25,scale)
      });

    const ratio =
      Math.min(window.devicePixelRatio || 1,2);

    canvas.width =
      Math.floor(viewport.width * ratio);

    canvas.height =
      Math.floor(viewport.height * ratio);

    canvas.style.width="100%";
    canvas.style.height="100%";
    canvas.style.objectFit="cover";

    await page.render({
      canvasContext:canvas.getContext("2d",{alpha:false}),
      viewport,
      transform:ratio !== 1
        ? [ratio,0,0,ratio,0,0]
        : null
    }).promise;

    loader.style.display="none";

  }catch(e){

    console.warn("Cover failed:",book.name,e);

    loader.innerHTML =
      `<span style="color:#64748b">Cover unavailable</span>`;
  }

}

/* ============================================================
   FIREBASE DATA LISTENERS
   Structure:

   books/
      book-id/
        likes/
          uid: true
        saves/
          uid: true
        comments/
          pushId/
            uid
            name
            profilePic
            text
            createdAt
   ============================================================ */

function detachBookListeners(){

  if(likeUnsubscribe) likeUnsubscribe();
  if(saveUnsubscribe) saveUnsubscribe();
  if(commentsUnsubscribe) commentsUnsubscribe();

  likeUnsubscribe=null;
  saveUnsubscribe=null;
  commentsUnsubscribe=null;
}


function attachBookListeners(){

  detachBookListeners();

  if(!currentBookId) return;

  /* Likes */
  const likesRef =
    ref(db,`books/${currentBookId}/likes`);

  likeUnsubscribe =
    onValue(likesRef,snapshot=>{

      const total =
        snapshot.exists()
          ? Object.keys(snapshot.val() || {}).length
          : 0;

      likeCount.textContent = total;

      const uid =
        currentUser?.uid;

      const liked =
        uid &&
        snapshot.exists() &&
        snapshot.child(uid).exists();

      likeBtn.classList.toggle("active",!!liked);

    });


  /* Saves */
  const savesRef =
    ref(db,`books/${currentBookId}/saves`);

  saveUnsubscribe =
    onValue(savesRef,snapshot=>{

      const total =
        snapshot.exists()
          ? Object.keys(snapshot.val() || {}).length
          : 0;

      saveCount.textContent = total;

      const uid =
        currentUser?.uid;

      const saved =
        uid &&
        snapshot.exists() &&
        snapshot.child(uid).exists();

      saveBtn.classList.toggle("active",!!saved);

    });


  /* Comments */
  const commentsRef =
    ref(db,`books/${currentBookId}/comments`);

  commentsUnsubscribe =
    onValue(commentsRef,snapshot=>{

      commentsList.innerHTML="";

      if(!snapshot.exists()){

        commentCount.textContent="0 comments";

        commentsList.innerHTML =
          `<div class="empty-comments">
             No comments yet. Be the first to comment.
           </div>`;

        return;
      }

      const comments=[];

      snapshot.forEach(child=>{

        comments.push({
          id:child.key,
          ...(child.val() || {})
        });

      });

      comments.sort(
        (a,b)=>
          Number(b.createdAt || 0) -
          Number(a.createdAt || 0)
      );

      commentCount.textContent =
        `${comments.length} comment${comments.length===1?"":"s"}`;

      comments.forEach(comment=>{

        const avatar =
          comment.profilePic
            ? `<img src="${escapeHTML(comment.profilePic)}" alt="Profile">`
            : `<span style="
                font-size:11px;
                font-weight:800;
              ">${escapeHTML(
                (comment.name || "U")
                  .charAt(0)
                  .toUpperCase()
              )}</span>`;

        const item =
          document.createElement("div");

        item.className="comment";

        item.innerHTML=`

          <div class="comment-avatar">
            ${avatar}
          </div>

          <div class="comment-body">

            <div class="comment-top">

              <span class="comment-name">
                ${escapeHTML(
                  comment.name || "Diploma Engineer"
                )}
              </span>

              <span class="comment-date">
                ${formatDate(comment.createdAt)}
              </span>

            </div>

            <div class="comment-text">
              ${escapeHTML(comment.text || "")}
            </div>

          </div>
        `;

        commentsList.appendChild(item);

      });

    });

}


/* ============================================================
   LIKE
   ============================================================ */

likeBtn.addEventListener("click",async()=>{

  if(!currentUser){

    showLoginMessage();

    return;
  }

  if(!currentBookId) return;

  const likeRef =
    ref(
      db,
      `books/${currentBookId}/likes/${currentUser.uid}`
    );

  try{

    const isActive =
      likeBtn.classList.contains("active");

    if(isActive){
      await remove(likeRef);
    }else{
      await set(likeRef,true);
    }

  }catch(error){

    console.error("Like error:",error);

    alert("Unable to update like. Please try again.");

  }

});

/* ============================================================
   COMMENT SUBMIT
   ============================================================ */

commentForm.addEventListener("submit",async event=>{

  event.preventDefault();

  if(!currentUser){

    showLoginMessage();

    return;
  }

  if(!currentBookId) return;

  const text =
    commentInput.value.trim();

  if(!text) return;

  if(text.length > 500){

    alert("Comment must be 500 characters or less.");

    return;
  }

  commentSubmit.disabled=true;

  try{

    /*
      Prefer profile data already stored in the main app.
      Falls back to Firebase Auth.
    */

    const profile =
      window.parent &&
      window.parent.currentUserData
        ? window.parent.currentUserData
        : {};

    const commentRef =
      push(
        ref(db,`books/${currentBookId}/comments`)
      );

    await set(commentRef,{
      uid:currentUser.uid,
      name:
        profile.name ||
        currentUser.displayName ||
        "Diploma Engineer",
      profilePic:
        profile.profilePic ||
        currentUser.photoURL ||
        "",
      branch:
        profile.branch ||
        "",
      text:text,
      createdAt:Date.now()
    });

    commentInput.value="";

  }catch(error){

    console.error("Comment error:",error);

    alert(
      "Comment could not be saved: "+
      (error?.message || "Unknown error")
    );

  }finally{

    commentSubmit.disabled=false;

  }

});


function showLoginMessage(){

  loginNote.style.display="block";

  loginNote.textContent =
    "Please login to Diploma Engineers before using Like, Save or Comments.";

  commentInput.focus();

}


/* ============================================================
   OPEN BOOK READER
   ============================================================ */

async function openBook(book,index){

  currentBook=book;
  currentBookId=getBookId(book,index);

  readerTitle.textContent=book.name;
  sideBookTitle.textContent=book.name;

  reader.classList.add("active");
  reader.setAttribute("aria-hidden","false");

  document.body.classList.add("reader-open");

  attachBookListeners();
  updateUserUI();

  pdfPane.scrollTop=0;

  /*
    Keep browser history usable.
    Back closes the book reader.
  */
  history.pushState(
    {bookReader:true},
    "",
    "#book-"+encodeURIComponent(currentBookId)
  );

  await renderFullPdf(book.pdf);

}


/* ============================================================
   PDF FULL READER
   ============================================================ */

async function renderFullPdf(url){

  const token=++pdfToken;

  pdfPane.innerHTML=
    `<div style="
      display:flex;
      align-items:center;
      justify-content:center;
      padding:50px 10px;
      color:#fff;
      font-size:11px;
      font-weight:700;
    ">
      <div class="spinner"
        style="border-color:#cbd5e1;border-top-color:#fff">
      </div>
      Loading book…
    </div>`;

  setReaderStatus("Loading PDF…");

  try{

    const task =
      pdfjsLib.getDocument({
        url:url,
        disableAutoFetch:false,
        disableStream:false,
        withCredentials:false
      });

    const pdf =
      await task.promise;

    if(token!==pdfToken) return;

    pdfPane.innerHTML="";

    const width =
      Math.min(
        Math.max(
          280,
          pdfPane.clientWidth-20
        ),
        900
      );

    for(let pageNo=1;pageNo<=pdf.numPages;pageNo++){

      if(token!==pdfToken) return;

      const page =
        await pdf.getPage(pageNo);

      const base =
        page.getViewport({scale:1});

      const scale =
        width/base.width;

      const viewport =
        page.getViewport({
          scale:Math.max(.2,scale)
        });

      const canvas =
        document.createElement("canvas");

      canvas.className="pdf-page";

      const ratio =
        Math.min(window.devicePixelRatio || 1,2);

      canvas.width =
        Math.floor(viewport.width*ratio);

      canvas.height =
        Math.floor(viewport.height*ratio);

      canvas.style.width =
        Math.floor(viewport.width)+"px";

      canvas.style.height =
        Math.floor(viewport.height)+"px";

      pdfPane.appendChild(canvas);

      await page.render({
        canvasContext:
          canvas.getContext("2d",{alpha:false}),
        viewport,
        transform:
          ratio!==1
            ? [ratio,0,0,ratio,0,0]
            : null
      }).promise;

    }

    setReaderStatus(
      `${pdf.numPages} page${pdf.numPages===1?"":"s"} • Online reading mode`
    );

  }catch(error){

    console.error("PDF render error:",error);

    pdfPane.innerHTML=`
      <div style="
        max-width:540px;
        margin:45px auto;
        background:#fff;
        border-radius:18px;
        padding:25px;
        text-align:center;
        font-size:12px;
        line-height:1.7;
        color:#64748b;
      ">
        <strong style="
          display:block;
          color:#0f172a;
          font-size:17px;
          margin-bottom:8px;
        ">
          PDF could not be opened
        </strong>

        The PDF host may block browser CORS access.
        Please make the PDF publicly readable or use a
        server/proxy that permits browser PDF rendering.

      </div>
    `;

    setReaderStatus("PDF unavailable");

  }

}


/* ============================================================
   CLOSE READER
   ============================================================ */

function closeReader(fromPopstate=false){

  pdfToken++;

  currentBook=null;
  currentBookId="";

  detachBookListeners();

  reader.classList.remove("active");
  reader.setAttribute("aria-hidden","true");

  document.body.classList.remove("reader-open");

  pdfPane.innerHTML="";

  if(
    !fromPopstate &&
    window.location.hash.startsWith("#book-")
  ){
    history.back();
  }

}


/* ============================================================
   BACK / CLOSE
   ============================================================ */

document.getElementById("readerBack")
  .addEventListener("click",()=>closeReader(false));

document.getElementById("readerClose")
  .addEventListener("click",()=>closeReader(false));


window.addEventListener("popstate",()=>{

  if(reader.classList.contains("active")){

    closeReader(true);

  }

});


document.addEventListener("keydown",event=>{

  if(!reader.classList.contains("active")) return;

  if(event.key==="Escape"){

    closeReader(false);

  }

  /*
    No visible download/print UI is provided.
    These shortcuts are blocked as a basic viewer-level measure.
  */
  if(
    event.ctrlKey &&
    ["s","p","u"].includes(
      event.key.toLowerCase()
    )
  ){

    event.preventDefault();
    event.stopPropagation();

  }

});


document.addEventListener("contextmenu",event=>{

  if(reader.classList.contains("active")){

    event.preventDefault();

  }

});


/* ============================================================
   AUTH STATE
   ============================================================ */

onAuthStateChanged(auth,user=>{

  currentUser=user;

  updateUserUI();

  /*
    Rebind current book listeners so like/save reflects
    the newly logged-in user's state.
  */
  if(currentBookId){
    attachBookListeners();
  }

});


/* ============================================================
   INITIAL RENDER
   ============================================================ */

renderCards();


/* ============================================================
   MOBILE ROTATION / RESIZE
   ============================================================ */

window.addEventListener("resize",()=>{

  if(
    reader.classList.contains("active") &&
    currentBook
  ){

    clearTimeout(window.__readerResize);

    window.__readerResize =
      setTimeout(()=>{
        renderFullPdf(currentBook.pdf);
      },300);

  }

});

</script>
