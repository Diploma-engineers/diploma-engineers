<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ashoka Batch | Civil Engineering Portal</title>

<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* --- CSS VARIABLES (LIGHT WHITE THEME) --- */
:root {
    --primary: #6c5ce7; /* Professional Purple */
    --primary-light: #f3f0ff;
    --bg-app: #f9fafb;   /* Light Grayish White */
    --bg-card: #ffffff;  /* Pure White */
    --text-main: #1f2937; /* Dark Gray for readability */
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --header-height: 64px;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -1px rgba(0,0,0,0.06);
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* {
    margin: 0; padding: 0; box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; /* Moblie click highlight remove */
}

body {
    background: var(--bg-app);
    color: var(--text-main);
    overflow: hidden; /* Important for full app feel */
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
}

/* --- REUSABLE CLASSES --- */
.hidden { display: none !important; }

/* --- TOP BAR (FIXED FOR BOTH PAGES) --- */
.topbar {
    height: var(--header-height);
    background: var(--bg-card);
    display: flex;
    align-items: center;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
    position: relative; /* Changed from sticky, parent is flex col */
    z-index: 100;
    box-shadow: var(--shadow-sm);
    flex-shrink: 0;
}

.back-btn {
    font-size: 20px;
    color: var(--text-main);
    cursor: pointer;
    margin-right: 16px;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    transition: var(--transition);
}

.back-btn:hover { background: var(--primary-light); color: var(--primary); }

.logo {
    font-size: 19px; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
    flex: 1;
}

.logo span { color: var(--primary); }

/* --- PAGE TRANSITIONS (ZOOMING EFFECT) --- */
.page-container {
    width: 100%;
    transition: var(--transition);
    opacity: 1;
    transform: scale(1);
    
    /* Flex item covering remaining height */
    flex: 1;
    overflow-y: auto; /* Independent scrolling for pages */
    padding: 16px;
    -webkit-overflow-scrolling: touch; /* Smooth mobile scrolling */
}

/* Zoom Out Animation for exiting page */
.page-exit {
    opacity: 0;
    transform: scale(0.9) translateY(20px);
    pointer-events: none;
}

/* Zoom In Animation for entering page */
.page-enter {
    animation: zoomIn 0.4s forwards;
}

@keyframes zoomIn {
    from { opacity: 0; transform: scale(1.1); }
    to { opacity: 1; transform: scale(1); }
}

/* =========================================
   PAGE 1: SUBJECT SELECTION (पहले यह दिखेगा)
   ========================================= */
.hero-banner {
    background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
    color: white;
    padding: 30px 20px;
    border-radius: 16px;
    text-align: center;
    margin-bottom: 24px;
    box-shadow: 0 10px 20px rgba(108, 92, 231, 0.2);
}

/* Adding zoom animation to banner itself on load */
#subjectsPage .hero-banner {
    animation: bannerZoomIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

@keyframes bannerZoomIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
}

.hero-title { font-size: 26px; font-weight: 800; margin-bottom: 4px; }
.hero-subtitle { font-size: 14px; opacity: 0.9; }

.section-header {
    font-size: 16px; font-weight: 700;
    color: var(--text-main);
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
}

.subjects-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.subject-item {
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 18px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: var(--transition);
    box-shadow: var(--shadow-sm);
}

.subject-item:hover {
    border-color: var(--primary);
    transform: translateY(-3px) scale(1.01);
    box-shadow: var(--shadow-md);
}

.sub-info { display: flex; align-items: center; gap: 14px; }
.sub-icon {
    width: 45px; height: 45px;
    background: var(--primary-light);
    color: var(--primary);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
}

.sub-name { font-size: 16px; font-weight: 600; color: var(--text-main); }
.sub-count { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

.go-icon { color: var(--text-muted); font-size: 18px; transition: var(--transition); }
.subject-item:hover .go-icon { color: var(--primary); transform: translateX(3px); }

/* =========================================
   PAGE 2: LECTURE PLAYER (विषय क्लिक पर दिखेगा)
   ========================================= */
.content-layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    max-width: 1400px; margin: 0 auto;
}

@media (min-width: 992px) {
    .content-layout { grid-template-columns: 2fr 1fr; }
}

/* VIDEO AREA */
.video-main { display: flex; flex-direction: column; gap: 16px; }

.video-frame-container {
    width: 100%; aspect-ratio: 16/9;
    background: #000;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border);
}

.video-frame-container iframe { width: 100%; height: 100%; border: 0; }

.video-details-card {
    background: var(--bg-card);
    padding: 20px;
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
}

.v-title { font-size: 18px; font-weight: 700; color: var(--text-main); line-height: 1.4; }
.v-meta { font-size: 13px; color: var(--text-muted); margin: 6px 0 16px 0; display: flex; gap: 10px; }

/* ACTION BUTTONS */
.actions-row {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding-top: 16px; border-top: 1px solid var(--border);
}

.act-btn {
    flex: 1; min-width: 100px;
    background: var(--bg-app);
    color: var(--text-main);
    border: 1px solid var(--border);
    padding: 10px;
    border-radius: 8px;
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: var(--transition);
}

.act-btn:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
.act-btn.liked { color: #ef4444; background: #fef2f2; border-color: #fecaca; }

/* PLAYLIST AREA */
.playlist-card {
    background: var(--bg-card);
    border-radius: 16px;
    border: 1px solid var(--border);
    padding: 16px;
    display: flex; flex-direction: column;
    box-shadow: var(--shadow-sm);
    height: fit-content;
}

@media (min-width: 992px) {
    /* Sticky playlist on desktop */
    .playlist-card { position: sticky; top: 16px; max-height: calc(100vh - 96px); }
}

.pl-header {
    font-size: 15px; font-weight: 700;
    padding-bottom: 12px; margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
}

.pl-list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
/* Scrollbar styling */
.pl-list::-webkit-scrollbar { width: 4px; }
.pl-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* LECTURE ITEM (Thumb Left, Title Right) */
.lec-item {
    display: flex; gap: 12px;
    padding: 8px;
    border-radius: 10px;
    cursor: pointer;
    transition: var(--transition);
    border: 1px solid transparent;
}

.lec-item:hover { background: var(--bg-app); }
.lec-item.active {
    background: var(--primary-light);
    border-color: var(--primary);
}

.lec-thumb {
    width: 100px; height: 60px;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
    background: #000;
}

.lec-thumb img { width: 100%; height: 100%; object-fit: cover; transition: var(--transition); }
.lec-item:hover .lec-thumb img { transform: scale(1.05); }

.play-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(108, 92, 231, 0.6);
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 16px;
    opacity: 0; transition: var(--transition);
}

.lec-item.active .play-overlay, .lec-item:hover .play-overlay { opacity: 1; }

.lec-details { display: flex; flex-direction: column; justify-content: center; flex: 1; }
.lec-title {
    font-size: 13px; font-weight: 600; color: var(--text-main);
    line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

.lec-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; display: flex; align-items: center; gap: 4px; }

/* --- EXTRA SECTIONS (COMMENTS, RATING) --- */
.extra-card { background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border); padding: 20px; margin-top: 16px; box-shadow: var(--shadow-sm); }
.comment-input-grp { display: flex; gap: 10px; margin: 15px 0; }
.comment-input-grp input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-app); color: var(--text-main); outline: none; }
.comment-input-grp input:focus { border-color: var(--primary); }

.star-rating { display: flex; gap: 6px; color: #f59e0b; font-size: 20px; cursor: pointer; margin-top: 8px; }
</style>
</head>
<body>

<!-- TOP NAVIGATION BAR (Fixed for both pages) -->
<header class="topbar">
    <!-- Back Button (initially hidden, visible on Lecture page) -->
    <div class="back-btn hidden" id="globalBackBtn" onclick="handleNavigationBack()">
        <i class="fa-solid fa-arrow-left"></i>
    </div>
    
    <div class="logo">
        <i class="fa-solid fa-graduation-cap"></i>
        Civil <span>Engineers</span>
    </div>
    
    <div style="font-size: 11px; font-weight: 600; color: white; background: var(--primary); padding: 3px 8px; border-radius: 10px;">JE Special</div>
</header>

<!-- =========================================
     PAGE 1: SUBJECTS PAGE (VISIBLE BY DEFAULT)
     ========================================= -->
<main class="page-container" id="subjectsPage">
    
    <div class="hero-banner">
        <div class="hero-title">Ashoka Batch</div>
        <div class="hero-subtitle">Complete Civil Engineering JE/AE Learning Portal</div>
    </div>

    <div class="section-header">
        <i class="fa-solid fa-book-bookmark" style="color: var(--primary);"></i>
        Select Subject (विषय चुनें)
    </div>

    <div class="subjects-list" id="subjectsListContainer">
        <!-- Dynamic Subjects will be loaded here by JS -->
    </div>

</main>


<!-- =========================================
     PAGE 2: LECTURE PLAYER PAGE (HIDDEN BY DEFAULT)
     ========================================= -->
<main class="page-container hidden" id="lecturePage">
    
    <div class="content-layout">
        
        <!-- LEFT COLUMN: VIDEO PLAYER & DETAILS -->
        <div class="video-main">
            
            <!-- Player Wrapper -->
            <div class="video-frame-container">
                <iframe id="mainVideoPlayer" 
                    src="" 
                    allow="autoplay; fullscreen; encrypted-media; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>

            <!-- Video Info Card -->
            <div class="video-details-card">
                <h1 class="v-title" id="currentVideoTitle">Loading...</h1>
                <div class="v-meta">
                    <span id="currentSubjectTag"><i class="fa-solid fa-tag"></i> Subject</span>
                    <span><i class="fa-regular fa-user"></i> Ashoka Batch</span>
                </div>

                <!-- Professional Action Buttons -->
                <div class="actions-row">
                    <button class="act-btn" id="likeBtn" onclick="handleLike()">
                        <i class="fa-regular fa-thumbs-up"></i>
                        <span id="likeCount">1.2K</span> Likes
                    </button>
                    <button class="act-btn" onclick="scrollToExtras()">
                        <i class="fa-regular fa-comment"></i> Doubt
                    </button>
                    <button class="act-btn" onclick="scrollToExtras()">
                        <i class="fa-regular fa-star"></i> Rate
                    </button>
                    <button class="act-btn" onclick="handleDownload()">
                        <i class="fa-solid fa-file-pdf"></i> Notes
                    </button>
                    <button class="act-btn" onclick="handleShare()">
                        <i class="fa-solid fa-share-nodes"></i> Share
                    </button>
                </div>
            </div>

            <!-- COMMENTS & RATING SECTIONS -->
            <div class="extra-card" id="extrasSection">
                <div class="section-header"><i class="fa-solid fa-star" style="color: #f59e0b;"></i> Rate this Lecture</div>
                <div class="star-rating">
                    <i class="fa-regular fa-star" onclick="handleRating(1)"></i>
                    <i class="fa-regular fa-star" onclick="handleRating(2)"></i>
                    <i class="fa-regular fa-star" onclick="handleRating(3)"></i>
                    <i class="fa-regular fa-star" onclick="handleRating(4)"></i>
                    <i class="fa-regular fa-star" onclick="handleRating(5)"></i>
                </div>

                <div class="section-header" style="margin-top:25px;"><i class="fa-solid fa-comments"></i> Discussion & Doubts</div>
                <div class="comment-input-grp">
                    <input type="text" id="commentInput" placeholder="Ask sir a question...">
                    <button class="act-btn" style="background:var(--primary); color:white; flex:none; width:70px;" onclick="addComment()">Post</button>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN: PLAYLIST -->
        <aside class="playlist-card">
            <div class="pl-header">
                <span id="playlistHeaderSubject">Subject Playlist</span>
                <span style="color:var(--primary); font-size:12px; font-weight: 600;" id="plCount">0 Videos</span>
            </div>
            
            <div class="pl-list" id="playlistContainer">
                <!-- Dynamic Playlist Items loaded here by JS -->
            </div>
        </aside>

    </div>

</main>


<script>
/* =========================================
   DATA ARCHITECTURE (MOCK DATA)
   ========================================= */
const cloudName = "h7g2sxct";
// Demovideo ID for demonstration.
const demoVideoId = "VID_20260812_101229_651"; 

const courseData = {
    "Building Materials": {
        icon: "fa-trowel-bricks",
        videos: [
            { id: demoVideoId, title: "BMC 14 : Rock and Stone Complete Concept", duration: "1h 15m", thumb: "https://images.unsplash.com/photo-1590050856218-c0b7e1975e53?w=300&q=80" },
            { id: demoVideoId, title: "BMC 15 : Bricks Manufacturing JE Special", duration: "55m 20s", thumb: "https://images.unsplash.com/photo-1590050856218-c0b7e1975e53?w=300&q=80" },
            { id: demoVideoId, title: "BMC 16 : Cement IS Codes & Properties", duration: "1h 02m", thumb: "https://images.unsplash.com/photo-1590050856218-c0b7e1975e53?w=300&q=80" },
            { id: demoVideoId, title: "BMC 17 : Concrete Mix Design", duration: "1h 10m", thumb: "https://images.unsplash.com/photo-1590050856218-c0b7e1975e53?w=300&q=80" }
        ]
    },
    "Soil Mechanics": {
        icon: "fa-mountain",
        videos: [
            { id: demoVideoId, title: "Soil 01 : Properties & Phase System", duration: "1h 20m", thumb: "https://images.unsplash.com/photo-1581093196867-9f4c3e87364b?w=300&q=80" },
            { id: demoVideoId, title: "Soil 02 : Classification & Permeability", duration: "58m 10s", thumb: "https://images.unsplash.com/photo-1581093196867-9f4c3e87364b?w=300&q=80" }
        ]
    },
    "Surveying": {
        icon: "fa-compass-drafting",
        videos: [
            { id: demoVideoId, title: "Survey 01 : Fundamental Principles", duration: "45m 30s", thumb: "https://images.unsplash.com/photo-1581092162384-8987c1d64718?w=300&q=80" }
        ]
    },
    "Fluid Mechanics": {
        icon: "fa-droplet",
        videos: [
            { id: demoVideoId, title: "FM 01 : Fluid Properties - Density & Viscosity", duration: "1h 10m", thumb: "https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=300&q=80" }
        ]
    }
};

/* =========================================
   APP APP STATE & DOM ELEMENTS
   ========================================= */
const subjectsPage = document.getElementById('subjectsPage');
const lecturePage = document.getElementById('lecturePage');
const backBtn = document.getElementById('globalBackBtn');
const videoPlayer = document.getElementById('mainVideoPlayer');

let currentSubjectName = "";
let isLiked = false;

/* =========================================
   INITIALIZATION
   ========================================= */
window.onload = function() {
    renderSubjectsMenu();
    // Initialize history state on load
    history.replaceState({page: 'subjects'}, 'Ashoka Batch', '');
};

/* =========================================
   MOBILE BACK BUTTON INTEGRATION (CORE FIX)
   ========================================= */

// Intercept browser back button event
window.onpopstate = function(event) {
    if (event.state && event.state.page === 'subjects') {
        // State is subjects, so we should be on subjects page
        performTransitionToSubjects();
    } else if (event.state && event.state.page === 'lecture') {
        // State is lecture (occurs if user goes 'forward' after back)
        if(event.state.subject) {
            performTransitionToLecture(event.state.subject, false); // false = don't push state again
        }
    }
};

/* =========================================
   PROFESSIONAL APP NAVIGATION
   ========================================= */

// 1. Render main Subject menu
function renderSubjectsMenu() {
    const container = document.getElementById('subjectsListContainer');
    container.innerHTML = "";

    Object.keys(courseData).forEach(subjectName => {
        const data = courseData[subjectName];
        const videoCount = data.videos.length;

        const item = document.createElement('div');
        item.className = "subject-item";
        item.onclick = () => {
            // Action 1: Handle State for Back Button support
            history.pushState({page: 'lecture', subject: subjectName}, subjectName, '#' + subjectName.replace(/\s+/g, '-'));
            // Action 2: Perform the view change
            performTransitionToLecture(subjectName, true); 
        };

        item.innerHTML = `
            <div class="sub-info">
                <div class="sub-icon"><i class="fa-solid ${data.icon}"></i></div>
                <div>
                    <div class="sub-name">${subjectName}</div>
                    <div class="sub-count">${videoCount} Lectures</div>
                </div>
            </div>
            <i class="fa-solid fa-chevron-right go-icon"></i>
        `;
        container.appendChild(item);
    });
}

// 2. Navigation Action: Global Header Back Button Click
function handleNavigationBack() {
    // Mimic device back button press to trigger popstate
    history.back();
}

// 3. INTERNAL: View Transition logic from Subjects -> Lecture
function performTransitionToLecture(subjectName, shouldLoadVideo) {
    currentSubjectName = subjectName;
    
    // Setup Page 2 Content before showing
    loadPlaylist(subjectName, shouldLoadVideo);
    document.getElementById('currentSubjectTag').innerHTML = `<i class="fa-solid fa-tag"></i> ${subjectName}`;
    document.getElementById('playlistHeaderSubject').innerText = subjectName;
    
    // Professional Transition: Zoom Out Page 1
    subjectsPage.classList.add('page-exit');
    
    // After animation ends, hide Page 1, show Page 2 with Zoom In
    setTimeout(() => {
        subjectsPage.classList.add('hidden');
        subjectsPage.classList.remove('page-exit'); // reset for future use
        
        lecturePage.classList.remove('hidden');
        lecturePage.classList.add('page-enter'); // trigger zoom in
        backBtn.classList.remove('hidden'); // show topbar back button
        
        // Remove animation class after it finishes
        setTimeout(() => lecturePage.classList.remove('page-enter'), 400);
    }, 300);
}

// 4. INTERNAL: View Transition logic from Lecture -> Subjects
function performTransitionToSubjects() {
    // Professional Transition: Zoom Out Page 2
    lecturePage.classList.add('page-exit');
    
    // Stop video playback immediately
    videoPlayer.src = "";

    setTimeout(() => {
        lecturePage.classList.add('hidden');
        lecturePage.classList.remove('page-exit');
        backBtn.classList.add('hidden'); // hide topbar back button
        
        subjectsPage.classList.remove('hidden');
        subjectsPage.classList.add('page-enter'); // Zoom in subjects
        
        setTimeout(() => subjectsPage.classList.remove('page-enter'), 400);
    }, 300);
}

/* =========================================
   LECTURE PAGE LOGIC (PLAYLIST & PLAYER)
   ========================================= */

// 1. Load the Playlist sidebar
function loadPlaylist(subjectName, loadFirstVideo) {
    const container = document.getElementById('playlistContainer');
    container.innerHTML = "";
    const videos = courseData[subjectName].videos;
    
    document.getElementById('plCount').innerText = `${videos.length} Videos`;

    videos.forEach((video, index) => {
        const item = document.createElement('div');
        item.className = `lec-item ${index === 0 && loadFirstVideo ? 'active' : ''}`;
        item.onclick = () => playVideo(video, item);

        item.innerHTML = `
            <div class="lec-thumb">
                <img src="${video.thumb}" alt="thumb">
                <div class="play-overlay"><i class="fa-solid fa-play"></i></div>
            </div>
            <div class="lec-details">
                <div class="lec-title">${video.title}</div>
                <div class="lec-meta">
                    <i class="fa-regular fa-circle-play"></i> ${video.duration}
                </div>
            </div>
        `;
        container.appendChild(item);
    });

    // Play first video automatically if transitioning from Subject Page
    if (videos.length > 0 && loadFirstVideo) {
        playVideo(videos[0], container.children[0]);
    } else if (videos.length > 0 && !loadFirstVideo) {
        // Just load the title if coming back via forward state
        document.getElementById('currentVideoTitle').innerText = videos[0].title;
    }
}

// 2. Play selected video in Cloudinary player
function playVideo(video, element) {
    const newSrc = `https://player.cloudinary.com/embed/?cloud_name=${cloudName}&public_id=${video.id}&autoplay=true`;
    if(videoPlayer.src !== newSrc) {
        videoPlayer.src = newSrc;
    }

    // Update Text Details
    document.getElementById('currentVideoTitle').innerText = video.title;

    // Manage Active State in Playlist
    document.querySelectorAll('.lec-item').forEach(el => el.classList.remove('active'));
    if(element) element.classList.add('active');
    
    // Smooth scroll to top on mobile to see player
    if(window.innerWidth < 992) {
        lecturePage.scrollTo({top: 0, behavior: 'smooth'});
    }
}

/* =========================================
   INTERACTIVE BUTTONS LOGIC
   ========================================= */

function handleLike() {
    const btn = document.getElementById('likeBtn');
    const countSpan = document.getElementById('likeCount');
    
    if (!isLiked) {
        countSpan.innerText = "1.3K";
        btn.classList.add('liked');
        btn.querySelector('i').className = "fa-solid fa-thumbs-up";
        isLiked = true;
    } else {
        countSpan.innerText = "1.2K"; 
        btn.classList.remove('liked');
        btn.querySelector('i').className = "fa-regular fa-thumbs-up";
        isLiked = false;
    }
}

function scrollToExtras() {
    document.getElementById('extrasSection').scrollIntoView({ behavior: 'smooth' });
}

function handleRating(stars) {
    const icons = document.getElementById('extrasSection').querySelectorAll('.star-rating i');
    icons.forEach((icon, index) => {
        icon.className = index < stars ? "fa-solid fa-star" : "fa-regular fa-star";
    });
    alert(`Rated ${stars} Stars!`);
}

function addComment() {
    const input = document.getElementById('commentInput');
    if(input.value.trim() !== "") {
        alert("Question posted.");
        input.value = "";
    }
}

function handleDownload() {
    alert("Downloading PDF Lecture Notes...");
}

function handleShare() {
    if (navigator.share) {
        navigator.share({
            title: document.getElementById('currentVideoTitle').innerText,
            url: window.location.href,
        }).catch(console.error);
    } else {
        alert("Link copied!");
    }
}
</script>

</body>
</html>
