<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Civil Engineering Study Library App</title>

<!-- Google Fonts & Font Awesome Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --secondary: #0f172a;
  --accent: #f97316;
  --whatsapp: #25d366;
  --whatsapp-hover: #1ebd59;
  --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #e0e8ff 50%, #f5f3ff 100%);
  --card-bg: #ffffff;
  --text-dark: #0f172a;
  --text-muted: #64748b;
  --border-color: #e2e8f0;
  --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
  --shadow-hover: 0 20px 30px -5px rgba(37, 99, 235, 0.15);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Plus Jakarta Sans', sans-serif;
  scroll-behavior: smooth;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text-dark);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

/* =====================================================
MAIN SECTION STYLES
===================================================== */

.main-section {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  display: flex;
  justify-content: center;
  align-items: center;
}

.admit-card-box {
  background: var(--card-bg);
  border-radius: 24px;
  padding: 40px 30px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border-color);
  text-align: center;
  width: 100%;
  position: relative;
  overflow: hidden;
  animation: fadeIn 0.4s ease-in-out forwards;
}

.admit-card-box::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 6px;
  background: linear-gradient(90deg, var(--primary), #06b6d4);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.icon-box {
  width: 70px;
  height: 70px;
  background: #eff6ff;
  color: var(--primary);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
  font-size: 28px;
  box-shadow: 0 8px 20px rgba(37, 99, 235, 0.15);
  transition: transform 0.3s ease;
}

.admit-card-box:hover .icon-box {
  transform: scale(1.08) rotate(10deg);
}

.admit-card-box h2 {
  font-size: 24px;
  font-weight: 800;
  color: var(--secondary);
  margin-bottom: 12px;
  letter-spacing: -0.5px;
}

.admit-card-box p {
  color: var(--text-muted);
  font-size: 15px;
  line-height: 1.6;
  margin-bottom: 24px;
}

.coming-soon-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #fff7ed;
  color: var(--accent);
  padding: 8px 18px;
  border-radius: 50px;
  font-weight: 700;
  font-size: 13.5px;
  border: 1px solid #ffedd5;
  margin-bottom: 24px;
}

.info-box {
  background: #f8fafc;
  border: 1px solid var(--border-color);
  color: var(--text-dark);
  padding: 14px 18px;
  border-radius: 14px;
  font-size: 13.5px;
  font-weight: 500;
  line-height: 1.5;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 10px;
}

@media (max-width: 480px) {
  .admit-card-box {
    padding: 30px 20px;
  }
  .admit-card-box h2 {
    font-size: 21px;
  }
  .admit-card-box p {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<!-- =====================================================
MAIN
===================================================== -->

<section class="main-section">

  <div class="admit-card-box">

    <div class="icon-box">
      <i class="fa-solid fa-rocket"></i>
    </div>

    <h2>Civil Engineering Study Library</h2>

    <p>
      Your ultimate platform for diploma study materials, notes, and resources is under development.
    </p>

    <div class="coming-soon-badge">
      <i class="fa-solid fa-clock"></i> Coming Soon
    </div>

    <div class="info-box">
      📌 We are working hard to launch the app feature very soon. Stay tuned for updates!
    </div>

  </div>

</section>

</body>
</html>
