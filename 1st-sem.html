<style>

/* =====================================================
GLOBAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f4f7fb;
    padding-top:20px;
    color:#222;
}

/* =====================================================
MAIN SECTION
===================================================== */

.section{
    width:92%;
    max-width:1300px;
    margin:40px auto;
}

.section h2{
    text-align:center;
    font-size:34px;
    font-weight:700;
    color:#0f172a;
    margin-bottom:35px;
    position:relative;
}

.section h2::after{
    content:"";
    width:80px;
    height:4px;
    background:linear-gradient(90deg,#2563eb,#06b6d4);
    display:block;
    margin:12px auto 0;
    border-radius:10px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.card{
    background:#fff;
    border-radius:22px;
    padding:28px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    border:1px solid #e5e7eb;
    transition:.35s;
    position:relative;
    overflow:hidden;
}

.card::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:5px;
    background:linear-gradient(90deg,#2563eb,#06b6d4);
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 20px 40px rgba(37,99,235,.18);
}

.card i{
    width:80px;
    height:80px;
    line-height:80px;
    background:#eff6ff;
    color:#2563eb;
    border-radius:50%;
    font-size:32px;
    margin-bottom:18px;
    transition:.3s;
}

.card:hover i{
    background:#2563eb;
    color:#fff;
    transform:rotate(10deg) scale(1.1);
}

.card h3{
    font-size:22px;
    font-weight:700;
    margin-bottom:20px;
    color:#0f172a;
}

.btn{
    display:block;
    margin:10px 0;
    padding:13px;
    text-decoration:none;
    border-radius:12px;
    background:#f8fafc;
    border:1px solid #dbeafe;
    color:#2563eb;
    font-weight:600;
    transition:.3s;
}

.btn:hover{
    background:linear-gradient(135deg,#2563eb,#3b82f6);
    color:#fff;
    border-color:#2563eb;
    transform:scale(1.03);
    box-shadow:0 8px 20px rgba(37,99,235,.25);
}

@media(max-width:768px){

.section{
    width:94%;
    margin:20px auto;
}

.section h2{
    font-size:28px;
}

.grid{
    grid-template-columns:1fr;
    gap:20px;
}

.card{
    padding:22px;
    border-radius:18px;
}

.card h3{
    font-size:20px;
}

.card i{
    width:70px;
    height:70px;
    line-height:70px;
    font-size:28px;
}

.btn{
    padding:12px;
    font-size:14px;
}

}

</style>

</head>

<body>

===================================================== -->
