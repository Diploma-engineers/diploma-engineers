<html lang="en">

<style>
:root{
  --blue:#2563eb;--dark:#0f172a;--text:#334155;--muted:#64748b;
  --border:#e2e8f0;--bg:#f8fafc;--white:#fff;
  --shadow:0 10px 28px rgba(15,23,42,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;min-height:0;background:transparent!important;
  font-family:"Plus Jakarta Sans",sans-serif;color:var(--text);overflow-x:hidden;
}
body.reader-open{overflow:hidden}
button,textarea{font:inherit}button{cursor:pointer}
.books-wrap{width:100%;padding:0;margin:0}
.books-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.books-title{font-size:16px;font-weight:800;color:var(--dark)}
.books-title span{color:var(--blue)}
.books-subtitle{font-size:9px;font-weight:700;color:var(--muted)}

.books-grid{
  width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;
}
.book-card{
  min-width:0;overflow:hidden;background:#fff;border:1px solid var(--border);
  border-radius:15px;box-shadow:var(--shadow);cursor:pointer;
}
.book-cover{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;background:#eef2ff}
.book-cover canvas{width:100%;height:100%;display:block;background:#fff}
.cover-loader{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:#eff6ff;color:var(--blue);font-size:9px;font-weight:800;z-index:3;
}
.cover-fallback{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  padding:14px;text-align:center;background:linear-gradient(135deg,#dbeafe,#eff6ff);
  color:#1e40af;font-weight:800;font-size:12px;z-index:2;
}
.book-shade{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(2,6,23,.84),rgba(2,6,23,.05) 72%,transparent);
}
.book-content{position:absolute;left:8px;right:8px;bottom:8px;z-index:4}
.book-name{font-size:10px;line-height:1.35;color:#fff;font-weight:800;margin-bottom:5px}
.open-pill{
  display:inline-flex;align-items:center;gap:5px;color:#fff;background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 7px;font-size:8px;font-weight:800;
}
.book-meta{padding:8px 9px}
.book-meta-line{display:flex;align-items:center;justify-content:space-between;gap:6px}
.book-type{font-size:8px;font-weight:700;color:var(--muted)}
.book-page{font-size:8px;font-weight:800;color:#1d4ed8;background:#eff6ff;border:1px solid #bfdbfe;border-radius:999px;padding:4px 6px}

/* Reader */
.reader{position:fixed;inset:0;z-index:99999;display:none;flex-direction:column;background:#111827}
.reader.active{display:flex}
.reader-top{
  height:58px;flex:0 0 58px;display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:#fff;border-bottom:1px solid var(--border)
}
.icon-btn{
  width:38px;height:38px;flex:0 0 38px;border:1px solid var(--border);border-radius:50%;
  background:#f8fafc;color:var(--dark);display:flex;align-items:center;justify-content:center
}
.reader-title{flex:1;min-width:0}
.reader-title strong{display:block;font-size:12px;color:var(--dark);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader-title small{display:block;font-size:8px;color:var(--muted);margin-top:2px}

.reader-main{flex:1;min-height:0;display:flex;overflow:hidden;background:#525252}
.pdf-pane{flex:1;min-width:0;overflow:auto;padding:8px}
.pdf-page{display:block;max-width:100%;height:auto;margin:0 auto 10px;background:#fff;box-shadow:0 7px 20px rgba(0,0,0,.25)}

.side-panel{
  width:350px;flex:0 0 350px;background:#fff;border-left:1px solid var(--border);
  overflow:auto;padding:14px;
}
.book-info{padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--border)}
.book-info h2{font-size:15px;color:var(--dark);margin-bottom:4px}
.book-info p{font-size:10px;line-height:1.5;color:var(--muted)}

.engagement{display:flex;gap:7px;margin-bottom:12px}
.engage-btn{
  flex:1;height:40px;border:1px solid var(--border);border-radius:11px;background:#fff;
  color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px;
  font-size:10px;font-weight:800;
}
.engage-btn.active.like{color:#2563eb;background:#eff6ff;border-color:#bfdbfe}
.engage-btn.active.save{color:#16a34a;background:#f0fdf4;border-color:#bbf7d0}

.login-note{
  display:none;margin-bottom:10px;padding:10px;border-radius:11px;
  background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;font-size:9px;font-weight:700;line-height:1.5;
}
.comment-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.comment-head h3{font-size:12px;color:var(--dark)}
.comment-count{font-size:8px;color:var(--muted);font-weight:700}

.comment-form{display:flex;gap:7px;align-items:flex-end;margin-bottom:12px}
.comment-avatar{
  width:32px;height:32px;flex:0 0 32px;border-radius:50%;overflow:hidden;
  display:flex;align-items:center;justify-content:center;background:#eff6ff;color:var(--blue);
  border:1px solid #dbeafe
}
.comment-avatar img{width:100%;height:100%;object-fit:cover}
.comment-input-wrap{flex:1;min-width:0}
.comment-input{
  width:100%;min-height:38px;max-height:100px;resize:vertical;
  border:1px solid var(--border);border-radius:10px;padding:9px;font-size:10px;
  outline:none;background:#f8fafc;color:var(--dark)
}
.comment-input:focus{border-color:#93c5fd;background:#fff}
.comment-submit{
  width:38px;height:38px;border:0;border-radius:10px;background:var(--blue);color:#fff
}
.comment-submit:disabled{opacity:.55}

.comments{display:flex;flex-direction:column;gap:10px}
.comment{display:flex;gap:7px}
.comment-body{flex:1;min-width:0;background:#f8fafc;border:1px solid #eef2f7;border-radius:11px;padding:8px}
.comment-top{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:3px}
.comment-name{font-size:9px;color:var(--dark);font-weight:800}
.comment-date{font-size:7px;color:#94a3b8;white-space:nowrap}
.comment-text{font-size:9px;line-height:1.5;color:var(--text);white-space:pre-wrap;word-break:break-word}
.empty-comments{text-align:center;padding:18px 8px;font-size:9px;color:var(--muted)}

.reader-status{
  min-height:42px;flex:0 0 42px;background:#fff;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:9px;font-weight:700
}

@media(max-width:900px){
  .reader-main{flex-direction:column;overflow:auto}
  .pdf-pane{flex:0 0 55vh;min-height:250px}
  .side-panel{width:100%;flex:0 0 auto;border-left:0;border-top:1px solid var(--border)}
}
@media(max-width:420px){
  .books-grid{gap:8px}.book-name{font-size:9px}.book-meta{padding:7px 8px}.side-panel{padding:11px}
}
</style>
</head>

<body>

<div class="books-wrap">
  <div class="books-head">
    <div class="books-title">Books <span>Library</span></div>
    <div class="books-subtitle">2 books per row</div>
  </div>
  <div class="books-grid" id="booksGrid"></div>
</div>

<section class="reader" id="reader" aria-hidden="true">

  <div class="reader-top">
    <button class="icon-btn" id="readerBack" aria-label="Back">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="reader-title">
      <strong id="readerTitle">Book</strong>
      <small>Diploma Engineers • Online Reader</small>
    </div>

    <button class="icon-btn" id="readerClose" aria-label="Close">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <div class="reader-main">

    <div class="pdf-pane" id="pdfPane"></div>

    <aside class="side-panel">

      <div class="book-info">
        <h2 id="sideBookTitle">Book</h2>
        <p>Read the book online and interact with other students.</p>
      </div>

      <div class="engagement">
        <button class="engage-btn like" id="likeBtn">
          <i class="fa-solid fa-thumbs-up"></i>
          <span>Like</span>
          <b id="likeCount">0</b>
        </button>

        <button class="engage-btn save" id="saveBtn">
          <i class="fa-solid fa-bookmark"></i>
          <span>Save</span>
          <b id="saveCount">0</b>
        </button>
      </div>

      <div class="login-note" id="loginNote"></div>

      <div class="comment-head">
        <h3>Comments</h3>
        <span class="comment-count" id="commentCount">0 comments</span>
      </div>

      <form class="comment-form" id="commentForm">

        <div class="comment-avatar" id="commentUserAvatar">
          <i class="fa-solid fa-user"></i>
        </div>

        <div class="comment-input-wrap">
          <textarea
            class="comment-input"
            id="commentInput"
            maxlength="500"
            placeholder="Write a comment..."
          ></textarea>
        </div>

        <button class="comment-submit" id="commentSubmit" type="submit">
          <i class="fa-solid fa-paper-plane"></i>
        </button>

      </form>

      <div class="comments" id="commentsList"></div>

    </aside>

  </div>

  <div class="reader-status" id="readerStatus">Ready</div>
</section>

<script>
/* ==========================================================
   IMPORTANT:
   This page is safe to FETCH into the app because it uses
   classic scripts instead of JavaScript modules.
   ========================================================== */

/* PDF.js */
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

/* Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyCxe9H7zSxJQzgM8bN_UAdOnDHr5myH6CQ",
  authDomain: "diploma-app-9a378.firebaseapp.com",
  databaseURL: "https://diploma-app-9a378-default-rtdb.firebaseio.com",
  projectId: "diploma-app-9a378",
  storageBucket: "diploma-app-9a378.firebasestorage.app",
  messagingSenderId: "160233059797",
  appId: "1:160233059797:web:be38130ed64f8bd0afb95c"
};

let firebaseReady=false;
let auth=null;
let db=null;
let currentUser=null;

try{
  if(!firebase.apps.length){
    firebase.initializeApp(firebaseConfig);
  }

  auth=firebase.auth();
  db=firebase.database();
  firebaseReady=true;
}catch(error){
  console.warn("Firebase is unavailable. Book reader will still work:",error);
}


/* ==========================================================
   BOOKS:
   Only PDF link + name needed.
   First PDF page becomes thumbnail automatically.
   ========================================================== */

const BOOKS = [
  {
    name:"Applied Physics 2nd",
    pdf:"https://anubhavfinance.wordpress.com/wp-content/uploads/2026/05/mathematics-ii_75660889_2026_05_09_15_4128129.pdf"
  },
  {
    name:"Applied Mathematics 2nd",
    pdf:"https://anubhavfinance.wordpress.com/wp-content/uploads/2026/05/appliedphysics-iie-bookbydiplomaengineers28129-2.pdf"
  },
  {
    name:"Engineering Mechanics",
    pdf:"https://anubhavfinance.wordpress.com/wp-content/uploads/2026/05/engineeringmechanicse-bookbydiplomaengineers.pdf"
  },
  {
    name:"Design Of Steel Structures",
    pdf:"https://anubhavfinance.wordpress.com/wp-content/uploads/2024/11/desigen-of-steei-structure33.pdf"
  }
];


/* DOM */
const grid=document.getElementById("booksGrid");
const reader=document.getElementById("reader");
const readerTitle=document.getElementById("readerTitle");
const sideBookTitle=document.getElementById("sideBookTitle");
const pdfPane=document.getElementById("pdfPane");
const readerStatus=document.getElementById("readerStatus");

const likeBtn=document.getElementById("likeBtn");
const saveBtn=document.getElementById("saveBtn");
const likeCount=document.getElementById("likeCount");
const saveCount=document.getElementById("saveCount");

const loginNote=document.getElementById("loginNote");
const commentForm=document.getElementById("commentForm");
const commentInput=document.getElementById("commentInput");
const commentSubmit=document.getElementById("commentSubmit");
const commentsList=document.getElementById("commentsList");
const commentCount=document.getElementById("commentCount");
const commentUserAvatar=document.getElementById("commentUserAvatar");

let currentBook=null;
let currentBookId="";
let likeListener=null;
let saveListener=null;
let commentsListener=null;
let renderToken=0;


/* Helpers */
function escapeHTML(value){
  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function slugify(value){
  return String(value)
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"")
    .slice(0,70);
}

function dateText(value){
  if(!value)return"Just now";
  const d=new Date(Number(value));
  if(Number.isNaN(d.getTime()))return"Just now";
  return d.toLocaleDateString("en-IN",{
    day:"2-digit",month:"short",year:"numeric"
  });
}

function setStatus(text){
  readerStatus.textContent=text;
}


/* ==========================================================
   PROFILE
   ========================================================== */

function getProfileData(){
  try{
    if(window.parent && window.parent.currentUserData){
      return window.parent.currentUserData;
    }
  }catch(_){}
  return{};
}

function updateUserUI(){
  if(!currentUser){
    commentUserAvatar.innerHTML='<i class="fa-solid fa-user"></i>';
    loginNote.style.display="block";
    loginNote.textContent=
      "Login to Diploma Engineers to Like, Save and comment.";
    return;
  }

  loginNote.style.display="none";

  const profile=getProfileData();

  const name=
    profile.name ||
    currentUser.displayName ||
    "User";

  const photo=
    profile.profilePic ||
    currentUser.photoURL ||
    "";

  if(photo){
    commentUserAvatar.innerHTML=
      `<img src="${escapeHTML(photo)}" alt="User">`;
  }else{
    commentUserAvatar.innerHTML=
      `<span style="font-size:12px;font-weight:800">
        ${escapeHTML(name.charAt(0).toUpperCase())}
      </span>`;
  }
}


/* ==========================================================
   THUMBNAIL
   ========================================================== */

async function renderCover(book,canvas,loader,fallback){

  try{

    const task=pdfjsLib.getDocument({
      url:book.pdf,
      withCredentials:false,
      disableAutoFetch:false,
      disableStream:false
    });

    const pdf=await task.promise;
    const page=await pdf.getPage(1);

    const width=Math.max(160,canvas.parentElement.clientWidth);
    const base=page.getViewport({scale:1});
    const scale=width/base.width;
    const viewport=page.getViewport({scale:Math.max(.25,scale)});

    const ratio=Math.min(window.devicePixelRatio||1,2);

    canvas.width=Math.floor(viewport.width*ratio);
    canvas.height=Math.floor(viewport.height*ratio);

    canvas.style.width="100%";
    canvas.style.height="100%";

    await page.render({
      canvasContext:canvas.getContext("2d",{alpha:false}),
      viewport,
      transform:ratio!==1?[ratio,0,0,ratio,0,0]:null
    }).promise;

    loader.style.display="none";

  }catch(error){

    console.warn("Thumbnail PDF.js error:",book.name,error);

    loader.style.display="none";
    canvas.style.display="none";

    fallback.innerHTML = `
      <div style="
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:6px;
      ">
        <i class="fa-solid fa-file-pdf" style="font-size:24px"></i>
        <span>${escapeHTML(book.name)}</span>
      </div>
    `;

    fallback.style.display="flex";
  }
}


/* ==========================================================
   CARDS
   ========================================================== */

function renderCards(){

  grid.innerHTML="";

  BOOKS.forEach((book,index)=>{

    const card=document.createElement("article");
    card.className="book-card";

    card.innerHTML=`
      <div class="book-cover">

        <div class="cover-loader">
          <span>Loading cover…</span>
        </div>

        <div class="cover-fallback">
          ${escapeHTML(book.name)}
        </div>

        <canvas></canvas>

        <div class="book-shade"></div>

        <div class="book-content">
          <div class="book-name">
            ${escapeHTML(book.name)}
          </div>

          <span class="open-pill">
            <i class="fa-solid fa-book-open"></i>
            Open
          </span>
        </div>

      </div>

      <div class="book-meta">
        <div class="book-meta-line">
          <span class="book-type">PDF • Online Reader</span>
          <span class="book-page">Read</span>
        </div>
      </div>
    `;

    card.addEventListener("click",()=>{
      openBook(book,index);
    });

    grid.appendChild(card);

    renderCover(
      book,
      card.querySelector("canvas"),
      card.querySelector(".cover-loader"),
      card.querySelector(".cover-fallback")
    );

  });
}


/* ==========================================================
   FIREBASE BOOK DATA
   books/{bookId}/likes/{uid}
   books/{bookId}/saves/{uid}
   books/{bookId}/comments/{commentId}
   ========================================================== */

function detachListeners(){

  if(likeListener)likeListener.off();
  if(saveListener)saveListener.off();
  if(commentsListener)commentsListener.off();

  likeListener=null;
  saveListener=null;
  commentsListener=null;
}


function attachListeners(){

  detachListeners();

  if(!firebaseReady || !db || !currentBookId){
    showNoFirebase();
    return;
  }

  /* Likes */
  likeListener=db.ref(
    `books/${currentBookId}/likes`
  );

  likeListener.on("value",snapshot=>{

    const data=snapshot.val()||{};
    const count=Object.keys(data).length;

    likeCount.textContent=count;

    const liked=
      currentUser &&
      Object.prototype.hasOwnProperty.call(
        data,
        currentUser.uid
      );

    likeBtn.classList.toggle("active",!!liked);

  });


  /* Saves */
  saveListener=db.ref(
    `books/${currentBookId}/saves`
  );

  saveListener.on("value",snapshot=>{

    const data=snapshot.val()||{};
    const count=Object.keys(data).length;

    saveCount.textContent=count;

    const saved=
      currentUser &&
      Object.prototype.hasOwnProperty.call(
        data,
        currentUser.uid
      );

    saveBtn.classList.toggle("active",!!saved);

  });


  /* Comments */
  commentsListener=db.ref(
    `books/${currentBookId}/comments`
  );

  commentsListener.on("value",snapshot=>{

    commentsList.innerHTML="";

    if(!snapshot.exists()){

      commentCount.textContent="0 comments";

      commentsList.innerHTML=
        `<div class="empty-comments">
          No comments yet. Be the first to comment.
        </div>`;

      return;
    }

    const arr=[];

    snapshot.forEach(child=>{
      arr.push({
        id:child.key,
        ...(child.val()||{})
      });
    });

    arr.sort(
      (a,b)=>
        Number(b.createdAt||0)-
        Number(a.createdAt||0)
    );

    commentCount.textContent=
      `${arr.length} comment${arr.length===1?"":"s"}`;

    arr.forEach(comment=>{

      const div=document.createElement("div");
      div.className="comment";

      const avatar=
        comment.profilePic
          ? `<img src="${escapeHTML(comment.profilePic)}" alt="Profile">`
          : `<span style="font-size:10px;font-weight:800">
               ${escapeHTML(
                 String(comment.name||"U")
                 .charAt(0)
                 .toUpperCase()
               )}
             </span>`;

      div.innerHTML=`
        <div class="comment-avatar">
          ${avatar}
        </div>

        <div class="comment-body">

          <div class="comment-top">
            <span class="comment-name">
              ${escapeHTML(comment.name||"Diploma Engineer")}
            </span>

            <span class="comment-date">
              ${dateText(comment.createdAt)}
            </span>
          </div>

          <div class="comment-text">
            ${escapeHTML(comment.text||"")}
          </div>

        </div>
      `;

      commentsList.appendChild(div);

    });

  });

}


/* ==========================================================
   FIREBASE FALLBACK
   ========================================================== */

function showNoFirebase(){

  likeCount.textContent="0";
  saveCount.textContent="0";
  commentCount.textContent="0 comments";

  commentsList.innerHTML=
    `<div class="empty-comments">
      Login/Firebase connection is required for Like, Save and Comments.
    </div>`;
}


/* ==========================================================
   LIKE / SAVE
   ========================================================== */

likeBtn.addEventListener("click",async()=>{

  if(!currentUser){
    updateUserUI();
    return;
  }

  if(!firebaseReady)return;

  const path=
    db.ref(`books/${currentBookId}/likes/${currentUser.uid}`);

  try{

    const exists=likeBtn.classList.contains("active");

    if(exists){
      await path.remove();
    }else{
      await path.set(true);
    }

  }catch(error){
    console.error(error);
    alert("Like could not be updated.");
  }

});


saveBtn.addEventListener("click",async()=>{

  if(!currentUser){
    updateUserUI();
    return;
  }

  if(!firebaseReady)return;

  const path=
    db.ref(`books/${currentBookId}/saves/${currentUser.uid}`);

  try{

    const exists=saveBtn.classList.contains("active");

    if(exists){
      await path.remove();
    }else{
      await path.set(true);
    }

  }catch(error){
    console.error(error);
    alert("Save could not be updated.");
  }

});


/* ==========================================================
   COMMENTS
   ========================================================== */

commentForm.addEventListener("submit",async event=>{

  event.preventDefault();

  if(!currentUser){
    updateUserUI();
    return;
  }

  if(!firebaseReady || !currentBookId)return;

  const text=commentInput.value.trim();

  if(!text)return;

  commentSubmit.disabled=true;

  try{

    const profile=getProfileData();

    const item=
      db.ref(`books/${currentBookId}/comments`).push();

    await item.set({
      uid:currentUser.uid,
      name:
        profile.name ||
        currentUser.displayName ||
        "Diploma Engineer",
      profilePic:
        profile.profilePic ||
        currentUser.photoURL ||
        "",
      branch:profile.branch||"",
      text:text.slice(0,500),
      createdAt:firebase.database.ServerValue.TIMESTAMP
    });

    commentInput.value="";

  }catch(error){

    console.error(error);
    alert("Comment could not be saved.");

  }finally{

    commentSubmit.disabled=false;

  }

});


/* ==========================================================
   PDF READER
   ========================================================== */

async function renderPDF(url){

  const token=++renderToken;

  pdfPane.innerHTML=`
    <div style="
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:200px;
      color:#fff;
      font-size:10px;
      font-weight:800;
    ">
      Loading PDF…
    </div>
  `;

  setStatus("Loading PDF…");

  try{

    const task=pdfjsLib.getDocument({
      url:url,
      withCredentials:false,
      disableAutoFetch:false,
      disableStream:false
    });

    const pdf=await task.promise;

    if(token!==renderToken)return;

    pdfPane.innerHTML="";

    const width=Math.min(
      Math.max(270,pdfPane.clientWidth-16),
      900
    );

    for(
      let pageNo=1;
      pageNo<=pdf.numPages;
      pageNo++
    ){

      if(token!==renderToken)return;

      const page=await pdf.getPage(pageNo);

      const base=page.getViewport({scale:1});
      const scale=width/base.width;
      const viewport=page.getViewport({scale:Math.max(.2,scale)});

      const canvas=document.createElement("canvas");
      canvas.className="pdf-page";

      const ratio=Math.min(window.devicePixelRatio||1,2);

      canvas.width=Math.floor(viewport.width*ratio);
      canvas.height=Math.floor(viewport.height*ratio);
      canvas.style.width=Math.floor(viewport.width)+"px";
      canvas.style.height=Math.floor(viewport.height)+"px";

      pdfPane.appendChild(canvas);

      await page.render({
        canvasContext:canvas.getContext("2d",{alpha:false}),
        viewport,
        transform:ratio!==1?[ratio,0,0,ratio,0,0]:null
      }).promise;

    }

    setStatus(
      `${pdf.numPages} page${pdf.numPages===1?"":"s"} • Online reading`
    );

  }catch(error){

    console.error("PDF.js error:",error);

    /*
      IMPORTANT:
      WordPress / some public PDF hosts do not expose CORS headers.
      In that situation PDF.js cannot fetch the file directly.
      Use Google Docs Viewer as a remote rendering fallback.
      The original PDF URL is never changed.
    */
    const viewerUrl =
      "https://docs.google.com/gview?embedded=1&url=" +
      encodeURIComponent(url);

    pdfPane.innerHTML = `
      <div style="
        width:100%;
        min-height:100%;
        display:flex;
        flex-direction:column;
        background:#fff;
      ">
        <div style="
          flex:0 0 auto;
          padding:10px 12px;
          background:#eff6ff;
          border-bottom:1px solid #bfdbfe;
          color:#1e40af;
          font-size:10px;
          font-weight:800;
          line-height:1.5;
        ">
          PDF is being opened in a secure online viewer…
        </div>

        <iframe
          src="${escapeHTML(viewerUrl)}"
          title="Online PDF Viewer"
          style="
            width:100%;
            height:calc(100vh - 160px);
            min-height:420px;
            border:0;
            background:#fff;
          "
          loading="eager"
          referrerpolicy="no-referrer-when-downgrade"
          allow="fullscreen">
        </iframe>
      </div>
    `;

    setStatus("Online viewer");

  }

}


/* ==========================================================
   OPEN / CLOSE
   ========================================================== */

async function openBook(book,index){

  currentBook=book;
  currentBookId=
    slugify(book.name)||
    `book-${index}`;

  readerTitle.textContent=book.name;
  sideBookTitle.textContent=book.name;

  reader.classList.add("active");
  reader.setAttribute("aria-hidden","false");

  document.body.classList.add("reader-open");

  updateUserUI();
  attachListeners();

  history.pushState(
    {bookReader:true},
    "",
    "#book-"+encodeURIComponent(currentBookId)
  );

  await renderPDF(book.pdf);

}


function closeReader(fromHistory=false){

  renderToken++;

  detachListeners();

  currentBook=null;
  currentBookId="";

  reader.classList.remove("active");
  reader.setAttribute("aria-hidden","true");

  document.body.classList.remove("reader-open");

  pdfPane.innerHTML="";
  likeCount.textContent="0";
  saveCount.textContent="0";
  commentCount.textContent="0 comments";
  commentsList.innerHTML="";

  if(
    !fromHistory &&
    location.hash.startsWith("#book-")
  ){
    history.back();
  }

}


document.getElementById("readerBack")
  .addEventListener("click",()=>{
    closeReader(false);
  });

document.getElementById("readerClose")
  .addEventListener("click",()=>{
    closeReader(false);
  });

window.addEventListener("popstate",()=>{

  if(reader.classList.contains("active")){
    closeReader(true);
  }

});


document.addEventListener("keydown",event=>{

  if(!reader.classList.contains("active"))return;

  if(event.key==="Escape"){
    closeReader(false);
  }

  if(
    event.ctrlKey &&
    ["s","p","u"].includes(
      event.key.toLowerCase()
    )
  ){
    event.preventDefault();
    event.stopPropagation();
  }

});

document.addEventListener("contextmenu",event=>{
  if(reader.classList.contains("active")){
    event.preventDefault();
  }
});


/* ==========================================================
   FIREBASE AUTH
   ========================================================== */

if(firebaseReady){

  auth.onAuthStateChanged(user=>{

    currentUser=user;

    updateUserUI();

    if(currentBookId){
      attachListeners();
    }

  });

}else{

  updateUserUI();

}


/* First render */
renderCards();


/* Re-render PDF after mobile rotation */
window.addEventListener("resize",()=>{

  if(
    reader.classList.contains("active") &&
    currentBook
  ){

    clearTimeout(window.__bookResizeTimer);

    window.__bookResizeTimer=
      setTimeout(()=>{
        renderPDF(currentBook.pdf);
      },250);

  }

});

</script>
