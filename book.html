<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Books | Diploma Engineers</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{
  --blue:#2563eb;
  --dark:#0f172a;
  --text:#334155;
  --muted:#64748b;
  --border:#e2e8f0;
  --bg:#f8fafc;
  --red:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;
  background:var(--bg)!important;
  font-family:"Plus Jakarta Sans",sans-serif;
  color:var(--text);
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}
body.reader-open{overflow:hidden}
button,textarea{font:inherit}
button{cursor:pointer;border:none;background:none}
/* Same library/card design */
.books-wrap{width:100%;padding:15px}
.books-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;margin:0 0 15px;
}
.books-title{font-size:18px;font-weight:800;color:var(--dark)}
.books-title span{color:var(--blue)}
.books-subtitle{font-size:10px;font-weight:700;color:var(--muted)}
.books-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.book-card{
  min-width:0;overflow:hidden;background:#fff;
  border:1px solid var(--border);
  border-radius:15px;
  box-shadow:0 4px 12px rgba(15,23,42,.05);
  cursor:pointer;transition:transform .2s;
  -webkit-tap-highlight-color:transparent;
}
.book-card:active{transform:scale(.97)}
.book-cover{
  position:relative;width:100%;aspect-ratio:3/4;
  background:#eef2ff;overflow:hidden;
}
.book-thumb{
  position:absolute;inset:0;width:100%;height:100%;
  border:0;background:#fff;pointer-events:none;
  object-fit:contain;padding:25px;
}
.book-shade{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(2,6,23,.84),rgba(2,6,23,.03) 70%,transparent);
}
.book-label{
  position:absolute;left:10px;right:10px;bottom:10px;z-index:2;
  color:#fff;font-size:11px;font-weight:800;line-height:1.35;
  text-shadow:0 2px 8px rgba(0,0,0,.5);
}
.open-pill{
  display:inline-flex;align-items:center;gap:5px;margin-top:6px;
  padding:3px 8px;border-radius:999px;
  background:rgba(255,255,255,.25);
  border:1px solid rgba(255,255,255,.5);
  font-size:9px;font-weight:800;backdrop-filter:blur(2px);
}
.book-meta{padding:10px}
.book-meta-line{
  display:flex;justify-content:space-between;align-items:center;gap:6px;
}
.book-type{font-size:9px;font-weight:700;color:var(--muted)}
.read-pill{
  font-size:9px;font-weight:800;color:#1d4ed8;
  background:#eff6ff;border:1px solid #bfdbfe;
  border-radius:999px;padding:3px 8px;
}

/* Reader: same simple full-screen PDF style, with social panel below */
.reader-page{
  display:none;
  width:100%;
  min-height:calc(100% - 55px);
  background:#fff;
  overflow-y:auto;
}
.reader-page.active{display:block}
.pdf-box{
  width:100%;
  height:62vh;
  min-height:360px;
  background:#e2e8f0;
}
.pdf-frame{
  width:100%;height:100%;border:0;display:block;background:#fff;
}

.social-panel{
  padding:14px 15px 35px;
  background:#fff;
}
.reader-name{
  color:var(--dark);font-size:17px;font-weight:800;
  line-height:1.35;
}
.reader-description{
  color:var(--muted);font-size:10px;font-weight:600;margin-top:4px;
}
.stats{
  display:flex;gap:12px;flex-wrap:wrap;
  margin-top:7px;color:var(--muted);
  font-size:10px;font-weight:700;
}
.action-row{
  display:flex;align-items:center;gap:5px;
  padding:9px 0;margin-top:12px;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  overflow-x:auto;
}
.action{
  display:flex;align-items:center;gap:6px;
  white-space:nowrap;padding:8px 11px;border-radius:10px;
  color:#475569;font-size:11px;font-weight:800;
}
.action.active{color:var(--blue);background:#eff6ff}
.action.like.active{color:var(--red);background:#fef2f2}

.login-note{
  display:none;margin-top:10px;padding:10px 12px;
  border-radius:11px;background:#eff6ff;color:#1d4ed8;
  font-size:10px;font-weight:700;
}
.comments-title{
  margin:16px 0 10px;color:var(--dark);
  font-size:15px;font-weight:800;
}
.comment-form{display:flex;gap:9px;align-items:flex-start}
.avatar{
  width:36px;height:36px;min-width:36px;border-radius:50%;
  object-fit:cover;background:#e2e8f0;
}
.comment-wrap{display:flex;gap:7px;flex:1}
.comment-input{
  width:100%;min-height:42px;max-height:130px;
  resize:none;outline:none;
  border:1px solid var(--border);border-radius:12px;
  padding:10px 12px;font-size:12px;color:var(--text);
}
.comment-input:focus{border-color:#93c5fd}
.send-btn{
  width:42px;height:42px;min-width:42px;
  border-radius:12px;background:var(--blue);color:#fff;
}
.comments-list{display:flex;flex-direction:column;gap:11px;margin-top:14px}
.comment{display:flex;gap:9px;align-items:flex-start}
.comment-body{
  flex:1;min-width:0;background:#f8fafc;
  border-radius:12px;padding:9px 11px;
}
.comment-head{display:flex;gap:7px;align-items:center}
.comment-name{font-size:11px;font-weight:800;color:var(--dark)}
.comment-time{font-size:9px;color:var(--muted)}
.comment-text{
  margin-top:4px;font-size:12px;line-height:1.5;
  color:#475569;white-space:pre-wrap;word-break:break-word;
}
.empty-comments{
  padding:20px;text-align:center;color:var(--muted);font-size:11px;
}

@media(max-width:420px){
  .books-grid{gap:10px}
  .books-title{font-size:16px}
  .books-subtitle{font-size:9px}
  .pdf-box{height:58vh}
}
</style>
</head>

<body>

<!-- YOUR SAME BOOKS LIBRARY STYLE -->
<div class="books-wrap" id="booksHome">
  <div class="books-head">
    <div class="books-title">Books <span>Library</span></div>
    <div class="books-subtitle">Diploma Engineers</div>
  </div>

  <div class="books-grid" id="booksGrid"></div>
</div>

<!-- READER -->
<div class="reader-page" id="readerPage">

  <div class="pdf-box">
    <iframe id="pdfFrame" class="pdf-frame"
      title="PDF Reader" allow="fullscreen"></iframe>
  </div>

  <div class="social-panel">

    <div class="reader-name" id="readerName"></div>
    <div class="reader-description" id="readerDescription"></div>

    <div class="stats">
      <span><i class="fa-regular fa-heart"></i> <b id="likeCount">0</b> Likes</span>
      <span><i class="fa-regular fa-comment"></i> <b id="commentCount">0</b> Comments</span>
      <span><i class="fa-regular fa-bookmark"></i> <b id="saveCount">0</b> Saves</span>
    </div>

    <div class="action-row">
      <button class="action like" id="likeBtn">
        <i class="fa-regular fa-heart"></i> Like
      </button>

      <button class="action" id="saveBtn">
        <i class="fa-regular fa-bookmark"></i> Save
      </button>

      <button class="action" id="commentBtn">
        <i class="fa-regular fa-comment"></i> Comment
      </button>

      <button class="action" id="shareBtn">
        <i class="fa-solid fa-share-nodes"></i> Share
      </button>
    </div>

    <div class="login-note" id="loginNote">
      Like, Save और Comment करने के लिए पहले login करें।
    </div>

    <div class="comments-title">Comments</div>

    <div class="comment-form">
      <img class="avatar" id="userPhoto"
        src="https://ui-avatars.com/api/?name=User" alt="User">

      <div class="comment-wrap">
        <textarea id="commentInput" class="comment-input"
          maxlength="1000" placeholder="Write a comment..."></textarea>
        <button class="send-btn" id="sendComment">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>
    </div>

    <div class="comments-list" id="commentsList">
      <div class="empty-comments">No comments yet. Be the first to comment.</div>
    </div>

  </div>
</div>

<script type="module">

/* ==========================================================
   FIREBASE
   अपने EXISTING APP वाला यही Firebase config लगाएं.
   ========================================================== */

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,collection,doc,getDoc,getDocs,
  addDoc,setDoc,deleteDoc,query,orderBy,
  onSnapshot,serverTimestamp,increment
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
  getStorage,ref,getDownloadURL
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";


const firebaseConfig={
  apiKey:"YOUR_API_KEY",
  authDomain:"YOUR_PROJECT.firebaseapp.com",
  projectId:"YOUR_PROJECT_ID",
  storageBucket:"YOUR_PROJECT.firebasestorage.app",
  messagingSenderId:"YOUR_MESSAGING_SENDER_ID",
  appId:"YOUR_APP_ID"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const storage=getStorage(app);


/* Same PDF icon */
const PDF_ICON=
"https://cdn-icons-png.flaticon.com/512/3143/3143500.png";


/* ==========================================================
   FALLBACK BOOKS
   ========================================================== */

const FALLBACK_BOOKS=[
  {
    id:"applied-physics-2nd",
    name:"Applied Physics 2nd",
    description:"Diploma Engineering Physics PDF",
    pdf:"https://anubhavfinance.wordpress.com/wp-content/uploads/2026/05/mathematics-ii_75660889_2026_05_09_15_4128129.pdf"
  },
  {
    id:"applied-mathematics-2nd",
    name:"Applied Mathematics 2nd",
    description:"Diploma Engineering Maths PDF",
    pdf:"https://anubhavfinance.wordpress.com/wp-content/uploads/2026/05/appliedphysics-iie-bookbydiplomaengineers28129-2.pdf"
  },
  {
    id:"engineering-mechanics",
    name:"Engineering Mechanics",
    description:"Diploma Engineering Mechanics PDF",
    pdf:"https://anubhavfinance.wordpress.com/wp-content/uploads/2026/05/engineeringmechanicse-bookbydiplomaengineers.pdf"
  },
  {
    id:"design-of-steel-structures",
    name:"Design Of Steel Structures",
    description:"Diploma Engineering Steel Structures PDF",
    pdf:"https://anubhavfinance.wordpress.com/wp-content/uploads/2024/11/desigen-of-steei-structure33.pdf"
  }
];


let BOOKS=[];
let currentBook=null;
let currentUser=null;
let stopComments=null;
let stopStats=null;


/* DOM */
const booksHome=document.getElementById("booksHome");
const booksGrid=document.getElementById("booksGrid");
const readerPage=document.getElementById("readerPage");
const pdfFrame=document.getElementById("pdfFrame");
const readerName=document.getElementById("readerName");
const readerDescription=document.getElementById("readerDescription");
const likeCount=document.getElementById("likeCount");
const saveCount=document.getElementById("saveCount");
const commentCount=document.getElementById("commentCount");
const commentsList=document.getElementById("commentsList");
const commentInput=document.getElementById("commentInput");
const userPhoto=document.getElementById("userPhoto");
const loginNote=document.getElementById("loginNote");


function esc(value=""){
  return String(value).replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#039;"
  }[m]));
}


function userName(){
  return currentUser?.displayName ||
         currentUser?.email?.split("@")[0] ||
         "User";
}


function userAvatar(){
  return currentUser?.photoURL ||
    "https://ui-avatars.com/api/?name="+
    encodeURIComponent(userName())+
    "&background=e2e8f0&color=334155";
}


function needLogin(){
  if(currentUser){
    loginNote.style.display="none";
    return true;
  }
  loginNote.style.display="block";
  return false;
}


/* ==========================================================
   FETCH BOOKS FROM FIRESTORE
   Collection: books
   ========================================================== */

async function loadBooks(){

  try{

    const snap=await getDocs(collection(db,"books"));

    if(!snap.empty){

      BOOKS=snap.docs.map(d=>({
        id:d.id,
        ...d.data()
      }));

    }else{

      BOOKS=FALLBACK_BOOKS;

    }

  }catch(error){

    console.error("Firestore books error:",error);
    BOOKS=FALLBACK_BOOKS;

  }

  renderCards();
}


/* ==========================================================
   SAME CARD DESIGN AS UPLOADED FILE
   ========================================================== */

function renderCards(){

  booksGrid.innerHTML="";

  BOOKS.forEach((book,index)=>{

    const card=document.createElement("article");

    card.className="book-card";

    card.innerHTML=`
      <div class="book-cover">

        <img
          class="book-thumb"
          src="${PDF_ICON}"
          alt="PDF"
          loading="lazy"
        >

        <div class="book-shade"></div>

        <div class="book-label">
          ${esc(book.name||"PDF File")}

          <div class="open-pill">
            <i class="fa-solid fa-book-open"></i> Open
          </div>
        </div>

      </div>

      <div class="book-meta">
        <div class="book-meta-line">
          <span class="book-type">PDF • Online Reader</span>
          <span class="read-pill">Read</span>
        </div>
      </div>
    `;

    card.addEventListener("click",()=>openBook(index));

    booksGrid.appendChild(card);

  });
}


/* ==========================================================
   PDF: direct URL OR Firebase Storage
   Firestore example:
   pdf: ""
   storagePath: "books/applied-physics.pdf"
   ========================================================== */

async function getPDF(book){

  if(book.pdf) return book.pdf;

  if(book.storagePath){

    return await getDownloadURL(
      ref(storage,book.storagePath)
    );

  }

  return "";
}


/* ==========================================================
   OPEN READER
   ========================================================== */

async function openBook(index){

  const book=BOOKS[index];

  if(!book)return;

  currentBook=book;
  readerName.textContent=book.name||"PDF File";
  readerDescription.textContent=
    book.description||"Diploma Engineering PDF";

  booksHome.style.display="none";
  readerPage.classList.add("active");
  document.body.classList.add("reader-open");

  pushReaderHistory(book.id);

  window.scrollTo(0,0);

  pdfFrame.src="";

  try{

    const url=await getPDF(book);

    if(!url)throw new Error("PDF not found");

    pdfFrame.src=url;

  }catch(error){

    console.error(error);

    alert(
      "PDF load नहीं हुआ। Firestore में pdf या storagePath check करें।"
    );

  }

  setupRealtime();
  updateUserUI();
}


/* ==========================================================
   CLOSE READER
   ========================================================== */

function closeBook(){

  if(stopComments){
    stopComments();
    stopComments=null;
  }

  if(stopStats){
    stopStats();
    stopStats=null;
  }

  pdfFrame.src="";
  currentBook=null;

  readerPage.classList.remove("active");
  booksHome.style.display="block";
  document.body.classList.remove("reader-open");

  if(window.location.hash.startsWith("#read=")){
    history.replaceState(
      null,
      document.title,
      window.location.pathname + window.location.search
    );
  }

  window.scrollTo(0,0);
}


/* ==========================================================
   REALTIME FIRESTORE
   ========================================================== */

function setupRealtime(){

  if(!currentBook)return;

  if(stopComments)stopComments();
  if(stopStats)stopStats();

  const bookId=currentBook.id;

  /* Stats */
  stopStats=onSnapshot(
    doc(db,"books",bookId),
    snap=>{

      const data=snap.exists()?snap.data():{};

      likeCount.textContent=data.likeCount||0;
      saveCount.textContent=data.saveCount||0;
      commentCount.textContent=data.commentCount||0;

    }
  );


  /* Comments */
  const commentsQuery=query(
    collection(db,"books",bookId,"comments"),
    orderBy("createdAt","desc")
  );

  stopComments=onSnapshot(
    commentsQuery,
    snap=>{

      commentsList.innerHTML="";

      if(snap.empty){

        commentsList.innerHTML=
          `<div class="empty-comments">
             No comments yet. Be the first to comment.
           </div>`;

        return;
      }

      snap.forEach(item=>{

        const c=item.data();

        const photo=c.photoURL||
          "https://ui-avatars.com/api/?name="+
          encodeURIComponent(c.displayName||"User");

        const div=document.createElement("div");

        div.className="comment";

        div.innerHTML=`
          <img
            class="avatar"
            src="${esc(photo)}"
            alt="User"
          >

          <div class="comment-body">

            <div class="comment-head">
              <span class="comment-name">
                ${esc(c.displayName||"User")}
              </span>

              <span class="comment-time">
                ${formatTime(c.createdAt)}
              </span>
            </div>

            <div class="comment-text">
              ${esc(c.text||"")}
            </div>

          </div>
        `;

        commentsList.appendChild(div);

      });

    }
  );
}


function formatTime(timestamp){

  if(!timestamp?.toDate)return"just now";

  const seconds=Math.floor(
    (Date.now()-timestamp.toDate().getTime())/1000
  );

  if(seconds<60)return"just now";
  if(seconds<3600)return Math.floor(seconds/60)+"m";
  if(seconds<86400)return Math.floor(seconds/3600)+"h";

  return Math.floor(seconds/86400)+"d";
}


/* ==========================================================
   LIKE
   books/bookId/likes/userUID
   ========================================================== */

async function toggleLike(){

  if(!currentBook||!needLogin())return;

  const likeRef=doc(
    db,
    "books",
    currentBook.id,
    "likes",
    currentUser.uid
  );

  const exists=await getDoc(likeRef);

  if(exists.exists()){

    await deleteDoc(likeRef);

    await setDoc(
      doc(db,"books",currentBook.id),
      {likeCount:increment(-1)},
      {merge:true}
    );

  }else{

    await setDoc(likeRef,{
      uid:currentUser.uid,
      displayName:userName(),
      photoURL:userAvatar(),
      createdAt:serverTimestamp()
    });

    await setDoc(
      doc(db,"books",currentBook.id),
      {likeCount:increment(1)},
      {merge:true}
    );

  }

  updateLikeState();
}


async function updateLikeState(){

  if(!currentBook||!currentUser){

    setLikeState(false);
    return;
  }

  const snap=await getDoc(
    doc(
      db,
      "books",
      currentBook.id,
      "likes",
      currentUser.uid
    )
  );

  setLikeState(snap.exists());
}


function setLikeState(active){

  const btn=document.getElementById("likeBtn");

  btn.classList.toggle("active",active);

  btn.innerHTML=active
    ? '<i class="fa-solid fa-heart"></i> Liked'
    : '<i class="fa-regular fa-heart"></i> Like';
}


/* ==========================================================
   SAVE
   books/bookId/saves/userUID
   ========================================================== */

async function toggleSave(){

  if(!currentBook||!needLogin())return;

  const saveRef=doc(
    db,
    "books",
    currentBook.id,
    "saves",
    currentUser.uid
  );

  const exists=await getDoc(saveRef);

  if(exists.exists()){

    await deleteDoc(saveRef);

    await setDoc(
      doc(db,"books",currentBook.id),
      {saveCount:increment(-1)},
      {merge:true}
    );

  }else{

    await setDoc(saveRef,{
      uid:currentUser.uid,
      displayName:userName(),
      photoURL:userAvatar(),
      createdAt:serverTimestamp()
    });

    await setDoc(
      doc(db,"books",currentBook.id),
      {saveCount:increment(1)},
      {merge:true}
    );

  }

  updateSaveState();
}


async function updateSaveState(){

  if(!currentBook||!currentUser){

    setSaveState(false);
    return;
  }

  const snap=await getDoc(
    doc(
      db,
      "books",
      currentBook.id,
      "saves",
      currentUser.uid
    )
  );

  setSaveState(snap.exists());
}


function setSaveState(active){

  const btn=document.getElementById("saveBtn");

  btn.classList.toggle("active",active);

  btn.innerHTML=active
    ? '<i class="fa-solid fa-bookmark"></i> Saved'
    : '<i class="fa-regular fa-bookmark"></i> Save';
}


/* ==========================================================
   COMMENT
   books/bookId/comments/commentId
   ========================================================== */

async function postComment(){

  if(!currentBook||!needLogin())return;

  const text=commentInput.value.trim();

  if(!text)return;

  await addDoc(
    collection(
      db,
      "books",
      currentBook.id,
      "comments"
    ),
    {
      uid:currentUser.uid,
      displayName:userName(),
      photoURL:userAvatar(),
      text:text,
      createdAt:serverTimestamp()
    }
  );

  await setDoc(
    doc(db,"books",currentBook.id),
    {commentCount:increment(1)},
    {merge:true}
  );

  commentInput.value="";
}


/* ==========================================================
   SHARE
   ========================================================== */

async function shareBook(){

  if(!currentBook)return;

  const url=
    location.href.split("#")[0]+
    "#read="+
    encodeURIComponent(currentBook.id);

  try{

    if(navigator.share){

      await navigator.share({
        title:currentBook.name,
        text:"Read this PDF on Diploma Engineers",
        url:url
      });

    }else{

      await navigator.clipboard.writeText(url);
      alert("Book link copied.");

    }

  }catch(e){}

}


/* ==========================================================
   USER LOGIN
   Existing Firebase Authentication user is used.
   ========================================================== */

onAuthStateChanged(auth,user=>{

  currentUser=user;

  userPhoto.src=userAvatar();

  updateLikeState();
  updateSaveState();

});


/* ==========================================================
   EVENTS
   ========================================================== */

// Mobile / browser back support
window.addEventListener("popstate", () => {
  if (readerPage.classList.contains("active")) {
    closeBook();
  }
});

document.getElementById("backBtn")?.addEventListener("click", closeBook);

// Add a history state when opening the reader so Android/browser Back
// returns to the Books page first.
function pushReaderHistory(bookId){
  history.pushState(
    { reader: true, bookId: String(bookId) },
    "",
    "#read=" + encodeURIComponent(bookId)
  );
}


document.getElementById("likeBtn")
  .addEventListener("click",toggleLike);


document.getElementById("saveBtn")
  .addEventListener("click",toggleSave);


document.getElementById("commentBtn")
  .addEventListener("click",()=>{

    commentInput.focus();

    commentInput.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

  });


document.getElementById("sendComment")
  .addEventListener("click",postComment);


document.getElementById("shareBtn")
  .addEventListener("click",shareBook);


commentInput.addEventListener("keydown",e=>{

  if(e.key==="Enter"&&!e.shiftKey){

    e.preventDefault();
    postComment();

  }

});


/* ==========================================================
   HASH / MOBILE BACK
   ========================================================== */

window.addEventListener("hashchange",()=>{

  const hash=decodeURIComponent(location.hash);

  if(!hash.startsWith("#read=")){

    if(readerPage.classList.contains("active")){
      closeBook();
    }

    return;
  }

  const id=hash.substring(6);

  const index=BOOKS.findIndex(
    b=>String(b.id)===String(id)
  );

  if(index>=0){

    if(!currentBook||
       String(currentBook.id)!==String(BOOKS[index].id)){

      openBook(index);

    }

  }

});


/* START */
loadBooks();

</script>
