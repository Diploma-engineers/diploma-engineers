<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:"Plus Jakarta Sans",Arial,sans-serif;background:#f6f8fb;color:#0f172a}a{text-decoration:none}.page{max-width:1160px;margin:auto;padding:18px 16px 70px}.topbar{position:sticky;top:0;z-index:20;background:rgba(246,248,251,.9);backdrop-filter:blur(16px);padding:8px 0 12px}.nav{height:62px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-shadow:0 8px 30px rgba(15,23,42,.06)}.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:#2563eb}.brand-icon{width:38px;height:38px;border-radius:12px;background:#eff6ff;display:grid;place-items:center}.back{display:inline-flex;align-items:center;gap:7px;color:#475569;font-size:12px;font-weight:700;padding:9px 12px;border-radius:11px;background:#f8fafc}.hero{margin-top:18px;background:linear-gradient(135deg,#eff6ff,#fff);border:1px solid #dbeafe;border-radius:26px;padding:28px}.hero h1{font-size:32px;margin:0 0 8px}.hero p{margin:0;color:#64748b;line-height:1.7;font-size:13px}.tools{margin:16px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.search{flex:1;min-width:240px;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:9px}.search input{border:0;outline:0;width:100%;font:inherit;font-size:12px}.count{font-size:12px;color:#64748b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:21px;overflow:hidden;box-shadow:0 8px 28px rgba(15,23,42,.055);transition:.25s;opacity:0;transform:translateY(18px)}.card.visible{opacity:1;transform:none}.card:hover{transform:translateY(-4px);box-shadow:0 15px 38px rgba(15,23,42,.09)}.cover{height:230px;background:#f1f5f9;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.body{padding:18px}.cat{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eff6ff;color:#2563eb;font-size:10px;font-weight:800;margin-bottom:9px}.body h2{font-size:20px;line-height:1.4;margin:0 0 8px}.meta{display:flex;gap:7px;flex-wrap:wrap;color:#64748b;font-size:10px;margin-bottom:12px}.excerpt{color:#475569;font-size:13px;line-height:1.7;margin:0 0 15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.read{display:inline-flex;align-items:center;gap:7px;background:#2563eb;color:#fff;padding:10px 13px;border-radius:11px;font-size:11px;font-weight:800}.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:20px;padding:50px;text-align:center;color:#64748b}.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;overflow:auto;padding:25px 14px}.modal.open{display:block}.modal-box{max-width:820px;margin:20px auto;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.2)}.modal-cover{max-height:350px;background:#f1f5f9;overflow:hidden}.modal-cover img{display:block;width:100%;max-height:350px;object-fit:cover}.modal-content{padding:25px}.modal-content h1{margin:0 0 9px;font-size:28px;line-height:1.35}.modal-meta{color:#64748b;font-size:11px;margin-bottom:20px}.article{font-size:14px;line-height:1.85;color:#334155;overflow-wrap:anywhere}.article h2{font-size:23px;color:#0f172a;margin-top:25px}.article h3{font-size:18px;color:#0f172a;margin-top:20px}.article img{max-width:100%;height:auto;border-radius:12px}.article a{color:#2563eb}.close{float:right;border:0;background:#f1f5f9;color:#334155;width:38px;height:38px;border-radius:12px;cursor:pointer}.loader{text-align:center;padding:50px;color:#64748b}.footer{text-align:center;color:#94a3b8;font-size:11px;margin-top:35px}.footer b{color:#2563eb}@media(max-width:760px){.page{padding:10px 10px 70px}.hero{padding:22px;border-radius:21px}.hero h1{font-size:25px}.grid{grid-template-columns:1fr}.cover{height:205px}.nav{height:56px}.brand-icon{width:34px;height:34px}.modal-content{padding:19px}.modal-content h1{font-size:23px}}
</style>
</head>
<body>
<div class="page">
  <div class="topbar"><div class="nav"><div class="brand"><div class="brand-icon"><i class="fa-solid fa-pen-nib"></i></div><span>Diploma Engineers Blogs</span></div><a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back</a></div></div>
  <section class="hero"><h1>Latest Blogs</h1><p>Education, diploma guidance, engineering, career, jobs and useful updates — all blogs in one place.</p></section>
  <div class="tools"><div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="search" type="search" placeholder="Search blogs..."></div><div class="count" id="count">Loading...</div></div>
  <main id="list" class="grid"><div class="loader"><i class="fa-solid fa-spinner fa-spin"></i> Loading blogs...</div></main>
  <div class="footer">© 2026 <b>Diploma Engineers</b> • All Blogs</div>
</div>

<div class="modal" id="modal"><div class="modal-box"><div class="modal-cover" id="modalCover"></div><div class="modal-content"><button class="close" id="close"><i class="fa-solid fa-xmark"></i></button><div id="modalBody"></div></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyAbg1Q1ZPgF7mwaxyin7iglla01eDk_tKo",
  authDomain:"diplomaengineers-869df.firebaseapp.com",
  databaseURL:"https://diplomaengineers-869df-default-rtdb.firebaseio.com",
  projectId:"diplomaengineers-869df",
  storageBucket:"diplomaengineers-869df.appspot.com",
  messagingSenderId:"356779436080",
  appId:"1:356779436080:web:4b28da380e547420d0e5f5"
};
const app=initializeApp(firebaseConfig),db=getDatabase(app);
const list=document.getElementById('list'),count=document.getElementById('count'),search=document.getElementById('search'),modal=document.getElementById('modal'),modalCover=document.getElementById('modalCover'),modalBody=document.getElementById('modalBody');
let blogs=[];
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function safeHTML(html=''){const doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('script,iframe,object,embed,form').forEach(e=>e.remove());doc.querySelectorAll('*').forEach(el=>{[...el.attributes].forEach(a=>{if(a.name.toLowerCase().startsWith('on'))el.removeAttribute(a.name);});});return doc.body.innerHTML;}
function render(){
  const q=search.value.trim().toLowerCase();
  const items=blogs.filter(b=>!q || [b.title,b.text,b.desc,b.category,b.cat,b.authorName,b.ownerName].join(' ').toLowerCase().includes(q));
  count.textContent=`${items.length} blog${items.length===1?'':'s'}`;
  if(!items.length){list.className='';list.innerHTML='<div class="empty">No blogs found.</div>';return;}
  list.className='grid';list.innerHTML='';
  items.forEach((b,i)=>{
    const card=document.createElement('article');card.className='card';card.style.transitionDelay=(Math.min(i,8)*45)+'ms';
    const img=b.thumb||b.image||'';
    card.innerHTML=`<div class="cover">${img?`<img src="${esc(img)}" loading="lazy" alt="${esc(b.title||'Blog')}">`:'<div style="height:100%;display:grid;place-items:center;color:#94a3b8;font-size:35px"><i class="fa-solid fa-pen-nib"></i></div>'}</div><div class="body"><span class="cat">${esc(b.category||b.cat||'Education')}</span><h2>${esc(b.title||'Untitled Blog')}</h2><div class="meta"><span><i class="fa-solid fa-user"></i> ${esc(b.authorName||b.ownerName||'Diploma Engineers')}</span><span>•</span><span>${esc(b.date||'')}</span></div><p class="excerpt">${esc(b.text||b.desc||'')}</p><a href="#" class="read"><i class="fa-solid fa-book-open"></i> Read Blog</a></div>`;
    card.querySelector('.read').addEventListener('click',e=>{e.preventDefault();openBlog(b);});
    list.appendChild(card);
    requestAnimationFrame(()=>setTimeout(()=>card.classList.add('visible'),20));
  });
}
function openBlog(b){
  const img=b.thumb||b.image||'';modalCover.innerHTML=img?`<img src="${esc(img)}" alt="${esc(b.title||'Blog')}">`:'';
  const html=safeHTML(b.html||'');
  const fallback=html||`<p>${esc(b.text||b.desc||'')}</p>`;
  modalBody.innerHTML=`<h1>${esc(b.title||'Untitled Blog')}</h1><div class="modal-meta"><i class="fa-solid fa-folder"></i> ${esc(b.category||b.cat||'Education')} &nbsp; • &nbsp; <i class="fa-solid fa-user"></i> ${esc(b.authorName||b.ownerName||'Diploma Engineers')} &nbsp; • &nbsp; ${esc(b.designation||b.ownerDesignation||'ADMIN')} &nbsp; • &nbsp; ${esc(b.date||'')}</div><div class="article">${fallback}</div>${b.link?`<p style="margin-top:20px"><a class="read" href="${esc(b.link)}" target="_blank" rel="noopener"><i class="fa-solid fa-link"></i> Open Related Link</a></p>`:''}`;
  modal.classList.add('open');document.body.style.overflow='hidden';
}
function closeModal(){modal.classList.remove('open');document.body.style.overflow='';}
document.getElementById('close').onclick=closeModal;modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});search.addEventListener('input',render);
onValue(ref(db,'blogs'),snap=>{blogs=[];if(snap.exists())snap.forEach(c=>blogs.push({id:c.key,...c.val()}));blogs.sort((a,b)=>(Number(b.timestamp)||0)-(Number(a.timestamp)||0));render();},err=>{console.error(err);count.textContent='Error';list.className='';list.innerHTML='<div class="empty" style="color:#dc2626">Unable to load blogs. Please check Firebase Rules for /blogs.</div>';});
</script>
</body>
</html>
