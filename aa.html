<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Portal - Ashoka Batch</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #22c55e;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        header {
            background-color: var(--card-bg);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .batch-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .batch-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        /* Main Layout */
        .container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            padding: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        @media (min-width: 992px) {
            .container {
                grid-template-columns: 2.5fr 1fr;
            }
        }

        /* Video Section */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-details {
            background-color: var(--card-bg);
            padding: 1.2rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .video-title {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        .video-subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        /* Action Buttons */
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--border-color);
        }

        .action-btn {
            background-color: #2d3748;
            color: var(--text-color);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background-color: var(--primary-color);
        }

        .action-btn.liked {
            color: #ef4444;
        }

        /* Subject Navigation */
        .subjects-bar {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .subject-chip {
            background-color: var(--card-bg);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }

        .subject-chip.active, .subject-chip:hover {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        /* Playlist Sidebar */
        .playlist-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1rem;
            border: 1px solid var(--border-color);
            max-height: 600px;
            display: flex;
            flex-direction: column;
        }

        .playlist-header {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .playlist-items {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .playlist-item {
            display: flex;
            gap: 10px;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            background-color: rgba(255, 255, 255, 0.03);
        }

        .playlist-item:hover, .playlist-item.active {
            background-color: rgba(79, 70, 229, 0.2);
            border-left: 3px solid var(--primary-color);
        }

        .item-thumb {
            width: 80px;
            height: 50px;
            background-color: #000;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .item-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .item-title {
            font-size: 0.85rem;
            font-weight: 600;
            line-clamp: 2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .item-duration {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 3px;
        }

        /* Modal for Comments */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
        }

        .modal-content input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Top Header -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i> EdTech Portal
        </div>
        <button class="batch-btn" onclick="selectBatch('Ashoka Batch')">
            <i class="fa-solid fa-layer-group"></i> Ashoka Batch
        </button>
    </header>

    <div class="container">
        <!-- Main Streaming Section -->
        <div class="main-content">
            <!-- Subject Selection Filter -->
            <div class="subjects-bar" id="subjectBar">
                <!-- Subjects populated dynamically -->
            </div>

            <!-- Cloudinary Embedded Video Player -->
            <div class="video-container">
                <iframe id="cloudinaryPlayer" 
                    src="https://player.cloudinary.com/embed/?cloud_name=h7g2sxct&public_id=VID_20260812_101229_651" 
                    allow="autoplay; fullscreen; encrypted-media; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>

            <!-- Video Info & Interactive Actions -->
            <div class="video-details">
                <h2 class="video-title" id="currentVideoTitle">Select a lecture to play</h2>
                <p class="video-subtitle" id="currentVideoSub">Ashoka Batch - Civil Engineering</p>
                
                <div class="action-bar">
                    <button class="action-btn" id="likeBtn" onclick="toggleLike()">
                        <i class="fa-regular fa-thumbs-up"></i> <span id="likeCount">124</span> Likes
                    </button>
                    <button class="action-btn" onclick="openCommentModal()">
                        <i class="fa-regular fa-comment"></i> Comment
                    </button>
                    <button class="action-btn" onclick="shareVideo()">
                        <i class="fa-solid fa-share"></i> Share
                    </button>
                    <button class="action-btn" onclick="downloadVideo()">
                        <i class="fa-solid fa-download"></i> Download Notes/Video
                    </button>
                </div>
            </div>
        </div>

        <!-- Sidebar Playlist -->
        <div class="playlist-card">
            <div class="playlist-header">
                <span id="playlistTitle">Subject Playlist</span>
                <i class="fa-solid fa-list-check"></i>
            </div>
            <div class="playlist-items" id="playlistItems">
                <!-- Playlist items populated dynamically -->
            </div>
        </div>
    </div>

    <!-- Comment Modal -->
    <div class="modal" id="commentModal">
        <div class="modal-content">
            <h3>Add a Comment</h3>
            <input type="text" id="commentInput" placeholder="Write your question or comment here...">
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="action-btn" onclick="closeCommentModal()">Cancel</button>
                <button class="action-btn" style="background: var(--primary-color);" onclick="submitComment()">Submit</button>
            </div>
        </div>
    </div>

    <script>
        // Data Structure for Subjects & Videos
        const batchData = {
            "Soil Mechanics": [
                {
                    title: "Lecture 01: Introduction & Soil Classification",
                    publicId: "VID_20260812_101229_651",
                    duration: "45:20"
                },
                {
                    title: "Lecture 02: Permeability & Seepage Analysis",
                    publicId: "VID_20260812_101229_651", // Reused public ID for demo
                    duration: "50:15"
                }
            ],
            "Fluid Mechanics": [
                {
                    title: "Lecture 01: Fluid Properties & Hydrostatic Pressure",
                    publicId: "VID_20260812_101229_651",
                    duration: "40:10"
                }
            ],
            "Structural Analysis": [
                {
                    title: "Lecture 01: Beams, Trusses & Loads",
                    publicId: "VID_20260812_101229_651",
                    duration: "55:00"
                }
            ]
        };

        const cloudName = "h7g2sxct";
        let currentSubject = "Soil Mechanics";
        let isLiked = false;

        // Initialize Page
        window.onload = function() {
            renderSubjects();
            loadSubjectPlaylist(currentSubject);
        };

        function selectBatch(batchName) {
            alert(`Switched to: ${batchName}`);
        }

        // Render Subject Chips
        function renderSubjects() {
            const subjectBar = document.getElementById('subjectBar');
            subjectBar.innerHTML = '';
            
            Object.keys(batchData).forEach((subject, index) => {
                const chip = document.createElement('div');
                chip.className = `subject-chip ${index === 0 ? 'active' : ''}`;
                chip.innerText = subject;
                chip.onclick = () => {
                    document.querySelectorAll('.subject-chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    loadSubjectPlaylist(subject);
                };
                subjectBar.appendChild(chip);
            });
        }

        // Load Videos for Selected Subject
        function loadSubjectPlaylist(subject) {
            currentSubject = subject;
            document.getElementById('playlistTitle').innerText = subject;
            const playlistContainer = document.getElementById('playlistItems');
            playlistContainer.innerHTML = '';

            const videos = batchData[subject];
            
            videos.forEach((video, index) => {
                const item = document.createElement('div');
                item.className = `playlist-item ${index === 0 ? 'active' : ''}`;
                item.onclick = () => playVideo(video, item);

                item.innerHTML = `
                    <div class="item-thumb"><i class="fa-solid fa-play"></i></div>
                    <div class="item-info">
                        <div class="item-title">${video.title}</div>
                        <div class="item-duration">${video.duration}</div>
                    </div>
                `;
                playlistContainer.appendChild(item);
            });

            // Play first video by default
            if (videos.length > 0) {
                playVideo(videos[0], playlistContainer.children[0]);
            }
        }

        // Play Cloudinary Video
        function playVideo(video, element) {
            // Update iframe source dynamically
            const iframe = document.getElementById('cloudinaryPlayer');
            iframe.src = `https://player.cloudinary.com/embed/?cloud_name=${cloudName}&public_id=${video.publicId}`;
            
            // Update Title Details
            document.getElementById('currentVideoTitle').innerText = video.title;
            document.getElementById('currentVideoSub').innerText = `Ashoka Batch • ${currentSubject}`;

            // Update active state in list
            document.querySelectorAll('.playlist-item').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');
        }

        // Action Handlers
        function toggleLike() {
            const likeBtn = document.getElementById('likeBtn');
            const likeCount = document.getElementById('likeCount');
            let count = parseInt(likeCount.innerText);

            if (!isLiked) {
                likeCount.innerText = count + 1;
                likeBtn.classList.add('liked');
                likeBtn.querySelector('i').className = "fa-solid fa-thumbs-up";
                isLiked = true;
            } else {
                likeCount.innerText = count - 1;
                likeBtn.classList.remove('liked');
                likeBtn.querySelector('i').className = "fa-regular fa-thumbs-up";
                isLiked = false;
            }
        }

        function openCommentModal() {
            document.getElementById('commentModal').style.display = 'flex';
        }

        function closeCommentModal() {
            document.getElementById('commentModal').style.display = 'none';
        }

        function submitComment() {
            const comment = document.getElementById('commentInput').value;
            if (comment.trim() !== "") {
                alert("Comment posted successfully!");
                document.getElementById('commentInput').value = "";
                closeCommentModal();
            }
        }

        function shareVideo() {
            if (navigator.share) {
                navigator.share({
                    title: document.getElementById('currentVideoTitle').innerText,
                    url: window.location.href
                });
            } else {
                alert("Video link copied to clipboard!");
            }
        }

        function downloadVideo() {
            alert("Starting download for lecture resources...");
        }
    </style>
</head>
<body>
</body>
    </html>
