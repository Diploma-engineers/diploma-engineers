      <p><strong>Electrochemical (galvanic) cells</strong> convert <strong>chemical energy into electrical energy</strong> through redox reactions. The <strong>Daniell cell</strong> (Zn|ZnSO₄||CuSO₄|Cu, E° = +1.10 V) is the classic example: Zn oxidises at the anode, Cu²⁺ reduces at the cathode.</p>
      <h3>Primary cells — dry cell (Leclanché)</h3>
      <ul>
        <li><strong>Not rechargeable.</strong> <strong>Anode:</strong> zinc can (−); <strong>cathode:</strong> graphite rod (+) surrounded by MnO₂ + carbon powder.</li>
        <li><strong>Electrolyte:</strong> moist paste of <strong>NH₄Cl + ZnCl₂</strong> (hence "dry" — no free liquid).</li>
        <li>Reaction: Zn + 2MnO₂ + 2NH₄⁺ → Zn²⁺ + Mn₂O₃ + 2NH₃ + H₂O · <strong>EMF ≈ 1.5 V</strong>.</li>
        <li>Uses: torches, toys, clocks. MnO₂ acts as a <strong>depolariser</strong> (oxidises H₂ that would otherwise polarise the cathode).</li>
      </ul>
      <h3>Secondary cell — lead storage battery</h3>
      <ul>
        <li><strong>Rechargeable.</strong> <strong>Anode:</strong> spongy lead (−); <strong>cathode:</strong> PbO₂ (+); <strong>electrolyte:</strong> dilute <strong>H₂SO₄</strong> (~38%).</li>
        <li><strong>Discharging:</strong> Pb + PbO₂ + 2H₂SO₄ → 2PbSO₄ + 2H₂O (~2 V per cell; 6 cells = 12 V car battery).</li>
        <li><strong>Charging</strong> reverses the reaction with an external supply. As the cell discharges, <strong>H₂SO₄ is consumed</strong> — so the <strong>specific gravity of the acid</strong> (measured by hydrometer) indicates the state of charge.</li>
        <li>Uses: automobiles, inverters, UPS.</li>
      </ul>
      <h3>Fuel cell (H₂–O₂)</h3>
      <ul>
        <li>Converts the <strong>combustion energy of H₂ directly into electricity</strong>, continuously, as long as fuel is supplied: <strong>2H₂ + O₂ → 2H₂O</strong>.</li>
        <li>Electrodes: porous carbon/nickel; electrolyte: <strong>KOH</strong>; anode: H₂ oxidised, cathode: O₂ reduced.</li>
        <li><strong>Advantages:</strong> high efficiency (~70%), <strong>pollution-free</strong> (only water formed), continuous power. Used in <strong>spacecraft</strong> (Apollo missions) and backup power.</li>
      </ul>
      <h3>Solar cell</h3>
      <ul>
        <li>Converts <strong>light (solar) energy into electrical energy</strong> via the <strong>photovoltaic effect</strong> in <strong>silicon</strong> (p–n junction).</li>
        <li>Photons knock electrons loose, creating a current. No moving parts, no pollution; used in calculators, street lights, solar panels.</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ Key Points for Exams</div>
      <ul>
        <li><strong>Primary</strong> = not rechargeable (dry cell); <strong>secondary</strong> = rechargeable (lead battery).</li>
        <li>Daniell cell: anode Zn (−, oxidation), cathode Cu (+, reduction), E°cell = E°cathode − E°anode.</li>
        <li>Fuel cell ≠ battery: a fuel cell <strong>needs continuous fuel supply</strong>; a battery stores chemicals inside.</li>
        <li>Lead battery: <strong>6 cells × 2 V = 12 V</strong>; acid density falls on discharge.</li>
      </ul></div>
    `,body_hi:`
      <p><strong>विद्युतरासायनिक (गैल्वेनिक) सेल</strong> रेडॉक्स अभिक्रियाओं द्वारा <strong>रासायनिक ऊर्जा को विद्युत ऊर्जा</strong> में बदलते हैं। <strong>डेनियल सेल</strong> (Zn|ZnSO₄||CuSO₄|Cu, E° = +1.10 V) क्लासिक उदाहरण है: Zn ऐनोड पर ऑक्सीकृत होता है, Cu²⁺ कैथोड पर अपचयित होता है।</p>
      <h3>प्राथमिक सेल — शुष्क सेल (लेक्लांशे)</h3>
      <ul>
        <li><strong>पुनः आवेशित नहीं</strong> होता। <strong>ऐनोड:</strong> जस्ता पात्र (−); <strong>कैथोड:</strong> MnO₂ + कार्बन चूर्ण से घिरी ग्रेफाइट छड़ (+)।</li>
        <li><strong>विद्युतअपघट्य:</strong> <strong>NH₄Cl + ZnCl₂</strong> की नम लेई (इसीलिए "शुष्क" — मुक्त द्रव नहीं)।</li>
        <li>अभिक्रिया: Zn + 2MnO₂ + 2NH₄⁺ → Zn²⁺ + Mn₂O₃ + 2NH₃ + H₂O · <strong>EMF ≈ 1.5 V</strong>।</li>
        <li>उपयोग: टॉर्च, खिलौने, घड़ियाँ। MnO₂ <strong>विध्रुवक</strong> का कार्य करता है (H₂ का ऑक्सीकरण जो अन्यथा कैथोड का ध्रुवण करती)।</li>
      </ul>
      <h3>द्वितीयक सेल — सीसा संचायक बैटरी</h3>
      <ul>
        <li><strong>पुनः आवेशित</strong> होती है। <strong>ऐनोड:</strong> स्पंजी सीसा (−); <strong>कैथोड:</strong> PbO₂ (+); <strong>विद्युतअपघट्य:</strong> तनु <strong>H₂SO₄</strong> (~38%)।</li>
        <li><strong>निरावेशन:</strong> Pb + PbO₂ + 2H₂SO₄ → 2PbSO₄ + 2H₂O (प्रति सेल ~2 V; 6 सेल = 12 V कार बैटरी)।</li>
        <li><strong>आवेशन</strong> बाह्य आपूर्ति से अभिक्रिया उत्क्रमित करता है। निरावेशन में <strong>H₂SO₄ खर्च</strong> होता है — अतः अम्ल का <strong>आपेक्षिक घनत्व</strong> (हाइड्रोमीटर से मापा) आवेश अवस्था दर्शाता है।</li>
        <li>उपयोग: ऑटोमोबाइल, इन्वर्टर, UPS।</li>
      </ul>
      <h3>ईंधन सेल (H₂–O₂)</h3>
      <ul>
        <li>H₂ की <strong>दहन ऊर्जा को सीधे विद्युत</strong> में बदलता है, <strong>2H₂ + O₂ → 2H₂O</strong>, जब तक ईंधन मिलता रहे सतत।</li>
        <li>इलेक्ट्रोड: छिद्रित कार्बन/निकेल; विद्युतअपघट्य: <strong>KOH</strong>; ऐनोड: H₂ ऑक्सीकृत, कैथोड: O₂ अपचयित।</li>
        <li><strong>लाभ:</strong> उच्च दक्षता (~70%), <strong>प्रदूषण-मुक्त</strong> (केवल जल बनता है), सतत शक्ति। <strong>अंतरिक्षयान</strong> (अपोलो मिशन) व बैकअप शक्ति में प्रयुक्त।</li>
      </ul>
      <h3>सौर सेल</h3>
      <ul>
        <li><strong>सिलिकॉन</strong> (p–n संधि) में <strong>प्रकाशवैद्युत प्रभाव</strong> द्वारा <strong>प्रकाश (सौर) ऊर्जा को विद्युत ऊर्जा</strong> में बदलता है।</li>
        <li>फोटॉन इलेक्ट्रॉन मुक्त करते हैं, धारा बनती है। कोई गतिशील भाग नहीं, प्रदूषण नहीं; कैलकुलेटर, स्ट्रीट लाइट, सौर पैनलों में प्रयुक्त।</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ परीक्षा हेतु मुख्य बिंदु</div>
      <ul>
        <li><strong>प्राथमिक</strong> = पुनः आवेशित नहीं (शुष्क सेल); <strong>द्वितीयक</strong> = पुनः आवेशित (सीसा बैटरी)।</li>
        <li>डेनियल सेल: ऐनोड Zn (−, ऑक्सीकरण), कैथोड Cu (+, अपचयन), E°cell = E°कैथोड − E°ऐनोड।</li>
        <li>ईंधन सेल ≠ बैटरी: ईंधन सेल को <strong>सतत ईंधन आपूर्ति</strong> चाहिए; बैटरी रसायन अंदर संग्रहित करती है।</li>
        <li>सीसा बैटरी: <strong>6 सेल × 2 V = 12 V</strong>; निरावेशन पर अम्ल घनत्व घटता है।</li>
      </ul></div>

      <p><strong>Corrosion</strong> is the gradual <strong>deterioration of a metal</strong> by chemical/electrochemical reaction with its environment (air, moisture, chemicals) — e.g. <strong>rusting of iron</strong>, tarnishing of silver, green coating on copper.</p>
      <h3>Types of corrosion</h3>
      <ul>
        <li><strong>Chemical (dry) corrosion:</strong> direct attack by dry gases (O₂, halogens, SO₂) forming an oxide film — e.g. tarnishing of silver in H₂S air.</li>
        <li><strong>Electrochemical (wet) corrosion:</strong> occurs in presence of <strong>moisture/electrolyte</strong> via tiny galvanic cells on the metal surface — the common, serious type.</li>
      </ul>
      <h3>Mechanism of electrochemical corrosion</h3>
      <p><strong>1. Hydrogen liberation type</strong> (in acidic medium):</p>
      <div class="formula-strip"><span class="flabel">Acidic</span>Anode: Fe → Fe²⁺ + 2e⁻ · Cathode: 2H⁺ + 2e⁻ → H₂↑</div>
      <p><strong>2. Oxygen absorption type</strong> (in neutral/alkaline medium — rusting of iron):</p>
      <div class="formula-strip"><span class="flabel">Rusting</span>Anode: Fe → Fe²⁺ + 2e⁻ · Cathode: O₂ + 2H₂O + 4e⁻ → 4OH⁻ · Fe²⁺ + 2OH⁻ → Fe(OH)₂ → oxidised to <strong>Fe₂O₃·xH₂O (rust)</strong></div>
      <h3>Factors affecting the rate of corrosion</h3>
      <ul>
        <li><strong>Nature of metal:</strong> position in electrochemical series — more active metals corrode faster; pure metals resist better than impure ones (impurities form galvanic cells).</li>
        <li><strong>Nature of environment:</strong> moisture, dissolved O₂/CO₂, <strong>pH</strong> (acidic faster), <strong>salts</strong> (seawater corrodes faster), temperature.</li>
        <li><strong>Stress and contact:</strong> stressed parts and <strong>bimetallic contact</strong> (two different metals) corrode faster at the more active metal.</li>
      </ul>
      <h3>Corrosion prevention</h3>
      <p><strong>A. Internal measures</strong> (change the metal itself):</p>
      <ul>
        <li><strong>Purification</strong> of the metal (pure Al, pure Fe resist better).</li>
        <li><strong>Alloying:</strong> e.g. <strong>stainless steel</strong> (Fe + Cr) — Cr forms a protective oxide film.</li>
        <li><strong>Heat treatment</strong> to remove internal stresses.</li>
      </ul>
      <p><strong>B. External measures:</strong></p>
      <ul>
        <li><strong>a) Metallic coatings:</strong> <strong>anodic coating</strong> — coating metal is <strong>more active</strong> than the base (e.g. <strong>galvanization: Zn on Fe</strong> — even if scratched, Zn corrodes sacrificially and Fe is protected); <strong>cathodic coating</strong> — coating metal is <strong>nobler</strong> (e.g. <strong>tinning: Sn on Fe</strong> — protects only while unbroken; a scratch accelerates attack on exposed Fe).</li>
        <li><strong>b) Organic coatings:</strong> paints, varnishes, enamels — barrier between metal and environment.</li>
        <li><strong>Inhibitors:</strong> chemicals added to the environment that slow corrosion (e.g. chromates, phosphates in cooling water).</li>
        <li><strong>Cathodic protection:</strong> connecting the structure to a more active metal (<strong>sacrificial anode</strong>: Mg/Zn) or using impressed current — used for pipelines, ships.</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ Key Points for Exams</div>
      <ul>
        <li><strong>Rust</strong> = hydrated ferric oxide, <strong>Fe₂O₃·xH₂O</strong> — needs <strong>both air (O₂) and water</strong>.</li>
        <li><strong>Galvanization (Zn)</strong> protects even on scratching; <strong>tinning (Sn)</strong> does not.</li>
        <li>Electrochemical series order decides which metal becomes the anode in a galvanic couple.</li>
        <li>Sacrificial anode method: <strong>Mg blocks</strong> bolted to ship hulls/pipelines.</li>
      </ul></div>
    `,body_hi:`
      <p><strong>संक्षारण</strong> पर्यावरण (वायु, नमी, रसायन) के साथ रासायनिक/विद्युतरासायनिक अभिक्रिया द्वारा धातु का क्रमिक <strong>क्षय</strong> है — जैसे <strong>लोहे में जंग</strong>, चाँदी का मलिन होना, ताँबे पर हरी परत।</p>
      <h3>संक्षारण के प्रकार</h3>
      <ul>
        <li><strong>रासायनिक (शुष्क) संक्षारण:</strong> शुष्क गैसों (O₂, हैलोजन, SO₂) का सीधा आक्रमण जिससे ऑक्साइड परत बनती है — जैसे H₂S वायु में चाँदी का मलिन होना।</li>
        <li><strong>विद्युतरासायनिक (आर्द्र) संक्षारण:</strong> <strong>नमी/विद्युतअपघट्य</strong> की उपस्थिति में धातु सतह पर सूक्ष्म गैल्वेनिक सेलों द्वारा — सामान्य, गंभीर प्रकार।</li>
      </ul>
      <h3>विद्युतरासायनिक संक्षारण की क्रियाविधि</h3>
      <p><strong>1. हाइड्रोजन मुक्ति प्रकार</strong> (अम्लीय माध्यम में):</p>
      <div class="formula-strip"><span class="flabel">अम्लीय</span>ऐनोड: Fe → Fe²⁺ + 2e⁻ · कैथोड: 2H⁺ + 2e⁻ → H₂↑</div>
      <p><strong>2. ऑक्सीजन अवशोषण प्रकार</strong> (उदासीन/क्षारीय माध्यम में — लोहे में जंग):</p>
      <div class="formula-strip"><span class="flabel">जंग लगना</span>ऐनोड: Fe → Fe²⁺ + 2e⁻ · कैथोड: O₂ + 2H₂O + 4e⁻ → 4OH⁻ · Fe²⁺ + 2OH⁻ → Fe(OH)₂ → ऑक्सीकृत होकर <strong>Fe₂O₃·xH₂O (जंग)</strong></div>
      <h3>संक्षारण दर को प्रभावित करने वाले कारक</h3>
      <ul>
        <li><strong>धातु की प्रकृति:</strong> विद्युतरासायनिक श्रेणी में स्थिति — अधिक सक्रिय धातुएँ शीघ्र संक्षारित; शुद्ध धातुएँ अशुद्धों से बेहतर प्रतिरोध करती हैं (अशुद्धियाँ गैल्वेनिक सेल बनाती हैं)।</li>
        <li><strong>पर्यावरण की प्रकृति:</strong> नमी, घुलित O₂/CO₂, <strong>pH</strong> (अम्लीय में तीव्र), <strong>लवण</strong> (समुद्रजल में तीव्र संक्षारण), तापमान।</li>
        <li><strong>प्रतिबल व संपर्क:</strong> प्रतिबलित भाग व <strong>द्विधात्विक संपर्क</strong> (दो भिन्न धातुएँ) में अधिक सक्रिय धातु पर तीव्र संक्षारण।</li>
      </ul>
      <h3>संक्षारण निवारण</h3>
      <p><strong>A. आंतरिक उपाय</strong> (धातु स्वयं बदलें):</p>
      <ul>
        <li>धातु का <strong>शोधन</strong> (शुद्ध Al, शुद्ध Fe बेहतर प्रतिरोध करते हैं)।</li>
        <li><strong>मिश्रधातुकरण:</strong> जैसे <strong>स्टेनलेस स्टील</strong> (Fe + Cr) — Cr रक्षात्मक ऑक्साइड परत बनाता है।</li>
        <li>आंतरिक प्रतिबल हटाने हेतु <strong>ऊष्मा उपचार</strong>।</li>
      </ul>
      <p><strong>B. बाह्य उपाय:</strong></p>
      <ul>
        <li><strong>a) धात्विक लेपन:</strong> <strong>ऐनोडी लेपन</strong> — लेपन धातु आधार से <strong>अधिक सक्रिय</strong> (जैसे <strong>यशदलेपन: Fe पर Zn</strong> — खरोंच पर भी Zn बलिदानी रूप से संक्षारित होता है और Fe सुरक्षित रहता है); <strong>कैथोडी लेपन</strong> — लेपन धातु <strong>उत्कृष्ट</strong> (जैसे <strong>कलई: Fe पर Sn</strong> — केवल अटूट रहने तक रक्षा; खरोंच उघड़े Fe पर आक्रमण तीव्र करती है)।</li>
        <li><strong>b) कार्बनिक लेपन:</strong> पेंट, वार्निश, इनेमल — धातु व पर्यावरण के बीच अवरोध।</li>
        <li><strong>निरोधक:</strong> पर्यावरण में मिलाए गए रसायन जो संक्षारण मंद करते हैं (जैसे शीतलन जल में क्रोमेट, फॉस्फेट)।</li>
        <li><strong>कैथोडी रक्षण:</strong> संरचना को अधिक सक्रिय धातु (<strong>बलिदानी ऐनोड</strong>: Mg/Zn) से जोड़ना या आरोपित धारा — पाइपलाइनों, जहाज़ों हेतु।</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ परीक्षा हेतु मुख्य बिंदु</div>
      <ul>
        <li><strong>जंग</strong> = जलयोजित फेरिक ऑक्साइड, <strong>Fe₂O₃·xH₂O</strong> — <strong>वायु (O₂) व जल दोनों</strong> चाहिए।</li>
        <li><strong>यशदलेपन (Zn)</strong> खरोंच पर भी रक्षा करता है; <strong>कलई (Sn)</strong> नहीं करती।</li>
        <li>विद्युतरासायनिक श्रेणी क्रम तय करता है कि गैल्वेनिक युग्म में कौन-सी धातु ऐनोड बनेगी।</li>
        <li>बलिदानी ऐनोड विधि: जहाज़ तलों/पाइपलाइनों पर <strong>Mg खंड</strong> कसे जाते हैं।</li>

<style>
#allUnitsPdfBtn{position:fixed;right:18px;bottom:22px;z-index:99999;border:0;border-radius:999px;padding:14px 19px;background:linear-gradient(135deg,#ff7a18,#d95b00);color:#fff;font:700 14px/1.2 system-ui,sans-serif;box-shadow:0 8px 24px rgba(190,85,0,.35);display:flex;align-items:center;gap:9px;cursor:pointer}

</style>
<button id="allUnitsPdfBtn" type="button" aria-label="Generate and download complete PDF">
<span class="pdfIcon">⬇</span><span id="allUnitsPdfLabel">All Units PDF</span>
</button>
<script>
(function(){
 const btn=document.getElementById('allUnitsPdfBtn'), label=document.getElementById('allUnitsPdfLabel');
 const sleep=ms=>new Promise(r=>setTimeout(r,ms));
 function getNext(){return [...document.querySelectorAll('main nav button, main button.btn-nav')].find(b=>/Next|अगला/i.test(b.innerText||''));}
 function getPrev(){return [...document.querySelectorAll('main nav button, main button.btn-nav')].find(b=>/Previous|पिछला/i.test(b.innerText||''));}
 btn.addEventListener('click',async function(){
   if(btn.disabled)return;
   const printWin=window.open('about:blank','_blank');
   if(!printWin){alert('Please allow pop-ups to generate the PDF.');return;}
   btn.disabled=true; const oldLabel=label.textContent; label.textContent='Preparing PDF…';
   const originalPage=document.querySelector('.book-page');
   if(!originalPage){printWin.close();btn.disabled=false;label.textContent=oldLabel;alert('Book content is not ready yet.');return;}
   let pages=[], advanced=0;
   try{
     // Capture every rendered page in the currently selected language.
     while(true){
       await sleep(90);
       const article=document.querySelector('.book-page');
       if(article) pages.push(article.cloneNode(true));
       const next=getNext();
       if(!next||next.disabled)break;
       next.click(); advanced++; await sleep(560);
       if(advanced>500)break;
       label.textContent='Preparing '+(pages.length+1)+' pages…';
     }
     // Restore the reader to the page where the user started.
     for(let i=0;i<advanced;i++){const prev=getPrev();if(prev&&!prev.disabled){prev.click();await sleep(520);}}
     const styles=[...document.querySelectorAll('style,link[rel="stylesheet"]')].map(n=>n.outerHTML).join('\n');
     const theme=document.documentElement.getAttribute('data-theme')||'light';
     const pageMarkup=pages.map((p,i)=>'<section class="pdf-page">'+p.innerHTML+'<div class="pdf-footer">Applied Chemistry · BTEUP Diploma · '+(i+1)+' / '+pages.length+'</div></section>').join('');
     printWin.document.open();
     printWin.document.write('<!doctype html><html lang="en" data-theme="'+theme+'"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Applied Chemistry - Complete Units</title>'+styles+
     '<style>body{background:#fff!important;color:#222!important;margin:0!important;padding:0!important;font-family:Arial,"Noto Sans Devanagari",sans-serif!important;font-size:12pt!important;line-height:1.55!important}.pdf-page{position:relative;background:#fff!important;color:#222!important;border:0!important;border-radius:0!important;box-shadow:none!important;transform:none!important;overflow:visible!important;padding:12mm 13mm!important;page-break-after:always;break-after:page;min-height:250mm}.pdf-page:last-child{page-break-after:auto;break-after:auto}.pdf-page *{max-width:100%;overflow-wrap:anywhere}.pdf-page h1,.pdf-page h2,.pdf-page h3{page-break-after:avoid;break-after:avoid}.pdf-page p,.pdf-page li,.pdf-page table,.pdf-page svg{break-inside:avoid}.pdf-page .no-print{display:none!important}.pdf-footer{margin-top:18px;padding-top:8px;border-top:1px solid #ddd;text-align:center;font-size:9pt;color:#666}.pdf-page .book-page{border:0!important;box-shadow:none!important}.pdf-page .prose-book p,.pdf-page .prose-book li,.pdf-page table.btable td{color:#222!important}@page{size:A4;margin:0} @media screen{body{background:#eee!important}.pdf-page{max-width:210mm;margin:12px auto;box-shadow:0 2px 12px #bbb!important}} </style></head><body>'+pageMarkup+
     '<script>window.onload=function(){setTimeout(function(){window.focus();window.print();},700)};<\/script></body></html>');
     printWin.document.close();
     label.textContent='PDF ready — Save as PDF';
   }catch(err){try{printWin.close()}catch(e){} alert('PDF generation failed. Please try again.');}
   finally{setTimeout(()=>{btn.disabled=false;label.textContent=oldLabel;},2500);}
 });
})();
</script>
