<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Agriculture Engineering - Second Year</title><link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet"><style>:root{--bg:#f4f5f9;--surface:#fff;--primary:#198754;--light:#d1e7dd;--text:#1e293b;--border:#e2e8f0}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text)}.app{min-height:100vh;padding:8px}.toggle{background:#e2e8f0;border-radius:25px;padding:3px;display:flex;gap:3px;margin-bottom:8px}.toggle button{flex:1;border:0;background:transparent;padding:7px;font-size:.7rem;font-weight:700;border-radius:22px;color:#64748b}.toggle button.active{background:var(--primary);color:#fff}.grid{display:grid;grid-template-columns:1fr;gap:6px}@media(min-width:768px){.grid{grid-template-columns:repeat(2,1fr)}}@media(min-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}}.cardx{background:#fff;border:1px solid var(--border);border-radius:8px;padding:9px;cursor:pointer;display:flex;gap:9px;align-items:center}.ico{width:32px;height:32px;border-radius:7px;background:var(--light);color:var(--primary);display:grid;place-items:center}.hidden{display:none!important}.resource-head{font-size:.72rem;font-weight:800;margin:10px 2px 5px}.resource-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:9px;display:flex;gap:9px;align-items:center}.resource-card a{margin-left:auto;color:#fff;background:var(--primary);padding:4px 9px;border-radius:5px;text-decoration:none;font-size:.6rem}.folder{margin-bottom:10px}.folder-title{font-size:.7rem;font-weight:800;color:#475569;padding:5px 2px}.video-box{position:relative;padding-bottom:56.25%;height:0;background:#000;border-radius:7px;overflow:hidden}.video-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.playlist{background:#fff;border:1px solid var(--border);border-radius:7px;padding:8px;margin-top:6px;cursor:pointer}.playlist.active{background:var(--light);border-color:var(--primary)}@media(min-width:992px){.lecture-grid{display:grid;grid-template-columns:3fr 1fr;gap:8px}}.back{border:0;background:transparent;color:var(--primary);font-weight:800;font-size:.7rem;margin-bottom:6px}.notice{font-size:.6rem;color:#64748b;background:#fff;border:1px solid var(--border);padding:8px;border-radius:7px;margin-top:6px}</style></head><body><div class="app"><div id="subjectsView"><div class="d-flex justify-content-between align-items-center mb-2"><div><h6 class="mb-0 fw-bold">Agriculture Engineering</h6><small class="text-muted">Second Year Portal (Sem 3 & Sem 4)</small></div><span class="badge bg-success">2026</span></div><div class="toggle"><button id="b3" class="active" onclick="switchSem(3)">Third Semester</button><button id="b4" onclick="switchSem(4)">Fourth Semester</button></div><div class="grid" id="subjects"></div><div class="resource-head">Study Resources</div><div class="grid"><div class="resource-card" onclick="openResources('important')"><div class="ico"><i class="fas fa-star"></i></div><div><b style="font-size:.7rem">Important Questions</b><br><small class="text-muted">Semester-wise important questions PDF</small></div></div><div class="resource-card" onclick="openResources('short')"><div class="ico"><i class="fas fa-note-sticky"></i></div><div><b style="font-size:.7rem">Short Notes</b><br><small class="text-muted">Quick revision notes</small></div></div></div></div><div id="resourcesView" class="hidden"><button class="back" onclick="history.back()"><i class="fas fa-arrow-left"></i> Back</button><h6 id="resourceTitle" class="fw-bold"></h6><div id="resourceContent"></div></div><div id="lectureView" class="hidden"><button class="back" onclick="history.back()"><i class="fas fa-arrow-left"></i> Back</button><div class="lecture-grid"><div><div class="video-box"><iframe id="player" allowfullscreen></iframe></div><div class="notice"><b id="vtitle"></b><br><span id="vdesc"></span><div class="mt-2"><a id="pdf" class="btn btn-success btn-sm" style="font-size:.6rem" target="_blank"><i class="fas fa-file-pdf"></i> PDF Notes</a></div></div></div><div><h6 style="font-size:.7rem">Lectures List</h6><div id="playlist"></div></div></div></div></div><script>
const cd='https://player.cloudinary.com/embed/?cloud_name=h7g2sxct&public_id=VID_20260812_101229_651';
const data={sem3:{soilMechanics:'Soil Mechanics',hydraulics:'Hydraulics',farmPowerAndMachinery:'Farm Power and Machinery',materialAndRuralConstruction:'Material and Rural Construction Technology',surveyingAndLeveling:'Surveying and Leveling',agricultureAndSoilSciences:'Agriculture and Soil Sciences'},sem4:{protectedCultivation:'Protected Cultivation Technology',irrigationAndDrainage:'Irrigation and Drainage Engineering',engineeringDrawing:'Engineering Drawing',farmMechanisation:'Farm Mechanisation and Land Development',strengthOfMaterial:'Strength of Material'}};
const important={sem3:[['Surveying and Levelling Important Questions','https://drive.google.com/open?id=1t-PlFv6WLyvquOcZsjCQudbzJd-cUuiz&usp=drive_copy'],['Soil Mechanics Important Questions','https://drive.google.com/open?id=1yN0gppvhftKBpMUzXqltL4XbPW5WhQ6x&usp=drive_copy'],['Material and Rural Construction Technology Important Questions','https://drive.google.com/open?id=1LNeFe58JtmJHCutjPrzIBO2zpNfcH4JD&usp=drive_copy'],['Hydraulics Important Questions','https://drive.google.com/open?id=1Zye2lEB4uWpcbvl5BWoZ3SjBld_RDzzM&usp=drive_copy'],['Farm Power and Machinery Important Questions','https://drive.google.com/open?id=16ICbkxMLUIPogrrhLOi9WXbe2-VZ_46g&usp=drive_copy'],['Agriculture and Soil Sciences Important Questions','https://drive.google.com/open?id=15FhaMLthqNEE8VU8cYZA0EXwE7Mqc-zh&usp=drive_copy']],sem4:[['Strength of Material Important Questions','https://drive.google.com/open?id=1dtEodJ1alehjeObXeXi718sZJGItlEpo&usp=drive_copy'],['Protected Cultivation Technology Important Questions','https://drive.google.com/open?id=1AuZ_HhmNz2Xni8h5JMKM5405zpxID-cv&usp=drive_copy'],['Irrigation and Drainage Important Questions','https://drive.google.com/open?id=1OyeuDh2X0HrxESEbRbqPNmm0swvcEHar&usp=drive_copy'],['Farm Mechanisation and Land Important Questions','https://drive.google.com/open?id=11j7hd1nPkceUyNOMmmTqHbh-bZjg7j-5&usp=drive_copy']]};let sem=3;
function hideAll(){subjectsView.classList.add('hidden');lectureView.classList.add('hidden');resourcesView.classList.add('hidden')}function showSubjects(){hideAll();subjectsView.classList.remove('hidden')}function switchSem(s){sem=s;b3.classList.toggle('active',s===3);b4.classList.toggle('active',s===4);render()}function render(){subjects.innerHTML=Object.entries(data['sem'+sem]).map(([k,v])=>`<div class="cardx" onclick="openSubject('${k}')"><div class="ico"><i class="fas fa-seedling"></i></div><div><b style="font-size:.72rem">${v}</b><br><small class="text-muted">2 Lectures & Notes</small></div></div>`).join('')}
function openSubject(k){history.pushState({v:'lecture'},'', '#lecture');hideAll();lectureView.classList.remove('hidden');let title=data['sem'+sem][k];let vids=[{title:'1. '+title+' | Introduction',desc:'Important concepts and fundamentals.',url:cd,pdf:'#'},{title:'2. '+title+' | Important Topics',desc:'Important topics and exam preparation.',url:cd,pdf:'#'}];player.src=vids[0].url;vtitle.textContent=vids[0].title;vdesc.textContent=vids[0].desc;pdf.href=vids[0].pdf;playlist.innerHTML=vids.map((x,i)=>`<div class="playlist ${i===0?'active':''}" onclick="player.src=vids[${i}].url;vtitle.textContent=vids[${i}].title;vdesc.textContent=vids[${i}].desc;document.querySelectorAll('.playlist').forEach(e=>e.classList.remove('active'));this.classList.add('active')"><b>${x.title}</b><br><small>Lecture</small></div>`).join('')}
function openResources(type){history.pushState({v:'resources'},'', '#resources');hideAll();resourcesView.classList.remove('hidden');resourceTitle.textContent=type==='important'?'Important Questions':'Short Notes';if(type==='short'){resourceContent.innerHTML='<div class="notice text-center">Short Notes अभी उपलब्ध नहीं हैं। जल्द add किए जाएंगे।</div>';return}resourceContent.innerHTML=['sem3','sem4'].map(sk=>`<div class="folder"><div class="folder-title">${sk==='sem3'?'Third Semester':'Fourth Semester'}</div>${important[sk].map(x=>`<div class="resource-card mb-1"><div class="ico"><i class="fas fa-file-pdf"></i></div><div><b style="font-size:.65rem">${x[0]}</b><br><small class="text-muted">Diploma Engineers</small></div><a href="${x[1]}" target="_blank">Open PDF</a></div>`).join('')}</div>`).join('')}
window.addEventListener('popstate',showSubjects);render();
</script></body></html>
