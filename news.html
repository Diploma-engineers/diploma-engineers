<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Diploma Engineers News</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
    -webkit-text-size-adjust:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#172033;
    min-height:100vh;
}

/* =========================
   MAIN CONTAINER
========================= */

.news-page{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:18px;
}

/* =========================
   TOP TITLE
========================= */

.news-top{
    background:linear-gradient(
        135deg,
        #0d6efd,
        #6610f2
    );

    color:#fff;

    padding:22px;

    border-radius:18px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    margin-bottom:22px;

    box-shadow:
        0 10px 30px rgba(13,110,253,.20);
}

.news-top h1{
    font-size:26px;
    line-height:1.3;
}

.news-top h1 i{
    margin-right:8px;
}

.home-btn{
    text-decoration:none;

    background:#fff;

    color:#0d6efd;

    padding:11px 16px;

    border-radius:10px;

    font-weight:700;

    white-space:nowrap;
}

.home-btn:hover{
    background:#eef5ff;
}

/* =========================
   PAGE TITLE
========================= */

.page-title{
    background:#fff;

    padding:20px;

    border-radius:16px;

    margin-bottom:20px;

    border:1px solid #e5eaf1;

    text-align:center;
}

.page-title h2{
    font-size:24px;

    margin-bottom:6px;
}

.page-title p{
    color:#6b7280;

    font-size:14px;
}

/* =========================
   NEWS GRID
========================= */

#newsList{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:20px;
}

/* =========================
   NEWS CARD
========================= */

.news-card{
    background:#fff;

    border-radius:18px;

    overflow:hidden;

    border:1px solid #e5eaf1;

    box-shadow:
        0 7px 22px rgba(20,40,80,.07);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.news-card:hover{
    transform:translateY(-3px);

    box-shadow:
        0 14px 32px rgba(20,40,80,.12);
}

/* =========================
   THUMBNAIL
========================= */

.thumbnail-box{
    width:100%;

    height:230px;

    background:#edf2f7;

    overflow:hidden;

    position:relative;
}

.thumbnail-box img{
    width:100%;

    height:100%;

    object-fit:cover;

    display:block;
}

.no-image{
    width:100%;

    height:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    gap:8px;

    color:#8b95a5;

    font-size:15px;
}

.no-image i{
    font-size:40px;
}

/* =========================
   CONTENT
========================= */

.news-content{
    padding:18px;
}

.category{
    display:inline-flex;

    align-items:center;

    gap:6px;

    background:#eaf3ff;

    color:#0d6efd;

    padding:6px 10px;

    border-radius:20px;

    font-size:12px;

    font-weight:700;

    margin-bottom:10px;
}

.news-title{
    font-size:20px;

    line-height:1.35;

    margin-bottom:8px;

    color:#172033;
}

.news-date{
    color:#7a8494;

    font-size:12px;

    margin-bottom:13px;

    display:flex;

    align-items:center;

    gap:6px;
}

.news-description{
    font-size:14px;

    line-height:1.65;

    color:#4b5563;

    white-space:pre-wrap;

    word-break:break-word;

    margin-bottom:15px;
}

/* =========================
   BUTTONS
========================= */

.news-actions{
    display:flex;

    flex-wrap:wrap;

    gap:8px;

    border-top:1px solid #edf0f4;

    padding-top:14px;
}

.news-btn{
    border:0;

    text-decoration:none;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    padding:9px 12px;

    border-radius:9px;

    font-size:12px;

    font-weight:700;

    cursor:pointer;
}

.pdf-btn{
    background:#fff0f1;

    color:#dc3545;
}

.link-btn{
    background:#edf5ff;

    color:#0d6efd;
}

.share-btn{
    background:#eef8f1;

    color:#198754;
}

.copy-btn{
    background:#f1f3f5;

    color:#495057;
}

/* =========================
   SHARE AREA
========================= */

.share-area{
    display:none;

    margin-top:10px;

    padding:12px;

    background:#f8fafc;

    border-radius:10px;

    border:1px solid #e8edf3;
}

.share-area.show{
    display:flex;
}

.share-area button,
.share-area a{
    width:34px;

    height:34px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    text-decoration:none;

    border:0;

    cursor:pointer;

    font-size:15px;
}

.whatsapp{
    background:#25D366;
    color:#fff;
}

.telegram{
    background:#229ED9;
    color:#fff;
}

.facebook{
    background:#1877F2;
    color:#fff;
}

.native-share{
    background:#111827;
    color:#fff;
}

/* =========================
   LOADING
========================= */

.loading{
    grid-column:1/-1;

    background:#fff;

    padding:45px 20px;

    text-align:center;

    border-radius:16px;

    border:1px solid #e5eaf1;

    color:#6b7280;
}

.loading i{
    font-size:30px;

    color:#0d6efd;

    margin-bottom:12px;
}

/* =========================
   ERROR
========================= */

.error-box{
    grid-column:1/-1;

    background:#fff;

    padding:30px;

    text-align:center;

    border-radius:16px;

    border:1px solid #f1c7cb;

    color:#dc3545;
}

.error-box i{
    font-size:35px;

    margin-bottom:10px;
}

/* =========================
   EMPTY
========================= */

.empty{
    grid-column:1/-1;

    background:#fff;

    padding:40px 20px;

    text-align:center;

    border-radius:16px;

    color:#6b7280;

    border:1px dashed #cbd5e1;
}

.empty i{
    display:block;

    font-size:38px;

    margin-bottom:10px;

    color:#94a3b8;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){

    #newsList{
        grid-template-columns:1fr;
    }

}

@media(max-width:600px){

    .news-page{
        padding:10px;
    }

    .news-top{
        padding:16px;

        flex-direction:column;

        align-items:stretch;

        text-align:center;
    }

    .news-top h1{
        font-size:21px;
    }

    .home-btn{
        text-align:center;
    }

    .page-title{
        padding:16px;
    }

    .page-title h2{
        font-size:21px;
    }

    .thumbnail-box{
        height:210px;
    }

    .news-content{
        padding:15px;
    }

    .news-title{
        font-size:18px;
    }

    .news-actions{
        display:grid;

        grid-template-columns:
            repeat(2,1fr);
    }

    .news-btn{
        width:100%;
    }

}

/* =========================
   EXTRA SMALL
========================= */

@media(max-width:380px){

    .news-actions{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>


<div class="news-page">


<!-- =========================
     TITLE
========================= -->

<div class="news-top">

    <h1>

        <i class="fa-solid fa-newspaper"></i>

        Diploma Engineers News

    </h1>


    <a href="aa.html"
       class="home-btn">

        <i class="fa-solid fa-house"></i>

        Home

    </a>

</div>


<!-- =========================
     PAGE TITLE
========================= -->

<div class="page-title">

    <h2>
        Latest News
    </h2>

    <p>
        Diploma Engineers की सभी Latest Updates
    </p>

</div>


<!-- =========================
     NEWS LIST
========================= -->

<div id="newsList">

    <div class="loading">

        <i class="fa-solid fa-spinner fa-spin"></i>

        <p>
            Loading News...
        </p>

    </div>

</div>


</div>


<script type="module">


/* =====================================================
   FIREBASE IMPORT
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


import {
    getDatabase,
    ref,
    onValue
}
from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";



/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyAbg1Q1ZPgF7mwaxyin7iglla01eDk_tKo",

    authDomain:
    "diplomaengineers-869df.firebaseapp.com",

    databaseURL:
    "https://diplomaengineers-869df-default-rtdb.firebaseio.com",

    projectId:
    "diplomaengineers-869df",

    storageBucket:
    "diplomaengineers-869df.appspot.com",

    messagingSenderId:
    "356779436080",

    appId:
    "1:356779436080:web:4b28da380e547420d0e5f5"

};



/* =====================================================
   FIREBASE INITIALIZE
===================================================== */

const app =
initializeApp(firebaseConfig);


const db =
getDatabase(app);



/* =====================================================
   NEWS LIST
===================================================== */

const newsList =
document.getElementById("newsList");



/* =====================================================
   HTML SECURITY
===================================================== */

function escapeHTML(value){

    return String(value ?? "")

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}



/* =====================================================
   VALID URL
===================================================== */

function validURL(value){

    try{

        const url =
        new URL(value);

        return (
            url.protocol === "http:" ||
            url.protocol === "https:"
        );

    }

    catch{

        return false;

    }

}



/* =====================================================
   LOAD NEWS
===================================================== */

function loadNews(){

    const newsRef =
    ref(db,"news");


    onValue(

        newsRef,

        snapshot => {

            newsList.innerHTML = "";


            if(!snapshot.exists()){

                newsList.innerHTML = `

                    <div class="empty">

                        <i class="fa-regular fa-newspaper"></i>

                        <h3>No News Available</h3>

                        <p>
                            अभी कोई Latest News उपलब्ध नहीं है।
                        </p>

                    </div>

                `;

                return;

            }


            const newsArray = [];


            snapshot.forEach(child => {

                newsArray.push({

                    id:child.key,

                    data:child.val() || {}

                });

            });



            /* Latest First */

            newsArray.reverse();



            newsArray.forEach(item => {

                createNewsCard(

                    item.id,

                    item.data

                );

            });

        },


        error => {

            console.error(error);


            newsList.innerHTML = `

                <div class="error-box">

                    <i class="fa-solid fa-triangle-exclamation"></i>

                    <h3>Unable to Load News</h3>

                    <p>
                        Firebase Database से news load नहीं हो सकी।
                    </p>

                </div>

            `;

        }

    );

}



/* =====================================================
   CREATE NEWS CARD
===================================================== */

function createNewsCard(id,n){

    const title =
    n.title || "Untitled News";


    const description =
    n.text ||
    n.desc ||
    n.description ||
    "";


    const category =
    n.cat ||
    n.category ||
    "News";


    const date =
    n.date ||
    "";


    const image =
    n.thumb ||
    n.image ||
    n.thumbnail ||
    "";


    const pdf =
    n.pdf ||
    n.fileUrl ||
    n.file ||
    "";


    const externalLink =
    n.link ||
    "";


    const linkText =
    n.linkText ||
    "Read More";



    let imageHTML = "";



    if(

        image &&
        validURL(image)

    ){

        imageHTML = `

            <img

                src="${escapeHTML(image)}"

                alt="${escapeHTML(title)}"

                loading="lazy"

                onerror="this.parentElement.innerHTML=
                '<div class=&quot;no-image&quot;><i class=&quot;fa-regular fa-image&quot;></i><span>Image unavailable</span></div>'"

            >

        `;

    }

    else{

        imageHTML = `

            <div class="no-image">

                <i class="fa-regular fa-image"></i>

                <span>No Thumbnail</span>

            </div>

        `;

    }



    let actionHTML = "";



    /* PDF */

    if(

        pdf &&
        validURL(pdf)

    ){

        actionHTML += `

            <a

                href="${escapeHTML(pdf)}"

                target="_blank"

                rel="noopener"

                class="news-btn pdf-btn"

            >

                <i class="fa-solid fa-file-pdf"></i>

                PDF / File

            </a>

        `;

    }



    /* External Link */

    if(

        externalLink &&
        validURL(externalLink)

    ){

        actionHTML += `

            <a

                href="${escapeHTML(externalLink)}"

                target="_blank"

                rel="noopener"

                class="news-btn link-btn"

            >

                <i class="fa-solid fa-arrow-up-right-from-square"></i>

                ${escapeHTML(linkText)}

            </a>

        `;

    }



    /* Share */

    actionHTML += `

        <button

            class="news-btn share-btn"

            onclick="toggleShare('${id}')"

        >

            <i class="fa-solid fa-share-nodes"></i>

            Share

        </button>

    `;



    /* Copy */

    actionHTML += `

        <button

            class="news-btn copy-btn"

            onclick="copyNews('${id}')"

        >

            <i class="fa-regular fa-copy"></i>

            Copy

        </button>

    `;



    const card = document.createElement("article");


    card.className =
    "news-card";


    card.id =
    "news-" + id;



    card.innerHTML = `

        <div class="thumbnail-box">

            ${imageHTML}

        </div>


        <div class="news-content">


            <div class="category">

                <i class="fa-solid fa-tag"></i>

                ${escapeHTML(category)}

            </div>



            <h2 class="news-title">

                ${escapeHTML(title)}

            </h2>



            <div class="news-date">

                <i class="fa-regular fa-calendar"></i>

                ${escapeHTML(date)}

            </div>



            <div class="news-description">

                ${escapeHTML(description)}

            </div>



            <div class="news-actions">

                ${actionHTML}

            </div>



            <div

                class="share-area"

                id="share-${id}"

            >

                <a

                    class="whatsapp"

                    href="#"

                    onclick="shareWhatsApp('${id}');return false;"

                    title="WhatsApp"

                >

                    <i class="fa-brands fa-whatsapp"></i>

                </a>



                <a

                    class="telegram"

                    href="#"

                    onclick="shareTelegram('${id}');return false;"

                    title="Telegram"

                >

                    <i class="fa-brands fa-telegram"></i>

                </a>



                <a

                    class="facebook"

                    href="#"

                    onclick="shareFacebook('${id}');return false;"

                    title="Facebook"

                >

                    <i class="fa-brands fa-facebook-f"></i>

                </a>



                <button

                    class="native-share"

                    onclick="nativeShare('${id}')"

                    title="More Share Options"

                >

                    <i class="fa-solid fa-share-nodes"></i>

                </button>

            </div>


        </div>

    `;



    newsList.appendChild(card);

}



/* =====================================================
   GET NEWS DATA FROM CARD
===================================================== */

function getNewsData(id){

    const card =
    document.getElementById("news-"+id);


    if(!card){

        return null;

    }


    const title =
    card.querySelector(".news-title")
        ?.innerText || "";


    const description =
    card.querySelector(".news-description")
        ?.innerText || "";


    return {

        title,

        description,

        url:
        window.location.href.split("#")[0]
        + "#news-"+id

    };

}



/* =====================================================
   SHARE TOGGLE
===================================================== */

window.toggleShare =
function(id){

    const box =
    document.getElementById("share-"+id);


    if(!box){

        return;

    }


    box.classList.toggle("show");

};



/* =====================================================
   WHATSAPP SHARE
===================================================== */

window.shareWhatsApp =
function(id){

    const data =
    getNewsData(id);


    if(!data){

        return;

    }


    const text =
    data.title +
    "\n\n" +
    data.description +
    "\n\n" +
    data.url;


    const url =
    "https://wa.me/?text=" +
    encodeURIComponent(text);


    window.open(

        url,

        "_blank"

    );

};



/* =====================================================
   TELEGRAM SHARE
===================================================== */

window.shareTelegram =
function(id){

    const data =
    getNewsData(id);


    if(!data){

        return;

    }


    const url =
    "https://t.me/share/url?url=" +
    encodeURIComponent(data.url) +
    "&text=" +
    encodeURIComponent(data.title);


    window.open(

        url,

        "_blank"

    );

};



/* =====================================================
   FACEBOOK SHARE
===================================================== */

window.shareFacebook =
function(id){

    const data =
    getNewsData(id);


    if(!data){

        return;

    }


    const url =
    "https://www.facebook.com/sharer/sharer.php?u=" +
    encodeURIComponent(data.url);


    window.open(

        url,

        "_blank",

        "width=600,height=500"

    );

};



/* =====================================================
   NATIVE SHARE
===================================================== */

window.nativeShare =
async function(id){

    const data =
    getNewsData(id);


    if(!data){

        return;

    }


    if(navigator.share){

        try{

            await navigator.share({

                title:data.title,

                text:data.description,

                url:data.url

            });

        }

        catch(error){

            console.log(error);

        }

    }

    else{

        copyNews(id);

    }

};



/* =====================================================
   COPY NEWS
===================================================== */

window.copyNews =
async function(id){

    const data =
    getNewsData(id);


    if(!data){

        return;

    }


    const text =
    data.title +
    "\n\n" +
    data.description +
    "\n\n" +
    data.url;


    try{

        await navigator.clipboard.writeText(text);


        alert("News copied successfully.");

    }

    catch(error){

        prompt(

            "Copy News:",

            text

        );

    }

};



/* =====================================================
   START
===================================================== */

loadNews();


</script>


</body>

</html>
