/* ===========================

#loader{

/* Background Grid */

#loader::before{

position:absolute;

width:100%;
height:100%;

background:
linear-gradient(rgba(0,0,0,.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(0,0,0,.03) 1px, transparent 1px);

.loader-box{

position:relative;

}

.logo-box{

position:relative;
width:180px;
height:180px;
margin:auto;
display:flex;
align-items:center;
justify-content:center;

}

.logo-box img{

width:90px;

border-radius:50%;
background:#fff;
padding:4px;
object-fit:cover;
z-index:2;

}

/* Ring */

.ring{

position:absolute;
width:170px;
height:170px;
border-radius:50%;
border:5px solid transparent;

border-right:5px solid #ff9800;
border-bottom:5px solid #7c4dff;
animation:spin 2s linear infinite;

}

@keyframes spin{

.progress-bar{

height:100%;
width:0;
background:linear-gradient(90deg,#0d6efd,#7c4dff,#ff9800);
animation:loading 3s linear forwards;

}

@keyframes loading{

0%{
width:0%;
}

100%{

}

}

.loader-box small{
