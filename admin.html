<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diploma Engineers Admin</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
}

.container{
max-width:900px;
margin:20px auto;
padding:15px;
}

.card{
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
margin-bottom:20px;
}

h2,h3{
margin-bottom:15px;
}

input,
textarea,
select{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
}

textarea{
height:120px;
resize:vertical;
}

button{
padding:12px 18px;
border:none;
border-radius:8px;
background:#0d6efd;
color:#fff;
cursor:pointer;
font-size:15px;
}

button:hover{
background:#0b5ed7;
}

.logout{
background:#dc3545;
margin-left:10px;
}

.logout:hover{
background:#bb2d3b;
}

label{
font-weight:bold;
display:block;
margin-top:12px;
}

#preview{
display:none;
width:220px;
height:140px;
object-fit:cover;
border:1px solid #ddd;
border-radius:10px;
margin:10px 0;
}

.news-item{
display:flex;
gap:15px;
padding:15px 0;
border-bottom:1px solid #ddd;
}

.news-item img{
width:160px;
height:100px;
object-fit:cover;
border-radius:10px;
}

.news-content{
flex:1;
}

.small{
font-size:13px;
color:#666;
margin:6px 0;
}

#adminPanel{
display:none;
}

@media(max-width:700px){

.news-item{
flex-direction:column;
}

.news-item img{
width:100%;
height:200px;
}

button{
width:100%;
margin-top:10px;
}

.logout{
margin-left:0;
}

}

</style>

</head>

<body>

<div class="container">

<div class="card" id="loginBox">

<h2>Admin Login</h2>

<input
id="email"
type="email"
placeholder="Enter Email">

<input
id="password"
type="password"
placeholder="Enter Password">

<button id="loginBtn">

Login

</button>

</div>

<div id="adminPanel">

<div class="card">

<h2>Publish News</h2>

<input
id="title"
placeholder="News Title">

<textarea
id="desc"
placeholder="Description"></textarea>

<label>
Upload Thumbnail
</label>

<input
type="file"
id="thumb"
accept="image/*">

<img
id="preview">

<label>
Attach PDF / File
</label>

<input
type="file"
id="pdf"
accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip">

<!-- NEW -->
<label>
External Link (Optional)
</label>

<input
type="url"
id="link"
placeholder="https://example.com">

<select id="cat">

<option>News</option>
  
<option>Notice</option>
  
<option>Result</option>

<option>Admission</option>

<option>Scholarship</option>

<option>Job</option>

</select>

<button id="publishBtn">
Publish News
</button>

<button
class="logout"
id="logoutBtn">
Logout
</button>

</div>

<div class="card">

<h3>Published News</h3>

<div id="list">

Loading...

</div>

</div>

</div>

</div>

<script type="module">


  //==============================
// FIREBASE IMPORT
//==============================

import{

auth,
db,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut,
ref,
push,
set,
onValue,
remove

}

from "./firebase.js";


//==============================
// ELEMENTS
//==============================

const loginBox=document.getElementById("loginBox");

const adminPanel=document.getElementById("adminPanel");

const list=document.getElementById("list");

const title=document.getElementById("title");

const desc=document.getElementById("desc");

const thumb=document.getElementById("thumb");

const pdf=document.getElementById("pdf");

// NEW
const link=document.getElementById("link");

const cat=document.getElementById("cat");

const preview=document.getElementById("preview");

const publishBtn=document.getElementById("publishBtn");

const logoutBtn=document.getElementById("logoutBtn");

const loginBtn=document.getElementById("loginBtn");

const email=document.getElementById("email");

const password=document.getElementById("password");

let imageUrl="";

let fileUrl="";


//==============================
// IMAGE PREVIEW
//==============================

thumb.onchange=()=>{

const file=thumb.files[0];

if(!file){

preview.style.display="none";

return;

}

preview.src=URL.createObjectURL(file);

preview.style.display="block";

};


//==============================
// CLOUDINARY SETTINGS
//==============================

const CLOUD_NAME="ub0qgzwa";

const UPLOAD_PRESET="news_upload";


//==============================
// CLOUDINARY UPLOAD
//==============================

async function uploadCloudinary(file){

if(!file) return "";

const formData=new FormData();

formData.append("file",file);

formData.append("upload_preset",UPLOAD_PRESET);

const response=await fetch(

`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`,

{

method:"POST",

body:formData

}

);

const data=await response.json();

console.log(data);

if(!response.ok || data.error){

throw new Error(

data.error?.message || "Cloudinary Upload Failed"

);

}

return data.secure_url;

}


//==============================
// ADMIN LOGIN
//==============================

loginBtn.onclick=async()=>{

if(email.value.trim()===""){

alert("Enter Email");

return;

}

if(password.value.trim()===""){

alert("Enter Password");

return;

}

loginBtn.disabled=true;

loginBtn.innerHTML="Logging in...";

try{

await signInWithEmailAndPassword(

auth,

email.value.trim(),

password.value

);

}

catch(error){

alert(error.message);

}

loginBtn.disabled=false;

loginBtn.innerHTML="Login";

};

//==============================
// AUTH STATE
//==============================

onAuthStateChanged(auth,(user)=>{

if(user){

loginBox.style.display="none";

adminPanel.style.display="block";

loadNews();

}

else{

loginBox.style.display="block";

adminPanel.style.display="none";

}

});


//==============================
// PUBLISH NEWS
//==============================

publishBtn.onclick=async()=>{

if(title.value.trim()===""){

alert("Enter News Title");

title.focus();

return;

}

publishBtn.disabled=true;

publishBtn.innerHTML="Uploading...";

try{

imageUrl="";

fileUrl="";

// Upload Thumbnail

if(thumb.files.length>0){

imageUrl=await uploadCloudinary(
thumb.files[0]
);

}

// Upload PDF / File

if(pdf.files.length>0){

fileUrl=await uploadCloudinary(
pdf.files[0]
);

}

// Save News

const newsRef=push(ref(db,"news"));

await set(newsRef,{

title:title.value.trim(),

desc:desc.value.trim(),

thumb:imageUrl,

pdf:fileUrl,

link:link.value.trim(), // NEW

cat:cat.value,

date:new Date().toLocaleString()

});

// Success

alert("News Published Successfully");

// Reset Form

title.value="";

desc.value="";

thumb.value="";

pdf.value="";

link.value=""; // NEW

cat.selectedIndex=0;

preview.src="";

preview.style.display="none";

imageUrl="";

fileUrl="";

}

catch(error){

console.error(error);

alert(error.message);

}

finally{

publishBtn.disabled=false;

publishBtn.innerHTML="Publish News";

}

};


//==============================
// LOAD NEWS
//==============================

function loadNews(){

const newsRef=ref(db,"news");

onValue(newsRef,(snapshot)=>{

list.innerHTML="";

if(!snapshot.exists()){

list.innerHTML="<h3>No News Available</h3>";

return;

}

let html="";

snapshot.forEach((child)=>{

const n=child.val();

html+=`

<div class="news-item">

${n.thumb?`

<img
src="${n.thumb}"
alt="Thumbnail">

`:""}

<div class="news-content">

<h3>${n.title}</h3>

<div class="small">

${n.cat} | ${n.date}

</div>

<p>${n.desc}</p>

${n.thumb?`

<a
href="${n.thumb}"
target="_blank">

🖼 Open Image

</a>

<br><br>

`:""}

${n.pdf?`

<a
href="${n.pdf}"
target="_blank">

📄 Open File

</a>

<br><br>

`:""}

${n.link?`

<a
href="${n.link}"
target="_blank">

🔗 Open Link

</a>

<br><br>

`:""}

<button
onclick="deleteNews('${child.key}')">

Delete

</button>

</div>

</div>

`;

});

list.innerHTML=html;

});

}

//==============================
// DELETE NEWS
//==============================

window.deleteNews=async(id)=>{

const ok=confirm("Delete this news?");

if(!ok) return;

try{

await remove(ref(db,"news/"+id));

alert("News Deleted");

}

catch(error){

alert(error.message);

}

};


//==============================
// LOGOUT
//==============================

logoutBtn.onclick=()=>{

signOut(auth);

};


//==============================
// END SCRIPT
//==============================

</script>

</body>

</html>
