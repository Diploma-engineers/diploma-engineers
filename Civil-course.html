<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civil Engineering Portal</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* =========================================================
           GLOBAL STYLES & RESET
        ========================================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #1e3a8a;
            --primary-light: #3b82f6;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-red: #ef4444;
            --accent-gold: #f59e0b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* =========================================================
           HEADER & NAVIGATION
        ========================================================= */
        header {
            background-color: var(--primary-color);
            color: #fff;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-back {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.25rem;
            cursor: pointer;
            margin-right: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .header-back:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .header-title {
            font-size: 1.2rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* =========================================================
           PAGE CONTAINERS & ROUTING
        ========================================================= */
        main {
            flex: 1;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* =========================================================
           SUBJECT PAGE (DASHBOARD)
        ========================================================= */
        .stats-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            flex: 1;
            background: var(--card-bg);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .stat-card h4 {
            font-size: 1.8rem;
            color: var(--primary-color);
        }

        .stat-card p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
        }

        .subject-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 1.25rem;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .subject-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .subject-icon {
            font-size: 1.8rem;
            color: var(--primary-light);
            margin-bottom: 0.75rem;
        }

        .subject-card h3 {
            font-size: 1.1rem;
            margin-bottom: 0.25rem;
        }

        .subject-card p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .subject-arrow {
            position: absolute;
            right: 1.25rem;
            bottom: 1.25rem;
            color: var(--text-muted);
        }

        /* =========================================================
           PLAYLIST PAGE
        ========================================================= */
        .playlist-header {
            margin-bottom: 1.5rem;
            background: var(--card-bg);
            padding: 1.25rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .playlist-header h2 {
            margin-bottom: 0.5rem;
            color: var(--primary-color);
        }

        .playlist-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .lecture-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .lecture-item {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem;
            text-align: left;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s;
        }

        .lecture-item:hover {
            background: #f1f5f9;
        }

        .lecture-thumb {
            position: relative;
            width: 105px;
            height: 65px;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
            margin-right: 1rem;
            background: #000;
        }

        .lecture-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumb-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .play-circle {
            width: 28px;
            height: 28px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            font-size: 0.75rem;
        }

        .lecture-info {
            flex: 1;
        }

        .lecture-number {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary-light);
            text-transform: uppercase;
        }

        .lecture-name {
            font-size: 0.95rem;
            font-weight: 600;
            margin: 0.2rem 0;
            color: var(--text-dark);
        }

        .lecture-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .lecture-chevron {
            color: var(--text-muted);
            padding: 0 0.5rem;
        }

        .empty {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        .empty i {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        /* =========================================================
           PLAYER PAGE
        ========================================================= */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-loading {
            position: absolute;
            inset: 0;
            background: #0f172a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .video-loading.hidden {
            display: none;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin-bottom: 0.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .video-details {
            background: var(--card-bg);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 1rem;
        }

        .video-details .badge {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary-light);
        }

        .video-details h2 {
            font-size: 1.25rem;
            margin: 0.25rem 0;
        }

        .video-details p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Interactive Bar */
        .action-bar {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .action-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 0.5rem 0.85rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: #e2e8f0;
        }

        .action-btn.liked {
            color: var(--accent-red);
            border-color: var(--accent-red);
            background: #fef2f2;
        }

        /* Nav Controls */
        .nav-controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .nav-btn {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
        }

        .nav-btn.next {
            text-align: right;
        }

        .nav-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .nav-btn-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: block;
        }

        .nav-btn-title {
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        /* Card sections */
        .interactive-card {
            background: var(--card-bg);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 1rem;
        }

        .interactive-card h4 {
            font-size: 0.95rem;
            margin-bottom: 0.75rem;
        }

        .stars {
            display: flex;
            gap: 0.5rem;
        }

        .star {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #cbd5e1;
            cursor: pointer;
        }

        .star.active {
            color: var(--accent-gold);
        }

        .comment-box {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .comment-box input {
            flex: 1;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
        }

        .comment-box button {
            background: var(--primary-color);
            color: #fff;
            border: none;
            padding: 0 1rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .comment {
            background: var(--bg-color);
            padding: 0.6rem 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .comment-date {
            font-size: 0.7rem;
            color: var(--text-muted);
            display: block;
            margin-top: 0.2rem;
        }

        /* =========================================================
           TOAST NOTIFICATION
        ========================================================= */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(15, 23, 42, 0.9);
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            font-size: 0.85rem;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <button class="header-back" idheaderBack" id="headerBack">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <div class="header-title" id="headerCourseTitle">Civil Engineering</div>
    </header>

    <main>
        <!-- PAGE 1: SUBJECT DASHBOARD -->
        <section id="subjectPage" class="page active">
            <div class="stats-bar">
                <div class="stat-card">
                    <h4 id="subjectCount">0</h4>
                    <p>Subjects</p>
                </div>
                <div class="stat-card">
                    <h4 id="lectureCount">0</h4>
                    <p>Total Lectures</p>
                </div>
            </div>
            <div class="subject-grid" id="subjectGrid"></div>
        </section>

        <!-- PAGE 2: PLAYLIST VIEW -->
        <section id="playlistPage" class="page">
            <div class="playlist-header">
                <h2 id="playlistSubjectTitle">Subject Title</h2>
                <p id="playlistSubjectDescription">Subject description goes here...</p>
            </div>
            <div class="lecture-list" id="lectureList"></div>
        </section>

        <!-- PAGE 3: VIDEO PLAYER VIEW -->
        <section id="playerPage" class="page">
            <div class="video-container">
                <div id="videoLoading" class="video-loading">
                    <div class="spinner"></div>
                    <span>Loading Lecture...</span>
                </div>
                <iframe id="cloudinaryPlayer" allow="autoplay; fullscreen" allowfullscreen></iframe>
            </div>

            <div class="video-details">
                <span class="badge" id="videoNumber">LECTURE 01</span>
                <h2 id="videoTitle">Lecture Title</h2>
                <p id="videoSubtitle">Subject Name</p>

                <div class="action-bar">
                    <button class="action-btn" id="likeBtn" onclick="toggleLike()">
                        <i class="fa-regular fa-heart"></i> Like
                    </button>
                    <button class="action-btn" onclick="downloadPDF()">
                        <i class="fa-solid fa-file-pdf"></i> PDF Notes
                    </button>
                    <button class="action-btn" onclick="focusRating()">
                        <i class="fa-regular fa-star"></i> Rate
                    </button>
                    <button class="action-btn" onclick="focusComment()">
                        <i class="fa-regular fa-comment"></i> Comment
                    </button>
                </div>
            </div>

            <div class="nav-controls">
                <button class="nav-btn" id="prevBtn" onclick="previousLecture()">
                    <span class="nav-btn-label"><i class="fa-solid fa-chevron-left"></i> Previous</span>
                    <span class="nav-btn-title" id="prevTitle">None</span>
                </button>
                <button class="nav-btn next" id="nextBtn" onclick="nextLecture()">
                    <span class="nav-btn-label">Next <i class="fa-solid fa-chevron-right"></i></span>
                    <span class="nav-btn-title" id="nextTitle">None</span>
                </button>
            </div>

            <div class="interactive-card" id="ratingCard">
                <h4>Rate this Lecture</h4>
                <div class="stars" id="stars">
                    <button class="star" data-rating="1"><i class="fa-solid fa-star"></i></button>
                    <button class="star" data-rating="2"><i class="fa-solid fa-star"></i></button>
                    <button class="star" data-rating="3"><i class="fa-solid fa-star"></i></button>
                    <button class="star" data-rating="4"><i class="fa-solid fa-star"></i></button>
                    <button class="star" data-rating="5"><i class="fa-solid fa-star"></i></button>
                </div>
            </div>

            <div class="interactive-card" id="commentCard">
                <h4>Discussion</h4>
                <div class="comment-box">
                    <input type="text" id="commentInput" placeholder="Ask a question or leave a note...">
                    <button onclick="submitComment()">Post</button>
                </div>
                <div class="comments-list" id="commentsList"></div>
            </div>
        </section>
    </main>

    <!-- Global Toast Notification -->
    <div id="toast" class="toast">Notification Message</div>

    <!-- Application Logic -->
    <script>
        /* =========================================================
           CONFIG & DATA STRUCTURE
        ========================================================= */
        const CLOUDINARY_CONFIG = {
            cloudName: "YOUR_CLOUD_NAME", // Replace with your actual Cloudinary Cloud Name
            playerBase: "https://player.cloudinary.com/embed/"
        };

        const SUBJECTS = [
            {
                id: "soil",
                title: "Soil Mechanics",
                description: "Study of physical properties and behavior of soil under engineering stress.",
                icon: "fa-mountain"
            },
            {
                id: "hydraulics",
                title: "Hydraulics & Fluid Mechanics",
                description: "Principles of fluid behavior, pressure, and open channel fluid flow.",
                icon: "fa-water"
            },
            {
                id: "highway",
                title: "Highway Engineering",
                description: "Planning, geometric design, and structural evaluation of modern roads.",
                icon: "fa-road"
            }
        ];

        const LECTURES = {
            "soil": [
                {
                    id: "soil-1",
                    title: "Introduction to Soil Mechanics",
                    duration: "18:45",
                    publicId: "civil/soil/introduction",
                    thumbnail: "https://res.cloudinary.com/YOUR_CLOUD_NAME/video/upload/so_2/civil/soil/introduction.jpg",
                    pdf: "#"
                },
                {
                    id: "soil-2",
                    title: "Physical Properties of Soil",
                    duration: "24:30",
                    publicId: "civil/soil/soil-properties",
                    thumbnail: "https://res.cloudinary.com/YOUR_CLOUD_NAME/video/upload/so_2/civil/soil/soil-properties.jpg",
                    pdf: "#"
                }
            ],
            "hydraulics": [
                {
                    id: "hydraulics-1",
                    title: "Introduction to Hydraulics",
                    duration: "22:10",
                    publicId: "civil/hydraulics/introduction",
                    thumbnail: "https://res.cloudinary.com/YOUR_CLOUD_NAME/video/upload/so_2/civil/hydraulics/introduction.jpg",
                    pdf: "#"
                },
                {
                    id: "hydraulics-2",
                    title: "Hydrostatic Pressure",
                    duration: "25:00",
                    publicId: "civil/hydraulics/hydrostatic-pressure",
                    thumbnail: "https://res.cloudinary.com/YOUR_CLOUD_NAME/video/upload/so_2/civil/hydraulics/hydrostatic-pressure.jpg",
                    pdf: "#"
                }
            ],
            "highway": [
                {
                    id: "highway-1",
                    title: "Introduction to Highway Engineering",
                    duration: "17:50",
                    publicId: "civil/highway/introduction",
                    thumbnail: "https://res.cloudinary.com/YOUR_CLOUD_NAME/video/upload/so_2/civil/highway/introduction.jpg",
                    pdf: "#"
                },
                {
                    id: "highway-2",
                    title: "Geometric Design of Highways",
                    duration: "29:15",
                    publicId: "civil/highway/geometric-design",
                    thumbnail: "https://res.cloudinary.com/YOUR_CLOUD_NAME/video/upload/so_2/civil/highway/geometric-design.jpg",
                    pdf: "#"
                }
            ]
        };

        /* =========================================================
           APP STATE
        ========================================================= */
        let currentSubjectId = null;
        let currentLectures = [];
        let currentIndex = -1;

        let likedLectures = {};
        let userRatings = {};
        let userComments = {};

        /* =========================================================
           DOM ELEMENTS
        ========================================================= */
        const headerBack = document.getElementById("headerBack");
        const headerCourseTitle = document.getElementById("headerCourseTitle");

        const subjectPage = document.getElementById("subjectPage");
        const playlistPage = document.getElementById("playlistPage");
        const playerPage = document.getElementById("playerPage");

        const subjectGrid = document.getElementById("subjectGrid");
        const subjectCountEl = document.getElementById("subjectCount");
        const lectureCountEl = document.getElementById("lectureCount");

        const playlistSubjectTitle = document.getElementById("playlistSubjectTitle");
        const playlistSubjectDescription = document.getElementById("playlistSubjectDescription");
        const lectureList = document.getElementById("lectureList");

        const cloudinaryPlayer = document.getElementById("cloudinaryPlayer");
        const videoLoading = document.getElementById("videoLoading");
        const videoNumber = document.getElementById("videoNumber");
        const videoTitle = document.getElementById("videoTitle");
        const videoSubtitle = document.getElementById("videoSubtitle");

        const likeBtn = document.getElementById("likeBtn");
        const ratingCard = document.getElementById("ratingCard");
        const starsContainer = document.getElementById("stars");
        const commentCard = document.getElementById("commentCard");
        const commentInput = document.getElementById("commentInput");
        const commentsList = document.getElementById("commentsList");

        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const prevTitle = document.getElementById("prevTitle");
        const nextTitle = document.getElementById("nextTitle");

        const toast = document.getElementById("toast");

        /* =========================================================
           INIT
        ========================================================= */
        function init() {
            renderSubjects();
            updateDashboardStats();
            setupStars();
            setupHeaderBack();
        }

        /* =========================================================
           RENDER SUBJECTS
        ========================================================= */
        function renderSubjects() {
            subjectGrid.innerHTML = "";

            SUBJECTS.forEach(subject => {
                const count = LECTURES[subject.id] ? LECTURES[subject.id].length : 0;

                const card = document.createElement("div");
                card.className = "subject-card";
                card.onclick = () => openPlaylist(subject.id);

                card.innerHTML = `
                    <div class="subject-icon">
                        <i class="fa-solid ${subject.icon}"></i>
                    </div>
                    <h3>${subject.title}</h3>
                    <p>${count} Lectures</p>
                    <div class="subject-arrow">
                        <i class="fa-solid fa-chevron-right"></i>
                    </div>
                `;

                subjectGrid.appendChild(card);
            });
        }

        function updateDashboardStats() {
            subjectCountEl.textContent = SUBJECTS.length;

            let totalLectures = 0;
            Object.keys(LECTURES).forEach(key => {
                totalLectures += LECTURES[key].length;
            });

            lectureCountEl.textContent = totalLectures;
        }

        /* =========================================================
           NAVIGATION & ROUTING
        ========================================================= */
        function switchPage(activePage) {
            [subjectPage, playlistPage, playerPage].forEach(p => p.classList.remove("active"));
            activePage.classList.add("active");
            window.scrollTo(0, 0);
        }

        function setupHeaderBack() {
            headerBack.onclick = goBack;
        }

        function goBack() {
            if (playerPage.classList.contains("active")) {
                cloudinaryPlayer.src = "";
                switchPage(playlistPage);
                const currentSub = SUBJECTS.find(s => s.id === currentSubjectId);
                headerCourseTitle.textContent = currentSub ? currentSub.title : "Civil Engineering";
            } else if (playlistPage.classList.contains("active")) {
                switchPage(subjectPage);
                headerCourseTitle.textContent = "Civil Engineering";
            }
        }

        /* =========================================================
           PLAYLIST PAGE
        ========================================================= */
        function openPlaylist(subjectId) {
            const subject = SUBJECTS.find(s => s.id === subjectId);
            if (!subject) return;

            currentSubjectId = subjectId;
            currentLectures = LECTURES[subjectId] || [];

            playlistSubjectTitle.textContent = subject.title;
            playlistSubjectDescription.textContent = subject.description;
            headerCourseTitle.textContent = subject.title;

            renderLectures();
            switchPage(playlistPage);
        }

        function renderLectures() {
            lectureList.innerHTML = "";

            if (currentLectures.length === 0) {
                lectureList.innerHTML = `
                    <div class="empty">
                        <i class="fa-solid fa-folder-open"></i>
                        <p>No lectures available for this subject yet.</p>
                    </div>
                `;
                return;
            }

            currentLectures.forEach((lecture, index) => {
                const item = document.createElement("button");
                item.className = "lecture-item";
                item.onclick = () => openPlayer(index);

                item.innerHTML = `
                    <div class="lecture-thumb">
                        <img src="${lecture.thumbnail}" alt="${lecture.title}" onerror="this.src='https://via.placeholder.com/105x65?text=Video'">
                        <div class="thumb-overlay">
                            <div class="play-circle">
                                <i class="fa-solid fa-play"></i>
                            </div>
                        </div>
                    </div>
                    <div class="lecture-info">
                        <div class="lecture-number">Lecture ${String(index + 1).padStart(2, '0')}</div>
                        <div class="lecture-name">${lecture.title}</div>
                        <div class="lecture-meta">
                            <span><i class="fa-regular fa-clock"></i> ${lecture.duration}</span>
                        </div>
                    </div>
                    <div class="lecture-chevron">
                        <i class="fa-solid fa-chevron-right"></i>
                    </div>
                `;

                lectureList.appendChild(item);
            });
        }

        /* =========================================================
           VIDEO PLAYER PAGE
        ========================================================= */
        function openPlayer(index) {
            if (index < 0 || index >= currentLectures.length) return;

            currentIndex = index;
            const lecture = currentLectures[currentIndex];
            const subject = SUBJECTS.find(s => s.id === currentSubjectId);

            videoNumber.textContent = `LECTURE ${String(currentIndex + 1).padStart(2, '0')}`;
            videoTitle.textContent = lecture.title;
            videoSubtitle.textContent = subject ? subject.title : "Civil Engineering";
            headerCourseTitle.textContent = lecture.title;

            // Video loading state
            videoLoading.classList.remove("hidden");
            const embedUrl = `${CLOUDINARY_CONFIG.playerBase}?cloud_name=${CLOUDINARY_CONFIG.cloudName}&public_id=${encodeURIComponent(lecture.publicId)}&player[autoplay]=true`;
            cloudinaryPlayer.src = embedUrl;

            cloudinaryPlayer.onload = () => {
                videoLoading.classList.add("hidden");
            };

            updateInteractiveState();
            updateNavigationControls();
            switchPage(playerPage);
        }

        function updateNavigationControls() {
            if (currentIndex > 0) {
                prevBtn.classList.remove("disabled");
                prevTitle.textContent = currentLectures[currentIndex - 1].title;
            } else {
                prevBtn.classList.add("disabled");
                prevTitle.textContent = "None";
            }

            if (currentIndex < currentLectures.length - 1) {
                nextBtn.classList.remove("disabled");
                nextTitle.textContent = currentLectures[currentIndex + 1].title;
            } else {
                nextBtn.classList.add("disabled");
                nextTitle.textContent = "None";
            }
        }

        function previousLecture() {
            if (currentIndex > 0) {
                openPlayer(currentIndex - 1);
            }
        }

        function nextLecture() {
            if (currentIndex < currentLectures.length - 1) {
                openPlayer(currentIndex + 1);
            }
        }

        /* =========================================================
           INTERACTIVE FEATURES (LIKE, RATING, COMMENT, PDF)
        ========================================================= */
        function updateInteractiveState() {
            const lecture = currentLectures[currentIndex];
            if (!lecture) return;

            // Like status
            if (likedLectures[lecture.id]) {
                likeBtn.classList.add("liked");
                likeBtn.querySelector("i").className = "fa-solid fa-heart";
            } else {
                likeBtn.classList.remove("liked");
                likeBtn.querySelector("i").className = "fa-regular fa-heart";
            }

            // Rating
            const rating = userRatings[lecture.id] || 0;
            highlightStars(rating);

            // Comments
            commentInput.value = "";
            renderComments();
        }

        function toggleLike() {
            const lecture = currentLectures[currentIndex];
            if (!lecture) return;

            likedLectures[lecture.id] = !likedLectures[lecture.id];
            updateInteractiveState();

            showToast(likedLectures[lecture.id] ? "Saved to liked lectures" : "Removed from likes");
        }

        function setupStars() {
            const starBtns = starsContainer.querySelectorAll(".star");
            starBtns.forEach(btn => {
                btn.onclick = () => {
                    const r = parseInt(btn.getAttribute("data-rating"));
                    const lecture = currentLectures[currentIndex];
                    if (!lecture) return;

                    userRatings[lecture.id] = r;
                    highlightStars(r);
                    showToast(`Rated ${r} / 5 Stars`);
                };
            });
        }

        function highlightStars(rating) {
            const starBtns = starsContainer.querySelectorAll(".star");
            starBtns.forEach(btn => {
                const r = parseInt(btn.getAttribute("data-rating"));
                if (r <= rating) {
                    btn.classList.add("active");
                } else {
                    btn.classList.remove("active");
                }
            });
        }

        function submitComment() {
            const text = commentInput.value.trim();
            if (!text) return;

            const lecture = currentLectures[currentIndex];
            if (!lecture) return;

            if (!userComments[lecture.id]) {
                userComments[lecture.id] = [];
            }

            userComments[lecture.id].unshift({
                text: text,
                date: "Just now"
            });

            commentInput.value = "";
            renderComments();
            showToast("Comment posted!");
        }

        function renderComments() {
            commentsList.innerHTML = "";
            const lecture = currentLectures[currentIndex];
            if (!lecture) return;

            const list = userComments[lecture.id] || [];

            list.forEach(c => {
                const div = document.createElement("div");
                div.className = "comment";
                div.innerHTML = `
                    <div>${escapeHtml(c.text)}</div>
                    <span class="comment-date">${c.date}</span>
                `;
                commentsList.appendChild(div);
            });
        }

        function downloadPDF() {
            const lecture = currentLectures[currentIndex];
            if (!lecture) return;

            if (lecture.pdf && lecture.pdf !== "#") {
                window.open(lecture.pdf, "_blank");
            } else {
                showToast("PDF notes not available for this lecture yet.");
            }
        }

        function focusComment() {
            commentCard.scrollIntoView({ behavior: 'smooth' });
            commentInput.focus();
        }

        function focusRating() {
            ratingCard.scrollIntoView({ behavior: 'smooth' });
        }

        /* =========================================================
           UTILITIES
        ========================================================= */
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add("show");

            setTimeout(() => {
                toast.classList.remove("show");
            }, 2500);
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        // Start application when DOM is ready
        document.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
