<div class="result-container-wrapper">
    <div class="bg-circle circle1"></div>
    <div class="bg-circle circle2"></div>

    <div class="card">
        <div class="category-tabs" role="tablist" aria-label="Select card type">
            <button type="button" class="tab-btn active" id="admitTab" onclick="selectCardType('admit')">
                <i class="fa-solid fa-id-card"></i> Admit Card
            </button>
            <button type="button" class="tab-btn" id="verificationTab" onclick="selectCardType('verification')">
                <i class="fa-solid fa-file-circle-check"></i> Verification Card
            </button>
        </div>

<div class="icon">
            <i class="fa-solid fa-id-card-clip"></i>
        </div>

        <h2 id="admitPortalTitle">BTEUP Admit Card</h2>
        <p id="admitPortalDesc">
            Enter your Enrollment Number to open your official BTEUP Admit Card.
        </p>

        <div class="input-box">
            <i class="fa-solid fa-id-card"></i>
            <input type="text" id="admitEnroll" placeholder="Enrollment Number" autocomplete="off">
        </div>

        <button class="action-btn generate-btn" id="generateBtn" onclick="generateAdmitCard()">
            <i class="fa-solid fa-link"></i> Generate & Open Admit Card
        </button>

        <div class="success" id="admitMsg">
            ✅ Admit Card Link Generated Successfully
        </div>

        <button class="action-btn view" id="admitOpenBtn" onclick="openAdmitCard()">
            <i class="fa-solid fa-arrow-up-right-from-square"></i> Open Admit Card
        </button>

        <div class="footer">
            Developed by <b>DIPLOMA ENGINEERS</b>
        </div>
    </div>
</div>

<style>
.result-container-wrapper {
    background: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 20px; position: relative; overflow: hidden; width: 100%;
}
.result-container-wrapper .bg-circle { position: absolute; border-radius: 50%; filter: blur(90px); z-index: 0; }
.result-container-wrapper .circle1 { width: 260px; height: 260px; background: #2563eb; top: -80px; left: -80px; opacity: .20; }
.result-container-wrapper .circle2 { width: 260px; height: 260px; background: #22c55e; bottom: -80px; right: -80px; opacity: .20; }
.result-container-wrapper .card { position: relative; z-index: 1; width: 100%; max-width: 440px; background: #fff; padding: 30px 25px; border-radius: 28px; box-shadow: 0 15px 40px rgba(0,0,0,.08); border: 1px solid #e2e8f0; text-align: center; }
.result-container-wrapper .category-tabs { display: flex; background: #f1f5f9; border-radius: 14px; padding: 5px; margin-bottom: 20px; gap: 5px; }
.result-container-wrapper .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; background: transparent; color: #64748b; transition: .3s; }
.result-container-wrapper .tab-btn.active { background: #2563eb; color: #fff; box-shadow: 0 4px 12px rgba(37,99,235,.25); }
.result-container-wrapper .icon { width: 75px; height: 75px; margin: auto; border-radius: 20px; background: #eff6ff; display: flex; justify-content: center; align-items: center; font-size: 30px; color: #2563eb; margin-bottom: 15px; }
.result-container-wrapper h2 { font-size: 26px; color: #0f172a; margin-bottom: 8px; }
.result-container-wrapper p { font-size: 13px; color: #64748b; line-height: 1.6; margin-bottom: 20px; }
.result-container-wrapper .input-box { position: relative; margin-bottom: 16px; }
.result-container-wrapper .input-box i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #64748b; }
.result-container-wrapper input { width: 100%; padding: 14px 14px 14px 45px; border-radius: 14px; border: 1px solid #cbd5e1; background: #f8fafc; font-size: 14px; outline: none; transition: .3s; }
.result-container-wrapper input:focus { border-color: #2563eb; background: #fff; }
.result-container-wrapper button.action-btn { width: 100%; padding: 14px; border: none; border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer; transition: .3s; }
.result-container-wrapper .generate-btn { background: #2563eb; color: #fff; }
.result-container-wrapper .generate-btn:hover { background: #1d4ed8; }
.result-container-wrapper .view { display: none; background: #16a34a; color: #fff; margin-top: 12px; }
.result-container-wrapper .view.active { display: block; }
.result-container-wrapper .view:hover { background: #15803d; }
.result-container-wrapper .success { display: none; margin-top: 14px; padding: 12px; background: #ecfdf5; border: 1px solid #bbf7d0; border-radius: 14px; color: #15803d; font-size: 13px; }
.result-container-wrapper .success.active { display: block; }
.result-container-wrapper .footer { margin-top: 18px; font-size: 12px; color: #94a3b8; }
</style>

<script>
(function() {
    let selectedCardType = "admit";
    let generatedCardURL = "";

    const enrollInput = document.getElementById("admitEnroll");
    const title = document.getElementById("admitPortalTitle");
    const desc = document.getElementById("admitPortalDesc");
    const generateBtn = document.getElementById("generateBtn");
    const openBtn = document.getElementById("admitOpenBtn");
    const message = document.getElementById("admitMsg");

    window.selectCardType = function(type) {
        selectedCardType = type;
        generatedCardURL = "";

        document.getElementById("admitTab").classList.toggle("active", type === "admit");
        document.getElementById("verificationTab").classList.toggle("active", type === "verification");

        if (type === "verification") {
            title.textContent = "BTEUP Verification Card";
            desc.textContent = "Enter your Enrollment Number to open your official BTEUP Verification Card.";
            generateBtn.innerHTML = '<i class="fa-solid fa-link"></i> Generate & Open Verification Card';
            openBtn.innerHTML = '<i class="fa-solid fa-arrow-up-right-from-square"></i> Open Verification Card';
        } else {
            title.textContent = "BTEUP Admit Card";
            desc.textContent = "Enter your Enrollment Number to open your official BTEUP Admit Card.";
            generateBtn.innerHTML = '<i class="fa-solid fa-link"></i> Generate & Open Admit Card';
            openBtn.innerHTML = '<i class="fa-solid fa-arrow-up-right-from-square"></i> Open Admit Card';
        }

        message.classList.remove("active");
        openBtn.classList.remove("active");
    };

    window.generateAdmitCard = function() {
        const enroll = enrollInput.value.trim().toUpperCase();

        if (!enroll) {
            alert("Please Enter Enrollment Number");
            enrollInput.focus();
            return;
        }

        const page = selectedCardType === "verification" ? "VerificationCard.aspx" : "AdmitCard.aspx";
        generatedCardURL = "https://bteup.ac.in/ESeva/Student/" + page + "?EnrollNumber=" + encodeURIComponent(enroll);

        message.textContent = selectedCardType === "verification"
            ? "✅ Verification Card Link Generated Successfully"
            : "✅ Admit Card Link Generated Successfully";
        message.classList.add("active");
        openBtn.classList.add("active");

        const opened = window.open(generatedCardURL, "_blank");
        if (!opened) {
            alert("Popup blocked. Please click the Open button.");
        }
    };

    window.openAdmitCard = function() {
        if (generatedCardURL) {
            window.open(generatedCardURL, "_blank");
        } else {
            alert("Enter Enrollment Number and Generate the Link First");
        }
    };

    enrollInput.addEventListener("keydown", function(e) {
        if (e.key === "Enter") window.generateAdmitCard();
    });
})();
</script>
