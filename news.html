<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diploma Engineers | Latest Notifications</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #f1f5f9;
      color: #333;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 0 15px;
    }

    /* MAIN CARD CONTAINER STYLE (AS IN IMAGE) */
    .notifications-card {
      background: #ffffff;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .notifications-card > h2 {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 24px;
      color: #0f172a;
      margin-bottom: 20px;
    }

    .notifications-card > h2 i {
      background: #eff6ff;
      color: #2563eb;
      padding: 12px;
      border-radius: 14px;
      font-size: 20px;
    }

    /* INDIVIDUAL NOTICE ITEM STYLE */
    .notice-item {
      background: #fffbeb;
      border-left: 5px solid #f59e0b;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .notice-item h3 {
      font-size: 18px;
      color: #1e293b;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .notice-item h3 i {
      color: #d97706;
      font-size: 16px;
    }

    .notice-item p {
      font-size: 14px;
      color: #475569;
      line-height: 1.6;
      margin-bottom: 10px;
      white-space: pre-wrap;
    }

    .notice-date {
      font-size: 12px;
      color: #64748b;
      font-weight: 500;
    }

    .no-data {
      text-align: center;
      padding: 30px;
      color: #64748b;
      font-size: 15px;
    }

    @media(max-width: 600px) {
      .notifications-card {
        padding: 15px;
      }
      .notice-item {
        padding: 15px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Diploma Engineers Portal</h1>
    <p>Live Notifications & Updates</p>
  </header>

  <div class="container">
    <div class="notifications-card">
      <h2>
        <i class="fa-solid fa-bell"></i> Notifications
      </h2>
      
      <!-- Yeh div database se live data fetch karke dikhayega -->
      <div id="publicNoticeList">
        <div class="no-data">Loading notifications...</div>
      </div>
    </div>
  </div>

  <!-- FIREBASE & DISPLAY SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAbg1Q1ZPgF7mwaxyin7iglla01eDk_tKo",
      authDomain: "diplomaengineers-869df.firebaseapp.com",
      databaseURL: "https://diplomaengineers-869df-default-rtdb.firebaseio.com",
      projectId: "diplomaengineers-869df",
      storageBucket: "diplomaengineers-869df.appspot.com",
      messagingSenderId: "356779436080",
      appId: "1:356779436080:web:4b28da380e547420d0e5f5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const noticeListDiv = document.getElementById("publicNoticeList");

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Database se 'notifications' node ka data fetch karna
    const noticeRef = ref(db, "notifications");
    onValue(noticeRef, (snapshot) => {
      noticeListDiv.innerHTML = "";

      if (!snapshot.exists()) {
        noticeListDiv.innerHTML = '<div class="no-data">No notifications available right now.</div>';
        return;
      }

      let html = "";
      const data = snapshot.val();
      
      // Object ki keys ko reverse karke latest notification sabse upar dikhana
      const keys = Object.keys(data).reverse();

      keys.forEach((key) => {
        const item = data[key];
        html += `
          <div class="notice-item">
            <h3><i class="fa-solid fa-bell"></i> ${escapeHtml(item.title)}</h3>
            <p>${escapeHtml(item.text)}</p>
            <div class="notice-date">${escapeHtml(item.date)}</div>
          </div>
        `;
      });

      noticeListDiv.innerHTML = html;
    });
  </script>

</body>
</html>
