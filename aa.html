<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Diploma Engineers • Purchase Approval</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Poppins,Arial,sans-serif}.wrap{max-width:1150px;margin:auto;padding:18px}.top{background:#fff;border-radius:18px;padding:18px 20px;box-shadow:0 8px 28px rgba(0,0,0,.07);display:flex;justify-content:space-between;align-items:center;gap:15px}.brand h1{margin:0;font-size:22px}.brand p{margin:5px 0 0;color:#667085;font-size:12px}.btn{border:0;border-radius:10px;padding:11px 15px;font:700 13px Poppins;cursor:pointer}.refresh{background:#eef2ff;color:#3730a3}.danger{background:#fee2e2;color:#b91c1c}.notice{margin:14px 0;padding:12px 14px;border-radius:12px;background:#fff7ed;color:#9a3412;font-size:12px}.notice.ok{background:#ecfdf3;color:#166534}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0}.stat{background:#fff;border-radius:14px;padding:15px;box-shadow:0 5px 20px rgba(0,0,0,.05)}.stat b{display:block;font-size:12px;color:#667085}.stat span{font-size:25px;font-weight:800}.pending span{color:#d97706}.verified span{color:#16a34a}.rejected span{color:#dc2626}.tabs{display:flex;gap:8px;margin:14px 0}.tab{background:#fff;border:1px solid #e2e8f0;color:#334155}.tab.active{background:#111827;color:#fff}.request{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 6px 24px rgba(0,0,0,.06)}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.user{display:flex;align-items:center;gap:13px}.avatar{width:60px;height:60px;border-radius:50%;overflow:hidden;background:#e8eef8;display:grid;place-items:center;font-weight:800;font-size:21px;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.course{font-size:17px;font-weight:800}.muted{font-size:12px;color:#667085}.amount{background:#ecfdf3;color:#15803d;border-radius:9px;padding:7px 11px;font-weight:800;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.item{background:#f8fafc;border-radius:10px;padding:11px}.item b{display:block;font-size:10px;color:#667085;margin-bottom:4px}.item span{font-size:13px;font-weight:600;word-break:break-word}.utr{font-size:18px!important;letter-spacing:1px;color:#7c3aed!important}.actions{display:flex;gap:10px}.approve{background:#16a34a;color:#fff;flex:1}.reject{background:#fee2e2;color:#b91c1c}.course-link{background:#eff6ff;color:#1d4ed8;flex:1}.empty{text-align:center;padding:42px;background:#fff;border-radius:18px;color:#667085}.error{background:#fef2f2;color:#991b1b;padding:16px;border-radius:14px}.small{font-size:11px;opacity:.85}@media(max-width:700px){.wrap{padding:10px}.top,.head{align-items:flex-start;flex-direction:column}.stats,.grid{grid-template-columns:1fr}.actions{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <h1><i class="fa-solid fa-shield-halved"></i> Purchase Approval</h1>
      <p>Diploma Engineers • ₹99 UPI / UTR verification</p>
    </div>
    <button class="btn refresh" id="refreshBtn"><i class="fa-solid fa-rotate"></i> Refresh</button>
  </div>

  <div id="notice" class="notice">Connecting to Firebase...</div>
  <div class="stats">
    <div class="stat pending"><b>Pending</b><span id="pendingCount">0</span></div>
    <div class="stat verified"><b>Verified</b><span id="verifiedCount">0</span></div>
    <div class="stat rejected"><b>Rejected</b><span id="rejectedCount">0</span></div>
  </div>
  <div class="tabs">
    <button class="btn tab active" data-filter="pending">Pending</button>
    <button class="btn tab" data-filter="verified">Verified</button>
    <button class="btn tab" data-filter="rejected">Rejected</button>
  </div>
  <div id="list"><div class="empty"><i class="fa-solid fa-spinner fa-spin"></i> Loading purchase requests...</div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getDatabase, ref, onValue, get, update, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyCxe9H7zSxJQzgM8bN_UAdOnDHr5myH6CQ",
  authDomain:"diploma-app-9a378.firebaseapp.com",
  databaseURL:"https://diploma-app-9a378-default-rtdb.firebaseio.com",
  projectId:"diploma-app-9a378",
  storageBucket:"diploma-app-9a378.firebasestorage.app",
  messagingSenderId:"160233059797",
  appId:"1:160233059797:web:be38130ed64f8bd0afb95c"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
const COURSE_FILES={
 "civil-year-2-course":"civil-year-2-course.html",
 "mechanical-year-2-course":"mechanical-year-2-course.html",
 "cs-year-2-course":"cs-year-2-course.html",
 "it-year-2-course":"it-year-2-course.html",
 "electrical-year-2-course":"electrical-year-2-course.html",
 "electronics-year-2-course":"electronics-year-2-course.html",
 "agriculture-year-2-course":"agriculture-year-2-course.html",
 "chemical-year-2-course":"chemical-year-2-course.html"
};
let rows=[],filter="pending",stopListening=null;
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>'"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':'&quot;'}[m]));
const fmt=v=>v?new Date(Number(v)).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"}):"-";
function courseFile(id){return COURSE_FILES[id]||""}

function setNotice(text,ok=false){$('notice').className='notice'+(ok?' ok':'');$('notice').innerHTML=text}

function render(){
  const counts={pending:0,verified:0,rejected:0};
  rows.forEach(x=>{const s=String(x.status||'pending').toLowerCase();if(counts[s]!==undefined)counts[s]++});
  $('pendingCount').textContent=counts.pending;$('verifiedCount').textContent=counts.verified;$('rejectedCount').textContent=counts.rejected;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));
  const data=rows.filter(x=>String(x.status||'pending').toLowerCase()===filter);
  if(!data.length){$('list').innerHTML=`<div class="empty"><i class="fa-solid fa-circle-check" style="font-size:28px"></i><p>No ${filter} requests.</p></div>`;return}
  $('list').innerHTML=data.map(d=>{
    const name=d.name||'Engineer',branch=d.branch||'Diploma Member',pic=d.profilePic||'';
    const avatar=pic?`<img src="${esc(pic)}" alt="Profile">`:esc((name.trim()[0]||'E').toUpperCase());
    const file=courseFile(d.courseId);
    return `<article class="request">
      <div class="head"><div class="user"><div class="avatar">${avatar}</div><div><div class="course">${esc(d.courseName||d.courseId)}</div><div class="muted">${esc(name)} • ${esc(branch)} • ${esc(d.email||'-')}</div></div></div><div class="amount">₹${esc(d.amount||99)}</div></div>
      <div class="grid">
        <div class="item"><b>NAME</b><span>${esc(name)}</span></div><div class="item"><b>BRANCH</b><span>${esc(branch)}</span></div><div class="item"><b>MOBILE</b><span>${esc(d.mobile||'-')}</span></div>
        <div class="item"><b>COURSE</b><span>${esc(d.courseName||d.courseId)}</span></div><div class="item"><b>UTR</b><span class="utr">${esc(d.utr||'-')}</span></div><div class="item"><b>SUBMITTED</b><span>${esc(fmt(d.submittedAt))}</span></div>
      </div>
      <div class="actions">${filter==='pending'?`
        <button class="btn approve" data-action="approve" data-uid="${esc(d.uid)}" data-course="${esc(d.courseId)}" data-key="${esc(d.purchaseKey)}"><i class="fa-solid fa-circle-check"></i> Approve Payment & Give Access</button>
        <button class="btn reject" data-action="reject" data-uid="${esc(d.uid)}" data-course="${esc(d.courseId)}" data-key="${esc(d.purchaseKey)}"><i class="fa-solid fa-xmark"></i> Reject</button>`:
        `<button class="btn course-link" data-file="${esc(file)}" ${file?'':'disabled'}><i class="fa-solid fa-file-code"></i> ${file?'Open Course File':'Course File Not Mapped'}</button>`}</div>
    </article>`;
  }).join('');
}

async function start(){
  if(stopListening)stopListening();
  setNotice('<i class="fa-solid fa-spinner fa-spin"></i> Connecting to Firebase...');
  try{
    if(!auth.currentUser) await signInAnonymously(auth);
  }catch(e){
    console.error(e);
    setNotice('Firebase Authentication error: '+esc(e.message));
    $('list').innerHTML='<div class="error"><b>Admin connection failed.</b><br><span class="small">Enable Anonymous Authentication in Firebase Console → Authentication → Sign-in method.</span></div>';
    return;
  }
  stopListening=onValue(ref(db,'utrPurchases'),snap=>{
    const out=[];
    if(snap.exists()){
      snap.forEach(uidSnap=>{
        uidSnap.forEach(courseSnap=>{
          courseSnap.forEach(purchaseSnap=>{
            const d=purchaseSnap.val()||{};
            out.push({uid:uidSnap.key,courseId:courseSnap.key,purchaseKey:purchaseSnap.key,...d});
          });
        });
      });
    }
    rows=out.sort((a,b)=>(Number(b.submittedAt)||0)-(Number(a.submittedAt)||0));
    setNotice('Firebase connected • Showing live UTR requests. Check the student UTR in your UPI/bank app before approving.',true);
    render();
  },err=>{
    console.error(err);
    setNotice('Firebase error: '+esc(err.message));
    $('list').innerHTML='<div class="error"><b>Purchase requests could not be loaded.</b><br><span class="small">Your current Rules require authentication. This page signs in anonymously automatically; enable Anonymous Authentication in Firebase Console.</span></div>';
  });
}

async function approve(uid,courseId,key){
  if(!confirm('Confirm that the ₹99 payment and UTR are genuine. Approve this purchase?'))return;
  try{
    const purchaseRef=ref(db,`utrPurchases/${uid}/${courseId}/${key}`),snap=await get(purchaseRef);
    if(!snap.exists())throw new Error('Purchase request not found.');
    const d=snap.val()||{},now=Date.now();
    await update(purchaseRef,{status:'verified',verified:true,verifiedAt:now,verifiedBy:'manual-admin-page'});
    await set(ref(db,`courseAccess/${uid}/${courseId}`),{uid,courseId,courseName:d.courseName||courseId,amount:Number(d.amount)||99,currency:'INR',utr:d.utr||'',verified:true,status:'verified',purchaseId:d.purchaseId||key,grantedAt:now,verifiedBy:'manual-admin-page'});
    alert('Payment approved. Course access has been granted.');
  }catch(e){console.error(e);alert('Approve failed: '+e.message)}
}
async function reject(uid,courseId,key){
  if(!confirm('Reject this UTR/payment request?'))return;
  try{await update(ref(db,`utrPurchases/${uid}/${courseId}/${key}`),{status:'rejected',rejectedAt:Date.now(),rejectedBy:'manual-admin-page'});alert('Request rejected.')}catch(e){alert('Reject failed: '+e.message)}
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');
  if(b){const a=[b.dataset.uid,b.dataset.course,b.dataset.key];b.dataset.action==='approve'?approve(...a):reject(...a);return}
  const c=e.target.closest('[data-file]');if(c&&c.dataset.file){window.open(c.dataset.file,'_blank','noopener')}
});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});
$('refreshBtn').onclick=start;
start();
</script>
</body>
</html>
