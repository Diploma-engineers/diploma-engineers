    `,diagrams:["municipal"],mcqs:[{q_en:"Coagulant commonly used in municipal treatment:",q_hi:"नगरपालिका शोधन में प्रयुक्त स्कंदक:",opts_en:["Alum","Common salt","Sugar","Soap"],opts_hi:["फिटकरी","साधारण नमक","चीनी","साबुन"],ans:0},{q_en:"BIS desirable limit for TDS in drinking water:",q_hi:"पेयजल में TDS हेतु BIS वांछनीय सीमा:",opts_en:["500 mg/L","50 mg/L","5000 mg/L","5 mg/L"],opts_hi:["500 mg/L","50 mg/L","5000 mg/L","5 mg/L"],ans:0},{q_en:"Excess fluoride in drinking water causes:",q_hi:"पेयजल में अतिरिक्त फ्लोराइड से होता है:",opts_en:["Fluorosis","Goitre","Anaemia","Rickets"],opts_hi:["फ्लोरोसिस","घेंघा","रक्ताल्पता","रिकेट्स"],ans:0},{q_en:"Breakpoint chlorination ensures:",q_hi:"भंजक-बिंदु क्लोरीनीकरण सुनिश्चित करता है:",opts_en:["Free residual chlorine after destroying organics","No chlorine used","Only filtration","Acidic water"],opts_hi:["कार्बनिक नष्ट होने के बाद मुक्त अवशिष्ट क्लोरीन","क्लोरीन का प्रयोग नहीं","केवल निस्यंदन","अम्लीय जल"],ans:0},{q_en:"Blue-baby syndrome is caused by excess:",q_hi:"ब्लू-बेबी सिंड्रोम अतिरिक्त से होता है:",opts_en:["Nitrate","Chloride","Calcium","Oxygen"],opts_hi:["नाइट्रेट","क्लोराइड","कैल्शियम","ऑक्सीजन"],ans:0}]}];var bg=[{id:"u3t1",unit:3,title_en:"Minerals, Ores & Principles of Metallurgy",title_hi:"खनिज, अयस्क एवं धातुकर्म के सिद्धांत",body_en:`
      <p><strong>Metallurgy</strong> is the science of extracting metals from their ores and adapting them for use. It begins with knowing where metals occur in nature.</p>
      <h3>Minerals vs ores</h3>
      <ul>
        <li><strong>Mineral:</strong> a naturally occurring chemical substance containing the metal (e.g. clay contains aluminium but is not useful).</li>
        <li><strong>Ore:</strong> a mineral from which the metal can be extracted <strong>economically and conveniently</strong>. <em>All ores are minerals, but all minerals are not ores.</em></li>
      </ul>
      <h3>Important ores of iron, aluminium and copper</h3>
      <table class="btable">
        <tr><th>Metal</th><th>Ore</th><th>Formula</th></tr>
        <tr><td rowspan="3"><strong>Iron</strong></td><td>Haematite</td><td>Fe₂O₃</td></tr>
        <tr><td>Magnetite</td><td>Fe₃O₄</td></tr>
        <tr><td>Siderite</td><td>FeCO₃</td></tr>
        <tr><td rowspan="2"><strong>Aluminium</strong></td><td>Bauxite</td><td>Al₂O₃·2H₂O</td></tr>
        <tr><td>Cryolite</td><td>Na₃AlF₆</td></tr>
        <tr><td rowspan="3"><strong>Copper</strong></td><td>Copper pyrites</td><td>CuFeS₂</td></tr>
        <tr><td>Malachite</td><td>CuCO₃·Cu(OH)₂</td></tr>
        <tr><td>Cuprite</td><td>Cu₂O</td></tr>
      </table>
      <h3>Gangue, flux and slag</h3>
      <ul>
        <li><strong>Gangue / matrix:</strong> the worthless rocky/earthy impurities (sand, clay) mixed with the ore.</li>
        <li><strong>Flux:</strong> a substance added to combine with gangue and remove it — e.g. <strong>limestone (CaCO₃)</strong> for acidic (silica) gangue.</li>
        <li><strong>Slag:</strong> the fusible product of flux + gangue, e.g. <strong>CaSiO₃</strong> (calcium silicate), which floats on molten metal and is tapped off.</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ Key Points for Exams</div>
      <ul>
        <li><strong>Acidic flux</strong> (SiO₂) removes <strong>basic</strong> gangue; <strong>basic flux</strong> (CaCO₃/lime) removes <strong>acidic</strong> gangue.</li>
        <li>Slag is <strong>lighter</strong> than the metal and protects the melt from air.</li>
      </ul></div>
      <h3>General principles of metallurgy (brief)</h3>
      <ul>
        <li><strong>1. Crushing & grinding:</strong> ore broken into small pieces (jaw crusher, ball mill).</li>
        <li><strong>2. Concentration (dressing):</strong> removing gangue — by <strong>gravity separation</strong>, <strong>magnetic separation</strong> (for magnetic ores like magnetite), <strong>froth flotation</strong> (for sulphide ores like CuFeS₂), or <strong>leaching</strong> (bauxite by Baeyer's process).</li>
        <li><strong>3. Calcination / roasting:</strong> heating ore in limited air (calcination for carbonates: FeCO₃ → FeO + CO₂) or excess air (roasting for sulphides: 2CuFeS₂ + O₂ → Cu₂S + 2FeS + SO₂).</li>
        <li><strong>4. Reduction:</strong> oxide reduced to metal — by <strong>C/CO</strong> (smelting, for Fe), <strong>electrolysis</strong> (for Al), or <strong>displacement</strong>.</li>
        <li><strong>5. Refining:</strong> purifying the crude metal — <strong>distillation</strong> (Zn, Hg), <strong>liquation</strong>, <strong>electrolytic refining</strong> (Cu), <strong>zone refining</strong> (semiconductors).</li>
      </ul>
    `,body_hi:`
      <p><strong>धातुकर्म</strong> अयस्कों से धातुओं के निष्कर्षण और उन्हें उपयोग हेतु अनुकूल बनाने का विज्ञान है। यह प्रकृति में धातुओं की प्राप्ति के ज्ञान से आरंभ होता है।</p>
      <h3>खनिज बनाम अयस्क</h3>
      <ul>
        <li><strong>खनिज:</strong> प्रकृति में पाया जाने वाला रासायनिक पदार्थ जिसमें धातु हो (जैसे चिकनी मिट्टी में एल्युमिनियम है परंतु वह उपयोगी नहीं)।</li>
        <li><strong>अयस्क:</strong> वह खनिज जिससे धातु का निष्कर्षण <strong>आर्थिक व सुविधाजनक</strong> रूप से हो सके। <em>सभी अयस्क खनिज होते हैं, परंतु सभी खनिज अयस्क नहीं।</em></li>
      </ul>
      <h3>लोहा, एल्युमिनियम व ताँबे के प्रमुख अयस्क</h3>
      <table class="btable">
        <tr><th>धातु</th><th>अयस्क</th><th>सूत्र</th></tr>
        <tr><td rowspan="3"><strong>लोहा</strong></td><td>हेमेटाइट</td><td>Fe₂O₃</td></tr>
        <tr><td>मैग्नेटाइट</td><td>Fe₃O₄</td></tr>
        <tr><td>सिडेराइट</td><td>FeCO₃</td></tr>
        <tr><td rowspan="2"><strong>एल्युमिनियम</strong></td><td>बॉक्साइट</td><td>Al₂O₃·2H₂O</td></tr>
        <tr><td>क्रायोलाइट</td><td>Na₃AlF₆</td></tr>
        <tr><td rowspan="3"><strong>ताँबा</strong></td><td>कॉपर पाइराइटीज़</td><td>CuFeS₂</td></tr>
        <tr><td>मैलाकाइट</td><td>CuCO₃·Cu(OH)₂</td></tr>
        <tr><td>क्यूप्राइट</td><td>Cu₂O</td></tr>
      </table>
      <h3>गैंग, फ्लक्स व धातुमल</h3>
      <ul>
        <li><strong>गैंग / मैट्रिक्स:</strong> अयस्क में मिली व्यर्थ शैल/मृदा अशुद्धियाँ (बालू, चिकनी मिट्टी)।</li>
        <li><strong>फ्लक्स:</strong> गैंग से संयुक्त होकर उसे हटाने हेतु मिलाया गया पदार्थ — जैसे अम्लीय (सिलिका) गैंग हेतु <strong>चूना-पत्थर (CaCO₃)</strong>।</li>
        <li><strong>धातुमल (slag):</strong> फ्लक्स + गैंग का गलनीय उत्पाद, जैसे <strong>CaSiO₃</strong> (कैल्शियम सिलिकेट), जो गलित धातु पर तैरता है और निकाल लिया जाता है।</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ परीक्षा हेतु मुख्य बिंदु</div>
      <ul>
        <li><strong>अम्लीय फ्लक्स</strong> (SiO₂) <strong>क्षारीय</strong> गैंग हटाता है; <strong>क्षारीय फ्लक्स</strong> (CaCO₃/चूना) <strong>अम्लीय</strong> गैंग हटाता है।</li>
        <li>धातुमल धातु से <strong>हल्का</strong> होता है और पिघलाव को वायु से बचाता है।</li>
      </ul></div>
      <h3>धातुकर्म के सामान्य सिद्धांत (संक्षेप)</h3>
      <ul>
        <li><strong>1. दलन व पेषण:</strong> अयस्क छोटे टुकड़ों में तोड़ा जाता है (जॉ क्रशर, बॉल मिल)।</li>
        <li><strong>2. सांद्रण (dressing):</strong> गैंग हटाना — <strong>गुरुत्व पृथक्करण</strong>, <strong>चुंबकीय पृथक्करण</strong> (मैग्नेटाइट जैसे चुंबकीय अयस्कों हेतु), <strong>फेन प्लवन</strong> (CuFeS₂ जैसे सल्फाइड अयस्कों हेतु), या <strong>निक्षालन</strong> (बॉक्साइट हेतु बेयर प्रक्रम) द्वारा।</li>
        <li><strong>3. निस्तापन / भर्जन:</strong> सीमित वायु में गर्म करना (कार्बोनेटों हेतु निस्तापन: FeCO₃ → FeO + CO₂) या अधिक वायु में (सल्फाइडों हेतु भर्जन: 2CuFeS₂ + O₂ → Cu₂S + 2FeS + SO₂)।</li>
        <li><strong>4. अपचयन:</strong> ऑक्साइड का धातु में अपचयन — <strong>C/CO</strong> द्वारा (प्रगलन, Fe हेतु), <strong>विद्युतअपघटन</strong> द्वारा (Al हेतु), या <strong>विस्थापन</strong> द्वारा।</li>
        <li><strong>5. परिष्करण:</strong> अपरिष्कृत धातु का शोधन — <strong>आसवन</strong> (Zn, Hg), <strong>द्रवण</strong>, <strong>विद्युतअपघटनी परिष्करण</strong> (Cu), <strong>ज़ोन परिष्करण</strong> (अर्धचालक)।</li>
      </ul>
    `,diagrams:[],mcqs:[{q_en:"Ore of aluminium is:",q_hi:"एल्युमिनियम का अयस्क है:",opts_en:["Bauxite","Haematite","Copper pyrites","Galena"],opts_hi:["बॉक्साइट","हेमेटाइट","कॉपर पाइराइटीज़","गैलेना"],ans:0},{q_en:"Flux + gangue forms:",q_hi:"फ्लक्स + गैंग बनाता है:",opts_en:["Slag","Metal","Alloy","Coke"],opts_hi:["धातुमल","धातु","मिश्रधातु","कोक"],ans:0},{q_en:"Froth flotation is used for concentrating:",q_hi:"फेन प्लवन प्रयुक्त होता है सांद्रण हेतु:",opts_en:["Sulphide ores","Oxide ores","Carbonate ores","Native metals"],opts_hi:["सल्फाइड अयस्कों","ऑक्साइड अयस्कों","कार्बोनेट अयस्कों","मूल धातुओं"],ans:0},{q_en:"All ores are minerals, but:",q_hi:"सभी अयस्क खनिज होते हैं, परंतु:",opts_en:["All minerals are not ores","All minerals are ores","Ores contain no metal","Minerals are artificial"],opts_hi:["सभी खनिज अयस्क नहीं होते","सभी खनिज अयस्क होते हैं","अयस्कों में धातु नहीं होती","खनिज कृत्रिम होते हैं"],ans:0}]},{id:"u3t2",unit:3,title_en:"Iron from Haematite (Blast Furnace) & Aluminium from Bauxite",title_hi:"हेमेटाइट से लोहा (वात भट्टी) एवं बॉक्साइट से एल्युमिनियम",body_en:`
      <h3>Extraction of iron from haematite — the blast furnace</h3>
      <p><strong>Charge:</strong> haematite (Fe₂O₃) + coke (fuel + reducing agent) + limestone (flux), fed from the top. <strong>Hot air blast</strong> (~1800 °C zone) enters near the bottom through tuyeres.</p>
      <h3>Reactions (top → bottom)</h3>
      <div class="formula-strip"><span class="flabel">Key reactions</span>C + O₂ → CO₂ · CO₂ + C → 2CO · Fe₂O₃ + 3CO → 2Fe + 3CO₂ (reduction zone, ~1000 °C) · CaCO₃ → CaO + CO₂ · CaO + SiO₂ → CaSiO₃ (slag)</div>
      <ul>
        <li><strong>Reduction zone:</strong> CO reduces Fe₂O₃ to spongy iron.</li>
        <li><strong>Fusion zone (~1800 °C):</strong> iron melts; limestone decomposes; CaO combines with silica gangue to form <strong>slag (CaSiO₃)</strong> which floats on the denser molten iron.</li>
        <li>Molten iron tapped from the bottom is <strong>pig iron</strong> (~4% C, hard but brittle).</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ Key Points for Exams</div>
      <ul>
        <li><strong>Functions of coke:</strong> fuel (heat) + reducing agent (makes CO).</li>
        <li><strong>Function of limestone:</strong> flux — removes SiO₂ gangue as slag.</li>
        <li>Pig iron → <strong>cast iron</strong> (~3% C) → <strong>wrought iron</strong> (purest, &lt;0.1% C) → <strong>steel</strong> (controlled C + alloying).</li>
        <li>The furnace works <strong>continuously</strong> for years once lit.</li>
      </ul></div>
      <h3>Extraction of aluminium from bauxite</h3>
      <ul>
        <li><strong>1. Purification (Baeyer's process):</strong> bauxite digested with hot conc. NaOH → soluble <strong>sodium aluminate</strong>; impurities (Fe₂O₃ — red mud) filtered off; pure <strong>alumina (Al₂O₃)</strong> precipitated.</li>
        <li><strong>2. Electrolysis (Hall–Héroult process):</strong> alumina dissolved in molten <strong>cryolite (Na₃AlF₆)</strong> lowers the m.p. to ~950 °C and improves conductivity. Electrolysis in a steel cell with <strong>carbon lining (cathode)</strong> and <strong>carbon anodes</strong>.</li>
      </ul>
      <div class="formula-strip"><span class="flabel">Electrode reactions</span>Cathode: Al³⁺ + 3e⁻ → Al (l) · Anode: 2O²⁻ → O₂ + 4e⁻ (O₂ burns the carbon anode: C + O₂ → CO₂ — anodes are consumed)</div>
      <p>Molten aluminium (denser) collects at the bottom and is tapped off. Aluminium is light, corrosion-resistant (protective Al₂O₃ film) and an excellent conductor — used in aircraft, cables and utensils.</p>
    `,body_hi:`
      <h3>हेमेटाइट से लोहे का निष्कर्षण — वात भट्टी</h3>
      <p><strong>आवेश:</strong> हेमेटाइट (Fe₂O₃) + कोक (ईंधन + अपचायक) + चूना-पत्थर (फ्लक्स), ऊपर से डाला जाता है। ट्वीयरों से नीचे के पास <strong>तप्त वायु झोंक</strong> (~1800 °C क्षेत्र) प्रवेश करती है।</p>
      <h3>अभिक्रियाएँ (ऊपर → नीचे)</h3>
      <div class="formula-strip"><span class="flabel">मुख्य अभिक्रियाएँ</span>C + O₂ → CO₂ · CO₂ + C → 2CO · Fe₂O₃ + 3CO → 2Fe + 3CO₂ (अपचयन क्षेत्र, ~1000 °C) · CaCO₃ → CaO + CO₂ · CaO + SiO₂ → CaSiO₃ (धातुमल)</div>
      <ul>
        <li><strong>अपचयन क्षेत्र:</strong> CO, Fe₂O₃ को स्पंजी लोहे में अपचयित करता है।</li>
        <li><strong>संगलन क्षेत्र (~1800 °C):</strong> लोहा पिघलता है; चूना-पत्थर विघटित होता है; CaO सिलिका गैंग से संयुक्त होकर <strong>धातुमल (CaSiO₃)</strong> बनाता है जो सघन गलित लोहे पर तैरता है।</li>
        <li>नीचे से निकाला गया गलित लोहा <strong>पिग आयरन</strong> (~4% C, कठोर परंतु भंगुर) होता है।</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ परीक्षा हेतु मुख्य बिंदु</div>
      <ul>
        <li><strong>कोक के कार्य:</strong> ईंधन (ऊष्मा) + अपचायक (CO बनाता है)।</li>
        <li><strong>चूना-पत्थर का कार्य:</strong> फ्लक्स — SiO₂ गैंग को धातुमल के रूप में हटाता है।</li>
        <li>पिग आयरन → <strong>ढलवाँ लोहा</strong> (~3% C) → <strong>पिटवाँ लोहा</strong> (शुद्धतम, &lt;0.1% C) → <strong>इस्पात</strong> (नियंत्रित C + मिश्रधातुकरण)।</li>
        <li>भट्टी एक बार जलने पर वर्षों तक <strong>सतत</strong> चलती है।</li>
      </ul></div>
      <h3>बॉक्साइट से एल्युमिनियम का निष्कर्षण</h3>
      <ul>
        <li><strong>1. शोधन (बेयर प्रक्रम):</strong> बॉक्साइट गर्म सांद्र NaOH में पचाया जाता है → विलेय <strong>सोडियम ऐलुमिनेट</strong>; अशुद्धियाँ (Fe₂O₃ — लाल पंक) छान ली जाती हैं; शुद्ध <strong>ऐलुमिना (Al₂O₃)</strong> अवक्षेपित होती है।</li>
        <li><strong>2. विद्युतअपघटन (हॉल–हेरॉल्ट प्रक्रम):</strong> ऐलुमिना गलित <strong>क्रायोलाइट (Na₃AlF₆)</strong> में घोली जाती है जिससे गलनांक ~950 °C तक घटता है और चालकता बढ़ती है। <strong>कार्बन अस्तर (कैथोड)</strong> व <strong>कार्बन ऐनोडों</strong> सहित इस्पात सेल में विद्युतअपघटन।</li>
      </ul>
      <div class="formula-strip"><span class="flabel">इलेक्ट्रोड अभिक्रियाएँ</span>कैथोड: Al³⁺ + 3e⁻ → Al (l) · ऐनोड: 2O²⁻ → O₂ + 4e⁻ (O₂ कार्बन ऐनोड जलाती है: C + O₂ → CO₂ — ऐनोड खर्च होते हैं)</div>
      <p>गलित एल्युमिनियम (सघन) नीचे एकत्र होकर निकाल लिया जाता है। एल्युमिनियम हल्का, संक्षारण-प्रतिरोधी (रक्षात्मक Al₂O₃ परत) व उत्कृष्ट चालक है — वायुयान, केबल व बर्तनों में प्रयुक्त।</p>
    `,diagrams:["blast","hallheroult"],formulas_en:["Fe₂O₃ + 3CO → 2Fe + 3CO₂","CaO + SiO₂ → CaSiO₃ (slag)","Cathode: Al³⁺ + 3e⁻ → Al","Anode: 2O²⁻ → O₂ + 4e⁻"],formulas_hi:["Fe₂O₃ + 3CO → 2Fe + 3CO₂","CaO + SiO₂ → CaSiO₃ (धातुमल)","कैथोड: Al³⁺ + 3e⁻ → Al","ऐनोड: 2O²⁻ → O₂ + 4e⁻"],mcqs:[{q_en:"In the blast furnace, limestone acts as:",q_hi:"वात भट्टी में चूना-पत्थर कार्य करता है:",opts_en:["Flux","Fuel","Reducing agent","Catalyst"],opts_hi:["फ्लक्स","ईंधन","अपचायक","उत्प्रेरक"],ans:0},{q_en:"Cryolite is added in aluminium extraction to:",q_hi:"एल्युमिनियम निष्कर्षण में क्रायोलाइट मिलाया जाता है:",opts_en:["Lower m.p. and increase conductivity","Oxidise aluminium","Act as fuel","Remove iron"],opts_hi:["गलनांक घटाने व चालकता बढ़ाने","एल्युमिनियम का ऑक्सीकरण","ईंधन के रूप में","लोहा हटाने"],ans:0},{q_en:"The reducing agent in the blast furnace is:",q_hi:"वात भट्टी में अपचायक है:",opts_en:["CO","CaO","SiO₂","N₂"],opts_hi:["CO","CaO","SiO₂","N₂"],ans:0},{q_en:"Pig iron contains about:",q_hi:"पिग आयरन में लगभग होता है:",opts_en:["4% carbon","0.1% carbon","20% carbon","No carbon"],opts_hi:["4% कार्बन","0.1% कार्बन","20% कार्बन","कार्बन नहीं"],ans:0}]},{id:"u3t3",unit:3,title_en:"Alloys: Purposes, Ferrous & Non-Ferrous",title_hi:"मिश्रधातुएँ: उद्देश्य, लौह व अलौह",body_en:`
      <p>An <strong>alloy</strong> is a homogeneous mixture of two or more metals (or a metal with non-metals like carbon), made by melting the components together.</p>
      <h3>Purposes of alloying</h3>
      <ul>
        <li><strong>Increase hardness and strength</strong> (pure metals are soft) — e.g. steel is harder than iron.</li>
        <li><strong>Improve corrosion resistance</strong> — e.g. stainless steel resists rust.</li>
        <li><strong>Lower the melting point</strong> — e.g. solder melts easily for joining.</li>
        <li><strong>Modify colour, castability and electrical properties</strong> — e.g. brass is golden and easily cast.</li>
      </ul>
      <h3>Ferrous alloys (contain iron)</h3>
      <table class="btable">
        <tr><th>Alloy</th><th>Composition</th><th>Properties / Uses</th></tr>
        <tr><td><strong>Stainless steel</strong></td><td>Fe + Cr (≥10.5%) + Ni</td><td>Corrosion-resistant; utensils, surgical tools</td></tr>
        <tr><td><strong>Manganese steel</strong></td><td>Fe + Mn (~13%)</td><td>Very hard; railway tracks, rock crushers</td></tr>
        <tr><td><strong>Tungsten steel</strong></td><td>Fe + W</td><td>Retains hardness at high temp; cutting tools</td></tr>
        <tr><td><strong>Nickel steel</strong></td><td>Fe + Ni</td><td>Tough; cables, armour plates</td></tr>
      </table>
      <h3>Non-ferrous alloys</h3>
      <table class="btable">
        <tr><th>Alloy</th><th>Composition</th><th>Properties / Uses</th></tr>
        <tr><td><strong>Brass</strong></td><td>Cu + Zn</td><td>Golden, castable; utensils, musical instruments</td></tr>
        <tr><td><strong>Bronze</strong></td><td>Cu + Sn</td><td>Hard, corrosion-resistant; statues, coins, bearings</td></tr>
        <tr><td><strong>Duralumin</strong></td><td>Al + Cu + Mg + Mn</td><td>Light & strong; aircraft bodies</td></tr>
        <tr><td><strong>Solder</strong></td><td>Pb + Sn</td><td>Low m.p.; joining wires/electronic parts</td></tr>
        <tr><td><strong>German silver</strong></td><td>Cu + Zn + Ni</td><td>Silvery; cutlery, ornaments</td></tr>
      </table>
      <div class="keybox"><div class="keybox-title">⭐ Key Points for Exams</div>
      <ul>
        <li><strong>Amalgam</strong> = alloy with <strong>mercury</strong> (e.g. dental amalgam Ag–Sn–Hg).</li>
        <li>Alloying <strong>decreases</strong> electrical conductivity but <strong>increases</strong> hardness — different-sized atoms block dislocation movement.</li>
        <li><strong>Steel</strong> is Fe + C (0.1–1.5%); more carbon → harder but more brittle.</li>
        <li>Remember pairs: <strong>Brass = Cu+Zn</strong>, <strong>Bronze = Cu+Sn</strong> — the most-asked distinction.</li>
      </ul></div>
    `,body_hi:`
      <p><strong>मिश्रधातु</strong> दो या अधिक धातुओं (या कार्बन जैसे अधातु सहित धातु) का समांगी मिश्रण है, जो घटकों को एक साथ गलाकर बनाई जाती है।</p>
      <h3>मिश्रधातुकरण के उद्देश्य</h3>
      <ul>
        <li><strong>कठोरता व सामर्थ्य बढ़ाना</strong> (शुद्ध धातुएँ मृदु होती हैं) — जैसे इस्पात लोहे से कठोर है।</li>
        <li><strong>संक्षारण प्रतिरोध सुधारना</strong> — जैसे स्टेनलेस स्टील जंग नहीं खाता।</li>
        <li><strong>गलनांक घटाना</strong> — जैसे सोल्डर जोड़ने हेतु आसानी से पिघलता है।</li>
        <li><strong>रंग, ढलाई-योग्यता व विद्युत गुण संशोधित करना</strong> — जैसे पीतल सुनहरा व आसानी से ढलने योग्य है।</li>
      </ul>
      <h3>लौह मिश्रधातुएँ (लोहा सहित)</h3>
      <table class="btable">
        <tr><th>मिश्रधातु</th><th>संघटन</th><th>गुण / उपयोग</th></tr>
        <tr><td><strong>स्टेनलेस स्टील</strong></td><td>Fe + Cr (≥10.5%) + Ni</td><td>संक्षारण-प्रतिरोधी; बर्तन, शल्य उपकरण</td></tr>
        <tr><td><strong>मैंगनीज़ स्टील</strong></td><td>Fe + Mn (~13%)</td><td>अत्यंत कठोर; रेल पटरियाँ, शैल दलित्र</td></tr>
        <tr><td><strong>टंगस्टन स्टील</strong></td><td>Fe + W</td><td>उच्च ताप पर कठोरता; कर्तन औज़ार</td></tr>
        <tr><td><strong>निकेल स्टील</strong></td><td>Fe + Ni</td><td>चीमड़; केबल, कवच प्लेटें</td></tr>
      </table>
      <h3>अलौह मिश्रधातुएँ</h3>
      <table class="btable">
        <tr><th>मिश्रधातु</th><th>संघटन</th><th>गुण / उपयोग</th></tr>
        <tr><td><strong>पीतल</strong></td><td>Cu + Zn</td><td>सुनहरा, ढलने योग्य; बर्तन, वाद्ययंत्र</td></tr>
        <tr><td><strong>काँसा</strong></td><td>Cu + Sn</td><td>कठोर, संक्षारण-प्रतिरोधी; मूर्तियाँ, सिक्के, बेयरिंग</td></tr>
        <tr><td><strong>ड्यूरालुमिन</strong></td><td>Al + Cu + Mg + Mn</td><td>हल्का व मज़बूत; वायुयान काय</td></tr>
        <tr><td><strong>सोल्डर</strong></td><td>Pb + Sn</td><td>कम गलनांक; तार/इलेक्ट्रॉनिक भाग जोड़ना</td></tr>
        <tr><td><strong>जर्मन सिल्वर</strong></td><td>Cu + Zn + Ni</td><td>रुपहला; कटलरी, आभूषण</td></tr>
      </table>
      <div class="keybox"><div class="keybox-title">⭐ परीक्षा हेतु मुख्य बिंदु</div>
      <ul>
        <li><strong>अमलगम</strong> = <strong>पारे</strong> सहित मिश्रधातु (जैसे दंत अमलगम Ag–Sn–Hg)।</li>
        <li>मिश्रधातुकरण विद्युत चालकता <strong>घटाता</strong> है परंतु कठोरता <strong>बढ़ाता</strong> है — भिन्न आकार के परमाणु विस्थापन गति रोकते हैं।</li>
        <li><strong>इस्पात</strong> Fe + C (0.1–1.5%) है; अधिक कार्बन → कठोर परंतु अधिक भंगुर।</li>
        <li>युग्म याद रखें: <strong>पीतल = Cu+Zn</strong>, <strong>काँसा = Cu+Sn</strong> — सर्वाधिक पूछा गया अंतर।</li>
      </ul></div>
    `,diagrams:[],mcqs:[{q_en:"Brass is an alloy of:",q_hi:"पीतल मिश्रधातु है:",opts_en:["Cu + Zn","Cu + Sn","Fe + Cr","Al + Cu"],opts_hi:["Cu + Zn","Cu + Sn","Fe + Cr","Al + Cu"],ans:0},{q_en:"Stainless steel resists corrosion due to:",q_hi:"स्टेनलेस स्टील संक्षारण का प्रतिरोध करता है कारण:",opts_en:["Chromium forming a protective oxide film","High carbon","Copper content","Painting"],opts_hi:["क्रोमियम द्वारा रक्षात्मक ऑक्साइड परत","उच्च कार्बन","ताँबा अंश","पेंट"],ans:0},{q_en:"Duralumin is used in aircraft because it is:",q_hi:"ड्यूरालुमिन वायुयान में प्रयुक्त होता है क्योंकि यह है:",opts_en:["Light and strong","Very cheap","Magnetic","Transparent"],opts_hi:["हल्का व मज़बूत","बहुत सस्ता","चुंबकीय","पारदर्शी"],ans:0},{q_en:"Solder (Pb + Sn) is used for joining metals because of its:",q_hi:"सोल्डर (Pb + Sn) धातु जोड़ने हेतु प्रयुक्त होता है इसके कारण:",opts_en:["Low melting point","High strength","Golden colour","Magnetism"],opts_hi:["कम गलनांक","उच्च सामर्थ्य","सुनहरा रंग","चुंबकत्व"],ans:0}]},{id:"u3t4",unit:3,title_en:"Cement, Glass, Refractories & Composites",title_hi:"सीमेंट, काँच, दुर्गलनीय पदार्थ व संयुक्त पदार्थ",body_en:`
      <h3>Portland cement — composition & hardening</h3>
      <p><strong>Raw materials:</strong> limestone (CaCO₃) + clay (Al₂O₃, SiO₂), heated in a <strong>rotary kiln</strong> at ~1450 °C.</p>
      <ul>
        <li><strong>Chemical composition (oxides):</strong> CaO (60–65%), SiO₂ (20–25%), Al₂O₃ (4–8%), Fe₂O₃ (2–4%), MgO, SO₃.</li>
        <li><strong>Bogue compounds</strong> (formed in kiln): <strong>C₃S</strong> (tricalcium silicate — early strength), <strong>C₂S</strong> (dicalcium silicate — later strength), <strong>C₃A</strong> (tricalcium aluminate — flash setting), <strong>C₄AF</strong>.</li>
        <li><strong>Hardening (hydration):</strong> C₃S/C₂S + H₂O → <strong>C–S–H gel</strong> (calcium silicate hydrate) + Ca(OH)₂. The interlocking gel gives strength. <strong>Gypsum (CaSO₄·2H₂O)</strong> is added to <strong>retard</strong> the flash setting of C₃A.</li>
      </ul>
      <h3>Glass</h3>
      <ul>
        <li><strong>Soda-lime glass</strong> (ordinary): Na₂CO₃ + CaCO₃ + SiO₂ (sand) fused at ~1500 °C → <strong>Na₂O·CaO·6SiO₂</strong>. Used for windows, bottles.</li>
        <li><strong>Varieties:</strong> borosilicate (Pyrex — lab ware, heat resistant), lead crystal (optical, decorative), coloured glass (transition-metal oxides: Co²⁺ blue, Cr³⁺ green).</li>
        <li><strong>Annealing</strong> (slow cooling) removes internal stresses; sudden cooling makes glass brittle.</li>
      </ul>
      <h3>Refractories</h3>
      <p>Materials that <strong>withstand very high temperatures</strong> without melting/deforming — used to line furnaces, kilns, crucibles.</p>
      <ul>
        <li><strong>Acidic:</strong> silica (SiO₂), fireclay — resist acidic slags.</li>
        <li><strong>Basic:</strong> magnesia (MgO), dolomite — resist basic slags.</li>
        <li><strong>Neutral:</strong> alumina (Al₂O₃), graphite, chromite.</li>
        <li><strong>Properties:</strong> high refractoriness (PCE — pyrometric cone equivalent), low thermal expansion, resistance to slag corrosion and thermal shock.</li>
      </ul>
      <h3>Composite materials</h3>
      <p><strong>Composites</strong> combine two or more materials so the product has properties superior to each alone — typically a <strong>matrix</strong> (binder) + <strong>reinforcement</strong> (fibres/particles).</p>
      <div class="keybox"><div class="keybox-title">⭐ Key Points for Exams</div>
      <ul>
        <li><strong>Examples:</strong> RCC (concrete + steel rods — construction), fibreglass (glass fibres + polymer — boats, tanks), carbon-fibre composites (aircraft, sports goods).</li>
        <li>The matrix <strong>binds and protects</strong>; the reinforcement <strong>carries the load</strong>.</li>
        <li>Advantages: high strength-to-weight ratio, corrosion resistance, design flexibility.</li>
      </ul></div>
    `,body_hi:`
      <h3>पोर्टलैंड सीमेंट — संघटन व कठोरीकरण</h3>
      <p><strong>कच्चा माल:</strong> चूना-पत्थर (CaCO₃) + चिकनी मिट्टी (Al₂O₃, SiO₂), <strong>घूर्णी भट्टी</strong> में ~1450 °C पर गर्म।</p>
      <ul>
        <li><strong>रासायनिक संघटन (ऑक्साइड):</strong> CaO (60–65%), SiO₂ (20–25%), Al₂O₃ (4–8%), Fe₂O₃ (2–4%), MgO, SO₃।</li>
        <li><strong>बोग यौगिक</strong> (भट्टी में बनते हैं): <strong>C₃S</strong> (ट्राइकैल्शियम सिलिकेट — प्रारंभिक सामर्थ्य), <strong>C₂S</strong> (डाइकैल्शियम सिलिकेट — परवर्ती सामर्थ्य), <strong>C₃A</strong> (ट्राइकैल्शियम ऐलुमिनेट — त्वरित जमाव), <strong>C₄AF</strong>।</li>
        <li><strong>कठोरीकरण (जलयोजन):</strong> C₃S/C₂S + H₂O → <strong>C–S–H जेल</strong> (कैल्शियम सिलिकेट हाइड्रेट) + Ca(OH)₂। अंतर्ग्रथित जेल सामर्थ्य देता है। C₃A के त्वरित जमाव को <strong>मंद</strong> करने हेतु <strong>जिप्सम (CaSO₄·2H₂O)</strong> मिलाया जाता है।</li>
      </ul>
      <h3>काँच</h3>
      <ul>
        <li><strong>सोडा-लाइम काँच</strong> (साधारण): Na₂CO₃ + CaCO₃ + SiO₂ (बालू) ~1500 °C पर संगलित → <strong>Na₂O·CaO·6SiO₂</strong>। खिड़कियों, बोतलों हेतु।</li>
        <li><strong>प्रकार:</strong> बोरोसिलिकेट (पाइरेक्स — प्रयोगशाला बर्तन, ऊष्मा प्रतिरोधी), लेड क्रिस्टल (प्रकाशीय, सजावटी), रंगीन काँच (संक्रमण-धातु ऑक्साइड: Co²⁺ नीला, Cr³⁺ हरा)।</li>
        <li><strong>अनीलन</strong> (मंद शीतलन) आंतरिक प्रतिबल हटाता है; आकस्मिक शीतलन काँच को भंगुर बनाता है।</li>
      </ul>
      <h3>दुर्गलनीय पदार्थ (Refractories)</h3>
      <p>वे पदार्थ जो बिना पिघले/विरूपित हुए <strong>अत्यंत उच्च तापमान</strong> सहते हैं — भट्टियों, चूल्हों, क्रूसिबलों के अस्तर हेतु प्रयुक्त।</p>
      <ul>
        <li><strong>अम्लीय:</strong> सिलिका (SiO₂), फायरक्ले — अम्लीय धातुमल का प्रतिरोध।</li>
        <li><strong>क्षारीय:</strong> मैग्नीशिया (MgO), डोलोमाइट — क्षारीय धातुमल का प्रतिरोध।</li>
        <li><strong>उदासीन:</strong> ऐलुमिना (Al₂O₃), ग्रेफाइट, क्रोमाइट।</li>
        <li><strong>गुण:</strong> उच्च दुर्गलनीयता (PCE — पायरोमेट्रिक कोन तुल्यांक), कम ऊष्मीय प्रसार, धातुमल संक्षारण व तापीय आघात का प्रतिरोध।</li>
      </ul>
      <h3>संयुक्त पदार्थ (Composites)</h3>
      <p><strong>संयुक्त पदार्थ</strong> दो या अधिक पदार्थों को जोड़ते हैं ताकि उत्पाद में प्रत्येक से श्रेष्ठ गुण हों — प्रायः एक <strong>मैट्रिक्स</strong> (बंधक) + <strong>प्रबलन</strong> (रेशे/कण)।</p>
      <div class="keybox"><div class="keybox-title">⭐ परीक्षा हेतु मुख्य बिंदु</div>
      <ul>
        <li><strong>उदाहरण:</strong> RCC (कंक्रीट + इस्पात छड़ — निर्माण), फाइबरग्लास (काँच रेशे + बहुलक — नावें, टैंक), कार्बन-रेशा संयुक्त (वायुयान, खेल सामग्री)।</li>
        <li>मैट्रिक्स <strong>बाँधता व रक्षा</strong> करता है; प्रबलन <strong>भार वहन</strong> करता है।</li>
        <li>लाभ: उच्च सामर्थ्य-भार अनुपात, संक्षारण प्रतिरोध, अभिकल्प लचीलापन।</li>
      </ul></div>
    `,diagrams:["kiln"],mcqs:[{q_en:"Early strength of cement is mainly due to:",q_hi:"सीमेंट की प्रारंभिक सामर्थ्य मुख्यतः कारण है:",opts_en:["C₃S","C₂S","Gypsum","MgO"],opts_hi:["C₃S","C₂S","जिप्सम","MgO"],ans:0},{q_en:"Gypsum is added to cement to:",q_hi:"सीमेंट में जिप्सम मिलाया जाता है:",opts_en:["Retard setting","Increase cost","Add colour","Reduce weight"],opts_hi:["जमाव मंद करने","लागत बढ़ाने","रंग देने","भार घटाने"],ans:0},{q_en:"Ordinary glass is:",q_hi:"साधारण काँच है:",opts_en:["Soda-lime glass","Borosilicate only","Pure SiO₂","Metallic"],opts_hi:["सोडा-लाइम काँच","केवल बोरोसिलिकेट","शुद्ध SiO₂","धात्विक"],ans:0},{q_en:"A basic refractory is:",q_hi:"एक क्षारीय दुर्गलनीय है:",opts_en:["Magnesia (MgO)","Silica","Fireclay","Graphite"],opts_hi:["मैग्नीशिया (MgO)","सिलिका","फायरक्ले","ग्रेफाइट"],ans:0},{q_en:"In a composite, the reinforcement:",q_hi:"संयुक्त पदार्थ में प्रबलन:",opts_en:["Carries the load","Only adds colour","Dissolves the matrix","Conducts heat away"],opts_hi:["भार वहन करता है","केवल रंग देता है","मैट्रिक्स घोलता है","ऊष्मा हटाता है"],ans:0}]},{id:"u3t5",unit:3,title_en:"Polymers, Plastics, Rubber & Vulcanization",title_hi:"बहुलक, प्लास्टिक, रबर व वल्कनीकरण",body_en:`
      <p><strong>Polymers</strong> are giant molecules formed by linking many small <strong>monomers</strong>. The number of monomer units is the <strong>degree of polymerization</strong>.</p>
      <ul>
        <li><strong>Homopolymer:</strong> one type of monomer (e.g. PVC from vinyl chloride).</li>
        <li><strong>Copolymer:</strong> two or more types of monomers (e.g. nylon-6,6 from hexamethylenediamine + adipic acid).</li>
      </ul>
      <h3>Thermoplastics vs thermosetting plastics</h3>
      <table class="btable">
        <tr><th>Property</th><th>Thermoplastic</th><th>Thermosetting</th></tr>
        <tr><td>Structure</td><td>Linear/branched chains</td><td>3-D cross-linked network</td></tr>
        <tr><td>On heating</td><td>Softens, can be remoulded</td><td>Does not soften; chars</td></tr>
        <tr><td>Recyclable</td><td>Yes</td><td>No</td></tr>
        <tr><td>Examples</td><td><strong>PVC, PS</strong> (polystyrene), <strong>PTFE</strong> (Teflon)</td><td><strong>Bakelite</strong>, epoxy resins</td></tr>
      </table>
      <h3>Preparation & applications (simple reactions)</h3>
      <ul>
        <li><strong>PVC</strong> (polyvinyl chloride): n CH₂=CHCl → —[CH₂—CHCl]ₙ— · pipes, cables, flooring, bottles.</li>
        <li><strong>PS</strong> (polystyrene): n CH₂=CH–C₆H₅ → polystyrene · disposable cups, packaging (thermocol), insulation.</li>
        <li><strong>PTFE</strong> (Teflon): n CF₂=CF₂ → —[CF₂—CF₂]ₙ— · non-stick coatings, gaskets, insulators (very high heat/chemical resistance).</li>
        <li><strong>Nylon-6:</strong> ring-opening polymerization of <strong>caprolactam</strong> · fibres, ropes, tyre cords.</li>
        <li><strong>Nylon-6,6:</strong> hexamethylenediamine + adipic acid (condensation, −H₂O) · textiles, carpets, machine gears.</li>
        <li><strong>Bakelite:</strong> phenol + formaldehyde (condensation) · electrical switches, plugs, handles (hard thermoset).</li>
      </ul>
      <h3>Rubber & vulcanization</h3>
      <p><strong>Natural rubber</strong> is <strong>polyisoprene</strong> — soft, sticky when hot, brittle when cold, and attacked by oils. <strong>Vulcanization</strong> (Goodyear) heats rubber with <strong>sulphur (3–5%)</strong> at ~150 °C, forming <strong>sulphur cross-links</strong> between chains.</p>
      <div class="keybox"><div class="keybox-title">⭐ Key Points for Exams</div>
      <ul>
        <li><strong>Effects of vulcanization:</strong> increases tensile strength, elasticity, abrasion resistance; reduces stickiness and temperature sensitivity; improves resistance to oils/solvents.</li>
        <li>Vulcanized rubber is used for <strong>tyres, tubes, belts, hoses</strong>.</li>
        <li><strong>Ebonite</strong> = highly vulcanized rubber (25–30% S) — hard, used for battery cases.</li>
        <li>Degree of polymerization = (molar mass of polymer) / (molar mass of monomer).</li>
      </ul></div>
    `,body_hi:`
      <p><strong>बहुलक</strong> अनेक छोटे <strong>एकलकों (monomers)</strong> को जोड़कर बने विशाल अणु हैं। एकलक इकाइयों की संख्या <strong>बहुलकन कोटि</strong> कहलाती है।</p>
      <ul>
        <li><strong>समबहुलक:</strong> एक प्रकार का एकलक (जैसे विनाइल क्लोराइड से PVC)।</li>
        <li><strong>सहबहुलक:</strong> दो या अधिक प्रकार के एकलक (जैसे हेक्सामेथिलीनडाइऐमीन + ऐडिपिक अम्ल से नायलॉन-6,6)।</li>
      </ul>
      <h3>थर्मोप्लास्टिक बनाम थर्मोसेटिंग प्लास्टिक</h3>
      <table class="btable">
        <tr><th>गुण</th><th>थर्मोप्लास्टिक</th><th>थर्मोसेटिंग</th></tr>
        <tr><td>संरचना</td><td>रेखीय/शाखित शृंखलाएँ</td><td>त्रिविमीय क्रॉस-बंधित जाल</td></tr>
        <tr><td>गर्म करने पर</td><td>नरम, पुनः ढाला जा सकता है</td><td>नरम नहीं; झुलसता है</td></tr>
        <tr><td>पुनर्चक्रणीय</td><td>हाँ</td><td>नहीं</td></tr>
        <tr><td>उदाहरण</td><td><strong>PVC, PS</strong> (पॉलीस्टाइरीन), <strong>PTFE</strong> (टेफ्लॉन)</td><td><strong>बेकेलाइट</strong>, एपॉक्सी रेजिन</td></tr>
      </table>
      <h3>विरचन व अनुप्रयोग (सरल अभिक्रियाएँ)</h3>
      <ul>
        <li><strong>PVC</strong> (पॉलीविनाइल क्लोराइड): n CH₂=CHCl → —[CH₂—CHCl]ₙ— · पाइप, केबल, फर्श, बोतलें।</li>
        <li><strong>PS</strong> (पॉलीस्टाइरीन): n CH₂=CH–C₆H₅ → पॉलीस्टाइरीन · डिस्पोज़ल कप, पैकेजिंग (थर्मोकोल), रोधन।</li>
        <li><strong>PTFE</strong> (टेफ्लॉन): n CF₂=CF₂ → —[CF₂—CF₂]ₙ— · नॉन-स्टिक लेप, गैस्केट, रोधक (अत्यंत उच्च ऊष्मा/रासायनिक प्रतिरोध)।</li>
        <li><strong>नायलॉन-6:</strong> <strong>कैप्रोलेक्टम</strong> का वलय-खुला बहुलकन · रेशे, रस्सियाँ, टायर डोरी।</li>
        <li><strong>नायलॉन-6,6:</strong> हेक्सामेथिलीनडाइऐमीन + ऐडिपिक अम्ल (संघनन, −H₂O) · वस्त्र, कालीन, मशीन गियर।</li>
        <li><strong>बेकेलाइट:</strong> फीनॉल + फॉर्मेल्डिहाइड (संघनन) · विद्युत स्विच, प्लग, हैंडल (कठोर थर्मोसेट)।</li>
      </ul>
      <h3>रबर व वल्कनीकरण</h3>
      <p><strong>प्राकृतिक रबर</strong> <strong>पॉलीआइसोप्रीन</strong> है — गर्म में नरम चिपचिपा, ठंड में भंगुर, और तेलों से आक्रांत। <strong>वल्कनीकरण</strong> (गुडइयर) रबर को <strong>सल्फर (3–5%)</strong> सहित ~150 °C पर गर्म करता है, जिससे शृंखलाओं के बीच <strong>सल्फर क्रॉस-बंधन</strong> बनते हैं।</p>
      <div class="keybox"><div class="keybox-title">⭐ परीक्षा हेतु मुख्य बिंदु</div>
      <ul>
        <li><strong>वल्कनीकरण के प्रभाव:</strong> तनन सामर्थ्य, प्रत्यास्थता, घर्षण प्रतिरोध बढ़ता है; चिपचिपापन व ताप संवेदनशीलता घटती है; तेलों/विलायकों का प्रतिरोध सुधरता है।</li>
        <li>वल्कनीकृत रबर <strong>टायर, ट्यूब, बेल्ट, होज़</strong> हेतु प्रयुक्त।</li>
        <li><strong>एबोनाइट</strong> = अत्यंत वल्कनीकृत रबर (25–30% S) — कठोर, बैटरी केसों हेतु।</li>
        <li>बहुलकन कोटि = (बहुलक का मोलर द्रव्यमान) / (एकलक का मोलर द्रव्यमान)।</li>
      </ul></div>
    `,diagrams:["polymer"],mcqs:[{q_en:"Bakelite is a:",q_hi:"बेकेलाइट है:",opts_en:["Thermosetting plastic","Thermoplastic","Elastomer","Fibre"],opts_hi:["थर्मोसेटिंग प्लास्टिक","थर्मोप्लास्टिक","इलास्टोमर","रेशा"],ans:0},{q_en:"Vulcanization of rubber uses:",q_hi:"रबर के वल्कनीकरण में प्रयुक्त होता है:",opts_en:["Sulphur","Chlorine","Oxygen","Nitrogen"],opts_hi:["सल्फर","क्लोरीन","ऑक्सीजन","नाइट्रोजन"],ans:0},{q_en:"Nylon-6 is made from:",q_hi:"नायलॉन-6 बनता है:",opts_en:["Caprolactam","Adipic acid only","Phenol","Vinyl chloride"],opts_hi:["कैप्रोलेक्टम से","केवल ऐडिपिक अम्ल से","फीनॉल से","विनाइल क्लोराइड से"],ans:0},{q_en:"PTFE (Teflon) is used for non-stick coatings because of its:",q_hi:"PTFE (टेफ्लॉन) नॉन-स्टिक लेप हेतु प्रयुक्त होता है इसके कारण:",opts_en:["High heat and chemical resistance","Low cost","Colour","Solubility"],opts_hi:["उच्च ऊष्मा व रासायनिक प्रतिरोध","कम लागत","रंग","विलेयता"],ans:0}]}];var Mg=[{id:"u4t1",unit:4,title_en:"Fuels, Combustion & Calorific Value (Dulong's Formula)",title_hi:"ईंधन, दहन एवं ऊष्मीय मान (ड्यूलांग सूत्र)",body_en:`
      <p>A <strong>fuel</strong> is a combustible substance which on burning in air/oxygen gives a large amount of <strong>heat</strong> that can be used economically. <strong>Combustion</strong> is the rapid exothermic oxidation of the fuel: fuel + O₂ → CO₂ + H₂O + heat.</p>
      <h3>Classification of fuels</h3>
      <table class="btable">
        <tr><th>State</th><th>Natural (primary)</th><th>Artificial (secondary)</th></tr>
        <tr><td><strong>Solid</strong></td><td>Wood, coal, peat</td><td>Coke, charcoal, briquettes</td></tr>
        <tr><td><strong>Liquid</strong></td><td>Petroleum (crude oil)</td><td>Petrol, diesel, kerosene, alcohol</td></tr>
        <tr><td><strong>Gaseous</strong></td><td>Natural gas</td><td>LPG, CNG, coal gas, water gas, producer gas, biogas</td></tr>
      </table>
      <h3>Calorific value</h3>
      <ul>
        <li><strong>HCV (Higher / Gross Calorific Value):</strong> total heat released when 1 kg of fuel is burnt completely <strong>and the products are cooled to room temperature</strong> — so the steam formed <strong>condenses</strong> and its latent heat is recovered. Measured by the <strong>bomb calorimeter</strong>.</li>
        <li><strong>LCV (Lower / Net Calorific Value):</strong> HCV <strong>minus the latent heat</strong> of the water vapour formed (which escapes with flue gases in practice).</li>
      </ul>
      <div class="formula-strip"><span class="flabel">Relation</span>LCV = HCV − (0.09 × H × 587) kcal/kg &nbsp;·&nbsp; (H = % hydrogen; 1 g H → 9 g H₂O; latent heat 587 kcal/kg)</div>
      <h3>Dulong's formula</h3>
      <p>Dulong proposed that the HCV of a fuel can be <strong>calculated from its elemental composition</strong> (C, H, O, S percentages), assuming each element burns independently:</p>
      <div class="formula-strip"><span class="flabel">Dulong's formula</span>HCV = (1/100) [ 8080·C + 34500·(H − O/8) + 2240·S ] kcal/kg</div>
      <ul>
        <li>8080, 34500, 2240 = calorific values of C, H, S in kcal/kg.</li>
        <li><strong>(H − O/8)</strong> = "available hydrogen" — the part of hydrogen already combined with oxygen (as moisture) cannot burn.</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ Key Points for Exams</div>
      <ul>
        <li><strong>Characteristics of a good fuel:</strong> high calorific value, low moisture/ash, low smoke, easy transport & storage, economical.</li>
        <li>Gaseous fuels have the <strong>highest calorific efficiency</strong> (easy mixing with air, no ash, clean flame).</li>
        <li>Bomb calorimeter: fuel burnt in <strong>O₂ at ~25 atm</strong>; heat absorbed by a known mass of water; HCV = (W × ΔT)/m.</li>
      </ul></div>
    `,body_hi:`
      <p><strong>ईंधन</strong> एक दहनशील पदार्थ है जो वायु/ऑक्सीजन में जलने पर बड़ी मात्रा में <strong>ऊष्मा</strong> देता है जिसका आर्थिक उपयोग हो सके। <strong>दहन</strong> ईंधन का तीव्र ऊष्माक्षेपी ऑक्सीकरण है: ईंधन + O₂ → CO₂ + H₂O + ऊष्मा।</p>
      <h3>ईंधनों का वर्गीकरण</h3>
      <table class="btable">
        <tr><th>अवस्था</th><th>प्राकृतिक (प्राथमिक)</th><th>कृत्रिम (द्वितीयक)</th></tr>
        <tr><td><strong>ठोस</strong></td><td>लकड़ी, कोयला, पीट</td><td>कोक, चारकोल, ब्रिकेट</td></tr>
        <tr><td><strong>द्रव</strong></td><td>पेट्रोलियम (कच्चा तेल)</td><td>पेट्रोल, डीज़ल, केरोसीन, ऐल्कोहॉल</td></tr>
        <tr><td><strong>गैसीय</strong></td><td>प्राकृतिक गैस</td><td>LPG, CNG, कोल गैस, जल गैस, प्रोड्यूसर गैस, बायोगैस</td></tr>
      </table>
      <h3>ऊष्मीय मान</h3>
      <ul>
        <li><strong>HCV (उच्च / सकल ऊष्मीय मान):</strong> 1 kg ईंधन के पूर्ण दहन पर मुक्त कुल ऊष्मा <strong>जब उत्पादों को कमरे के ताप तक ठंडा</strong> किया जाए — अतः बनी भाप <strong>संघनित</strong> होती है और उसकी गुप्त ऊष्मा पुनः प्राप्त होती है। <strong>बम कैलोरीमीटर</strong> से मापा जाता है।</li>
        <li><strong>LCV (निम्न / शुद्ध ऊष्मीय मान):</strong> HCV <strong>ऋण</strong> बनी जलवाष्प की गुप्त ऊष्मा (जो व्यवहार में धूम गैसों के साथ निकल जाती है)।</li>
      </ul>
      <div class="formula-strip"><span class="flabel">संबंध</span>LCV = HCV − (0.09 × H × 587) kcal/kg &nbsp;·&nbsp; (H = % हाइड्रोजन; 1 g H → 9 g H₂O; गुप्त ऊष्मा 587 kcal/kg)</div>
      <h3>ड्यूलांग सूत्र</h3>
      <p>ड्यूलांग ने प्रस्तावित किया कि ईंधन का HCV उसके <strong>तात्विक संघटन</strong> (C, H, O, S प्रतिशत) से <strong>परिकलित</strong> किया जा सकता है, यह मानते हुए कि प्रत्येक तत्व स्वतंत्र रूप से जलता है:</p>
      <div class="formula-strip"><span class="flabel">ड्यूलांग सूत्र</span>HCV = (1/100) [ 8080·C + 34500·(H − O/8) + 2240·S ] kcal/kg</div>
      <ul>
        <li>8080, 34500, 2240 = kcal/kg में C, H, S के ऊष्मीय मान।</li>
        <li><strong>(H − O/8)</strong> = "उपलब्ध हाइड्रोजन" — ऑक्सीजन से पहले से संयुक्त (नमी के रूप में) हाइड्रोजन जल नहीं सकता।</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ परीक्षा हेतु मुख्य बिंदु</div>
      <ul>
        <li><strong>अच्छे ईंधन के लक्षण:</strong> उच्च ऊष्मीय मान, कम नमी/राख, कम धुआँ, आसान परिवहन व भंडारण, आर्थिक।</li>
        <li>गैसीय ईंधनों की <strong>उच्चतम ऊष्मीय दक्षता</strong> (वायु से आसान मिश्रण, राख नहीं, स्वच्छ ज्वाला)।</li>
        <li>बम कैलोरीमीटर: ईंधन <strong>~25 atm O₂</strong> में जलता है; ज्ञात द्रव्यमान के जल द्वारा ऊष्मा अवशोषित; HCV = (W × ΔT)/m।</li>
      </ul></div>
    `,diagrams:["calorimeter"],formulas_en:["HCV = (1/100)[8080C + 34500(H − O/8) + 2240S] kcal/kg","LCV = HCV − 0.09·H·587","HCV (bomb) = W·ΔT / m"],formulas_hi:["HCV = (1/100)[8080C + 34500(H − O/8) + 2240S] kcal/kg","LCV = HCV − 0.09·H·587","HCV (बम) = W·ΔT / m"],numericals:[{title_en:"HCV by Dulong's formula",title_hi:"ड्यूलांग सूत्र से HCV",given_en:"Coal analysis: C = 80%, H = 5%, O = 8%, S = 1%.",given_hi:"कोयला विश्लेषण: C = 80%, H = 5%, O = 8%, S = 1%।",sol_en:"Available H = H − O/8 = 5 − 8/8 = 4%.<br>HCV = (1/100)[8080×80 + 34500×4 + 2240×1]<br>= (1/100)[646400 + 138000 + 2240] = 786640/100 = <strong>7866.4 kcal/kg</strong>.",sol_hi:"उपलब्ध H = H − O/8 = 5 − 8/8 = 4%।<br>HCV = (1/100)[8080×80 + 34500×4 + 2240×1]<br>= (1/100)[646400 + 138000 + 2240] = 786640/100 = <strong>7866.4 kcal/kg</strong>।",result_en:"HCV = 7866.4 kcal/kg",result_hi:"HCV = 7866.4 kcal/kg"},{title_en:"LCV from HCV",title_hi:"HCV से LCV",given_en:"HCV = 7866.4 kcal/kg, H = 5%.",given_hi:"HCV = 7866.4 kcal/kg, H = 5%।",sol_en:"LCV = HCV − 0.09 × H × 587 = 7866.4 − 0.09×5×587 = 7866.4 − 264.15 = <strong>7602.25 kcal/kg</strong>.",sol_hi:"LCV = HCV − 0.09 × H × 587 = 7866.4 − 0.09×5×587 = 7866.4 − 264.15 = <strong>7602.25 kcal/kg</strong>।",result_en:"LCV = 7602.25 kcal/kg",result_hi:"LCV = 7602.25 kcal/kg"}],mcqs:[{q_en:"Dulong's formula calculates HCV from:",q_hi:"ड्यूलांग सूत्र HCV परिकलित करता है:",opts_en:["Elemental composition (C, H, O, S)","Only moisture","Only ash","Flame colour"],opts_hi:["तात्विक संघटन (C, H, O, S) से","केवल नमी से","केवल राख से","ज्वाला रंग से"],ans:0},{q_en:"LCV is less than HCV because:",q_hi:"LCV, HCV से कम होता है क्योंकि:",opts_en:["Latent heat of steam is lost","Fuel is impure","Ash is formed","CO is formed"],ans:0,opts_hi:["भाप की गुप्त ऊष्मा नष्ट होती है","ईंधन अशुद्ध है","राख बनती है","CO बनती है"]},{q_en:"HCV is measured using:",q_hi:"HCV मापा जाता है:",opts_en:["Bomb calorimeter","Thermometer only","Barometer","pH meter"],opts_hi:["बम कैलोरीमीटर से","केवल थर्मामीटर से","बैरोमीटर से","pH मीटर से"],ans:0},{q_en:"In Dulong's formula, the term (H − O/8) represents:",q_hi:"ड्यूलांग सूत्र में पद (H − O/8) दर्शाता है:",opts_en:["Available (combustible) hydrogen","Total hydrogen","Oxygen content","Moisture"],opts_hi:["उपलब्ध (दहनशील) हाइड्रोजन","कुल हाइड्रोजन","ऑक्सीजन अंश","नमी"],ans:0}]},{id:"u4t2",unit:4,title_en:"Proximate Analysis of Coal; Petrol & Diesel Ratings",title_hi:"कोयले का आसन्न विश्लेषण; पेट्रोल व डीज़ल रेटिंग",body_en:`
      <h3>Proximate analysis of coal (solid fuel)</h3>
      <p><strong>Proximate analysis</strong> determines the practical burning quality of coal by measuring four components (approximate, not elemental):</p>
      <ul>
        <li><strong>1. Moisture:</strong> ~1 g coal heated at 105–110 °C for 1 hour; loss in weight = moisture. High moisture → <strong>lowers calorific value</strong>, wastes heat in evaporation.</li>
        <li><strong>2. Volatile matter:</strong> dried coal heated at 950 °C for 7 minutes in a covered crucible; loss = volatile matter (gases, tar). High VM → <strong>long smoky flame</strong>, easy ignition but lower fixed carbon.</li>
        <li><strong>3. Ash:</strong> residue left after complete combustion. High ash → <strong>lowers calorific value</strong>, causes clinkering and disposal problems.</li>
        <li><strong>4. Fixed carbon:</strong> = 100 − (moisture + VM + ash). Higher fixed carbon → <strong>higher calorific value</strong>; it is the main heat-producing part.</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ Key Points for Exams</div>
      <ul>
        <li>A <strong>good quality coal</strong> has <strong>low moisture, low ash, low volatile matter and high fixed carbon</strong>.</li>
        <li>Ranking by carbon content: <strong>peat &lt; lignite &lt; bituminous &lt; anthracite</strong> (anthracite ~90% C, highest calorific value).</li>
        <li>Proximate ≠ ultimate analysis: ultimate analysis gives <strong>elemental</strong> C, H, N, S, O percentages.</li>
      </ul></div>
      <h3>Petrol and diesel — fuel rating</h3>
      <ul>
        <li><strong>Octane number</strong> (petrol): measures <strong>resistance to knocking</strong> in spark-ignition engines. Defined against a mixture of <strong>iso-octane (100)</strong> and <strong>n-heptane (0)</strong>. Higher octane → smoother combustion. Branched alkanes and aromatics have high octane numbers.</li>
        <li><strong>Cetane number</strong> (diesel): measures <strong>ease of ignition</strong> (ignition delay) in compression-ignition engines. Defined against <strong>cetane (n-hexadecane = 100)</strong> and <strong>α-methylnaphthalene (0)</strong>. Higher cetane → shorter delay, smoother running. Straight-chain alkanes have high cetane numbers.</li>
        <li><strong>Note the contrast:</strong> good petrol has <strong>branched</strong> chains (high octane, low cetane); good diesel has <strong>straight</strong> chains (high cetane, low octane).</li>
      </ul>
      <p><strong>Knocking</strong> is the violent, premature combustion causing a metallic sound and power loss. <strong>Anti-knock agents</strong> (historically TEL — tetraethyl lead, now phased out; today MTBE, ethanol blends) raise octane number.</p>
    `,body_hi:`
      <h3>कोयले का आसन्न विश्लेषण (ठोस ईंधन)</h3>
      <p><strong>आसन्न विश्लेषण</strong> चार घटकों को मापकर कोयले की व्यावहारिक दहन गुणवत्ता निर्धारित करता है (लगभग, तात्विक नहीं):</p>
      <ul>
        <li><strong>1. नमी:</strong> ~1 g कोयला 105–110 °C पर 1 घंटे गर्म; भार हानि = नमी। उच्च नमी → <strong>ऊष्मीय मान घटता</strong> है, वाष्पन में ऊष्मा व्यर्थ होती है।</li>
        <li><strong>2. वाष्पशील पदार्थ:</strong> शुष्क कोयला ढके क्रूसिबल में 950 °C पर 7 मिनट गर्म; हानि = वाष्पशील पदार्थ (गैसें, तार)। उच्च VM → <strong>लंबी धुएँदार ज्वाला</strong>, आसान प्रज्वलन परंतु कम स्थिर कार्बन।</li>
        <li><strong>3. राख:</strong> पूर्ण दहन के बाद बचा अवशेष। उच्च राख → <strong>ऊष्मीय मान घटता</strong> है, क्लिंकरन व निपटान समस्याएँ।</li>
        <li><strong>4. स्थिर कार्बन:</strong> = 100 − (नमी + VM + राख)। उच्च स्थिर कार्बन → <strong>उच्च ऊष्मीय मान</strong>; यही मुख्य ऊष्मा-उत्पादक भाग है।</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ परीक्षा हेतु मुख्य बिंदु</div>
      <ul>
        <li><strong>उत्तम कोटि के कोयले</strong> में <strong>कम नमी, कम राख, कम वाष्पशील पदार्थ व उच्च स्थिर कार्बन</strong> होता है।</li>
        <li>कार्बन अंश से कोटि: <strong>पीट &lt; लिग्नाइट &lt; बिटुमिनस &lt; एन्थ्रासाइट</strong> (एन्थ्रासाइट ~90% C, उच्चतम ऊष्मीय मान)।</li>
        <li>आसन्न ≠ तात्विक विश्लेषण: तात्विक विश्लेषण <strong>तात्विक</strong> C, H, N, S, O प्रतिशत देता है।</li>
      </ul></div>
      <h3>पेट्रोल व डीज़ल — ईंधन रेटिंग</h3>
      <ul>
        <li><strong>ऑक्टेन संख्या</strong> (पेट्रोल): स्फुलिंग-प्रज्वलन इंजनों में <strong>नॉकिंग प्रतिरोध</strong> मापती है। <strong>आइसो-ऑक्टेन (100)</strong> व <strong>n-हेप्टेन (0)</strong> के मिश्रण के सापेक्ष परिभाषित। उच्च ऑक्टेन → सहज दहन। शाखित ऐल्केन व ऐरोमैटिकों की ऑक्टेन संख्या उच्च होती है।</li>
        <li><strong>सीटेन संख्या</strong> (डीज़ल): संपीड़न-प्रज्वलन इंजनों में <strong>प्रज्वलन सुगमता</strong> (प्रज्वलन विलंब) मापती है। <strong>सीटेन (n-हेक्साडेकेन = 100)</strong> व <strong>α-मेथिलनैफ्थलीन (0)</strong> के सापेक्ष परिभाषित। उच्च सीटेन → कम विलंब, सहज संचालन। सीधी-शृंखला ऐल्केनों की सीटेन संख्या उच्च होती है।</li>
        <li><strong>विपर्यास पर ध्यान दें:</strong> अच्छे पेट्रोल में <strong>शाखित</strong> शृंखलाएँ (उच्च ऑक्टेन, निम्न सीटेन); अच्छे डीज़ल में <strong>सीधी</strong> शृंखलाएँ (उच्च सीटेन, निम्न ऑक्टेन)।</li>
      </ul>
      <p><strong>नॉकिंग</strong> प्रचंड, समयपूर्व दहन है जिससे धात्विक ध्वनि व शक्ति हानि होती है। <strong>अपनॉकन कर्मक</strong> (ऐतिहासिक रूप से TEL — टेट्राएथिल लेड, अब बंद; आज MTBE, एथनॉल मिश्रण) ऑक्टेन संख्या बढ़ाते हैं।</p>
    `,diagrams:["fracdist"],mcqs:[{q_en:"Fixed carbon in proximate analysis equals:",q_hi:"आसन्न विश्लेषण में स्थिर कार्बन बराबर है:",opts_en:["100 − (moisture + VM + ash)","Moisture + ash","Only volatile matter","Ash − moisture"],opts_hi:["100 − (नमी + VM + राख)","नमी + राख","केवल वाष्पशील पदार्थ","राख − नमी"],ans:0},{q_en:"Octane number measures:",q_hi:"ऑक्टेन संख्या मापती है:",opts_en:["Resistance to knocking in petrol engines","Ignition delay in diesel","Calorific value","Viscosity"],opts_hi:["पेट्रोल इंजनों में नॉकिंग प्रतिरोध","डीज़ल में प्रज्वलन विलंब","ऊष्मीय मान","श्यानता"],ans:0},{q_en:"Cetane number is defined with reference to:",q_hi:"सीटेन संख्या परिभाषित है संदर्भ में:",opts_en:["n-hexadecane = 100","Iso-octane = 100","n-heptane = 0","Benzene = 100"],opts_hi:["n-हेक्साडेकेन = 100","आइसो-ऑक्टेन = 100","n-हेप्टेन = 0","बेंज़ीन = 100"],ans:0},{q_en:"Highest carbon content is in:",q_hi:"सर्वाधिक कार्बन अंश है:",opts_en:["Anthracite","Peat","Lignite","Wood"],opts_hi:["एन्थ्रासाइट","पीट","लिग्नाइट","लकड़ी"],ans:0}]},{id:"u4t3",unit:4,title_en:"Gaseous Fuels: LPG, CNG, Water Gas, Coal Gas, Producer Gas, Biogas",title_hi:"गैसीय ईंधन: LPG, CNG, जल गैस, कोल गैस, प्रोड्यूसर गैस, बायोगैस",body_en:`
      <p>Gaseous fuels burn cleanly with high efficiency — no ash, easy mixing with air, and precise control of the flame.</p>
      <table class="btable">
        <tr><th>Fuel</th><th>Chemical composition</th><th>Calorific value / Applications</th></tr>
        <tr><td><strong>LPG</strong> (Liquefied Petroleum Gas)</td><td>Propane + butane (liquefied under pressure); foul-smelling <strong>ethyl mercaptan</strong> added for leak detection</td><td>~27,800 kcal/m³; domestic cooking, vehicles</td></tr>
        <tr><td><strong>CNG</strong> (Compressed Natural Gas)</td><td>Methane (~85–90%) + ethane, compressed at ~200 atm</td><td>~12,000 kcal/kg; city buses, cars — cleaner than petrol/diesel</td></tr>
        <tr><td><strong>Water gas</strong> (blue gas)</td><td>CO + H₂ (steam passed over red-hot coke: C + H₂O → CO + H₂)</td><td>~2,800 kcal/m³; industrial fuel, synthesis of methanol</td></tr>
        <tr><td><strong>Coal gas</strong></td><td>H₂ + CH₄ + CO + unsaturated hydrocarbons (destructive distillation of coal)</td><td>~4,900 kcal/m³; town gas for lighting/heating (older use)</td></tr>
        <tr><td><strong>Producer gas</strong></td><td>CO + N₂ (air passed over red-hot coke); N₂ dilutes it</td><td>~1,300 kcal/m³ (lowest); furnace heating, power generation</td></tr>
        <tr><td><strong>Biogas / gobar gas</strong></td><td>CH₄ (55–65%) + CO₂ (anaerobic digestion of cattle dung/organic waste)</td><td>~5,300 kcal/m³; rural cooking, lighting, engines</td></tr>
      </table>
      <div class="keybox"><div class="keybox-title">⭐ Key Points for Exams</div>
      <ul>
        <li><strong>Water gas vs producer gas:</strong> steam over coke → CO + H₂ (water gas); air over coke → CO + N₂ (producer gas). Producer gas has <strong>lower</strong> calorific value because N₂ is non-combustible.</li>
        <li><strong>Carburetted water gas:</strong> water gas enriched with oil vapours to raise its calorific value.</li>
        <li>LPG is stored as a <strong>liquid under pressure</strong>; the smell is from added <strong>mercaptan</strong>, not the gas itself.</li>
        <li>Biogas is <strong>renewable</strong>; its slurry is a good manure.</li>
        <li>CNG vehicles emit <strong>less CO, HC and particulates</strong> than petrol/diesel vehicles.</li>
      </ul></div>
      <h3>Quick comparison of calorific values</h3>
      <p>Producer gas (~1,300) &lt; water gas (~2,800) &lt; coal gas (~4,900) &lt; biogas (~5,300 kcal/m³). LPG has the highest among common domestic fuels.</p>
    `,body_hi:`
      <p>गैसीय ईंधन उच्च दक्षता से स्वच्छ जलते हैं — राख नहीं, वायु से आसान मिश्रण, और ज्वाला का यथार्थ नियंत्रण।</p>
      <table class="btable">
        <tr><th>ईंधन</th><th>रासायनिक संघटन</th><th>ऊष्मीय मान / अनुप्रयोग</th></tr>
        <tr><td><strong>LPG</strong> (द्रवित पेट्रोलियम गैस)</td><td>प्रोपेन + ब्यूटेन (दाब में द्रवित); रिसाव पहचान हेतु दुर्गंधित <strong>एथिल मर्कैप्टन</strong> मिलाया जाता है</td><td>~27,800 kcal/m³; घरेलू रसोई, वाहन</td></tr>
        <tr><td><strong>CNG</strong> (संपीड़ित प्राकृतिक गैस)</td><td>मेथेन (~85–90%) + एथेन, ~200 atm पर संपीड़ित</td><td>~12,000 kcal/kg; शहरी बसें, कारें — पेट्रोल/डीज़ल से स्वच्छ</td></tr>
        <tr><td><strong>जल गैस</strong> (ब्लू गैस)</td><td>CO + H₂ (रक्ततप्त कोक पर भाप: C + H₂O → CO + H₂)</td><td>~2,800 kcal/m³; औद्योगिक ईंधन, मेथेनॉल संश्लेषण</td></tr>
        <tr><td><strong>कोल गैस</strong></td><td>H₂ + CH₄ + CO + असंतृप्त हाइड्रोकार्बन (कोयले का विनाशकारी आसवन)</td><td>~4,900 kcal/m³; प्रकाश/तापन हेतु टाउन गैस (पुराना उपयोग)</td></tr>
        <tr><td><strong>प्रोड्यूसर गैस</strong></td><td>CO + N₂ (रक्ततप्त कोक पर वायु); N₂ इसे तनु करती है</td><td>~1,300 kcal/m³ (न्यूनतम); भट्टी तापन, विद्युत उत्पादन</td></tr>
        <tr><td><strong>बायोगैस / गोबर गैस</strong></td><td>CH₄ (55–65%) + CO₂ (गोबर/कार्बनिक अपशिष्ट का अवायवीय पाचन)</td><td>~5,300 kcal/m³; ग्रामीण रसोई, प्रकाश, इंजन</td></tr>
      </table>
      <div class="keybox"><div class="keybox-title">⭐ परीक्षा हेतु मुख्य बिंदु</div>
      <ul>
        <li><strong>जल गैस बनाम प्रोड्यूसर गैस:</strong> कोक पर भाप → CO + H₂ (जल गैस); कोक पर वायु → CO + N₂ (प्रोड्यूसर गैस)। प्रोड्यूसर गैस का ऊष्मीय मान <strong>कम</strong> क्योंकि N₂ अदहनशील है।</li>
        <li><strong>कार्बुरेटेड जल गैस:</strong> ऊष्मीय मान बढ़ाने हेतु तेल वाष्पों से समृद्ध जल गैस।</li>
        <li>LPG <strong>दाब में द्रव</strong> के रूप में संग्रहित; गंध मिलाए गए <strong>मर्कैप्टन</strong> की है, गैस की स्वयं नहीं।</li>
        <li>बायोगैस <strong>नवीकरणीय</strong> है; इसका स्लरी उत्तम खाद है।</li>
        <li>CNG वाहन पेट्रोल/डीज़ल वाहनों से <strong>कम CO, HC व कण</strong> उत्सर्जित करते हैं।</li>
      </ul></div>
      <h3>ऊष्मीय मानों की त्वरित तुलना</h3>
      <p>प्रोड्यूसर गैस (~1,300) &lt; जल गैस (~2,800) &lt; कोल गैस (~4,900) &lt; बायोगैस (~5,300 kcal/m³)। सामान्य घरेलू ईंधनों में LPG का उच्चतम है।</p>
    `,diagrams:[],mcqs:[{q_en:"Water gas is a mixture of:",q_hi:"जल गैस मिश्रण है:",opts_en:["CO + H₂","CO + N₂","CH₄ + CO₂","C₃H₈ + C₄H₁₀"],opts_hi:["CO + H₂","CO + N₂","CH₄ + CO₂","C₃H₈ + C₄H₁₀"],ans:0},{q_en:"Producer gas has low calorific value because it contains:",q_hi:"प्रोड्यूसर गैस का ऊष्मीय मान कम है क्योंकि इसमें है:",opts_en:["Large amount of non-combustible N₂","Too much H₂","Liquid fuel","Oxygen"],opts_hi:["अदहनशील N₂ की बड़ी मात्रा","अत्यधिक H₂","द्रव ईंधन","ऑक्सीजन"],ans:0},{q_en:"The foul smell in LPG is due to added:",q_hi:"LPG में दुर्गंध मिलाए गए के कारण है:",opts_en:["Ethyl mercaptan","Methane","Butane","CO"],opts_hi:["एथिल मर्कैप्टन","मेथेन","ब्यूटेन","CO"],ans:0},{q_en:"Biogas contains mainly:",q_hi:"बायोगैस में मुख्यतः है:",opts_en:["Methane + CO₂","CO + H₂","Propane + butane","Only CO₂"],opts_hi:["मेथेन + CO₂","CO + H₂","प्रोपेन + ब्यूटेन","केवल CO₂"],ans:0}]},{id:"u4t4",unit:4,title_en:"Lubricants: Functions, Types, Mechanisms & Properties",title_hi:"स्नेहक: कार्य, प्रकार, क्रियाविधि व गुण",body_en:`
      <p>A <strong>lubricant</strong> is a substance introduced between two moving surfaces to <strong>reduce friction, wear and heat</strong>.</p>
      <h3>Functions & characteristics of a good lubricant</h3>
      <ul>
        <li><strong>Functions:</strong> reduce friction & wear, carry away heat, prevent corrosion, seal (e.g. in engines), reduce noise.</li>
        <li><strong>Characteristics:</strong> suitable <strong>viscosity</strong> (neither too thin nor too thick), high <strong>viscosity index</strong>, good <strong>oiliness</strong>, high <strong>flash & fire points</strong>, low <strong>pour point</strong>, chemical stability, low volatility.</li>
      </ul>
      <h3>Classification with examples</h3>
      <table class="btable">
        <tr><th>Type</th><th>Examples</th><th>Uses</th></tr>
        <tr><td><strong>Liquid</strong> (oils)</td><td>Vegetable oils, mineral oils, synthetic oils</td><td>Engines, machinery</td></tr>
        <tr><td><strong>Semi-solid</strong> (greases)</td><td>Grease (oil + thickener like soap)</td><td>Bearings, where oil would leak</td></tr>
        <tr><td><strong>Solid</strong></td><td>Graphite, molybdenum disulphide</td><td>High-temp/pressure, delicate instruments</td></tr>
      </table>
      <h3>Lubrication mechanisms</h3>
      <ul>
        <li><strong>Hydrodynamic (fluid-film) lubrication:</strong> a <strong>thick continuous film</strong> of oil completely separates the surfaces (e.g. high-speed journal bearings). Friction is only within the oil layers — wear is negligible. Requires <strong>adequate viscosity</strong>.</li>
        <li><strong>Boundary lubrication:</strong> the oil film is <strong>squeezed out</strong> under heavy load / low speed; only an <strong>adsorbed monolayer</strong> of polar molecules remains on each surface. Needs lubricants of high <strong>oiliness</strong> (e.g. vegetable oils, fatty-acid additives).</li>
      </ul>
      <h3>Physical properties (only the syllabus list)</h3>
      <ul>
        <li><strong>Viscosity:</strong> resistance to flow; measured by <strong>Redwood/Ostwald viscometer</strong>. Must suit the machine — too low → film breaks; too high → power loss.</li>
        <li><strong>Viscosity index (VI):</strong> rate of change of viscosity with temperature. <strong>High VI</strong> = viscosity stable over temperature — desirable.</li>
        <li><strong>Oiliness:</strong> ability to stick to surfaces under boundary conditions (polar groups help).</li>
        <li><strong>Flash point:</strong> lowest temperature at which oil vapours <strong>ignite momentarily</strong>; <strong>fire point</strong> = temperature of <strong>continuous burning</strong> (~5–40 °C above flash point). High values → safe at high temperatures.</li>
        <li><strong>Cloud point:</strong> temperature at which oil becomes <strong>cloudy</strong> (wax separates); <strong>pour point:</strong> temperature below which oil <strong>stops flowing</strong>. Low pour point needed for cold climates.</li>
      </ul>
      <h3>Chemical properties</h3>
      <ul>
        <li><strong>Acid value / TAN (Total Acid Number):</strong> mg KOH to neutralise acids in 1 g oil — indicates <strong>oxidation/degradation</strong>; high TAN → corrosive.</li>
        <li><strong>Saponification value:</strong> mg KOH to saponify 1 g oil — indicates amount of <strong>fatty (vegetable/animal) oil</strong> present.</li>
        <li><strong>Coke number</strong> (carbon residue): tendency to form <strong>carbon deposits</strong> on heating — low value desirable for engine oils.</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ Key Points for Exams</div>
      <ul>
        <li><strong>Flash point &lt; fire point</strong> always.</li>
        <li>Grease = <strong>oil + thickening agent</strong> (sodium/calcium soap) — used where liquid oil cannot stay.</li>
        <li>High VI, high flash/fire point, low pour point, low coke number = good lubricant.</li>
      </ul></div>
    `,body_hi:`
      <p><strong>स्नेहक</strong> दो गतिशील सतहों के बीच डाला गया पदार्थ है जो <strong>घर्षण, घिसाव व ऊष्मा घटाता</strong> है।</p>
      <h3>अच्छे स्नेहक के कार्य व लक्षण</h3>
      <ul>
        <li><strong>कार्य:</strong> घर्षण व घिसाव घटाना, ऊष्मा हटाना, संक्षारण रोकना, सील करना (जैसे इंजनों में), शोर घटाना।</li>
        <li><strong>लक्षण:</strong> उपयुक्त <strong>श्यानता</strong> (न बहुत पतली न बहुत गाढ़ी), उच्च <strong>श्यानता सूचकांक</strong>, अच्छी <strong>तैलत्व</strong>, उच्च <strong>प्रज्वलन व ज्वलन बिंदु</strong>, निम्न <strong>प्रवहनांक</strong>, रासायनिक स्थायित्व, कम वाष्पशीलता।</li>
      </ul>
      <h3>वर्गीकरण उदाहरण सहित</h3>
      <table class="btable">
        <tr><th>प्रकार</th><th>उदाहरण</th><th>उपयोग</th></tr>
        <tr><td><strong>द्रव</strong> (तेल)</td><td>वनस्पति तेल, खनिज तेल, संश्लिष्ट तेल</td><td>इंजन, मशीनरी</td></tr>
        <tr><td><strong>अर्ध-ठोस</strong> (ग्रीस)</td><td>ग्रीस (तेल + गाढ़क जैसे साबुन)</td><td>बेयरिंग, जहाँ तेल रिस जाए</td></tr>
        <tr><td><strong>ठोस</strong></td><td>ग्रेफाइट, मॉलिब्डेनम डाइसल्फाइड</td><td>उच्च-ताप/दाब, सूक्ष्म उपकरण</td></tr>
      </table>
      <h3>स्नेहन क्रियाविधियाँ</h3>
      <ul>
        <li><strong>द्रवगतिक (तरल-परत) स्नेहन:</strong> तेल की <strong>मोटी सतत परत</strong> सतहों को पूर्णतः पृथक करती है (जैसे उच्च-गति जर्नल बेयरिंग)। घर्षण केवल तेल परतों में — घिसाव नगण्य। <strong>पर्याप्त श्यानता</strong> आवश्यक।</li>
        <li><strong>सीमा स्नेहन:</strong> भारी भार / कम गति में तेल परत <strong>निचुड़</strong> जाती है; प्रत्येक सतह पर ध्रुवीय अणुओं की केवल <strong>अधिशोषित एकल परत</strong> रहती है। उच्च <strong>तैलत्व</strong> वाले स्नेहक चाहिए (जैसे वनस्पति तेल, वसीय-अम्ल योज्य)।</li>
      </ul>
      <h3>भौतिक गुण (केवल पाठ्यक्रम सूची)</h3>
      <ul>
        <li><strong>श्यानता:</strong> प्रवाह का प्रतिरोध; <strong>रेडवुड/ओस्टवाल्ड श्यानतामापी</strong> से मापी जाती है। मशीन के अनुरूप होनी चाहिए — बहुत कम → परत टूटेगी; बहुत अधिक → शक्ति हानि।</li>
        <li><strong>श्यानता सूचकांक (VI):</strong> तापमान के साथ श्यानता परिवर्तन की दर। <strong>उच्च VI</strong> = तापमान पर श्यानता स्थिर — वांछनीय।</li>
        <li><strong>तैलत्व:</strong> सीमा परिस्थितियों में सतहों से चिपकने की क्षमता (ध्रुवीय समूह सहायक)।</li>
        <li><strong>प्रज्वलन बिंदु:</strong> वह न्यूनतम तापमान जिस पर तेल वाष्प <strong>क्षणिक प्रज्वलित</strong> हों; <strong>ज्वलन बिंदु</strong> = <strong>सतत जलने</strong> का तापमान (प्रज्वलन बिंदु से ~5–40 °C ऊपर)। उच्च मान → उच्च तापमान पर सुरक्षित।</li>
        <li><strong>मेघ बिंदु:</strong> वह तापमान जिस पर तेल <strong>धुँधला</strong> हो (मोम पृथक); <strong>प्रवहनांक:</strong> वह तापमान जिसके नीचे तेल <strong>बहना बंद</strong> कर दे। शीत जलवायु हेतु निम्न प्रवहनांक चाहिए।</li>
      </ul>
      <h3>रासायनिक गुण</h3>
      <ul>
        <li><strong>अम्ल मान / TAN (कुल अम्ल संख्या):</strong> 1 g तेल में अम्ल उदासीन करने हेतु mg KOH — <strong>ऑक्सीकरण/अपघटन</strong> दर्शाता है; उच्च TAN → संक्षारक।</li>
        <li><strong>सैपोनीकरण मान:</strong> 1 g तेल के सैपोनीकरण हेतु mg KOH — उपस्थित <strong>वसीय (वनस्पति/जंतु) तेल</strong> की मात्रा दर्शाता है।</li>
        <li><strong>कोक संख्या</strong> (कार्बन अवशेष): गर्म करने पर <strong>कार्बन निक्षेप</strong> बनाने की प्रवृत्ति — इंजन तेलों हेतु निम्न मान वांछनीय।</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ परीक्षा हेतु मुख्य बिंदु</div>
      <ul>
        <li><strong>प्रज्वलन बिंदु &lt; ज्वलन बिंदु</strong> सदैव।</li>
        <li>ग्रीस = <strong>तेल + गाढ़क</strong> (सोडियम/कैल्शियम साबुन) — जहाँ द्रव तेल टिक न सके वहाँ प्रयुक्त।</li>
        <li>उच्च VI, उच्च प्रज्वलन/ज्वलन बिंदु, निम्न प्रवहनांक, निम्न कोक संख्या = अच्छा स्नेहक।</li>
      </ul></div>
    `,diagrams:["lube"],mcqs:[{q_en:"Boundary lubrication requires a lubricant with:",q_hi:"सीमा स्नेहन हेतु स्नेहक चाहिए:",opts_en:["High oiliness","Low viscosity only","High volatility","No additives"],opts_hi:["उच्च तैलत्व","केवल कम श्यानता","उच्च वाष्पशीलता","कोई योज्य नहीं"],ans:0},{q_en:"Flash point is always:",q_hi:"प्रज्वलन बिंदु सदैव होता है:",opts_en:["Lower than fire point","Higher than fire point","Equal to fire point","Unrelated"],opts_hi:["ज्वलन बिंदु से कम","ज्वलन बिंदु से अधिक","ज्वलन बिंदु के बराबर","असंबंधित"],ans:0},{q_en:"Saponification value indicates:",q_hi:"सैपोनीकरण मान दर्शाता है:",opts_en:["Amount of fatty oil present","Water content","Sulphur content","Colour"],opts_hi:["उपस्थित वसीय तेल की मात्रा","जल अंश","सल्फर अंश","रंग"],ans:0},{q_en:"Viscosity index (VI) should ideally be:",q_hi:"श्यानता सूचकांक (VI) आदर्शतः होना चाहिए:",opts_en:["High","Zero","Negative","Very low"],opts_hi:["उच्च","शून्य","ऋणात्मक","बहुत कम"],ans:0},{q_en:"Grease is used instead of oil where:",q_hi:"तेल के बजाय ग्रीस प्रयुक्त होता है जहाँ:",opts_en:["Oil cannot stay in place","Speed is very high","Temperature is low only","Never"],opts_hi:["तेल टिक नहीं सकता","गति अत्यंत उच्च है","केवल तापमान कम है","कभी नहीं"],ans:0}]}];var Tg=[{id:"u5t1",unit:5,title_en:"Redox Reactions, Electrolytes & Faraday's Laws",title_hi:"रेडॉक्स अभिक्रियाएँ, विद्युतअपघट्य व फैराडे के नियम",body_en:`
      <h3>Electronic concept of oxidation, reduction and redox</h3>
      <ul>
        <li><strong>Oxidation</strong> = <strong>loss of electrons</strong> (OIL): Zn → Zn²⁺ + 2e⁻. Also: gain of oxygen / loss of hydrogen.</li>
        <li><strong>Reduction</strong> = <strong>gain of electrons</strong> (RIG): Cu²⁺ + 2e⁻ → Cu. Also: loss of oxygen / gain of hydrogen.</li>
        <li><strong>Redox reaction:</strong> oxidation and reduction occur <strong>simultaneously</strong> — the <strong>reducing agent</strong> (electron donor, itself oxidised) and <strong>oxidising agent</strong> (electron acceptor, itself reduced).</li>
        <li>Example: Zn + CuSO₄ → ZnSO₄ + Cu. Zn is the reducing agent; Cu²⁺ is the oxidising agent.</li>
      </ul>
      <h3>Electrolytes and non-electrolytes</h3>
      <ul>
        <li><strong>Electrolytes</strong> conduct electricity in molten or aqueous state via <strong>ions</strong> and undergo chemical change: <strong>strong</strong> (NaCl, HCl, NaOH — fully ionised) and <strong>weak</strong> (CH₃COOH, NH₄OH — partially ionised).</li>
        <li><strong>Non-electrolytes</strong> do not conduct: sugar, urea, glucose (no ions formed).</li>
        <li>In <strong>electrolysis</strong>, cations move to the <strong>cathode (−)</strong> and are reduced; anions move to the <strong>anode (+)</strong> and are oxidised.</li>
      </ul>
      <h3>Faraday's laws of electrolysis</h3>
      <p><strong>First law:</strong> the mass of substance deposited/liberated at an electrode is <strong>directly proportional to the quantity of electricity</strong> passed: <strong>W = Z·Q = Z·I·t</strong>, where Z = electrochemical equivalent.</p>
      <p><strong>Second law:</strong> when the same quantity of electricity passes through different electrolytes, masses deposited are proportional to their <strong>chemical equivalents</strong>: <strong>W₁/W₂ = E₁/E₂</strong>.</p>
      <div class="formula-strip"><span class="flabel">Combined formula</span>W = (E × I × t) / 96500 &nbsp;·&nbsp; E = atomic mass / valency · 1 Faraday = 96500 C = charge of 1 mol e⁻</div>
      <div class="keybox"><div class="keybox-title">⭐ Key Points for Exams</div>
      <ul>
        <li><strong>Electrochemical equivalent (Z)</strong> = mass deposited by <strong>1 coulomb</strong>; Z = E / 96500.</li>
        <li>96500 C deposits <strong>1 gram-equivalent</strong> of any substance (e.g. 108 g Ag, 31.75 g Cu, 1.008 g H₂).</li>
        <li>Cathode = <strong>reduction</strong> (− in electrolytic cell); anode = <strong>oxidation</strong>.</li>
        <li>Always convert time to <strong>seconds</strong> and current to <strong>amperes</strong>.</li>
      </ul></div>
    `,body_hi:`
      <h3>ऑक्सीकरण, अपचयन व रेडॉक्स की इलेक्ट्रॉनिक संकल्पना</h3>
      <ul>
        <li><strong>ऑक्सीकरण</strong> = <strong>इलेक्ट्रॉनों की हानि</strong>: Zn → Zn²⁺ + 2e⁻। साथ ही: ऑक्सीजन की प्राप्ति / हाइड्रोजन की हानि।</li>
        <li><strong>अपचयन</strong> = <strong>इलेक्ट्रॉनों की प्राप्ति</strong>: Cu²⁺ + 2e⁻ → Cu। साथ ही: ऑक्सीजन की हानि / हाइड्रोजन की प्राप्ति।</li>
        <li><strong>रेडॉक्स अभिक्रिया:</strong> ऑक्सीकरण व अपचयन <strong>एक साथ</strong> होते हैं — <strong>अपचायक</strong> (इलेक्ट्रॉन दाता, स्वयं ऑक्सीकृत) व <strong>ऑक्सीकारक</strong> (इलेक्ट्रॉन ग्राही, स्वयं अपचयित)।</li>
        <li>उदाहरण: Zn + CuSO₄ → ZnSO₄ + Cu। Zn अपचायक है; Cu²⁺ ऑक्सीकारक है।</li>
      </ul>
      <h3>विद्युतअपघट्य व अविद्युतअपघट्य</h3>
      <ul>
        <li><strong>विद्युतअपघट्य</strong> गलित या जलीय अवस्था में <strong>आयनों</strong> द्वारा विद्युत चालन करते हैं और रासायनिक परिवर्तन होता है: <strong>प्रबल</strong> (NaCl, HCl, NaOH — पूर्ण आयनित) व <strong>दुर्बल</strong> (CH₃COOH, NH₄OH — आंशिक आयनित)।</li>
        <li><strong>अविद्युतअपघट्य</strong> चालन नहीं करते: चीनी, यूरिया, ग्लूकोज़ (आयन नहीं बनते)।</li>
        <li><strong>विद्युतअपघटन</strong> में धनायन <strong>कैथोड (−)</strong> पर जाकर अपचयित होते हैं; ऋणायन <strong>ऐनोड (+)</strong> पर जाकर ऑक्सीकृत होते हैं।</li>
      </ul>
      <h3>फैराडे के विद्युतअपघटन नियम</h3>
      <p><strong>प्रथम नियम:</strong> इलेक्ट्रोड पर निक्षेपित/मुक्त पदार्थ का द्रव्यमान प्रवाहित <strong>विद्युत मात्रा के अनुक्रमानुपाती</strong> होता है: <strong>W = Z·Q = Z·I·t</strong>, जहाँ Z = विद्युतरासायनिक तुल्यांक।</p>
      <p><strong>द्वितीय नियम:</strong> जब समान विद्युत मात्रा विभिन्न विद्युतअपघट्यों से गुजरती है, तो निक्षेपित द्रव्यमान उनके <strong>रासायनिक तुल्यांकों के अनुपाती</strong> होते हैं: <strong>W₁/W₂ = E₁/E₂</strong>।</p>
      <div class="formula-strip"><span class="flabel">संयुक्त सूत्र</span>W = (E × I × t) / 96500 &nbsp;·&nbsp; E = परमाणु द्रव्यमान / संयोजकता · 1 फैराडे = 96500 C = 1 mol e⁻ का आवेश</div>
      <div class="keybox"><div class="keybox-title">⭐ परीक्षा हेतु मुख्य बिंदु</div>
      <ul>
        <li><strong>विद्युतरासायनिक तुल्यांक (Z)</strong> = <strong>1 कूलॉम</strong> से निक्षेपित द्रव्यमान; Z = E / 96500।</li>

        <li>कैथोड = <strong>अपचयन</strong> (विद्युतअपघटनी सेल में −); ऐनोड = <strong>ऑक्सीकरण</strong>।</li>
        <li>समय सदैव <strong>सेकंड</strong> में व धारा <strong>ऐम्पियर</strong> में बदलें।</li>

    `,diagrams:[],formulas_en:["W = Z·I·t","W = (E·I·t)/96500","W₁/W₂ = E₁/E₂","Z = E/96500 · 1 F = 96500 C"],formulas_hi:["W = Z·I·t","W = (E·I·t)/96500","W₁/W₂ = E₁/E₂","Z = E/96500 · 1 F = 96500 C"],numericals:[{title_en:"Copper deposited by current",title_hi:"धारा से निक्षेपित ताँबा",given_en:"A current of 2 A passes through CuSO₄ solution for 30 minutes. E(Cu) = 63.5/2 = 31.75.",given_hi:"CuSO₄ विलयन से 30 मिनट तक 2 A धारा प्रवाहित की गई। E(Cu) = 63.5/2 = 31.75।",sol_en:"Q = I·t = 2 × (30×60) = 3600 C.<br>W = (E·I·t)/96500 = (31.75 × 3600)/96500 = <strong>1.184 g</strong> of Cu.",sol_hi:"Q = I·t = 2 × (30×60) = 3600 C।<br>W = (E·I·t)/96500 = (31.75 × 3600)/96500 = Cu का <strong>1.184 g</strong>।",result_en:"W(Cu) = 1.184 g",result_hi:"W(Cu) = 1.184 g"},{title_en:"Time to deposit silver",title_hi:"चाँदी निक्षेपण हेतु समय",given_en:"How long will 3 A take to deposit 10.8 g Ag from AgNO₃? E(Ag) = 108.",given_hi:"AgNO₃ से 10.8 g Ag निक्षेपित करने में 3 A को कितना समय लगेगा? E(Ag) = 108।",sol_en:"W = (E·I·t)/96500 → t = (W × 96500)/(E × I) = (10.8 × 96500)/(108 × 3) = 1042200/324 = <strong>3216.7 s ≈ 53.6 min</strong>.",sol_hi:"W = (E·I·t)/96500 → t = (W × 96500)/(E × I) = (10.8 × 96500)/(108 × 3) = 1042200/324 = <strong>3216.7 s ≈ 53.6 min</strong>।",result_en:"t ≈ 53.6 minutes",result_hi:"t ≈ 53.6 मिनट"},{title_en:"Second law: Ag vs Cu",title_hi:"द्वितीय नियम: Ag बनाम Cu",given_en:"Same current deposits 10.8 g Ag. What mass of Cu deposits from CuSO₄? E(Ag)=108, E(Cu)=31.75.",given_hi:"समान धारा 10.8 g Ag निक्षेपित करती है। CuSO₄ से कितना Cu निक्षेपित होगा? E(Ag)=108, E(Cu)=31.75।",sol_en:"W(Cu)/W(Ag) = E(Cu)/E(Ag) → W(Cu) = 10.8 × 31.75/108 = <strong>3.175 g</strong>.",sol_hi:"W(Cu)/W(Ag) = E(Cu)/E(Ag) → W(Cu) = 10.8 × 31.75/108 = <strong>3.175 g</strong>।",result_en:"W(Cu) = 3.175 g",result_hi:"W(Cu) = 3.175 g"}],mcqs:[{q_en:"Oxidation is:",q_hi:"ऑक्सीकरण है:",opts_en:["Loss of electrons","Gain of electrons","Gain of hydrogen","Loss of oxygen"],opts_hi:["इलेक्ट्रॉनों की हानि","इलेक्ट्रॉनों की प्राप्ति","हाइड्रोजन की प्राप्ति","ऑक्सीजन की हानि"],ans:0},{q_en:"1 Faraday equals:",q_hi:"1 फैराडे बराबर है:",opts_en:["96500 coulombs","1 coulomb","6.023×10²³ coulombs","1 ampere"],opts_hi:["96500 कूलॉम","1 कूलॉम","6.023×10²³ कूलॉम","1 ऐम्पियर"],ans:0},{q_en:"In electrolysis, reduction occurs at the:",q_hi:"विद्युतअपघटन में अपचयन होता है:",opts_en:["Cathode","Anode","Both electrodes","Salt bridge"],opts_hi:["कैथोड पर","ऐनोड पर","दोनों इलेक्ट्रोडों पर","लवण सेतु पर"],ans:0},{q_en:"96500 C deposits 108 g of silver because:",q_hi:"96500 C से 108 g चाँदी निक्षेपित होती है क्योंकि:",opts_en:["Equivalent weight of Ag is 108","Silver is shiny","Current is 1 A","Time is 1 s"],opts_hi:["Ag का तुल्यांकी भार 108 है","चाँदी चमकीली है","धारा 1 A है","समय 1 s है"],ans:0}]},{id:"u5t2",unit:5,title_en:"Industrial Applications of Electrolysis",title_hi:"विद्युतअपघटन के औद्योगिक अनुप्रयोग",body_en:`
      <p>Electrolysis drives three major industries: winning metals from ores, coating objects, and purifying metals.</p>
      <h3>1. Electrometallurgy</h3>
      <p>Extraction of <strong>highly reactive metals</strong> (Na, Mg, Al, Ca) which cannot be reduced by carbon — their oxides are too stable.</p>
      <ul>
        <li><strong>Aluminium:</strong> Hall–Héroult electrolysis of alumina in cryolite (Unit 3).</li>
        <li><strong>Sodium:</strong> <strong>Downs process</strong> — electrolysis of fused NaCl + CaCl₂; Na⁺ + e⁻ → Na (cathode), 2Cl⁻ → Cl₂ + 2e⁻ (anode).</li>
        <li><strong>Magnesium:</strong> electrolysis of fused MgCl₂ (from seawater/brines).</li>
      </ul>
      <h3>2. Electroplating</h3>
      <p>Depositing a thin layer of a superior metal on an object using electrolysis — for <strong>protection</strong> (against corrosion), <strong>decoration</strong> and <strong>repair</strong>.</p>
      <ul>
        <li><strong>Setup:</strong> object to be plated = <strong>cathode</strong>; pure coating metal = <strong>anode</strong>; electrolyte = a <strong>soluble salt of the coating metal</strong>.</li>
        <li><strong>Examples:</strong> <strong>silver plating</strong> (cathode: spoon, anode: Ag, electrolyte: K[Ag(CN)₂]), <strong>nickel/chromium plating</strong> on steel (bathroom fittings, car parts), <strong>gold plating</strong> on jewellery, <strong>zinc plating (galvanization by electrolysis)</strong> on iron.</li>
        <li><strong>Conditions for good plating:</strong> low current density, proper temperature, clean (degreased) surface, optimum time — gives a uniform, adherent, bright deposit.</li>
      </ul>
      <h3>3. Electrolytic refining</h3>
      <p>Purifying crude metals to <strong>99.9%+</strong> purity.</p>
      <ul>
        <li><strong>Setup:</strong> <strong>impure metal = anode</strong>, <strong>pure metal strip = cathode</strong>, electrolyte = soluble salt of the metal.</li>
        <li><strong>Copper refining:</strong> anode: impure Cu, cathode: pure Cu, electrolyte: CuSO₄ + H₂SO₄. Cu²⁺ + 2e⁻ → Cu (cathode). Impurities: <strong>anode mud</strong> (Ag, Au — recovered as valuable by-products) settles below the anode.</li>
        <li>Also used for <strong>Ag, Au, Zn, Ni, Al</strong>.</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ Key Points for Exams</div>
      <ul>
        <li><strong>Memory trick:</strong> in refining, <strong>impure dissolves (anode)</strong>, <strong>pure deposits (cathode)</strong>.</li>
        <li><strong>Anode mud</strong> in Cu refining contains precious <strong>Ag and Au</strong> — a major economic bonus.</li>
        <li>Electroplating thickness is controlled by <strong>Faraday's first law</strong> (W = ZIt) — longer time/more current = thicker coat.</li>
        <li>Galvanization = <strong>zinc coating</strong> on iron (hot-dip or electrolytic) — Unit 5 corrosion prevention.</li>
      </ul></div>
    `,body_hi:`
      <p>विद्युतअपघटन तीन प्रमुख उद्योगों को चलाता है: अयस्कों से धातु प्राप्ति, वस्तुओं पर लेपन, और धातुओं का शोधन।</p>
      <h3>1. विद्युतधातुकर्म</h3>
      <p><strong>अत्यंत अभिक्रियाशील धातुओं</strong> (Na, Mg, Al, Ca) का निष्कर्षण जिन्हें कार्बन से अपचयित नहीं किया जा सकता — उनके ऑक्साइड अत्यंत स्थायी होते हैं।</p>
      <ul>
        <li><strong>एल्युमिनियम:</strong> क्रायोलाइट में ऐलुमिना का हॉल–हेरॉल्ट विद्युतअपघटन (इकाई 3)।</li>
        <li><strong>सोडियम:</strong> <strong>डाउन्स प्रक्रम</strong> — गलित NaCl + CaCl₂ का विद्युतअपघटन; Na⁺ + e⁻ → Na (कैथोड), 2Cl⁻ → Cl₂ + 2e⁻ (ऐनोड)।</li>
        <li><strong>मैग्नीशियम:</strong> गलित MgCl₂ (समुद्रजल/लवणजल से) का विद्युतअपघटन।</li>
      </ul>
      <h3>2. विद्युतलेपन</h3>
      <p>विद्युतअपघटन द्वारा वस्तु पर श्रेष्ठ धातु की पतली परत चढ़ाना — <strong>रक्षा</strong> (संक्षारण से), <strong>सजावट</strong> व <strong>मरम्मत</strong> हेतु।</p>
      <ul>
        <li><strong>व्यवस्था:</strong> लेपित होने वाली वस्तु = <strong>कैथोड</strong>; शुद्ध लेपन धातु = <strong>ऐनोड</strong>; विद्युतअपघट्य = लेपन धातु का <strong>विलेय लवण</strong>।</li>
        <li><strong>उदाहरण:</strong> <strong>चाँदी लेपन</strong> (कैथोड: चम्मच, ऐनोड: Ag, विद्युतअपघट्य: K[Ag(CN)₂]), इस्पात पर <strong>निकेल/क्रोमियम लेपन</strong> (स्नानघर फिटिंग, कार पुर्जे), आभूषणों पर <strong>स्वर्ण लेपन</strong>, लोहे पर <strong>जस्ता लेपन (विद्युतअपघटनी यशदलेपन)</strong>।</li>
        <li><strong>अच्छे लेपन की शर्तें:</strong> निम्न धारा घनत्व, उचित तापमान, स्वच्छ (चिकनाईरहित) सतह, इष्टतम समय — एकसमान, चिपका, चमकीला निक्षेप मिलता है।</li>
      </ul>
      <h3>3. विद्युतअपघटनी परिष्करण</h3>
      <p>अपरिष्कृत धातुओं का <strong>99.9%+</strong> शुद्धता तक शोधन।</p>
      <ul>
        <li><strong>व्यवस्था:</strong> <strong>अशुद्ध धातु = ऐनोड</strong>, <strong>शुद्ध धातु पट्टी = कैथोड</strong>, विद्युतअपघट्य = धातु का विलेय लवण।</li>
        <li><strong>ताँबा परिष्करण:</strong> ऐनोड: अशुद्ध Cu, कैथोड: शुद्ध Cu, विद्युतअपघट्य: CuSO₄ + H₂SO₄। Cu²⁺ + 2e⁻ → Cu (कैथोड)। अशुद्धियाँ: <strong>ऐनोड पंक</strong> (Ag, Au — मूल्यवान उप-उत्पाद के रूप में पुनः प्राप्त) ऐनोड के नीचे बैठता है।</li>
        <li><strong>Ag, Au, Zn, Ni, Al</strong> हेतु भी प्रयुक्त।</li>
      </ul>
      <div class="keybox"><div class="keybox-title">⭐ परीक्षा हेतु मुख्य बिंदु</div>
      <ul>
        <li><strong>स्मरण युक्ति:</strong> परिष्करण में <strong>अशुद्ध घुलती है (ऐनोड)</strong>, <strong>शुद्ध निक्षेपित होती है (कैथोड)</strong>।</li>
        <li>Cu परिष्करण के <strong>ऐनोड पंक</strong> में बहुमूल्य <strong>Ag व Au</strong> होते हैं — एक प्रमुख आर्थिक लाभ।</li>
        <li>विद्युतलेपन की मोटाई <strong>फैराडे के प्रथम नियम</strong> (W = ZIt) से नियंत्रित — अधिक समय/धारा = मोटा लेप।</li>
        <li>यशदलेपन = लोहे पर <strong>जस्ता लेपन</strong> (तप्त-डुबकी या विद्युतअपघटनी) — इकाई 5 संक्षारण निवारण।</li>
      </ul></div>
