<div id="resultPosts">
Loading Posts...
</div>

<script>

fetch("https://sarkariresult.com.cm/wp-json/wp/v2/posts?per_page=10")
.then(response => response.json())
.then(posts => {

let html = "";

posts.forEach(post => {

html += `
<div class="result-card">

<h3>${post.title.rendered}</h3>

<p>
${post.excerpt.rendered}
</p>

<a href="${post.link}" target="_blank">
Check Official Update
</a>

</div>
`;

});

document.getElementById("resultPosts").innerHTML = html;

})
.catch(error=>{
document.getElementById("resultPosts").innerHTML =
"Post load nahi ho paye";
});

</script>
