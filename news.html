<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d6efd">
<meta name="description" content="Diploma Engineers Latest Polytechnic News and Updates">
<title>Diploma Engineers News</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{width:100%;overflow-x:hidden;touch-action:manipulation}
body{width:100%;min-height:100vh;overflow-x:hidden;background:#f4f7fb;color:#172033;font-family:Arial,Helvetica,sans-serif}
button,a{touch-action:manipulation}

.app-top{
 position:sticky;top:0;z-index:50;width:100%;
 background:#fff;border-bottom:1px solid #e8ecf2;
 padding:12px 13px;display:flex;align-items:center;
 justify-content:space-between;gap:10px
}
.app-title{min-width:0}
.app-title h1{font-size:18px;line-height:1.2;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-title h1 i{color:#0d6efd;margin-right:5px}
.app-title p{font-size:10px;color:#7b8492;margin-top:3px}
.home-btn{flex-shrink:0;text-decoration:none;background:#eef5ff;color:#0d6efd;padding:8px 10px;border-radius:9px;font-size:12px;font-weight:700}

.page{width:100%;max-width:720px;margin:auto;padding:12px 10px 25px}
.page-title{padding:4px 3px 12px}
.page-title h2{font-size:22px;margin-bottom:4px}
.page-title p{font-size:12px;color:#6d7684}

.news-list{display:flex;flex-direction:column;gap:12px}

.news-card{
 background:#fff;border:1px solid #e6eaf0;border-radius:15px;
 overflow:hidden;box-shadow:0 2px 9px rgba(24,34,48,.045)
}

.news-image-wrap{position:relative;width:100%;background:#e9eef5;overflow:hidden}
.news-image{
 display:block;width:100%;height:190px;object-fit:cover;
 background:#e9eef5
}
.no-image{height:110px;display:flex;align-items:center;justify-content:center;color:#9aa5b5;font-size:36px}
.category{
 position:absolute;left:10px;top:10px;background:#0d6efd;color:#fff;
 padding:5px 8px;border-radius:7px;font-size:10px;font-weight:800
}
.news-body{padding:13px}
.news-title{font-size:18px;line-height:1.3;font-weight:800;margin-bottom:6px;word-break:break-word}
.news-meta{display:flex;align-items:center;gap:5px;color:#7b8492;font-size:10px;margin-bottom:9px}
.news-description{
 font-size:13px;line-height:1.55;color:#4b5563;
 white-space:pre-wrap;word-break:break-word;
 display:-webkit-box;-webkit-box-orient:vertical;
 -webkit-line-clamp:7;overflow:hidden
}

.actions{
 display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;
 padding-top:11px;border-top:1px solid #edf0f4
}
.action-btn{
 border:0;text-decoration:none;display:inline-flex;align-items:center;
 justify-content:center;gap:5px;padding:8px 10px;border-radius:8px;
 font-size:11px;font-weight:700;cursor:pointer
}
.open-btn{background:#eaf3ff;color:#0d6efd}
.file-btn{background:#fff0f1;color:#dc3545}
.share-btn{background:#eef8f1;color:#198754}
.whatsapp-btn{background:#eaf8ef;color:#168447}

.loading,.empty,.error-box{
 background:#fff;border-radius:14px;padding:30px 15px;text-align:center;
 border:1px solid #e6eaf0;color:#6d7684
}
.loading i{color:#0d6efd;font-size:24px;margin-bottom:9px}
.loading p{font-size:13px}
.skeleton{
 height:280px;border-radius:15px;background:#fff;border:1px solid #e6eaf0;
 overflow:hidden;position:relative
}
.skeleton:after{
 content:"";position:absolute;inset:0;
 background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);
 transform:translateX(-100%);animation:shine 1.1s infinite
}
.skel-img{height:155px;background:#e8edf4}
.skel-line{height:12px;background:#e8edf4;border-radius:5px;margin:15px 14px 0}
.skel-line.short{width:55%;margin-top:9px}
.skel-line.text{width:82%;margin-top:16px}
@keyframes shine{100%{transform:translateX(100%)}}

.empty i,.error-box i{font-size:30px;margin-bottom:9px;color:#9aa5b5}
.error-box{color:#dc3545}

@media(max-width:420px){
 .app-top{padding:11px 10px}
 .app-title h1{font-size:16px}
 .home-btn{padding:7px 9px;font-size:11px}
 .page{padding:10px 8px 22px}
 .news-image{height:175px}
 .news-title{font-size:17px}
 .news-description{font-size:12.5px}
}

/* Prevent accidental zoom-like interaction */
input,textarea,select{font-size:16px}
</style>
</head>

<body>



 <section class="page-title">
  <h2>Latest News</h2>
  <p>Diploma Engineers की सभी Latest Updates</p>
 </section>

 <div id="newsList" class="news-list">
  <div class="skeleton">
   <div class="skel-img"></div>
   <div class="skel-line"></div>
   <div class="skel-line short"></div>
   <div class="skel-line text"></div>
  </div>
  <div class="skeleton">
   <div class="skel-img"></div>
   <div class="skel-line"></div>
   <div class="skel-line short"></div>
  </div>
 </div>

</main>

<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
 getDatabase,
 ref,
 get,
 query,
 limitToLast
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyAbg1Q1ZPgF7mwaxyin7iglla01eDk_tKo",
 authDomain:"diplomaengineers-869df.firebaseapp.com",
 databaseURL:"https://diplomaengineers-869df-default-rtdb.firebaseio.com",
 projectId:"diplomaengineers-869df",
 storageBucket:"diplomaengineers-869df.appspot.com",
 messagingSenderId:"356779436080",
 appId:"1:356779436080:web:4b28da380e547420d0e5f5"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const newsList=document.getElementById("newsList");

/* =====================================================
   HELPERS
===================================================== */

function esc(v){
 return String(v??"")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

function safeUrl(v){
 try{
  const u=new URL(v);
  return u.protocol==="https:"||u.protocol==="http:" ? u.href : "";
 }catch{return ""}
}

/*
 Cloudinary optimization:
 Original uploaded URL is transformed to:
 f_auto = best supported format
 q_auto = automatic quality
 w_800 = mobile-friendly maximum width
*/
function cloudinaryThumb(url){
 const clean=safeUrl(url);
 if(!clean)return "";
 if(!clean.includes("res.cloudinary.com/"))return clean;

 return clean.replace(
   "/upload/",
   "/upload/f_auto,q_auto:good,w_800/"
 );
}

/* =====================================================
   SHARE
===================================================== */

window.shareNews=async function(title,text,url){
 try{
  if(navigator.share){
   await navigator.share({title,text,url});
   return;
  }

  const whatsapp=
   "https://wa.me/?text="+
   encodeURIComponent(title+"\n\n"+text+"\n\n"+url);

  window.open(whatsapp,"_blank","noopener");
 }catch(e){
  if(e.name!=="AbortError"){
   alert("Share is not available on this device.");
  }
 }
};

/* =====================================================
   NEWS CARD
===================================================== */

function createCard(item){

 const n=item.data||{};

 const title=n.title||"Diploma Engineers Update";
 const description=n.text||n.desc||"";
 const category=n.cat||n.category||"News";
 const date=n.date||"";
 const image=cloudinaryThumb(n.thumb||n.image||"");
 const file=safeUrl(n.pdf||n.fileUrl||"");
 const external=safeUrl(n.link||"");
 const linkText=n.linkText||"Read More";

 const currentUrl=
  location.origin+
  location.pathname+
  "?news="+encodeURIComponent(item.id);

 let imageHtml;

 if(image){
  imageHtml=`
   <div class="news-image-wrap">
    <img
     class="news-image"
     src="${esc(image)}"
     alt="${esc(title)}"
     loading="lazy"
     decoding="async"
     width="800"
     height="450"
    >
    <span class="category">${esc(category)}</span>
   </div>`;
 }else{
  imageHtml=`
   <div class="news-image-wrap">
    <div class="no-image">
     <i class="fa-regular fa-newspaper"></i>
    </div>
    <span class="category">${esc(category)}</span>
   </div>`;
 }

 let actions="";

 if(external){
  actions+=`
   <a class="action-btn open-btn"
      href="${esc(external)}"
      target="_blank"
      rel="noopener noreferrer">
    <i class="fa-solid fa-arrow-up-right-from-square"></i>
    ${esc(linkText)}
   </a>`;
 }

 if(file){
  actions+=`
   <a class="action-btn file-btn"
      href="${esc(file)}"
      target="_blank"
      rel="noopener noreferrer">
    <i class="fa-solid fa-file-pdf"></i>
    PDF / File
   </a>`;
 }

 actions+=`
  <button class="action-btn share-btn"
   type="button"
   onclick='shareNews(
    ${JSON.stringify(title)},
    ${JSON.stringify(description)},
    ${JSON.stringify(currentUrl)}
   )'>
   <i class="fa-solid fa-share-nodes"></i>
   Share
  </button>`;

 const waText=title+"\n\n"+description+"\n\n"+currentUrl;

 actions+=`
  <a class="action-btn whatsapp-btn"
   href="https://wa.me/?text=${encodeURIComponent(waText)}"
   target="_blank"
   rel="noopener noreferrer">
   <i class="fa-brands fa-whatsapp"></i>
   WhatsApp
  </a>`;

 const article=document.createElement("article");
 article.className="news-card";

 article.innerHTML=`
  ${imageHtml}
  <div class="news-body">
   <h3 class="news-title">${esc(title)}</h3>
   <div class="news-meta">
    <i class="fa-regular fa-clock"></i>
    ${esc(date)}
   </div>
   <div class="news-description">${esc(description)}</div>
   <div class="actions">${actions}</div>
  </div>
 `;

 return article;
}

/* =====================================================
   FAST ONE-TIME LOAD
   Instead of onValue(), this page reads once.
   Admin changes will appear after page refresh.
===================================================== */

async function loadNews(){

 try{

  /*
   limitToLast(30) avoids downloading an unnecessarily
   huge database when old news grows.
  */
  const newsQuery=query(
   ref(db,"news"),
   limitToLast(30)
  );

  const snapshot=await get(newsQuery);

  if(!snapshot.exists()){
   newsList.innerHTML=`
    <div class="empty">
     <i class="fa-regular fa-newspaper"></i>
     <p>No News Available</p>
    </div>`;
   return;
  }

  const news=[];

  snapshot.forEach(child=>{
   news.push({
    id:child.key,
    data:child.val()||{}
   });
  });

  news.sort((a,b)=>{
   const aTime=Number(a.data.timestamp)||0;
   const bTime=Number(b.data.timestamp)||0;

   if(aTime||bTime)return bTime-aTime;

   return String(b.data.date||"")
    .localeCompare(String(a.data.date||""));
  });

  /*
   Render with DocumentFragment so browser does only
   one DOM update instead of updating for every card.
  */
  const fragment=document.createDocumentFragment();

  news.forEach(item=>{
   fragment.appendChild(createCard(item));
  });

  newsList.innerHTML="";
  newsList.appendChild(fragment);

 }catch(error){

  console.error("News loading error:",error);

  newsList.innerHTML=`
   <div class="error-box">
    <i class="fa-solid fa-triangle-exclamation"></i>
    <p>Firebase Database से News load नहीं हो सकी।</p>
    <small>${esc(error.message)}</small>
   </div>`;
 }
}

/* Start immediately */
loadNews();

</script>

</body>
</html>
