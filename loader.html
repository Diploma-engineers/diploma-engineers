<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diploma Engineers Loader</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html,
body{
width:100%;
height:100%;
overflow:hidden;
background:#ffffff;
}

/* =========================
      MAIN LOADER
========================= */

#loader{

position:fixed;
inset:0;

width:100%;
height:100dvh;

display:flex;
justify-content:center;
align-items:center;

padding:20px;

overflow:hidden;

z-index:999999;

background:
linear-gradient(135deg,#f8fdff,#edf7ff,#dbeeff);

}


/* =========================
      GRID BACKGROUND
========================= */

.tech-grid{

position:absolute;
inset:0;

background-image:

linear-gradient(rgba(0,150,255,.08) 1px,transparent 1px),

linear-gradient(90deg,rgba(0,150,255,.08) 1px,transparent 1px);

background-size:40px 40px;

animation:gridMove 10s linear infinite;

}

@keyframes gridMove{

from{
transform:translateY(0);
}

to{
transform:translateY(40px);
}

}


/* =========================
      GLOW CIRCLES
========================= */

.blur1,
.blur2{

position:absolute;
border-radius:50%;
filter:blur(90px);

}

.blur1{

width:320px;
height:320px;

background:#4fc3ff;

top:-100px;
left:-100px;

opacity:.25;

animation:float1 8s ease-in-out infinite;

}

.blur2{

width:280px;
height:280px;

background:#8b5cf6;

right:-80px;
bottom:-80px;

opacity:.20;

animation:float2 10s ease-in-out infinite;

}

@keyframes float1{

50%{

transform:
translate(60px,40px);

}

}

@keyframes float2{

50%{

transform:
translate(-70px,-40px);

}

}


/* =========================
        CARD
========================= */

.loader-card{

position:relative;

width:min(430px,100%);

padding:38px 28px;

border-radius:30px;

background:rgba(255,255,255,.70);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.9);

box-shadow:

0 20px 60px rgba(0,100,255,.18);

text-align:center;

z-index:5;

}


/* =========================
      LOGO SECTION
========================= */

.logo-box{

position:relative;

width:210px;
height:210px;

margin:auto;

display:flex;
justify-content:center;
align-items:center;

}


/* OUTER RING */

.outer-ring{

position:absolute;

width:100%;
height:100%;

border-radius:50%;

border:4px dashed #00b7ff;

animation:spin 10s linear infinite;

}


/* INNER RING */

.inner-ring{

position:absolute;

width:160px;
height:160px;

border-radius:50%;

border:3px solid transparent;

border-top-color:#ff3cac;
border-bottom-color:#2563eb;

animation:reverseSpin 4s linear infinite;

}


/* GLOW */

.logo-glow{

position:absolute;

width:120px;
height:120px;

background:#00c6ff;

border-radius:50%;

opacity:.25;

animation:pulse 2.5s infinite;

}


/* LOGO */

.logo-box img{

width:100px;
height:100px;

border-radius:50%;

object-fit:cover;

position:relative;

z-index:5;

box-shadow:

0 0 25px #00c6ff,

0 0 55px rgba(0,198,255,.45);

}


/* ANIMATIONS */

@keyframes spin{

100%{

transform:rotate(360deg);

}

}

@keyframes reverseSpin{

100%{

transform:rotate(-360deg);

}

}

@keyframes pulse{

50%{

transform:scale(1.55);

opacity:0;

}

}


/* =========================
       TITLE
========================= */

h1{

margin-top:30px;

font-size:38px;

font-weight:900;

color:#0f172a;

line-height:1.2;

}

h1 span{

color:#00a6ff;

}

.tagline{

margin-top:12px;

font-size:13px;

letter-spacing:4px;

font-weight:600;

color:#64748b;

}

  /* =========================
      STATUS
========================= */

.status{

display:flex;

justify-content:center;

align-items:center;

gap:12px;

margin-top:32px;

color:#475569;

font-size:15px;

font-weight:500;

flex-wrap:wrap;

}

.status-icon{

width:42px;
height:42px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

background:linear-gradient(135deg,#00c6ff,#2563eb);

color:#fff;

font-size:20px;

box-shadow:0 0 20px rgba(0,198,255,.35);

animation:gearSpin 2s linear infinite;

}

@keyframes gearSpin{

100%{
transform:rotate(360deg);
}

}


/* =========================
      PROGRESS BAR
========================= */

.progress{

width:100%;

max-width:300px;

height:10px;

margin:30px auto 14px;

background:#dbe6ef;

border-radius:30px;

overflow:hidden;

position:relative;

}

.progress-bar{

height:100%;

width:0;

border-radius:30px;

background:linear-gradient(
90deg,
#00c6ff,
#2563eb,
#8b5cf6,
#ff3cac
);

background-size:300%;

animation:
loadingBar 4s forwards,
gradientMove 2s linear infinite;

}

@keyframes loadingBar{

100%{
width:100%;
}

}

@keyframes gradientMove{

100%{
background-position:300%;
}

}


/* =========================
      PERCENT
========================= */

.percent{

font-size:14px;

font-weight:600;

color:#64748b;

letter-spacing:.5px;

}


/* =========================
      FLOATING PARTICLES
========================= */

.particle{

position:absolute;

border-radius:50%;

background:rgba(0,180,255,.35);

animation:floatParticle linear infinite;

}

.p1{

width:8px;
height:8px;

left:8%;
bottom:-30px;

animation-duration:7s;

}

.p2{

width:12px;
height:12px;

left:22%;
bottom:-50px;

animation-duration:10s;

}

.p3{

width:10px;
height:10px;

left:40%;
bottom:-40px;

animation-duration:8s;

}

.p4{

width:14px;
height:14px;

left:60%;
bottom:-35px;

animation-duration:11s;

}

.p5{

width:8px;
height:8px;

left:78%;
bottom:-45px;

animation-duration:9s;

}

.p6{

width:10px;
height:10px;

left:92%;
bottom:-30px;

animation-duration:12s;

}

@keyframes floatParticle{

0%{

transform:
translateY(0)
scale(.5);

opacity:0;

}

20%{

opacity:1;

}

100%{

transform:
translateY(-110vh)
scale(1.4);

opacity:0;

}

}


/* =========================
      MOBILE
========================= */

@media(max-width:768px){

.loader-card{

width:100%;

max-width:380px;

padding:30px 22px;

border-radius:24px;

}

.logo-box{

width:180px;
height:180px;

}

.outer-ring{

border-width:3px;

}

.inner-ring{

width:140px;
height:140px;

}

.logo-glow{

width:100px;
height:100px;

}

.logo-box img{

width:85px;
height:85px;

}

h1{

font-size:30px;

}

.tagline{

font-size:11px;

letter-spacing:2px;

}

.status{

font-size:13px;

}

.progress{

max-width:260px;

}

}


/* =========================
      SMALL MOBILE
========================= */

@media(max-width:480px){

#loader{

padding:14px;

}

.loader-card{

padding:24px 18px;

}

.logo-box{

width:150px;
height:150px;

}

.inner-ring{

width:115px;
height:115px;

}

.logo-glow{

width:80px;
height:80px;

}

.logo-box img{

width:72px;
height:72px;

}

h1{

font-size:24px;

}

.tagline{

font-size:10px;

letter-spacing:1px;

}

.status{

font-size:12px;

gap:8px;

}

.status-icon{

width:34px;
height:34px;

font-size:16px;

}

.progress{

height:8px;

max-width:220px;

}

.percent{

font-size:12px;

}

}


/* =========================
      LARGE DESKTOP
========================= */

@media(min-width:1400px){

.loader-card{

max-width:500px;

padding:50px 40px;

}

.logo-box{

width:230px;
height:230px;

}

.logo-box img{

width:110px;
height:110px;

}

h1{

font-size:42px;

}

}


  </head>

<body>

<!-- ===========================
        PREMIUM LOADER
=========================== -->

<div id="loader">

    <!-- Background -->
    <div class="tech-grid"></div>

    <div class="blur1"></div>
    <div class="blur2"></div>

    <!-- Floating Particles -->
    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>
    <div class="particle p6"></div>

    <!-- Card -->
    <div class="loader-card">

        <!-- Logo -->
        <div class="logo-box">

            <div class="outer-ring"></div>

            <div class="inner-ring"></div>

            <div class="logo-glow"></div>

            <img
            src="https://anubhavfinance.wordpress.com/wp-content/uploads/2025/11/whatsapp-image-2025-11-26-at-01.09.43_629f0cdb.jpg"
            alt="Diploma Engineers">

        </div>

        <!-- Title -->
        <h1>
            <span>D</span>iploma Engineers
        </h1>

        <p class="tagline">
            ENGINEERING • LEARNING • SUCCESS
        </p>

        <!-- Status -->
        <div class="status">

            <div class="status-icon">
                ⚙
            </div>

            <div id="statusText">
                Initializing Engineering Workspace...
            </div>

        </div>

        <!-- Progress -->
        <div class="progress">

            <div class="progress-bar"></div>

        </div>

        <!-- Percentage -->
        <div class="percent">

            Loading
            <span id="count">0</span>%

        </div>

    </div>

</div>


<!-- ===========================
      YOUR WEBSITE STARTS HERE
=========================== -->

<!--
Paste your website content below.
Example:

<header>....</header>
<section>....</section>

-->


<script>

/* ==========================
      Loading Counter
========================== */

let value = 0;

const counter = document.getElementById("count");

const status = document.getElementById("statusText");

const messages = [

"Initializing Engineering Workspace...",

"Loading Study Resources...",

"Preparing Notes & PDFs...",

"Connecting Students...",

"Optimizing Experience...",

"Launching Platform..."

];

const timer = setInterval(() => {

value++;

counter.textContent = value;

/* Change status message */

if(value==15)
status.textContent=messages[1];

if(value==35)
status.textContent=messages[2];

if(value==55)
status.textContent=messages[3];

if(value==75)
status.textContent=messages[4];

if(value==90)
status.textContent=messages[5];

if(value>=100){

clearInterval(timer);

}

},40);



/* ==========================
     Hide Loader
========================== */

window.addEventListener("load",()=>{

setTimeout(()=>{

const loader=document.getElementById("loader");

loader.style.transition=".8s";

loader.style.opacity="0";

loader.style.visibility="hidden";

loader.style.pointerEvents="none";

setTimeout(()=>{

loader.remove();

},800);

},4200);

});

</script>

</body>

</html>
