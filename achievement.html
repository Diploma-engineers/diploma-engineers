
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow-x:hidden;
background:linear-gradient(-45deg,#0f172a,#1e3a8a,#2563eb,#06b6d4);
background-size:400% 400%;
animation:bg 12s ease infinite;
}

@keyframes bg{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}

body::before{
content:"";
position:absolute;
width:350px;
height:350px;
background:#ffffff25;
border-radius:50%;
top:-120px;
left:-120px;
filter:blur(70px);
animation:move1 8s infinite ease-in-out;
}

body::after{
content:"";
position:absolute;
width:300px;
height:300px;
background:#60a5fa40;
border-radius:50%;
bottom:-100px;
right:-100px;
filter:blur(70px);
animation:move2 10s infinite ease-in-out;
}

@keyframes move1{

50%{
transform:translateY(40px);
}

}

@keyframes move2{

50%{
transform:translateY(-40px);
}

}

.container{

width:90%;
max-width:1250px;
text-align:center;
position:relative;
z-index:2;

}

.title{

font-size:52px;
font-weight:800;
color:#fff;
margin-bottom:15px;
animation:fadeDown 1s;

}

.subtitle{

font-size:20px;
color:#dbeafe;
margin-bottom:70px;
animation:fadeDown 1.3s;

}

.cards{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:30px;

}

.card{

padding:40px 25px;
border-radius:25px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.25);
box-shadow:0 15px 40px rgba(0,0,0,.25);
transition:.4s;

}

.card:hover{

transform:translateY(-15px) scale(1.05);

}

.icon{

font-size:60px;
margin-bottom:20px;
animation:float 3s infinite ease-in-out;

}

@keyframes float{

50%{
transform:translateY(-12px);
}

}

.counter{

font-size:60px;
font-weight:800;
color:#fff;
margin-bottom:10px;

}

.card h3{

font-size:22px;
color:#e2e8f0;

}

.card p{

margin-top:10px;
font-size:15px;
color:#cbd5e1;

}

@keyframes fadeDown{

from{

opacity:0;
transform:translateY(-40px);

}

to{

opacity:1;
transform:translateY(0);

}

}

@media(max-width:768px){

.title{

font-size:38px;

}

.subtitle{

font-size:17px;

}

.counter{

font-size:48px;

}

}

</style>

</head>

<body>

<div class="container">

<h1 class="title">🏆 Our Achievements</h1>

<p class="subtitle">
Trusted by thousands of Diploma Engineering students across India.
</p>

<div class="cards">

<div class="card">

<div class="icon">🎓</div>

<div class="counter" data-target="2000">0</div>

<h3>Students</h3>

<p>Learning through Diploma Engineers</p>

</div>

<div class="card">

<div class="icon">📚</div>

<div class="counter" data-target="350">0</div>

<h3>Study Notes</h3>

<p>Semester Wise Notes Available</p>

</div>

<div class="card">

<div class="icon">📖</div>

<div class="counter" data-target="50">0</div>

<h3>Books PDF</h3>

<p>Free Engineering Books</p>

</div>

<div class="card">

<div class="icon">📝</div>

<div class="counter" data-target="100">0</div>

<h3>PYQ Papers</h3>

<p>Previous Year Question Papers</p>

</div>

</div>

</div>

<script>

const counters=document.querySelectorAll(".counter");

const speed=150;

const observer=new IntersectionObserver(entries=>{

entries.forEach(entry=>{

if(entry.isIntersecting){

const counter=entry.target;

const target=+counter.dataset.target;

let count=0;

const update=()=>{

const inc=Math.ceil(target/speed);

count+=inc;

if(count<target){

counter.innerHTML=count;

requestAnimationFrame(update);

}else{

counter.innerHTML=target+"+";

}

};

update();

observer.unobserve(counter);

}

});

},{threshold:0.5});

counters.forEach(counter=>observer.observe(counter));

</script>

</body>
</html>
