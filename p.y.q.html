<style>
:root{--primary:#2563eb;--primary2:#1d4ed8;--text:#0f172a;--muted:#64748b;--bg:#f8fafc;--card:#fff;--border:#e2e8f0;--shadow:0 10px 25px -5px rgba(15,23,42,.08),0 8px 10px -6px rgba(15,23,42,.04)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',sans-serif}
body{background:linear-gradient(180deg,#fff,#f8fafc);color:var(--text);min-height:100vh}
.header{max-width:1200px;margin:auto;padding:28px 16px 10px}
.hero{background:linear-gradient(135deg,#eff6ff,#fff);border:1px solid #dbeafe;border-radius:24px;padding:28px 22px;text-align:center;box-shadow:var(--shadow)}
.hero .icon{width:58px;height:58px;margin:0 auto 12px;border-radius:18px;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px;box-shadow:0 10px 24px rgba(37,99,235,.22)}
h1{font-size:clamp(24px,5vw,38px);font-weight:800;letter-spacing:-1px}
.hero p{margin:8px auto 0;color:var(--muted);font-size:13px;max-width:650px;line-height:1.6}
.stats{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:18px}
.stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px 13px;font-size:11px;font-weight:800}
.stat b{color:var(--primary);font-size:15px;margin-right:3px}
.tools{max-width:1200px;margin:14px auto 0;padding:0 16px}
.search{display:flex;gap:8px;padding:7px;background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}
.search input{width:100%;border:0;outline:0;background:#f8fafc;border-radius:11px;padding:12px 13px;font-size:13px}
.search button{border:0;border-radius:11px;background:var(--primary);color:#fff;padding:0 16px;font-weight:800;cursor:pointer}
.filters{display:flex;gap:7px;overflow:auto;padding:10px 1px 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{border:1px solid var(--border);background:#fff;color:var(--muted);border-radius:10px;padding:8px 11px;font-size:10px;font-weight:800;white-space:nowrap;cursor:pointer}
.filter.active,.filter:hover{background:var(--primary);border-color:var(--primary);color:#fff}
.count{max-width:1200px;margin:7px auto 12px;padding:0 16px;color:var(--muted);font-size:11px;font-weight:700}
.list{max-width:1000px;margin:auto;padding:0 16px 50px;display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;justify-content:space-between;background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px;box-shadow:0 5px 16px rgba(15,23,42,.05);transition:.2s}
.item:hover{transform:translateY(-1px);border-color:#bfdbfe;box-shadow:0 10px 22px rgba(37,99,235,.1)}
.info{min-width:0;flex:1}
.title{display:flex;gap:9px;align-items:flex-start;font-size:12px;line-height:1.45;font-weight:800;word-break:break-word}
.title i{color:#dc2626;flex:0 0 18px;margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.meta span{padding:4px 7px;background:#f1f5f9;color:#64748b;border-radius:7px;font-size:8.5px;font-weight:800}
.view{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:78px;padding:9px 10px;border-radius:10px;background:var(--primary);color:#fff;text-decoration:none;font-size:10px;font-weight:800}
.view:hover{background:var(--primary2)}
.empty{display:none;text-align:center;padding:45px 15px;color:var(--muted)}
.empty i{font-size:36px;margin-bottom:10px;color:#94a3b8}
.footer{text-align:center;color:#94a3b8;font-size:10px;padding:0 16px 25px}

<script>

async function loadHeader(){
  const header = document.getElementById("header");
  if(!header) return;
  try{
    const response = await fetch("header.html", {cache:"no-cache"});
    if(!response.ok) throw new Error("header.html not found");
    header.innerHTML = await response.text();
  }catch(error){
    console.error("Header Error:", error);
  }
}

async function loadFooter(){
  const footer = document.getElementById("footer");
  if(!footer) return;
  try{
    const response = await fetch("footer.html", {cache:"no-cache"});
    if(!response.ok) throw new Error("footer.html not found");
    footer.innerHTML = await response.text();
  }catch(error){
    console.error("Footer Error:", error);
  }
}

const list = document.getElementById('list');
const count = document.getElementById('count');
const empty = document.getElementById('empty');
const searchInput = document.getElementById('searchInput');
let activeBranch = 'All';

const branches = ['All', ...new Set(PYQS.map(x => x.branch).filter(Boolean))];
const filters = document.getElementById('filters');
filters.innerHTML = branches.map(b => `<button class="filter ${b==='All'?'active':''}" data-branch="${escapeHtml(b)}">${escapeHtml(b)}</button>`).join('');
filters.querySelectorAll('.filter').forEach(btn => {
  btn.addEventListener('click', () => {
    activeBranch = btn.dataset.branch;
    filters.querySelectorAll('.filter').forEach(x => x.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

function render() {
  const q = searchInput.value.toLowerCase().trim();
  const result = PYQS.filter(x => {
    const branchOk = activeBranch === 'All' || x.branch === activeBranch;
    const hay = `${x.title} ${x.sem} ${x.year} ${x.branch}`.toLowerCase();
    return branchOk && (!q || hay.includes(q));
  });

  count.textContent = `${result.length} PYQ${result.length === 1 ? '' : 's'} available`;
  list.innerHTML = result.map(x => `
    <article class="item">
      <div class="info">
        <div class="title"><i class="fas fa-file-pdf"></i><span>${escapeHtml(x.title)}</span></div>
        <div class="meta">
          <span>${escapeHtml(x.sem)}</span>
          <span>${escapeHtml(x.year)}</span>
          <span>${escapeHtml(x.branch)}</span>
        </div>
      </div>
      <a class="view" href="${escapeHtml(x.href)}" target="_blank" rel="noopener noreferrer">
        <i class="fas fa-eye"></i> VIEW
      </a>
    </article>
  `).join('');
  empty.style.display = result.length ? 'none' : 'block';
}

searchInput.addEventListener('input', render);

document.addEventListener("DOMContentLoaded", async function(){
  await Promise.all([loadHeader(), loadFooter()]);
  render();
});
</script>
